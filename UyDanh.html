<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive: Hệ Thống Uy Danh</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        /* Xóa background đen để không đè video */
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: transparent; font-family: 'Space Grotesk', sans-serif; color: #fff; }

        /* --- VIDEO NỀN BACKGROUND --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0; /* Đưa lên lớp 0 */
        }

        /* --- LỚP PHỦ TỐI GIẢN CHỐNG LÓA MẮT --- */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(10, 15, 25, 0.4) 0%, rgba(5, 8, 14, 0.8) 100%);
            z-index: 1; /* Nằm đè lên video */
            pointer-events: none;
        }

        /* --- KHUNG CHỨA NỘI DUNG CHÍNH --- */
        #content-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            z-index: 10;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- TIÊU ĐỀ TRANG (CHUYỂN SANG MÀU VÀNG GOLD) --- */
        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffd700;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin-bottom: 30px;
        }

        .title-divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.8), transparent);
            margin-bottom: 20px;
        }

        /* --- VÙNG THÔNG SỐ --- */
        .stats-container {
            width: 85%;
            max-width: 400px;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: #d1d1d1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* --- NÚT QUAY LẠI TỐI GIẢN --- */
        .btn-back {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00e5ff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            padding: 10px 35px;
            border-radius: 6px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            z-index: 15; /* Kéo lên trên cùng */
        }

        .btn-back:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN UY DANH CHẠY VÒNG LẶP -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20UY%20DANH.mp4" type="video/mp4">
    </video>

    <!-- LỚP PHỦ TỐI GIẢN -->
    <div class="video-overlay"></div>

    <!-- KHUNG NỘI DUNG CHÍNH -->
    <div id="content-wrapper">
        <div class="page-title">UY DANH</div>
        <div class="title-divider"></div>
        
        <!-- Khu vực hiển thị thông số Danh Vọng -->
        <div class="stats-container">
            <p style="margin-bottom: 10px; color: rgba(255,255,255,0.6); font-family: 'Space Grotesk', sans-serif;">ĐANG TRÍCH XUẤT HỒ SƠ LƯU TRỮ...</p>
            <p style="font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);">DANH VỌNG: 1,250 PTS</p>
        </div>
    </div>

    <!-- NÚT TRỞ VỀ LÕI -->
    <button class="btn-back" onclick="window.location.href='core new_5.html'">[ TRỞ VỀ LÕI ]</button>

    <script>
        // Hãm tốc độ video cho tĩnh lặng
        window.addEventListener('DOMContentLoaded', () => {
            const bgVideo = document.getElementById('bg-video');
            if (bgVideo) {
                bgVideo.playbackRate = 0.5; 
            }
        });
    </script>
</body>
</html>
