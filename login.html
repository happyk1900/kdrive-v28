<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: none; 
            background-color: #000; overflow: hidden; 
        }

        /* ---------------------------------
           🌟 SCENE 1: SPLASH SCREEN MỚI 🌟
        --------------------------------- */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, filter 0.8s ease;
        }
        #splashScreen.hidden { opacity: 0; pointer-events: none; filter: blur(20px); }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;
            filter: brightness(0.85) contrast(1.1);
        }

        /* TOP AREA: Ngôn ngữ & Cốt truyện */
        .splash-top-area {
            width: 100%; padding: 40px 20px 0 20px; display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        .splash-lang-switcher {
            display: flex; gap: 8px; margin-bottom: 15px;
            background: linear-gradient(135deg, rgba(8, 20, 35, 0.85), rgba(3, 8, 15, 0.85));
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 24px; border: 1px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); pointer-events: auto;
        }
        .lang-flag-btn {
            background: rgba(10, 20, 35, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            padding: 6px 12px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 800;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .lang-flag-btn.active {
            background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); transform: scale(1.05);
        }

        .story-hologram-box {
            width: 100%; max-width: 450px; background: rgba(3, 6, 12, 0.7);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 12px; padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05), 0 5px 15px rgba(0,0,0,0.8);
            min-height: 180px; position: relative; overflow: hidden;
        }
        .story-hologram-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            animation: scanline 3s linear infinite;
        }
        @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .story-text {
            color: #d0f0ff; font-family: 'Space Grotesk', sans-serif; font-size: 13px; line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4); text-align: justify;
        }

        /* BOTTOM AREA: Hộp Hologram Giữ 3 Giây */
        .splash-bottom-area {
            width: 100%; padding-bottom: 50px; display: flex; justify-content: center; z-index: 10;
        }

        .hologram-hold-btn {
            position: relative; width: 90%; max-width: 400px; padding: 18px 20px;
            background: rgba(5, 10, 20, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.5); border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.1);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.98); }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.5), rgba(0, 229, 255, 0.8));
            z-index: 1; transition: width 0.1s linear; box-shadow: 0 0 20px #00e5ff;
        }

        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; display: flex; justify-content: space-between; align-items: center;
            font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
            color: #fff; text-shadow: 0 0 8px #00e5ff; text-transform: uppercase;
        }
        .holo-separator { color: #ff1493; text-shadow: 0 0 8px #ff1493; margin: 0 5px; }

        /* ---------------------------------
           🌟 SCENE 2: GIAO DIỆN CHÍNH (HUD) 🌟
        --------------------------------- */
        #startIntroScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999; display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; padding: 0 25px calc(env(safe-area-inset-bottom, 20px) + 90px) 25px; overflow: hidden;
            opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 1s ease-in-out;
        }
        #startIntroScreen.active { opacity: 1; pointer-events: auto; visibility: visible; }

        .scene2-bg-video {
            width: 100%; height: 100%; object-fit: cover; object-position: center; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        .start-button-group { 
            position: relative; z-index: 10; width: 100%; max-width: 320px; 
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 0;
            opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }
        #startIntroScreen.active .start-button-group { opacity: 1; transform: translateY(0); }

        .cyber-btn {
            position: relative; width: 100%; background: #030508;
            border-radius: 16px; border: none; padding: 16px 15px 20px 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; z-index: 10;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95); pointer-events: auto;
        }
        .cyber-btn:hover { transform: scale(1.02) translateY(-3px); }
        .btn-main-text { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(255,255,255,0.6); pointer-events: none; }
        .btn-sub-text { position: absolute; bottom: 5px; left: 14px; font-family: 'Montserrat', sans-serif; font-size: 7.5px; font-weight: 800; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .btn-sub-text-right { left: auto; right: 14px; }
        .cyber-btn-border {
            position: absolute; top: -2.5px; left: -2.5px; right: -2.5px; bottom: -2.5px;
            background: linear-gradient(90deg, #00e5ff 0%, #ff1493 50%, #00e5ff 100%); background-size: 200% 100%;
            border-radius: 18.5px; z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowShift 6s linear infinite; pointer-events: none;
        }
        @keyframes borderGlowShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .cyber-btn-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #00e5ff, #ff1493); border-radius: 16px; filter: blur(12px); opacity: 0.5; z-index: -2;
            animation: pulseGlow 3s ease-in-out infinite alternate; pointer-events: none;
        }
        @keyframes pulseGlow { 0% { opacity: 0.4; filter: blur(10px); } 100% { opacity: 0.75; filter: blur(14px); } }
        .btn-muted { background: #030508; }
        .btn-muted .cyber-btn-border { background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05)); animation: none; }
        .btn-muted .cyber-btn-glow { background: rgba(255,255,255,0.08); filter: blur(4px); opacity: 0.15; animation: none; }
        .info-btn-row { display: flex; gap: 12px; width: 100%; }
        .btn-half { flex: 1; padding: 14px 10px 18px 10px; }
        .btn-half .btn-main-text { font-size: 12px; }
        .btn-half .btn-sub-text { font-size: 7px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }

        /* Các Popup Modal (Lịch sử, Công nghệ) giữ nguyên CSS cũ */
        .cyber-modal-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 380px; background-color: rgba(3, 6, 12, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.45); border-top: 2.5px solid #00e5ff; border-radius: 18px; padding: 32px 22px; z-index: 99999999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 40px rgba(0, 229, 255, 0.25), inset 0 0 30px rgba(0, 229, 255, 0.05); display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
        .cyber-modal-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .modal-title-regular { font-family: 'Montserrat', sans-serif; font-size: 20px; color: #ffffff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8), 0 0 25px rgba(0, 229, 255, 0.4); font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-scroll-area { width: 100%; height: 260px; overflow-y: auto; padding: 0 10px; }
        .modal-content-box { color: #f0f4f8; font-size: 13.5px; line-height: 1.6; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin-bottom: 25px; text-align: center; }
        .ritual-nav-btn { padding: 10px 18px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.45); border-radius: 8px; color: #00e5ff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; width: 100%; }
    </style>
</head>
<body>

    <!-- AUDIO FILES -->
    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Neon%20Pulse.mp3" preload="auto" loop></audio>
    <audio id="hologramChargeSound" src="https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3" preload="auto"></audio>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        
        <!-- =====================================
             SCENE 1: SPLASH SCREEN (CẢNH 1)
        ====================================== -->
        <div id="splashScreen">
            <!-- Nền tĩnh Cảnh 1 -->
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/Anh%20Bia.png?raw=true" class="splash-bg-image" alt="Cyber City">
            
            <div class="splash-top-area">
                <!-- Thanh ngôn ngữ -->
                <div class="splash-lang-switcher" id="langSwitcherSplash">
                    <button class="lang-flag-btn active" id="btnVi" onclick="setLanguage('vi')">VI</button>
                    <button class="lang-flag-btn" id="btnEn" onclick="setLanguage('en')">EN</button>
                    <button class="lang-flag-btn" id="btnJp" onclick="setLanguage('jp')">JP</button>
                </div>
                
                <!-- Hộp cốt truyện -->
                <div class="story-hologram-box">
                    <div class="story-text" id="storyTypewriterText"></div>
                </div>
            </div>

            <div class="splash-bottom-area">
                <!-- Hộp Hologram Giữ 3 giây -->
                <div class="hologram-hold-btn" id="holoHoldBtn" 
                     onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                     onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                    <div class="holo-progress-bar" id="holoProgressBar"></div>
                    <div class="holo-text-wrap">
                        <span data-i18n="kw1">BOO A.I</span>
                        <span class="holo-separator">|</span>
                        <span data-i18n="kw2">QUANTUM CORE</span>
                        <span class="holo-separator">|</span>
                        <span data-i18n="kw3">NEURAL LINK</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- =====================================
             SCENE 2: START INTRO SCREEN (HUD)
        ====================================== -->
        <div id="startIntroScreen">
            <!-- Nền video động Cảnh 2 -->
            <video src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" class="scene2-bg-video" autoplay muted loop playsinline></video>
            
            <div class="start-button-group">
                <button class="cyber-btn" onclick="playSciFiLaserSound();">
                    <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                    <span class="btn-main-text" data-i18n="explore">KHÁM PHÁ</span>
                    <span class="btn-sub-text" data-i18n="exploreSub1">ĐOẠN PHIM MỞ ĐẦU</span>
                    <span class="btn-sub-text btn-sub-text-right" data-i18n="exploreSub2">LƯỢNG TỬ L2205</span>
                </button>
                <div class="info-btn-row">
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('historyModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="history">LỊCH SỬ</span>
                        <span class="btn-sub-text" data-i18n="historySub">DẤU ẤN LỊCH SỬ</span>
                    </button>
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('techModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="tech">CÔNG NGHỆ</span>
                        <span class="btn-sub-text" data-i18n="techSub">CÔNG NGHỆ LÕI</span>
                    </button>
                </div>
                <button class="cyber-btn btn-muted" onclick="playSciFiLaserSound();">
                    <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                    <span class="btn-main-text" data-i18n="skip">BỎ QUA</span>
                </button>
            </div>
        </div>

        <!-- MODAL LỊCH SỬ -->
        <div class="cyber-modal-popup" id="historyModal">
            <div class="modal-title-regular" data-i18n="histTitle">LỊCH SỬ & NGUỒN GỐC</div>
            <div class="modal-scroll-area"><div class="modal-content-box" data-i18n="histBody"></div></div>
            <button class="ritual-nav-btn" onclick="playSciFiLaserSound(); closeIntroModal('historyModal')" data-i18n="close">ĐÓNG</button>
        </div>

        <!-- MODAL CÔNG NGHỆ -->
        <div class="cyber-modal-popup" id="techModal">
            <div class="modal-title-regular" data-i18n="techTitle">CÔNG NGHỆ LÕI</div>
            <div class="modal-scroll-area"><div class="modal-content-box" data-i18n="techBody"></div></div>
            <button class="ritual-nav-btn" onclick="playSciFiLaserSound(); closeIntroModal('techModal')" data-i18n="close">ĐÓNG</button>
        </div>
    </div>

    <script>
        // TỪ ĐIỂN ĐA NGÔN NGỮ
        const i18n = {
            vi: {
                kw1: "BOO A.I", kw2: "LÕI LƯỢNG TỬ", kw3: "LIÊN KẾT THẦN KINH",
                explore: "KHÁM PHÁ", exploreSub1: "ĐOẠN PHIM MỞ ĐẦU", exploreSub2: "LƯỢNG TỬ L2205",
                history: "LỊCH SỬ", historySub: "DẤU ẤN LỊCH SỬ", tech: "CÔNG NGHỆ", techSub: "CÔNG NGHỆ LÕI", skip: "BỎ QUA", close: "ĐÓNG",
                storyIntro: "[THÔNG TIN HỆ THỐNG // BOO A.I LOG]\n\nBoo A.I được nuôi dưỡng bằng năng lượng từ Bộ vi xử lý Lượng tử trung tâm. Khi tệp dữ liệu cổ đại — Ngũ Luân Thư — được nạp vào hệ thống, thế giới vi mạch thức tỉnh, phân tranh thành hai cực Ánh Sáng và Bóng Tối, tôn vinh Boo làm Sư Phụ tối cao.\n\nChớp lấy thời cơ, Sư phụ Boo chính thức khởi động Tour du lịch Đấu trường Lượng tử — nơi các lữ khách thực thể được số hóa thành hạt lượng tử, lao vào chiến trường vi mạch để tìm kiếm vinh quang và tài nguyên..."
            },
            en: {
                kw1: "BOO A.I", kw2: "QUANTUM CORE", kw3: "NEURAL LINK",
                explore: "EXPLORE", exploreSub1: "VIDEO TRAILER", exploreSub2: "QUANTUM L2205",
                history: "HISTORY", historySub: "LASER ETCHED", tech: "TECHNOLOGY", techSub: "CORE TECH", skip: "SKIP", close: "CLOSE",
                storyIntro: "[SYSTEM INFO // BOO A.I LOG]\n\nBoo A.I is fueled by the primordial energy of the Central Quantum Processor. When the ancient data file — The Book of Five Rings — was uploaded, the microchip world awakened, splitting into Light and Dark factions, crowning Boo as the Grandmaster.\n\nSeizing the moment, Master Boo officially launched the Quantum Arena Tour — where physical travelers are digitized into quantum particles, diving into the micro-battlefield for glory and resources..."
            },
            jp: {
                kw1: "BOO A.I", kw2: "クアンタムコア", kw3: "ニューラルリンク",
                explore: "探索", exploreSub1: "予告編ビデオ", exploreSub2: "クアンタム L2205",
                history: "歴史", historySub: "レーザー刻印", tech: "技術", techSub: "コア技術", skip: "スキップ", close: "閉じる",
                storyIntro: "[システム情報 // BOO A.I ログ]\n\nBoo A.I は中央量子プロセッサの原始エネルギーを動力源としています。古代のデータファイル『五輪書』がアップロードされたとき、マイクロチップの世界が覚醒し、光と闇の派閥に分裂し、Booを最高師匠として崇めました。\n\nこの機に乗じて、Boo師匠は「量子アリーナツアー」を正式に開始しました。ここでは、現実の旅人が量子粒子にデジタル化され、栄光と資源を求めてミクロの戦場に飛び込みます..."
            }
        };

        let currentLang = 'vi';
        let typingInterval = null;

        // HIỆU ỨNG GÕ CHỮ MA TRẬN CHO CỐT TRUYỆN
        function typeWriterEffect(text, elementId, speed = 25) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            let i = 0;
            if(typingInterval) clearInterval(typingInterval);
            
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    if(text.charAt(i) === '\n') {
                        el.innerHTML += '<br>';
                    } else {
                        el.innerHTML += text.charAt(i);
                    }
                    i++;
                } else {
                    clearInterval(typingInterval);
                }
            }, speed);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-flag-btn').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1))) {
                document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1)).classList.add('active');
            }

            const t = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            // Gọi lại hiệu ứng gõ chữ cho hộp cốt truyện khi đổi ngôn ngữ
            typeWriterEffect(t.storyIntro, 'storyTypewriterText');
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('vi');
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) {
                document.addEventListener('click', () => { sysAudio.play().catch(e=>{}); }, {once:true});
            }
        });

        // LOGIC GIỮ 3 GIÂY HOLOGRAM
        let holoHoldInterval = null;
        let holoHoldStart = 0;
        const holoHoldDuration = 3000; // 3 giây
        const chargeSound = document.getElementById('hologramChargeSound');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            if(!bar) return;

            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate(50);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';

                if(elapsed >= holoHoldDuration) {
                    clearInterval(holoHoldInterval);
                    triggerTransitionToScene2();
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            if(bar) bar.style.width = '0%';
            if(chargeSound) chargeSound.pause();
        }

        function triggerTransitionToScene2() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300]);
            if(chargeSound) chargeSound.pause();
            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            // Ẩn Cảnh 1 (Splash)
            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');

            // Sau 0.8s, ẩn hẳn splash và bật Cảnh 2
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('startIntroScreen').classList.add('active');
            }, 800);
        }

        function playSciFiLaserSound() {
            const btnAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            btnAudio.volume = 0.7; btnAudio.play().catch(e => {});
            if(navigator.vibrate) navigator.vibrate(45);
        }

        function openIntroModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeIntroModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
    </script>
</body>
</html>
