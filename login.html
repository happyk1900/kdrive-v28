<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">K-Drive: Lõi Lượng Tử</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        /* NỀN ĐĂNG NHẬP MỚI */
        .kdrive-image-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #010204; z-index: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; opacity: 1; }
        
        /* BỐ CỤC NÚT GOOGLE CHÍNH GIỮA TÂM */
        .gateway-container {
            position: relative; width: 90%; max-width: 280px; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* HIỆU ỨNG GLITCH KHI BẤM NÚT */
        .gateway-container.glitching {
            animation: glitchAnim 0.3s infinite alternate;
        }
        @keyframes glitchAnim {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) brightness(1); }
            20% { transform: translate(-4px, 2px) scale(1.05); filter: hue-rotate(90deg) brightness(1.5); }
            40% { transform: translate(4px, -2px) scale(0.95); filter: hue-rotate(180deg) brightness(0.8); }
            60% { transform: translate(-2px, -2px) scale(1.02); filter: hue-rotate(270deg) brightness(1.3); }
            80% { transform: translate(3px, 3px) scale(0.98); filter: hue-rotate(45deg) brightness(1.2); }
            100% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) brightness(1); }
        }

        /* NÚT GMAIL VỚI HIỆU ỨNG NHỊP THỞ */
        .google-auth-btn-img {
            width: 100%; max-width: 240px; height: auto; cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7));
            animation: buttonBreathe 2.2s infinite ease-in-out;
            pointer-events: auto !important;
        }
        .google-auth-btn-img:hover {
            animation: none;
            transform: scale(1.1);
            filter: drop-shadow(0 0 35px #00e5ff);
        }

        @keyframes buttonBreathe {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.5));
            }
            50% {
                transform: scale(1.07);
                filter: drop-shadow(0 0 28px rgba(0, 229, 255, 0.95));
            }
        }

        #loginStatus {
            margin-top: 15px; font-weight: 700; text-align: center; font-size: 11px; color: #00e5ff;
            text-shadow: 0 0 8px rgba(0,229,255,0.6); letter-spacing: 1px;
        }

        /* VIDEO THÀNH CÔNG FULL MÀN HÌNH */
        #successVideo { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            object-fit: cover; z-index: 9999999; display: none; background: #000; 
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="bgMusic" crossorigin="anonymous" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Path%20of%20the%20Ninja.mp3" preload="auto" loop></audio>
    
    <!-- VIDEO GPS FULL -->
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20GPS%20FULL.mp4" playsinline></video>

    <!-- KHUNG GIAO DIỆN CHÍNH -->
    <div class="kdrive-image-wrapper">
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/ANH%20NEN%20GPS%20NEN.png?raw=true" class="kdrive-bg-target" alt="Core Background">
        
        <div class="gateway-container active" id="loginPanelContainer">
            <!-- NÚT GMAIL -->
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/NUT%20GMAIL.png?raw=true" class="google-auth-btn-img" onclick="triggerGoogleOAuth()" alt="Google Login">
            <div id="loginStatus" data-i18n="status_idle"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        let googleTokenClient = null;
        let lastUserEmail = "";

        // BẢNG ÁNH XẠ KÝ HIỆU LƯỢNG TỬ ĐỒNG BỘ VỚI HUD
        const quantumMap = {
            'a': '⟡', 'á': '⟡⁺', 'à': '⟡₋', 'ả': '⟡∼', 'ã': '⟡≈', 'ạ': '⟡•',
            'â': '⌖', 'ấ': '⌖⁺', 'ầ': '⌖₋', 'ẩ': '⌖∼', 'ẫ': '⌖≈', 'ậ': '⌖•',
            'ă': '⍜', 'ắ': '⍜⁺', 'ằ': '⍜₋', 'ẳ': '⍜∼', 'ẵ': '⍜≈', 'ặ': '⍜•',
            'b': '❖', 'c': '⟨', 'd': '⎔', 'đ': '⟠',
            'e': '⟍', 'é': '⟍⁺', 'è': '⟍₋', 'ẻ': '⟍∼', 'ẽ': '⟍≈', 'ẹ': '⟍•',
            'ê': '⍎', 'ế': '⍎⁺', 'ề': '⍎₋', 'ể': '⍎∼', 'ễ': '⍎≈', 'ệ': '⍎•',
            'g': '◎', 'h': '☩', 'i': '║', 'í': '║⁺', 'ì': '║₋', 'ỉ': '║∼', 'ĩ': '║≈', 'ị': '║•',
            'k': '⎈', 'l': '⫷', 'm': '☲', 'n': '☱',
            'o': '⨀', 'ó': '⨀⁺', 'ò': '⨀₋', 'ỏ': '⨀∼', 'õ': '⨀≈', 'ọ': '⨀•',
            'ô': '⍜', 'ố': '⍜⁺', 'ồ': '⍜₋', 'ổ': '⍜∼', 'ỗ': '⍜≈', 'ộ': '⍜•',
            'ơ': '⍥', 'ớ': '⍥⁺', 'ờ': '⍥₋', 'ở': '⍥∼', 'ỡ': '⍥≈', 'ợ': '⍥•',
            'p': '⨁', 'q': '⍟', 'r': 'Ⱬ', 's': '⟡', 't': '⍂',
            'u': '⋃', 'ú': '⋃⁺', 'ù': '⋃₋', 'ủ': '⋃∼', 'ũ': '⋃≈', 'ụ': '⋃•',
            'ư': '⋲', 'ứ': '⋲⁺', 'ừ': '⋲₋', 'ử': '⋲∼', 'ữ': '⋲≈', 'ự': '⋲•',
            'v': '⟁', 'x': '⨂', 'y': '⋫', 'ý': '⋫⁺', 'ỳ': '⋫₋', 'ỷ': '⋫∼', 'ỹ': '⋫≈', 'ỵ': '⋫•',
            '2': '⟡', '6': '⌖', '.': '•', '@': '⌖', '_': '─', '-': '─', ' ': ' '
        };

        function encodeQuantum(text) {
            if (!text) return '';
            return text.split('').map(char => {
                const lower = char.toLowerCase();
                return quantumMap[lower] !== undefined ? quantumMap[lower] : char;
            }).join('');
        }

        const loginTranslations = {
            vi: { page_title: "K-Drive: Lõi Lượng Tử", status_idle: "", connecting: "🛰️ ĐANG KẾT NỐI TÀI KHOẢN GOOGLE...", error: "❌ KHÔNG THỂ KẾT NỐI GOOGLE SDK!", welcome: "⚡ CHÀO MỪNG: " },
            en: { page_title: "K-Drive: Quantum Core", status_idle: "", connecting: "🛰️ CONNECTING GOOGLE ACCOUNT...", error: "❌ GOOGLE SDK CONNECTION ERROR!", welcome: "⚡ WELCOME: " },
            zh: { page_title: "K-Drive: 量子核心", status_idle: "", connecting: "🛰️ 正在连接谷歌账号...", error: "❌ 谷歌连接错误!", welcome: "⚡ 欢迎: " },
            ja: { page_title: "K-Drive: 量子コア", status_idle: "", connecting: "🛰️ Googleアカウントに接続中...", error: "❌ Google接続エラー!", welcome: "⚡ ようこそ: " },
            ko: { page_title: "K-Drive: 양자 코어", status_idle: "", connecting: "🛰️ Google 계정 연결 중...", error: "❌ Google 연결 오류!", welcome: "⚡ 환영합니다: " },
            fr: { page_title: "K-Drive: Noyau Quantique", status_idle: "", connecting: "🛰️ CONNEXION COMPTE GOOGLE...", error: "❌ ERREUR DE CONNEXION GOOGLE!", welcome: "⚡ BIENVENUE: " },
            de: { page_title: "K-Drive: Quantenkern", status_idle: "", connecting: "🛰️ VERBINDE GOOGLE-KONTO...", error: "❌ GOOGLE VERBINDUNGSFEHLER!", welcome: "⚡ WILLKOMMEN: " },
            es: { page_title: "K-Drive: Núcleo Cuántico", status_idle: "", connecting: "🛰️ CONECTANDO CUENTA DE GOOGLE...", error: "❌ ERROR DE CONEXIÓN DE GOOGLE!", welcome: "⚡ BIENVENIDO: " },
            ru: { page_title: "K-Drive: Квантовое ядро", status_idle: "", connecting: "🛰️ ПОДКЛЮЧЕНИЕ АККАУНТА GOOGLE...", error: "❌ ОШИБКА ПОДКЛЮЧЕНИЯ GOOGLE!", welcome: "⚡ ДОБРО ПОЖАЛОВАТЬ: " },
            th: { page_title: "K-Drive: ควอนตัมคอร์", status_idle: "", connecting: "🛰️ กำลังเชื่อมต่อบัญชี GOOGLE...", error: "❌ ข้อผิดพลาดในการเชื่อมต่อ GOOGLE!", welcome: "⚡ ยินดีต้อนรับ: " },
            id: { page_title: "K-Drive: Inti Kuantum", status_idle: "", connecting: "🛰️ MENGHUBUNGKAN AKUN GOOGLE...", error: "❌ KESALAHAN KONEKSI GOOGLE!", welcome: "⚡ SELAMAT DATANG: " },
            ar: { page_title: "K-Drive: النواة الكمومية", status_idle: "", connecting: "🛰️ جاري الاتصال بحساب جوجل...", error: "❌ خطأ في الاتصال بجوجل!", welcome: "⚡ أهلاً بك: " }
        };

        function applyLoginLanguage(lang) {
            const t = loginTranslations[lang] || loginTranslations['vi'];
            const isEncoded = (lang === 'encoded');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerText = isEncoded ? encodeQuantum(t[key]) : t[key];
                }
            });

            // Nếu đang hiển thị trạng thái chào mừng, cập nhật lại ngôn ngữ ngay lập tức
            if (lastUserEmail) {
                const welcomePrefix = isEncoded ? encodeQuantum("⚡ CHÀO MỪNG: ") : (t.welcome || "⚡ CHÀO MỪNG: ");
                document.getElementById('loginStatus').innerText = welcomePrefix + lastUserEmail;
            }
        }

        window.addEventListener('kdriveLangChanged', (e) => {
            applyLoginLanguage(e.detail.lang);
        });

        window.addEventListener('DOMContentLoaded', () => { 
            const currentLang = localStorage.getItem('kdrive_lang') || 'vi';
            applyLoginLanguage(currentLang);
            initGoogleOAuthClient();
            const bgm = document.getElementById('bgMusic');
            if(bgm) { bgm.currentTime = 0; bgm.play().catch(e => {}); }
        });

        function playHologramClick() { try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); snd.volume = 0.5; snd.play().catch(e=>{}); } catch(err) {} }

        function initGoogleOAuthClient() {
            try {
                if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
                    googleTokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: "916035082915-656vp11qf63hmoplvtjfvbci053jti8r.apps.googleusercontent.com",
                        scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
                        callback: (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                fetchUserProfile(tokenResponse.access_token);
                            }
                        }
                    });
                }
            } catch (e) {
                console.error("Google OAuth Client init error:", e);
            }
        }

        function triggerGoogleOAuth() {
            playHologramClick();
            
            const container = document.getElementById('loginPanelContainer');
            container.classList.add('glitching');

            const currentLang = localStorage.getItem('kdrive_lang') || 'vi';
            const t = loginTranslations[currentLang] || loginTranslations['vi'];
            const statusEl = document.getElementById('loginStatus');
            
            statusEl.removeAttribute('data-i18n');
            statusEl.innerText = (currentLang === 'encoded') ? encodeQuantum(t.connecting) : t.connecting;

            try {
                if (googleTokenClient) {
                    googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                } else {
                    initGoogleOAuthClient();
                    if (googleTokenClient) {
                        googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                    } else {
                        throw new Error("SDK not ready");
                    }
                }
            } catch (e) {
                container.classList.remove('glitching');
                statusEl.innerText = (currentLang === 'encoded') ? encodeQuantum(t.error) : t.error;
                statusEl.style.color = "#ff3333";
            }
        }

        function fetchUserProfile(accessToken) {
            const currentLang = localStorage.getItem('kdrive_lang') || 'vi';
            const t = loginTranslations[currentLang] || loginTranslations['vi'];
            const statusEl = document.getElementById('loginStatus');
            statusEl.innerText = (currentLang === 'encoded') ? encodeQuantum("⚡ XÁC THỰC LƯỢNG TỬ...") : "⚡ XÁC THỰC LƯỢNG TỬ...";

            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            })
            .then(response => response.json())
            .then(data => {
                const userEmail = data.email;
                const userName = data.name || userEmail.split('@')[0];
                executeSocialSync(userEmail, userName);
            })
            .catch(error => {
                statusEl.innerText = (currentLang === 'encoded') ? encodeQuantum(t.error) : t.error;
                statusEl.style.color = "#ff3333";
                const container = document.getElementById('loginPanelContainer');
                container.classList.remove('glitching');
            });
        }

        function executeSocialSync(email, username) {
            lastUserEmail = email;
            const currentLang = localStorage.getItem('kdrive_lang') || 'vi';
            const t = loginTranslations[currentLang] || loginTranslations['vi'];
            const statusEl = document.getElementById('loginStatus');
            
            const welcomeText = (currentLang === 'encoded') ? encodeQuantum(t.welcome) : (t.welcome || "⚡ CHÀO MỪNG: ");
            statusEl.innerText = welcomeText + email;
            statusEl.style.color = "#00e5ff";

            const dataForm = new FormData();
            dataForm.append('action', 'register');
            dataForm.append('Username', username);
            dataForm.append('Password', 'oauth_gmail_secure');
            dataForm.append('Email', email);
            dataForm.append('Nickname', username);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                triggerSuccessFlow(username);
            })
            .catch(error => {
                triggerSuccessFlow(username);
            });
        }

        function triggerSuccessFlow(username) {
            try {
                const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500]);
            } catch(e) {}
            
            sessionStorage.setItem('kdrive_session', 'active'); 
            sessionStorage.setItem('kdrive_username', username); 
            
            setTimeout(() => {
                const container = document.getElementById('loginPanelContainer');
                container.classList.remove('glitching');
                container.style.opacity = '0';
                container.style.transform = 'scale(0)';
            }, 600);

            setTimeout(() => {
                const successVid = document.getElementById('successVideo');
                if(successVid) {
                    successVid.style.display = 'block'; 
                    successVid.play().then(() => { 
                        successVid.onended = () => { window.location.href = 'core.html'; };
                    }).catch(err => { window.location.href = 'core.html'; });
                } else { window.location.href = 'core.html'; }
            }, 900);
        }
    </script>
    <script src="boo-player.js"></script>
    <script src="hud-ticker.js"></script>
</body>
</html>
