<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 480px; 
            background-color: #000; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kdrive-image-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid rgba(200, 215, 255, 0.15);
            pointer-events: none; z-index: 99999999;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05);
        }
        
        /* 🌟 SCENE 1: SPLASH SCREEN 🌟 */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: #030508; z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }
        #splashScreen.hidden { opacity: 0; transform: scale(1.5); pointer-events: none; visibility: hidden; }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;
            filter: brightness(0.85) contrast(1.1);
        }

        .splash-top-area {
            width: 100%; padding: 25px 20px 0 20px; display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        .splash-lang-switcher {
            display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(8, 20, 35, 0.95), rgba(3, 8, 15, 0.95));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 6px 12px; border-radius: 24px; border: 2px solid rgba(0, 229, 255, 0.7);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4); pointer-events: auto;
        }

        .lang-flag-btn {
            background: rgba(10, 20, 35, 0.9); border: 1.5px solid rgba(255, 255, 255, 0.25); border-radius: 12px;
            padding: 4px 9px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 900;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.3, 1); text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.6); pointer-events: auto;
        }
        .lang-flag-btn:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.2); transform: translateY(-2px); box-shadow: 0 0 12px rgba(0,229,255,0.5); }
        .lang-flag-btn.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.4), rgba(0, 150, 255, 0.6));
            border-color: #00e5ff; color: #ffffff;
            box-shadow: 0 0 20px #00e5ff, inset 0 0 8px rgba(255,255,255,0.6);
            text-shadow: 0 0 8px #ffffff; transform: scale(1.08);
        }

        /* Hộp hologram cốt truyện 3 phần (Swipe & Dots) - Tăng độ thoáng */
        .story-hologram-box {
            width: 100%; max-width: 420px; background: rgba(3, 6, 12, 0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.5); border-radius: 16px; padding: 20px 22px;
            box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.1), 0 10px 30px rgba(0,0,0,0.9);
            position: relative; overflow: hidden; min-height: 185px; display: flex; flex-direction: column; justify-content: center;
            cursor: grab; pointer-events: auto;
        }
        .story-hologram-box:active { cursor: grabbing; }

        .story-section-title {
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px;
            text-align: center; margin-bottom: 12px; text-transform: uppercase;
            color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            transition: all 0.2s ease;
        }

        .story-text {
            color: #d0f0ff; font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4); text-align: justify;
        }
        .story-text .gold-key { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }
        .story-text .cyan-key { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }

        .story-dots-row {
            display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 12px;
        }
        .story-dot {
            width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.3);
            cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(0, 229, 255, 0.4);
        }
        .story-dot.active {
            background: #00e5ff; width: 22px; border-radius: 6px;
            box-shadow: 0 0 10px #00e5ff;
        }

        .splash-bottom-area {
            width: 100%; padding-bottom: 35px; display: flex; justify-content: center; z-index: 10;
        }

        /* Nút giữ 3 giây thu gọn, hiệu ứng léo sáng điện tử khỏe mạnh */
        .hologram-hold-btn {
            position: relative; width: 80%; max-width: 280px; padding: 15px 20px;
            background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.6); border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.98); }
        
        /* Hiệu ứng điện xẹt mạnh mẽ cho nút bấm và chữ bên trong */
        .hologram-hold-btn.electric-active {
            border-color: #ff0055;
            animation: btnElectricStorm 0.15s infinite alternate;
        }
        .hologram-hold-btn.electric-active .holo-text-wrap {
            animation: textElectricFlash 0.15s infinite alternate;
        }
        @keyframes btnElectricStorm {
            0% { box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff; transform: translate(-2px, 1px) scale(1.02); filter: brightness(1.2); }
            50% { box-shadow: 0 0 35px #ff0055, inset 0 0 20px #ff0055; transform: translate(2px, -2px) scale(1.04); filter: brightness(1.5); }
            100% { box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff; transform: translate(-1px, -1px) scale(1.03); filter: brightness(1.3); }
        }
        @keyframes textElectricFlash {
            0% { color: #00e5ff; text-shadow: 0 0 15px #00e5ff, 0 0 25px #fff; transform: skewX(-5deg); }
            100% { color: #ff0055; text-shadow: 0 0 15px #ff0055, 0 0 25px #fff; transform: skewX(5deg); }
        }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), rgba(0, 229, 255, 0.75));
            z-index: 1; transition: width 0.05s linear; box-shadow: 0 0 20px #00e5ff;
        }

        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 900; letter-spacing: 2px;
            color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.8); text-transform: uppercase;
            transition: all 0.1s ease;
        }

        /* 🌟 SCENE 2: HUD SẢNH CHÍNH (Hộp cao ráo, dày dặn, đẩy cao tránh widget nhạc) 🌟 */
        #startIntroScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            z-index: 999999; display: flex; justify-content: center; align-items: center;
            overflow: hidden; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.8s ease-in-out;
        }
        #startIntroScreen.active { opacity: 1; pointer-events: auto; visibility: visible; }

        .scene2-bg-video {
            width: 100%; height: 100%; height: 100dvh; object-fit: cover; object-position: center; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        .start-button-group { 
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 20px) + 95px); left: 50%; transform: translateX(-50%) translateY(30px);
            z-index: 10; width: calc(100% - 40px); max-width: 340px; 
            display: flex; flex-direction: column; gap: 12px;
            opacity: 0; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }
        #startIntroScreen.active .start-button-group { opacity: 1; transform: translateX(-50%) translateY(0); }

        .cyber-btn {
            position: relative; width: 100%; 
            background: rgba(4, 8, 16, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 16px; border: none; padding: 18px 15px 20px 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; z-index: 10;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1), background 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 229, 255, 0.12);
            overflow: hidden; pointer-events: auto;
        }
        .cyber-btn:hover { transform: scale(1.02) translateY(-2px); background: rgba(8, 14, 26, 0.9); }
        .btn-main-text { font-family: 'Montserrat', sans-serif; font-size: 13.5px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(0,229,255,0.7); pointer-events: none; }
        .btn-sub-text { position: absolute; bottom: 4px; left: 16px; font-family: 'Montserrat', sans-serif; font-size: 7px; font-weight: 800; color: rgba(255, 255, 255, 0.75); letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .btn-sub-text-right { left: auto; right: 16px; }
        
        .cyber-btn-border {
            position: absolute; top: -1.5px; left: -1.5px; right: -1.5px; bottom: -1.5px;
            background: linear-gradient(90deg, #00e5ff 0%, #ff1493 50%, #00e5ff 100%); background-size: 200% 100%;
            border-radius: 17.5px; z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowShift 6s linear infinite; pointer-events: none;
        }
        @keyframes borderGlowShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        .cyber-btn-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #00e5ff, #ff1493); border-radius: 16px; filter: blur(12px); opacity: 0.35; z-index: -2;
            pointer-events: none;
        }

        .btn-muted { background: rgba(4, 8, 16, 0.72); pointer-events: auto; }
        .btn-muted .cyber-btn-border { background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.08)); animation: none; }
        .btn-muted .cyber-btn-glow { background: rgba(255,255,255,0.06); filter: blur(5px); opacity: 0.12; }

        .info-btn-row { display: flex; gap: 12px; width: 100%; pointer-events: auto; }
        .btn-half { flex: 1; padding: 15px 10px 18px 10px; pointer-events: auto; }
        .btn-half .btn-main-text { font-size: 11.5px; }
        .btn-half .btn-sub-text { font-size: 6.5px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }

        #storyBackBtn {
            position: absolute; bottom: 30px; left: 25px; z-index: 99999999;
            background: rgba(3, 6, 12, 0.85); backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 229, 255, 0.7); border-radius: 50%;
            width: 50px; height: 50px; display: none; align-items: center; justify-content: center;
            color: #00e5ff; font-size: 22px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); transition: all 0.3s ease; pointer-events: auto;
        }

        .cyber-modal-popup {
            position: absolute; top: 50%; left: 50%; width: 92%; max-width: 380px;
            background-color: rgba(3, 6, 12, 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.45); border-top: 2.5px solid #00e5ff; border-radius: 18px;
            padding: 32px 22px; z-index: 99999999; opacity: 0; transform: translate(-50%, -40%) scale(0.95);
            pointer-events: none; visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 40px rgba(0, 229, 255, 0.25);
            display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;
        }
        .cyber-modal-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .modal-title-regular { font-family: 'Montserrat', sans-serif; font-size: 20px; color: #ffffff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-scroll-area { width: 100%; height: 260px; overflow-y: auto; padding: 0 10px; scrollbar-width: thin; scrollbar-color: rgba(0, 229, 255, 0.4) transparent; }
        .modal-content-box { min-height: 90px; color: #f0f4f8; font-size: 13.5px; line-height: 1.6; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin-bottom: 25px; width: 100%; text-align: center; }
        .modal-content-box p { margin-bottom: 12px; text-align: justify; }
        .modal-content-box h3 { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 12.5px; letter-spacing: 1.5px; margin: 15px 0 8px 0; text-transform: uppercase; text-align: left; width: 100%; font-weight: 800; }
        .tech-badge-glow { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }
        .gold-badge-glow { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }

        .ritual-nav-btn {
            padding: 10px 18px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.45); border-radius: 8px; color: #00e5ff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-transform: uppercase; pointer-events: auto; width: 100%;
        }
        .ritual-nav-btn:hover { background: rgba(0,229,255,0.35); box-shadow: 0 0 18px rgba(0,229,255,0.6); color: #fff; }

        /* 🌟 ẢNH NỀN CỔNG TORII (SCENE 3) 🌟 */
        .kdrive-bg-target { 
            width: 100%; height: 100%; height: 100dvh; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; 
            z-index: 1; opacity: 0; visibility: hidden; transition: opacity 0.8s ease-in-out;
        }
        .kdrive-bg-target.active { opacity: 1; visibility: visible; }

        .gateway-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; background: rgba(8, 12, 20, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(200, 205, 220, 0.45); border-radius: 16px; overflow: hidden; padding: 2px; z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.6s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 0 40px rgba(180, 190, 210, 0.25); }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .gateway-content { position: relative; z-index: 10; width: 100%; height: 100%; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .gateway-content h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(255, 255, 255, 0.8); text-transform: uppercase; border-bottom: 1px solid rgba(200, 205, 220, 0.3); padding-bottom: 10px; width: 100%; text-align: center; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: #03060a; border: 1px solid rgba(200, 205, 220, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; letter-spacing: 2px; font-size: 11px; text-transform: uppercase; box-shadow: inset 0 3px 6px rgba(0,0,0,0.9); pointer-events: auto; }
        .login-input::placeholder { color: rgba(255, 255, 255, 0.45); font-weight: 500; }
        .login-btn-submit { padding: 13px 20px; background: linear-gradient(180deg, #141b26 0%, #030508 100%); color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 3px; border: 1px solid rgba(210, 215, 230, 0.6); border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; margin-top: 10px; text-transform: uppercase; pointer-events: auto; }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(220, 220, 230, 0.7); pointer-events: auto; }
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .remember-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 10px; color: rgba(255,255,255,0.8); text-transform: uppercase; font-weight: 700; pointer-events: auto; }
        .remember-checkbox { appearance: none; width: 13px; height: 13px; border: 1px solid rgba(200, 205, 220, 0.6); border-radius: 3px; background: #03060a; cursor: pointer; position: relative; pointer-events: auto; }
        .remember-checkbox:checked::after { content: '✔'; position: absolute; top: -3px; left: 1px; color: #ffffff; font-size: 9px; }
        .change-pass-link { font-size: 10px; color: rgba(255,255,255,0.8); cursor: pointer; text-transform: uppercase; font-weight: 700; pointer-events: auto; }
        .bottom-links { margin-top: 25px; text-align: center; width: 100%; border-top: 1px solid rgba(200, 205, 220, 0.25); padding-top: 15px; display: flex; justify-content: space-around;}
        .sub-link { color: rgba(255,255,255,0.9); font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: 700; pointer-events: auto; }

        #storyVideoContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #000; z-index: 9999998; display: none; justify-content: center; align-items: center; }
        #storyVideoContainer video { width: 100%; height: 100%; height: 100dvh; object-fit: cover; }
        
        #videoSubtitleBox {
            position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #ffffff; background: rgba(3, 5, 10, 0.65); backdrop-filter: blur(6px); padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(0,229,255,0.4); z-index: 99999999; opacity: 0; transition: opacity 0.3s ease-in-out; text-transform: uppercase; pointer-events: none;
        }

        @keyframes blink { 0%, 100% { border-color: transparent; } 50% { border-color: #00e5ff; } }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <!-- Âm thanh khởi đầu chỉ bật khi ấn giữ 3 giây hoặc bấm khám phá/bỏ qua -->
    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Neon%20Pulse.mp3" preload="auto" loop></audio>
    <audio id="bgMusic" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai_Ripe_Online.mp4" preload="auto" loop></audio>

    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; object-fit: cover; z-index: 999999; display: none;" playsinline></video>

    <!-- ================= SCENE 1 ================= -->
    <div id="splashScreen">
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/Anh%20Bia.png?raw=true" class="splash-bg-image" alt="Cyber City">
        
        <div class="splash-top-area">
            <!-- Thanh chuyển ngữ đầy đủ (VI, EN, JP, ZH, ES, HI) -->
            <div class="splash-lang-switcher" id="langSwitcherSplash">
                <button class="lang-flag-btn active" id="btnVi" onclick="setLanguage('vi')">VI</button>
                <button class="lang-flag-btn" id="btnEn" onclick="setLanguage('en')">EN</button>
                <button class="lang-flag-btn" id="btnJp" onclick="setLanguage('jp')">JP</button>
                <button class="lang-flag-btn" id="btnZh" onclick="setLanguage('zh')">ZH</button>
                <button class="lang-flag-btn" id="btnEs" onclick="setLanguage('es')">ES</button>
                <button class="lang-flag-btn" id="btnHi" onclick="setLanguage('hi')">HI</button>
            </div>
            
            <!-- Hộp cốt truyện 3 phần với giọng văn mới sắc sảo và thực tế -->
            <div class="story-hologram-box" id="storyHologramBox">

            const t = i18n[currentLang].story;
            if(!t || !t[index]) return;
            currentStoryIndex = index;

            const titleEl = document.getElementById('storySectionTitle');
            const textEl = document.getElementById('storyContentText');
            const dots = document.querySelectorAll('.story-dot');

            titleEl.classList.add('electric-shock');
            const shockAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');

            shockAudio.play().catch(e=>{});

            setTimeout(() => {
                titleEl.innerText = t[index].title;
                titleEl.classList.remove('electric-shock');
                textEl.innerHTML = t[index].text;

                dots.forEach((dot, idx) => {
                    if(idx === index) dot.classList.add('active');
                    else dot.classList.remove('active');
                });
            }, 200);
        }

        function goToStoryPart(index) {
            renderStoryPart(index);

        // Hỗ trợ lướt tay (Swipe) qua lại giữa các phần cốt truyện
        let touchStartX = 0;
        let touchEndX = 0;

        const storyBox = document.getElementById('storyHologramBox');
        if(storyBox) {
            storyBox.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            storyBox.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 40) {
                    currentStoryIndex = (currentStoryIndex + 1) % 3;
                    renderStoryPart(currentStoryIndex);
                } else if (touchEndX > touchStartX + 40) {
                    currentStoryIndex = (currentStoryIndex - 1 + 3) % 3;
                    renderStoryPart(currentStoryIndex);
                }
            }, {passive: true});
        }

            const t = i18n[lang];

                if (t[key]) {
                    if (key === 'histBody' || key === 'techBody') el.innerHTML = t[key];

            renderStoryPart(currentStoryIndex);
            startHoloKeywordRotation(currentKeywords);

            keywordInterval = setInterval(() => {
                index = (index + 1) % keywords.length;
                kwEl.style.opacity = '0';
                setTimeout(() => {
                    kwEl.innerText = keywords[index];
                    kwEl.style.opacity = '1';
                }, 200);
            }, 2500);
            kwEl.style.transition = 'opacity 0.2s ease-in-out';
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('vi');
        });

        let holoHoldInterval = null;
        let holoHoldStart = 0;
        const holoHoldDuration = 3000;
        const chargeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(!bar) return;

            holdBtn.classList.add('electric-active');
            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate([50, 30, 50, 30]);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';

                if(elapsed >= holoHoldDuration) {
                    clearInterval(holoHoldInterval);
                    triggerTransitionToScene2();
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(bar) bar.style.width = '0%';
            if(holdBtn) holdBtn.classList.remove('electric-active');
            if(chargeSound) chargeSound.pause();
        }

        function triggerTransitionToScene2() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);
            if(chargeSound) chargeSound.pause();
            
            // Bật nhạc khởi đầu hệ thống chính thức khi hoàn thành giữ 3 giây
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) { sysAudio.play().catch(e=>{}); }

            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');

            setTimeout(() => {
                splash.style.display = 'none';
                const introScreen = document.getElementById('startIntroScreen');
                if(introScreen) introScreen.classList.add('active');
            }, 800);
        }

        function playSciFiLaserSound() {
            const btnAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            btnAudio.volume = 0.7; btnAudio.play().catch(e => {});
            if(navigator.vibrate) navigator.vibrate(45);
        }

        function openIntroModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeIntroModal(modalId) { document.getElementById(modalId).classList.remove('active'); }

        function stopSysAudio() {
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) { sysAudio.pause(); sysAudio.currentTime = 0; }
        }

        const storyVid = document.getElementById('storyVideo');
        const subBoxEl = document.getElementById('videoSubtitleBox');

        function playStoryVideo() {
            stopSysAudio();
            document.getElementById('langSwitcherSplash').classList.add('hidden');
            document.getElementById('startIntroScreen').classList.remove('active');
            document.getElementById('startIntroScreen').style.display = 'none';
            document.getElementById('storyVideoContainer').style.display = 'flex';
            document.getElementById('storyBackBtn').style.display = 'flex';
            if(storyVid) { storyVid.currentTime = 0; storyVid.play().catch(e => {}); }
        }

        function returnToHomeFromStory() {
            if(storyVid) { storyVid.pause(); storyVid.currentTime = 0; }
            document.getElementById('storyVideoContainer').style.display = 'none';
            document.getElementById('storyBackBtn').style.display = 'none';
            if(subBoxEl) subBoxEl.style.opacity = '0';
            document.getElementById('startIntroScreen').style.display = 'flex';
            document.getElementById('startIntroScreen').classList.add('active');
        }

        function skipIntroScreen() {
            stopSysAudio();
            document.getElementById('langSwitcherSplash').classList.add('hidden');
            document.getElementById('startIntroScreen').classList.remove('active');
            document.getElementById('startIntroScreen').style.display = 'none';
            triggerToriiAndLoginTransition();
        }

        if(storyVid) {
            storyVid.onended = () => {
                document.getElementById('storyVideoContainer').style.display = 'none';
                document.getElementById('storyBackBtn').style.display = 'none';
                if(subBoxEl) subBoxEl.style.opacity = '0';
                triggerToriiAndLoginTransition();
            };
        }

        function triggerToriiAndLoginTransition() {
            const bgTarget = document.getElementById('bg-login');
            if(bgTarget) bgTarget.classList.add('active');

            const bgm = document.getElementById('bgMusic');
            if(bgm) bgm.play().catch(e => {});
            
            setTimeout(() => {
                const loginPanel = document.getElementById('loginPanelContainer');
                if(loginPanel) loginPanel.classList.add('active');
            }, 800); 
        }

        function switchPanel(panelName) { 
            document.getElementById('panel-login').style.display = 'none'; 
            if(document.getElementById('panel-' + panelName)) { document.getElementById('panel-' + panelName).style.display = 'flex'; }
        }

        function togglePass(inputId, iconEl) { 
            let inp = document.getElementById(inputId); 
            if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = '🙈'; } else { inp.type = 'password'; iconEl.innerHTML = '👁'; } 
        }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');

            if(acc === "" || code === "") { statusEl.innerHTML = "❌ VUI LÒNG ĐIỀN ĐỦ THÔNG TIN!"; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = "🛰️ BOO ĐANG KIỂM CHỨNG..."; statusEl.style.color = "#ffffff";
            
            const dataForm = new FormData();
            dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                    sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]);
                    
                    statusEl.innerHTML = "✅ THÀNH CÔNG!"; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    
                    const bgMusic = document.getElementById('bgMusic');
                    if(bgMusic) bgMusic.pause();
                    setTimeout(() => { 
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().catch(err => { window.location.href = 'INTRO.html'; });
                                successVid.onended = () => { window.location.href = 'INTRO.html'; };
                            } else {
                                window.location.href = 'INTRO.html';
                            }
                        }, 500);
                    }, 1000); 
                } else {
                    statusEl.innerHTML = "❌ SAI THÔNG TIN!"; statusEl.style.color = "#ff3333";
                }
            })
            .catch(error => { statusEl.innerHTML = "❌ KẾT NỐI BỊ PHONG TỎA!"; statusEl.style.color = "#ff3333"; });
        }
    </script>
    <script src="boo-player.js"></script>
    <script src="hud-ticker.js"></script>
</body>
</html>
