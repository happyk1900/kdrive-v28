<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: none; 
            background-color: #000; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kdrive-image-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid rgba(200, 215, 255, 0.15);
            pointer-events: none; z-index: 99999999;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05);
        }

        /* 🌟 KHUNG HUD VIỄN TƯỞNG XUYÊN SUỐT 🌟 */
        .cyber-hud-container {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 9999999; pointer-events: none;
            font-family: 'Share Tech Mono', monospace; color: #00e5ff;
            text-shadow: 0 0 8px rgba(0,229,255,0.6);
        }
        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
        .hud-right { align-items: flex-end; text-align: right; }
        .hud-line { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px; }
        .hud-gps { font-size: 8.5px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
        .signal-bars { display: flex; gap: 2px; align-items: flex-end; height: 10px; margin-right: 5px; }
        .bar { width: 3px; background: #00e5ff; animation: signalPulse 1.5s infinite; }
        .bar:nth-child(1) { height: 4px; animation-delay: 0s; }
        .bar:nth-child(2) { height: 7px; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 10px; animation-delay: 0.4s; }
        .bar:nth-child(4) { height: 7px; animation-delay: 0.6s; opacity: 0.3; }
        @keyframes signalPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 8px #00e5ff; } }
        
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #030508; z-index: 999999999; display: flex; justify-content: center; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }
        #splashScreen.hidden { opacity: 0; transform: scale(1.5); pointer-events: none; visibility: hidden; }

        .splash-fire-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255, 69, 0, 0.35) 0%, rgba(20, 5, 2, 0.9) 70%, #030508 100%);
            z-index: 1;
        }

        .splash-grid-bg {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(255,69,0,0.15) 1.5px, transparent 1.5px),
                              linear-gradient(90deg, rgba(255,69,0,0.15) 1.5px, transparent 1.5px);
            background-size: 50px 50px; 
            transform: perspective(600px) rotateX(65deg);
            animation: gridMove 4s linear infinite;
            opacity: 0.85; pointer-events: none; z-index: 2;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        .orb-container {
            position: relative; width: 330px; height: 330px; display: flex; justify-content: center; align-items: center; cursor: pointer;
            transform-style: preserve-3d; z-index: 10;
        }

        .energy-orb {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, rgba(40,10,5,0.95) 0%, rgba(10,3,2,0.98) 80%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 25px; text-align: center;
            box-shadow: inset 0 0 50px rgba(255, 69, 0, 0.4), 0 0 30px rgba(255, 69, 0, 0.3);
            border: 2.5px solid rgba(255, 69, 0, 0.7);
            animation: fireOrbPulse 2.5s ease-in-out infinite alternate;
            overflow: hidden;
        }

        .energy-orb::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.3) 0%, transparent 70%);
            animation: fireGlowEffect 1.5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes fireOrbPulse {
            0% { border-color: rgba(255, 69, 0, 0.5); box-shadow: 0 0 20px rgba(255, 69, 0, 0.3), inset 0 0 30px rgba(255, 69, 0, 0.2); }
            50% { border-color: rgba(255, 140, 0, 1); box-shadow: 0 0 65px rgba(255, 69, 0, 0.8), inset 0 0 50px rgba(255, 140, 0, 0.5); }
            100% { border-color: rgba(255, 69, 0, 0.5); box-shadow: 0 0 20px rgba(255, 69, 0, 0.3), inset 0 0 30px rgba(255, 69, 0, 0.2); }
        }

        @keyframes fireGlowEffect {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .energy-orb.shaking { animation: orbShake 0.08s ease-in-out infinite alternate !important; }
        @keyframes orbShake {
            0% { transform: translate(0, 0) scale(1.02); }
            100% { transform: translate(-5px, 5px) scale(1.06); }
        }

        .energy-progress-ring {
            position: absolute; top: -6px; left: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
            border-radius: 50%; pointer-events: none; z-index: 10;
            background: conic-gradient(from 0deg, #ff4500 0%, #ff8c00 50%, #ff4500 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
            opacity: 0; transition: opacity 0.3s ease;
        }
        .energy-progress-ring.active { opacity: 1; animation: rotateRing 0.8s linear infinite; }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .orb-content-tilt {
            position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d; will-change: transform; pointer-events: none;
            transition: transform 0.08s ease-out;
        }

        .orb-title {
            font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 900; font-style: normal;
            color: #ffffff; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.95), 0 0 30px rgba(255, 140, 0, 0.8), 0 2px 4px rgba(0,0,0,0.9);
            margin-bottom: 22px; line-height: 1.1; text-align: center;
            transition: transform 0.05s steps(2, start), filter 0.05s ease;
        }
        
        .orb-title.glitch-shock {
            animation: glitchShockAnim 0.25s cubic-bezier(0.11, 0, 0.5, 1) forwards;
        }

        @keyframes glitchShockAnim {
            0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0px #fff); color: #fff; }
            20% { transform: scale(1.18) translate(-6px, 4px) skewX(-15deg); filter: drop-shadow(0 0 25px #00ffff) invert(0.8); color: #00ffff; }
            40% { transform: scale(0.92) translate(8px, -5px) skewX(20deg); filter: drop-shadow(0 0 25px #ff0055); color: #ff0055; }
            60% { transform: scale(1.1) translate(-4px, -2px) skewX(-10deg); filter: drop-shadow(0 0 20px #ffff00); color: #ffff00; }
            80% { transform: scale(1.02) translate(3px, 2px); filter: drop-shadow(0 0 10px #ff4500); color: #fff; }
            100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 15px rgba(255,69,0,0.95)); color: #fff; }
        }

        .orb-action-btn {
            padding: 10px 24px; background: rgba(255, 69, 0, 0.15);
            border: 1.5px solid rgba(255, 140, 0, 0.7); border-radius: 20px;
            color: #ffaa00; font-family: 'Montserrat', sans-serif; font-size: 11px;
            font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.4);
        }

        .intro-bg-video {
            width: 100%; height: 100%; object-fit: cover; object-position: center; 
            position: absolute; top: 0; left: 0; z-index: 1;
            filter: brightness(1.1) contrast(1.05);
        }

        .kdrive-bg-target { 
            width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; 
            filter: brightness(1.1) contrast(1.05);
            z-index: 1; opacity: 1;
        }

        .top-shadow-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 35%; background: linear-gradient(to bottom, rgba(3, 5, 8, 0.5) 0%, rgba(3, 5, 8, 0.1) 40%, transparent 100%); z-index: 11; pointer-events: none; }

        #bottom-mist {
            position: absolute; bottom: 0; left: -15%; width: 130%; height: 26%;
            background: radial-gradient(ellipse at 50% 100%, rgba(200, 245, 255, 0.4) 0%, rgba(100, 200, 225, 0.2) 50%, transparent 100%);
            z-index: 10; pointer-events: none; filter: blur(10px);
        }

        .splash-lang-switcher {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 99999999; pointer-events: auto;
            background: linear-gradient(135deg, rgba(8, 20, 35, 0.95), rgba(3, 8, 15, 0.95));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px; border-radius: 24px; border: 2px solid rgba(0, 229, 255, 0.7);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.15);
            transition: opacity 0.5s ease;
        }
        .splash-lang-switcher.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        .lang-flag-btn {
            background: rgba(10, 20, 35, 0.9); border: 1.5px solid rgba(255, 255, 255, 0.25); border-radius: 12px;
            padding: 6px 14px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.3, 1); text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.6); pointer-events: auto;
        }
        .lang-flag-btn:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.2); transform: translateY(-2px); box-shadow: 0 0 12px rgba(0,229,255,0.5); }
        .lang-flag-btn.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.4), rgba(0, 150, 255, 0.6));
            border-color: #00e5ff; color: #ffffff;
            box-shadow: 0 0 20px #00e5ff, inset 0 0 8px rgba(255,255,255,0.6);
            text-shadow: 0 0 8px #ffffff; transform: scale(1.08);
        }

        #startIntroScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999; display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; padding: 0 25px calc(env(safe-area-inset-bottom, 20px) + 90px) 25px; overflow: hidden;
            opacity: 1; transition: opacity 0.8s ease-in-out;
        }
        #startIntroScreen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        .start-button-group { 
            position: relative; z-index: 10; width: 100%; max-width: 320px; 
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 0;
            animation: groupFlyInSlowMotion 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: auto;
        }

        @keyframes groupFlyInSlowMotion {
            0% { transform: translateY(150px); opacity: 0; }
            100% { transform: translateY(0px); opacity: 1; }
        }

        .cyber-btn {
            position: relative; width: 100%; 
            background: #030508;
            border-radius: 16px; border: none; padding: 16px 15px 20px 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; z-index: 10;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1), background 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95);
            overflow: hidden;
            pointer-events: auto;
        }
        
        .cyber-btn:hover { transform: scale(1.02) translateY(-3px); background: #070b14; }
        
        .btn-main-text { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(255,255,255,0.6); pointer-events: none; }
        
        /* 🌟 ĐÃ ĐỒNG BỘ FONT MONTSERRAT DÀY, SẮC NÉT CHO CHỮ NHỎ BÊN DƯỚI NÚT 🌟 */
        .btn-sub-text { position: absolute; bottom: 5px; left: 14px; font-family: 'Montserrat', sans-serif; font-size: 7.5px; font-weight: 800; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .btn-sub-text-right { left: auto; right: 14px; }

        .cyber-btn-border {
            position: absolute; top: -2.5px; left: -2.5px; right: -2.5px; bottom: -2.5px;
            background: linear-gradient(90deg, #00e5ff 0%, #ff1493 50%, #00e5ff 100%);
            background-size: 200% 100%;
            border-radius: 18.5px; z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowShift 6s linear infinite;
            pointer-events: none;
        }

        @keyframes borderGlowShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .cyber-btn-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #00e5ff, #ff1493); border-radius: 16px; filter: blur(12px); opacity: 0.5; z-index: -2;
            animation: pulseGlow 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; filter: blur(10px); }
            100% { opacity: 0.75; filter: blur(14px); }
        }

        .cyber-btn::after {
            content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
            border-radius: 13.5px; pointer-events: none; z-index: 2;
            border: 0.75px solid rgba(0, 229, 255, 0.5);
        }

        .btn-muted { background: #030508; pointer-events: auto; }
        .btn-muted .cyber-btn-border { background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05)); animation: none; }
        .btn-muted .cyber-btn-glow { background: rgba(255,255,255,0.08); filter: blur(4px); opacity: 0.15; animation: none; }
        .btn-muted::after { border-color: rgba(255, 255, 255, 0.2); }
        .btn-muted .btn-main-text { color: rgba(255,255,255,0.8); }

        .info-btn-row { display: flex; gap: 12px; width: 100%; pointer-events: auto; }
        .btn-half { flex: 1; padding: 14px 10px 18px 10px; pointer-events: auto; }
        .btn-half .btn-main-text { font-size: 12px; }
        .btn-half .btn-sub-text { font-size: 7px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }

        #storyBackBtn {
            position: absolute; bottom: 30px; left: 25px; z-index: 99999999;
            background: rgba(3, 6, 12, 0.85); backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 229, 255, 0.7); border-radius: 50%;
            width: 50px; height: 50px; display: none; align-items: center; justify-content: center;
            color: #00e5ff; font-size: 22px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); transition: all 0.3s ease;
            pointer-events: auto;
        }
        #storyBackBtn:hover { background: rgba(0, 229, 255, 0.3); color: #fff; transform: scale(1.1); box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }

        .cyber-modal-popup {
            position: absolute; top: 50%; left: 50%; width: 92%; max-width: 380px;
            background-color: rgba(3, 6, 12, 0.92);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.45); 
            border-top: 2.5px solid #00e5ff; 
            border-radius: 18px;
            padding: 32px 22px; z-index: 99999999; opacity: 0; transform: translate(-50%, -40%) scale(0.95);
            pointer-events: none; visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 40px rgba(0, 229, 255, 0.25), inset 0 0 30px rgba(0, 229, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;
        }

        .cyber-modal-popup::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, #ffffff, #00e5ff, transparent);
            animation: topBorderScan 3s linear infinite;
            z-index: 5;
        }
        @keyframes topBorderScan { 0% { left: -100%; } 100% { left: 100%; } }

        .cyber-modal-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }

        .modal-title-regular {
            font-family: 'Montserrat', sans-serif; font-size: 20px; color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8), 0 0 25px rgba(0, 229, 255, 0.4); 
            font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; 
            position: relative; z-index: 2;
        }

        .modal-scroll-area { width: 100%; height: 260px; overflow-y: auto; padding: 0 10px; scrollbar-width: thin; scrollbar-color: rgba(0, 229, 255, 0.4) transparent; position: relative; z-index: 2;}
        .modal-content-box {
            min-height: 90px; color: #f0f4f8; font-size: 13.5px; line-height: 1.6; 
            font-family: 'Space Grotesk', sans-serif; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; text-align: center; position: relative; z-index: 2;
        }

        .modal-content-box p { margin-bottom: 10px; text-align: justify; }
        .modal-content-box h3 { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 12.5px; letter-spacing: 1.5px; margin: 15px 0 8px 0; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,215,0,0.5); text-align: left; width: 100%; font-weight: 800; }
        .tech-badge-glow { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }
        .gold-badge-glow { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }

        .ritual-nav-btn {
            padding: 10px 18px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.45); border-radius: 8px; color: #00e5ff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-shadow: 0 0 8px rgba(0,229,255,0.4); text-transform: uppercase;
            pointer-events: auto;
        }
        .ritual-nav-btn:hover { background: rgba(0,229,255,0.35); box-shadow: 0 0 18px rgba(0,229,255,0.6); color: #fff; }

        .gateway-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; background: rgba(8, 12, 20, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(200, 205, 220, 0.45); border-radius: 16px; overflow: hidden; padding: 2px; z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.6s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 0 40px rgba(180, 190, 210, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.08); }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .gateway-content { position: relative; z-index: 10; width: 100%; height: 100%; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .gateway-content h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(255, 255, 255, 0.8); text-transform: uppercase; border-bottom: 1px solid rgba(200, 205, 220, 0.3); padding-bottom: 10px; width: 100%; text-align: center; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: #03060a; border: 1px solid rgba(200, 205, 220, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; letter-spacing: 2px; font-size: 11px; text-transform: uppercase; box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.08); text-shadow: 0 1px 2px rgba(0,0,0,0.9); pointer-events: auto; }
        .login-input::placeholder { color: rgba(255, 255, 255, 0.45); font-weight: 500; letter-spacing: 1.5px; }
        .login-input:focus { border-color: #ffffff; background: #070b12; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2); }

            const dataForm = new FormData();
            dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                    sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]);
                    
                    statusEl.innerHTML = msgSuccess; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    
                    const bgMusic = document.getElementById('bgMusic');
                    if(bgMusic) bgMusic.pause();
                    setTimeout(() => { 
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().catch(err => { window.location.href = 'INTRO.html'; });
                                successVid.onended = () => { window.location.href = 'INTRO.html'; };
                            } else {
                                window.location.href = 'INTRO.html';
                            }
                        }, 500);
                    }, 1000); 
                } else {
                    let finalMsg = msgFail;
                    if(data.msg) {
                        let backendMsg = data.msg.toUpperCase();
                        let matchTries = backendMsg.match(/CÒN (\d+) LẦN/);
                        if(matchTries) {
                            let triesLeft = matchTries[1];
                            let template = i18n[currentLang].wrongPassDynamic || i18n['vi'].wrongPassDynamic;
                            finalMsg = template.replace('{n}', triesLeft);
                        } else if(backendMsg.includes("SAI")) {
                            finalMsg = msgFail;
                        } else {
                            finalMsg = data.msg;
                        }
                    }
                    statusEl.innerHTML = finalMsg; statusEl.style.color = "#ff3333";
                }
            })
            .catch(error => { statusEl.innerHTML = msgBlocked; statusEl.style.color = "#ff3333"; });
        }
    </script>
    <script src="boo-player.js"></script>
</body>
</html>
