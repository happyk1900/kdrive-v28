<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 480px; 
            background-color: #000; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kdrive-image-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid rgba(200, 215, 255, 0.15);
            pointer-events: none; z-index: 99999999;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05);
        }
        
        /* 🌟 SCENE 1: SPLASH SCREEN (QUẦY VÉ BOO) 🌟 */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: #030508; z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }
        #splashScreen.hidden { opacity: 0; transform: scale(1.5); pointer-events: none; visibility: hidden; }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2;
            filter: brightness(0.85) contrast(1.1);
        }
        
        .splash-bottom-area {
            width: 100%; padding-bottom: 35px; display: flex; justify-content: center; z-index: 10; position: absolute; bottom: 0;
        }

        /* 🌟 HIỆU ỨNG GIỮ 3 GIÂY 🌟 */
        .hologram-hold-btn {
            position: relative; width: 80%; max-width: 280px; padding: 15px 20px;
            background: rgba(5, 10, 20, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.6); border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.98); }
        .hologram-hold-btn.electric-active { border-color: #ff0055; animation: btnElectricStorm 0.15s infinite alternate; }
        
        @keyframes btnElectricStorm {
            0% { box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff; transform: translate(-2px, 1px) scale(1.02); }
            50% { box-shadow: 0 0 45px #ff0055, inset 0 0 25px #ff0055; transform: translate(2px, -2px) scale(1.04); }
            100% { box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff; transform: translate(-1px, -1px) scale(1.03); }
        }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), rgba(0, 229, 255, 0.75));
            z-index: 1; transition: width 0.05s linear; box-shadow: 0 0 20px #00e5ff;
        }

        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 900; letter-spacing: 2px;
            color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.8); text-transform: uppercase;
        }

        /* 🌟 SCENE 2: ẢNH NỀN CỔNG TORII & LOGIN 🌟 */
        .kdrive-bg-target { 
            width: 100%; height: 100%; height: 100dvh; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; 
            z-index: 1; opacity: 0; visibility: hidden; transition: opacity 1.5s ease-in-out;
        }
        .kdrive-bg-target.active { opacity: 1; visibility: visible; }

        .gateway-popup { 
            position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; 
            background: rgba(8, 12, 20, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(0, 229, 255, 0.45); border-radius: 16px; overflow: hidden; padding: 2px; 
            z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; 
            transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 255, 0.15); 
        }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        
        .gateway-content { position: relative; z-index: 10; width: 100%; height: 100%; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .gateway-content h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 229, 255, 0.8); text-transform: uppercase; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; width: 100%; text-align: center; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: rgba(3, 6, 10, 0.8); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; letter-spacing: 2px; font-size: 11px; text-transform: uppercase; box-shadow: inset 0 3px 6px rgba(0,0,0,0.9); pointer-events: auto; }
        .login-input::placeholder { color: rgba(255, 255, 255, 0.45); font-weight: 500; }
        .login-input:focus { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 3px 6px rgba(0,0,0,0.9); }
        .login-btn-submit { padding: 13px 20px; background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 150, 255, 0.4)); color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 3px; border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; margin-top: 10px; text-transform: uppercase; pointer-events: auto; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .login-btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 229, 255, 0.5); background: linear-gradient(135deg, rgba(0, 229, 255, 0.4), rgba(0, 150, 255, 0.6)); }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #00e5ff; pointer-events: auto; font-size: 14px; }
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .remember-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 10px; color: rgba(255,255,255,0.8); text-transform: uppercase; font-weight: 700; pointer-events: auto; }
        .remember-checkbox { appearance: none; width: 13px; height: 13px; border: 1px solid #00e5ff; border-radius: 3px; background: #03060a; cursor: pointer; position: relative; pointer-events: auto; }
        .remember-checkbox:checked::after { content: '✔'; position: absolute; top: -3px; left: 1px; color: #ffffff; font-size: 9px; }
        .change-pass-link { font-size: 10px; color: #00e5ff; cursor: pointer; text-transform: uppercase; font-weight: 700; pointer-events: auto; }
        .bottom-links { margin-top: 25px; text-align: center; width: 100%; border-top: 1px solid rgba(0, 229, 255, 0.25); padding-top: 15px; display: flex; justify-content: space-around;}
        .sub-link { color: #00e5ff; font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: 700; pointer-events: auto; }

        /* Video Bay Vào Khi Đăng Nhập Thành Công */
        #successVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            object-fit: cover; z-index: 9999999; display: none; background: #000;
        }
    </script>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Vast%20Empty%20Atmosphere.mp3" preload="auto" loop></audio>
    <audio id="bgMusic" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai_Ripe_Online.mp4" preload="auto" loop></audio>

    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" playsinline></video>

    <!-- ================= SCENE 1: QUẦY VÉ ================= -->
    <div id="splashScreen">
        <!-- Ảnh quầy vé Boo (Lưu ý: Anh thay URL ảnh nền Boo của anh vào đây nhé) -->
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/Anh%20Bia.png?raw=true" class="splash-bg-image" alt="Cyber City">
        
        <div class="splash-bottom-area">
            <!-- Nút giữ 3 giây -->
            <div class="hologram-hold-btn" id="holoHoldBtn" 
                 onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                 onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                <div class="holo-progress-bar" id="holoProgressBar"></div>
                <div class="holo-text-wrap">GIỮ ĐỂ NHẬP MÔN</div>
            </div>
        </div>
    </div>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        <!-- ================= SCENE 2: CỔNG TORII & BẢNG LOGIN ================= -->
        <!-- Ảnh nền Cổng Torii mới -->
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE.png?raw=true" id="bg-login" class="kdrive-bg-target">
        
        <div class="gateway-popup" id="loginPanelContainer">
            <div class="gateway-content">
                <div id="panel-login" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <h2>XÁC THỰC DANH TÍNH</h2>
                    <div class="input-wrapper">
                        <input type="text" id="accInput" class="login-input" placeholder="Danh Tính Đạo Chúng">
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="passcodeInput" class="login-input" placeholder="Ấn Ký Bí Mật">
                        <span class="eye-icon sound-btn" onclick="togglePass('passcodeInput', this)">👁</span>
                    </div>
                    <div class="account-options-row">
                        <label class="remember-container sound-btn"><input type="checkbox" id="rememberMeCheck" class="remember-checkbox" checked> <span>Ghi nhớ ấn</span></label>
                        <div style="display: flex; gap: 10px;"><span class="change-pass-link sound-btn" onclick="switchPanel('forgot')">Quên Mật Ấn</span></div>
                    </div>
                    <button class="login-btn-submit sound-btn" onclick="playHologramClickSound(); submitLogin();">TIẾN NHẬP</button>
                    <div id="loginStatus" style="margin-top: 15px; font-weight: 700; text-align: center; font-size: 10px; letter-spacing: 2px; line-height: 1.5; color: #fff; text-shadow: 0 1px 3px #000;"></div>
                    <div class="bottom-links">
                        <span class="sub-link sound-btn" onclick="playHologramClickSound(); switchPanel('register')">LẬP THỆ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIC GIỮ 3 GIÂY ---
        let holoHoldInterval = null; 
        let holoHoldStart = 0; 
        const holoHoldDuration = 3000;
        const chargeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(!bar) return;

            holdBtn.classList.add('electric-active');
            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate([50, 30, 50, 30]);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';
                if(elapsed >= holoHoldDuration) { 
                    clearInterval(holoHoldInterval); 
                    triggerTransitionToTorii(); // CHUYỂN THẲNG SANG CỔNG TORII
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(bar) bar.style.width = '0%';
            if(holdBtn) holdBtn.classList.remove('electric-active');
            if(chargeSound) chargeSound.pause();
        }

        // --- CHUYỂN CẢNH SANG CỔNG TORII VÀ ĐỢI 3S MỞ BẢNG LOGIN ---
        function triggerTransitionToTorii() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);
            if(chargeSound) chargeSound.pause();
            
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) { sysAudio.play().catch(e=>{}); }
            
            const bgm = document.getElementById('bgMusic');
            if(bgm) { bgm.play().catch(e=>{}); }

            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden'); // Ẩn màn hình Boo
            
            const bgTarget = document.getElementById('bg-login');
            bgTarget.classList.add('active'); // Hiện ảnh nền Cổng Torii

            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);

            // ĐÚNG 3 GIÂY SAU KHI THẤY CỔNG TORII -> BẢNG LOGIN HIỆN LÊN
            setTimeout(() => {
                const loginPanel = document.getElementById('loginPanelContainer');
                if(loginPanel) loginPanel.classList.add('active');
            }, 3000); 
        }

        // --- CÁC HÀM TIỆN ÍCH ---
        function playHologramClickSound() {
            const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            snd.volume = 0.5; snd.play().catch(e=>{});
        }

        function switchPanel(panelName) { 
            // Logic chuyển panel Lập thệ / Quên mật khẩu nếu có
        }

        function togglePass(inputId, iconEl) { 
            let inp = document.getElementById(inputId); 
            if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = '🙈'; } else { inp.type = 'password'; iconEl.innerHTML = '👁'; } 
        }

        // --- LOGIC XỬ LÝ ĐĂNG NHẬP VÀ HIỆU ỨNG VIDEO THÀNH CÔNG ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');

            if(acc === "" || code === "") { statusEl.innerHTML = "❌ VUI LÒNG ĐIỀN ĐỦ THÔNG TIN!"; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = "🛰️ ĐANG KIỂM CHỨNG..."; statusEl.style.color = "#00e5ff";
            
            const dataForm = new FormData();
            dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                    sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]);
                    
                    statusEl.innerHTML = "✅ THÀNH CÔNG!"; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    
                    const bgMusic = document.getElementById('bgMusic');
                    if(bgMusic) bgMusic.pause();
                    
                    // CHUỖI HIỆU ỨNG ĐĂNG NHẬP THÀNH CÔNG
                    setTimeout(() => { 
                        // 1. Hạ bảng đăng nhập xuống
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        
                        // 2. Chờ bảng biến mất rồi bật Video
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().catch(err => { window.location.href = 'INTRO.html'; });
                                
                                // 3. Hết video thì phi thẳng vào INTRO
                                successVid.onended = () => { window.location.href = 'INTRO.html'; };
                            } else {
                                window.location.href = 'INTRO.html';
                            }
                        }, 500);
                    }, 1000); 
                } else {
                    statusEl.innerHTML = "❌ SAI THÔNG TIN!"; statusEl.style.color = "#ff3333";
                }
            })
            .catch(error => { statusEl.innerHTML = "❌ KẾT NỐI BỊ PHONG TỎA!"; statusEl.style.color = "#ff3333"; });
        }
    </script>
    
    <!-- Link nhúng HUD và thẻ Boo Player ở cuối -->
    <script src="boo-player.js"></script>
    <script src="hud-ticker.js"></script>
</body>
</html>
