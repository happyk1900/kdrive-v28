<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        /* ================= SCENE 0: MÀN HÌNH KHỞI ĐỘNG ================= */
        #preSplashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: #000; z-index: 9999999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            cursor: pointer; pointer-events: auto;
        }
        #preSplashVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.85; pointer-events: none; }
        .pre-splash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 15%, rgba(0,0,0,0.8) 120%); z-index: 2; pointer-events: none; }

        .core-access-btn {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%); z-index: 3; pointer-events: auto; cursor: pointer;
            color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; white-space: nowrap;
            padding: 8px 18px; border-radius: 4px; background: rgba(255, 0, 127, 0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 0, 127, 0.8); box-shadow: 0 0 10px rgba(255, 0, 127, 0.4), inset 0 0 5px rgba(255, 0, 127, 0.2);
            text-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f; animation: electricGlow 2.5s infinite;
        }
        .core-access-btn::before {
            content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; border: 1px solid transparent; border-radius: 4px; z-index: -1;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent, #ff007f) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; background-size: 200% 100%; animation: electricRun 2s linear infinite;
        }
        @keyframes electricGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 127, 0.4), inset 0 0 5px rgba(255, 0, 127, 0.2); text-shadow: 0 0 5px #ff007f; }
            50% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.5), inset 0 0 8px rgba(0, 229, 255, 0.3); text-shadow: 0 0 8px #00e5ff; border-color: rgba(0, 229, 255, 0.8); }
            48%, 52% { transform: translate(-50%, -50%) skewX(0deg); }
            49% { transform: translate(-51%, -50%) skewX(-8deg); color: #00e5ff; }
            51% { transform: translate(-49%, -50%) skewX(8deg); color: #ff007f; }
        }
        @keyframes electricRun { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* ================= SCENE 1: QUẦY VÉ ================= */
        #splashScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #030508; z-index: 999999; display: flex; flex-direction: column; align-items: center; }
        .splash-bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scale(1.05) translateY(15px); }
        .hud-protector { position: absolute; top: 0; left: 0; width: 100%; height: 90px; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); z-index: 49; pointer-events: none; }

        .globe-menu-container { position: absolute; top: 48%; right: 15px; transform: translateY(-50%); z-index: 50; width: 48px; height: 48px; pointer-events: auto; }
        .globe-btn { position: absolute; top: 0; left: 0; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle, #8a2be2 0%, #4b0082 100%); border: 1.5px solid rgba(218, 112, 214, 0.9); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 52; box-shadow: 0 0 18px rgba(138, 43, 226, 0.7); font-size: 22px; animation: globeFloat 2.5s ease-in-out infinite; }
        @keyframes globeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .globe-btn:active { transform: scale(0.9); }
        .globe-btn.active { box-shadow: 0 0 25px rgba(218, 112, 214, 1); border-color: #fff; }
        .fan-flags-wrapper { position: absolute; bottom: 58px; right: 4px; display: flex; flex-direction: column-reverse; gap: 10px; align-items: center; pointer-events: none; opacity: 0; transform: translateY(15px) scale(0.9); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 51; }
        .globe-menu-container.open .fan-flags-wrapper { pointer-events: auto; opacity: 1; transform: translateY(0) scale(1); }
        .flag-item { width: 40px; height: 40px; border-radius: 50%; background: rgba(15, 5, 25, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(138, 43, 226, 0.8); display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 10px rgba(138, 43, 226, 0.5); font-size: 18px; }
        .flag-item.active { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.8); }

        .splash-boxes-container { position: absolute; bottom: 175px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 380px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; z-index: 10; }
        .cyber-box { position: relative; background: rgba(5, 10, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 12px; padding: 18px 5px; text-align: center; cursor: pointer; pointer-events: auto; overflow: hidden; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1), inset 0 0 10px rgba(0, 229, 255, 0.05); animation: boxFloatGlow 3s ease-in-out infinite; }
        .cyber-box:active { transform: scale(0.95); background: rgba(0, 229, 255, 0.2); }
        @keyframes boxFloatGlow { 0%, 100% { transform: translateY(0); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1), inset 0 0 10px rgba(0, 229, 255, 0.05); border-color: rgba(0, 229, 255, 0.4); } 50% { transform: translateY(-6px); box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.2); border-color: rgba(0, 255, 255, 0.8); } }
        .cyber-text { position: relative; z-index: 2; display: inline-block; color: #ffffff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 13.5px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.6); }

        .splash-bottom-area { position: absolute; bottom: 105px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .hologram-hold-btn { position: relative; width: 92%; max-width: 380px; padding: 18px 20px; background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE%203S%20(1).png?raw=true'); background-size: cover; background-position: center; border: 2px solid transparent; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; pointer-events: auto; box-shadow: 0 0 22px rgba(255, 0, 128, 0.4); animation: rgbBorderGlow 4s linear infinite; }
        @keyframes rgbBorderGlow { 0%, 100% { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); } 33% { border-color: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); } 66% { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); } }
        .hologram-hold-btn.electric-active { border-color: #00ffcc !important; box-shadow: 0 0 35px rgba(0, 255, 204, 0.9); }
        .holo-progress-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.5), rgba(255, 255, 255, 0.9)); z-index: 1; transition: width 0.05s linear; }
        .holo-text-wrap { position: relative; z-index: 2; width: 100%; text-align: center; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px rgba(255,255,255,0.8); text-transform: uppercase; transition: transform 0.05s ease; }

        /* ================= MODAL BỐ CỤC MỚI (ẢNH TRÊN - CHỮ DƯỚI CUỘN ĐƯỢC) ================= */
        .info-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); z-index: 9999999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; pointer-events: none; }
        .info-modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .info-modal-content { width: 92%; max-width: 380px; background-color: rgba(5, 10, 18, 0.98); border: 1.5px solid #00e5ff; border-radius: 18px; padding: 20px 15px 15px 15px; box-shadow: 0 0 35px rgba(0, 229, 255, 0.35); transform: scale(0.9); transition: transform 0.3s ease; display: flex; flex-direction: column; align-items: center; }
        .info-modal-overlay.active .info-modal-content { transform: scale(1); }
        .info-modal-title { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; text-align: center; margin-bottom: 15px; text-transform: uppercase; text-shadow: 0 0 12px rgba(255,215,0,0.8); letter-spacing: 1.5px; border-bottom: 1px solid rgba(255, 215, 0, 0.3); width: 100%; padding-bottom: 10px; }
        
        /* Cố định chiều cao ảnh, không cho phép xẹp */
        .modal-image-wrapper { width: 100%; height: 180px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.4); overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); background: #000; flex-shrink: 0; }
        .modal-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        /* Vùng chứa chữ có thanh cuộn dọc mượt mà */
        .carousel-track { display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .slide-item { flex: 0 0 100%; width: 100%; padding: 0 5px; scroll-snap-align: center; color: #d0f0ff; font-size: 13px; line-height: 1.6; font-family: 'Space Grotesk', sans-serif; overflow-y: auto; max-height: 110px; display: block; }
        .slide-item::-webkit-scrollbar { width: 4px; }
        .slide-item::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 4px; }
        .slide-item b { color: #00e5ff; font-weight: 700; }
        .slide-item p { margin-bottom: 10px; }
        
        .carousel-dots { display: flex; gap: 8px; justify-content: center; margin: 12px 0 15px 0; }
        .dot { width: 8px; height: 8px; background: rgba(0, 229, 255, 0.3); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: #00e5ff; width: 22px; border-radius: 4px; box-shadow: 0 0 10px #00e5ff; }

        .close-info-btn { width: 90%; padding: 12px; background: rgba(0, 229, 255, 0.15); border: 1px solid #00e5ff; color: #00e5ff; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; pointer-events: auto; transition: 0.3s; box-shadow: 0 0 12px rgba(0, 229, 255, 0.2); }

        /* ================= SCENE 2: LOGIN ================= */
        .kdrive-image-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #030508; z-index: 1; overflow: hidden; }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; opacity: 0; visibility: hidden; transition: opacity 1.5s ease-in-out; }
        .kdrive-bg-target.active { opacity: 1; visibility: visible; }
        .gateway-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; background: rgba(5, 8, 14, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 18px; padding: 25px 20px; z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .gateway-popup h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); text-transform: uppercase; text-align: center; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .login-btn-submit { width: 100%; padding: 13px 20px; background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 150, 255, 0.4)); color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 3px; border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #00e5ff; }
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .change-pass-link, .sub-link { color: #00e5ff; cursor: pointer; }
        .bottom-links { margin-top: 25px; text-align: center; border-top: 1px solid rgba(0, 229, 255, 0.25); padding-top: 15px; }
        #successVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999999; display: none; background: #000; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" playsinline></video>

    <!-- ================= SCENE 0: KHỞI ĐỘNG ================= -->
    <div id="preSplashScreen" onclick="enterPreSplash()">
        <video id="preSplashVideo" autoplay loop muted playsinline><source src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/video%20khoi%20dau.mp4" type="video/mp4"></video>
        <div class="pre-splash-overlay"></div>
        <div class="core-access-btn" onclick="enterPreSplash()">TRUY CẬP LÕI LƯỢNG TỬ</div>
    </div>

    <!-- ================= SCENE 1: QUẦY VÉ ================= -->
    <div id="splashScreen">
        <div class="hud-protector"></div>
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/ANH%20NEN%20NU.png?raw=true" class="splash-bg-image" alt="Cyber City">
        
        <div class="globe-menu-container" id="globeMenuContainer">
            <div class="globe-btn" id="globeMainBtn" onclick="toggleGlobeMenu()">🌐</div>
            <div class="fan-flags-wrapper">
                <div class="flag-item flag-vi active" onclick="setLanguage('vi')">🇻🇳</div>
                <div class="flag-item flag-en" onclick="setLanguage('en')">🇺🇸</div>
                <div class="flag-item flag-jp" onclick="setLanguage('jp')">🇯🇵</div>
                <div class="flag-item flag-kr" onclick="setLanguage('kr')">🇰🇷</div>
                <div class="flag-item flag-cn" onclick="setLanguage('cn')">🇨🇳</div>
            </div>
        </div>

        <div class="splash-boxes-container">
            <div class="cyber-box" onclick="openInfoModal('nhapmon')"><span class="cyber-text" id="box1Text">ĐĂNG KÝ</span></div>
            <div class="cyber-box" onclick="openInfoModal('tongquan')"><span class="cyber-text" id="box2Text">TỔNG QUAN</span></div>
            <div class="cyber-box" onclick="openInfoModal('luatchoi')"><span class="cyber-text" id="box3Text">LUẬT CHƠI</span></div>
            <div class="cyber-box" onclick="openInfoModal('santhuong')"><span class="cyber-text" id="box4Text">SĂN THƯỞNG</span></div>
        </div>

        <div class="splash-bottom-area">
            <div class="hologram-hold-btn" id="holoHoldBtn" onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)" onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                <div class="holo-progress-bar" id="holoProgressBar"></div>
                <div class="holo-text-wrap" id="holoTextRotator">GIỮ 3 GIÂY ĐỂ VÀO</div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL HIỂN THỊ ================= -->
    <div class="info-modal-overlay" id="infoModalOverlay">
        <div class="info-modal-content">
            <div class="info-modal-title" id="infoTitle">TIÊU ĐỀ</div>
            <!-- KHUNG ẢNH NẰM TRÊN, CỐ ĐỊNH CHIỀU CAO -->
            <div class="modal-image-wrapper">
                <img id="modalIllustration" src="" alt="Minh họa">
            </div>
            <!-- CHỮ NẰM DƯỚI, CÓ THANH CUỘN LƯỚT -->
            <div class="carousel-track" id="carouselTrack" onscroll="handleCarouselScroll()"></div>
            <div class="carousel-dots" id="carouselDots"></div>
            <button class="close-info-btn" id="closeBtnText" onclick="closeInfoModal()">ĐÓNG LẠI</button>
        </div>
    </div>

    <!-- ================= SCENE 2: CỔNG TORII ================= -->
    <div class="kdrive-image-wrapper">
        <img src="https://raw.githubusercontent.com/happyk1900/-m-thanh-app/main/ANH%20DANG%20NHAP.png" id="bg-login" class="kdrive-bg-target" alt="Login Background">
        <div class="gateway-popup" id="loginPanelContainer">
            <div id="panel-login" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <h2 id="loginTitle">XÁC THỰC DANH TÍNH</h2>
                <div class="input-wrapper">
                    <input type="text" id="accInput" class="login-input" placeholder="Danh Tính Đạo Chúng" oninput="playTypeSound()">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="passcodeInput" class="login-input" placeholder="Ấn Ký Bí Mật" oninput="playTypeSound()">
                    <span class="eye-icon" onclick="togglePass('passcodeInput', this)">👁</span>
                </div>
                <div class="account-options-row">
                    <span style="color: rgba(255,255,255,0.7);" id="rememberText">✔ GHI NHỚ ẤN</span>
                    <span class="change-pass-link" id="forgotText" onclick="playHologramClick()">QUÊN MẬT ẤN</span>
                </div>
                <button class="login-btn-submit" id="submitBtnText" onclick="playHologramClick(); submitLogin();">TIẾN NHẬP</button>
                <div id="loginStatus" style="margin-top: 15px; font-weight: 700; text-align: center; font-size: 10px; letter-spacing: 2px; color: #fff;"></div>
                <div class="bottom-links">
                    <span class="sub-link" id="registerLinkText" onclick="playHologramClick()">LẬP THỆ TRUY CẬP</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= HỆ THỐNG QUẢN LÝ HỘP NHẠC (AUDIO MANAGER) =================
        const KDriveMusicBox = {
            tracks: {
                // Bài 1: Phát ở màn hình Quầy Vé
                "Hello Master Boo": new Audio("https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Hello,%20I%20am%20Master%20Boo..mp3"),
                // Bài 2: Phát ở màn hình Cổng Torii
                "Path of the Ninja": new Audio("https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Path%20of%20the%20Ninja.mp3")
            },
            currentTrackName: null,
            play: function(trackName) {
                if (this.currentTrackName && this.tracks[this.currentTrackName]) {
                    this.tracks[this.currentTrackName].pause();
                }
                const track = this.tracks[trackName];
                if (track) {
                    track.crossOrigin = "anonymous";
                    track.loop = true;
                    track.play().catch(e => console.log("Trình duyệt chặn Audio:", e));
                    this.currentTrackName = trackName;
                    // Bắn tín hiệu để Boo Player tự động cập nhật tên bài
                    window.dispatchEvent(new CustomEvent('kdriveMusicSync', { detail: { trackName: trackName, isPlaying: true } }));
                }
            },
            pause: function() {
                if (this.currentTrackName && this.tracks[this.currentTrackName]) {
                    this.tracks[this.currentTrackName].pause();
                    window.dispatchEvent(new CustomEvent('kdriveMusicSync', { detail: { trackName: this.currentTrackName, isPlaying: false } }));
                }
            }
        };

        // ================= KHO HIỆU ỨNG ÂM THANH (SFX) =================
        function playHologramClick() {
            try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); snd.volume = 0.5; snd.play().catch(e=>{}); } catch(err) {}
        }
        function playCoreUnlockSound() {
            try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3'); snd.volume = 0.8; snd.play().catch(e=>{}); } catch(err) {}
        }
        function playSwipeSound() {
            try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'); snd.volume = 0.3; snd.play().catch(e=>{}); } catch(err) {}
        }
        function playTypeSound() {
            try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'); snd.volume = 0.2; snd.play().catch(e=>{}); } catch(err) {}
        }

        // ================= LOGIC GIAO DIỆN & TƯƠNG TÁC =================
        const modalImages = {
            nhapmon: "https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE%20DK.png?raw=true",
            tongquan: "https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE%20TQ.png?raw=true",
            luatchoi: "https://github.com/happyk1900/-m-thanh-app/blob/main/QUAU%20VE%20LC.png?raw=true",
            santhuong: "https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE%20ST.png?raw=true"
        };

        function enterPreSplash() {
            try {
                const preScreen = document.getElementById('preSplashScreen');
                if(preScreen) preScreen.style.pointerEvents = 'none'; 
                playCoreUnlockSound(); // Âm thanh mở khóa Lõi Lượng Tử cực mạnh
                KDriveMusicBox.play("Hello Master Boo"); // Gọi Hộp nhạc phát bài 1
                
                if(preScreen) {
                    preScreen.style.transform = "scale(1.5)"; preScreen.style.opacity = "0";
                    setTimeout(() => { preScreen.style.display = "none"; }, 800);
                }
            } catch (error) { document.getElementById('preSplashScreen').style.display = "none"; }
        }

        function toggleGlobeMenu() {
            playHologramClick();
            const container = document.getElementById('globeMenuContainer');
            container.classList.toggle('open'); document.getElementById('globeMainBtn').classList.toggle('active');
        }
        document.addEventListener('click', function(e) {
            const container = document.getElementById('globeMenuContainer');
            if(!container.contains(e.target) && container.classList.contains('open')) {
                container.classList.remove('open'); document.getElementById('globeMainBtn').classList.remove('active');
            }
        });

        // --- ĐA NGÔN NGỮ (Rút gọn cho dễ nhìn) ---
        const langData = {
            vi: {
                box1: "ĐĂNG KÝ", box2: "TỔNG QUAN", box3: "LUẬT CHƠI", box4: "SĂN THƯỞNG",
                holdMsgs: ["GIỮ 3 GIÂY ĐỂ VÀO", "TRỞ THÀNH CYBER NINJA", "CHIẾN ĐẤU VÌ BANG PHÁI"],
                closeBtn: "ĐÓNG LẠI", loginTitle: "XÁC THỰC DANH TÍNH", accPlaceholder: "Danh Tính Đạo Chúng",
                passPlaceholder: "Ấn Ký Bí Mật", remember: "✔ GHI NHỚ ẤN", forgot: "QUÊN MẬT ẤN",
                submit: "TIẾN NHẬP", register: "LẬP THỆ TRUY CẬP",
                info: {
                    nhapmon: { title: "ĐỒNG BỘ SINH MỆNH", slides: ["Xác thực danh tính <br><b>Đạo chúng (vận động viên)</b><br>và kết nối mã số sinh trắc học cá nhân. Đây là bước đầu tiên để đưa cơ thể thực của bạn vào Không gian K-Drive.", "<b>Bảo mật tối thượng:</b><br>Hạ tầng dữ liệu sinh mệnh được mã hóa và vận hành trên nền tảng điện toán đám mây lõi <b>(Powered by Google & Microsoft)</b>, đảm bảo an toàn tuyệt đối."] },
                    tongquan: { title: "THẾ GIỚI LƯỢNG TỬ", slides: ["Chào mừng đến với đấu trường đối kháng sinh trắc học. Nơi cơ thể sinh học thực tế của bạn sẽ được số hóa trực tiếp thành sức mạnh vô song.", "<b>Hệ sinh thái PRO (VIP):</b><br>Yêu cầu kết nối Đồng hồ (24/7) và Cân thông minh (1 lần/ngày). Dữ liệu sẽ đồng bộ thành <b>chỉ số thể chất SCI (Địa Luân)</b> để quyết định sức mạnh cốt lõi."] },
                    luatchoi: { title: "GIAO THỨC RÈN LUYỆN", slides: ["<b>Khối lập phương 6 mặt:</b><br>• <b>Địa Luân (PRO):</b><br>Rèn luyện thể chất cốt lõi ngoài đời thực (~30 phút/ngày).<br>• <b>Trí Lực:</b><br>Thử thách Thủy, Hỏa, Phong (~5 phút/bộ).", "<b>AI Dynamic Scaling:</b><br>Thuật toán liên tục tinh chỉnh độ khó vô cực bám sát giới hạn của riêng bạn. Trùm cuối duy nhất cần đánh bại chính là bạn của ngày hôm qua!"] },
                    santhuong: { title: "ĐẠI HỘI VÕ LÂM", slides: ["Sự kiện offline hoành tráng tổ chức định kỳ vào <b>tháng 9</b>, giải ngân quỹ thưởng khổng lồ được trích từ <b>30% tổng doanh thu</b> của toàn hệ thống.", "<b>Đại Chiến 2 Phe:</b><br>Phe thắng nhận trọn <b>15%</b> doanh thu. Phe thua được an ủi <b>5%</b> (nếu thua sát nút). Trích <b>10%</b> để tổ chức đại tiệc tri ân miễn phí 100% cho TẤT CẢ <b>Đạo chúng</b>."] }
                }
            }
        };

        let currentLang = 'vi'; let activeModalKey = null;

        function setLanguage(lang) {
            playHologramClick(); currentLang = lang;
            document.querySelectorAll('.flag-item').forEach(el => el.classList.remove('active'));
            const targetFlag = document.querySelector('.flag-' + lang); if(targetFlag) targetFlag.classList.add('active');
            document.getElementById('globeMenuContainer').classList.remove('open'); document.getElementById('globeMainBtn').classList.remove('active');

            const t = langData[lang] || langData['vi'];
            document.getElementById('box1Text').innerText = t.box1; document.getElementById('box2Text').innerText = t.box2;
            document.getElementById('box3Text').innerText = t.box3; document.getElementById('box4Text').innerText = t.box4;
            document.getElementById('closeBtnText').innerText = t.closeBtn; document.getElementById('loginTitle').innerText = t.loginTitle;
            document.getElementById('accInput').placeholder = t.accPlaceholder; document.getElementById('passcodeInput').placeholder = t.passPlaceholder;
            document.getElementById('rememberText').innerText = t.remember; document.getElementById('forgotText').innerText = t.forgot;
            document.getElementById('submitBtnText').innerText = t.submit; document.getElementById('registerLinkText').innerText = t.register;
            holoMessages = t.holdMsgs; if (activeModalKey) { openInfoModal(activeModalKey, true); }
        }

        function openInfoModal(key, isReload = false) {
            if (!isReload) playHologramClick(); activeModalKey = key;
            const imgElement = document.getElementById('modalIllustration');
            if(modalImages[key]) { imgElement.src = modalImages[key]; imgElement.style.display = 'block'; } else { imgElement.style.display = 'none'; }

            const t = langData[currentLang] || langData['vi']; const data = t.info[key] || t.info['nhapmon'];
            document.getElementById('infoTitle').innerHTML = data.title;
            const track = document.getElementById('carouselTrack'); const dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';
            data.slides.forEach((slideHtml, index) => {
                const slideDiv = document.createElement('div'); slideDiv.className = 'slide-item'; slideDiv.innerHTML = `<p>${slideHtml}</p>`;
                // Thêm sự kiện lướt đọc (scroll dọc) thì phát tiếng SFX
                slideDiv.addEventListener('scroll', playSwipeSound);
                track.appendChild(slideDiv);
                const dotSpan = document.createElement('span'); dotSpan.className = index === 0 ? 'dot active' : 'dot';
                dots.appendChild(dotSpan);
            });
            track.scrollLeft = 0; document.getElementById('infoModalOverlay').classList.add('active');
        }

        function closeInfoModal() { playHologramClick(); activeModalKey = null; document.getElementById('infoModalOverlay').classList.remove('active'); }

        // Bắt sự kiện lướt ngang chuyển slide
        let lastActiveIndex = 0;
        function handleCarouselScroll() {
            const track = document.getElementById('carouselTrack'); const dots = document.getElementById('carouselDots').children;
            const activeIndex = Math.round(track.scrollLeft / track.clientWidth);
            if (activeIndex !== lastActiveIndex) {
                playSwipeSound(); // Lướt chuyển hộp phát tiếng
                lastActiveIndex = activeIndex;
            }
            for (let i = 0; i < dots.length; i++) { if (i === activeIndex) { dots[i].classList.add('active'); } else { dots[i].classList.remove('active'); } }
        }

        let holoMessages = ["GIỮ 3 GIÂY ĐỂ VÀO", "TRỞ THÀNH CYBER NINJA", "CHIẾN ĐẤU VÌ BANG PHÁI"];
        let currentMsgIndex = 0;
        setInterval(() => {
            const textEl = document.getElementById('holoTextRotator'); if(!textEl) return;
            textEl.classList.add('glitch-anim'); setTimeout(() => { currentMsgIndex = (currentMsgIndex + 1) % holoMessages.length; textEl.innerHTML = holoMessages[currentMsgIndex]; textEl.classList.remove('glitch-anim'); }, 120);
        }, 3000);

        let holoHoldInterval = null; let holoHoldStart = 0; const holoHoldDuration = 3000;
        const chargeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar'); const holdBtn = document.getElementById('holoHoldBtn'); if(!bar) return;
            holdBtn.classList.add('electric-active'); holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; let p = chargeSound.play(); if(p!==undefined)p.catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate([50, 30, 50, 30]);

            holoHoldInterval = setInterval(() => {
                let progress = Math.min(100, ((Date.now() - holoHoldStart) / holoHoldDuration) * 100); bar.style.width = progress + '%';
                if(Date.now() - holoHoldStart >= holoHoldDuration) { clearInterval(holoHoldInterval); triggerTransitionToTorii(); }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar'); const holdBtn = document.getElementById('holoHoldBtn');
            if(bar) bar.style.width = '0%'; if(holdBtn) holdBtn.classList.remove('electric-active');
            if(chargeSound) chargeSound.pause();
        }

        function triggerTransitionToTorii() {
            try {
                if(navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);
                if(chargeSound) chargeSound.pause();
                
                KDriveMusicBox.play("Path of the Ninja"); // Đổi nhạc mượt mà sang Lõi Lượng Tử
                
                const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); let p2 = laser.play(); if(p2!==undefined)p2.catch(e=>{});
                const splash = document.getElementById('splashScreen');
                if(splash) { splash.style.transition = "opacity 0.8s ease"; splash.style.opacity = "0"; setTimeout(() => { splash.style.display = 'none'; }, 800); }
                const bgTarget = document.getElementById('bg-login'); if(bgTarget) bgTarget.classList.add('active');
                setTimeout(() => { const panel = document.getElementById('loginPanelContainer'); if(panel) panel.classList.add('active'); }, 3000); 
            } catch(err) { console.error("Lỗi chuyển cảnh:", err); }
        }

        function togglePass(inputId, iconEl) { playHologramClick(); let inp = document.getElementById(inputId); if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = '🙈'; } else { inp.type = 'password'; iconEl.innerHTML = '👁'; } }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); var code = document.getElementById('passcodeInput').value.trim(); var statusEl = document.getElementById('loginStatus');
            if(acc === "" || code === "") { statusEl.innerHTML = "❌ ĐIỀN ĐỦ THÔNG TIN!"; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = "🛰️ ĐANG KIỂM CHỨNG..."; statusEl.style.color = "#00e5ff";
            
            const dataForm = new FormData(); dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);
            fetch(scriptURL, { method: 'POST', body: dataForm }).then(response => response.json()).then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    try { playCoreUnlockSound(); if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]); } catch(e) {}
                    statusEl.innerHTML = "✅ THÀNH CÔNG!"; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    KDriveMusicBox.pause(); // Đăng nhập xong thì tắt nhạc chuẩn bị vào Game
                    
                    setTimeout(() => { 
                        const panel = document.getElementById('loginPanelContainer'); if(panel) panel.classList.remove('active'); 
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; let vidPromise = successVid.play();
                                if (vidPromise !== undefined) { vidPromise.then(() => { successVid.onended = () => { window.location.href = 'INTRO.html'; }; }).catch(err => { window.location.href = 'INTRO.html'; }); } 
                                else { successVid.onended = () => { window.location.href = 'INTRO.html'; }; setTimeout(() => { window.location.href = 'INTRO.html'; }, 3000); }
                            } else { window.location.href = 'INTRO.html'; }
                        }, 500);
                    }, 1000); 
                } else { statusEl.innerHTML = "❌ SAI THÔNG TIN!"; statusEl.style.color = "#ff3333"; }
            }).catch(error => { statusEl.innerHTML = "❌ MẤT KẾT NỐI!"; statusEl.style.color = "#ff3333"; });
        }
    </script>
