<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Tour Đấu Trường</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800;1,900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 480px; 
            background-color: #000; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* =========================================
           🌟 SCENE 1: SPLASH SCREEN (QUẦY BÁN VÉ VIDEO) 🌟 
           ========================================= */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: #000; z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }
        #splashScreen.hidden { opacity: 0; transform: scale(1.5); pointer-events: none; visibility: hidden; }

        /* Nền Video anh vừa tạo sẽ nằm ở đây */
        .splash-bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2;
            filter: brightness(0.9) contrast(1.1);
        }

        /* Vùng top chỉ còn giữ chỗ chọn ngôn ngữ nhỏ gọn */
        .splash-top-area { width: 100%; padding: 20px; display: flex; justify-content: center; z-index: 10; }
        
        .splash-lang-switcher {
            display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;
            background: rgba(3, 8, 15, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(0, 229, 255, 0.3); pointer-events: auto;
        }

        .lang-flag-btn {
            background: transparent; border: none; padding: 4px 6px; color: rgba(255,255,255,0.5); 
            font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 800;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .lang-flag-btn.active { color: #00e5ff; text-shadow: 0 0 8px #00e5ff; transform: scale(1.1); }

        .splash-bottom-area {
            width: 100%; padding-bottom: 45px; display: flex; justify-content: center; z-index: 10;
        }

        /* 🌟 NÚT GIỮ 3 GIÂY ĐỘC TÔN (Gai góc, In nghiêng) 🌟 */
        .hologram-hold-btn {
            position: relative; width: 85%; max-width: 320px; padding: 22px 20px;
            /* Cắt vát góc kiểu Cyberpunk */
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            background: rgba(5, 8, 15, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 229, 255, 0.8);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(0, 229, 255, 0.4);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.96); }
        
        /* Hiệu ứng chập điện khi đè tay */
        .hologram-hold-btn.electric-active { 
            border-color: #ff0055; 
            animation: btnElectricStorm 0.1s infinite alternate; 
            background: rgba(20, 5, 10, 0.95);
        }
        
        @keyframes btnElectricStorm {
            0% { box-shadow: 0 0 20px #00e5ff, inset 0 0 15px #00e5ff; transform: translate(-2px, 1px) scale(1.02); }
            100% { box-shadow: 0 0 45px #ff0055, inset 0 0 30px #ff0055; transform: translate(2px, -2px) scale(1.04); }
        }

        /* Chữ bên trong: In nghiêng, hối hả, Font to hơn */
        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 14.5px; font-weight: 900; 
            font-style: italic; letter-spacing: 1px;
            color: #ffffff; text-shadow: 0 0 12px rgba(0,229,255,1), 0 0 20px rgba(0,229,255,0.8); 
            text-transform: uppercase; transition: opacity 0.2s ease;
        }

        /* Kẹp mã HUD 2 bên chữ */
        .holo-text-wrap::before { content: '// [ '; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-right: 5px; }
        .holo-text-wrap::after { content: ' ]_'; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-left: 5px; }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: repeating-linear-gradient(
                -45deg,
                rgba(0, 229, 255, 0.3),
                rgba(0, 229, 255, 0.3) 10px,
                rgba(0, 150, 255, 0.6) 10px,
                rgba(0, 150, 255, 0.6) 20px
            );
            z-index: 1; transition: width 0.05s linear; box-shadow: 0 0 25px #00e5ff;
        }

        /* Giữ nguyên các phần code Scene 2 (Sảnh chờ Arena) ở bên dưới... */
        /* ... (Copy nguyên vẹn phần SCENE 2 SẢNH CHỜ từ đoạn code cũ em đã gửi) ... */
    </style>
</head>
<body>

    <!-- ================= SCENE 1: QUẦY BÁN VÉ LÙA GÀ (VIDEO NỀN) ================= -->
    <div id="splashScreen">
        
        <!-- ANH DÁN LINK VIDEO 10 GIÂY CỦA ANH VÀO ĐÂY NHÉ -->
        <video class="splash-bg-video" autoplay loop muted playsinline>
            <source src="LINK_VIDEO_LUA_GA_CUA_ANH.mp4" type="video/mp4">
        </video>
        
        <div class="splash-top-area">
            <div class="splash-lang-switcher" id="langSwitcherSplash">
                <button class="lang-flag-btn active" onclick="setLanguage('vi')">VI</button>
                <button class="lang-flag-btn" onclick="setLanguage('en')">EN</button>
                <button class="lang-flag-btn" onclick="setLanguage('jp')">JP</button>
            </div>
        </div>

        <div class="splash-bottom-area">
            <!-- NÚT ĐỘC TÔN: IN VÉ -->
            <div class="hologram-hold-btn" id="holoHoldBtn" 
                 onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                 onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                <div class="holo-progress-bar" id="holoProgressBar"></div>
                <div class="holo-text-wrap" id="holoRotatingKeyword">XUẤT VÉ TOUR ĐẤU TRƯỜNG</div>
            </div>
        </div>
    </div>

    <!-- ... Các Scene tiếp theo giữ nguyên ... -->

    <script>
        const currentKeywords = [
            "XUẤT VÉ TOUR", 
            "CHỈ TRẢ BẰNG MỒ HÔI", 
            "CÒN 1 VÉ VIP ĐÚNG!", 
            "KÝ SINH TỬ TRẠNG",
            "ĐIỂM ĐẾN: VÔ NGÃ"
        ];

        let keywordInterval = null;
        function startHoloKeywordRotation(keywords) {
            let index = 0;
            const kwEl = document.getElementById('holoRotatingKeyword');
            if(keywordInterval) clearInterval(keywordInterval);
            kwEl.innerText = keywords[index];
            keywordInterval = setInterval(() => {
                index = (index + 1) % keywords.length;
                if (!document.getElementById('holoHoldBtn').classList.contains('electric-active')) {
                    kwEl.style.opacity = '0';
                    setTimeout(() => { kwEl.innerText = keywords[index]; kwEl.style.opacity = '1'; }, 200);
                }
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => { startHoloKeywordRotation(currentKeywords); });

        let holoHoldInterval = null; let holoHoldStart = 0; const holoHoldDuration = 3000;
        
        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(!bar) return;

            holdBtn.classList.add('electric-active');
            holoHoldStart = Date.now();
            if(navigator.vibrate) navigator.vibrate([50, 30, 50]);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';
                if(elapsed >= holoHoldDuration) { clearInterval(holoHoldInterval); triggerTransitionToScene2(); }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(bar) bar.style.width = '0%';
            if(holdBtn) holdBtn.classList.remove('electric-active');
        }

        function triggerTransitionToScene2() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);
            
            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');
            setTimeout(() => {
                splash.style.display = 'none';
                // Code gọi hiển thị Sảnh Chờ Arena ở đây...
            }, 800);
        }
    </script>
</body>
</html>
