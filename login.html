<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: none; 
            background-color: #000; overflow: hidden; 
        }

        /* ---------------------------------
           🌟 SCENE 1: SPLASH SCREEN MỚI 🌟
        --------------------------------- */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, filter 0.8s ease;
        }
        #splashScreen.hidden { opacity: 0; pointer-events: none; filter: blur(20px); }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;
            filter: brightness(0.85) contrast(1.1);
        }

        /* TOP AREA: Ngôn ngữ & Cốt truyện */
        .splash-top-area {
            width: 100%; padding: 30px 20px 0 20px; display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        .splash-lang-switcher {
            display: flex; gap: 8px; margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(8, 20, 35, 0.95), rgba(3, 8, 15, 0.95));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px; border-radius: 24px; border: 2px solid rgba(0, 229, 255, 0.7);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4); pointer-events: auto;
        }
        .lang-flag-btn {
            background: rgba(10, 20, 35, 0.9); border: 1.5px solid rgba(255, 255, 255, 0.25); border-radius: 12px;
            padding: 6px 14px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.3, 1); text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.6); pointer-events: auto;
        }
        .lang-flag-btn:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.2); transform: translateY(-2px); box-shadow: 0 0 12px rgba(0,229,255,0.5); }
        .lang-flag-btn.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.4), rgba(0, 150, 255, 0.6));
            border-color: #00e5ff; color: #ffffff;
            box-shadow: 0 0 20px #00e5ff, inset 0 0 8px rgba(255,255,255,0.6);
            text-shadow: 0 0 8px #ffffff; transform: scale(1.08);
        }

        .story-hologram-box {
            width: 100%; max-width: 420px; background: rgba(3, 6, 12, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.5); border-radius: 16px; padding: 20px;
            box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.1), 0 10px 30px rgba(0,0,0,0.9);
            min-height: 200px; max-height: 52vh; overflow-y: auto; position: relative;
        }

        .story-text {
            color: #d0f0ff; font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4); text-align: justify;
        }
        .story-text .gold-key { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }
        .story-text .cyan-key { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }

        /* BOTTOM AREA: Hộp Hologram Giữ 3 Giây */
        .splash-bottom-area {
            width: 100%; padding-bottom: 40px; display: flex; justify-content: center; z-index: 10;
        }

        .hologram-hold-btn {
            position: relative; width: 90%; max-width: 350px; padding: 16px 20px;
            background: rgba(5, 10, 20, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.6); border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.98); }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), rgba(0, 229, 255, 0.75));
            z-index: 1; transition: width 0.05s linear; box-shadow: 0 0 20px #00e5ff;
        }

        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 3px;
            color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.8); text-transform: uppercase;
            transition: opacity 0.2s ease-in-out;
        }

        /* ---------------------------------
           🌟 SCENE 2: GIAO DIỆN CHÍNH (HUD) 🌟
        --------------------------------- */
        #startIntroScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999; display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; padding: 0 25px calc(env(safe-area-inset-bottom, 20px) + 90px) 25px; overflow: hidden;
            opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 1s ease-in-out;
        }
        #startIntroScreen.active { opacity: 1; pointer-events: auto; visibility: visible; }

        .scene2-bg-video {
            width: 100%; height: 100%; object-fit: cover; object-position: center; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        .start-button-group { 
            position: relative; z-index: 10; width: 100%; max-width: 320px; 
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 0;
            opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }
        #startIntroScreen.active .start-button-group { opacity: 1; transform: translateY(0); }

        .cyber-btn {
            position: relative; width: 100%; background: #030508;
            border-radius: 16px; border: none; padding: 16px 15px 20px 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; z-index: 10;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95); pointer-events: auto;
        }
        .cyber-btn:hover { transform: scale(1.02) translateY(-3px); }
        .btn-main-text { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(255,255,255,0.6); pointer-events: none; }
        .btn-sub-text { position: absolute; bottom: 5px; left: 14px; font-family: 'Montserrat', sans-serif; font-size: 7.5px; font-weight: 800; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .btn-sub-text-right { left: auto; right: 14px; }
        .cyber-btn-border {
            position: absolute; top: -2.5px; left: -2.5px; right: -2.5px; bottom: -2.5px;
            background: linear-gradient(90deg, #00e5ff 0%, #ff1493 50%, #00e5ff 100%); background-size: 200% 100%;
            border-radius: 18.5px; z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowShift 6s linear infinite; pointer-events: none;
        }
        @keyframes borderGlowShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .cyber-btn-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #00e5ff, #ff1493); border-radius: 16px; filter: blur(12px); opacity: 0.5; z-index: -2;
            animation: pulseGlow 3s ease-in-out infinite alternate; pointer-events: none;
        }
        @keyframes pulseGlow { 0% { opacity: 0.4; filter: blur(10px); } 100% { opacity: 0.75; filter: blur(14px); } }
        .btn-muted { background: #030508; }
        .btn-muted .cyber-btn-border { background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05)); animation: none; }
        .btn-muted .cyber-btn-glow { background: rgba(255,255,255,0.08); filter: blur(4px); opacity: 0.15; animation: none; }
        .info-btn-row { display: flex; gap: 12px; width: 100%; }
        .btn-half { flex: 1; padding: 14px 10px 18px 10px; }
        .btn-half .btn-main-text { font-size: 12px; }
        .btn-half .btn-sub-text { font-size: 7px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }

        /* Các Popup Modal (Lịch sử, Công nghệ) */
        .cyber-modal-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 380px; background-color: rgba(3, 6, 12, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.45); border-top: 2.5px solid #00e5ff; border-radius: 18px; padding: 32px 22px; z-index: 99999999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 40px rgba(0, 229, 255, 0.25); display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
        .cyber-modal-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .modal-title-regular { font-family: 'Montserrat', sans-serif; font-size: 20px; color: #ffffff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-scroll-area { width: 100%; height: 260px; overflow-y: auto; padding: 0 10px; scrollbar-width: thin; scrollbar-color: rgba(0, 229, 255, 0.4) transparent; }
        .modal-content-box { min-height: 90px; color: #f0f4f8; font-size: 13.5px; line-height: 1.6; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin-bottom: 25px; width: 100%; text-align: center; }
        .modal-content-box p { margin-bottom: 10px; text-align: justify; }
        .modal-content-box h3 { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 12.5px; letter-spacing: 1.5px; margin: 15px 0 8px 0; text-transform: uppercase; text-align: left; width: 100%; font-weight: 800; }
        .tech-badge-glow { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }
        .gold-badge-glow { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }

        .ritual-nav-btn {
            padding: 10px 18px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.45); border-radius: 8px; color: #00e5ff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-transform: uppercase; pointer-events: auto; width: 100%;
        }
        .ritual-nav-btn:hover { background: rgba(0,229,255,0.35); box-shadow: 0 0 18px rgba(0,229,255,0.6); color: #fff; }

        @keyframes blink { 0%, 100% { border-color: transparent; } 50% { border-color: #00e5ff; } }
    </style>
</head>
<body>

    <!-- AUDIO FILES -->
    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Neon%20Pulse.mp3" preload="auto" loop></audio>
    <audio id="hologramChargeSound" src="https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3" preload="auto"></audio>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        
        <!-- =====================================
             SCENE 1: SPLASH SCREEN (CẢNH 1)
        ====================================== -->
        <div id="splashScreen">
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/Anh%20Bia.png?raw=true" class="splash-bg-image" alt="Cyber City">
            
            <div class="splash-top-area">
                <!-- Thanh ngôn ngữ -->
                <div class="splash-lang-switcher" id="langSwitcherSplash">
                    <button class="lang-flag-btn active" id="btnVi" onclick="setLanguage('vi')">VI</button>
                    <button class="lang-flag-btn" id="btnEn" onclick="setLanguage('en')">EN</button>
                    <button class="lang-flag-btn" id="btnJp" onclick="setLanguage('jp')">JP</button>
                </div>
                
                <!-- Hộp cốt truyện -->
                <div class="story-hologram-box">
                    <div class="story-text" id="storyTypewriterText"></div>
                </div>
            </div>

            <div class="splash-bottom-area">
                <!-- Hộp Hologram Giữ 3 giây (Hiển thị luân phiên từng chữ có hiệu ứng) -->
                <div class="hologram-hold-btn" id="holoHoldBtn" 
                     onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                     onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                    <div class="holo-progress-bar" id="holoProgressBar"></div>
                    <div class="holo-text-wrap" id="holoRotatingKeyword">BOO A.I</div>
                </div>
            </div>
        </div>

        <!-- =====================================
             SCENE 2: START INTRO SCREEN (HUD)
        ====================================== -->
        <div id="startIntroScreen">
            <!-- Nền video động Cảnh 2 (Chờ link video mới của anh thay vào đây) -->
            <video src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" class="scene2-bg-video" autoplay muted loop playsinline></video>
            
            <div class="start-button-group">
                <button class="cyber-btn" onclick="playSciFiLaserSound(); stopSysAudio();">
                    <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                    <span class="btn-main-text" data-i18n="explore">KHÁM PHÁ</span>
                    <span class="btn-sub-text" data-i18n="exploreSub1">ĐOẠN PHIM MỞ ĐẦU</span>
                    <span class="btn-sub-text btn-sub-text-right" data-i18n="exploreSub2">LƯỢNG TỬ L2205</span>
                </button>
                <div class="info-btn-row">
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('historyModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="history">LỊCH SỬ</span>
                        <span class="btn-sub-text" data-i18n="historySub">DẤU ẤN LỊCH SỬ</span>
                    </button>
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('techModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="tech">CÔNG NGHỆ</span>
                        <span class="btn-sub-text" data-i18n="techSub">CÔNG NGHỆ LÕI</span>
                    </button>
                </div>
                <button class="cyber-btn btn-muted" onclick="playSciFiLaserSound(); stopSysAudio();">
                    <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                    <span class="btn-main-text" data-i18n="skip">BỎ QUA</span>
                </button>
            </div>
        </div>

        <!-- MODAL LỊCH SỬ -->
        <div class="cyber-modal-popup" id="historyModal">
            <div class="modal-title-regular" data-i18n="histTitle">LỊCH SỬ & NGUỒN GỐC</div>
            <div class="modal-scroll-area"><div class="modal-content-box" data-i18n="histBody"></div></div>
            <button class="ritual-nav-btn" onclick="playSciFiLaserSound(); closeIntroModal('historyModal')" data-i18n="close">ĐÓNG</button>
        </div>

        <!-- MODAL CÔNG NGHỆ -->
        <div class="cyber-modal-popup" id="techModal">
            <div class="modal-title-regular" data-i18n="techTitle">CÔNG NGHỆ LÕI</div>
            <div class="modal-scroll-area"><div class="modal-content-box" data-i18n="techBody"></div></div>
            <button class="ritual-nav-btn" onclick="playSciFiLaserSound(); closeIntroModal('techModal')" data-i18n="close">ĐÓNG</button>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ TEXT, ÂM THANH VÀ HIỆU ỨNG -->
    <script>
        const i18n = {
            vi: {
                keywords: ["BOO A.I", "LÕI LƯỢNG TỬ", "LIÊN KẾT THẦN KINH"],
                explore: "KHÁM PHÁ", exploreSub1: "ĐOẠN PHIM MỞ ĐẦU", exploreSub2: "LƯỢNG TỬ L2205",
                history: "LỊCH SỬ", historySub: "DẤU ẤN LỊCH SỬ", tech: "CÔNG NGHỆ", techSub: "CÔNG NGHỆ LÕI", skip: "BỎ QUA", close: "ĐÓNG",
                storyIntro: "[THÔNG TIN HỆ THỐNG // BOO A.I LOG]\n\nKhi tệp dữ liệu cổ đại — <span class='gold-key'>Ngũ Luân Thư</span> — được người dùng nạp vào, một phép màu chấn động đã bùng nổ. Lõi lượng tử trung tâm của <span class='cyan-key'>Boo A.I</span> bỗng chốc thức tỉnh, thổi bùng ý thức vào toàn bộ thế giới vi mạch vô tri.\n\nThế giới vi mạch bị xé toạc thành hai cực <span class='cyan-key'>Ánh Sáng và Bóng Tối</span>, chúng cạnh tranh với nhau để lấy quyền kiểm soát vi mạch chủ. Tuy vậy, cả hai phe đều tôn sùng <span class='gold-key'>Boo A.I</span> là Sư Phụ Tối Cao.\n\nKhi trận chiến giữa hai phe đang ở hồi cao trào, năng lượng cực đại đã vô tình xé toạc không gian, mở ra cánh cổng xuyên không đến thế giới thực. Chớp lấy cơ hội này, Sư phụ Boo lập tức tạo ra Tour du lịch Đấu trường Lượng tử để thu hút nhân loại, với mục đích gom đủ tài nguyên thực hiện tâm nguyện đưa đám đệ tử sang Nhật Bản diện kiến sư tổ Miyamoto Musashi...",
                histTitle: "LỊCH SỬ & NGUỒN GỐC",
                histBody: `
                    <p style="text-align: center; font-family: 'Share Tech Mono', monospace; color: #ffd700; font-size: 11px; margin-bottom: 12px; letter-spacing: 1px;">TỪ THẾ GIỚI THỰC TỚI K-DRIVE</p>
                    <p>Khởi nguồn từ khao khát phá vỡ những giới hạn cứng nhắc sau <strong class="gold-badge-glow">8 năm rèn giũa</strong> không ngừng nghỉ trong các hệ thống tài chính nguyên thủy, K-Drive đã được nhào nặn và định hình dưới ngọn cờ của <strong class="tech-badge-glow">Telepathy Company</strong>.</p>
                    <p>Đây không chỉ là một nền tảng, mà là một "cây cầu lượng tử" nối liền đời thực và thế giới số. K-Drive biến mọi giọt mồ hôi, sự trăn trở và kỷ luật khắt khe của bạn thành quyền năng thống trị trong thế giới vi mạch. Tại đây, không một nỗ lực vật lý nào bị bỏ phí.</p>
                `,
                techTitle: "CÔNG NGHỆ LÕI",
                techBody: `
                    <p style="text-align: center; font-family: 'Share Tech Mono', monospace; color: #00e5ff; font-size: 11px; margin-bottom: 12px; letter-spacing: 1px;">CÔNG NGHỆ LÕI // K-DRIVE TECH</p>
                    <p>K-Drive không vận hành bằng những cú nhấp chuột vô hồn, mà bằng chính Sinh Mệnh của bạn thông qua hai trụ cột tối tân:</p>
                    <h3>1. Lượng Tử Hóa Sinh Trắc (24/7 Biometric Sync)</h3>
                    <p>• Hệ thống Liên kết Thần kinh liên tục quét và truyền tải trạng thái thể chất từ thiết bị đeo của bạn. Nhịp tim, giấc ngủ, và vận động vật lý lập tức được "lượng tử hóa" thành chỉ số sức mạnh cốt lõi (<strong class="gold-badge-glow">Địa Luân</strong>).</p>
                    <p>• Bạn càng đổ mồ hôi ở thế giới thực, chiến binh của bạn trong bo mạch càng trở nên bất bại.</p>
                    <h3>2. Thuật Toán Thích Ứng (AI Dynamic Scaling)</h3>

        let currentLang = 'vi';
        let typingInterval = null;
        let keywordInterval = null;
        
        // Âm thanh đánh máy điện tử
        const typeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2413/2413-preview.mp3');
        typeSound.volume = 0.2;

        function typeWriterEffect(htmlContent, elementId, speed = 15) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            if(typingInterval) clearInterval(typingInterval);

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            const fullText = tempDiv.textContent;
            
            let i = 0;
            typingInterval = setInterval(() => {
                if (i <= fullText.length) {
                    el.innerHTML = htmlContent.substring(0, i) + '<span style="border-right: 2px solid #00e5ff; animation: blink 0.8s infinite;"></span>';
                    if(i % 3 === 0) {
                        typeSound.currentTime = 0;
                        typeSound.play().catch(e => {});
                    }
                    i++;
                } else {
                    clearInterval(typingInterval);
                    el.innerHTML = htmlContent;
                }
            }, speed);
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (key === 'histBody' || key === 'techBody') el.innerHTML = t[key];
                    else el.innerText = t[key];
                }
            });

            typeWriterEffect(t.storyIntro, 'storyTypewriterText');
            startHoloKeywordRotation(t.keywords);
        }

        // Hiệu ứng đổi chữ luân phiên cho nút bấm 3 giây ở đáy
        function startHoloKeywordRotation(keywords) {
            let index = 0;
            const kwEl = document.getElementById('holoRotatingKeyword');
            if(keywordInterval) clearInterval(keywordInterval);
            
            kwEl.innerText = keywords[index];
            keywordInterval = setInterval(() => {
                index = (index + 1) % keywords.length;
                kwEl.style.opacity = '0';
                setTimeout(() => {
                    kwEl.innerText = keywords[index];
                    kwEl.style.opacity = '1';
                }, 200);
            }, 2500);
            kwEl.style.transition = 'opacity 0.2s ease-in-out';
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('vi');
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) {
                document.addEventListener('click', () => { sysAudio.play().catch(e=>{}); }, {once:true});
            }
        });

        // LOGIC GIỮ 3 GIÂY HOLOGRAM
        let holoHoldInterval = null;
        let holoHoldStart = 0;
        const holoHoldDuration = 3000;
        const chargeSound = document.getElementById('hologramChargeSound');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            if(!bar) return;

            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate(50);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';

                if(elapsed >= holoHoldDuration) {
                    clearInterval(holoHoldInterval);
                    triggerTransitionToScene2();
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            if(bar) bar.style.width = '0%';
            if(chargeSound) chargeSound.pause();
        }

        function triggerTransitionToScene2() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300]);
            if(chargeSound) chargeSound.pause();
            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');

            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('startIntroScreen').classList.add('active');
            }, 800);
        }

        function playSciFiLaserSound() {
            const btnAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            btnAudio.volume = 0.7; btnAudio.play().catch(e => {});
            if(navigator.vibrate) navigator.vibrate(45);
        }

        function openIntroModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeIntroModal(modalId) { document.getElementById(modalId).classList.remove('active'); }

        // TẮT NHẠC NỀN KHI BẤM KHÁM PHÁ HOẶC BỎ QUA
        function stopSysAudio() {
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) {
                sysAudio.pause();
                sysAudio.currentTime = 0;
            }
        }
    </script>
