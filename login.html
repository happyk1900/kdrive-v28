<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        /* MÀN HÌNH KHỞI ĐỘNG VIDEO ĐẦU TIÊN */
        #preSplashScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease-in-out; cursor: pointer; pointer-events: auto; }
        #preSplashVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.85; pointer-events: none; }
        .pre-splash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 15%, rgba(0,0,0,0.8) 120%); z-index: 2; pointer-events: none; }

        .core-access-btn {
            position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3; pointer-events: auto; cursor: pointer; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; white-space: nowrap; padding: 10px 22px; border-radius: 4px; background: rgba(255, 0, 127, 0.2); backdrop-filter: blur(4px); border: 1px solid rgba(255, 0, 127, 0.8); box-shadow: 0 0 15px rgba(255, 0, 127, 0.5), inset 0 0 8px rgba(255, 0, 127, 0.3); text-shadow: 0 0 6px #ff007f; animation: electricGlow 2.5s infinite;
        }

        @keyframes electricGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 127, 0.4), inset 0 0 5px rgba(255, 0, 127, 0.2); text-shadow: 0 0 5px #ff007f; }
            50% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 10px rgba(0, 229, 255, 0.4); text-shadow: 0 0 10px #00e5ff; border-color: rgba(0, 229, 255, 0.9); }
        }

        /* KHUNG LOGIN TRỰC TIẾP TRÊN NỀN TORII CYBER */
        .kdrive-image-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #010204; z-index: 1; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; opacity: 1; }
        
        .gateway-popup { 
            position: relative; width: 88%; max-width: 320px; 
            background: rgba(5, 12, 22, 0.88); backdrop-filter: blur(15px);
            border: 1.5px solid rgba(0, 229, 255, 0.5); border-radius: 14px; padding: 25px 20px; z-index: 99999; 
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.3);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; transform: scale(0.95); transition: all 0.6s cubic-bezier(0.25, 1, 0.3, 1); pointer-events: none;
        }
        .gateway-popup.active { opacity: 1; transform: scale(1); pointer-events: auto; }

        .gateway-title {
            color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900;
            text-transform: uppercase; margin-bottom: 18px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,215,0,0.7);
        }
        
        .input-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .login-input { 
            width: 100%; padding: 12px 14px; 
            background: rgba(10, 15, 25, 0.85); 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            border-radius: 8px; color: #ffffff; outline: none; 
            font-weight: 500; font-family: 'Space Grotesk', sans-serif; font-size: 12px; 
            transition: all 0.3s; 
        }
        .login-input::placeholder { color: rgba(255,255,255,0.35); }
        .login-input:focus { border-color: #00e5ff; background: rgba(10, 15, 25, 0.95); box-shadow: 0 0 10px rgba(0,229,255,0.3); }

        .login-btn-submit { 
            width: 100%; padding: 12px; margin-top: 5px;
            background: rgba(0, 229, 255, 0.2); 
            color: #00e5ff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 2px; 
            border: 1px solid #00e5ff; border-radius: 8px; 
            cursor: pointer; text-transform: uppercase; transition: 0.3s; 
            box-shadow: 0 0 15px rgba(0,229,255,0.3);
        }
        .login-btn-submit:hover { background: rgba(0, 229, 255, 0.4); color: #fff; box-shadow: 0 0 25px #00e5ff; }

        .login-extra-row { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; padding: 0 2px; }
        .extra-action-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .extra-action-btn:hover { color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.6); }

        /* MODAL PHỤ ĐĂNG KÝ / QUÊN MẬT KHẨU */
        .sub-action-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2147483646; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; pointer-events: none; }
        .sub-action-modal.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .sub-modal-box { width: 88%; max-width: 320px; background: rgba(5,12,22,0.98); border: 1.5px solid #ff007f; border-radius: 14px; padding: 22px; text-align: center; box-shadow: 0 0 30px rgba(255,0,127,0.4); }
        .sub-modal-title { color: #ff3366; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,51,102,0.8); }
        .sub-modal-desc { color: #d0f0ff; font-size: 11.5px; margin-bottom: 18px; line-height: 1.6; }
        .sub-modal-close { background: rgba(255,0,127,0.2); border: 1px solid #ff007f; color: #ff3366; padding: 10px; width: 100%; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; }

        #successVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999999; display: none; background: #000; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="bgMusic" crossorigin="anonymous" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Path%20of%20the%20Ninja.mp3" preload="auto" loop></audio>
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20KAI%20RIEP%20Super.mp4" playsinline></video>

    <!-- MÀN HÌNH KHỞI ĐỘNG -->
    <div id="preSplashScreen" onclick="enterPreSplash()">
        <video id="preSplashVideo" autoplay loop muted playsinline>
            <source src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/video%20khoi%20dau.mp4" type="video/mp4">
        </video>
        <div class="pre-splash-overlay"></div>
        <div class="core-access-btn" data-i18n="core_access">TRUY CẬP LÕI LƯỢNG TỬ</div>
    </div>

    <!-- KHUNG GIAO DIỆN ĐĂNG NHẬP CHÍNH -->
    <div class="kdrive-image-wrapper">
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/TORI%20CYBER.png?raw=true" class="kdrive-bg-target" alt="Login Background">
        
        <div class="gateway-popup" id="loginPanelContainer">
            <div class="gateway-title" data-i18n="gateway_title">ĐĂNG NHẬP HỆ THỐNG</div>
            <div class="input-wrapper">
                <input type="text" id="accInput" class="login-input" placeholder="Tài khoản / Username" data-i18n-placeholder="placeholder_user">
            </div>
            <div class="input-wrapper">
                <input type="password" id="passcodeInput" class="login-input" placeholder="Mật khẩu / Password" data-i18n-placeholder="placeholder_pass">
            </div>
            
            <button class="login-btn-submit" onclick="playHologramClick(); submitLogin();" data-i18n="login_btn">ĐĂNG NHẬP</button>
            
            <div class="login-extra-row">
                <button class="extra-action-btn" onclick="playHologramClick(); openSubModal('register')" data-i18n="register_btn">+ Đăng ký tài khoản</button>
                <button class="extra-action-btn" onclick="playHologramClick(); openSubModal('forgot')" data-i18n="forgot_btn">Quên mật khẩu?</button>
            </div>

            <div id="loginStatus" style="margin-top: 10px; font-weight: 700; text-align: center; font-size: 11px; color: #fff;"></div>
        </div>
    </div>

    <!-- MODAL ĐĂNG KÝ / QUÊN MẬT KHẨU -->
    <div class="sub-action-modal" id="subActionModal">
        <div class="sub-modal-box">
            <div class="sub-modal-title" id="subModalTitle">THÔNG BÁO</div>
            <div class="sub-modal-desc" id="subModalDesc">Nội dung...</div>
            <button class="sub-modal-close" onclick="playHologramClick(); closeSubModal()" data-i18n="close_btn">ĐÓNG LẠI</button>
        </div>
    </div>

    <script>
        const translations = {
            vi: {
                page_title: "K-Drive: Cổng không gian cyber",
                core_access: "TRUY CẬP LÕI LƯỢNG TỬ",
                gateway_title: "ĐĂNG NHẬP HỆ THỐNG",
                placeholder_user: "Tài khoản / Username",
                placeholder_pass: "Mật khẩu / Password",
                login_btn: "ĐĂNG NHẬP",
                register_btn: "+ Đăng ký tài khoản",
                forgot_btn: "Quên mật khẩu?",
                close_btn: "ĐÓNG LẠI",
                status_empty: "❌ VUI LÒNG ĐIỀN ĐỦ THÔNG TIN!",
                status_checking: "🛰️ ĐANG XÁC THỰC DỮ LIỆU...",
                status_success: "✅ XÁC THỰC THÀNH CÔNG!",
                status_error: "❌ TÀI KHOẢN HOẶC MẬT KHẨU KHÔNG ĐÚNG!",
                status_disconnect: "❌ MẤT KẾT NỐI MÁY CHỦ LƯỢNG TỬ!"
            },
            en: {
                page_title: "K-Drive: Cyber Space Portal",
                core_access: "ACCESS QUANTUM CORE",
                gateway_title: "SYSTEM LOGIN",
                placeholder_user: "Username",
                placeholder_pass: "Password",
                login_btn: "LOGIN",
                register_btn: "+ Register Account",
                forgot_btn: "Forgot Password?",
                close_btn: "CLOSE",
                status_empty: "❌ PLEASE FILL IN ALL FIELDS!",
                status_checking: "🛰️ AUTHENTICATING...",
                status_success: "✅ SUCCESSFUL!",
                status_error: "❌ INVALID USERNAME OR PASSWORD!",
                status_disconnect: "❌ QUANTUM SERVER DISCONNECTED!"
            }
        };

        function applyLanguage(lang) {
            const t = translations[lang] || translations['vi'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
            window.currentLangDict = t;
        }

        window.addEventListener('kdriveLangChanged', (e) => { applyLanguage(e.detail.lang); });
        window.addEventListener('DOMContentLoaded', () => { applyLanguage(localStorage.getItem('kdrive_lang') || 'vi'); });

        function playHologramClick() { try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); snd.volume = 0.5; snd.play().catch(e=>{}); } catch(err) {} }

        function enterPreSplash() {
            const bgm = document.getElementById('bgMusic');
            if(bgm) { bgm.currentTime = 0; bgm.play().catch(e => {}); }

            const preSplash = document.getElementById('preSplashScreen');
            preSplash.style.pointerEvents = 'none'; 
            playHologramClick();
            
            preSplash.style.opacity = "0";
            setTimeout(() => { 
                preSplash.style.display = "none"; 
                document.getElementById('loginPanelContainer').classList.add('active');
            }, 800);
        }

        function openSubModal(type) {
            const modal = document.getElementById('subActionModal');
            const title = document.getElementById('subModalTitle');
            const desc = document.getElementById('subModalDesc');
            if(type === 'register') {
                title.innerHTML = "✨ ĐĂNG KÝ TÀI KHOẢN";
                desc.innerHTML = "Hệ thống tự động ghi nhận tài khoản mới vào cơ sở dữ liệu Google Sheets ngay khi kết nối. Vui lòng liên hệ BQT hoặc đăng ký trực tiếp tại Đạo trường.";
            } else {
                title.innerHTML = "🔑 KHÔI PHỤC MẬT KHẨU";
                desc.innerHTML = "Vui lòng liên hệ Quản trị viên hệ thống để được hỗ trợ cấp lại mã định danh lượng tử.";
            }
            modal.classList.add('active');
        }
        function closeSubModal() { document.getElementById('subActionModal').classList.remove('active'); }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');
            const t = window.currentLangDict || translations['vi'];

            if(acc === "" || code === "") { statusEl.innerHTML = t.status_empty; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = t.status_checking; statusEl.style.color = "#00e5ff";
            
            const dataForm = new FormData(); 
            dataForm.append('action', 'checkLogin'); 
            dataForm.append('username', acc); 
            dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    try {
                        const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                        sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                        if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500]);
                    } catch(e) {}
                    
                    statusEl.innerHTML = t.status_success; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); 
                    sessionStorage.setItem('kdrive_username', acc); 
                    
                    setTimeout(() => { 
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().then(() => { 
                                    successVid.onended = () => { window.location.href = 'core.html'; };
                                }).catch(err => { window.location.href = 'core.html'; });
                            } else { window.location.href = 'core.html'; }
                        }, 300);
                    }, 500); 
                } else { statusEl.innerHTML = t.status_error; statusEl.style.color = "#ff3333"; }
            })
            .catch(error => { statusEl.innerHTML = t.status_disconnect; statusEl.style.color = "#ff3333"; });
        }
    </script>
    <script src="hud-ticker.js"></script>
</body>
</html>
