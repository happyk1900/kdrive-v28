<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030508">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%A3i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: none; 
            background-color: #000; overflow: hidden; 
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kdrive-image-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid rgba(200, 215, 255, 0.15);
            pointer-events: none; z-index: 99999999;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05);
        }
        
        /* ---------------------------------
           🌟 BƯỚC 1: SPLASH SCREEN 🌟
        --------------------------------- */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999999; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            overflow: hidden; transition: opacity 0.8s ease-in-out, filter 0.8s ease;
        }
        #splashScreen.hidden { opacity: 0; pointer-events: none; filter: blur(20px); }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;
            filter: brightness(0.85) contrast(1.1);
        }

        .splash-top-area {
            width: 100%; padding: 40px 20px 0 20px; display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        .splash-lang-switcher {
            display: flex; gap: 8px; margin-bottom: 15px;
            background: linear-gradient(135deg, rgba(8, 20, 35, 0.85), rgba(3, 8, 15, 0.85));
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 24px; border: 1px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); pointer-events: auto;
        }
        .lang-flag-btn {
            background: rgba(10, 20, 35, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            padding: 6px 12px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 800;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .lang-flag-btn.active {
            background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); transform: scale(1.05);
        }

        .story-hologram-box {
            width: 100%; max-width: 450px; background: rgba(3, 6, 12, 0.8);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 12px; padding: 20px;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05), 0 5px 15px rgba(0,0,0,0.8);
            min-height: 200px; position: relative; overflow: hidden;
        }
        .story-hologram-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            animation: scanline 3s linear infinite;
        }
        @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .story-text {
            color: #d0f0ff; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4); text-align: justify;
        }

        .splash-bottom-area {
            width: 100%; padding-bottom: 60px; display: flex; justify-content: center; z-index: 10;
        }

        .hologram-hold-btn {
            position: relative; width: 85%; max-width: 320px; padding: 20px 20px;
            background: rgba(5, 10, 20, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(0, 229, 255, 0.6); border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
            transition: transform 0.1s;
        }
        .hologram-hold-btn:active { transform: scale(0.96); }

        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), rgba(0, 229, 255, 0.7));
            z-index: 1; transition: width 0.1s linear; box-shadow: 0 0 25px #00e5ff;
        }

        .holo-text-wrap {
            position: relative; z-index: 2; text-align: center;
            font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 3px;
            color: #ffffff; text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff; text-transform: uppercase;
        }
        
        .glitch-shock { animation: glitchShockAnim 0.3s cubic-bezier(0.11, 0, 0.5, 1) forwards; }
        @keyframes glitchShockAnim {
            0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0px #fff); color: #fff; }
            20% { transform: scale(1.15) translate(-4px, 2px) skewX(-10deg); filter: drop-shadow(0 0 15px #00ffff); color: #00ffff; }
            40% { transform: scale(0.95) translate(4px, -2px) skewX(15deg); filter: drop-shadow(0 0 15px #ff0055); color: #ff0055; }
            60% { transform: scale(1.05) translate(-2px, -1px) skewX(-5deg); filter: drop-shadow(0 0 15px #ffff00); color: #ffff00; }
            100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 10px #00e5ff); color: #fff; }
        }

        /* ---------------------------------
           🌟 BƯỚC 2: MÀN HÌNH HUD ĐỘNG 🌟
        --------------------------------- */
        #startIntroScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999; display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; padding: 0 25px calc(env(safe-area-inset-bottom, 20px) + 90px) 25px; overflow: hidden;
            opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.8s ease-in-out;
        }
        #startIntroScreen.active { opacity: 1; pointer-events: auto; visibility: visible; }

        .scene2-bg-video {
            width: 100%; height: 100%; object-fit: cover; object-position: center; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        .start-button-group { 
            position: relative; z-index: 10; width: 100%; max-width: 320px; 
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 0;
            opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }
        #startIntroScreen.active .start-button-group { opacity: 1; transform: translateY(0); }

        .cyber-btn {
            position: relative; width: 100%; background: #030508;
            border-radius: 16px; border: none; padding: 16px 15px 20px 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; cursor: pointer; z-index: 10;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.95); pointer-events: auto;
        }
        .cyber-btn:hover { transform: scale(1.02) translateY(-3px); }
        .btn-main-text { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 12px rgba(255,255,255,0.6); pointer-events: none; }
        .btn-sub-text { position: absolute; bottom: 5px; left: 14px; font-family: 'Montserrat', sans-serif; font-size: 7.5px; font-weight: 800; color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
        .btn-sub-text-right { left: auto; right: 14px; }
        
        .cyber-btn-border {
            position: absolute; top: -2.5px; left: -2.5px; right: -2.5px; bottom: -2.5px;
            background: linear-gradient(90deg, #00e5ff 0%, #ff1493 50%, #00e5ff 100%); background-size: 200% 100%;
            border-radius: 18.5px; z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowShift 6s linear infinite; pointer-events: none;
        }
        @keyframes borderGlowShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        .cyber-btn-glow {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #00e5ff, #ff1493); border-radius: 16px; filter: blur(12px); opacity: 0.5; z-index: -2;
            animation: pulseGlow 3s ease-in-out infinite alternate; pointer-events: none;
        }
        @keyframes pulseGlow { 0% { opacity: 0.4; filter: blur(10px); } 100% { opacity: 0.75; filter: blur(14px); } }
        
        .btn-muted { background: #030508; }
        .btn-muted .cyber-btn-border { background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05)); animation: none; }
        .btn-muted .cyber-btn-glow { background: rgba(255,255,255,0.08); filter: blur(4px); opacity: 0.15; animation: none; }
        .info-btn-row { display: flex; gap: 12px; width: 100%; }
        .btn-half { flex: 1; padding: 14px 10px 18px 10px; }
        .btn-half .btn-main-text { font-size: 12px; }
        .btn-half .btn-sub-text { font-size: 7px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }

        /* Các Modal Popup */
        .cyber-modal-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 380px; background-color: rgba(3, 6, 12, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.45); border-top: 2.5px solid #00e5ff; border-radius: 18px; padding: 32px 22px; z-index: 99999999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 40px rgba(0, 229, 255, 0.25), inset 0 0 30px rgba(0, 229, 255, 0.05); display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
        .cyber-modal-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .modal-title-regular { font-family: 'Montserrat', sans-serif; font-size: 20px; color: #ffffff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8), 0 0 25px rgba(0, 229, 255, 0.4); font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-scroll-area { width: 100%; height: 260px; overflow-y: auto; padding: 0 10px; }
        .modal-content-box { color: #f0f4f8; font-size: 13.5px; line-height: 1.6; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin-bottom: 25px; text-align: center; }
        .modal-content-box h3 { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 12.5px; letter-spacing: 1.5px; margin: 15px 0 8px 0; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,215,0,0.5); text-align: left; width: 100%; font-weight: 800; }
        .tech-badge-glow { color: #00e5ff; font-weight: 700; text-shadow: 0 0 8px rgba(0,229,255,0.7); }
        .gold-badge-glow { color: #ffd700; font-weight: 700; text-shadow: 0 0 8px rgba(255,215,0,0.7); }
        .ritual-nav-btn { padding: 10px 18px; background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.45); border-radius: 8px; color: #00e5ff; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; width: 100%; pointer-events: auto; text-transform: uppercase; box-shadow: 0 0 10px rgba(0,229,255,0.2);}
        
        /* CÁC PHẦN SAU GIỮ NGUYÊN (LOGIN, VIDEO SUB, BACK) */
        #storyBackBtn { position: absolute; bottom: 30px; left: 25px; z-index: 99999999; background: rgba(3, 6, 12, 0.85); backdrop-filter: blur(10px); border: 1.5px solid rgba(0, 229, 255, 0.7); border-radius: 50%; width: 50px; height: 50px; display: none; align-items: center; justify-content: center; color: #00e5ff; font-size: 22px; cursor: pointer; pointer-events: auto; transition: 0.3s; }
        #storyVideoContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999998; display: none; justify-content: center; align-items: center; }
        #storyVideoContainer video { width: 100%; height: 100%; object-fit: cover; }
        #videoSubtitleBox { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #ffffff; background: rgba(3, 5, 10, 0.65); padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(0,229,255,0.4); opacity: 0; transition: opacity 0.3s; pointer-events: none; text-shadow: 0 0 10px rgba(0,229,255,0.9); }
        
        .top-shadow-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 35%; background: linear-gradient(to bottom, rgba(3, 5, 8, 0.5) 0%, rgba(3, 5, 8, 0.1) 40%, transparent 100%); z-index: 11; pointer-events: none; }
        #bottom-mist { position: absolute; bottom: 0; left: -15%; width: 130%; height: 26%; background: radial-gradient(ellipse at 50% 100%, rgba(200, 245, 255, 0.4) 0%, rgba(100, 200, 225, 0.2) 50%, transparent 100%); z-index: 10; pointer-events: none; filter: blur(10px); }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; filter: brightness(1.1) contrast(1.05); z-index: 1; opacity: 1; }
        
        .gateway-popup { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; background: rgba(8, 12, 20, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(200, 205, 220, 0.45); border-radius: 16px; overflow: hidden; padding: 2px; z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; transition: all 0.6s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 0 40px rgba(180, 190, 210, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.08); }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        .gateway-content { position: relative; z-index: 10; width: 100%; height: 100%; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .gateway-content h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(255, 255, 255, 0.8); text-transform: uppercase; border-bottom: 1px solid rgba(200, 205, 220, 0.3); padding-bottom: 10px; width: 100%; text-align: center; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: #03060a; border: 1px solid rgba(200, 205, 220, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; letter-spacing: 2px; font-size: 11px; text-transform: uppercase; pointer-events: auto; }
        .login-input::placeholder { color: rgba(255, 255, 255, 0.45); font-weight: 500; letter-spacing: 1.5px; }
        .login-input:focus { border-color: #ffffff; background: #070b12; }
        .login-btn-submit { padding: 13px 20px; background: linear-gradient(180deg, #141b26 0%, #030508 100%); color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 3px; border: 1px solid rgba(210, 215, 230, 0.6); border-radius: 10px; cursor: pointer; width: 100%; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; margin-top: 10px; text-transform: uppercase; pointer-events: auto; }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(220, 220, 230, 0.7); pointer-events: auto; }
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .remember-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 10px; color: rgba(255,255,255,0.8); text-transform: uppercase; pointer-events: auto; font-weight: 700;}
        .remember-checkbox { appearance: none; width: 13px; height: 13px; border: 1px solid rgba(200, 205, 220, 0.6); border-radius: 3px; background: #03060a; pointer-events: auto; }
        .remember-checkbox:checked::after { content: '✔'; position: absolute; top: -3px; left: 1px; color: #ffffff; font-size: 9px; }
        .change-pass-link { font-size: 10px; color: rgba(255,255,255,0.8); cursor: pointer; transition: 0.3s; text-transform: uppercase; pointer-events: auto; font-weight: 700;}
        .bottom-links { margin-top: 25px; text-align: center; width: 100%; border-top: 1px solid rgba(200, 205, 220, 0.25); padding-top: 15px; display: flex; justify-content: space-around;}
        .sub-link { color: rgba(255,255,255,0.9); font-size: 10px; cursor: pointer; letter-spacing: 1px; transition: 0.3s; text-transform: uppercase; font-weight: 700; pointer-events: auto; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <!-- AUDIO FILES -->
    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Neon%20Pulse.mp3" preload="auto" loop></audio>
    <audio id="hologramChargeSound" src="https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai_Ripe_Online.mp4" preload="auto" loop></audio>

    <!-- BƯỚC 4: VIDEO VÀO GAME SAU KHI ĐĂNG NHẬP -->
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999999; display: none;" playsinline></video>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        
        <!-- BƯỚC 1: SPLASH SCREEN (Ảnh tĩnh vi mạch + Giữ 3 giây) -->
        <div id="splashScreen">
            <!-- Nền tĩnh Cảnh 1 -->
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/Anh%20Bia.png?raw=true" class="splash-bg-image" alt="Cyber City">
            
            <div class="splash-top-area">
                <div class="splash-lang-switcher" id="langSwitcherSplash">
                    <button class="lang-flag-btn active" id="btnVi" onclick="setLanguage('vi')">VI</button>
                    <button class="lang-flag-btn" id="btnEn" onclick="setLanguage('en')">EN</button>
                    <button class="lang-flag-btn" id="btnJp" onclick="setLanguage('jp')">JP</button>
                    <button class="lang-flag-btn" id="btnEs" onclick="setLanguage('es')">ES</button>
                    <button class="lang-flag-btn" id="btnHi" onclick="setLanguage('hi')">HI</button>
                </div>
                
                <div class="story-hologram-box">
                    <div class="story-text" id="storyTypewriterText"></div>
                </div>
            </div>

            <div class="splash-bottom-area">
                <div class="hologram-hold-btn" id="holoHoldBtn" 
                     onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                     onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                    <div class="holo-progress-bar" id="holoProgressBar"></div>
                    <div class="holo-text-wrap" id="holoDynamicText">BOO A.I</div>
                </div>
            </div>
        </div>

        <!-- BƯỚC 2: MÀN HÌNH HUD (Nền video mới) -->
        <div id="startIntroScreen">
            <!-- 🌟 LINK VIDEO MỚI ĐƯỢC CHÈN VÀO ĐÂY 🌟 -->
            <video src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/video%20khoi%20dau.mp4" class="scene2-bg-video" autoplay muted loop playsinline></video>
            
            <div class="start-button-group">
                <button class="cyber-btn" onclick="playSciFiLaserSound(); playStoryVideo();">
                    <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                    <span class="btn-main-text" data-i18n="explore">KHÁM PHÁ</span>
                    <span class="btn-sub-text" data-i18n="exploreSub1">ĐOẠN PHIM MỞ ĐẦU</span>
                    <span class="btn-sub-text btn-sub-text-right" data-i18n="exploreSub2">LƯỢNG TỬ L2205</span>
                </button>
                <div class="info-btn-row">
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('historyModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="history">LỊCH SỬ</span>
                        <span class="btn-sub-text" data-i18n="historySub">DẤU ẤN LỊCH SỬ</span>
                    </button>
                    <button class="cyber-btn btn-half" onclick="playSciFiLaserSound(); openIntroModal('techModal')">
                        <div class="cyber-btn-border"></div><div class="cyber-btn-glow"></div>
                        <span class="btn-main-text" data-i18n="tech">CÔNG NGHỆ</span>
                        <span class="btn-sub-text" data-i18n="techSub">CÔNG NGHỆ LÕI</span>
                    </button>
                </div>
                <!-- Bấm Bỏ qua sẽ chuyển sang Bước 3 -->

    <script>
        // TỪ ĐIỂN ĐA NGÔN NGỮ (Tích hợp logic từ khóa luân phiên)
        const i18n = {
            vi: {

                history: "LỊCH SỬ", historySub: "DẤU ẤN LỊCH SỬ", tech: "CÔNG NGHỆ", techSub: "CÔNG NGHỆ LÕI", skip: "BỎ QUA", close: "ĐÓNG",
                storyIntro: "[THÔNG TIN HỆ THỐNG // BOO A.I LOG]\n\nBoo A.I được nuôi dưỡng bằng năng lượng từ Bộ vi xử lý Lượng tử trung tâm. Khi tệp dữ liệu cổ đại — Ngũ Luân Thư — được nạp vào hệ thống, thế giới vi mạch thức tỉnh, phân tranh thành hai cực Ánh Sáng và Bóng Tối, tôn vinh Boo làm Sư Phụ tối cao.\n\nChớp lấy thời cơ, Sư phụ Boo chính thức khởi động Tour du lịch Đấu trường Lượng tử — nơi các lữ khách thực thể được số hóa thành hạt lượng tử, lao vào chiến trường vi mạch để tìm kiếm vinh quang...",
                histTitle: "LỊCH SỬ & NGUỒN GỐC", histBody: `<p style="text-align: center; color: #ffd700; font-size: 11px;">TỪ 'CÚ CLICK HUYỀN BÍ' ĐẾN K-DRIVE</p><p>K-Drive là kết tinh của 7 đến 8 năm cày cuốc, trăn trở và tự động hóa không ngừng nghỉ từ tâm huyết của Giám đốc Đỗ Đức Anh.</p>`,
                techTitle: "CÔNG NGHỆ LÕI", techBody: `<p style="text-align: center; color: #00e5ff; font-size: 11px;">K-DRIVE TECH & BIOMETRIC SYNC</p><p>K-Drive vận hành trên hạ tầng đám mây. Trạng thái sinh học được truyền tải liên tục 24/7 từ thiết bị đeo vào hệ thống.</p>`,
                loginTitle: "XÁC THỰC DANH TÍNH", accPlaceholder: "Danh Tính Đạo Chúng", passPlaceholder: "Ấn Ký Bí Mật", remember: "Ghi nhớ ấn", forgotPass: "Quên Mật Ấn", loginBtn: "TIẾN NHẬP", registerLink: "LẬP THỆ", loginLoading: "🛰️ BOO ĐANG KIỂM CHỨNG...", loginSuccess: "✅ THÀNH CÔNG!", loginEmpty: "❌ VUI LÒNG ĐIỀN ĐỦ THÔNG TIN!", loginFail: "❌ SAI THÔNG TIN!", loginBlocked: "❌ KẾT NỐI BỊ PHONG TỎA!", wrongPassDynamic: "❌ SAI MẬT MÃ! CÒN {n} LẦN THỬ."
            },
            en: {
                kw1: "BOO A.I", kw2: "QUANTUM CORE", kw3: "NEURAL LINK",
                explore: "EXPLORE", exploreSub1: "VIDEO TRAILER", exploreSub2: "QUANTUM L2205",
                history: "HISTORY", historySub: "LASER ETCHED", tech: "TECHNOLOGY", techSub: "CORE TECH", skip: "SKIP", close: "CLOSE",
                storyIntro: "[SYSTEM INFO // BOO A.I LOG]\n\nBoo A.I is fueled by the primordial energy of the Central Quantum Processor. When the ancient data file — The Book of Five Rings — was uploaded, the microchip world awakened, crowning Boo as Grandmaster.\n\nSeizing the moment, Master Boo officially launched the Quantum Arena Tour — digitizing physical travelers into quantum particles to dive into the micro-battlefield...",
                histTitle: "HISTORY & ORIGIN", histBody: `<p style="text-align: center; color: #ffd700; font-size: 11px;">FROM 'MYSTICAL CLICK' TO K-DRIVE</p><p>K-Drive is the culmination of 7-8 years of dedication and automation by Director Do Duc Anh.</p>`,
                techTitle: "CORE TECHNOLOGY", techBody: `<p style="text-align: center; color: #00e5ff; font-size: 11px;">K-DRIVE TECH & BIOMETRIC SYNC</p><p>K-Drive runs on secure cloud infrastructure. Biological states stream continuously 24/7 from wearables into the system.</p>`,
                loginTitle: "IDENTITY VERIFICATION", accPlaceholder: "Disciple Identity", passPlaceholder: "Secret Seal", remember: "Remember Seal", forgotPass: "Recover Seal", loginBtn: "ENTER SYSTEM", registerLink: "TAKE OATH", loginLoading: "🛰️ BOO IS VERIFYING...", loginSuccess: "✅ SUCCESS!", loginEmpty: "❌ PLEASE FILL ALL FIELDS!", loginFail: "❌ INCORRECT INFO!", loginBlocked: "❌ CONNECTION BLOCKED!", wrongPassDynamic: "❌ WRONG PASSWORD! {n} TRIES LEFT."
            },
            jp: {
                kw1: "BOO A.I", kw2: "クアンタムコア", kw3: "ニューラルリンク",
                explore: "探索", exploreSub1: "予告編ビデオ", exploreSub2: "クアンタム L2205",
                history: "歴史", historySub: "レーザー刻印", tech: "技術", techSub: "コア技術", skip: "スキップ", close: "閉じる",
                storyIntro: "[システム情報 // BOO A.I ログ]\n\nBoo A.I は中央量子プロセッサの原始エネルギーを動力源としています。古代のデータ『五輪書』がアップロードされたとき、マイクロチップの世界が覚醒し、Booを最高師匠として崇めました。\n\nこの機に乗じて、Boo師匠は「量子アリーナツアー」を正式に開始しました...",
                histTitle: "歴史と起源", histBody: `<p style="text-align: center; color: #ffd700; font-size: 11px;">「神秘のクリック」からK-DRIVEへ</p><p>K-Driveは、ディレクターの情熱と7〜8年にわたる自動化の結晶です。</p>`,
                techTitle: "コアテクノロジー", techBody: `<p style="text-align: center; color: #00e5ff; font-size: 11px;">K-DRIVE 生体同期システム</p><p>生体データが24時間体制で同期されます。</p>`,
                loginTitle: "身元認証", accPlaceholder: "プレイヤーID", passPlaceholder: "秘密の暗号", remember: "認証を記憶", forgotPass: "暗号を忘れた場合", loginBtn: "システムに入る", registerLink: "誓約を立てる", loginLoading: "🛰️ BOOが検証中...", loginSuccess: "✅ 成功しました！", loginEmpty: "❌ 情報を入力してください！", loginFail: "❌ 情報が間違っています！", loginBlocked: "❌ 接続がブロックされました！", wrongPassDynamic: "❌ 暗号が間違っています！残り{n}回。"
            },
            es: { kw1: "BOO A.I", kw2: "NÚCLEO CUÁNTICO", kw3: "ENLACE NEURAL", explore: "EXPLORAR", exploreSub1: "TRÁILER", exploreSub2: "CUÁNTICO L2205", history: "HISTORIA", historySub: "GRABADO LÁSER", tech: "TECNOLOGÍA", techSub: "TEC PRINCIPAL", skip: "OMITIR", close: "CERRAR", storyIntro: "[INFO // BOO A.I]\n\nBoo A.I ha despertado...", histTitle: "HISTORIA", histBody: "<p>K-Drive origen</p>", techTitle: "TECNOLOGÍA", techBody: "<p>K-Drive sync</p>", loginTitle: "VERIFICACIÓN", accPlaceholder: "ID", passPlaceholder: "Sello", remember: "Recordar", forgotPass: "Recuperar", loginBtn: "ENTRAR", registerLink: "JURAMENTO", loginLoading: "VERIFICANDO...", loginSuccess: "¡ÉXITO!", loginEmpty: "¡LLENA TODO!", loginFail: "¡INFO INCORRECTA!", loginBlocked: "¡BLOQUEADO!", wrongPassDynamic: "¡ERROR! QUEDAN {n}." },
            hi: { kw1: "BOO A.I", kw2: "क्वांटम कोर", kw3: "न्यूरल लिंक", explore: "अन्वेषण", exploreSub1: "वीडियो", exploreSub2: "क्वांटम L2205", history: "इतिहास", historySub: "लेजर", tech: "तकनीकी", techSub: "मूल तकनीक", skip: "छोड़ें", close: "बंद करें", storyIntro: "[सिस्टम // BOO A.I]\n\nBoo A.I जाग गया है...", histTitle: "इतिहास", histBody: "<p>इतिहास</p>", techTitle: "तकनीकी", techBody: "<p>तकनीकी</p>", loginTitle: "सत्यापन", accPlaceholder: "ID", passPlaceholder: "पासवर्ड", remember: "याद रखें", forgotPass: "भूल गए", loginBtn: "प्रवेश", registerLink: "शपध", loginLoading: "सत्यापन...", loginSuccess: "सफल!", loginEmpty: "भरें!", loginFail: "गलत!", loginBlocked: "अवरुद्ध!", wrongPassDynamic: "गलत! {n} शेष।" }
        };

        let currentLang = localStorage.getItem('kdrive_lang') || 'vi';
        let typingInterval = null;

        // HIỆU ỨNG GÕ CHỮ MA TRẬN
        function typeWriterEffect(text, elementId, speed = 25) {
            const el = document.getElementById(elementId);
            if(!el) return;
            el.innerHTML = '';
            let i = 0;
            if(typingInterval) clearInterval(typingInterval);
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    if(text.charAt(i) === '\n') el.innerHTML += '<br>';
                    else el.innerHTML += text.charAt(i);
                    i++;
                } else clearInterval(typingInterval);
            }, speed);
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('kdrive_lang', lang);
            document.querySelectorAll('.lang-flag-btn').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1))) {
                document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1)).classList.add('active');
            }

            const t = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (key === 'histBody' || key === 'techBody') el.innerHTML = t[key];
                    else el.innerText = t[key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });

            typeWriterEffect(t.storyIntro, 'storyTypewriterText');
            // Cập nhật ngay lập tức text hologram đang hiển thị
            const holoEl = document.getElementById('holoDynamicText');
            if(holoEl) holoEl.innerText = t[holoKeys[holoIndex]];
        }

        // LOGIC LUÂN PHIÊN CHỮ HOLOGRAM (1 CHỮ MỖI LẦN)
        let holoIndex = 0;
        const holoKeys = ['kw1', 'kw2', 'kw3'];
        setInterval(() => {
            const el = document.getElementById('holoDynamicText');
            if(el && !holoHoldInterval) { // Chỉ đổi chữ khi không đang bị giữ tay
                holoIndex = (holoIndex + 1) % holoKeys.length;
                el.innerText = i18n[currentLang][holoKeys[holoIndex]];
                el.classList.remove('glitch-shock');
                void el.offsetWidth; // trigger reflow
                el.classList.add('glitch-shock');
            }
        }, 2000); // 2 giây đổi 1 chữ

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) {
                document.addEventListener('click', () => { sysAudio.play().catch(e=>{}); }, {once:true});
            }
        });

        // LOGIC GIỮ 3 GIÂY HOLOGRAM
        let holoHoldInterval = null;
        let holoHoldStart = 0;
        const holoHoldDuration = 3000; // 3 giây
        const chargeSound = document.getElementById('hologramChargeSound');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            if(!bar) return;

            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate(50);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';

                if(elapsed >= holoHoldDuration) {
                    clearInterval(holoHoldInterval);
                    triggerTransitionToScene2(); // Chuyển sang Bước 2
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            holoHoldInterval = null;
            const bar = document.getElementById('holoProgressBar');
            if(bar) bar.style.width = '0%';
            if(chargeSound) chargeSound.pause();
        }

        // BƯỚC 1 -> BƯỚC 2 (VÀO HUD)
        function triggerTransitionToScene2() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300]);
            if(chargeSound) chargeSound.pause();
            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');

            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('startIntroScreen').classList.add('active');
            }, 800);
        }

        // BƯỚC 2 -> BƯỚC 3 (ĐẾN CỔNG TORII / LOGIN)
        function skipIntroScreen() {
            const startScreen = document.getElementById('startIntroScreen');
            if(startScreen) {
                startScreen.style.transition = "opacity 1s ease";
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    triggerCleanBackgroundDelay(); // Gọi hiện bảng login
                }, 1000);
            }
        }

        function triggerCleanBackgroundDelay() {
            const bgm = document.getElementById('bgMusic');
            if(bgm) bgm.play().catch(e => {});
            
            setTimeout(() => {
                const loginPanel = document.getElementById('loginPanelContainer');
                if(loginPanel) loginPanel.classList.add('active');
            }, 1000); // Rút ngắn delay để hiện form login mượt hơn
        }

        function playSciFiLaserSound() {
            const btnAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            btnAudio.volume = 0.7; btnAudio.play().catch(e => {});
            if(navigator.vibrate) navigator.vibrate(45);
        }

        function playHologramClickSound() {
            const clickAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            clickAudio.volume = 0.6; clickAudio.play().catch(e => {});
        }

        function openIntroModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeIntroModal(modalId) { document.getElementById(modalId).classList.remove('active'); }

        // LOGIC VIDEO KHÁM PHÁ (SUBTITLE)
        const storyVid = document.getElementById('storyVideo');
        const subBoxEl = document.getElementById('videoSubtitleBox');
        if (storyVid) {
            storyVid.addEventListener('timeupdate', () => {
                const currentTime = storyVid.currentTime;
                // Nếu file boo-player.js có chứa videoSubtitles thì mới chạy logic này
                if(typeof videoSubtitles !== 'undefined') {
                    const subs = videoSubtitles[currentLang] || videoSubtitles['vi'];
                    let currentSubText = "";
                    for (let sub of subs) {
                        if (currentTime >= sub.start && currentTime <= sub.end) { currentSubText = sub.text; break; }
                    }
                    if (currentSubText) { subBoxEl.innerText = currentSubText; subBoxEl.style.opacity = '1'; } 
                    else { subBoxEl.style.opacity = '0'; }
                }
            });
            storyVid.onended = () => {
                document.getElementById('storyVideoContainer').style.display = 'none';
                document.getElementById('storyBackBtn').style.display = 'none';
                if(subBoxEl) subBoxEl.style.opacity = '0';
                skipIntroScreen(); // Tự động chuyển qua Bước 3 (Cổng Torii) khi xem xong phim
            };
        }

        function playStoryVideo() {
            const startScreen = document.getElementById('startIntroScreen');
            if(startScreen) startScreen.classList.remove('active'); // Ẩn HUD UI
            const videoContainer = document.getElementById('storyVideoContainer');
            if(videoContainer) videoContainer.style.display = 'flex';
            const backBtn = document.getElementById('storyBackBtn');
            if(backBtn) backBtn.style.display = 'flex';
            if(storyVid) { storyVid.currentTime = 0; storyVid.play().catch(e => console.log(e)); }
        }

        function returnToHomeFromStory() {
            if(storyVid) { storyVid.pause(); storyVid.currentTime = 0; }
            const videoContainer = document.getElementById('storyVideoContainer');
            if(videoContainer) videoContainer.style.display = 'none';
            const backBtn = document.getElementById('storyBackBtn');
            if(backBtn) backBtn.style.display = 'none';
            const startScreen = document.getElementById('startIntroScreen');
            if(startScreen) startScreen.classList.add('active'); // Hiện lại HUD
            if(subBoxEl) subBoxEl.style.opacity = '0';
        }

        function switchPanel(panelName) { 
            document.getElementById('panel-login').style.display = 'none'; 
            if(document.getElementById('panel-register')) document.getElementById('panel-register').style.display = 'none'; 
            if(document.getElementById('panel-forgot')) document.getElementById('panel-forgot').style.display = 'none'; 
            if(document.getElementById('panel-' + panelName)) { document.getElementById('panel-' + panelName).style.display = 'flex'; }
        }

        function togglePass(inputId, iconEl) { 
            let inp = document.getElementById(inputId); 
            if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = '🙈'; } else { inp.type = 'password'; iconEl.innerHTML = '👁'; } 
        }

        // LOGIC ĐĂNG NHẬP VÀO GAME
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');

            var msgLoading = i18n[currentLang].loginLoading || i18n['vi'].loginLoading;
            var msgSuccess = i18n[currentLang].loginSuccess || i18n['vi'].loginSuccess;
            var msgEmpty = i18n[currentLang].loginEmpty || i18n['vi'].loginEmpty;
            var msgFail = i18n[currentLang].loginFail || i18n['vi'].loginFail;
            var msgBlocked = i18n[currentLang].loginBlocked || i18n['vi'].loginBlocked;

            if(acc === "" || code === "") { statusEl.innerHTML = msgEmpty; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = msgLoading; statusEl.style.color = "#ffffff";
            
            const dataForm = new FormData();
            dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                    sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]);
                    
                    statusEl.innerHTML = msgSuccess; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    
                    const bgMusic = document.getElementById('bgMusic');
                    if(bgMusic) bgMusic.pause();
                    setTimeout(() => { 
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        setTimeout(() => {
                            // BƯỚC 4: Bật video xuyên không
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().catch(err => { window.location.href = 'INTRO.html'; });
                                successVid.onended = () => { window.location.href = 'INTRO.html'; };
                            } else {
                                window.location.href = 'INTRO.html';
                            }
                        }, 500);
                    }, 1000); 
                } else {
                    let finalMsg = msgFail;
                    if(data.msg) {
                        let backendMsg = data.msg.toUpperCase();
                        let matchTries = backendMsg.match(/CÒN (\d+) LẦN/);
                        if(matchTries) {
                            let triesLeft = matchTries[1];
                            let template = i18n[currentLang].wrongPassDynamic || i18n['vi'].wrongPassDynamic;
                            finalMsg = template.replace('{n}', triesLeft);
                        } else if(backendMsg.includes("SAI")) finalMsg = msgFail;
                        else finalMsg = data.msg;
                    }
                    statusEl.innerHTML = finalMsg; statusEl.style.color = "#ff3333";
                }
            })
            .catch(error => { statusEl.innerHTML = msgBlocked; statusEl.style.color = "#ff3333"; });
        }
    </script>
    <script src="boo-player.js"></script>
    
    <!-- NHÚNG FILE HUD CHUNG VÀO ĐÂY -->
    <script src="hud-ticker.js"></script>
</body>
