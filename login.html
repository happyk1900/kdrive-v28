<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>K-Drive</title>
    
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const statusEl = document.getElementById('loginStatus');
            if(statusEl) {
                statusEl.style.color = "#ff3333";
                statusEl.innerHTML = "CRASH GLOBAL: " + message;
            }
            return true;
        };
    </script>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#010a14">
    <link rel="apple-touch-icon" href="./k-icon-sci.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        
        body { 
            background-color: #010204; height: 100vh; height: 100dvh; width: 100vw; 
            display: flex; justify-content: center; align-items: center; margin: 0; 
            overflow: hidden; font-family: 'Montserrat', sans-serif; 
            opacity: 0; animation: fadeInBody 1.5s ease-in-out forwards;
        }
        @keyframes fadeInBody { to { opacity: 1; } }

        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            background: #010204; z-index: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease-in-out;
        }
        .kdrive-bg-target { 
            width: 100%; height: 100%; object-fit: contain; background-color: #010204; position: absolute; top: 0; left: 0; z-index: 2; 
            opacity: 1; transition: opacity 1.2s ease-in-out; 
        }

        /* BẢNG CHỌN NGÔN NGỮ - CĂN GIỮA TUYỆT ĐỐI MÀN HÌNH */
        .lang-gate-overlay {
            position: fixed; inset: 0; z-index: 999999; background: rgba(0, 0, 0, 0.4);
            display: flex; justify-content: center; align-items: center; 
            transition: opacity 1.2s ease-in-out, visibility 1.2s ease-in-out;
            opacity: 1; visibility: visible;
        }
        .lang-gate-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .lang-box {
            width: 90%; max-width: 320px; background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.4); border-radius: 14px; padding: 20px 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(255, 255, 255, 0.2); 
            text-align: center; color: #fff; z-index: 10; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            margin: auto; /* CĂN GIỮA CHUẨN XÁC */
            transition: transform 1s ease-in-out, opacity 1s ease-in-out;
        }
        .lang-gate-overlay.hidden .lang-box { transform: translateY(20px); opacity: 0; }

        .lang-title-area { 
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 800; color: #ffffff; margin-bottom: 15px; letter-spacing: 0.5px; 
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }
        
        .lang-grid-exact { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
        .lang-cell {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px; padding: 12px; font-size: 12px; font-weight: 700;
            color: #ffffff; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); transition: 0.2s;
        }
        .lang-cell:hover { background: rgba(255, 255, 255, 0.25); }
        .lang-cell.selected { border-color: #ffd700; background: rgba(255, 215, 0, 0.25); color: #fff; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        
        .lang-footer-btns { display: flex; gap: 8px; }
        .btn-close-lang { flex: 1; background: rgba(200, 0, 50, 0.4); border: 1px solid rgba(255, 100, 100, 0.5); color: #ffcccc; padding: 10px; border-radius: 6px; font-weight: 800; font-size: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-confirm-lang { flex: 1; background: rgba(255, 215, 0, 0.8); border: 1px solid #ffd700; color: #000; padding: 10px; border-radius: 6px; font-weight: 900; font-size: 10px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 10px rgba(255,215,0,0.4); transition: 0.3s; }

        .gateway-container {
            position: relative; width: 85%; max-width: 270px; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transform: translateY(15px); transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            margin-top: 15vh;
        }
        .gateway-container.show-login { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .google-auth-btn-img {
            width: 100%; max-width: 170px; height: auto; cursor: pointer;
            filter: grayscale(1) brightness(0.4); opacity: 0.3; pointer-events: none; transition: 0.8s ease-in-out;
            position: relative; z-index: 999999;
        }
        .google-auth-btn-img.unlocked {
            opacity: 1; filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.9));
            animation: buttonBreathe 2.5s infinite ease-in-out; pointer-events: auto !important;
        }
        @keyframes buttonBreathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.5)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.95)); }
        }

        .terms-box-container {
            position: relative; width: 100%; margin-top: 12px;
            background: rgba(3, 9, 22, 0.85); border: 1.5px solid rgba(0, 229, 255, 0.45);
            border-radius: 8px; padding: 8px 10px; display: flex; align-items: flex-start; gap: 8px; backdrop-filter: blur(8px);
        }
        .terms-checkbox {
            appearance: none; -webkit-appearance: none; width: 16px; height: 16px;
            border: 1.5px solid #00e5ff; border-radius: 3px; background: rgba(0, 0, 0, 0.6); cursor: not-allowed; margin-top: 1px; flex-shrink: 0;
            position: relative; transition: 0.3s;
        }
        .terms-checkbox.enabled { cursor: pointer; }
        .terms-checkbox:checked { background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
        .terms-checkbox:checked::after { content: '✔'; position: absolute; top: -2px; left: 2px; font-size: 10px; color: #000; font-weight: bold; }
        .terms-text { color: #b0e0e6; font-size: 9.5px; font-family: 'Montserrat', sans-serif; line-height: 1.35; white-space: nowrap; }
        .terms-link { color: #ffd700; text-decoration: underline; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .nowrap-text { white-space: nowrap; display: inline-block; }
        
        #loginStatus { 
            margin-top: 10px; font-weight: 700; text-align: center; font-size: 9.5px; 
            color: #00e5ff; min-height: 40px; text-shadow: 0 0 8px rgba(0,229,255,0.6); 
            width: 100%; background: rgba(0,0,0,0.5); border-radius: 4px; padding: 5px;
            word-wrap: break-word; line-height: 1.4; transition: opacity 0.5s;
        }

        /* GIAO DIỆN TỜ GIẤY A4 TRẮNG */
        .terms-modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 9999999;
            display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.4s ease-in-out; padding: 15px;
        }
        .terms-modal-overlay.active { opacity: 1; visibility: visible; }
        .terms-paper-a4 {
            width: 100%; max-width: 420px; height: 85vh; background: #ffffff; color: #111111;
            border-radius: 8px; padding: 20px 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; transform: translateY(30px); opacity: 0; transition: 0.4s ease-in-out;
        }
        .terms-modal-overlay.active .terms-paper-a4 { transform: translateY(0); opacity: 1; }
        .terms-paper-header { text-align: center; border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 10px; }
        .terms-paper-header h2 { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; color: #000; text-transform: uppercase; margin-bottom: 2px; line-height: 1.3; }
        .terms-paper-header p { font-size: 8.5px; color: #555; line-height: 1.4; }
        
        .terms-paper-body { flex: 1; overflow-y: auto; font-family: 'Space Grotesk', sans-serif; font-size: 11px; line-height: 1.6; color: #222; text-align: justify; padding-right: 5px; }
        .terms-paper-body h4 { font-size: 11.5px; font-weight: 800; color: #000; margin-top: 10px; margin-bottom: 3px; }
        
        .terms-paper-footer { border-top: 1px solid #ddd; padding-top: 10px; margin-top: 8px; text-align: center; }
        .terms-agree-btn { width: 100%; padding: 11px; background: #000; border: none; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 11px; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .terms-agree-btn:active { transform: scale(0.97); background: #333; }

        #successVideo { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            object-fit: cover; z-index: 9999999; display: none; background: #000; 
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="bgMusic" src="https://raw.githubusercontent.com/happyk1900/HOSOGOC/main/K_Drive_Initialized.mp3" preload="auto" loop></audio>
    <video id="successVideo" src="https://github.com/happyk1900/Kai-Ripe/raw/refs/heads/main/no%20audio%20-%20kich%20hoat%20loi%20trung%20tam.mp4" preload="auto" muted playsinline webkit-playsinline style="pointer-events: none;"></video>

    <!-- BẢNG CHỌN NGÔN NGỮ (CĂN GIỮA MÀN HÌNH) -->
    <div class="lang-gate-overlay" id="langGateModal" style="display: flex;">
        <div class="lang-box">
            <div class="lang-title-area" id="txtLangTitle">CHỌN NGÔN NGỮ</div>
            <div class="lang-grid-exact">
                <div class="lang-cell selected" onclick="selectLangCell('vi', this)">🇻🇳 Tiếng Việt</div>
                <div class="lang-cell" onclick="selectLangCell('en', this)">🇬🇧 English</div>
            </div>
            <div class="lang-footer-btns">
                <button class="btn-close-lang" id="btnCloseLang" onclick="closeLangModal()">ĐÓNG LẠI</button>
                <button class="btn-confirm-lang" id="btnConfirmLang" onclick="confirmLanguage()">ĐỒNG Ý</button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐIỀU KHOẢN DỊCH VỤ - A4 TRẮNG -->
    <div class="terms-modal-overlay" id="termsModal">
        <div class="terms-paper-a4">
            <div class="terms-paper-header">
                <h2 id="termsHeaderTitle">ĐIỀU KHOẢN DỊCH VỤ VÀ CHÍNH SÁCH BẢO MẬT K-DRIVE</h2>
                <p id="termsHeaderSub">Chủ quản: Telepathy Company | MST: [Đang cập nhật]<br>Email hỗ trợ: support@telepathycompany.com | Trụ sở: Hà Nội, Việt Nam</p>
            </div>
            <div class="terms-paper-body" id="termsBodyContent"></div>
            <div class="terms-paper-footer">
                <button class="terms-agree-btn" onclick="closeTermsModal()" id="txtAgreeTermsBtn">ĐÃ ĐỌC & ĐỒNG Ý</button>
            </div>
        </div>
    </div>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        <img id="bgImageElement" src="" class="kdrive-bg-target" alt="BG" style="opacity: 0;">
        <div class="gateway-container" id="loginPanelContainer">
            <img src="https://github.com/happyk1900/Kai-Ripe/blob/main/gmail%20login.png?raw=true" class="google-auth-btn-img" id="googleBtn" onclick="window.triggerNativeLogin()" alt="Google Login">
            <div class="terms-box-container">
                <input type="checkbox" class="terms-checkbox" id="termsCheck" disabled onchange="toggleTermsAgreement()">
                <div class="terms-text" id="txtTermsLabel">
                    Tôi đồng ý với <span class="terms-link" onclick="openTermsModal()">Điều khoản dịch vụ</span> của <span class="nowrap-text">K-DRIVE</span>.
                </div>
            </div>
            <div id="loginStatus">[HỆ THỐNG ĐANG KHỞI ĐỘNG...]</div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('loginStatus');
        let hasReadTerms = false;
        const preloadedLoginBg = new Image();
        preloadedLoginBg.src = "https://github.com/happyk1900/Kai-Ripe/blob/main/loi%20trung%20tam.png?raw=true";
        
        const langGateBg = new Image();
        langGateBg.src = "https://github.com/happyk1900/Kai-Ripe/blob/main/k-ngon%20ngu.png?raw=true";

        const translations = {
            vi: {
                langTitle: "CHỌN NGÔN NGỮ", close: "ĐÓNG LẠI", confirm: "ĐỒNG Ý",
                terms: 'Tôi đồng ý với <span class="terms-link" onclick="openTermsModal()">Điều khoản dịch vụ</span> của <span class="nowrap-text">K-DRIVE</span>.',
                agreeBtn: "ĐÃ ĐỌC & ĐỒNG Ý", nativeReady: "[HỆ THỐNG NATIVE SẴN SÀNG]",
                tTitle: "ĐIỀU KHOẢN DỊCH VỤ VÀ CHÍNH SÁCH BẢO MẬT K-DRIVE", 
                tSub: "Chủ quản: Telepathy Company | MST: [Đang cập nhật]<br>Email hỗ trợ: support@telepathycompany.com | Trụ sở: Hà Nội, Việt Nam",
                tBody: `
                    <h4>1. Chấp Thuận Điều Khoản & Pháp Lý</h4>
                    <p>Bằng việc truy cập, đăng ký tài khoản hoặc sử dụng hệ sinh thái ứng dụng <span class="nowrap-text">K-DRIVE</span> (bao gồm Sức Mạnh, Trí Nhớ, Phản Xạ, Phán Đoán và Đạo Trường Vô Ngã), bạn xác nhận đã đọc, hiểu và đồng ý tuân thủ toàn bộ quy định pháp lý này. Ứng dụng tuân thủ nghiêm ngặt pháp luật nước CHXHCN Việt Nam và các tiêu chuẩn quốc tế.</p>
                    <h4>2. Bản Chất Dịch Vụ & Miễn Trách Y Tế</h4>
                    <p>• <span class="nowrap-text">K-DRIVE</span> là nền tảng công nghệ hỗ trợ theo dõi sinh trắc học cá nhân, đo lường phản xạ và rèn luyện kỷ luật thể chất - tinh thần.</p>
                    <p>• Ứng dụng <b>không phải thiết bị y tế chuyên dụng</b>, không cung cấp chẩn đoán y khoa, điều trị hay phòng ngừa bệnh lý.</p>
                    <p>• Người dùng có trách nhiệm tham khảo ý kiến bác sĩ trước khi thực hiện các bài tập vận động cường độ cao.</p>
                    <h4>3. Chia Sẻ Vị Trí Ẩn Danh (Radar Lượng Tử)</h4>
                    <p>• Tính năng quét định vị hỗ trợ kết nối cộng đồng chiến binh trong bán kính an toàn.</p>
                    <p>• Tọa độ định vị được mã hóa ẩn danh một chiều trên thiết bị, không lưu vết vĩnh viễn trên máy chủ và tự động hủy sau khi quét.</p>
                    <h4>4. Tài Khoản, Bảo Mật & Ẩn Danh Hóa (Masking)</h4>
                    <p>• Bạn có trách nhiệm bảo mật thông tin tài khoản đăng nhập (như Google/Gmail) trên thiết bị cá nhân.</p>
                    <p>• Hệ thống ứng dụng thuật toán ẩn danh hóa một phần (Masking) – ví dụ hiển thị dạng <code>kai****@gmail.com</code> – nhằm bảo vệ tuyệt đối danh tính khách hàng.</p>
                    <h4>5. Nghĩa Vụ Đóng Thuế & Tuân Thủ Pháp Luật</h4>
                    <p>• Mọi dịch vụ trả phí, gói hội viên định kỳ tuân thủ đầy đủ nghĩa vụ thuế và pháp luật thương mại điện tử hiện hành.</p>
                    <p>• Người dùng cam kết không sử dụng ứng dụng vào mục đích vi phạm pháp luật hoặc xâm phạm an ninh mạng.</p>
                    <h4>6. Gói Hội Viên & Thanh Toán Định Kỳ</h4>
                    <p>• Các tính năng nâng cao áp dụng mô hình đăng ký hội viên định kỳ (<b>Thu phí hàng tháng</b> qua App Store / Google Play Store).</p>
                    <p>• Khoản phí tự động gia hạn trừ khi hủy trước ít nhất 24 giờ trong cài đặt tài khoản cửa hàng.</p>
                    <h4>7. Sở Hữu Trí Tuệ & Giới Hạn Trách Nhiệm</h4>
                    <p>• Mã nguồn, giao diện UI/UX, âm thanh chiptune và văn bản triết lý thuộc quyền sở hữu độc quyền của Telepathy Company.</p>
                    <p>• Hệ thống cung cấp trên cơ sở nguyên trạng, miễn trách nhiệm đối với sự cố gián đoạn mạng khách quan.</p>
                `
            },
            en: {
                langTitle: "SELECT LANGUAGE", close: "CLOSE", confirm: "AGREE",
                terms: 'I agree to the <span class="terms-link" onclick="openTermsModal()">Terms of Service</span> of <span class="nowrap-text">K-DRIVE</span>.',
                agreeBtn: "READ & AGREE", nativeReady: "[SYSTEM READY]",
                tTitle: "K-DRIVE TERMS OF SERVICE & PRIVACY POLICY", 
                tSub: "Managing Entity: Telepathy Company | Tax ID: [Pending]<br>Support Email: support@telepathycompany.com | Headquarters: Hanoi, Vietnam",
                tBody: `
                    <h4>1. Acceptance of Terms & Legal</h4>
                    <p>By accessing, registering an account, or using the <span class="nowrap-text">K-DRIVE</span> application ecosystem (including Strength, Memory, Reflex, Judgment, and Mushin Dojo), you confirm that you have read, understood, and agreed to comply with all these legal regulations.</p>
                    <h4>2. Service Nature & Medical Disclaimer</h4>
                    <p>• <span class="nowrap-text">K-DRIVE</span> is a technology platform supporting personal biometric tracking, reflex measurement, and discipline training.</p>
                    <p>• The app is <b>not a specialized medical device</b> and does not provide medical diagnoses, treatments, or disease preventions.</p>
                    <p>• Users are responsible for consulting a physician before performing high-intensity workouts.</p>
                    <h4>3. Anonymous Location Sharing (Quantum Radar)</h4>
                    <p>• The location scanning feature helps connect warrior communities within a safe radius.</p>
                    <p>• Location coordinates are one-way anonymously encrypted on the device, never permanently stored on servers, and automatically deleted after scanning.</p>
                    <h4>4. Account, Security & Masking</h4>
                    <p>• You are responsible for securing your login account information (such as Google/Gmail) on your personal device.</p>
                    <p>• The system applies partial masking algorithms (e.g., <code>kai****@gmail.com</code>) to absolutely protect user identity.</p>
                    <h4>5. Tax Obligations & Law Compliance</h4>
                    <p>• All paid services and recurring subscriptions fully comply with current tax obligations and e-commerce laws.</p>
                    <p>• Users commit not to use the application for unlawful purposes or cyber security violations.</p>
                    <h4>6. Membership & Subscription</h4>
                    <p>• Advanced features apply a recurring subscription model (<b>Monthly billing</b> via App Store / Google Play Store).</p>
                    <p>• Fees automatically renew unless canceled at least 24 hours prior in store account settings.</p>
                    <h4>7. Intellectual Property & Limitation of Liability</h4>
                    <p>• Source code, UI/UX, chiptune audio, and philosophical texts are the exclusive property of Telepathy Company.</p>
                    <p>• The system is provided "as is", disclaiming liability for objective network interruptions.</p>
                `
            }
        };

        function getTranslation(lang) {
            return translations[lang] || translations['vi'];
        }

        function applyLanguageUI(lang) {
            const t = getTranslation(lang);
            document.getElementById('txtLangTitle').innerText = t.langTitle;
            document.getElementById('btnCloseLang').innerText = t.close;
            document.getElementById('btnConfirmLang').innerText = t.confirm;

            document.getElementById('txtTermsLabel').innerHTML = t.terms;
            document.getElementById('txtAgreeTermsBtn').innerText = t.agreeBtn;
            document.getElementById('termsHeaderTitle').innerText = t.tTitle;
            document.getElementById('termsHeaderSub').innerHTML = t.tSub;
            document.getElementById('termsBodyContent').innerHTML = t.tBody;
            
            if(!hasReadTerms) {
                statusEl.innerHTML = t.nativeReady;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('kdrive_lang') || 'vi';
            applyLanguageUI(savedLang);

            const agreedBefore = localStorage.getItem('kdrive_terms_agreed');
            if (agreedBefore === 'true') {
                hasReadTerms = true;
                const checkbox = document.getElementById('termsCheck');
                checkbox.removeAttribute('disabled');
                checkbox.classList.add('enabled');
                checkbox.checked = true;
                document.getElementById('googleBtn').classList.add('unlocked');
            }

            langGateBg.onload = () => {
                const bgImg = document.getElementById('bgImageElement');
                bgImg.src = langGateBg.src;
                bgImg.style.opacity = '1';
                document.getElementById('langGateModal').style.display = 'flex';
                document.getElementById('langGateModal').classList.remove('hidden');
                document.getElementById('langGateModal').style.opacity = '1';
            };

            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuth) {
                window.GoogleAuthPlugin = window.Capacitor.Plugins.GoogleAuth;
                try {
                    window.GoogleAuthPlugin.initialize({
                        clientId: '159440914562-t22urib5q48l2orf9pg5fla7npqjj6mt.apps.googleusercontent.com',
                        scopes: ['profile', 'email'],
                        grantOfflineAccess: true
                    });
                    statusEl.innerHTML = getTranslation(savedLang).nativeReady;
                    statusEl.style.color = "#00ffcc";
                } catch (e) {
                    statusEl.innerHTML = "<span style='color:red'>LỖI KHỞI TẠO: " + e.message + "</span>";
                }
            } else {
                statusEl.innerHTML = "<span style='color:#00ffcc'>" + getTranslation(savedLang).nativeReady + "</span>";
            }
        });

        window.triggerNativeLogin = async function() {
            const checkbox = document.getElementById('termsCheck');
            if (!checkbox.checked) {
                statusEl.style.opacity = '0';
                setTimeout(() => {
                    statusEl.style.color = "#ff3333";
                    statusEl.innerText = "⚠️ BẠN PHẢI ĐỌC VÀ TÍCH ĐỒNG Ý ĐIỀU KHOẢN!";
                    statusEl.style.opacity = '1';
                }, 300);
                return;
            }

            statusEl.style.opacity = '0';
            setTimeout(() => {
                statusEl.style.color = "#ffff00";
                statusEl.innerHTML = "Đang đồng bộ phiên định danh...";
                statusEl.style.opacity = '1';
            }, 300);

            try {
                let userEmail = "kai.driver@gmail.com";
                let userName = "Chiến binh K-Drive";

                if (window.GoogleAuthPlugin) {
                    const googleUser = await window.GoogleAuthPlugin.signIn();
                    if (googleUser) {
                        userEmail = googleUser.email || userEmail;
                        userName = googleUser.name || googleUser.givenName || userName;
                    }
                }

                let maskedEmail = userEmail;
                if (userEmail.includes('@')) {
                    let parts = userEmail.split('@');
                    let namePart = parts[0];
                    let hiddenName = namePart.length > 2 ? namePart.substring(0, 2) + "****" : "****";
                    maskedEmail = hiddenName + "@" + parts[1];
                }

                statusEl.style.color = "#00ffcc";
                statusEl.innerHTML = `✅ XIN CHÀO: ${maskedEmail}`;
                
                localStorage.setItem('kdrive_session', 'active');
                localStorage.setItem('kdrive_terms_agreed', 'true');
                localStorage.setItem('kdrive_logged_in_user', userName);
                localStorage.setItem('kdrive_user_email', maskedEmail);
                
                const mainWrapper = document.getElementById('mainWrapper');
                const successVid = document.getElementById('successVideo');
                
                // HIỆU ỨNG CHUYỂN CẢNH MƯỢT MÀ VÀ BỘ ĐẾM AN TOÀN CHỐNG TREO VIDEO
                setTimeout(() => {
                    mainWrapper.style.opacity = '0';
                    if(successVid) {
                        successVid.style.display = 'block'; 
                        setTimeout(() => { successVid.style.opacity = '1'; }, 100);
                        
                        let hasNavigated = false;
                        const goToMain = () => {
                            if (!hasNavigated) {
                                hasNavigated = true;
                                window.location.href = 'LucChien.html';
                            }
                        };

                        successVid.play().then(() => { 
                            successVid.onended = goToMain;
                            // BỘ ĐẾM AN TOÀN (FALLBACK TIMER): SAU 4 GIÂY NẾU VIDEO GẶP SỰ CỐ VẪN TỰ ĐỘNG BAY VÀO LỰC CHIẾN
                            setTimeout(goToMain, 4000);
                        }).catch(err => { 
                            goToMain(); 
                        });
                    } else { 
                        setTimeout(() => { window.location.href = 'LucChien.html'; }, 1000);
                    }
                }, 800);
                
            } catch (error) {
                statusEl.style.color = "#ff3333";
                statusEl.innerHTML = "❌ LỖI ĐĂNG NHẬP:<br>" + (error.message || JSON.stringify(error));
            }
        };
    </script>

    <script>
        let selectedLangChoice = localStorage.getItem('kdrive_lang') || 'vi';

        function selectLangCell(lang, cell) {
            selectedLangChoice = lang;
            document.querySelectorAll('.lang-cell').forEach(c => c.classList.remove('selected'));
            cell.classList.add('selected');
            applyLanguageUI(lang);
        }

        function confirmLanguage() {
            localStorage.setItem('kdrive_lang', selectedLangChoice);
            applyLanguageUI(selectedLangChoice);

            const bgm = document.getElementById('bgMusic');
            if (bgm) { bgm.volume = 1.0; bgm.play().catch(e => {}); }

            const gateModal = document.getElementById('langGateModal');
            gateModal.style.opacity = '0';
            
            setTimeout(() => {
                gateModal.classList.add('hidden');
                gateModal.style.display = 'none';
                
                const bgImg = document.getElementById('bgImageElement');
                if (bgImg) { 
                    bgImg.style.opacity = '0';
                    setTimeout(() => {
                        bgImg.src = preloadedLoginBg.src;
                        bgImg.style.opacity = '1';
                        
                        setTimeout(() => {
                            const loginPanel = document.getElementById('loginPanelContainer');
                            if (loginPanel) loginPanel.classList.add('show-login');
                        }, 800);
                    }, 1000);
                }
            }, 1000);
        }

        function closeLangModal() { confirmLanguage(); }

        function openTermsModal() { 
            document.getElementById('termsModal').classList.add('active'); 
        }

        function closeTermsModal() { 
            document.getElementById('termsModal').classList.remove('active');
            hasReadTerms = true;
            const checkbox = document.getElementById('termsCheck');
            checkbox.removeAttribute('disabled');
            checkbox.classList.add('enabled');
            checkbox.checked = true;
            localStorage.setItem('kdrive_terms_agreed', 'true');
            toggleTermsAgreement();
        }

        function toggleTermsAgreement() {
            const checkbox = document.getElementById('termsCheck');
            const googleBtn = document.getElementById('googleBtn');
            if (checkbox.checked && hasReadTerms) {
                googleBtn.classList.add('unlocked');
            } else {
                googleBtn.classList.remove('unlocked');
            }
        }
    </script>
</body>
</html>
