<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Telepathy K-Drive</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#010a14">
    <link rel="apple-touch-icon" href="./k-icon-sci.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #010204; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        .kdrive-image-wrapper { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            background: #010204; 
            z-index: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .kdrive-bg-target { 
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; 
            opacity: 1; transition: opacity 0.5s ease-in-out; 
        }

        #cinematic-welcome {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; text-align: center; z-index: 5;
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.7;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.9), 0 0 40px rgba(0, 229, 255, 0.5), 0 0 60px rgba(176, 38, 255, 0.4);
            letter-spacing: 1px;
            opacity: 0; visibility: hidden; transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }
        #cinematic-welcome.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1.02); }

        .lang-gate-overlay {
            position: fixed; inset: 0; z-index: 999999; background: transparent;
            display: flex; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            opacity: 1; visibility: visible;
        }
        .lang-gate-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .lang-box {
            width: 90%; max-width: 325px; background: rgba(2, 12, 24, 0.88);
            border: 2px solid #00e5ff; border-radius: 14px; padding: 16px 12px;
            box-shadow: 0 0 35px rgba(0,229,255,0.45), inset 0 0 15px rgba(0,229,255,0.15); 
            text-align: center; color: #fff; z-index: 10;
            backdrop-filter: blur(3px);
        }
        .lang-title-area {
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 800;
            color: #ffd700; margin-bottom: 8px; letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        .alien-box-container {
            width: 100%; height: 36px; background: rgba(0, 15, 30, 0.6);
            border: 1.5px solid rgba(0, 229, 255, 0.3); border-radius: 6px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 8px;
            cursor: pointer;
        }
        .alien-emblem { font-size: 18px; filter: drop-shadow(0 0 6px #00ffff); }
        .lang-grid-exact { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 12px; }
        .lang-cell {
            background: rgba(0, 15, 30, 0.65); border: 1.5px solid rgba(0, 229, 255, 0.25);
            border-radius: 6px; padding: 7px 8px; font-size: 10px; font-weight: 700;
            color: #b0e0e6; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .lang-cell.selected { border-color: #ffd700; background: rgba(0, 229, 255, 0.2); color: #fff; }
        .lang-footer-btns { display: flex; gap: 8px; }
        .btn-close-lang {
            flex: 1; background: rgba(140, 0, 30, 0.3); border: 1.5px solid #ff3344;
            color: #ff6677; padding: 9px; border-radius: 6px; font-weight: 800; font-size: 9.5px; cursor: pointer;
        }
        .btn-confirm-lang {
            flex: 1; background: #ffd700; border: 1.5px solid #ffea00;
            color: #000; padding: 9px; border-radius: 6px; font-weight: 900; font-size: 9.5px; cursor: pointer;
        }

        .gateway-container {
            position: relative; width: 85%; max-width: 270px; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transform: scale(0.95); transition: opacity 1s ease, transform 1s ease;
        }
        .gateway-container.show-login { opacity: 1; pointer-events: auto; transform: scale(1); }
        .gateway-container.glitching { animation: glitchAnim 0.3s infinite alternate; }
        @keyframes glitchAnim {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
            100% { transform: translate(-3px, 2px) scale(1.02); filter: hue-rotate(90deg); }
        }

        .google-auth-btn-img {
            width: 100%; max-width: 170px; height: auto; cursor: pointer;
            filter: grayscale(1) brightness(0.4); opacity: 0.4; pointer-events: none; transition: 0.5s ease;
        }
        .google-auth-btn-img.unlocked {
            opacity: 1; filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7));
            animation: buttonBreathe 2.2s infinite ease-in-out; pointer-events: auto !important;
        }
        @keyframes buttonBreathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.5)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.95)); }
        }

        .terms-box-container {
            position: relative; width: 100%; margin-top: 12px;
            background: rgba(3, 9, 22, 0.85); border: 1.5px solid rgba(0, 229, 255, 0.45);
            border-radius: 8px; padding: 8px 10px; display: flex; align-items: flex-start; gap: 8px;
        }
        .terms-checkbox {
            appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
            border: 1.5px solid #00e5ff; border-radius: 3px; background: rgba(0, 0, 0, 0.6); cursor: pointer; margin-top: 2px;
        }
        .terms-checkbox:checked { background: #00e5ff; }
        .terms-text { color: #b0e0e6; font-size: 9px; line-height: 1.35; }
        .terms-link { color: #ffd700; text-decoration: underline; cursor: pointer; font-weight: 700; }
        #loginStatus { margin-top: 10px; font-weight: 700; text-align: center; font-size: 10px; color: #00e5ff; min-height: 14px; }

        .terms-modal-overlay {
            position: fixed; inset: 0; background: rgba(1, 2, 4, 0.92); z-index: 9999999;
            display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 15px;
        }
        .terms-modal-overlay.active { opacity: 1; visibility: visible; }
        .terms-modal-content {
            width: 100%; max-width: 350px; max-height: 85vh; overflow-y: auto;
            background: rgba(6, 14, 26, 0.97); border: 2px solid #00e5ff; border-radius: 12px; padding: 18px; color: #e0f7fa; font-size: 11px;
        }
        .terms-close-btn { width: 100%; margin-top: 14px; padding: 10px; background: rgba(0, 229, 255, 0.2); border: 1px solid #00e5ff; color: #fff; font-weight: 800; border-radius: 6px; cursor: pointer; }

        #successVideo { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            object-fit: cover; z-index: 9999999; display: none; background: #000; 
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="bgMusic" src="https://raw.githubusercontent.com/happyk1900/HOSOGOC/main/K_Drive_Initialized.mp3" preload="auto" loop></audio>
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20GPS%20FULL.mp4" autoplay muted playsinline webkit-playsinline style="pointer-events: none;"></video>

    <!-- BẢNG CHỌN NGÔN NGỮ -->
    <div class="lang-gate-overlay" id="langGateModal">
        <div class="lang-box">
            <div class="lang-title-area">CHỌN NGÔN NGỮ QUỐC TẾ</div>
            <div class="alien-box-container"><div class="alien-emblem">👽</div></div>
            <div class="lang-grid-exact">
                <div class="lang-cell selected" onclick="selectLangCell('vi', this)">🇻🇳 Tiếng Việt</div>
                <div class="lang-cell" onclick="selectLangCell('en', this)">🇬🇧 English</div>
            </div>
            <div class="lang-footer-btns">
                <button class="btn-close-lang" onclick="closeLangModal()">ĐÓNG</button>
                <button class="btn-confirm-lang" onclick="confirmLanguage()">ĐỒNG Ý</button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐIỀU KHOẢN -->
    <div class="terms-modal-overlay" id="termsModal">
        <div class="terms-modal-content">
            <h3>QUY CHẾ K-DRIVE</h3>
            <p>Cam kết bảo mật sinh trắc học và tuân thủ quy chế thi đấu Telepathy tuyệt đối.</p>
            <button class="terms-close-btn" onclick="closeTermsModal()">ĐÃ HIỂU & ĐÓNG</button>
        </div>
    </div>

    <div class="kdrive-image-wrapper">
        <img id="bgImageElement" src="https://github.com/happyk1900/HOSOGOC/blob/main/k-ngon%20ngu.png?raw=true" class="kdrive-bg-target" alt="BG">
        <div id="cinematic-welcome"></div>
        <div class="gateway-container" id="loginPanelContainer">
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/NUT%20GMAIL%20CAT.png?raw=true" class="google-auth-btn-img" id="googleBtn" onclick="triggerGoogleOAuth()" alt="Google Login">
            <div class="terms-box-container">
                <input type="checkbox" class="terms-checkbox" id="termsCheck" disabled onchange="toggleTermsAgreement()">
                <div class="terms-text">
                    Tôi đồng ý với <span class="terms-link" onclick="openTermsModal()">Điều khoản dịch vụ</span>.
                </div>
            </div>
            <div id="loginStatus"></div>
        </div>
    </div>

    <!-- NATIVE GOOGLE AUTH & FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { GoogleAuth } from '@codetrix-studio/capacitor-google-auth';

        const firebaseConfig = {
            apiKey: "AIzaSyAeTj7tuGuB8RNireo5ElSR2COZ1R_-iew",
            authDomain: "kdrive-ef271.firebaseapp.com",
            projectId: "kdrive-ef271",
            storageBucket: "kdrive-ef271.firebasestorage.app",
            messagingSenderId: "159440914562",
            appId: "1:159440914562:web:2d06f2fe7d787ed2f8cc9b",
            measurementId: "G-VF03K864DM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        try {
            GoogleAuth.initialize();
        } catch (e) {
            console.log("GoogleAuth Init:", e);
        }

        window.triggerGoogleOAuth = async function() {
            const checkbox = document.getElementById('termsCheck');
            const statusEl = document.getElementById('loginStatus');

            if (!hasReadTerms || !checkbox.checked) {
                statusEl.innerText = "⚠️ BẠN PHẢI BẤM ĐỌC ĐIỀU KHOẢN!";
                openTermsModal();
                return;
            }

            const container = document.getElementById('loginPanelContainer');
            container.classList.add('glitching');
            statusEl.innerText = "⚡ KÍCH HOẠT NATIVE GOOGLE LOGIN...";

            try {
                const googleUser = await GoogleAuth.signIn();
                const idToken = googleUser.authentication.idToken;

                const credential = GoogleAuthProvider.credential(idToken);
                const result = await signInWithCredential(auth, credential);
                const user = result.user;

                sessionStorage.setItem('kdrive_session', 'active');
                sessionStorage.setItem('kdrive_username', user.displayName || 'Chiến binh K-Drive');
                localStorage.setItem('kdrive_logged_in_user', user.displayName || 'Chiến binh K-Drive');
                localStorage.setItem('kdrive_user_email', user.email || '');

                const successVid = document.getElementById('successVideo');
                if(successVid) {
                    successVid.style.display = 'block'; 
                    successVid.play().then(() => { 
                        successVid.onended = () => { window.location.href = 'LucChien.html'; };
                    }).catch(err => { window.location.href = 'LucChien.html'; });
                } else { 
                    window.location.href = 'LucChien.html'; 
                }
            } catch (error) {
                container.classList.remove('glitching');
                statusEl.innerText = "⚠️ ĐĂNG NHẬP THẤT BẠI. THỬ LẠI!";
                console.error("Native Auth Error:", error);
            }
        };
    </script>

    <script>
        let hasReadTerms = false;
        let selectedLangChoice = 'vi';

        const preloadedLoginBg = new Image();
        preloadedLoginBg.src = "https://github.com/happyk1900/HOSOGOC/blob/main/k%20login.png?raw=true";

        function selectLangCell(lang, cell) {
            selectedLangChoice = lang;
            document.querySelectorAll('.lang-cell').forEach(c => c.classList.remove('selected'));
            cell.classList.add('selected');
        }

        function confirmLanguage() {
            document.getElementById('bgMusic').play().catch(e => {});
            document.getElementById('langGateModal').classList.add('hidden');
            
            setTimeout(() => {
                const bgImg = document.getElementById('bgImageElement');
                bgImg.src = preloadedLoginBg.src;
                setTimeout(() => {
                    document.getElementById('loginPanelContainer').classList.add('show-login');
                }, 800);
            }, 500);
        }

        function closeLangModal() { confirmLanguage(); }

        function toggleTermsAgreement() {
            const checkbox = document.getElementById('termsCheck');
            const googleBtn = document.getElementById('googleBtn');
            if (checkbox.checked) {
                googleBtn.classList.add('unlocked');
                localStorage.setItem('kdrive_terms_agreed', 'true');
            } else {
                googleBtn.classList.remove('unlocked');
                localStorage.removeItem('kdrive_terms_agreed');
            }
        }

        function openTermsModal() { document.getElementById('termsModal').classList.add('active'); }
        function closeTermsModal() {
            document.getElementById('termsModal').classList.remove('active');
            hasReadTerms = true;
            const checkbox = document.getElementById('termsCheck');
            checkbox.disabled = false;
            checkbox.checked = true;
            toggleTermsAgreement();
        }
    </script>
</body>
</html>
