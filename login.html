<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Drive: Cổng không gian cyber</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        /* ================= SCENE 1: QUẦY VÉ (SPLASH SCREEN) ================= */
        #splashScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: #030508; z-index: 999999; 
            transition: opacity 0.8s ease-in-out;
            display: flex; flex-direction: column; align-items: center;
        }
        #splashScreen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        .splash-bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        /* 4 HỘP CHỨC NĂNG */
        .splash-boxes-container {
            position: absolute; bottom: 175px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 380px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; z-index: 10;
        }

        .cyber-box {
            position: relative;
            background: rgba(3, 8, 16, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 12px; padding: 18px 5px;
            text-align: center; cursor: pointer; pointer-events: auto; overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0, 229, 255, 0.1);
            transition: all 0.2s ease;
            animation: boxFloatGlow 3s ease-in-out infinite;
        }
        .cyber-box:active { transform: scale(0.95); background: rgba(0, 229, 255, 0.3); }

        .cyber-box:nth-child(1) { animation-delay: 0s; }
        .cyber-box:nth-child(2) { animation-delay: 0.4s; }
        .cyber-box:nth-child(3) { animation-delay: 0.8s; }
        .cyber-box:nth-child(4) { animation-delay: 1.2s; }

        @keyframes boxFloatGlow {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0, 229, 255, 0.1); border-color: rgba(0, 229, 255, 0.5); }
            50% { transform: translateY(-6px); box-shadow: 0 8px 25px rgba(0, 229, 255, 0.6), inset 0 0 15px rgba(0, 229, 255, 0.3); border-color: rgba(0, 255, 255, 1); }
        }

        .cyber-box::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg); animation: boxSweep 4s infinite; z-index: 1; pointer-events: none;
        }
        .cyber-box:nth-child(1)::before { animation-delay: 0s; }
        .cyber-box:nth-child(2)::before { animation-delay: 1s; }
        .cyber-box:nth-child(3)::before { animation-delay: 2s; }
        .cyber-box:nth-child(4)::before { animation-delay: 3s; }

        @keyframes boxSweep {
            0%, 80% { left: -150%; }
            100% { left: 200%; }
        }

        .cyber-text {
            position: relative; z-index: 2; display: inline-block;
            color: #00e5ff; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 13.5px;
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px rgba(0,229,255,0.8);
            animation: textGlitchSpark 3s infinite;
        }
        .cyber-box:nth-child(1) .cyber-text { animation-delay: 0.2s; }
        .cyber-box:nth-child(2) .cyber-text { animation-delay: 1.5s; }
        .cyber-box:nth-child(3) .cyber-text { animation-delay: 2.7s; }
        .cyber-box:nth-child(4) .cyber-text { animation-delay: 0.9s; }

        @keyframes textGlitchSpark {
            0%, 94%, 100% { color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,0.8); transform: skewX(0deg); }
            95% { color: #fff; text-shadow: -3px 0 #ff0055, 3px 0 #00e5ff; transform: skewX(-15deg); }
            97% { color: #00e5ff; text-shadow: 3px 0 #ff0055, -3px 0 #00e5ff; transform: skewX(10deg); }
            98% { color: #fff; text-shadow: 0 0 15px #fff; transform: skewX(0deg); }
        }

        /* NÚT GIỮ 3S ĐƯỢC ĐẨY LÊN VÀ TÍCH HỢP HIỆU ỨNG XOAY VÒNG 3 CÂU CHỮ */
        .splash-bottom-area {
            position: absolute; bottom: 105px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10;
        }
        .hologram-hold-btn {
            position: relative; width: 92%; max-width: 380px; padding: 18px 20px;
            background: rgba(3, 8, 16, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(0, 229, 255, 0.6); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; pointer-events: auto; 
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            transition: all 0.2s ease;
        }
        .hologram-hold-btn:active { transform: scale(0.98); }
        .hologram-hold-btn.electric-active { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.4); }
        
        .holo-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), rgba(0, 229, 255, 0.7));
            z-index: 1; transition: width 0.05s linear;
        }
        
        .holo-text-wrap {
            position: relative; z-index: 2; width: 100%; text-align: center; color: #00e5ff;
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0,229,255,0.8); text-transform: uppercase;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .holo-text-wrap.glitch-anim {
            opacity: 0;
            transform: scale(0.9) skewX(-15deg);
            color: #ff0055;
            text-shadow: -3px 0 #ff0055, 3px 0 #00e5ff;
        }

        /* ================= MODAL HIỂN THỊ NỘI DUNG (CAROUSEL) ================= */
        .info-modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999999; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease; pointer-events: none;
        }
        .info-modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .info-modal-content {
            width: 90%; max-width: 380px; background: rgba(5, 10, 18, 0.95);
            border: 1.5px solid #00e5ff; border-radius: 16px; padding: 25px 0 15px 0;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); transform: scale(0.9); transition: transform 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .info-modal-overlay.active .info-modal-content { transform: scale(1); }
        
        .info-modal-title { color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900; text-align: center; margin-bottom: 15px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,215,0,0.7); letter-spacing: 1px; }
        
        .carousel-track {
            display: flex; width: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
            scroll-behavior: smooth; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .slide-item {
            flex: 0 0 100%; width: 100%; padding: 0 20px; scroll-snap-align: center;
            color: #d0f0ff; font-size: 13.5px; line-height: 1.6; text-align: justify; font-family: 'Space Grotesk', sans-serif;
            min-height: 140px; display: flex; flex-direction: column; justify-content: center;
        }
        .slide-item b { color: #00e5ff; text-shadow: 0 0 5px rgba(0,229,255,0.4); }
        
        .carousel-dots { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
        .dot { width: 8px; height: 8px; background: rgba(0, 229, 255, 0.2); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: #00e5ff; width: 20px; border-radius: 4px; box-shadow: 0 0 8px #00e5ff; }

        .close-info-btn {
            width: 85%; padding: 12px; background: rgba(0, 229, 255, 0.15); border: 1px solid #00e5ff;
            color: #00e5ff; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; pointer-events: auto; transition: 0.3s;
        }
        .close-info-btn:hover { background: rgba(0, 229, 255, 0.3); color: #fff; }

        /* ================= SCENE 2: CỔNG TORII & LOGIN ================= */
        .kdrive-image-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; overflow: hidden; }
        
        .kdrive-bg-target { 
            width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; 
            z-index: 1; opacity: 0; visibility: hidden; transition: opacity 1.5s ease-in-out;
        }
        .kdrive-bg-target.active { opacity: 1; visibility: visible; }

        .gateway-popup { 
            position: absolute; top: 50%; left: 50%; width: 92%; max-width: 340px; 
            background: rgba(5, 8, 14, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(0, 229, 255, 0.45); border-radius: 16px; padding: 25px 20px; 
            z-index: 99999; opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; visibility: hidden; 
            transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); 
        }
        .gateway-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; visibility: visible; }
        
        .gateway-popup h2 { color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: 2px; margin-bottom: 22px; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); text-transform: uppercase; text-align: center; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; }
        .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
        .login-input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 10px; color: #ffffff; outline: none; text-align: center; font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; pointer-events: auto; }
        .login-input:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .login-btn-submit { width: 100%; padding: 13px 20px; background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 150, 255, 0.4)); color: #ffffff; font-weight: 900; font-size: 11px; letter-spacing: 3px; border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 10px; cursor: pointer; text-transform: uppercase; pointer-events: auto; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #00e5ff; pointer-events: auto; }
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .change-pass-link, .sub-link { color: #00e5ff; cursor: pointer; pointer-events: auto; }
        .bottom-links { margin-top: 25px; text-align: center; border-top: 1px solid rgba(0, 229, 255, 0.25); padding-top: 15px; }

        /* Video Bay Vào */
        #successVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999999; display: none; background: #000; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="sysAudio" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Vast%20Empty%20Atmosphere.mp3" preload="auto" loop></audio>
    <audio id="bgMusic" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai_Ripe_Online.mp4" preload="auto" loop></audio>
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20DANG%20NHAP.mp4" playsinline></video>

    <!-- ================= SCENE 1: QUẦY VÉ ================= -->
    <div id="splashScreen">
        <!-- Ảnh Quầy vé Boo -->
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/QUAY%20VE.png?raw=true" class="splash-bg-image" alt="Cyber City">
        
        <!-- 4 HỘP CHỨC NĂNG -->
        <div class="splash-boxes-container">
            <div class="cyber-box" onclick="openInfoModal('nhapmon')"><span class="cyber-text">ĐĂNG KÝ</span></div>
            <div class="cyber-box" onclick="openInfoModal('tongquan')"><span class="cyber-text">TỔNG QUAN</span></div>
            <div class="cyber-box" onclick="openInfoModal('luatchoi')"><span class="cyber-text">LUẬT CHƠI</span></div>
            <div class="cyber-box" onclick="openInfoModal('santhuong')"><span class="cyber-text">SĂN THƯỞNG</span></div>
        </div>

        <div class="splash-bottom-area">
            <!-- Nút giữ 3 giây xoay vòng 3 thông điệp -->
            <div class="hologram-hold-btn" id="holoHoldBtn" 
                 onmousedown="startHoloHold(event)" ontouchstart="startHoloHold(event)"
                 onmouseup="cancelHoloHold(event)" ontouchend="cancelHoloHold(event)" onmouseleave="cancelHoloHold(event)">
                <div class="holo-progress-bar" id="holoProgressBar"></div>
                <div class="holo-text-wrap" id="holoTextRotator">GIỮ 3 GIÂY ĐỂ VÀO</div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL HIỂN THỊ NỘI DUNG (CAROUSEL) ================= -->
    <div class="info-modal-overlay" id="infoModalOverlay">
        <div class="info-modal-content">
            <div class="info-modal-title" id="infoTitle">TIÊU ĐỀ</div>
            
            <div class="carousel-track" id="carouselTrack" onscroll="updateDots()">
                <!-- Các slide sẽ được render bằng JS vào đây -->
            </div>
            
            <div class="carousel-dots" id="carouselDots">
                <!-- Chấm điều hướng render bằng JS -->
            </div>
            
            <button class="close-info-btn" onclick="closeInfoModal()">ĐÓNG LẠI</button>
        </div>
    </div>

    <div class="kdrive-image-wrapper">
        <!-- ================= SCENE 2: CỔNG TORII & BẢNG LOGIN ================= -->
        <img src="https://raw.githubusercontent.com/happyk1900/-m-thanh-app/main/ANH%20DANG%20NHAP.png" id="bg-login" class="kdrive-bg-target">
        
        <div class="gateway-popup" id="loginPanelContainer">
            <div id="panel-login" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <h2>XÁC THỰC DANH TÍNH</h2>
                <div class="input-wrapper">
                    <input type="text" id="accInput" class="login-input" placeholder="Danh Tính Đạo Chúng">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="passcodeInput" class="login-input" placeholder="Ấn Ký Bí Mật">
                    <span class="eye-icon" onclick="togglePass('passcodeInput', this)">👁</span>
                </div>
                <div class="account-options-row">
                    <span style="color: rgba(255,255,255,0.7);">✔ GHI NHỚ ẤN</span>
                    <span class="change-pass-link">QUÊN MẬT ẤN</span>
                </div>
                <button class="login-btn-submit" onclick="playHologramClick(); submitLogin();">TIẾN NHẬP</button>
                <div id="loginStatus" style="margin-top: 15px; font-weight: 700; text-align: center; font-size: 10px; letter-spacing: 2px; color: #fff;"></div>
                <div class="bottom-links">
                    <span class="sub-link">LẬP THỆ TRUY CẬP</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU TEXT 4 HỘP (ĐÃ CẮT THÀNH TỪNG TRANG - SLIDE VỚI TIÊU ĐỀ RIÊNG BIỆT) ---
        const infoData = {
            nhapmon: { 
                title: "ĐỒNG BỘ SINH MỆNH", 
                slides: [
                    "Xác thực danh tính <b>Đạo chúng (vận động viên)</b> và kết nối mã số sinh trắc học cá nhân. Đây là bước đầu tiên để đưa cơ thể thực của bạn vào Không gian K-Drive.",
                    "<b>Bảo mật tối thượng:</b> Hạ tầng dữ liệu sinh mệnh được mã hóa và vận hành trên nền tảng điện toán đám mây lõi (<b>Powered by Google & Microsoft</b>), đảm bảo an toàn tuyệt đối.",
                    "Hãy chuẩn bị tâm thế! Mọi nỗ lực đổ mồ hôi của bạn ngoài đời thực sẽ được chuyển hóa thành quyền năng tuyệt đối trong game."
                ]
            },
            tongquan: { 
                title: "THẾ GIỚI LƯỢNG TỬ", 
                slides: [
                    "Chào mừng đến với đấu trường đối kháng sinh trắc học. Nơi cơ thể sinh học thực tế của bạn sẽ được số hóa trực tiếp thành sức mạnh vô song.",
                    "<b>Hệ sinh thái PRO (VIP):</b> Yêu cầu kết nối Đồng hồ (24/7) và Cân thông minh (1 lần/ngày). Dữ liệu sẽ đồng bộ thành <b>chỉ số thể chất SCI (Địa Luân)</b> để quyết định sức mạnh cốt lõi.",
                    "<b>Người chơi Phổ thông:</b> Không cần thiết bị. Vẫn tham gia thi đấu và tích lũy điểm thông qua các chỉ số trí lực: <b>Thủy Luân</b> (Trí nhớ), <b>Hỏa Luân</b> (Phản xạ) và <b>Phong Luân</b> (Phán đoán)."
                ]
            },
            luatchoi: { 
                title: "GIAO THỨC RÈN LUYỆN", 
                slides: [
                    "<b>Khối lập phương 6 mặt:</b><br><br>• <b>Địa Luân (PRO):</b> Rèn luyện thể chất cốt lõi ngoài đời thực (~30 phút/ngày).<br><br>• <b>Trí Lực (PRO & Phổ thông):</b> Thử thách Thủy, Hỏa, Phong (~5 phút/bộ).",
                    "<b>Thực chiến:</b> Sử dụng năng lượng lượng tử (SCI) tích lũy được để tham gia leo tháp, đấu giải và tranh đoạt tài nguyên giữa các Bang phái.",
                    "<b>AI Dynamic Scaling:</b> Thuật toán liên tục tinh chỉnh độ khó vô cực bám sát giới hạn của riêng bạn. Trùm cuối duy nhất cần đánh bại chính là bạn của ngày hôm qua!"
                ]
            },
            santhuong: { 
                title: "ĐẠI HỘI VÕ LÂM", 
                slides: [
                    "Sự kiện offline hoành tráng tổ chức định kỳ vào <b>tháng 9</b>, giải ngân quỹ thưởng khổng lồ được trích từ <b>30% tổng doanh thu</b> của toàn hệ thống.",
                    "<b>Đại Chiến 2 Phe:</b> Phe thắng nhận trọn <b>15%</b> doanh thu. Phe thua được an ủi <b>5%</b> (nếu thua sát nút). Trích <b>10%</b> để tổ chức đại tiệc tri ân miễn phí 100% cho TẤT CẢ <b>Đạo chúng (vận động viên)</b>.",
                    "<b>Đặc quyền cá nhân:</b><br><br>• <b>PRO (VIP):</b> Bứt phá tới cấp 'Vô Ngã' và làm Bang chủ.<br><br>• <b>Phổ thông (Free):</b> Nhận quà giá trị khi đạt cấp 'Viễn Tưởng', 'Siêu Tưởng'."
                ]
            }
        };

        function openInfoModal(key) {
            playHologramClick();
            const data = infoData[key];
            document.getElementById('infoTitle').innerHTML = data.title;
            
            const track = document.getElementById('carouselTrack');
            const dots = document.getElementById('carouselDots');
            track.innerHTML = ''; dots.innerHTML = '';

            data.slides.forEach((slideHtml, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide-item';
                slideDiv.innerHTML = slideHtml;
                track.appendChild(slideDiv);
                
                const dotSpan = document.createElement('span');
                dotSpan.className = index === 0 ? 'dot active' : 'dot';
                dots.appendChild(dotSpan);
            });

            track.scrollLeft = 0;
            document.getElementById('infoModalOverlay').classList.add('active');
        }

        function closeInfoModal() {
            playHologramClick();
            document.getElementById('infoModalOverlay').classList.remove('active');
        }

        function updateDots() {
            const track = document.getElementById('carouselTrack');
            const dots = document.getElementById('carouselDots').children;
            const scrollPos = track.scrollLeft;
            const slideWidth = track.clientWidth;
            
            const activeIndex = Math.round(scrollPos / slideWidth);
            
            for (let i = 0; i < dots.length; i++) {
                if (i === activeIndex) {
                    dots[i].classList.add('active');
                } else {
                    dots[i].classList.remove('active');
                }
            }
        }

        // --- LOGIC XOAY VÒNG 3 CÂU CHỮ TẠI NÚT GIỮ ---
        const holoMessages = [
            "GIỮ 3 GIÂY ĐỂ VÀO",
            "TRỞ THÀNH CYBER NINJA",
            "CHIẾN ĐẤU VÌ BANG PHÁI"
        ];
        let currentMsgIndex = 0;

        setInterval(() => {
            const textEl = document.getElementById('holoTextRotator');
            if(!textEl) return;

            textEl.classList.add('glitch-anim');

            setTimeout(() => {
                currentMsgIndex = (currentMsgIndex + 1) % holoMessages.length;
                textEl.innerHTML = holoMessages[currentMsgIndex];
                textEl.classList.remove('glitch-anim');
            }, 200);

        }, 3000);

        // --- LOGIC GIỮ 3 GIÂY ĐỂ VÀO GAME ---
        let holoHoldInterval = null; 
        let holoHoldStart = 0; 
        const holoHoldDuration = 3000;
        const chargeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3');

        function startHoloHold(e) {
            if(e.type === 'touchstart') e.preventDefault();
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(!bar) return;

            holdBtn.classList.add('electric-active');
            holoHoldStart = Date.now();
            if(chargeSound) { chargeSound.currentTime = 0; chargeSound.play().catch(e=>{}); }
            if(navigator.vibrate) navigator.vibrate([50, 30, 50, 30]);

            holoHoldInterval = setInterval(() => {
                let elapsed = Date.now() - holoHoldStart;
                let progress = Math.min(100, (elapsed / holoHoldDuration) * 100);
                bar.style.width = progress + '%';
                if(elapsed >= holoHoldDuration) { 
                    clearInterval(holoHoldInterval); 
                    triggerTransitionToTorii();
                }
            }, 30);
        }

        function cancelHoloHold(e) {
            if(holoHoldInterval) clearInterval(holoHoldInterval);
            const bar = document.getElementById('holoProgressBar');
            const holdBtn = document.getElementById('holoHoldBtn');
            if(bar) bar.style.width = '0%';
            if(holdBtn) holdBtn.classList.remove('electric-active');
            if(chargeSound) chargeSound.pause();
        }

        function triggerTransitionToTorii() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);
            if(chargeSound) chargeSound.pause();
            
            const sysAudio = document.getElementById('sysAudio');
            if(sysAudio) sysAudio.play().catch(e=>{});
            const bgm = document.getElementById('bgMusic');
            if(bgm) bgm.play().catch(e=>{});

            const laser = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            laser.play().catch(e=>{});

            const splash = document.getElementById('splashScreen');
            splash.classList.add('hidden');
            
            const bgTarget = document.getElementById('bg-login');
            bgTarget.classList.add('active');

            setTimeout(() => { splash.style.display = 'none'; }, 800);

            setTimeout(() => {
                document.getElementById('loginPanelContainer').classList.add('active');
            }, 3000); 
        }

        function playHologramClick() {
            const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
            snd.volume = 0.5; snd.play().catch(e=>{});
        }

        function togglePass(inputId, iconEl) { 
            let inp = document.getElementById(inputId); 
            if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = '🙈'; } else { inp.type = 'password'; iconEl.innerHTML = '👁'; } 
        }

        // --- LOGIC ĐĂNG NHẬP API ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';
        
        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');

            if(acc === "" || code === "") { statusEl.innerHTML = "❌ ĐIỀN ĐỦ THÔNG TIN!"; statusEl.style.color = "#ff3333"; return; }
            statusEl.innerHTML = "🛰️ ĐANG KIỂM CHỨNG..."; statusEl.style.color = "#00e5ff";
            
            const dataForm = new FormData();
            dataForm.append('action', 'checkLogin'); dataForm.append('username', acc); dataForm.append('password', code);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                if(data.success === true || data.result === "success" || data.status === "success" || data.ket_qua === "thanh_cong") {
                    const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                    sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                    if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500, 150, 600, 200, 1000]);
                    
                    statusEl.innerHTML = "✅ THÀNH CÔNG!"; statusEl.style.color = "#00e5ff";
                    sessionStorage.setItem('kdrive_session', 'active'); sessionStorage.setItem('kdrive_username', acc); 
                    
                    const bgMusic = document.getElementById('bgMusic');
                    if(bgMusic) bgMusic.pause();
                    
                    setTimeout(() => { 
                        document.getElementById('loginPanelContainer').classList.remove('active'); 
                        setTimeout(() => {
                            const successVid = document.getElementById('successVideo');
                            if(successVid) {
                                successVid.style.display = 'block'; 
                                successVid.play().catch(err => { window.location.href = 'INTRO.html'; });
                                successVid.onended = () => { window.location.href = 'INTRO.html'; };
                            } else { window.location.href = 'INTRO.html'; }
                        }, 500);
                    }, 1000); 
                } else {
                    statusEl.innerHTML = "❌ SAI THÔNG TIN!"; statusEl.style.color = "#ff3333";
                }
            })
            .catch(error => { statusEl.innerHTML = "❌ MẤT KẾT NỐI!"; statusEl.style.color = "#ff3333"; });
        }
    </script>
    
    <script src="boo-player.js"></script>
    <script src="hud-ticker.js"></script>
</body>
</html>
