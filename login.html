<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/happyk1900/Kai-Ripe/main/t%C3%A1ch%20r%E1%BB%93i.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-Drive: Sơn Môn Yết Kiến</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background-color: #000; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        @keyframes screenStrikeShake { 0%, 100% { transform: scale(1) rotate(0deg); } 10%, 30%, 50%, 70%, 90% { transform: translate(-6px, 5px) scale(1.03) rotate(-1deg); } 20%, 40%, 60%, 80% { transform: translate(6px, -5px) scale(1.03) rotate(1deg); } }
        .shake-active { animation: screenStrikeShake 0.6s cubic-bezier(.36,.07,.19,.97) both; filter: contrast(1.5) brightness(1.2); }
        .kdrive-image-wrapper { position: relative; width: 100vw; height: 100vh; max-width: 430px; background-color: #000; overflow: hidden; }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; transition: opacity 0.3s; opacity: 1; filter: brightness(0.8) contrast(1.1); }
        
        .global-radar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: hidden; mix-blend-mode: overlay; }
        .radar-line { width: 100%; height: 2px; background: rgba(0, 229, 255, 0.5); box-shadow: 0 0 30px rgba(0, 229, 255, 1); position: absolute; top: -10px; animation: globalScan 8s linear infinite; }
        @keyframes globalScan { 0% { top: -10px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        .central-hud-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 190px; z-index: 90; pointer-events: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.4s ease; opacity: 1; }
        .glass-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: rgba(5, 10, 15, 0.4); backdrop-filter: blur(8px); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 4px; z-index: 1; pointer-events: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .hud-text.main { position: relative; font-size: 34px; font-weight: 700; color: #fff; letter-spacing: 5px; text-shadow: 0 0 15px rgba(0, 229, 255, 0.8); z-index: 2; pointer-events: none; margin-top: -10px; text-align: center; width: 100%; display: inline-block; overflow: hidden;}
        .hud-text.main::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent); animation: quantumShine 3.5s infinite; transform: skewX(-20deg); }
        @keyframes quantumShine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        
        .hud-action-btn { position: absolute; color: #00e5ff; font-size: 13px; font-weight: 600; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid #00e5ff; transition: 0.3s; z-index: 95; letter-spacing: 2px; }
        .hud-action-btn:hover { color: #fff; border-bottom-color: #fff; transform: scale(1.05); text-shadow: 0 0 10px #00e5ff; }
        .hud-action-btn.top-left { top: 18px; left: 18px; } 
        .hud-action-btn.bottom-right { bottom: 18px; right: 18px; }
        
        .gateway-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 12, 18, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 4px; padding: 30px 20px; z-index: 99999; display: none; flex-direction: column; align-items: center; box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.05); width: 90%; max-width: 350px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        .gateway-popup h2 { color: #fff; font-size: 20px; letter-spacing: 4px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0,229,255,0.6); text-transform: uppercase; border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; width: 100%; text-align: center; }
        
        .input-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .login-input { width: 100%; padding: 14px; background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.2); color: #00e5ff; outline: none; text-align: center; font-weight: 600; font-family: 'Space Grotesk', sans-serif; border-radius: 2px; transition: all 0.3s ease; margin-bottom: 0; letter-spacing: 2px; }
        .login-input::placeholder { color: rgba(0, 229, 255, 0.3); }
        .login-input:focus { border-color: #00e5ff; background: rgba(0, 229, 255, 0.08); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0, 229, 255, 0.1); }
        .login-input.error { border-color: #ff3333 !important; color: #ff3333; animation: screenStrikeShake 0.4s; }
        
        .login-btn-submit { padding: 14px 25px; background: transparent; color: #00e5ff; font-weight: 800; font-size: 14px; letter-spacing: 3px; border: 1px solid #00e5ff; border-radius: 2px; cursor: pointer; width: 100%; font-family: 'Space Grotesk', sans-serif; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.1); transition: all 0.3s; margin-top: 10px; position: relative; overflow: hidden; }
        .login-btn-submit::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: rgba(0, 229, 255, 0.2); transition: all 0.3s; z-index: -1; transform: skewX(-20deg); }
        .login-btn-submit:hover::before { left: 0; transform: skewX(0deg); }
        .login-btn-submit:hover { color: #fff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); text-shadow: 0 0 5px #fff; }
        
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 16px; color: rgba(255,255,255,0.4); font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 35001; }
        .close-btn:hover { color: #ff3333; transform: scale(1.1); text-shadow: 0 0 10px #ff3333; }
        
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(0,229,255,0.5); z-index: 5; display: flex; align-items: center; justify-content: center; }
        .eye-icon:hover { color: #00e5ff; }
        
        .account-options-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .remember-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .remember-checkbox { appearance: none; width: 14px; height: 14px; border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 2px; background: transparent; cursor: pointer; position: relative; }
        .remember-checkbox:checked::after { content: '✔'; position: absolute; top: -3px; left: 1px; color: #00e5ff; font-size: 12px; }
        .change-pass-link { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 600; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .change-pass-link:hover { color: #00e5ff; }

        body.popups-active .central-hud-container { pointer-events: none !important; opacity: 0 !important; transform: translate(-50%, -50%) scale(0.9); }
    </style>
</head>
<body>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        <div class="global-radar"><div class="radar-line"></div></div>
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/bushido%20(1).png?raw=true" class="kdrive-bg-target" id="kdriveBg">

        <div id="protocolGuide" class="central-hud-container">
            <div class="glass-layer"></div>
            <div class="hud-action-btn top-left" onclick="showLoginPanel()">[ SƠN MÔN ]</div>
            <div class="hud-action-btn bottom-right" onclick="showNinjaInfo()">[ BÍ LỤC ]</div>
            <div class="hud-text main">K-DRIVE</div>
            <div id="hudGuardWarning" class="hud-warning-text"></div>
        </div>

        <div class="gateway-popup" id="loginPanelContainer">
            <div class="close-btn" onclick="closeLoginPanel()">[ ĐÓNG ]</div>
            
            <div id="panel-login" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <h2>[ SƠN MÔN YẾT KIẾN ]</h2>
                <div class="input-wrapper">
                    <input type="text" id="accInput" class="login-input" placeholder="[ DANH TÍNH NỘI MÔN ]">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="passcodeInput" class="login-input" placeholder="[ ẤN KÝ BÍ MẬT ]">
                    <span class="eye-icon" onclick="togglePass('passcodeInput', this)">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
                <div class="account-options-row">
                    <label class="remember-container"><input type="checkbox" id="rememberMeCheck" class="remember-checkbox" checked> Ghi nhớ ấn</label>
                    <div style="display: flex; gap: 10px;">
                        <span class="change-pass-link" onclick="openChangePassPanel()">[ Đổi ]</span>
                        <span class="change-pass-link" onclick="switchPanel('forgot')" style="color: #ff3333;">[ Quên ]</span>
                    </div>
                </div>
                <button class="login-btn-submit" onclick="submitLogin()">[ TIẾN NHẬP SƠN MÔN ]</button>
                <div id="loginStatus" style="margin-top: 15px; font-weight: bold; text-align: center; font-size: 11px; letter-spacing: 1px; line-height: 1.5;"></div>
                
                <div style="margin-top: 25px; text-align: center; width: 100%; border-top: 1px solid rgba(0, 229, 255, 0.2); padding-top: 15px;">
                    <span style="color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 2px;">[ CHƯA LẬP THỆ? ]</span><br>
                    <span onclick="switchPanel('register')" style="color: #00e5ff; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 2px; display: inline-block; margin-top: 8px; transition: 0.3s;">➔ LẬP THỆ TÂN ĐỒ</span>
                </div>
            </div>

            <div id="panel-register" style="width: 100%; display: none; flex-direction: column; align-items: center;">
                <h2>[ LẬP THỆ TÂN ĐỒ ]</h2>
                <div class="input-wrapper"><input type="text" id="regId" class="login-input" placeholder="[ TÔN DANH ] *"></div>
                <div class="input-wrapper"><input type="password" id="regPass" class="login-input" placeholder="[ MẬT ẤN MỚI ] *"></div>
                <div class="input-wrapper"><input type="password" id="regPassConf" class="login-input" placeholder="[ XÁC NHẬN MẬT ẤN ] *"></div>
                <div class="input-wrapper"><input type="email" id="regEmail" class="login-input" placeholder="[ THƯ TÍN LIÊN LẠC ] *"></div>
                <button class="login-btn-submit" onclick="processRegistration()">TIẾN VÀO TRẬN ĐỒ</button>
                <div id="regStatus" style="margin-top: 10px; font-weight: bold; text-align: center; font-size: 11px;"></div>
                <span onclick="switchPanel('login')" style="color: rgba(255,255,255,0.4); font-size: 11px; cursor: pointer; margin-top: 15px; letter-spacing: 1px;">[ QUAY LẠI SƠN MÔN ]</span>
            </div>
            
            <div id="panel-forgot" style="width: 100%; display: none; flex-direction: column; align-items: center;">
                <h2>[ KHÔI PHỤC MẬT ẤN ]</h2>
                <input type="email" id="fgEmail" class="login-input" placeholder="[ NHẬP THƯ TÍN CỦA BẠN ]" style="margin-bottom: 12px;">
                <button class="login-btn-submit" onclick="submitForgotPass()">GỬI LỆNH TÌM KIẾM</button>
                <div id="fgStatus" style="margin-top: 15px; font-weight: bold; text-align: center; font-size: 11px;"></div>
                <span onclick="switchPanel('login')" style="color: rgba(255,255,255,0.4); font-size: 11px; cursor: pointer; margin-top: 15px; letter-spacing: 1px;">[ QUAY LẠI SƠN MÔN ]</span>
            </div>
        </div>

    </div>

    <script>
        const EYE_CLOSED = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const EYE_OPEN = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        function lockInteraction() { document.body.classList.add('popups-active'); }
        function unlockInteraction() { document.body.classList.remove('popups-active'); }
        function showLoginPanel() { document.getElementById('loginPanelContainer').style.display = 'flex'; switchPanel('login'); lockInteraction(); }
        function closeLoginPanel() { document.getElementById('loginPanelContainer').style.display = 'none'; unlockInteraction(); }
        function switchPanel(panelName) { 
            document.getElementById('panel-login').style.display = 'none'; 
            document.getElementById('panel-register').style.display = 'none'; 
            document.getElementById('panel-forgot').style.display = 'none'; 
            document.getElementById('panel-' + panelName).style.display = 'flex'; 
        }
        function togglePass(inputId, iconEl) { 
            let inp = document.getElementById(inputId); 
            if(inp.type === 'password') { inp.type = 'text'; iconEl.innerHTML = EYE_CLOSED; } 
            else { inp.type = 'password'; iconEl.innerHTML = EYE_OPEN; } 
        }

        // --- KẾT NỐI CHUẨN JSONP ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';

        function submitLogin() {
            var acc = document.getElementById('accInput').value.trim(); 
            var code = document.getElementById('passcodeInput').value.trim(); 
            var statusEl = document.getElementById('loginStatus');
            
            if(acc === "" || code === "") { 
                statusEl.innerHTML = "❌ Nhập đủ danh tính và ấn ký!"; 
                statusEl.style.color = "#ff3333"; 
                document.getElementById('loginPanelContainer').classList.add('shake-active');
                setTimeout(() => document.getElementById('loginPanelContainer').classList.remove('shake-active'), 600);
                return; 
            }
            
            statusEl.innerHTML = "🛰️ BOO ĐANG KIỂM CHỨNG ẤN KÝ NỘI MÔN..."; 
            statusEl.style.color = "#00e5ff";
            
            // 1. Khởi tạo tên Callback ngẫu nhiên cho chuẩn JSONP
            var callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            
            // 2. Thiết lập hàm đón kết quả từ Google Sheets
            window[callbackName] = function(data) {
                delete window[callbackName]; // Dọn dẹp sau khi nhận thư
                
                if(data.success === true) {
                    statusEl.innerHTML = "✅ TƯƠNG HỢP! ĐANG TIẾN NHẬP SƠN MÔN..."; 
                    statusEl.style.color = "#00e5ff";
                    document.getElementById('mainWrapper').classList.add('shake-active');
                    
                    // Chuyển sang trang chính
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    // Hiển thị trực tiếp câu báo lỗi từ App Script của anh
                    statusEl.innerHTML = "❌ " + (data.msg || "Sai ấn ký nội môn!"); 
                    statusEl.style.color = "#ff3333";
                    document.getElementById('loginPanelContainer').classList.add('shake-active');
                    setTimeout(() => document.getElementById('loginPanelContainer').classList.remove('shake-active'), 600);
                }
            };

            // 3. Tạo lệnh gọi JSONP phù hợp 100% với doGet của anh
            var url = scriptURL + "?action=checkLogin" + 
                      "&username=" + encodeURIComponent(acc) + 
                      "&password=" + encodeURIComponent(code) + 
                      "&deviceId=Mushi1000_Mobile" + 
                      "&callback=" + callbackName;

            // 4. Phóng tín hiệu đi để vượt mọi lỗi CORS
            var script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                statusEl.innerHTML = "❌ Kết nối đường Sơn môn bị phong tỏa!"; 
                statusEl.style.color = "#ff3333";
            };
            document.body.appendChild(script);
        }

        function processRegistration() { document.getElementById('regStatus').innerHTML = "Tính năng này đang được rèn dũa!"; document.getElementById('regStatus').style.color = "#00e5ff"; }
        function submitForgotPass() { document.getElementById('fgStatus').innerHTML = "Đang gửi mật thư khôi phục!"; document.getElementById('fgStatus').style.color = "#00e5ff"; }
    </script>
</body>
</html>
