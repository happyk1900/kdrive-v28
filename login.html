<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drive - Đăng Nhập & Kênh Thế Giới</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #05050a;
            color: #00ffcc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            padding: 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px #00ffcc;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ffcc;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 10px #00ffcc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* KHUNG HOLOGRAPHIC KÊNH THẾ GIỚI */
        .hologram-board {
            margin-top: 25px;
            border: 1px dashed rgba(0, 255, 204, 0.4);
            background: rgba(0, 255, 204, 0.02);
            border-radius: 6px;
            padding: 12px;
            height: 140px;
            overflow: hidden;
            position: relative;
        }

        .hologram-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(0, 255, 204, 0.6);
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 4px;
        }

        .holo-stream {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: flicker 4s infinite;
        }

        .holo-msg {
            font-size: 13px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .holo-msg span {
            color: #ff0055;
            font-weight: bold;
            margin-right: 6px;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.8; }
            100% { opacity: 0.95; }
        }

        /* Hiệu ứng nền ma trận nhẹ */
        .cyber-grid {
            position: absolute;
            width: 200vw;
            height: 200vh;
            background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="login-container">
        <h1>K - D R I V E</h1>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Định danh Account</label>
                <input type="text" id="accountInput" placeholder="Nhập tên Account (Ví dụ: Kai)..." required>
            </div>
            <button type="submit">Kích Hoạt & Vào Game</button>
        </form>

        <!-- BẢNG HOLOGRAPHIC KÊNH THẾ GIỚI -->
        <div class="hologram-board">
            <div class="hologram-title">⚡ Kênh Thế Giới // Hologram Stream</div>
            <div class="holo-stream" id="holoStream">
                <!-- Tin nhắn mẫu chạy tự động -->
                <div class="holo-msg"><span>Boss_99:</span> Anh em chuẩn bị cày Địa Luân chưa?</div>
                <div class="holo-msg"><span>Kai:</span> Đã khóa cứng hệ thống 1 dòng, sẵn sàng chiến.</div>
                <div class="holo-msg"><span>Shadow:</span> Ai lười hôm nay chuẩn bị âm điểm nhé haha.</div>
                <div class="holo-msg"><span>Viper:</span> Đấu trường Arena mở chưa các đạo hữu?</div>
            </div>
        </div>
    </div>

    <script>
        // Mô phỏng hiệu ứng stream tin nhắn mới từ Kênh Thế Giới phát ra bảng Hologram ngoài login
        const sampleMessages = [
            { account: "Hades", text: "Hôm nay hệ thống quét điểm 0 đấy, cẩn thận!" },
            { account: "Kaze", text: "Phong Luân chiều nay ai đấu thủ nào?" },
            { account: "Kai", text: "Đường truyền mượt, không tốn một đồng server." },
            { account: "Zero", text: "Đỉnh cao của bảo mật là đây chứ đâu." },
            { account: "Ares", text: "Sẵn sàng thăng cấp lên Trung Cấp rồi anh em." }
        ];

        function pushHologramMessage() {
            const streamContainer = document.getElementById('holoStream');
            const randomMsg = sampleMessages[Math.floor(Math.random() * sampleMessages.length)];
            
            const msgElement = document.createElement('div');
            msgElement.className = 'holo-msg';
            msgElement.innerHTML = `<span>${randomMsg.account}:</span> ${randomMsg.text}`;
            
            streamContainer.appendChild(msgElement);
            
            // Giữ tối đa 4 dòng trên bảng hologram cho gọn
            if (streamContainer.children.length > 4) {
                streamContainer.removeChild(streamContainer.children[0]);
            }
        }

        // Tự động đẩy tin nhắn mới mỗi 3 giây để tạo cảm giác realtime
        setInterval(pushHologramMessage, 3000);

        function handleLogin(event) {
            event.preventDefault();
            const account = document.getElementById('accountInput').value.trim();
            if(account) {
                alert(`Kích hoạt thành công tài khoản [${account}]! Chào mừng bước vào không gian K-Drive.`);
                // Code chuyển hướng hoặc mở khóa tính năng chat thế giới bên trong sẽ đặt ở đây
            }
        }
    </script>
</body>
</html>
