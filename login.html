<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">K-Drive: Lõi Lượng Tử</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #030508; height: 100vh; height: 100dvh; width: 100vw; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
        img, video { -webkit-user-drag: none; pointer-events: none; }

        /* NỀN ĐĂNG NHẬP MỚI THEO YÊU CẦU */
        .kdrive-image-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #010204; z-index: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .kdrive-bg-target { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; opacity: 1; }
        
        /* BỐ CỤC NÚT GOOGLE CHÍNH GIỮA TÂM */
        .gateway-container {
            position: relative; width: 90%; max-width: 280px; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* HIỆU ỨNG GLITCH KHI BẤM NÚT */
        .gateway-container.glitching {
            animation: glitchAnim 0.3s infinite alternate;
        }
        @keyframes glitchAnim {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) brightness(1); }
            20% { transform: translate(-4px, 2px) scale(1.05); filter: hue-rotate(90deg) brightness(1.5); }
            40% { transform: translate(4px, -2px) scale(0.95); filter: hue-rotate(180deg) brightness(0.8); }
            60% { transform: translate(-2px, -2px) scale(1.02); filter: hue-rotate(270deg) brightness(1.3); }
            80% { transform: translate(3px, 3px) scale(0.98); filter: hue-rotate(45deg) brightness(1.2); }
            100% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg) brightness(1); }
        }

        /* NÚT GMAIL ÔM SÁT VIỀN (DÙNG DROP-SHADOW CHUẨN PIXEL TRONG SUỐT) */
        .google-auth-btn-img {
            width: 100%; max-width: 240px; height: auto; cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.7));
            animation: buttonPulseGlow 1.5s infinite alternate ease-in-out;
            transition: transform 0.2s ease, filter 0.2s ease;
            pointer-events: auto !important;
        }
        .google-auth-btn-img:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 30px #00e5ff);
        }

        @keyframes buttonPulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.5)); }
            100% { filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.95)); }
        }

        #loginStatus {
            margin-top: 15px; font-weight: 700; text-align: center; font-size: 11px; color: #00e5ff;
            text-shadow: 0 0 8px rgba(0,229,255,0.6); letter-spacing: 1px;
        }

        /* MODAL NHẬP GMAIL LƯỢNG TỬ (CYBERPUNK STYLE THAY CHO POPUP TRẮNG) */
        .quantum-modal-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(1, 3, 8, 0.9); backdrop-filter: blur(12px);
            z-index: 999999; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s ease; pointer-events: none;
        }
        .quantum-modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .quantum-modal-box {
            width: 90%; max-width: 320px;
            background: rgba(5, 12, 22, 0.98); border: 2px solid #00e5ff; border-radius: 14px;
            padding: 20px 16px; box-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
            display: flex; flex-direction: column; align-items: center;
        }
        .quantum-modal-title {
            color: #ffd700; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 900;
            text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(255,215,0,0.7);
            text-align: center;
        }
        .quantum-modal-desc {
            color: #e0f7fa; font-size: 11px; line-height: 1.5; text-align: center; margin-bottom: 15px;
        }
        .quantum-input {
            width: 100%; padding: 11px 12px; background: rgba(10, 15, 25, 0.9);
            border: 1px solid #00e5ff; border-radius: 8px; color: #fff; font-size: 12px;
            font-family: 'Space Grotesk', sans-serif; outline: none; margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,229,255,0.2); text-align: center;
        }
        .quantum-btn-row { display: flex; gap: 10px; width: 100%; }
        .quantum-btn {
            flex: 1; padding: 10px; border-radius: 8px; font-family: 'Montserrat', sans-serif;
            font-size: 11px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s;
            text-align: center; letter-spacing: 1px;
        }
        .quantum-btn-cancel { background: rgba(255,0,60,0.2); border: 1px solid #ff003c; color: #ff3333; }
        .quantum-btn-cancel:hover { background: rgba(255,0,60,0.4); color: #fff; box-shadow: 0 0 15px #ff003c; }
        .quantum-btn-confirm { background: rgba(0,229,255,0.2); border: 1px solid #00e5ff; color: #00e5ff; }
        .quantum-btn-confirm:hover { background: rgba(0,229,255,0.4); color: #fff; box-shadow: 0 0 15px #00e5ff; }

        /* VIDEO THÀNH CÔNG FULL MÀN HÌNH */
        #successVideo { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; 
            object-fit: cover; z-index: 9999999; display: none; background: #000; 
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <audio id="bgMusic" crossorigin="anonymous" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Path%20of%20the%20Ninja.mp3" preload="auto" loop></audio>
    
    <!-- VIDEO GPS FULL -->
    <video id="successVideo" src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20GPS%20FULL.mp4" playsinline></video>

    <!-- KHUNG GIAO DIỆN CHÍNH (ĐÃ THAY ẢNH NỀN MỚI) -->
    <div class="kdrive-image-wrapper">
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/ANH%20NEN%20GPS%20NEN.png?raw=true" class="kdrive-bg-target" alt="Core Background">
        
        <div class="gateway-container active" id="loginPanelContainer">
            <!-- NÚT GMAIL CHUẨN VIỀN -->
            <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/NUT%20GMAIL.png?raw=true" class="google-auth-btn-img" onclick="triggerGoogleLogin()" alt="Google Login">
            <div id="loginStatus"></div>
        </div>
    </div>

    <!-- MODAL NHẬP GMAIL LƯỢNG TỬ TÙY CHỈNH (THAY THẾ HOÀN TOÀN POP-UP MẶC ĐỊNH) -->
    <div class="quantum-modal-overlay" id="quantumGmailModal">
        <div class="quantum-modal-box">
            <div class="quantum-modal-title">XÁC THỰC TÀI KHOẢN GMAIL</div>
            <div class="quantum-modal-desc">Nhập địa chỉ GMAIL chính chủ của bạn để đồng bộ Đấu trường Lượng tử:</div>
            <input type="email" id="quantumEmailInput" class="quantum-input" placeholder="player@gmail.com" value="player@gmail.com">
            <div class="quantum-btn-row">
                <button class="quantum-btn quantum-btn-cancel" onclick="closeQuantumModal()">HỦY BỎ</button>
                <button class="quantum-btn quantum-btn-confirm" onclick="confirmQuantumModal()">XÁC NHẬN</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwPVjsQ6bd9RFcOB7BUBl2bSsYa6gccHoirg66hbNCruFYJ3HP9w-xJD6JpCupjUKSr/exec';

        window.addEventListener('DOMContentLoaded', () => { 
            initGoogleAuth();
            const bgm = document.getElementById('bgMusic');
            if(bgm) { bgm.currentTime = 0; bgm.play().catch(e => {}); }
        });

        function playHologramClick() { try { const snd = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'); snd.volume = 0.5; snd.play().catch(e=>{}); } catch(err) {} }

        function initGoogleAuth() {
            try {
                if (typeof google !== 'undefined' && google.accounts) {
                    google.accounts.id.initialize({
                        client_id: "916035082915-656vp11qf63hmoplvtjfvbci053jti8r.apps.googleusercontent.com",
                        callback: handleGoogleResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true
                    });
                }
            } catch (e) {
                console.error("Google Auth init error:", e);
            }
        }

        function triggerGoogleLogin() {
            playHologramClick();
            
            const container = document.getElementById('loginPanelContainer');
            container.classList.add('glitching');

            var statusEl = document.getElementById('loginStatus');
            statusEl.innerHTML = "🛰️ ĐANG KÍCH HOẠT MẠNG LƯỢNG TỬ...";

            try {
                if (typeof google !== 'undefined' && google.accounts) {
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            // Thay vì dùng hàm prompt() thô kệch, gọi Modal Lượng Tử cực đẹp của mình
                            openQuantumModal();
                        }
                    });
                } else {
                    openQuantumModal();
                }
            } catch (e) {
                openQuantumModal();
            }
        }

        function openQuantumModal() {
            const container = document.getElementById('loginPanelContainer');
            container.classList.remove('glitching');
            document.getElementById('loginStatus').innerHTML = "";
            document.getElementById('quantumGmailModal').classList.add('active');
        }

        function closeQuantumModal() {
            playHologramClick();
            document.getElementById('quantumGmailModal').classList.remove('active');
            var statusEl = document.getElementById('loginStatus');
            statusEl.innerHTML = "❌ ĐÃ HỦY XÁC THỰC GMAIL!";
            statusEl.style.color = "#ff3333";
        }

        function confirmQuantumModal() {
            playHologramClick();
            var userEmail = document.getElementById('quantumEmailInput').value.trim();
            if (userEmail && userEmail.includes('@')) {
                document.getElementById('quantumGmailModal').classList.remove('active');
                
                // Kích hoạt lại hiệu ứng glitch chuẩn bị vào video
                const container = document.getElementById('loginPanelContainer');
                container.classList.add('glitching');
                
                executeSocialSync(userEmail, userEmail.split('@')[0]);
            } else {
                alert("Vui lòng nhập một địa chỉ Gmail hợp lệ!");
            }
        }

        function handleGoogleResponse(response) {
            try {
                const responsePayload = parseJwt(response.credential);
                const userEmail = responsePayload.email;
                const userName = responsePayload.name || userEmail.split('@')[0];
                executeSocialSync(userEmail, userName);
            } catch (e) {
                openQuantumModal();
            }
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function executeSocialSync(email, username) {
            var statusEl = document.getElementById('loginStatus');
            statusEl.innerHTML = "⚡ ĐÃ CHỌN GMAIL: " + email;
            statusEl.style.color = "#00e5ff";

            const dataForm = new FormData();
            dataForm.append('action', 'register');
            dataForm.append('Username', username);
            dataForm.append('Password', 'oauth_gmail_secure');
            dataForm.append('Email', email);
            dataForm.append('Nickname', username);

            fetch(scriptURL, { method: 'POST', body: dataForm })
            .then(response => response.json())
            .then(data => {
                triggerSuccessFlow(username);
            })
            .catch(error => {
                triggerSuccessFlow(username);
            });
        }

        function triggerSuccessFlow(username) {
            try {
                const sndVortex = new Audio('https://assets.mixkit.co/active_storage/sfx/2771/2771-preview.mp3');
                sndVortex.volume = 1.0; sndVortex.play().catch(e=>{});
                if (navigator.vibrate) navigator.vibrate([300, 100, 400, 100, 500]);
            } catch(e) {}
            
            sessionStorage.setItem('kdrive_session', 'active'); 
            sessionStorage.setItem('kdrive_username', username); 
            
            setTimeout(() => {
                const container = document.getElementById('loginPanelContainer');
                container.classList.remove('glitching');
                container.style.opacity = '0';
                container.style.transform = 'scale(0)';
            }, 600);

            setTimeout(() => {
                const successVid = document.getElementById('successVideo');
                if(successVid) {
                    successVid.style.display = 'block'; 
                    successVid.play().then(() => { 
                        successVid.onended = () => { window.location.href = 'core.html'; };
                    }).catch(err => { window.location.href = 'core.html'; });
                } else { window.location.href = 'core.html'; }
            }, 900);
        }
    </script>
    <script src="boo-player.js"></script>
    <script src="hud-ticker.js"></script>
</body>
</html>
