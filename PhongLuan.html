<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020406">
    <title>K-Drive - Phong Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010a15; font-family: 'Space Grotesk', sans-serif; }

        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background: radial-gradient(circle at 50% 30%, #02162b 0%, #010811 80%); }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 4px #fff; }
        .dust-large { width: 3px; height: 3px; background: #a0c0d0; box-shadow: 0 0 8px #a0c0d0; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 380px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 0.4s ease; }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background-color: transparent;}

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #00ff66; box-shadow: 0 0 20px #00ff66, 0 0 40px #a0c0d0; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 0.3s forwards ease-out; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 0.5s forwards cubic-bezier(0.7, 0, 1, 1); }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 14px; transition: opacity 0.3s ease; }
        #start-prompt-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none !important; display: none; }

        .briefing-panel { background: rgba(5, 12, 25, 0.95); border: 2px solid #00ff66; border-radius: 8px; padding: 16px 18px; width: 100%; max-width: 330px; text-align: left; box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
        .briefing-title { color: #00ff66 !important; font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); padding-bottom: 8px; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0, 255, 102, 0.5); }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; line-height: 1.6; font-weight: 500; }
        .briefing-target b { color: #00ff66; font-weight: bold; }

        .action-group { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: rgba(255, 255, 255, 0.1); border: 2px solid #ffffff; padding: 14px; border-radius: 8px; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 17px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 255, 255, 0.15); text-align: center; transition: 0.2s; }
        .start-action-box:active { background: #fff; color: #000; transform: scale(0.98); }
        
        #ingame-hud { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: rgba(2, 10, 20, 0.95); border-bottom: 1px solid rgba(0, 255, 102, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10000; pointer-events: auto; backdrop-filter: blur(5px); transition: opacity 0.3s; }
        #ingame-hud.hidden { opacity: 0; pointer-events: none !important; }
        .hud-left { flex: 1; display: flex; justify-content: flex-start; }
        .hud-center { flex: 1; display: flex; justify-content: center; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #fff; font-weight: bold; white-space: nowrap; }
        .hud-right { flex: 1; display: flex; justify-content: flex-end; gap: 10px; }
        .hud-btn { width: 32px; height: 32px; border-radius: 4px; background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.5); color: #00ff66; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .hud-btn.exit-btn { background: rgba(255, 0, 127, 0.1); border-color: #ff007f; color: #ff007f; }

        #freeze-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 200000; display: none; align-items: center; justify-content: center; }
        #freeze-overlay.active { display: flex; }
        .freeze-text { font-family: 'Share Tech Mono', monospace; font-size: 40px; font-weight: 900; color: #00ff66; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 20px #00ff66; }

        #result-overlay { position: absolute; inset: 0; background: rgba(2, 10, 20, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 150; gap: 8px; border-radius: 12px; padding: 12px; }
        #result-overlay.active { display: flex; }
        .stage-badge-header { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #00ff66; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        
        .prestige-panel { width: 92%; max-width: 310px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
        .prestige-total-box { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; padding-top: 2px; width: 100%; }
        .prestige-total-label { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: 1px; flex: 1; text-align: left; }
        .prestige-total-num { font-size: 26px; color: #00ff66; font-weight: 900; line-height: 1; text-align: right; min-width: 80px; }

        .bio-metrics-box { width: 92%; max-width: 310px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .final-eval-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .final-eval-label { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #fff; font-weight: 900; letter-spacing: 1px; }
        .master-feedback { font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; color: #a0c0d0; font-style: italic; text-align: left; margin-top: 8px; line-height: 1.4; border-top: 1px dashed rgba(0,255,102,0.3); padding-top: 8px; font-weight: 500; }
        .rank-icon-img { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; filter: drop-shadow(0 0 3px rgba(0,255,102,0.4)); }

        .result-btn-row { display: flex; gap: 10px; width: 88%; max-width: 280px; margin-top: 10px; }
        .result-action-btn { flex: 1; padding: 12px; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; }
        #btn-replay { background: transparent; border: 1px solid #ff3366; color: #ff3366; }
        #btn-replay:active { background: #ff3366; color: #fff; }
        #btn-next { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        #btn-next:active { background: #fff; color: #000; }

        #final-summary-overlay { position: absolute; inset: 0; background: #010a15; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 10px; padding: 12px; }
        #final-summary-overlay.active { display: flex; }
        .final-header { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: #00ff66; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 10px #00ff66; }
        
        .stat-box { width: 92%; max-width: 310px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 14px; border-radius: 8px; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 100px; color: #00ff66; }

        .final-btn-exit { width: 92%; max-width: 310px; padding: 12px; background: rgba(0, 255, 102, 0.2); border: 1.5px solid #00ff66; border-radius: 8px; color: #00ff66; font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: 0.2s; text-align: center; }
        .final-btn-exit:hover { background: #00ff66; color: #000; }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s; backdrop-filter: blur(5px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 300px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(0,255,102,0.5); border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .pause-title { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: #00ff66; margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; }
        .pause-btn { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 0, 127, 0.2); border: 1px solid #ff007f; color: #ff007f; margin-bottom: 0; }

        #terminal-bar { position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(5, 12, 20, 0.95); border-top: 1px solid rgba(0, 255, 102, 0.5); padding: 8px 0; z-index: 99999; overflow: hidden; display: flex; align-items: center; pointer-events: none; }
        #terminal-bar.hidden { display: none !important; }
        .terminal-track { display: inline-flex; white-space: nowrap; animation: ledScroll 15s linear infinite; }
        @keyframes ledScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; }

        #game-play-zone { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; overflow: hidden; z-index: 10; display: none;}
        #game-play-zone.active { display: block;}
        
        .wind-target { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease; } 
        
        .t-track-mode { background: #ffffff; border: 2px solid #e0f7fa; box-shadow: 0 0 15px #ffffff, 0 0 30px rgba(0, 229, 255, 0.8); }
        .t-track-mode.hovered { border-color: #00ff66; box-shadow: 0 0 25px #00ff66, 0 0 50px #00ff66; background: #ffffff; transform: translate(-50%, -50%) scale(1.15); }
        
        .style-track { background: rgba(255,255,255,0.3); border: 2.5px dashed #fff; box-shadow: 0 0 15px rgba(255,255,255,0.6); }
        .style-slash { background: #fff; border: 2.5px solid #fff; box-shadow: 0 0 25px #fff, 0 0 45px rgba(255,255,255,0.9); animation: flarePulse 0.4s infinite alternate; }
        @keyframes flarePulse { 0% { transform: scale(0.92); opacity: 0.85; } 100% { transform: scale(1.08); opacity: 1; } }
        .style-tap { background: rgba(255,255,255,0.2); border: 3px solid #fff; box-shadow: 0 0 30px #fff; }

        #custom-cursor { position: absolute; width: 20px; height: 20px; border: 2px solid #00ff66; border-radius: 50%; pointer-events: none; z-index: 100; display: none; box-shadow: 0 0 10px #00ff66; transform: translate(-50%, -50%); }

        #warning-bar-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 200px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden; display: none; z-index: 130;}
        #warning-progress { width: 0%; height: 100%; background: #ff3366; transition: width 0.1s linear; }

        .floating-boo-txt { position: absolute; left: 50%; top: 25%; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 900; color: #a0c0d0; text-shadow: 0 0 10px #000; z-index: 110; pointer-events: none; opacity:0; transition: opacity 0.3s;}
        .floating-boo-txt.show { opacity:1; animation: floatUpScore 0.8s forwards; }
        @keyframes floatUpScore { 0% { transform: translate(-50%, 0) scale(1); } 100% { transform: translate(-50%, -20px) scale(1.2); } }

        .flashbang-red { position: fixed; inset: 0; background: rgba(255, 51, 102, 0.4); z-index: 999999; pointer-events: none; animation: flashRed 0.4s forwards; }
        @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <!-- THANH HUD TRONG GAME -->
            <div id="ingame-hud" class="hidden">
                <div class="hud-left"><span id="boo-lives" style="font-size: 16px; letter-spacing: 2px;"></span></div>
                <div class="hud-center">SCORE: <b id="boo-points" style="color:#00ff66; margin-left: 5px; font-size: 18px;">0</b></div>
                <div class="hud-right">
                    <div class="hud-btn" onclick="pauseGame()">⏸</div>
                    <div class="hud-btn exit-btn" onclick="confirmExitToLobby()">✕</div>
                </div>
            </div>

            <!-- SẢNH CHỜ -->
            <div id="start-prompt-overlay" class="hidden">
                <div id="briefing-panel" class="briefing-panel">
                    <div class="briefing-title" id="briefing-title"></div>
                    <div class="briefing-target" id="briefing-target"></div>
                </div>
                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <!-- MÀN TẠM DỪNG -->
            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <!-- CHỚP KẾT THÚC -->
            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>

            <!-- KHU VỰC CHỨA GAME PLAY -->
            <div id="game-play-zone">
                <div id="custom-cursor"></div>
                <div id="game-target" class="wind-target" onmousedown="handleTargetClick(event)" ontouchstart="handleTargetClick(event)"></div>
                <div id="warning-bar-container"><div id="warning-progress"></div></div>
                <div id="float-boo" class="floating-boo-txt"></div>
            </div>

            <!-- BẢNG ĐIỂM TỪNG BÀI KÈM ĐÁNH GIÁ -->
            <div id="result-overlay">
                <div class="stage-badge-header" id="stage-badge-title">KẾT QUẢ BÀI 1</div>
                
                <div class="prestige-panel">
                    <div class="prestige-total-box">
                        <span class="prestige-total-label" style="font-size:14px;">TỔNG ĐIỂM BÀI NÀY:</span>
                        <span class="prestige-total-num" id="final-score-display">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <div class="final-eval-row">
                        <span class="final-eval-label">ĐÁNH GIÁ:</span>
                        <span style="font-family:'Share Tech Mono', monospace; font-size:12px; color:#fff; font-weight:bold;" id="bio-rank-badge"></span>
                    </div>
                    <div class="master-feedback" id="master-feedback-text"></div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="retryCurrentStage()">TẬP LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="proceedNextStage()">BÀI 2</button>
                </div>
            </div>

            <!-- BÁO CÁO TỔNG HỢP CUỐI CÙNG -->
            <div id="final-summary-overlay">
                <div class="final-header">TỔNG KẾT PHONG LUÂN</div>
                <div class="stat-box">
                    <div class="stat-line"><span>BÀI 1 (BÁM ĐUỔI):</span> <span class="stat-val" id="sum-score-1" style="color:#00ff66;">0</span></div>
                    <div class="stat-line"><span>BÀI 2 (TIÊN PHONG):</span> <span class="stat-val" id="sum-score-2" style="color:#00ff66;">0</span></div>
                    <div class="stat-line"><span>BÀI 3 (BIẾN ẢO):</span> <span class="stat-val" id="sum-score-3" style="color:#00ff66;">0</span></div>
                    <div class="stat-line" style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.3);">
                        <span style="font-weight: 900; color: #fff;">TỔNG ĐIỂM CHIẾN TÍCH:</span> <span class="stat-val" id="sum-score-total" style="font-weight:900; color:#00ff66; font-size:16px;">0</span>
                    </div>
                    <div class="stat-line" style="margin-top:4px; padding-top:4px; border-top:1px dashed rgba(255,255,255,0.2);">
                        <span>ĐÁNH GIÁ CHUNG:</span> <span class="stat-val" id="final-rank" style="color:#00ff66;">TÂN BINH</span>
                    </div>
                </div>
                <button class="final-btn-exit" onclick="closeArena()">VỀ SẢNH CHÍNH</button>
            </div>
            
        </div>
    </div>

    <div id="terminal-bar">
        <div class="terminal-track"><span class="terminal-text">HỆ THỐNG K-DRIVE - ĐẠO TRƯỜNG PHONG LUÂN - KIỂM THỬ TỐC ĐỘ PHẢN XẠ</span></div>
    </div>

    <script>
        const RANK_ICONS = {
            'Tân Binh': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%201%20(1).png?raw=true',
            'Chiến Binh': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%202%20(1).png?raw=true',
            'Tinh Anh': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%203%20(1).png?raw=true',
            'Đặc Vụ': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%204%20(1).png?raw=true',
            'Huyền Thoại': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%205%20(1).png?raw=true'
        };

        function getRankByPhongLuanScore(score) {
            if (score >= 5000) return { name: "Huyền Thoại", feedback: "« Cảnh giới viễn tưởng! Phản xạ thần kinh vượt ngưỡng nhân loại. »" };
            if (score >= 3000) return { name: "Đặc Vụ", feedback: "« Phản xạ sắc bén, kiểm soát không gian tuyệt đối. »" };
            if (score >= 2000) return { name: "Tinh Anh", feedback: "« Giới hạn đỉnh cao của người bình thường. Tốc độ đáng gờm. »" };
            if (score >= 1000) return { name: "Chiến Binh", feedback: "« Cảm giác không gian tốt, cần đẩy cao tốc độ hơn nữa. »" };
            return { name: "Tân Binh", feedback: "« Vừa bước vào vùng nhiễu động. Cần rèn luyện phản xạ thêm. »" };
        }

        function getRankHTML(rankName) {
            let iconUrl = RANK_ICONS[rankName] || RANK_ICONS['Tân Binh'];
            return `<img src="${iconUrl}" class="rank-icon-img" alt="Rank"> <span style="vertical-align: middle;">${rankName.toUpperCase()}</span>`;
        }

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    fxCtx = new AudioContext();
                }
                if (fxCtx && fxCtx.state === 'suspended') {
                    fxCtx.resume();
                }
            } catch(e) {}
        }
        
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => {
            window.addEventListener(evt, initAudio, { passive: true });
        });

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; 
                    osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); 
                    osc.start(); osc.stop(ctx.currentTime + 0.3); 
                } 
                else if(type === 'error') { 
                    osc.type = 'square'; 
                    osc.frequency.setValueAtTime(100, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.4, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } 
                else if(type === 'coin') { 
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); 
                    osc.start(); osc.stop(ctx.currentTime + 0.2); 
                } 
            } catch (e) {}
        }

        let cGame = '1'; 
        let aScore = 0; 
        let stabilityHP = 5; 
        let isPlaying = false; 
        let isPausedForStart = true;
        
        let sessionScoreG1 = 0, sessionScoreG2 = 0, sessionScoreG3 = 0;
        
        let loopRaf;
        let gTimeouts = [];
        let actionTimer = null;

        let playArea = document.getElementById('play-area');
        let maxX = window.innerWidth > 380 ? 380 : window.innerWidth;
        let maxY = window.innerHeight;
        
        let baseSpeed = 1.5; 
        let tx = maxX / 2, ty = maxY / 2;
        let tAngle = 0, tRotSpeed = 0;
        let tEl = document.getElementById('game-target');
        let mx = maxX / 2, my = maxY / 2;

        let isGhost = false;
        let g3Mode = 'TRACK'; 
        let g1MissFrames = 0;

        let g1FrameCount = 0;
        let g1NextTurnFrame = 0;
        let g1DashFrames = 0;
        let g1DashMultiplier = 1;

        window.onload = () => {
            openArena('1');
        };

        function openArena(id) {
            cGame = id; aScore = 0; stabilityHP = 5; isPlaying = false; isPausedForStart = true;
            
            cancelAnimationFrame(loopRaf);
            clearAllTimeouts();

            let playAreaWrap = document.getElementById('play-area');
            playAreaWrap.classList.remove('fullscreen-mode');

            updateHpDisplay(); document.getElementById('boo-points').innerText = "0";
            document.getElementById('result-overlay').classList.remove('active');
            document.getElementById('pause-menu-overlay').classList.remove('active');
            document.getElementById('final-summary-overlay').classList.remove('active');
            document.getElementById('game-play-zone').classList.remove('active');
            
            let bTitle = "", bTarget = "";
            if (id === '1') {
                bTitle = "BÀI KIỂM TRA I: BÁM ĐUỔI"; bTarget = "GIỮ VỮNG QUỸ ĐẠO<br><br>Hệ thống thả một luồng gió tàng hình.<br><br><span style='color:#00ff66; font-weight:bold;'>MỤC TIÊU:</span> Rê và giữ ngón tay/chuột bám sát theo điểm sáng. Tuột mục tiêu quá lâu sẽ mất mạng.";
            } else if (id === '2') {
                bTitle = "BÀI KIỂM TRA II: TIÊN PHONG"; bTarget = "PHẢN XẠ CHỚP NHOÁNG<br><br>Mục tiêu liên tục ẩn hiện thất thường.<br><br><span style='color:#00ff66; font-weight:bold;'>MỤC TIÊU:</span> Bấm (chém) trúng mục tiêu ngay khi nó hiện ra. Chậm trễ sẽ bị trừ mạng.";
            } else if (id === '3') {
                bTitle = "BÀI KIỂM TRA III: BIẾN ẢO"; bTarget = "XỬ LÝ ĐA NHIỆM<br><br>Mục tiêu thay đổi 3 trạng thái liên tục.<br><br><span style='color:#00ff66; font-weight:bold;'>MỤC TIÊU:</span><br>1. Viền mờ: Bám theo.<br>2. Sáng rực: Bấm nhanh.<br>3. Khung trắng: Bấm nhẹ.";
            }

            document.getElementById('briefing-title').innerText = bTitle; document.getElementById('briefing-target').innerHTML = bTarget;
            document.getElementById('terminal-bar').classList.remove('hidden');
            document.getElementById('start-prompt-overlay').classList.remove('hidden');
        }

        function updateHpDisplay() {
            document.getElementById('boo-lives').innerHTML = "<span style='color:#ff3366; text-shadow: 0 0 8px #ff3366;'>" + "❤️".repeat(Math.max(0, stabilityHP)) + "</span>";
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            document.getElementById('start-prompt-overlay').classList.add('hidden'); document.getElementById('terminal-bar').classList.add('hidden');
            playSound('katana', 0.6); let laser = document.createElement('div'); laser.className = 'laser-beam-horizontal'; document.body.appendChild(laser);
            setTimeout(() => { let playAreaWrap = document.getElementById('play-area'); playAreaWrap.classList.add('fullscreen-mode'); laser.classList.add('expand'); }, 300);
            setTimeout(() => { laser.remove(); isPausedForStart = false; document.getElementById('ingame-hud').classList.remove('hidden'); document.getElementById('game-play-zone').classList.add('active'); startArena(); }, 800);
        }

        function clearAllTimeouts() {
            gTimeouts.forEach(t => clearTimeout(t));
            gTimeouts = [];
            if(actionTimer) { clearTimeout(actionTimer); actionTimer = null; }
        }

        function showBooMsg(text) {
            let bEl = document.getElementById('float-boo');
            bEl.innerText = text;
            bEl.classList.remove('show');
            void bEl.offsetWidth;
            bEl.classList.add('show');
        }

        function startArena() {
            aScore = 0;
            stabilityHP = 5;
            cancelAnimationFrame(loopRaf);
            clearAllTimeouts();

            isPlaying = true; 
            playSound('katana');
            
            document.getElementById('boo-points').innerText = '0';
            updateHpDisplay();

            maxX = document.getElementById('play-area').clientWidth;
            maxY = document.getElementById('play-area').clientHeight;
            tx = maxX / 2; ty = maxY / 2; tAngle = Math.random() * Math.PI * 2;
            tEl.style.display = 'flex';

            if(cGame === '1') initG1();
            else if(cGame === '2') initG2();
            else if(cGame === '3') initG3();
            
            loopRaf = requestAnimationFrame(gameLoop);
        }

        function pauseGame() { if(!isPlaying || isPausedForStart) return; playSound('error'); isPausedForStart = true; clearAllTimeouts(); cancelAnimationFrame(loopRaf); document.getElementById('pause-menu-overlay').classList.add('active'); }
        function resumeGame() { playSound('coin'); document.getElementById('pause-menu-overlay').classList.remove('active'); isPausedForStart = false; 
            if(cGame === '2') initG2(); else if(cGame === '3') initG3();
            loopRaf = requestAnimationFrame(gameLoop);
        }
        function confirmExitToLobby() { playSound('error'); window.location.href = 'LucChien.html'; }
        function closeArena() { window.location.href = 'LucChien.html'; }

        function updateMousePos(e) {
            if(!isPlaying || isPausedForStart) return;
            if (e.touches && e.touches.length > 0) {
                let rect = playArea.getBoundingClientRect();
                mx = e.touches[0].clientX - rect.left; my = e.touches[0].clientY - rect.top;
            } else {
                let rect = playArea.getBoundingClientRect();
                mx = e.clientX - rect.left; my = e.clientY - rect.top;
            }
            if(cGame === '1') {
                let cursor = document.getElementById('custom-cursor');
                cursor.style.left = mx + 'px';
                cursor.style.top = my + 'px';
            }
        }
        document.getElementById('game-play-zone').addEventListener('mousemove', updateMousePos);
        document.getElementById('game-play-zone').addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});

        function handleTargetClick(e) {
            if(!isPlaying || isPausedForStart) return;
            e.stopPropagation();

            if(cGame === '2') {
                if(!isGhost) {
                    addScore(15);
                    playSound('katana'); 
                    showBooMsg("CHÉM CHUẨN!");
                    resetActionTimer(); 
                    tx = 60 + Math.random() * (maxX - 120); ty = 60 + Math.random() * (maxY - 120);
                }
            } 
            else if(cGame === '3') {
                if(g3Mode === 'SLASH' || g3Mode === 'TAP') {
                    addScore(25);
                    playSound('katana'); 
                    showBooMsg(g3Mode === 'SLASH' ? "CHÉM CHUẨN!" : "BẤM CHUẨN!");
                    resetActionTimer();
                    tx = 60 + Math.random() * (maxX - 120); ty = 60 + Math.random() * (maxY - 120);
                }
            }
        }

        function addScore(points) {
            aScore += points;
            document.getElementById('boo-points').innerText = Math.floor(aScore);
        }

        function loseLife() {
            stabilityHP--;
            updateHpDisplay();
            playSound('error');
            
            let flash = document.createElement('div'); flash.className = 'flashbang-red'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 400);

            if(stabilityHP <= 0) finishGame(false);
        }

        function resetActionTimer() {
            if(actionTimer) clearTimeout(actionTimer);
            if(!isPlaying || isPausedForStart) return;

            actionTimer = setTimeout(() => {
                if(!isPlaying || isPausedForStart) return;
                loseLife();
                showBooMsg("QUÁ HẠN!");
                tx = 60 + Math.random() * (maxX - 120); ty = 60 + Math.random() * (maxY - 120);
                resetActionTimer();
            }, 2500); 
        }

        function initG1() {
            tEl.className = 'wind-target t-track-mode';
            document.getElementById('custom-cursor').style.display = 'block';
            document.getElementById('warning-bar-container').style.display = 'block';
            g1MissFrames = 0;
            
            g1FrameCount = 0;
            g1DashFrames = 0;
            g1DashMultiplier = 1;
            g1NextTurnFrame = Math.floor(Math.random() * 60) + 30; 
            tAngle = Math.random() * Math.PI * 2;
        }

        function initG2() {
            tEl.className = 'wind-target style-slash'; 
            document.getElementById('custom-cursor').style.display = 'none';
            baseSpeed = 2.5;
            isGhost = false;
            
            resetActionTimer();

            let tm = setInterval(() => {
                if(!isPlaying || isPausedForStart) return;
                isGhost = !isGhost;
                if(isGhost) { 
                    tEl.style.opacity = '0'; 
                    tEl.style.pointerEvents = 'none';
                } else { 
                    tEl.style.opacity = '1'; 
                    tEl.style.pointerEvents = 'auto';
                }
            }, 1800);
            gTimeouts.push(tm);
        }

        function initG3() {
            tEl.className = 'wind-target style-track';
            document.getElementById('custom-cursor').style.display = 'none';
            baseSpeed = 2.2;
            
            resetActionTimer();

            let tm = setInterval(() => {
                if(!isPlaying || isPausedForStart) return;
                const modes = ['TRACK', 'SLASH', 'TAP'];
                g3Mode = modes[Math.floor(Math.random() * modes.length)];
                
                tEl.classList.remove('style-track', 'style-slash', 'style-tap');
                if(g3Mode === 'TRACK') { tEl.classList.add('style-track'); }
                else if(g3Mode === 'SLASH') { tEl.classList.add('style-slash'); }
                else if(g3Mode === 'TAP') { tEl.classList.add('style-tap'); }

                resetActionTimer();
            }, 2600);
            gTimeouts.push(tm);
        }

        function gameLoop() {
            if(!isPlaying || isPausedForStart) return;

            if (cGame === '1') {
                g1FrameCount++;
                
                // --- THUẬT TOÁN TỐC ĐỘ TỊNH TIẾN MƯỢT MÀ ---
                // Khởi đầu ở 3.5. Mỗi điểm tăng 0.0015 tốc độ. 
                // Tại 1000 điểm: Tốc độ 5.0
                // Tại 2000 điểm: Tốc độ 6.5
                // Tại 5000 điểm: Tốc độ 11.0 (Rất gắt)
                let currentTargetSpeed = 3.5 + (aScore * 0.0015);
                
                // Khóa tốc độ tối đa để không văng khỏi giới hạn mắt người
                if (currentTargetSpeed > 12.0) currentTargetSpeed = 12.0;

                // Các biến thưởng điểm và tần suất bẻ lái giữ nguyên phân cấp
                let pointsToAdd = 0.5;
                let turnFreqOffset = 0; 

                if (aScore < 1000) {
                    pointsToAdd = 0.5; turnFreqOffset = 0;
                } else if (aScore < 2000) {
                    pointsToAdd = 1.0; turnFreqOffset = 5;
                } else if (aScore < 3000) {
                    pointsToAdd = 2.0; turnFreqOffset = 10;
                } else if (aScore < 5000) {
                    pointsToAdd = 4.0; turnFreqOffset = 15;
                } else {
                    pointsToAdd = 8.0; turnFreqOffset = 20;
                }

                // Cơ chế lướt (Dash)
                if (g1DashFrames > 0) {
                    g1DashFrames--;
                } else {
                    g1DashMultiplier = 1;
                    if (Math.random() < 0.015) { 
                        // Giảm hệ số lướt từ 2.0 xuống 1.5 để mượt hơn khi tốc độ nền đã cao
                        g1DashMultiplier = 1.5; 
                        g1DashFrames = Math.floor(Math.random() * 10) + 5; 
                    }
                }

                if (g1FrameCount >= g1NextTurnFrame) {
                    let turnAngle = (Math.PI / 4) + Math.random() * (Math.PI * 0.58); 
                    if (Math.random() < 0.5) turnAngle = -turnAngle;
                    tAngle += turnAngle;
                    
                    g1FrameCount = 0;
                    g1NextTurnFrame = Math.max(15, Math.floor(Math.random() * 50) + 20 - turnFreqOffset);
                }

                let finalSpeed = currentTargetSpeed * g1DashMultiplier;
                tx += Math.cos(tAngle) * finalSpeed;
                ty += Math.sin(tAngle) * finalSpeed;

                let margin = 35;
                let hitWall = false;
                if (tx < margin) { tx = margin; hitWall = true; tAngle = Math.PI - tAngle; }
                else if (tx > maxX - margin) { tx = maxX - margin; hitWall = true; tAngle = Math.PI - tAngle; }
                
                if (ty < margin) { ty = margin; hitWall = true; tAngle = -tAngle; }
                else if (ty > maxY - margin) { ty = maxY - margin; hitWall = true; tAngle = -tAngle; }

                if (hitWall) {
                    tAngle += (Math.random() - 0.5) * 0.5; 
                }

                let dist = Math.hypot(mx - tx, my - ty);
                let hitRadius = 60;
                const G1_MAX_MISS_FRAMES = 120; 
                
                if(dist < hitRadius) {
                    addScore(pointsToAdd);
                    tEl.classList.add('hovered');
                    g1MissFrames = 0;
                    document.getElementById('warning-progress').style.width = '0%';
                } else {
                    tEl.classList.remove('hovered');
                    g1MissFrames++;
                    
                    let pct = (g1MissFrames / G1_MAX_MISS_FRAMES) * 100; 
                    document.getElementById('warning-progress').style.width = Math.min(100, pct) + '%';

                    if(g1MissFrames > G1_MAX_MISS_FRAMES) { 
                        loseLife();
                        showBooMsg("MẤT DẤU!");
                        g1MissFrames = 0;
                    }
                }

            } else {
                let targetSpeed = baseSpeed + (aScore * 0.003); 
                if(Math.random() < 0.01) tAngle += (Math.random() - 0.5) * Math.PI; 
                
                tRotSpeed += (Math.random() - 0.5) * 0.08;
                tAngle += tRotSpeed;

                tx += Math.cos(tAngle) * targetSpeed;
                ty += Math.sin(tAngle) * targetSpeed;

                let margin = 40;
                if (tx < margin || tx > maxX - margin || ty < margin || ty > maxY - margin) {
                    let angleToCenter = Math.atan2((maxY/2) - ty, (maxX/2) - tx);
                    tAngle = angleToCenter;
                    tx = Math.max(margin, Math.min(maxX - margin, tx));
                    ty = Math.max(margin, Math.min(maxY - margin, ty));
                }

                let dist = Math.hypot(mx - tx, my - ty);
                let hitRadius = 60;
                
                if(cGame === '3' && g3Mode === 'TRACK') {
                    if(dist < hitRadius) { 
                        addScore(0.5); 
                        resetActionTimer(); 
                    }
                }
            }

            tEl.style.left = tx + 'px';
            tEl.style.top = ty + 'px';
            tEl.style.transform = `translate(-50%, -50%)`;

            loopRaf = requestAnimationFrame(gameLoop);
        }

        function finishGame(isWin) {
            isPlaying = false; isPausedForStart = true;
            clearAllTimeouts(); cancelAnimationFrame(loopRaf);

            if(cGame === '1') { sessionScoreG1 = Math.floor(aScore); }
            if(cGame === '2') { sessionScoreG2 = Math.floor(aScore); }
            if(cGame === '3') { sessionScoreG3 = Math.floor(aScore); }

            document.getElementById('ingame-hud').classList.add('hidden');
            let playAreaWrap = document.getElementById('play-area'); playAreaWrap.classList.remove('fullscreen-mode');
            document.getElementById('game-play-zone').classList.remove('active');
            
            tEl.style.display = 'none';
            document.getElementById('custom-cursor').style.display = 'none';
            document.getElementById('warning-bar-container').style.display = 'none';

            playSound('error'); document.getElementById('freeze-overlay').classList.add('active');

            setTimeout(() => {
                document.getElementById('freeze-overlay').classList.remove('active');
                
                let romanName = (cGame === '1') ? 'KẾT QUẢ BÀI 1' : (cGame === '2') ? 'KẾT QUẢ BÀI 2' : 'KẾT QUẢ BÀI 3';
                document.getElementById('stage-badge-title').innerText = romanName;
                document.getElementById('final-score-display').innerText = Math.floor(aScore);

                // TÍNH TOÁN XẾP HẠNG CHO BÀI HIỆN TẠI
                let rankObj = getRankByPhongLuanScore(Math.floor(aScore));
                document.getElementById('bio-rank-badge').innerHTML = getRankHTML(rankObj.name);
                document.getElementById('master-feedback-text').innerText = rankObj.feedback;

                let btnNext = document.getElementById('btn-next');
                if (cGame === '1') { btnNext.innerText = "BÀI 2"; btnNext.onclick = proceedNextStage; } 
                else if (cGame === '2') { btnNext.innerText = "BÀI 3"; btnNext.onclick = proceedNextStage; } 
                else { btnNext.innerText = "TỔNG KẾT"; btnNext.onclick = showFinalSummary; }

                document.getElementById('result-overlay').classList.add('active');
                playSound('coin');
            }, 1200);
        }

        function retryCurrentStage() { playSound('katana'); document.getElementById('result-overlay').classList.remove('active'); openArena(cGame); }
        function proceedNextStage() { playSound('coin'); document.getElementById('result-overlay').classList.remove('active'); let nextId = (parseInt(cGame) + 1).toString(); setTimeout(() => { openArena(nextId); }, 300); }

        function showFinalSummary() {
            playSound('coin'); document.getElementById('result-overlay').classList.remove('active');
            let totalSessionScore = sessionScoreG1 + sessionScoreG2 + sessionScoreG3;

            document.getElementById('sum-score-1').innerText = sessionScoreG1;
            document.getElementById('sum-score-2').innerText = sessionScoreG2;
            document.getElementById('sum-score-3').innerText = sessionScoreG3;
            document.getElementById('sum-score-total').innerText = totalSessionScore;
            
            // XẾP HẠNG DỰA TRÊN ĐIỂM CAO NHẤT ĐẠT ĐƯỢC TRONG 3 BÀI
            let highestScore = Math.max(sessionScoreG1, sessionScoreG2, sessionScoreG3);
            let finalRankObj = getRankByPhongLuanScore(highestScore);
            document.getElementById('final-rank').innerHTML = getRankHTML(finalRankObj.name);

            document.getElementById('final-summary-overlay').classList.add('active');
        }
    </script>
</body>
</html>
