<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Phong Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020202; font-family: 'Space Grotesk', sans-serif; }

        /* ẢNH NỀN PHONG LUÂN (SƯƠNG MÙ XÁM LẠNH) */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/new-abum-17-track/blob/main/PHONG%20LUAN%20AI.png?raw=true'); background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #ffffff; box-shadow: 0 0 4px #ffffff; }
        .dust-large { width: 3px; height: 3px; background: #cccccc; box-shadow: 0 0 8px #cccccc; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP-HUD CỐ ĐỊNH (Z-INDEX 9999) */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 9999; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; opacity: 0; transition: opacity 1s ease 1s; }
        .assembled #top-hud { opacity: 1; }
        
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #ffffff; box-shadow: 0 0 8px #ffffff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #444; box-shadow: 0 0 8px #444; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px #ffffff; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(255, 255, 255, 0.9); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        .title-hologram { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(-50px); color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; text-shadow: 0 0 12px rgba(255,255,255,0.9); z-index: 50; pointer-events: none; opacity: 0; transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s; }
        .assembled .title-hologram { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* KHỐI ẢI: TRẮNG BẠC / XÁM LẠNH */
        #task-container { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; pointer-events: none; }
        .card-wrapper { transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: auto; }
        #wrapper-1 { transform: translateX(-150vw); opacity: 0; }
        #wrapper-3 { transform: translateX(150vw); opacity: 0; }
        #wrapper-2 { transform: translateY(150vh); opacity: 0; }
        .assembled #wrapper-1 { transform: translateX(0); opacity: 1; transition-delay: 0.2s; }
        .assembled #wrapper-3 { transform: translateX(0); opacity: 1; transition-delay: 0.4s; }
        .assembled #wrapper-2 { transform: translateY(0); opacity: 1; transition-delay: 0.6s; }
        
        .holo-card { width: 95px; height: 110px; background: rgba(10, 10, 12, 0.85); border: 1px solid #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15); cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s ease; }
        .holo-card:hover { background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.4); border-color: #ffffff; }
        
        .float-1 { animation: floatA 3s ease-in-out infinite; }
        .float-2 { animation: floatB 4s ease-in-out infinite 0.5s; height: 130px; margin-bottom: 20px; }
        .float-3 { animation: floatC 3.5s ease-in-out infinite 1s; }
        @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #ffffff; text-shadow: 0 0 10px #ffffff; margin-bottom: 8px; font-weight: bold; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; color: #dddddd; text-align: center; line-height: 1.4; letter-spacing: 1px; }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #888888; margin-top: 10px; letter-spacing: 1.5px; font-weight: bold; transition: color 0.3s; text-transform: uppercase; }
        .completed-text { color: #ffffff !important; text-shadow: 0 0 8px rgba(255,255,255,0.8) !important; }

        /* DẢI BĂNG HỆ THỐNG: ĐEN VIỀN TRẮNG */
        #terminal-bar { position: fixed; bottom: 85px; left: 0; width: 100vw; background: rgba(5, 5, 5, 0.9); border-top: 1px solid #ffffff; border-bottom: 1px solid #ffffff; padding: 12px 0; text-align: center; z-index: 45; opacity: 0; transform: translateY(50px); transition: all 1s ease 1.5s; box-shadow: 0 0 20px rgba(255, 255, 255, 0.15); }
        .assembled #terminal-bar { opacity: 1; transform: translateY(0); }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,255,255,0.8); white-space: nowrap; }
        
        /* ACTION PANEL: BỎ NGOẶC [], MÀU BẠC */
        #action-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px); display: flex; gap: 20px; z-index: 50; opacity: 0; transition: all 1s ease 1.7s; pointer-events: auto; width: 90%; max-width: 350px; justify-content: center; }
        .assembled #action-panel { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .btn-action { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; background: rgba(10, 10, 12, 0.85); border: 1px solid #ffffff; cursor: pointer; text-transform: uppercase; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        .btn-action:hover { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
        .btn-action:active { background: rgba(255, 255, 255, 0.3); }
        .btn-action.glow { animation: pulseWhite 2s infinite alternate; }
        @keyframes pulseWhite { 0% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2), inset 0 0 5px rgba(255, 255, 255, 0.1); text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); } 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.5); text-shadow: 0 0 15px #ffffff; } }
        .btn-action.disabled { color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); animation: none; pointer-events: none; box-shadow: none; }

        /* BẢNG LORE */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(10, 10, 12, 0.95); border: 1px solid #ffffff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1); z-index: 10000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.4); padding-bottom: 10px; }
        .lore-title { color: #ffffff; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 14px; text-shadow: 0 0 8px #ffffff; }
        .lore-close { color: #ff3366; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff3366; }
        .lore-content { color: #dddddd; font-size: 12px; line-height: 1.6; min-height: 190px; font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #ffffff; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; text-shadow: 0 0 5px #fff; }

        /* ================= ĐẤU TRƯỜNG "LÒ BÁT QUÁI" ================= */
        #task-arena { position: fixed; inset: 0; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(6px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        
        .arena-box { width: 95%; max-width: 380px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; background: rgba(15, 15, 20, 0.7); border: 1px solid #ffffff; box-shadow: 0 0 30px rgba(255,255,255,0.1), inset 0 0 15px rgba(255,255,255,0.05); border-radius: 8px; }
        
        .arena-header-bar { display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.4); padding-bottom: 10px; align-items: flex-end; }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #ffffff; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 8px #ffffff; }
        .arena-stats { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #ccc; text-align: right; line-height: 1.6; }
        .highlight-score { color: #ffffff; font-weight: bold; font-size: 15px; text-shadow: 0 0 5px #ffffff; }

        /* THANH ÁP LỰC 60s */
        #timer-bar-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; overflow: hidden; margin-top: 2px; display: none; }
        #timer-progress { width: 100%; height: 100%; background: #ffffff; box-shadow: 0 0 8px #ffffff; transition: width 0.1s linear, background 0.3s ease; }
        #timer-progress.danger { background: #ff3366; animation: flashDanger 0.5s infinite; box-shadow: 0 0 10px #ff3366; }
        @keyframes flashDanger { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .boo-dialog { font-size: 12px; font-family: 'Share Tech Mono', monospace; color: #ddd; width: 100%; min-height: 30px; display: flex; align-items: center; justify-content: center; opacity: 0.9; margin-top: 5px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 4px;}
        .boo-tag { color: #ffffff; font-weight: bold; margin-right: 5px; text-shadow: 0 0 5px #fff; }

        .arena-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid #ffffff; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 12px 20px; cursor: pointer; transition: all 0.3s; border-radius: 4px; width: 100%; max-width: 200px; margin-top: 5px; text-transform: uppercase; text-shadow: 0 0 8px #ffffff; }
        .arena-btn:hover { background: rgba(255, 255, 255, 0.25); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        .btn-red { border-color: #555 !important; color: #aaa !important; background: transparent !important; text-shadow: none !important; }
        .btn-red:hover { background: rgba(255, 51, 102, 0.2) !important; color: #ff3366 !important; border-color: #ff3366 !important; box-shadow: 0 0 15px rgba(255,51,102,0.4) !important;}

        /* LÒ LUYỆN 300x300 */
        .play-area { width: 300px; height: 300px; background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; position: relative; overflow: hidden; margin: 10px 0; display: none; cursor: crosshair; }
        .play-area.active { display: block; }

        /* MỤC TIÊU CỦA PHONG LUÂN (TRẮNG BẠC) */
        .wind-target { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: background 0.1s, box-shadow 0.1s, opacity 0.2s, transform 0.1s; }
        
        /* G1: Bám đuổi */
        .t-track { width: 40px; height: 40px; background: #888; box-shadow: 0 0 15px #888; border: 2px solid #ccc; }
        .t-track.hovered { background: #fff; box-shadow: 0 0 25px #fff; border-color: #fff; }
        
        /* G2: Hóa Hư */
        .t-ghost { width: 45px; height: 45px; background: #fff; box-shadow: 0 0 20px #fff; opacity: 1; }
        .t-ghost.hidden { opacity: 0.15; box-shadow: none; }

        /* G3: Biến Ảo (3 Trạng Thái) */
        .t-multi { width: 45px; height: 45px; }
        .mode-track { background: transparent; border: 2px solid #aaa; box-shadow: 0 0 10px #aaa; }
        .mode-strike { background: #fff; box-shadow: 0 0 30px #fff; }
        .mode-wait { background: transparent; border: 3px solid #fff; box-shadow: 0 0 15px #fff, inset 0 0 10px #fff; }

        /* Hiệu ứng rung đỏ khi sai */
        .hit-flash { animation: flashRed 0.3s ease-out; }
        @keyframes flashRed { 0% { background-color: rgba(255,51,102,0.4); border-color: #ff3366; } 100% { background-color: rgba(15,15,20,0.7); border-color: #ffffff; } }
        
        /* Custom Cursor cho Ải 1 */
        #custom-cursor { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; pointer-events: none; z-index: 100; display: none; box-shadow: 0 0 5px #fff; }

    </style>
</head>
<body>

    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <!-- NHẠC NỀN: Kai Ripe (1) -->
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20(1).mp3"></audio>

    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <div id="lore-modal">
        <div class="lore-header"><span class="lore-title">GIAO THỨC PHONG LUÂN</span><span class="lore-close" onclick="closeLore()">X</span></div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls"><div class="lore-nav" onclick="prevPage()">[ < ]</div><div class="lore-page-indicator" id="lore-page-num">1 / 3</div><div class="lore-nav" onclick="nextPage()">[ > ]</div></div>
    </div>

    <div class="title-hologram" id="thuy-luan-title">ĐẠO TRƯỜNG PHONG LUÂN</div>

    <div id="task-container">
        <div class="card-wrapper" id="wrapper-1">
            <div class="holo-card float-1" id="card-1" onclick="openArena('1', 'I. BÁM ĐUỔI')">
                <div class="card-icon">I</div>
                <div class="card-title">BÁM ĐUỔI<br>(60s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
        
        <div class="card-wrapper" id="wrapper-2">
            <div class="holo-card float-2" id="card-2" onclick="openArena('2', 'II. TIÊN PHONG')"> 
                <div class="card-icon">II</div>
                <div class="card-title">TIÊN PHONG<br>(60s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>

        <div class="card-wrapper" id="wrapper-3">
            <div class="holo-card float-3" id="card-3" onclick="openArena('3', 'III. BIẾN ẢO')">
                <div class="card-icon">III</div>
                <div class="card-title">BIẾN ẢO<br>(60s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
    </div>

    <div id="terminal-bar">
        <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: KHỞI ĐỘNG PHONG LUÂN...</span>
    </div>

    <div id="action-panel">
        <button class="btn-action" onclick="navToCore()">TRỞ VỀ LÕI</button>
        <button class="btn-action disabled" id="btn-save-score" onclick="saveScore()">LƯU ĐIỂM</button>
    </div>

    <!-- ĐẤU TRƯỜNG -->
    <div id="task-arena">
        <div class="arena-box" id="arena-box">
            <div class="arena-header-bar">
                <div class="arena-title" id="arena-title">TÊN ẢI</div>
                <div class="arena-stats">
                    <span id="stat-label">TIME:</span> <span id="arena-val" style="color: #fff; font-weight: bold;">60s</span><br>
                    ĐIỂM: <span class="highlight-score" id="arena-score">0</span>
                </div>
            </div>
            
            <div id="timer-bar-container" style="display: block;"><div id="timer-progress"></div></div>
            
            <!-- LÒ BÁT QUÁI (300x300) -->
            <div class="play-area" id="play-area">
                <div id="custom-cursor"></div>
                <div id="game-target" class="wind-target"></div>
            </div>

            <div class="boo-dialog">
                <span class="boo-tag">[BOO]:</span> <span id="boo-msg">Cảm nhận hướng gió. Sẵn sàng!</span>
            </div>

            <button class="arena-btn" id="arena-btn" onclick="startArena()">KHAI TRẬN</button>
            <button class="arena-btn btn-red" id="close-arena-btn" onclick="closeArena()">THOÁT</button>
        </div>
    </div>

    <script>
        // ================= HỆ THỐNG ÂM THANH =================
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2000, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2); 
                    osc.start(); osc.stop(ctx.currentTime + 0.2); 
                } else if(type === 'error') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if(type === 'coin') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.setValueAtTime(2200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        // ================= LORE =================
        const lorePagesHTML = [
            "<b style='font-size:13px;'>TỔNG QUAN: PHONG LUÂN (TRẮNG BẠC)</b><br><br>Đạo của Gió là tốc độ, sắc bén và vô hình.<br><br>Hoàn thành 3 thử thách thời gian thực (60s) để đoạt lấy điểm số S.C.I.",
            "<b style='font-size:13px;'>I & II: BÁM ĐUỔI VÀ HÓA HƯ</b><br><br>• <b>Bám Đuổi:</b> Di chuột liên tục theo bóng gió. Bám càng sát điểm càng tăng.<br>• <b>Tiên Phong:</b> Bắn trúng lúc gió Hóa Hư (+20). Lúc rõ nét (+10). Trượt (-5).",
            "<b style='font-size:13px;'>III. BIẾN ẢO (THÍCH NGHI)</b><br><br>• Đọc trạng thái của mục tiêu:<br>1. <b style='color:#aaa'>Viền Bạc:</b> Bám theo.<br>2. <b style='color:#fff'>Trắng Sáng:</b> Bắn ngay!<br>3. <b style='color:#fff'>Vòng Trắng Phình To:</b> Đợi căng nhất mới bắn. Sai nhịp: Trừ điểm!"
        ];
        let currentLorePage = 0; let isLoreOpen = false;
        function openLore() { isLoreOpen = true; document.getElementById('lore-modal').classList.add('active'); renderLorePage(); playSound('katana'); }
        function closeLore() { isLoreOpen = false; document.getElementById('lore-modal').classList.remove('active'); playSound('error'); }
        function renderLorePage() { document.getElementById('lore-text').innerHTML = lorePagesHTML[currentLorePage]; document.getElementById('lore-page-num').innerText = `${currentLorePage + 1} / 3`; }
        function nextPage() { if(currentLorePage < 2) { currentLorePage++; renderLorePage(); playSound('error'); } }
        function prevPage() { if(currentLorePage > 0) { currentLorePage--; renderLorePage(); playSound('error'); } }

        window.onload = () => {
            const now = new Date();
            document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('sanctum-bg').style.opacity = '1';
            
            if(localStorage.getItem('bg_music_time')) bgMusic.currentTime = parseFloat(localStorage.getItem('bg_music_time'));
            if(localStorage.getItem('bg_music_muted') === 'true') { bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; } 
            else { bgMusic.muted = false; bgMusic.play().catch(e => {}); }

            setTimeout(() => { document.body.classList.add('assembled'); }, 300);
            setTimeout(updateSystemTerminal, 2500);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } 
            else { bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); }
        }
        function changeVolume(val) { bgMusic.volume = val; if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } }

        // ================= BIẾN GAME =================
        let pTasks = { '1': false, '2': false, '3': false };
        let cGame = '1';
        let aScore = 0;
        let isPlaying = false;
        
        let gTimer;
        let tTotal = 60;
        let tLeft = 60;
        let animId;

        // Tọa độ mục tiêu
        let tx = 150, ty = 150;
        let tAngle = 0, tSpeed = 0, tRotSpeed = 0;
        let tEl = document.getElementById('game-target');
        let playArea = document.getElementById('play-area');

        // Biến riêng Game 2 & 3
        let isGhost = false;
        let ghostInterval;
        let g3Mode = 'TRACK'; // TRACK, STRIKE, WAIT
        let g3ModeInterval;
        let g3Scale = 1;

        // Con trỏ
        let mx = 150, my = 150;

        function updateSystemTerminal() {
            let pending = Object.keys(pTasks).find(k => !pTasks[k]);
            let msgEl = document.getElementById('sys-msg');
            let saveBtn = document.getElementById('btn-save-score');
            if (pending) {
                let name = pending === '1' ? 'BÁM ĐUỔI' : pending === '2' ? 'TIÊN PHONG' : 'BIẾN ẢO';
                msgEl.innerHTML = `>_ [HỆ THỐNG]: CHỜ HOÀN THÀNH [${name}].`;
                saveBtn.classList.remove('glow'); saveBtn.classList.add('disabled');
            } else {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: PHONG LUÂN HOÀN TẤT. HÃY LƯU ĐIỂM.`;
                saveBtn.classList.remove('disabled'); saveBtn.classList.add('glow'); playSound('katana');
            }
        }

        function booMsg(text) { document.getElementById('boo-msg').innerText = text; }

        function openArena(id, name) {
            playSound('katana');
            cGame = id; aScore = 0; isPlaying = false;
            
            document.getElementById('task-container').style.pointerEvents = 'none';
            document.getElementById('arena-title').innerText = name;
            document.getElementById('arena-score').innerText = '0';
            
            playArea.classList.add('active');
            tEl.className = 'wind-target'; // Reset
            tEl.style.display = 'none';
            document.getElementById('custom-cursor').style.display = 'none';
            playArea.style.cursor = 'crosshair';

            tLeft = 60;
            updateTimerBar();
            document.getElementById('arena-val').innerText = "60s";
            
            document.getElementById('arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').innerText = "THOÁT";
            booMsg("Cảm nhận luồng gió. Sẵn sàng!");
            
            document.getElementById('task-arena').classList.add('active');
        }

        function closeArena() {
            playSound('error');
            isPlaying = false;
            clearInterval(gTimer);
            clearInterval(ghostInterval);
            clearInterval(g3ModeInterval);
            cancelAnimationFrame(animId);
            
            document.getElementById('task-arena').classList.remove('active');
            document.getElementById('task-container').style.pointerEvents = 'auto';
        }

        function updateTimerBar() {
            let pct = (tLeft / tTotal) * 100;
            if(pct < 0) pct = 0;
            let bar = document.getElementById('timer-progress');
            bar.style.width = pct + '%';
            if(pct <= 20) bar.classList.add('danger');
            else bar.classList.remove('danger');
        }

        function flashError() {
            document.getElementById('arena-box').classList.add('hit-flash');
            setTimeout(()=>document.getElementById('arena-box').classList.remove('hit-flash'), 300);
            playSound('error');
        }

        function startArena() {
            isPlaying = true; 
            document.getElementById('arena-btn').style.display = 'none';
            document.getElementById('close-arena-btn').style.display = 'none';
            playSound('katana');
            
            tx = 150; ty = 150; tAngle = Math.random() * Math.PI * 2;
            tEl.style.display = 'flex';
            
            gTimer = setInterval(() => {
                tLeft--;
                document.getElementById('arena-val').innerText = `${tLeft}s`;
                updateTimerBar();
                if(tLeft <= 0) finishGame();
            }, 1000);

            if(cGame === '1') initG1();
            else if(cGame === '2') initG2();
            else if(cGame === '3') initG3();
            
            animId = requestAnimationFrame(gameLoop);
        }

        // Bắt tọa độ chuột trong ô 300x300
        playArea.onmousemove = (e) => {
            let rect = playArea.getBoundingClientRect();
            mx = e.clientX - rect.left;
            my = e.clientY - rect.top;
            
            if(cGame === '1') {
                let cursor = document.getElementById('custom-cursor');
                cursor.style.left = (mx - 6) + 'px';
                cursor.style.top = (my - 6) + 'px';
            }
        };

        // Click Logic
        playArea.onmousedown = (e) => {
            if(!isPlaying) return;
            let dist = Math.hypot(mx - tx, my - ty);
            
            if(cGame === '2') {
                if(dist < 30) {
                    aScore += isGhost ? 20 : 10;
                    playSound('coin'); booMsg(isGhost ? "TRÚNG HÓA HƯ! (+20)" : "TRÚNG! (+10)");
                } else {
                    aScore = Math.max(0, aScore - 5);
                    flashError(); booMsg("TRƯỢT! (-5)");
                }
            } 
            else if(cGame === '3') {
                if(g3Mode === 'STRIKE' && dist < 30) {
                    aScore += 20; playSound('coin'); booMsg("SÁT PHẠT TỐT! (+20)");
                    tEl.style.background = "#000"; setTimeout(()=> tEl.style.background = "#fff", 100);
                } else if (g3Mode === 'WAIT' && dist < 30 && g3Scale > 1.4) {
                    aScore += 30; playSound('coin'); booMsg("ĐIỀM TĨNH CHUẨN XÁC! (+30)");
                    tEl.style.background = "#fff"; setTimeout(()=> tEl.style.background = "transparent", 100);
                } else {
                    if(g3Mode !== 'TRACK') {
                        aScore = Math.max(0, aScore - 10);
                        flashError(); booMsg("SAI NHỊP! (-10)");
                    }
                }
            }
            document.getElementById('arena-score').innerText = Math.floor(aScore);
        };

        // ================= KHỞI TẠO TỪNG GAME =================
        function initG1() {
            tEl.className = 'wind-target t-track';
            playArea.style.cursor = 'none';
            document.getElementById('custom-cursor').style.display = 'block';
            tSpeed = 4;
            booMsg("Dùng con trỏ bám sát mục tiêu!");
        }

        function initG2() {
            tEl.className = 'wind-target t-ghost';
            tSpeed = 5;
            booMsg("Đoán quỹ đạo khi Hóa Hư!");
            ghostInterval = setInterval(() => {
                if(!isPlaying) return;
                isGhost = !isGhost;
                if(isGhost) tEl.classList.add('hidden');
                else tEl.classList.remove('hidden');
                booMsg(isGhost ? "HÓA HƯ (Khó)" : "HIỆN HỮU (Dễ)");
            }, 1500);
        }

        function initG3() {
            tEl.className = 'wind-target t-multi mode-track';
            tSpeed = 4.5;
            g3ModeInterval = setInterval(() => {
                if(!isPlaying) return;
                const modes = ['TRACK', 'STRIKE', 'WAIT'];
                g3Mode = modes[Math.floor(Math.random() * modes.length)];
                
                tEl.classList.remove('mode-track', 'mode-strike', 'mode-wait');
                if(g3Mode === 'TRACK') { tEl.classList.add('mode-track'); booMsg("LƯU CHUYỂN: Bám theo!"); }
                else if(g3Mode === 'STRIKE') { tEl.classList.add('mode-strike'); booMsg("SÁT PHẠT: Bấm ngay!"); }
                else if(g3Mode === 'WAIT') { tEl.classList.add('mode-wait'); booMsg("ĐIỀM TĨNH: Đợi nó nở to!"); }
            }, 2500);
        }

        // ================= GAME LOOP CHUNG =================
        function gameLoop() {
            if(!isPlaying) return;

            // Di chuyển
            tRotSpeed += (Math.random() - 0.5) * 0.05;
            tRotSpeed = Math.max(-0.15, Math.min(0.15, tRotSpeed));
            tAngle += tRotSpeed;

            // Tốc độ biến thiên nhẹ
            let pulse = Math.sin(Date.now() * 0.002) * 2;
            let currentSpeed = tSpeed + pulse;

            tx += Math.cos(tAngle) * currentSpeed;
            ty += Math.sin(tAngle) * currentSpeed;

            // Bật tường (Giới hạn trong 300x300, trừ bù kích thước mục tiêu 45px -> 255)
            let margin = 20;
            if (tx < margin) { tx = margin; tAngle = Math.PI - tAngle; }
            if (tx > 280) { tx = 280; tAngle = Math.PI - tAngle; }
            if (ty < margin) { ty = margin; tAngle = -tAngle; }
            if (ty > 280) { ty = 280; tAngle = -tAngle; }

            // Logic Riêng
            let dist = Math.hypot(mx - tx, my - ty);
            
            if(cGame === '1') {
                if(dist < 30) {
                    aScore += 0.2; tEl.classList.add('hovered');
                } else {
                    tEl.classList.remove('hovered');
                }
            } 
            else if(cGame === '3') {
                if(g3Mode === 'TRACK') {
                    if(dist < 30) { aScore += 0.2; tEl.style.background = "#fff"; } 
                    else { tEl.style.background = "transparent"; }
                } else if(g3Mode === 'WAIT') {
                    g3Scale = 1 + Math.sin(Date.now() * 0.005) * 0.6; // Nở to thu nhỏ nhanh
                    tEl.style.transform = `translate(-50%, -50%) scale(${g3Scale})`;
                } else {
                    tEl.style.transform = `translate(-50%, -50%) scale(1)`;
                }
            }

            if(cGame === '1' || (cGame === '3' && g3Mode === 'TRACK')) {
                document.getElementById('arena-score').innerText = Math.floor(aScore);
            }

            // Gắn tọa độ (Căn giữa tâm mục tiêu bằng translate)
            tEl.style.left = tx + 'px';
            tEl.style.top = ty + 'px';
            if(cGame !== '3' || (cGame === '3' && g3Mode !== 'WAIT')) {
                tEl.style.transform = `translate(-50%, -50%)`;
            }

            animId = requestAnimationFrame(gameLoop);
        }

        // ================= KẾT THÚC =================
        function finishGame() {
            isPlaying = false; 
            clearInterval(gTimer); clearInterval(ghostInterval); clearInterval(g3ModeInterval);
            cancelAnimationFrame(animId);
            
            tEl.style.display = 'none';
            document.getElementById('custom-cursor').style.display = 'none';
            playArea.style.cursor = 'default';
            document.getElementById('close-arena-btn').style.display = 'block';
            
            let finalScore = Math.floor(aScore);
            let target = (cGame === '1') ? 100 : (cGame === '2' ? 50 : 80); // Đặt mốc qua ải ngẫu nhiên
            
            if(finalScore >= target) {
                booMsg(`VIÊN MÃN! Gió đã lặng. Điểm: ${finalScore}`);
                let card = document.getElementById(`card-${cGame}`);
                card.querySelector('.card-status').innerHTML = "ĐÃ XONG";
                card.querySelector('.card-status').classList.add('completed-text');
                card.style.borderColor = "#ffffff";
                pTasks[cGame] = true; playSound('warp-out');
            } else {
                booMsg(`CHƯA ĐẠT! Cần tối thiểu ${target} điểm.`); playSound('error');
            }
            updateSystemTerminal();
        }

        function saveScore() {
            if(document.getElementById('btn-save-score').classList.contains('disabled')) return;
            playSound('coin');
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐÃ LƯU KẾT QUẢ VỀ LÕI!`;
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        }
        
        function navToCore() {
            playSound('error');
            document.body.classList.remove('assembled');
            document.getElementById('sanctum-bg').style.opacity = '0';
            setTimeout(() => { window.location.href = 'index.html'; }, 800); 
        }
    </script>
</body>
</html>
