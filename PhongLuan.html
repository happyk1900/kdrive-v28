<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010a15">
    <title>K-Drive - Phong Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #010a15;
            --cyan: #00e5ff;
            --mint: #38ef7d;    
            --neon-red: #ff3366; 
            --amber: #ffaa00;   
            --crimson: #ff3366;
            --text-light: #ffffff;
            --accent-red: #ff3366; 
            --panel-bg: rgba(5, 12, 22, 0.88); 
            --panel-border: rgba(255, 51, 102, 0.7); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        /* VIDEO NỀN ĐỘNG PHONG LUÂN HIỆN MỜ CHẬM RÃI (3 GIÂY) CÓ ÂM THANH */
        #sanctum-video { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            object-fit: cover; opacity: 0;
            transition: opacity 3.0s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #sanctum-video.loaded { opacity: 1; }
        #sanctum-video.playing-mode { opacity: 0; pointer-events: none; transition: opacity 2.0s cubic-bezier(0.25, 1, 0.5, 1); }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px #ff3366; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 380px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background: var(--bg-obsidian) !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #ff3366; box-shadow: 0 0 25px #ff3366, 0 0 50px #ffffff; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        @keyframes cinematicPopupSuperSlow {
            0% { opacity: 0; transform: translateY(90px) scale(0.90); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 16px; opacity: 0; visibility: hidden; transition: opacity 1.5s ease; }
        #start-prompt-overlay.active { opacity: 1; visibility: visible; }
        #start-prompt-overlay > * { animation: cinematicPopupSuperSlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; opacity: 0; }

        .briefing-panel { background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px 26px; width: 100%; max-width: 340px; text-align: left; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .briefing-title { color: var(--accent-red) !important; font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 51, 102, 0.4); padding-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,51,102,0.6); }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.7; font-weight: 600; }
        .briefing-target b { color: var(--accent-red); font-weight: bold; }

        .action-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: var(--panel-bg); backdrop-filter: blur(16px); border: 1.5px solid var(--panel-border); padding: 15px; border-radius: 12px; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 25px rgba(255, 51, 102, 0.25); text-align: center; transition: 0.4s; text-shadow: 0 0 8px rgba(255,51,102,0.6); }
        .start-action-box:active { background: var(--accent-red); color: #010a15; transform: scale(0.98); }

        .game-top-bar {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease;
        }
        .game-top-bar.visible { opacity: 1; }

        .health-container { display: flex; gap: 4px; align-items: center; }
        .health-bar { width: 14px; height: 6px; background: rgba(255,255,255,0.15); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.cyan.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
        .health-bar.pink.active { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; color: #fff; display: flex; align-items: center; position: relative; }
        .data-score span { color: var(--cyan); text-shadow: 0 0 12px var(--cyan); font-size: 20px; margin-left: 6px; }

        #hp-notification-area { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); width: 220px; text-align: center; }

        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw;
            border-top: 1px solid rgba(255, 51, 102, 0.5); padding: 15px 20px 0 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto;
            background: linear-gradient(0deg, rgba(1,10,21,0.95) 0%, transparent 100%); opacity: 0; transition: opacity 1.5s ease;
        }
        .game-bottom-bar.visible { opacity: 1; }

        .btn-action {
            width: 46px; height: 46px; background: rgba(5, 12, 22, 0.85); 
            border: 1.5px solid rgba(255, 51, 102, 0.75); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active { transform: scale(0.9); }
        
        .btn-back { color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: bold; box-shadow: 0 0 12px rgba(255,51,102,0.4); padding-bottom: 2px; padding-right: 2px; }
        .btn-back:active { background: rgba(255, 51, 102, 0.35); box-shadow: 0 0 20px rgba(255, 51, 102, 0.9); }

        .btn-skip { border-color: rgba(255, 51, 102, 0.75); color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: bold; box-shadow: 0 0 12px rgba(255,51,102,0.4); }
        .btn-skip:active { background: rgba(255, 51, 102, 0.35); box-shadow: 0 0 20px rgba(255, 51, 102, 0.9); }

        .btn-mute { border-color: rgba(255, 51, 102, 0.6); color: #ff3366; font-size: 20px; box-shadow: 0 0 12px rgba(255, 51, 102, 0.3); }
        .btn-mute:active { background: rgba(255, 51, 102, 0.3); box-shadow: 0 0 20px rgba(255, 51, 102, 0.7); }

        .btn-pause { border-color: rgba(255, 170, 0, 0.6); box-shadow: 0 0 12px rgba(255, 170, 0, 0.3); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 18px; background: var(--amber); margin: 0 3px; border-radius: 2px; box-shadow: 0 0 8px var(--amber); }
        .btn-pause:active { background: rgba(255, 170, 0, 0.3); box-shadow: 0 0 20px rgba(255, 170, 0, 0.7); }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; backdrop-filter: blur(10px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 320px; background: rgba(5, 12, 22, 0.95); border: 1.5px solid rgba(255,51,102,0.6); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: cinematicPopupSuperSlow 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pause-title { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: var(--accent-red); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,51,102,0.6); }
        .pause-btn { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 51, 102, 0.2); border: 1px solid var(--crimson); color: var(--crimson); margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: transparent; z-index: 200000; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #freeze-overlay.active { display: flex; }
        @keyframes textFallSlow {
            0% { opacity: 0; transform: translateY(-70px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .freeze-text { font-family: 'Share Tech Mono', monospace; font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 20px #ff3366, 0 0 40px rgba(255,51,102,0.8), 2px 2px 0px rgba(0,0,0,0.9); background: transparent; padding: 0; border: none; box-shadow: none; animation: textFallSlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        #result-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 150; gap: 14px; padding: 12px; opacity: 0; transition: opacity 1.2s ease; }
        #result-overlay.active { display: flex; opacity: 1; }
        #result-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }

        .stage-badge-header { font-family: 'Share Tech Mono', monospace; font-size: 26px; color: #ffffff; letter-spacing: 3px; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 15px rgba(255,51,102,0.8); }
        
        .prestige-panel { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .prestige-total-box { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; padding-top: 2px; width: 100%; }
        .prestige-total-label { color: #ffffff; font-size: 14px; font-weight: 900; letter-spacing: 1px; flex: 1; text-align: left; }
        .prestige-total-num { font-size: 28px; color: var(--accent-red); font-weight: 900; line-height: 1; text-align: right; min-width: 90px; text-shadow: 0 0 10px rgba(255,51,102,0.6); }

        .bio-metrics-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,51,102,0.4); padding-bottom: 10px; margin-bottom: 4px; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; text-align: right; text-shadow: 0 0 8px rgba(255,51,102,0.5); }

        .rank-icon-img { width: 24px; height: 24px; vertical-align: middle; margin-right: 6px; filter: drop-shadow(0 0 3px rgba(255,255,255,0.3)); }

        .result-btn-row { display: flex; gap: 10px; width: 92%; max-width: 340px; margin-top: 10px; }
        .result-action-btn { flex: 1; padding: 14px; font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; border-radius: 12px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; backdrop-filter: blur(8px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #btn-replay { background: var(--panel-bg); border: 1.5px solid var(--crimson); color: var(--crimson); }
        #btn-replay:active { background: var(--crimson); color: #fff; }
        #btn-next { background: var(--panel-bg); border: 1.5px solid var(--accent-red); color: var(--accent-red); }
        #btn-next:active { background: var(--accent-red); color: #fff; }

        /* BẢNG TỔNG KẾT CUỐI CÙNG */
        #final-summary-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 12px; padding: 12px; opacity: 0; transition: opacity 1.2s ease; }
        #final-summary-overlay.active { display: flex; opacity: 1; }
        #final-summary-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }

        .final-header { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #ffffff; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,51,102,0.8); }
        
        .stat-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); padding: 24px; border-radius: 18px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 100px; color: var(--accent-red); text-shadow: 0 0 8px rgba(255,51,102,0.4); }

        .final-btn-exit { width: 92%; max-width: 340px; padding: 14px; background: var(--panel-bg); backdrop-filter: blur(8px); border: 1.5px solid var(--accent-red); border-radius: 12px; color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: 0.2s; text-align: center; margin-top: 5px; box-shadow: 0 8px 20px rgba(255,51,102,0.3); text-shadow: 0 0 8px rgba(255,51,102,0.5); }
        .final-btn-exit:hover { background: var(--accent-red); color: #fff; }

        .master-feedback { font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: var(--accent-red); font-style: italic; text-align: center; margin-top: 8px; line-height: 1.5; font-weight: 600; max-width: 340px; text-shadow: 0 0 8px rgba(255,51,102,0.4); }

        /* KHU VỰC CHƠI GAME */
        #game-play-zone { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; overflow: hidden; z-index: 10; display: none;}
        #game-play-zone.active { display: block;}
        
        .wind-target { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease, opacity 0.15s ease; } 
        
        .t-track-mode { background: #ffffff; border: 2px solid #ff3366; box-shadow: 0 0 20px #ffffff, 0 0 40px rgba(255, 51, 102, 0.8); }
        .t-track-mode.hovered { border-color: #ffffff; box-shadow: 0 0 30px #ffffff, 0 0 60px #ff3366; background: #ffffff; transform: translate(-50%, -50%) scale(1.15); }
        
        .style-slash { background: #ffffff; border: 2.5px solid #ff3366; box-shadow: 0 0 25px #ff3366, 0 0 50px rgba(255,255,255,0.8); transition: opacity 0.15s ease; }

        #custom-cursor { position: absolute; width: 20px; height: 20px; border: 2px solid #ff3366; border-radius: 50%; pointer-events: none; z-index: 100; display: none; box-shadow: 0 0 12px #ff3366; transform: translate(-50%, -50%); }

        #warning-bar-container { position: absolute; bottom: max(80px, calc(env(safe-area-inset-bottom) + 80px)); left: 50%; transform: translateX(-50%); width: 200px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden; display: none; z-index: 130;}
        #warning-progress { width: 0%; height: 100%; background: var(--crimson); transition: width 0.1s linear; }

        .flashbang-red { position: fixed; inset: 0; background: rgba(255, 51, 102, 0.4); z-index: 999999; pointer-events: none; animation: flashRed 0.4s forwards; }
        @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }

    </style>
</head>
<body>

    <!-- VIDEO NỀN ĐỘNG PHONG LUÂN CÓ ÂM THANH -->
    <video id="sanctum-video" autoplay loop playsinline>
        <source src="https://github.com/happyk1900/Kai-Ripe/raw/refs/heads/main/video%20nen%20phong%20luan.mp4" type="video/mp4">
    </video>

    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <!-- TẦNG TRÊN: HIỂN THỊ MÁU VÀ ĐIỂM -->
            <div id="game-top-bar" class="game-top-bar">
                <div class="health-container">
                    <div class="health-bar cyan active" id="hp-g-1"></div>
                    <div class="health-bar cyan active" id="hp-g-2"></div>
                    <div class="health-bar cyan active" id="hp-g-3"></div>
                    <div class="health-bar cyan active" id="hp-g-4"></div>
                    <div class="health-bar cyan active" id="hp-g-5"></div>
                </div>

                <div class="data-score">DATA: <span id="boo-points">0</span>
                    <div id="hp-notification-area"></div>
                </div>

                <div class="health-container">
                    <div class="health-bar pink" id="hp-p-1"></div>
                    <div class="health-bar pink" id="hp-p-2"></div>
                    <div class="health-bar pink" id="hp-p-3"></div>
                    <div class="health-bar pink" id="hp-p-4"></div>
                    <div class="health-bar pink" id="hp-p-5"></div>
                </div>
            </div>

            <!-- THANH ĐIỀU HƯỚNG DƯỚI BỐ CỤC 4 NÚT (Back, Skip, Mute, Pause) -->
            <div id="game-bottom-bar" class="game-bottom-bar">
                <button class="btn-action btn-back" onclick="confirmExitToLobby()">⟨</button>
                <button class="btn-action btn-skip" id="btn-skip-stage" onclick="skipToNextStage()" title="Chuyển bài">⏭</button>
                <button class="btn-action btn-mute" id="btn-mute" onclick="toggleVideoMute()" title="Bật/Tắt tiếng video">🔊</button>
                <button class="btn-action btn-pause" onclick="pauseGame()"></button>
            </div>

            <div id="start-prompt-overlay">
                <div id="briefing-panel" class="briefing-panel">
                    <div class="briefing-title" id="briefing-title"></div>
                    <div class="briefing-target" id="briefing-target"></div>
                </div>
                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>

            <!-- KHU VỰC CHƠI GAME Ở GIỮA -->
            <div id="game-play-zone">
                <div id="custom-cursor"></div>
                <div id="game-target" class="wind-target" onpointerdown="handleTargetClick(event)"></div>
                <div id="warning-bar-container"><div id="warning-progress"></div></div>
            </div>

            <!-- KẾT QUẢ TỪNG BÀI -->
            <div id="result-overlay">
                <div class="stage-badge-header" id="stage-badge-title">KẾT QUẢ BÀI 1</div>
                
                <div class="prestige-panel">
                    <div class="prestige-total-box">
                        <span class="prestige-total-label">TỔNG ĐIỂM BÀI NÀY:</span>
                        <span class="prestige-total-num" id="final-score-display">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <div class="metric-card-row">
                        <span class="metric-label" id="result-metric-name">Chuỗi bám dính Max</span>
                        <span class="metric-val" id="result-metric-val">0.0s</span>
                    </div>
                    <div class="metric-card-row" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                        <span class="metric-label">XẾP HẠNG</span>
                        <span class="metric-val" id="stage-rank-display">KÉM</span>
                    </div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="retryCurrentStage()">TẬP LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="proceedNextStage()">BÀI 2</button>
                </div>
            </div>

            <!-- BẢNG TỔNG KẾT CUỐI CÙNG -->
            <div id="final-summary-overlay">
                <div class="final-header">TỔNG KẾT PHONG LUÂN</div>
                
                <div class="stat-box">
                    <div class="stat-line"><span>BÀI 1:</span> <span class="stat-val" id="sum-score-1" style="color:var(--accent-red);">0</span></div>
                    <div class="stat-line"><span>BÀI 2:</span> <span class="stat-val" id="sum-score-2" style="color:var(--accent-red);">0</span></div>
                    <div class="stat-line" style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.15);">
                        <span style="font-weight: 900; color: #f0f4f8;">TỔNG ĐIỂM DATA:</span> <span class="stat-val" id="sum-score-total" style="font-weight:900; color:var(--accent-red); font-size:16px;">0</span>
                    </div>
                    <div class="stat-line" style="border-top: 1px dashed rgba(255,255,255,0.15); margin-top: 4px; padding-top: 6px;">
                        <span>XẾP HẠNG DATA:</span>
                        <span id="sum-rank-title" style="color: var(--accent-red);">KÉM</span>
                    </div>
                </div>

                <div class="bio-metrics-box" style="padding: 18px; gap: 10px;">
                    <div class="metric-card-row">
                        <span class="metric-label">Chuỗi bám dính Max</span>
                        <span class="metric-val" id="final-focus">0.0s</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Tốc độ phản ứng</span>
                        <span class="metric-val" id="final-slash">0 ms</span>
                    </div>
                    <div class="master-feedback" id="master-feedback-text">Chờ đánh giá...</div>
                </div>

                <button class="final-btn-exit" onclick="closeArena()">VỀ SẢNH CHÍNH</button>
            </div>
            
        </div>
    </div>

    <script>
        const RANK_ICONS = {
            'Kém': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%201%20(1).png?raw=true',
            'Trung Bình': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%202%20(1).png?raw=true',
            'Giỏi': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%203%20(1).png?raw=true',
            'Xuất Sắc': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%204%20(1).png?raw=true',
            'Thần Đồng': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%205%20(1).png?raw=true'
        };

        function getRankByPhongLuanScore(score) {
            if (score < 2000) return { name: "Kém", feedback: "Chưa làm chủ được quỹ đạo. Cần tập trung hơn!" };
            if (score >= 7000) return { name: "Thần Đồng", feedback: "Cảnh giới viễn tưởng! Khả năng quan sát vượt ngưỡng nhân loại." };
            if (score >= 6000) return { name: "Xuất Sắc", feedback: "Tốc độ bắt dính và phán đoán không gian cực kỳ sắc bén." };
            if (score >= 4000) return { name: "Giỏi", feedback: "Tốc độ đáng gờm, giới hạn đỉnh cao của người bình thường." };
            if (score >= 2000) return { name: "Trung Bình", feedback: "Cảm giác không gian ổn định, cần đẩy nhanh tốc độ hơn." };
            return { name: "Kém", feedback: "Cần rèn luyện thêm!" };
        }

        function getRankHTML(rankName) {
            let iconUrl = RANK_ICONS[rankName] || RANK_ICONS['Kém'];
            return `<img src="${iconUrl}" class="rank-icon-img" alt="Rank"> <span style="vertical-align: middle;">${rankName.toUpperCase()}</span>`;
        }

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) { fxCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (fxCtx && fxCtx.state === 'suspended') { fxCtx.resume(); }
                let vid = document.getElementById('sanctum-video');
                if (vid && !vid.dataset.userMuted) { vid.muted = false; vid.play().catch(e => {}); }
            } catch(e) {}
        }
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => { window.addEventListener(evt, initAudio, { passive: true }); });

        function toggleVideoMute() {
            let vid = document.getElementById('sanctum-video');
            let muteBtn = document.getElementById('btn-mute');
            if(!vid) return;
            vid.muted = !vid.muted;
            vid.dataset.userMuted = vid.muted ? 'true' : 'false';
            muteBtn.innerHTML = vid.muted ? '🔇' : '🔊';
            playSound('coin');
        }

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; 
                    osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); 
                    osc.start(); osc.stop(ctx.currentTime + 0.3); 
                } 
                else if(type === 'error') { 
                    osc.type = 'square'; 
                    osc.frequency.setValueAtTime(100, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.4, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } 
                else if(type === 'coin') { 
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); 
                    osc.start(); osc.stop(ctx.currentTime + 0.2); 
                } 
            } catch (e) {}
        }

        let cGame = '1'; 
        let aScore = 0; 
        let stabilityHP = 5; 
        let isPlaying = false; 
        let isPausedForStart = true;
        
        let sessionScoreG1 = 0, sessionScoreG2 = 0;
        
        let currentFocusFrames = 0;
        let maxFocusFrames = 0;
        let targetAppearTime = 0;
        let reactionTimesG2 = [];
        let finalMaxFocusSec = 0;
        let finalAvgSlashMs = 0;
        
        let loopRaf;
        let gTimeouts = [];

        let playArea = document.getElementById('play-area');
        let maxX = 380;
        let maxY = window.innerHeight;
        
        let tx = maxX / 2, ty = maxY / 2;
        let tAngle = 0;
        let tEl = document.getElementById('game-target');
        let mx = maxX / 2, my = maxY / 2;

        let gFrameCount = 0;
        let gNextTurnFrame = 0;
        let gDashFrames = 0;
        let gDashMultiplier = 1;
        let gMissFrames = 0;

        let isGhost = false;
        let gTargetClicked = false; 
        let nextHpMilestone = 1000;

        window.onload = () => { 
            openArena('1'); 
            initSparkleParticles();
        };

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<35; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function updateHpDisplay() {
            let hp = Math.min(10, Math.max(0, stabilityHP));
            let cyanCount = Math.min(5, hp);
            let pinkCount = Math.max(0, hp - 5);

            for(let i=1; i<=5; i++) {
                document.getElementById('hp-g-'+i).classList.toggle('active', i <= cyanCount);
                document.getElementById('hp-p-'+i).classList.toggle('active', i <= pinkCount);
            }
        }

        function showHpRewardAlert() {
            let alertBox = document.createElement('div');
            alertBox.className = 'status-notification';
            alertBox.innerHTML = `+1 NĂNG LƯỢNG ĐỎ`;
            document.getElementById('hp-notification-area').appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 1200);
        }

        function openArena(id) {
            cGame = id; aScore = 0; stabilityHP = 5; isPlaying = false; isPausedForStart = true;
            nextHpMilestone = 1000;
            currentFocusFrames = 0; maxFocusFrames = 0; targetAppearTime = 0; reactionTimesG2 = [];
            
            cancelAnimationFrame(loopRaf);
            clearAllTimeouts();

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('playing-mode');
            setTimeout(() => vid.classList.add('loaded'), 150);

            let playAreaWrap = document.getElementById('play-area');
            playAreaWrap.classList.remove('fullscreen-mode');

            updateHpDisplay(); document.getElementById('boo-points').innerText = "0";
            document.getElementById('result-overlay').classList.remove('active');
            document.getElementById('pause-menu-overlay').classList.remove('active');
            document.getElementById('final-summary-overlay').classList.remove('active');
            document.getElementById('game-play-zone').classList.remove('active');
            
            let bTitle = "", bTarget = "";
            if (id === '1') {
                bTitle = "BÀI 1 — GIỮ VỮNG QUỸ ĐẠO"; 
                bTarget = "Tập luyện mỗi ngày giúp bạn cải thiện khả năng phán đoán, rèn luyện sự khéo léo để bám sát và làm chủ quỹ đạo di chuyển[span_1](start_span)[span_1](end_span).<br><br><span style='color:var(--accent-red); font-weight:bold;'>MỤC TIÊU:</span> Rê ngón tay bám sát điểm sáng. Giữ nhịp liên tục[span_2](start_span)[span_2](end_span)!";
            } else if (id === '2') {
                bTitle = "BÀI 2 — PHÁN ĐOÁN VỊ TRÍ"; 
                bTarget = "Tập luyện mỗi ngày giúp bạn cải thiện khả năng phán đoán, nâng cao khả năng dự đoán mục tiêu khi di chuyển và ẩn hiện[span_3](start_span)[span_3](end_span).<br><br><span style='color:var(--accent-red); font-weight:bold;'>MỤC TIÊU:</span> Chạm trúng mục tiêu khi xuất hiện[span_4](start_span)[span_4](end_span)!";
            } 

            document.getElementById('briefing-title').innerText = bTitle; document.getElementById('briefing-target').innerHTML = bTarget;
            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.remove('active');
            setTimeout(() => {
                promptOverlay.classList.remove('hidden');
                setTimeout(() => promptOverlay.classList.add('active'), 200);
            }, 500);
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.remove('active');
            setTimeout(() => promptOverlay.classList.add('hidden'), 1200);
            
            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('loaded');
            vid.classList.add('playing-mode');

            playSound('katana', 0.6); let laser = document.createElement('div'); laser.className = 'laser-beam-horizontal'; document.body.appendChild(laser);
            setTimeout(() => { let playAreaWrap = document.getElementById('play-area'); playAreaWrap.classList.add('fullscreen-mode'); laser.classList.add('expand'); }, 600);
            setTimeout(() => { 
                laser.remove(); isPausedForStart = false; 
                document.getElementById('game-top-bar').classList.add('visible'); 
                document.getElementById('game-bottom-bar').classList.add('visible'); 
                document.getElementById('game-play-zone').classList.add('active'); startArena(); 
            }, 1500);
        }

        function clearAllTimeouts() {
            gTimeouts.forEach(t => clearTimeout(t));
            gTimeouts = [];
        }

        function startArena() {
            aScore = 0;
            stabilityHP = 5;
            cancelAnimationFrame(loopRaf);
            clearAllTimeouts();

            isPlaying = true; 
            playSound('katana');
            
            document.getElementById('boo-points').innerText = '0';
            updateHpDisplay();

            maxX = document.getElementById('play-area').clientWidth;
            maxY = document.getElementById('play-area').clientHeight;
            tx = maxX / 2; ty = maxY / 2; tAngle = Math.random() * Math.PI * 2;
            tEl.style.display = 'flex';

            if(cGame === '1') initG1();
            else if(cGame === '2') initG2();
            
            loopRaf = requestAnimationFrame(gameLoop);
        }

        function pauseGame() { if(!isPlaying || isPausedForStart) return; playSound('error'); isPausedForStart = true; clearAllTimeouts(); cancelAnimationFrame(loopRaf); document.getElementById('pause-menu-overlay').classList.add('active'); }
        function resumeGame() { playSound('coin'); document.getElementById('pause-menu-overlay').classList.remove('active'); isPausedForStart = false; 
            if(cGame === '2') scheduleGhostToggle(); 
            loopRaf = requestAnimationFrame(gameLoop);
        }
        function confirmExitToLobby() { playSound('error'); window.location.href = 'LucChien.html'; }
        function closeArena() { window.location.href = 'LucChien.html'; }

        function skipToNextStage() {
            playSound('coin');
            isPlaying = false; isPausedForStart = true; clearAllTimeouts(); cancelAnimationFrame(loopRaf);
            let playAreaWrap = document.getElementById('play-area');
            playAreaWrap.classList.remove('fullscreen-mode');
            document.getElementById('game-play-zone').classList.remove('active');
            tEl.style.display = 'none';

            if (cGame === '1') {
                sessionScoreG1 = Math.floor(aScore); 
                localStorage.setItem('phong_luan_bai1_score', sessionScoreG1);
                openArena('2');
            } else {
                sessionScoreG2 = Math.floor(aScore); 
                localStorage.setItem('phong_luan_bai2_score', sessionScoreG2);
                openArena('1');
            }
        }

        function updateMousePos(e) {
            if(!isPlaying || isPausedForStart) return;
            if (e.touches && e.touches.length > 0) {
                let rect = playArea.getBoundingClientRect();
                mx = e.touches[0].clientX - rect.left; my = e.touches[0].clientY - rect.top;
            } else {
                let rect = playArea.getBoundingClientRect();
                mx = e.clientX - rect.left; my = e.clientY - rect.top;
            }
            if(cGame === '1') {
                let cursor = document.getElementById('custom-cursor');
                cursor.style.left = mx + 'px';
                cursor.style.top = my + 'px';
            }
        }
        document.getElementById('game-play-zone').addEventListener('mousemove', updateMousePos);
        document.getElementById('game-play-zone').addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});

        function handleTargetClick(e) {
            if(!isPlaying || isPausedForStart) return;
            
            if(cGame === '2') {
                e.stopPropagation(); 
                
                if (!isGhost && !gTargetClicked) {
                    gTargetClicked = true;
                    let rt = Date.now() - targetAppearTime;
                    reactionTimesG2.push(rt);

                    let pointsToAdd = 30;
                    if(aScore >= 7000) pointsToAdd = 90;
                    else if(aScore >= 6000) pointsToAdd = 75;
                    else if(aScore >= 4000) pointsToAdd = 60;
                    else if(aScore >= 3000) pointsToAdd = 45;
                    else if(aScore >= 2000) pointsToAdd = 35;

                    addScore(pointsToAdd);
                    playSound('katana'); 
                    
                    tEl.style.transition = 'none';
                    tEl.style.opacity = '0'; 
                    isGhost = true;
                    
                    tx = 60 + Math.random() * (maxX - 120); 
                    ty = 95 + Math.random() * (maxY - 170); 
                    tEl.style.left = tx + 'px';
                    tEl.style.top = ty + 'px';

                    clearAllTimeouts();
                    let speedFactor = aScore < 2000 ? 1.4 : Math.max(0.4, 1 - ((aScore - 2000) / 5000));
                    let nextTime = Math.floor(Math.random() * 800) + 500;
                    let tm = setTimeout(scheduleGhostToggle, nextTime * speedFactor);
                    gTimeouts.push(tm);
                }
            } 
        }

        function addScore(points) {
            aScore += points;
            document.getElementById('boo-points').innerText = Math.floor(aScore);

            if (aScore >= nextHpMilestone) {
                nextHpMilestone += 1000;
                stabilityHP = Math.min(10, stabilityHP + 1);
                updateHpDisplay();
                showHpRewardAlert();
            }
        }

        function loseLife() {
            stabilityHP -= 1; 
            updateHpDisplay();
            playSound('error');
            
            let flash = document.createElement('div'); flash.className = 'flashbang-red'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 400);

            if(stabilityHP <= 0) finishGame();
        }

        function initG1() {
            tEl.className = 'wind-target t-track-mode';
            tEl.style.transition = ''; 
            document.getElementById('custom-cursor').style.display = 'block';
            document.getElementById('warning-bar-container').style.display = 'block';
            gMissFrames = 0;
            gFrameCount = 0;
            gDashFrames = 0;
            gDashMultiplier = 1;
            gNextTurnFrame = Math.floor(Math.random() * 60) + 30; 
            tAngle = Math.random() * Math.PI * 2;
        }

        function initG2() {
            tEl.className = 'wind-target style-slash'; 
            document.getElementById('custom-cursor').style.display = 'none';
            document.getElementById('warning-bar-container').style.display = 'none'; 
            isGhost = true; 
            gTargetClicked = false;
            
            gFrameCount = 0;
            gDashFrames = 0;
            gDashMultiplier = 1;
            gNextTurnFrame = Math.floor(Math.random() * 60) + 30; 
            tAngle = Math.random() * Math.PI * 2;

            scheduleGhostToggle();
        }

        function scheduleGhostToggle() {
            if(!isPlaying || isPausedForStart || cGame !== '2') return;
            
            if (!isGhost && !gTargetClicked) { loseLife(); }

            isGhost = !isGhost;
            
            if (!isGhost) {
                tEl.style.transition = ''; 
                tEl.style.opacity = '1';
                targetAppearTime = Date.now();
                gTargetClicked = false;
            } else {
                tEl.style.opacity = '0';
            }

            let baseShowTime = aScore < 2000 ? 1000 : Math.max(400, 1000 - ((aScore - 2000) * 0.12)); 
            let baseHideTime = aScore < 2000 ? 800  : Math.max(300, 800  - ((aScore - 2000) * 0.1));
            
            let speedFactor = aScore < 2000 ? 1.3 : Math.max(0.4, 1 - ((aScore - 2000) / 5000));
            let nextTime = isGhost ? (baseHideTime * speedFactor) : (baseShowTime * speedFactor);

            let tm = setTimeout(scheduleGhostToggle, nextTime);
            gTimeouts.push(tm);
        }

        function gameLoop() {
            if(!isPlaying || isPausedForStart) return;

            gFrameCount++;
            
            let currentTargetSpeed = aScore < 2000 ? 1.6 : (2.2 + ((aScore - 2000) * 0.0025));
            if (currentTargetSpeed > 16.0) currentTargetSpeed = 16.0; 

            let turnFreqOffset = 0; 
            if (aScore < 2000) turnFreqOffset = 0;
            else if (aScore < 3000) turnFreqOffset = 5;
            else if (aScore < 4000) turnFreqOffset = 10;
            else if (aScore < 7000) turnFreqOffset = 15;
            else turnFreqOffset = 20;

            if (gDashFrames > 0) {
                gDashFrames--;
            } else {
                gDashMultiplier = 1;
                if (aScore >= 2000 && Math.random() < 0.012) { 
                    gDashMultiplier = 1.5; 
                    gDashFrames = Math.floor(Math.random() * 10) + 5; 
                }
            }

            if (gFrameCount >= gNextTurnFrame) {
                let turnAngle = (Math.PI / 4) + Math.random() * (Math.PI * 0.58); 
                if (Math.random() < 0.5) turnAngle = -turnAngle;
                tAngle += turnAngle;
                
                gFrameCount = 0;
                gNextTurnFrame = Math.max(15, Math.floor(Math.random() * 40) + 20 - turnFreqOffset);
            }

            let finalSpeed = currentTargetSpeed * gDashMultiplier;
            tx += Math.cos(tAngle) * finalSpeed;
            ty += Math.sin(tAngle) * finalSpeed;

            let minX = 35, maxXBound = maxX - 35;
            let minY = 95, maxYBound = maxY - 100; 

            let hitWall = false;
            if (tx < minX) { tx = minX; hitWall = true; tAngle = Math.PI - tAngle; }
            else if (tx > maxXBound) { tx = maxXBound; hitWall = true; tAngle = Math.PI - tAngle; }
            
            if (ty < minY) { ty = minY; hitWall = true; tAngle = -tAngle; }
            else if (ty > maxYBound) { ty = maxYBound; hitWall = true; tAngle = -tAngle; }

            if (hitWall) { tAngle += (Math.random() - 0.5) * 0.5; }

            tEl.style.left = tx + 'px';
            tEl.style.top = ty + 'px';
            tEl.style.transform = `translate(-50%, -50%)`;

            if (cGame === '1') {
                let pointsToAdd = 0.8;
                if (aScore >= 7000) pointsToAdd = 4.5;
                else if (aScore >= 6000) pointsToAdd = 3.5;
                else if (aScore >= 4000) pointsToAdd = 2.5;
                else if (aScore >= 3000) pointsToAdd = 1.8;
                else if (aScore >= 2000) pointsToAdd = 1.2;

                let dist = Math.hypot(mx - tx, my - ty);
                let hitRadius = 65;
                const G1_MAX_MISS_FRAMES = 120; 
                
                if(dist < hitRadius) {
                    addScore(pointsToAdd);
                    tEl.classList.add('hovered');
                    gMissFrames = 0;
                    document.getElementById('warning-progress').style.width = '0%';
                    
                    currentFocusFrames++;
                    if (currentFocusFrames > maxFocusFrames) maxFocusFrames = currentFocusFrames;
                } else {
                    tEl.classList.remove('hovered');
                    currentFocusFrames = 0; 
                    
                    gMissFrames++;
                    let pct = (gMissFrames / G1_MAX_MISS_FRAMES) * 100; 
                    document.getElementById('warning-progress').style.width = Math.min(100, pct) + '%';

                    if(gMissFrames > G1_MAX_MISS_FRAMES) { 
                        loseLife();
                        gMissFrames = 0; 
                    }
                }
            } 

            loopRaf = requestAnimationFrame(gameLoop);
        }

        function finishGame() {
            isPlaying = false; isPausedForStart = true;
            clearAllTimeouts(); cancelAnimationFrame(loopRaf);

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('playing-mode');
            setTimeout(() => vid.classList.add('loaded'), 400);

            // KIỂM TRA ĐIỀU KIỆN TỐI THIỂU 1000 DATA ĐỂ XÁC NHẬN HOÀN THÀNH
            if(cGame === '1') { 
                sessionScoreG1 = (aScore >= 1000) ? Math.floor(aScore) : 0; 
                finalMaxFocusSec = Math.round((maxFocusFrames / 60) * 10) / 10;
                localStorage.setItem('phong_luan_bai1_score', sessionScoreG1);
            }
            if(cGame === '2') { 
                sessionScoreG2 = (aScore >= 1000) ? Math.floor(aScore) : 0; 
                finalAvgSlashMs = reactionTimesG2.length > 0 ? Math.round(reactionTimesG2.reduce((a,b)=>a+b, 0) / reactionTimesG2.length) : 0;
                if (aScore < 1000) finalAvgSlashMs = 1500;
                localStorage.setItem('phong_luan_bai2_score', sessionScoreG2);
            }

            let totalValidScore = sessionScoreG1 + sessionScoreG2;
            localStorage.setItem('phong_luan_score', totalValidScore);

            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            let playAreaWrap = document.getElementById('play-area'); playAreaWrap.classList.remove('fullscreen-mode');
            document.getElementById('game-play-zone').classList.remove('active');
            
            tEl.style.display = 'none';
            document.getElementById('custom-cursor').style.display = 'none';
            document.getElementById('warning-bar-container').style.display = 'none';

            playSound('error'); document.getElementById('freeze-overlay').classList.add('active');

            setTimeout(() => {
                document.getElementById('freeze-overlay').classList.remove('active');
                
                let romanName = (cGame === '1') ? 'KẾT QUẢ BÀI 1' : 'KẾT QUẢ BÀI 2';
                document.getElementById('stage-badge-title').innerText = romanName;
                document.getElementById('final-score-display').innerText = (cGame === '1') ? sessionScoreG1 : sessionScoreG2;

                if(cGame === '1') {
                    document.getElementById('result-metric-name').innerText = "Chuỗi bám dính Max";
                    document.getElementById('result-metric-val').innerText = finalMaxFocusSec + "s";
                } else {
                    document.getElementById('result-metric-name').innerText = "Tốc độ phản ứng trung bình";
                    document.getElementById('result-metric-val').innerText = (sessionScoreG2 > 0 && finalAvgSlashMs > 0) ? finalAvgSlashMs + " ms" : "Chưa đủ Data";
                }

                let stageRankObj = getRankByPhongLuanScore( (cGame === '1') ? sessionScoreG1 : sessionScoreG2 );
                document.getElementById('stage-rank-display').innerHTML = getRankHTML(stageRankObj.name);

                let btnNext = document.getElementById('btn-next');
                if (cGame === '1') { 
                    btnNext.innerText = "BÀI 2"; 
                    btnNext.onclick = proceedNextStage; 
                    btnNext.style.display = "block";
                } else { 
                    btnNext.innerText = "TỔNG KẾT"; 
                    btnNext.onclick = showFinalSummary; 
                }

                document.getElementById('result-overlay').classList.add('active');
                playSound('coin');
            }, 1800);
        }

        function retryCurrentStage() { playSound('katana'); document.getElementById('result-overlay').classList.remove('active'); openArena(cGame); }
        function proceedNextStage() { playSound('coin'); document.getElementById('result-overlay').classList.remove('active'); openArena('2'); }

        function showFinalSummary() {
            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('playing-mode');
            setTimeout(() => vid.classList.add('loaded'), 400);

            playSound('coin'); document.getElementById('result-overlay').classList.remove('active');
            let totalSessionScore = sessionScoreG1 + sessionScoreG2;

            document.getElementById('sum-score-1').innerText = sessionScoreG1;
            document.getElementById('sum-score-2').innerText = sessionScoreG2;
            document.getElementById('sum-score-total').innerText = totalSessionScore;
            
            document.getElementById('final-focus').innerText = finalMaxFocusSec + "s";
            document.getElementById('final-slash').innerText = finalAvgSlashMs > 0 ? finalAvgSlashMs + " ms" : "Không đạt";

            let finalRankObj = getRankByPhongLuanScore(totalSessionScore);
            
            document.getElementById('sum-rank-title').innerHTML = getRankHTML(finalRankObj.name);
            document.getElementById('master-feedback-text').innerText = finalRankObj.feedback;

            document.getElementById('final-summary-overlay').classList.add('active');
        }
    </script>
</body>
</html>
