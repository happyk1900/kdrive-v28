<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#040814">
    <title>K-Drive - Kiểm Định Phản Xạ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #040814; font-family: 'Space Grotesk', sans-serif; }

        /* NỀN LƯỢNG TỬ ĐƠN GIẢN, TĨNH LẶNG */
        #sanctum-bg { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            background: radial-gradient(circle at 50% 30%, #0a1128 0%, #040814 80%);
        }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0.6; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #00ffcc; box-shadow: 0 0 4px #00ffcc; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { transform: translateY(-20vh); opacity: 0; } }

        .touch-ripple {
            position: fixed; border: 2px solid #00ffcc; border-radius: 50%; pointer-events: none; 
            transform: translate(-50%, -50%); z-index: 999999;
            box-shadow: 0 0 15px #00ffcc; animation: rippleAnim 0.35s ease-out forwards;
        }
        @keyframes rippleAnim { 0% { width: 0px; height: 0px; opacity: 1; border-width: 4px; } 100% { width: 70px; height: 70px; opacity: 0; border-width: 1px; } }

        /* THANH ĐIỀU KHIỂN TOP HUD */
        #ingame-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(4, 8, 20, 0.9); border-bottom: 1.5px solid rgba(0, 255, 204, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; z-index: 10000; pointer-events: auto;
            backdrop-filter: blur(5px); transition: opacity 0.3s;
        }
        #ingame-hud.hidden { opacity: 0; pointer-events: none !important; }
        
        .hud-left { flex: 1; display: flex; justify-content: flex-start; }
        .hud-center { flex: 1; display: flex; justify-content: center; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #fff; font-weight: bold; }
        .hud-right { flex: 1; display: flex; justify-content: flex-end; gap: 10px; }
        
        .hud-btn {
            width: 38px; height: 38px; border-radius: 8px; background: rgba(0, 0, 0, 0.7); border: 1.5px solid rgba(0, 255, 204, 0.5);
            color: #00ffcc; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .hud-btn:active { transform: scale(0.9); }
        .hud-btn.exit-btn { border-color: #ff3333; color: #ff3333; }

        /* KHU VỰC CHƠI (ARENA) */
        #task-arena { 
            position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; opacity: 1; visibility: visible; pointer-events: auto; 
        }
        
        .play-area { 
            width: 100%; max-width: 380px; height: 65vh; min-height: 480px; background: transparent; 
            position: relative; overflow: hidden; margin-top: 60px; margin-bottom: auto;
            border: 1px dashed rgba(0, 255, 204, 0.2); border-radius: 12px;
        }
        .play-area.fullscreen-mode {
            position: fixed !important; top: 0 !important; left: 0 !important; 
            width: 100vw !important; height: 100dvh !important; max-width: none !important;
            margin: 0 !important; border: none !important; border-radius: 0 !important; z-index: 9990 !important;
        }

        /* KHUNG CHỜ (GIỮA CÁC BÀI TEST) */
        #start-prompt-overlay {
            position: absolute; inset: 0; background: #040814; z-index: 110; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; 
            transition: opacity 0.3s ease; padding: 20px;
        }
        #start-prompt-overlay.hidden { opacity: 0; pointer-events: none !important; display: none; }

        .briefing-panel {
            background: rgba(10, 15, 30, 0.9); border: 1.5px solid #00ffcc; border-radius: 12px; padding: 25px 20px; 
            width: 100%; max-width: 340px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
        }
        .briefing-title {
            color: #00ffcc; font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;
        }
        .briefing-target { color: #e0e0e0; font-size: 14px; line-height: 1.6; }
        .briefing-target b { color: #ff3333; }

        .start-action-box {
            background: rgba(0, 255, 204, 0.15); border: 2px solid #00ffcc; padding: 16px 50px; border-radius: 8px;
            color: #00ffcc; font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); animation: pulseBtn 1.5s infinite alternate; pointer-events: auto;
        }
        @keyframes pulseBtn { 0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); } 100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 255, 204, 0.6); } }

        /* BẢNG ĐIỂM TRUNG GIAN (SAU MỖI BÀI) */
        #intermediate-result-overlay { 
            position: absolute; inset: 0; background: rgba(4, 8, 20, 0.95); backdrop-filter: blur(8px); 
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 150; gap: 20px; padding: 20px; 
        }
        #intermediate-result-overlay.active { display: flex; }
        
        .stage-title { font-family: 'Share Tech Mono', monospace; font-size: 26px; color: #00ffcc; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .stat-box { width: 100%; max-width: 320px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,204,0.3); padding: 15px; border-radius: 8px; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #fff; }
        .stat-line:last-child { margin-bottom: 0; }
        .stat-val { color: #ffb700; font-weight: bold; font-size: 16px; }

        .btn-row { display: flex; gap: 15px; width: 100%; max-width: 320px; margin-top: 10px; }
        .btn-half { 
            flex: 1; padding: 14px; font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: bold; 
            border-radius: 8px; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s;
        }
        .btn-retry { background: transparent; border: 1.5px solid #ff3333; color: #ff3333; }
        .btn-next { background: #00ffcc; border: 1.5px solid #00ffcc; color: #000; }
        .btn-half:active { transform: scale(0.95); }

        /* BẢNG TỔNG KẾT CUỐI CÙNG */
        #final-summary-overlay { 
            position: absolute; inset: 0; background: rgba(4, 8, 20, 0.98); backdrop-filter: blur(10px); 
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 20px; padding: 20px; 
        }
        #final-summary-overlay.active { display: flex; }
        .final-header { font-family: 'Share Tech Mono', monospace; font-size: 28px; color: #fff; font-weight: 900; text-align: center; text-shadow: 0 0 15px #00ffcc; }
        .final-btn-exit { 
            width: 100%; max-width: 320px; padding: 15px; margin-top: 20px; background: #ff3333; border: none; border-radius: 8px; 
            color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; 
        }

        /* IN-GAME ELEMENTS */
        .orb { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .orb-fire { width: 56px; height: 56px; background: radial-gradient(circle, #ffb700, #ff3333); box-shadow: 0 0 15px #ff3333; }
        .orb-ice { width: 56px; height: 56px; background: radial-gradient(circle, #ffffff, #00ffcc); box-shadow: 0 0 15px #00ffcc; }
        .orb-purple { width: 56px; height: 56px; background: radial-gradient(circle, #ff66cc, #8a2be2); }
        .orb-green { width: 56px; height: 56px; background: radial-gradient(circle, #bfff00, #00ff00); }
        .orb-blue { width: 56px; height: 56px; background: radial-gradient(circle, #33ccff, #0066cc); }
        
        .core-reactor { position: absolute; width: 24px; height: 24px; background: #ff3333; border-radius: 50%; box-shadow: 0 0 15px #ff3333; z-index: 5; transform: translate(-50%, -50%); }
        .child-projectile { position: absolute; width: 24px; height: 24px; border-radius: 50%; z-index: 10; transform: translate(-50%, -50%); }
        .child-yellow { background: #ffb700; box-shadow: 0 0 10px #ffb700; }
        .child-white { background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        .floating-ms { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 900; pointer-events: none; z-index: 100000; transform: translate(-50%, -50%); animation: floatUpMs 0.8s ease-out forwards; }
        .ms-fast { color: #ffffff; text-shadow: 0 0 10px #fff, 0 0 20px #00ffcc; }
        .ms-good { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .ms-slow { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        @keyframes floatUpMs { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 20% { transform: translate(-50%, -60%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -100%) scale(1); } }

        /* BURST MODE ELEMENTS */
        .blackout-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: rgba(4, 8, 20, 0.95); z-index: 99999; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .blackout-bg.active { opacity: 1; pointer-events: auto; }
        .burst-container { position: fixed; width: 100vw; height: 100dvh; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100001; pointer-events: none; }
        .burst-text { font-family: 'Share Tech Mono', monospace; font-size: 26px; color: #FFF; font-weight: 900; margin-bottom: 240px; animation: pulseText 0.3s infinite alternate; }
        @keyframes pulseText { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

        .stage1-energy-core { width: 90px; height: 90px; border-radius: 50%; background: #ff3333; box-shadow: 0 0 30px #ff3333; pointer-events: auto; cursor: pointer; }
        .burst-btn-dual { position: absolute; width: 60px; height: 60px; background: #00ffcc; border-radius: 50%; pointer-events: auto; cursor: pointer; box-shadow: 0 0 20px #00ffcc; }
        #dual-btn-left { left: 20%; top: 50%; transform: translate(-50%, -50%); }
        #dual-btn-right { right: 20%; top: 50%; transform: translate(50%, -50%); }
        .orbit-track { position: absolute; width: 260px; height: 260px; border: 2px dashed #00ffcc; border-radius: 50%; pointer-events: auto; }
        .orbit-ball { position: absolute; width: 48px; height: 48px; background: #ffb700; border-radius: 50%; top: -24px; left: calc(50% - 24px); pointer-events: none; box-shadow: 0 0 20px #ffb700; }

        .floating-cps { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-family: 'Share Tech Mono', monospace; font-size: 34px; font-weight: 900; color: #ffb700; text-shadow: 0 0 20px #ffb700; z-index: 100005; white-space: nowrap; animation: popCps 1.5s forwards; }
        @keyframes popCps { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1.5); } }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #fff; box-shadow: 0 0 20px #00ffcc; z-index: 99999; transform: scaleX(0); animation: laserShoot 0.3s forwards ease-out; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 5px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 0.5s forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }
    </style>
</head>
<body>

    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">
            
            <div id="ingame-hud" class="hidden">
                <div class="hud-left"><b id="boo-lives" style="color:#ff3333; font-size: 20px;">❤️❤️❤️❤️❤️</b></div>
                <div class="hud-center" id="hud-stage-name">BÀI TEST I</div>
                <div class="hud-right"><div class="hud-btn exit-btn" onclick="exitToCore()">🚪</div></div>
            </div>

            <!-- MÀN HÌNH CHỜ TRƯỚC MỖI BÀI TEST -->
            <div id="start-prompt-overlay">
                <div class="briefing-panel">
                    <div class="briefing-title" id="briefing-title">BÀI TEST I</div>
                    <div class="briefing-target" id="briefing-target">Nội dung...</div>
                </div>
                <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
            </div>

            <!-- BẢNG ĐIỂM TRUNG GIAN (SAU MỖI BÀI) -->
            <div id="intermediate-result-overlay">
                <div class="stage-title" id="inter-title">KẾT QUẢ BÀI 1</div>
                <div class="stat-box">
                    <div class="stat-line"><span>Tốc độ trung bình:</span> <span class="stat-val" id="inter-ms">0 ms</span></div>
                    <div class="stat-line"><span>Giới hạn bạo phát:</span> <span class="stat-val" id="inter-cps">0 lần/s</span></div>
                </div>
                <div class="btn-row">
                    <button class="btn-half btn-retry" onclick="retryCurrentStage()">TẬP LẠI</button>
                    <button class="btn-half btn-next" id="btn-inter-next" onclick="proceedNextStage()">BÀI 2</button>
                </div>
            </div>

            <!-- BẢNG TỔNG KẾT CUỐI CÙNG -->
            <div id="final-summary-overlay">
                <div class="final-header">BÁO CÁO Y KHOA<br>TỔNG HỢP</div>
                <div class="stat-box" style="background: rgba(0,255,204,0.1);">
                    <div class="stat-line"><span>Tốc độ tổng quát:</span> <span class="stat-val" id="final-ms" style="color:#00ffcc;">0 ms</span></div>
                    <div class="stat-line"><span>Max Bạo phát:</span> <span class="stat-val" id="final-cps" style="color:#00ffcc;">0 lần/s</span></div>
                    <div class="stat-line" style="margin-top:10px; padding-top:10px; border-top:1px dashed #00ffcc;">
                        <span>ĐÁNH GIÁ CHUNG:</span> <span class="stat-val" id="final-rank" style="color:#fff;">XUẤT SẮC</span>
                    </div>
                </div>
                <button class="final-btn-exit" onclick="exitToCore()">THOÁT VỀ SẢNH</button>
            </div>

        </div>
    </div>

    <script>
        let cGame = '1'; 
        let currentMultiplier = 1; 
        let successfulHitsCount = 0; 
        let isPlaying = false; 
        let isPausedForStart = true;
        let spawnTimer, burstTimer, g3LoopId, stabilityHP = 10, projectiles = [];
        let bestCps = 0;
        let reactionTimes = [];
        let matchStartTime = 0;

        // Tốc độ lưu trữ tạm để tính tổng kết
        let sessionStats = {
            ms1: 0, cps1: 0,
            ms2: 0, cps2: 0,
            ms3: 0, cps3: 0
        };

        const g1Lifespans = [0, 900, 750, 600, 500, 420, 360, 300, 250, 200, 170, 140, 120];
        const g1SpawnDelays = [0, 800, 700, 600, 500, 450, 400, 350, 300, 250, 200, 150, 120];
        const g3Speeds = [0, 0.4, 0.6, 0.8, 1.1, 1.4, 1.8, 2.2, 2.7, 3.2, 3.8, 4.5, 5.5];
        const g3Lifespans = [0, 3000, 2500, 2000, 1600, 1300, 1000, 800, 650, 550, 450, 350, 300];
        const g3SpawnDelays = [0, 2500, 2000, 1600, 1300, 1000, 800, 650, 500, 400, 300, 250, 200];

        let stage3Projectiles = [];

        window.onload = () => {
            // KHỞI ĐỘNG TRỰC TIẾP VÀO BÀI 1
            prepareArena('1');
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'dust-particle dust-small';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                p.style.animationDuration = (Math.random() * 10 + 5) + 's';
                document.getElementById('dust-container').appendChild(p);
            }
        };

        function prepareArena(id) {
            cGame = id; 
            currentMultiplier = 4; // Mặc định khởi động từ level 4 cho nhanh
            successfulHitsCount = 0; 
            isPlaying = false; 
            stabilityHP = 10;
            isPausedForStart = true;
            bestCps = 0;
            reactionTimes = [];

            let playArea = document.getElementById('play-area');
            playArea.classList.remove('fullscreen-mode');
            document.getElementById('ingame-hud').classList.add('hidden');
            document.getElementById('intermediate-result-overlay').classList.remove('active');
            
            // Xóa rác
            let oldOrbs = playArea.querySelectorAll('.orb, .child-projectile, .core-reactor, .blackout-bg, .floating-ms, .floating-cps');
            oldOrbs.forEach(o => o.remove());

            updateHpDisplay();
            
            let bTitle = "", bTarget = "";
            if (id === '1') {
                bTitle = "BÀI TEST I: ĐO LƯỜNG PHẢN XẠ";
                bTarget = "Chạm để triệt tiêu mọi tụ điểm năng lượng.<br><br><b>⚠️ MỤC TIÊU:</b> Không bỏ lỡ bất cứ hạt nào!";
                document.getElementById('hud-stage-name').innerText = "BÀI TEST I";
            } else if (id === '2') {
                bTitle = "BÀI TEST II: NHẬN THỨC MÀU SẮC";
                bTarget = "Chỉ bấm hạt Đỏ/Cam. Tuyệt đối né Trắng, Xanh, Tím.<br><br><b>⚠️ MỤC TIÊU:</b> Không được chạm nhầm!";
                document.getElementById('hud-stage-name').innerText = "BÀI TEST II";
            } else if (id === '3') {
                bTitle = "BÀI TEST III: THỦ TRẬN TỔNG HỢP";
                bTarget = "Phá Hạt nhân ở giữa, triệt tiêu các hạt năng lượng văng ra.<br><br><b>⚠️ MỤC TIÊU:</b> Tốc độ xử lý đa nhiệm!";
                document.getElementById('hud-stage-name').innerText = "BÀI TEST III";
                
                let core = document.createElement('div'); core.className = 'core-reactor';
                core.style.left = '50%'; core.style.top = '50%'; playArea.appendChild(core);
            }

            document.getElementById('briefing-title').innerText = bTitle;
            document.getElementById('briefing-target').innerHTML = bTarget;
            document.getElementById('start-prompt-overlay').classList.remove('hidden');
        }

        function triggerStartGame() {
            document.getElementById('start-prompt-overlay').classList.add('hidden');
            
            let laser = document.createElement('div');
            laser.className = 'laser-beam-horizontal';
            document.body.appendChild(laser);
            
            setTimeout(() => {
                let playArea = document.getElementById('play-area');
                playArea.classList.add('fullscreen-mode');
                laser.classList.add('expand');
            }, 300);

            setTimeout(() => {
                laser.remove();
                isPausedForStart = false;
                document.getElementById('ingame-hud').classList.remove('hidden');
                
                isPlaying = true; 
                matchStartTime = Date.now();
                
                if(cGame === '1') { spawnG1(); } 
                else if(cGame === '2') { spawnG2(); } 
                else if(cGame === '3') { spawnG3Parent(); if(!g3LoopId) g3LoopId = requestAnimationFrame(loopG3); } 
                
                // Demo logic: Sau 12 giây tự kết thúc ải để gọi Burst
                setTimeout(() => {
                    if(isPlaying) triggerGreatBurst();
                }, 12000);

            }, 800);
        }

        function updateHpDisplay() {
            let heartsStr = "❤️".repeat(Math.ceil(stabilityHP / 2));
            document.getElementById('boo-lives').innerText = heartsStr;
        }

        function loseLife() {
            if(isPausedForStart) return;
            stabilityHP -= 2; 
            updateHpDisplay();
            if(stabilityHP <= 0) { finishStage(); }
        }

        function getSafeSpawns(playArea) {
            let maxX = playArea.clientWidth - 60; let maxY = playArea.clientHeight - 60; let minY = 80;
            return { px: 10 + Math.random() * Math.max(0, maxX - 10), py: minY + Math.random() * Math.max(0, maxY - minY) };
        }

        function showFloatingMs(x, y, ms) {
            let el = document.createElement('div'); el.className = 'floating-ms ms-good'; el.innerHTML = `${ms}ms`;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            document.getElementById('play-area').appendChild(el);
            setTimeout(() => { if(el.parentElement) el.remove(); }, 800);
        }

        function spawnG1() {
            if(!isPlaying || isPausedForStart) return; 
            let playArea = document.getElementById('play-area'); 
            let { px, py } = getSafeSpawns(playArea);
            let spawnTimestamp = Date.now();
            
            let el = document.createElement('div'); el.className = 'orb orb-fire'; 
            el.style.left = px + 'px'; el.style.top = py + 'px';
            
            let clicked = false; 
            el.onmousedown = el.ontouchstart = (e) => { 
                e.preventDefault(); e.stopPropagation();
                if(!isPlaying || isPausedForStart || clicked) return; 
                clicked = true; 
                reactionTimes.push(Date.now() - spawnTimestamp);
                showFloatingMs(px + 28, py + 28, Date.now() - spawnTimestamp);
                el.remove(); 
            };
            
            playArea.appendChild(el); 
            setTimeout(() => { if(el.parentElement && !clicked) { el.remove(); loseLife(); } }, g1Lifespans[currentMultiplier]);
            if(isPlaying) spawnTimer = setTimeout(spawnG1, g1SpawnDelays[currentMultiplier]);
        }

        function spawnG2() {
            if(!isPlaying || isPausedForStart) return; 
            let playArea = document.getElementById('play-area'); 
            let { px, py } = getSafeSpawns(playArea);
            
            let rand = Math.random();
            let orbType = rand < 0.4 ? 'fire' : (rand < 0.6 ? 'ice' : 'purple');
            let isTarget = (orbType === 'fire');
            let spawnTimestamp = Date.now();
            
            let el = document.createElement('div'); el.className = 'orb orb-' + orbType; 
            el.style.left = px + 'px'; el.style.top = py + 'px';
            
            let handled = false; 
            el.onmousedown = el.ontouchstart = (e) => { 
                e.preventDefault(); e.stopPropagation();
                if(!isPlaying || isPausedForStart || handled) return; 
                handled = true; 
                if(isTarget) { 
                    reactionTimes.push(Date.now() - spawnTimestamp);
                    showFloatingMs(px + 28, py + 28, Date.now() - spawnTimestamp);
                } else { loseLife(); } 
                el.remove(); 
            };
            
            playArea.appendChild(el); 
            setTimeout(() => { if(el.parentElement && !handled) { el.remove(); if(isTarget) loseLife(); } }, g1Lifespans[currentMultiplier]);
            if(isPlaying) spawnTimer = setTimeout(spawnG2, g1SpawnDelays[currentMultiplier]);
        }

        function spawnG3Parent() {
            if(!isPlaying || isPausedForStart) return; 
            let playArea = document.getElementById('play-area'); 
            let { px, py } = getSafeSpawns(playArea);
            let spawnTimestamp = Date.now();
            
            let el = document.createElement('div'); el.className = 'orb orb-fire'; 
            el.style.left = px + 'px'; el.style.top = py + 'px';
            
            let clicked = false; 
            el.onmousedown = el.ontouchstart = (e) => { 
                e.preventDefault(); e.stopPropagation();
                if(!isPlaying || isPausedForStart || clicked) return; 
                clicked = true; 
                reactionTimes.push(Date.now() - spawnTimestamp);
                showFloatingMs(px + 28, py + 28, Date.now() - spawnTimestamp);
                el.remove(); 

                // Spawn children
                let c1 = document.createElement('div'); c1.className = 'child-projectile child-yellow'; c1.style.left = (px+10)+'px'; c1.style.top = py+'px';
                let c2 = document.createElement('div'); c2.className = 'child-projectile child-white'; c2.style.left = (px+40)+'px'; c2.style.top = py+'px';
                
                stage3Projectiles.push({el: c1, x: px+10, y: py, color: 'yellow', state: 'waiting', stateTimer: Date.now(), vx: 0, vy: 0});
                stage3Projectiles.push({el: c2, x: px+40, y: py, color: 'white', state: 'waiting', stateTimer: Date.now(), vx: 0, vy: 0});
                
                c1.onmousedown = c1.ontouchstart = (ev) => { ev.stopPropagation(); c1.remove(); };
                c2.onmousedown = c2.ontouchstart = (ev) => { ev.stopPropagation(); c2.remove(); loseLife(); };
                
                playArea.appendChild(c1); playArea.appendChild(c2);
            };
            
            playArea.appendChild(el); 
            setTimeout(() => { if(el.parentElement && !clicked) { el.remove(); loseLife(); } }, g3Lifespans[currentMultiplier]);
            if(isPlaying) spawnTimer = setTimeout(spawnG3Parent, g3SpawnDelays[currentMultiplier]);
        }

        function loopG3() {
            if(!isPlaying) { g3LoopId = null; return; }
            if(!isPausedForStart) {
                let playArea = document.getElementById('play-area');
                let centerX = playArea.clientWidth / 2; let centerY = playArea.clientHeight / 2;
                let now = Date.now();
                for(let i = stage3Projectiles.length - 1; i >= 0; i--) {
                    let p = stage3Projectiles[i]; let elapsed = now - p.stateTimer;
                    if (p.state === 'waiting' && elapsed >= 1500) {
                        p.state = 'flying';
                        let angle = Math.atan2(centerY - p.y, centerX - p.x);
                        p.vx = Math.cos(angle) * 3; p.vy = Math.sin(angle) * 3;
                    } 
                    else if (p.state === 'flying') {
                        p.x += p.vx; p.y += p.vy;
                        p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
                        if (Math.hypot(p.x - centerX, p.y - centerY) < 15) {
                            p.el.remove(); stage3Projectiles.splice(i, 1);
                            if (p.color === 'yellow') loseLife();
                        }
                    }
                }
            }
            g3LoopId = requestAnimationFrame(loopG3);
        }

        // --- CƠ CHẾ BẠO PHÁT TỐI GIẢN ---
        function triggerGreatBurst() {
            isPausedForStart = true;
            clearTimeout(spawnTimer);
            document.getElementById('play-area').querySelectorAll('.orb, .child-projectile').forEach(o => o.remove());

            let playArea = document.getElementById('play-area');
            let blackout = document.createElement('div'); blackout.className = 'blackout-bg active';
            playArea.appendChild(blackout);

            let burstContainer = document.createElement('div'); burstContainer.className = 'burst-container';
            let burstClicks = 0;

            if (cGame === '1') {
                let core = document.createElement('div'); core.className = 'stage1-energy-core';
                burstContainer.appendChild(core);
                core.onpointerdown = (e) => { e.stopPropagation(); burstClicks++; };
            } else if (cGame === '2') {
                let bL = document.createElement('div'); bL.className = 'burst-btn-dual'; bL.id = 'dual-btn-left';
                let bR = document.createElement('div'); bR.className = 'burst-btn-dual'; bR.id = 'dual-btn-right';
                burstContainer.appendChild(bL); burstContainer.appendChild(bR);
                let handleDual = (e) => { e.stopPropagation(); burstClicks++; };
                bL.onpointerdown = bR.onpointerdown = handleDual;
            } else if (cGame === '3') {
                let track = document.createElement('div'); track.className = 'orbit-track';
                let ball = document.createElement('div'); ball.className = 'orbit-ball'; track.appendChild(ball);
                burstContainer.appendChild(track);
                
                let lastAngle = null; let totalAngle = 0;
                let handleOrbit = (e) => {
                    e.stopPropagation();
                    let rect = track.getBoundingClientRect();
                    let angle = Math.atan2(e.clientY - (rect.top + rect.height/2), e.clientX - (rect.left + rect.width/2)) * (180/Math.PI);
                    if (lastAngle !== null) {
                        let diff = Math.abs(angle - lastAngle);
                        if (diff > 180) diff = 360 - diff;
                        if (diff < 60) { totalAngle += diff; if (totalAngle >= 360) { totalAngle -= 360; burstClicks++; } }
                    }
                    lastAngle = angle;
                };
                track.onpointermove = track.onpointerdown = handleOrbit;
            }

            playArea.appendChild(burstContainer);

            setTimeout(() => {
                bestCps = Math.round((burstClicks / 5) * 10) / 10; // Test 5s
                burstContainer.remove();
                blackout.remove();
                finishStage();
            }, 5000);
        }

        function finishStage() {
            isPlaying = false; isPausedForStart = true;
            clearTimeout(spawnTimer); if(g3LoopId) { cancelAnimationFrame(g3LoopId); g3LoopId = null; }

            let avgMs = reactionTimes.length > 0 ? Math.round(reactionTimes.reduce((a,b)=>a+b, 0) / reactionTimes.length) : 0;
            
            // Lưu data tạm
            if(cGame === '1') { sessionStats.ms1 = avgMs; sessionStats.cps1 = bestCps; }
            if(cGame === '2') { sessionStats.ms2 = avgMs; sessionStats.cps2 = bestCps; }
            if(cGame === '3') { sessionStats.ms3 = avgMs; sessionStats.cps3 = bestCps; }

            let playArea = document.getElementById('play-area');
            playArea.classList.remove('fullscreen-mode');
            document.getElementById('ingame-hud').classList.add('hidden');

            // HIỆN BẢNG ĐIỂM TRUNG GIAN
            let interOverlay = document.getElementById('intermediate-result-overlay');
            document.getElementById('inter-title').innerText = `KẾT QUẢ BÀI ${cGame}`;
            document.getElementById('inter-ms').innerText = avgMs > 0 ? avgMs + ' ms' : '-- ms';
            document.getElementById('inter-cps').innerText = bestCps > 0 ? bestCps + ' lần/s' : '-- lần/s';

            let btnNext = document.getElementById('btn-inter-next');
            if (cGame === '1') { btnNext.innerText = "BÀI 2"; btnNext.onclick = proceedNextStage; }
            else if (cGame === '2') { btnNext.innerText = "BÀI 3"; btnNext.onclick = proceedNextStage; }
            else { btnNext.innerText = "TỔNG KẾT"; btnNext.onclick = showFinalSummary; }

            interOverlay.classList.add('active');
        }

        function retryCurrentStage() {
            document.getElementById('intermediate-result-overlay').classList.remove('active');
            prepareArena(cGame);
        }

        function proceedNextStage() {
            document.getElementById('intermediate-result-overlay').classList.remove('active');
            let nextId = (parseInt(cGame) + 1).toString();
            prepareArena(nextId);
        }

        function showFinalSummary() {
            document.getElementById('intermediate-result-overlay').classList.remove('active');
            
            // Tính trung bình
            let validMs = [];
            if(sessionStats.ms1 > 0) validMs.push(sessionStats.ms1);
            if(sessionStats.ms2 > 0) validMs.push(sessionStats.ms2);
            if(sessionStats.ms3 > 0) validMs.push(sessionStats.ms3);
            let finalMs = validMs.length > 0 ? Math.round(validMs.reduce((a,b)=>a+b,0)/validMs.length) : 0;
            
            let finalCps = Math.max(sessionStats.cps1, sessionStats.cps2, sessionStats.cps3);

            let rank = "KÉM";
            if (finalMs > 0) {
                if(finalMs <= 160) rank = "S+ (ĐỈNH CAO)";
                else if(finalMs <= 240) rank = "A (XUẤT SẮC)";
                else if(finalMs <= 350) rank = "B (TỐT)";
                else rank = "C (TRUNG BÌNH)";
            }

            document.getElementById('final-ms').innerText = finalMs > 0 ? finalMs + ' ms' : '-- ms';
            document.getElementById('final-cps').innerText = finalCps > 0 ? finalCps + ' lần/s' : '--';
            document.getElementById('final-rank').innerText = rank;

            document.getElementById('final-summary-overlay').classList.add('active');
        }

        function exitToCore() {
            window.location.href = 'core.html';
        }
    </script>
</body>
