<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Hỏa Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050101; font-family: 'Space Grotesk', sans-serif; }

        /* ẢNH NỀN HỎA LUÂN DUNG NHAM */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/Gemini_Generated_Image_ol63xkol63xkol63.png?raw=true'); background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #ffb700; box-shadow: 0 0 3px #ffb700; }
        .dust-large { width: 3px; height: 3px; background: #ff4500; box-shadow: 0 0 8px #ff4500; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP-HUD CỐ ĐỊNH */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 9999; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; opacity: 0; transition: opacity 1s ease 1s; }
        .assembled #top-hud { opacity: 1; }
        
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #ff4500; box-shadow: 0 0 8px #ff4500; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #555; box-shadow: 0 0 8px #555; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(255, 69, 0, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff4500; box-shadow: 0 0 10px #ff4500; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(255, 69, 0, 0.8); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        .title-hologram { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(-50px); color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; text-shadow: 0 0 10px #ff4500; z-index: 50; pointer-events: none; opacity: 0; transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s; }
        .assembled .title-hologram { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* KHỐI ẢI: ĐỎ CAM CUỒNG NỘ */
        #task-container { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; pointer-events: none; }
        .card-wrapper { transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: auto; }
        #wrapper-1 { transform: translateX(-150vw); opacity: 0; }
        #wrapper-3 { transform: translateX(150vw); opacity: 0; }
        #wrapper-2 { transform: translateY(150vh); opacity: 0; }
        .assembled #wrapper-1 { transform: translateX(0); opacity: 1; transition-delay: 0.2s; }
        .assembled #wrapper-3 { transform: translateX(0); opacity: 1; transition-delay: 0.4s; }
        .assembled #wrapper-2 { transform: translateY(0); opacity: 1; transition-delay: 0.6s; }
        
        .holo-card { width: 95px; height: 110px; background: rgba(15, 0, 0, 0.85); border: 1px solid #ff4500; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(255, 69, 0, 0.2); cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s ease; }
        .holo-card:hover { background: rgba(255, 69, 0, 0.15); box-shadow: inset 0 0 25px rgba(255, 69, 0, 0.5); border-color: #ffb700; }
        
        .float-1 { animation: floatA 3s ease-in-out infinite; }
        .float-2 { animation: floatB 4s ease-in-out infinite 0.5s; height: 130px; margin-bottom: 20px; }
        .float-3 { animation: floatC 3.5s ease-in-out infinite 1s; }
        @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #ffb700; text-shadow: 0 0 10px #ff4500; margin-bottom: 8px; font-weight: bold; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; color: #ffffff; text-align: center; line-height: 1.4; letter-spacing: 1px; }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #a0a0a0; margin-top: 10px; letter-spacing: 1.5px; font-weight: bold; transition: color 0.3s; text-transform: uppercase; }
        .completed-text { color: #ffb700 !important; text-shadow: 0 0 8px #ff4500 !important; }

        /* DẢI BĂNG HỆ THỐNG */
        #terminal-bar { position: fixed; bottom: 85px; left: 0; width: 100vw; background: rgba(10, 0, 0, 0.85); border-top: 1px solid #ff003c; border-bottom: 1px solid #ff003c; padding: 12px 0; text-align: center; z-index: 45; opacity: 0; transform: translateY(50px); transition: all 1s ease 1.5s; box-shadow: 0 0 20px rgba(255, 0, 60, 0.3); }
        .assembled #terminal-bar { opacity: 1; transform: translateY(0); }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,255,255,0.8); white-space: nowrap; }
        
        /* ACTION PANEL */
        #action-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px); display: flex; gap: 20px; z-index: 50; opacity: 0; transition: all 1s ease 1.7s; pointer-events: auto; width: 90%; max-width: 350px; justify-content: center; }
        .assembled #action-panel { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .btn-action { color: #ffb700; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; background: rgba(15, 0, 0, 0.85); border: 1px solid #ffb700; cursor: pointer; text-transform: uppercase; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        .btn-action:hover { background: rgba(255, 183, 0, 0.15); box-shadow: 0 0 15px rgba(255, 183, 0, 0.4); }
        .btn-action:active { background: rgba(255, 183, 0, 0.3); }
        .btn-action.glow { animation: pulseOrange 2s infinite alternate; }
        @keyframes pulseOrange { 0% { box-shadow: 0 0 5px rgba(255, 69, 0, 0.2), inset 0 0 5px rgba(255, 69, 0, 0.1); text-shadow: 0 0 5px rgba(255, 69, 0, 0.5); } 100% { box-shadow: 0 0 20px rgba(255, 69, 0, 0.8), inset 0 0 15px rgba(255, 69, 0, 0.5); text-shadow: 0 0 15px #ffb700; } }
        .btn-action.disabled { color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); animation: none; pointer-events: none; box-shadow: none; }

        /* LORE */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(15, 5, 5, 0.95); border: 1px solid #ff4500; box-shadow: 0 0 30px rgba(255, 69, 0, 0.2), inset 0 0 20px rgba(255, 69, 0, 0.1); z-index: 10000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 69, 0, 0.4); padding-bottom: 10px; }
        .lore-title { color: #ffb700; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 14px; text-shadow: 0 0 8px #ff4500; }
        .lore-close { color: #ff003c; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff003c; }
        .lore-content { color: #ffffff; font-size: 12px; line-height: 1.6; min-height: 190px; font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #ff4500; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; }

        /* ================= ĐẤU TRƯỜNG "LÒ BÁT QUÁI" ================= */
        #task-arena { position: fixed; inset: 0; background: rgba(10, 0, 0, 0.9); backdrop-filter: blur(5px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        
        .arena-box { width: 95%; max-width: 380px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; background: rgba(20, 5, 5, 0.6); border: 1px solid #ff4500; box-shadow: 0 0 30px rgba(255,69,0,0.2), inset 0 0 15px rgba(255,69,0,0.1); border-radius: 8px; }
        
        .arena-header-bar { display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid rgba(255,69,0,0.4); padding-bottom: 10px; align-items: flex-end; }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #ffb700; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 10px #ff4500; }
        .arena-stats { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #fff; text-align: right; line-height: 1.6; }
        .highlight-score { color: #ffb700; font-weight: bold; font-size: 15px; text-shadow: 0 0 5px #ff4500; }

        .boo-dialog { font-size: 12px; font-family: 'Share Tech Mono', monospace; color: #fff; width: 100%; min-height: 30px; display: flex; align-items: center; justify-content: center; opacity: 0.9; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px;}
        .boo-tag { color: #ff4500; font-weight: bold; margin-right: 5px; }

        .arena-btn { background: rgba(255, 69, 0, 0.1); border: 1px solid #ff4500; color: #ffb700; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 12px 20px; cursor: pointer; transition: all 0.3s; border-radius: 4px; width: 100%; max-width: 200px; margin-top: 5px; text-transform: uppercase; text-shadow: 0 0 8px #ff4500; }
        .arena-btn:hover { background: rgba(255, 69, 0, 0.25); box-shadow: 0 0 15px rgba(255,69,0,0.5); }
        .btn-red { border-color: #555 !important; color: #aaa !important; background: transparent !important; text-shadow: none !important; }
        .btn-red:hover { background: rgba(255, 255, 255, 0.1) !important; color: #fff !important; border-color: #fff !important; }

        /* LÒ LUYỆN 300x300 */
        .play-area { width: 300px; height: 300px; background: rgba(255, 0, 0, 0.03); border: 1px dashed rgba(255, 69, 0, 0.3); border-radius: 8px; position: relative; overflow: hidden; margin: 10px 0; display: none; }
        .play-area.active { display: block; }

        /* CSS CẦU HỎA / BĂNG / TIA LỬA */
        .orb { position: absolute; border-radius: 50%; cursor: crosshair; display: flex; justify-content: center; align-items: center; }
        .orb-fire { width: 45px; height: 45px; background: radial-gradient(circle, #ffb700, #ff003c); box-shadow: 0 0 20px #ff4500, inset 0 0 10px #fff; }
        .orb-ice { width: 45px; height: 45px; background: radial-gradient(circle, #ffffff, #00e5ff); box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #fff; }
        
        /* CSS ẢI 3: THỦ TRẬN */
        .core-reactor { position: absolute; top: 135px; left: 135px; width: 30px; height: 30px; background: radial-gradient(circle, #fff, #ff003c); border-radius: 50%; box-shadow: 0 0 30px #ff003c, 0 0 10px #ffb700; z-index: 5; }
        .projectile { position: absolute; width: 15px; height: 15px; background: #ffb700; border-radius: 50%; box-shadow: 0 0 10px #ff4500; cursor: crosshair; z-index: 10; }
        
        .hit-flash { animation: flashRed 0.3s ease-out; }
        @keyframes flashRed { 0% { background-color: rgba(255,0,0,0.5); } 100% { background-color: transparent; } }

    </style>
</head>
<body>

    <!-- ẢNH NỀN HỎA LUÂN -->
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <!-- NHẠC NỀN: Neon Koi Bet -->
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Neon%20Koi%20Bet.mp3"></audio>

    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <div id="lore-modal">
        <div class="lore-header"><span class="lore-title">GIAO THỨC HỎA LUÂN</span><span class="lore-close" onclick="closeLore()">X</span></div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls"><div class="lore-nav" onclick="prevPage()">[ < ]</div><div class="lore-page-indicator" id="lore-page-num">1 / 3</div><div class="lore-nav" onclick="nextPage()">[ > ]</div></div>
    </div>

    <div class="title-hologram" id="thuy-luan-title">ĐẠO TRƯỜNG HỎA LUÂN</div>

    <!-- 3 KHỐI ẢI HỎA LUÂN -->
    <div id="task-container">
        <div class="card-wrapper" id="wrapper-1">
            <div class="holo-card float-1" id="card-1" onclick="openArena('1', 'I. BẠO PHÁT')">
                <div class="card-icon">I</div>
                <div class="card-title">BẠO PHÁT<br>(30s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
        
        <div class="card-wrapper" id="wrapper-2">
            <div class="holo-card float-2" id="card-2" onclick="openArena('2', 'II. CHÂN HỎA')"> 
                <div class="card-icon">II</div>
                <div class="card-title">CHÂN HỎA<br>(30s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>

        <div class="card-wrapper" id="wrapper-3">
            <div class="holo-card float-3" id="card-3" onclick="openArena('3', 'III. THỦ TRẬN')">
                <div class="card-icon">III</div>
                <div class="card-title">THỦ TRẬN<br>(Sinh Tồn)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
    </div>

    <div id="terminal-bar">
        <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: KHỞI ĐỘNG HỎA LUÂN...</span>
    </div>

    <div id="action-panel">
        <button class="btn-action" onclick="navToCore()">TRỞ VỀ LÕI</button>
        <button class="btn-action disabled" id="btn-save-score" onclick="saveScore()">LƯU ĐIỂM</button>
    </div>

    <!-- ĐẤU TRƯỜNG HỎA LUÂN -->
    <div id="task-arena">
        <div class="arena-box" id="arena-box">
            <div class="arena-header-bar">
                <div class="arena-title" id="arena-title">TÊN ẢI</div>
                <div class="arena-stats">
                    <span id="stat-label">TIME:</span> <span id="arena-val">30s</span><br>
                    ĐIỂM: <span class="highlight-score" id="arena-score">0</span>
                </div>
            </div>
            
            <!-- LÒ BÁT QUÁI (300x300) -->
            <div class="play-area" id="play-area">
                <!-- Chứa các Element Game -->
            </div>

            <div class="boo-dialog">
                <span class="boo-tag">[BOO]:</span> <span id="boo-msg">Nhiệt lượng tăng cao. Sẵn sàng bùng nổ!</span>
            </div>

            <button class="arena-btn" id="arena-btn" onclick="startArena()">KHAI TRẬN</button>
            <button class="arena-btn btn-red" id="close-arena-btn" onclick="closeArena()">THOÁT</button>
        </div>
    </div>

    <script>
        // ================= HỆ THỐNG ÂM THANH =================
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1200, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); 
                    gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); 
                    osc.start(); osc.stop(ctx.currentTime + 0.3); 
                } else if(type === 'error') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.6, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if(type === 'coin') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.setValueAtTime(2000, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } else if(type === 'boom') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, ctx.currentTime);
                    gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                }
            } catch (e) {}
        }

        // ================= LORE =================
        const lorePagesHTML = [
            "<b style='font-size:13px;'>TỔNG QUAN: BẠO LIỆT HỎA LUÂN</b><br><br>Đạo của Lửa là sự bùng nổ, thiêu rụi và tái sinh.<br><br>Hoàn thành 3 thử thách để kiểm soát sức mạnh: Bạo Phát, Chân Hỏa và Thủ Trận.",
            "<b style='font-size:13px;'>I & II: BẠO PHÁT VÀ CHÂN HỎA</b><br><br>• <b>Bạo Phát:</b> Phản xạ chớp nhoáng đập tan tàn lửa trước khi chúng biến mất.<br>• <b>Chân Hỏa:</b> Giữ cái đầu lạnh. Tiêu diệt Cầu Hỏa (+1), né tránh Cầu Băng (-3).",
            "<b style='font-size:13px;'>III. THỦ TRẬN (SINH TỒN)</b><br><br>• <b>Lò Bát Quái:</b> Lõi liên tục bắn đạn lửa.<br>• Bạn có <b>5 Mạng (Ổn định)</b>. <br>• Chạm vách tường: -1 Mạng. Hãy sống sót càng lâu càng tốt để ghi danh!"
        ];
        let currentLorePage = 0; let isLoreOpen = false;
        function openLore() { isLoreOpen = true; document.getElementById('lore-modal').classList.add('active'); renderLorePage(); playSound('katana'); }
        function closeLore() { isLoreOpen = false; document.getElementById('lore-modal').classList.remove('active'); playSound('error'); }
        function renderLorePage() { document.getElementById('lore-text').innerHTML = lorePagesHTML[currentLorePage]; document.getElementById('lore-page-num').innerText = `${currentLorePage + 1} / 3`; }
        function nextPage() { if(currentLorePage < 2) { currentLorePage++; renderLorePage(); playSound('error'); } }
        function prevPage() { if(currentLorePage > 0) { currentLorePage--; renderLorePage(); playSound('error'); } }

        window.onload = () => {
            const now = new Date();
            document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('sanctum-bg').style.opacity = '1';
            
            if(localStorage.getItem('bg_music_time')) bgMusic.currentTime = parseFloat(localStorage.getItem('bg_music_time'));
            if(localStorage.getItem('bg_music_muted') === 'true') { bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; } 
            else { bgMusic.muted = false; bgMusic.play().catch(e => {}); }

            setTimeout(() => { document.body.classList.add('assembled'); }, 300);
            setTimeout(updateSystemTerminal, 2500);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } 
            else { bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); }
        }
        function changeVolume(val) { bgMusic.volume = val; if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } }

        // ================= BIẾN GAME =================
        let hLuanTasks = { '1': false, '2': false, '3': false };
        let cGame = '1';
        let aScore = 0;
        let isPlaying = false;
        
        let gTimer;
        let gTimeLeft = 30;
        let spawnTimer;

        // Cho Game 3
        let g3LoopId;
        let stability = 5;
        let projectiles = [];

        function updateSystemTerminal() {
            let pending = Object.keys(hLuanTasks).find(k => !hLuanTasks[k]);
            let msgEl = document.getElementById('sys-msg');
            let saveBtn = document.getElementById('btn-save-score');
            if (pending) {
                let name = pending === '1' ? 'BẠO PHÁT' : pending === '2' ? 'CHÂN HỎA' : 'THỦ TRẬN';
                msgEl.innerHTML = `>_ [HỆ THỐNG]: CHỜ HOÀN THÀNH [${name}].`;
                saveBtn.classList.remove('glow'); saveBtn.classList.add('disabled');
            } else {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: HỎA LUÂN RỰC CHÁY. HÃY LƯU ĐIỂM.`;
                saveBtn.classList.remove('disabled'); saveBtn.classList.add('glow'); playSound('katana');
            }
        }

        function booMsg(text) { document.getElementById('boo-msg').innerText = text; }

        function openArena(id, name) {
            playSound('katana');
            cGame = id; aScore = 0; isPlaying = false;
            
            document.getElementById('task-container').style.pointerEvents = 'none';
            document.getElementById('arena-title').innerText = name;
            document.getElementById('arena-score').innerText = '0';
            
            let playArea = document.getElementById('play-area');
            playArea.classList.add('active');
            playArea.innerHTML = ''; // Clear board

            if(id === '3') {
                stability = 5;
                document.getElementById('stat-label').innerText = "MẠNG:";
                document.getElementById('arena-val').innerText = "❤️❤️❤️❤️❤️";
                playArea.innerHTML = '<div class="core-reactor" id="g3-core"></div>';
            } else {
                gTimeLeft = 30;
                document.getElementById('stat-label').innerText = "TIME:";
                document.getElementById('arena-val').innerText = "30s";
            }
            
            document.getElementById('arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').innerText = "THOÁT";
            booMsg("Lò Bát Quái đã nóng. Bấm Khai Trận!");
            
            document.getElementById('task-arena').classList.add('active');
        }

        function closeArena() {
            playSound('error');
            isPlaying = false;
            clearInterval(gTimer);
            clearTimeout(spawnTimer);
            cancelAnimationFrame(g3LoopId);
            
            document.getElementById('task-arena').classList.remove('active');
            document.getElementById('task-container').style.pointerEvents = 'auto';
        }

        function startArena() {
            isPlaying = true; 
            document.getElementById('arena-btn').style.display = 'none';
            document.getElementById('close-arena-btn').style.display = 'none';
            playSound('boom');
            
            if(cGame === '1') runG1();
            else if(cGame === '2') runG2();
            else if(cGame === '3') runG3();
        }

        function updateScoreUI() { document.getElementById('arena-score').innerText = aScore; }

        // ================= GAME 1: BẠO PHÁT (30s) =================
        function runG1() {
            gTimer = setInterval(() => {
                gTimeLeft--;
                document.getElementById('arena-val').innerText = `${gTimeLeft}s`;
                if(gTimeLeft <= 0) finishG12(25); // Yêu cầu 25đ
            }, 1000);
            spawnG1();
        }
        function spawnG1() {
            if(!isPlaying) return;
            let el = document.createElement('div');
            el.className = 'orb orb-fire';
            el.style.left = Math.random() * (300 - 45) + 'px';
            el.style.top = Math.random() * (300 - 45) + 'px';
            
            el.onmousedown = () => {
                aScore++; updateScoreUI(); playSound('coin');
                el.remove();
            };
            
            document.getElementById('play-area').appendChild(el);
            setTimeout(() => { if(el.parentElement) el.remove(); }, 900); // Rất nhanh
            
            spawnTimer = setTimeout(spawnG1, Math.max(300, 800 - (aScore * 15)));
        }

        // ================= GAME 2: CHÂN HỎA (30s) =================
        function runG2() {
            gTimer = setInterval(() => {
                gTimeLeft--;
                document.getElementById('arena-val').innerText = `${gTimeLeft}s`;
                if(gTimeLeft <= 0) finishG12(20); // Yêu cầu 20đ
            }, 1000);
            spawnG2();
        }
        function spawnG2() {
            if(!isPlaying) return;
            let el = document.createElement('div');
            let isFire = Math.random() > 0.3; // 70% Fire, 30% Ice
            el.className = isFire ? 'orb orb-fire' : 'orb orb-ice';
            el.style.left = Math.random() * (300 - 45) + 'px';
            el.style.top = Math.random() * (300 - 45) + 'px';
            
            el.onmousedown = () => {
                if(isFire) { aScore++; playSound('coin'); } 
                else { aScore -= 3; playSound('error'); document.getElementById('arena-box').classList.add('hit-flash'); setTimeout(()=>document.getElementById('arena-box').classList.remove('hit-flash'),300); }
                updateScoreUI(); el.remove();
            };
            
            document.getElementById('play-area').appendChild(el);
            setTimeout(() => { if(el.parentElement) el.remove(); }, 1000);
            
            spawnTimer = setTimeout(spawnG2, Math.max(350, 800 - (aScore * 10)));
        }

        function finishG12(target) {
            isPlaying = false; clearInterval(gTimer); clearTimeout(spawnTimer);
            document.getElementById('play-area').innerHTML = '';
            document.getElementById('close-arena-btn').style.display = 'block';
            
            if(aScore >= target) {
                booMsg(`RỰC CHÁY! Bạn đạt ${aScore} điểm.`);
                let card = document.getElementById(`card-${cGame}`);
                card.querySelector('.card-status').innerHTML = "ĐÃ XONG";
                card.querySelector('.card-status').classList.add('completed-text');
                card.style.borderColor = "#ffb700";
                hLuanTasks[cGame] = true; playSound('warp-out');
            } else {
                booMsg(`THẤT BẠI! Cần tối thiểu ${target} điểm.`); playSound('error');
            }
            updateSystemTerminal();
        }

        // ================= GAME 3: THỦ TRẬN (Sinh Tồn) =================
        function runG3() {
            projectiles = [];
            spawnG3();
            g3LoopId = requestAnimationFrame(loopG3);
        }
        function spawnG3() {
            if(!isPlaying) return;
            let el = document.createElement('div');
            el.className = 'projectile';
            // Center is 150, 150. Core is 30x30 -> pos 135,135.
            let px = 142; let py = 142;
            el.style.left = px + 'px'; el.style.top = py + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let speed = 1.5 + (aScore * 0.05); // Tăng tốc theo điểm
            let pObj = { x: px, y: py, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, el: el };
            projectiles.push(pObj);
            
            el.onmousedown = () => {
                if(!isPlaying) return;
                aScore++; updateScoreUI(); playSound('coin');
                el.remove();
                let idx = projectiles.indexOf(pObj);
                if(idx > -1) projectiles.splice(idx, 1);
            };
            
            document.getElementById('play-area').appendChild(el);
            spawnTimer = setTimeout(spawnG3, Math.max(250, 1200 - (aScore * 15)));
        }
        function loopG3() {
            if(!isPlaying) return;
            let playArea = document.getElementById('play-area');
            
            for(let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx; p.y += p.vy;
                p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
                
                // Chạm biên (300x300, viên đạn 15x15 -> bound là 0 -> 285)
                if(p.x < 0 || p.x > 285 || p.y < 0 || p.y > 285) {
                    stability--;
                    document.getElementById('arena-val').innerText = "❤️".repeat(stability);
                    playSound('boom');
                    document.getElementById('arena-box').classList.add('hit-flash'); 
                    setTimeout(()=>document.getElementById('arena-box').classList.remove('hit-flash'), 300);
                    
                    p.el.remove();
                    projectiles.splice(i, 1);
                    
                    if(stability <= 0) {
                        endG3(); return;
                    }
                }
            }
            g3LoopId = requestAnimationFrame(loopG3);
        }
        function endG3() {
            isPlaying = false; clearTimeout(spawnTimer);
            document.getElementById('play-area').innerHTML = '<div class="core-reactor" id="g3-core" style="background:#555; box-shadow:none;"></div>';
            document.getElementById('close-arena-btn').style.display = 'block';
            
            if(aScore >= 40) { // Yêu cầu 40 điểm để qua ải sinh tồn
                booMsg(`PHÒNG THỦ TUYỆT ĐỐI! Đạt ${aScore} điểm.`);
                let card = document.getElementById(`card-${cGame}`);
                card.querySelector('.card-status').innerHTML = "ĐÃ XONG";
                card.querySelector('.card-status').classList.add('completed-text');
                card.style.borderColor = "#ffb700";
                hLuanTasks[cGame] = true; playSound('warp-out');
            } else {
                booMsg(`LÒ BÁT QUÁI VỠ! Cần tối thiểu 40 điểm.`); playSound('error');
            }
            updateSystemTerminal();
        }

        // ================= KẾT THÚC & LƯU ĐIỂM =================
        function saveScore() {
            if(document.getElementById('btn-save-score').classList.contains('disabled')) return;
            playSound('coin');
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐÃ LƯU KẾT QUẢ VỀ LÕI!`;
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        }
        
        function navToCore() {
            playSound('error');
            document.body.classList.remove('assembled');
            document.getElementById('sanctum-bg').style.opacity = '0';
            setTimeout(() => { window.location.href = 'index.html'; }, 800); 
        }
    </script>
</body>
</html>
