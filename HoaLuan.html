<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Hỏa Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            touch-action: none; user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
        }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0c0814; font-family: 'Space Grotesk', sans-serif; }

        #sanctum-bg { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/PIC%20SANH%20HL.png?raw=true');
            background-size: cover; background-position: center; opacity: 0; 
            filter: brightness(1.05) contrast(1.05); 
            animation: sanctumEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes sanctumEntrance {
            0% { opacity: 0; transform: scale(1.08); filter: brightness(1.4) contrast(1.2) blur(6px); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1.05) contrast(1.05) blur(0px); }
        }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0.6; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #00ffcc; box-shadow: 0 0 4px #00ffcc; }
        .dust-large { width: 3px; height: 3px; background: #ffb700; box-shadow: 0 0 8px #ffb700; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { transform: translateY(-20vh); opacity: 0; } }

        .touch-ripple {
            position: fixed; border: 2px solid #00ffcc; border-radius: 50%; pointer-events: none; 
            transform: translate(-50%, -50%); z-index: 999999;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #00ffcc;
            animation: rippleAnim 0.35s ease-out forwards;
        }
        @keyframes rippleAnim {
            0% { width: 0px; height: 0px; opacity: 1; border-width: 4px; }
            100% { width: 70px; height: 70px; opacity: 0; border-width: 1px; }
        }

        #gateway-void-overlay {
            position: fixed; inset: 0; background-color: #08040c; z-index: 99999;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.5s ease; overflow: hidden;
            animation: fadeInGateway 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInGateway {
            0% { opacity: 0; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        #gateway-void-overlay::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 75%;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.2) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 229, 255, 0.2) 1px, transparent 1px);
            background-size: 50px 50px; background-position: center bottom;
            z-index: 1; pointer-events: none;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .gateway-box {
            width: 88%; max-width: 360px; background: rgba(18, 10, 25, 0.94);
            border: 1.5px solid #00ffcc; border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0, 255, 204, 0.1);
            position: relative; z-index: 10; padding: 26px 20px 18px 20px;
            animation: boxPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes boxPopIn {
            0% { transform: translateY(30px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #ninja-top-decor { position: absolute; top: -112px; left: 50%; transform: translateX(-50%); width: 250px; height: auto; z-index: 15; pointer-events: none; filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.4)); }
        #ninja-red-decor { position: absolute; bottom: -45px; right: -5px; width: 75px; height: auto; z-index: 20; pointer-events: none; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6)); }

        .gateway-content { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; }
        .gateway-title { color: #00ffcc; font-family: 'Share Tech Mono', monospace; font-size: 19px; font-weight: 900; margin-bottom: 6px; text-shadow: 0 0 10px #00ffcc; letter-spacing: 2px; text-transform: uppercase; }
        .gateway-desc { color: #b8b8dc; font-size: 11px; margin-bottom: 16px; font-family: 'Space Grotesk', sans-serif; text-align: center; }
        
        .mode-selector-container { display: flex; gap: 12px; width: 100%; margin-bottom: 14px; }
        .mode-btn {
            flex: 1; padding: 10px 5px; background: rgba(0, 0, 0, 0.6); border: 1.5px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc; font-family: 'Share Tech Mono', monospace; font-size: 12.5px; font-weight: bold;
            text-align: center; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }
        .mode-btn.active { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #fff; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }
        .main-start-btn {
            width: 100%; background: rgba(0, 255, 204, 0.25); border: 1.5px solid #00ffcc; border-radius: 8px; color: #fff;
            font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
            cursor: pointer; opacity: 0; height: 0; pointer-events: none; overflow: hidden; transition: all 0.3s ease;
        }
        .main-start-btn.ready { opacity: 1; height: 42px; pointer-events: auto; margin-bottom: 12px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); }
        
        .gateway-exit { 
            color: #ff007f; font-size: 12px; cursor: pointer; font-family: 'Share Tech Mono', monospace; 
            letter-spacing: 2px; font-weight: 900; padding: 8px; text-transform: uppercase; text-align: center; width: 100%; 
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8); transition: 0.2s; margin-top: 2px;
        }
        .gateway-exit:hover { color: #fff; text-shadow: 0 0 15px #fff; }

        #task-container { 
            position: fixed; top: 13%; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 380px; 
            opacity: 0; pointer-events: none; transition: all 0.4s ease; 
        }
        #task-container.active { opacity: 1; pointer-events: auto; animation: cardsSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes cardsSlideIn {
            0% { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .holo-card { 
            width: 110px; height: 95px; background: rgba(14, 8, 22, 0.6); 
            border: 1.5px solid rgba(0, 255, 204, 0.6); display: flex; flex-direction: column; justify-content: space-between; 
            align-items: center; padding: 6px 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 0 12px rgba(0,255,204,0.15); 
            cursor: pointer; border-radius: 10px; position: relative; backdrop-filter: blur(4px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: floatingCard 3s ease-in-out infinite alternate;
        }
        .holo-card:nth-child(2) { animation-delay: 0.5s; }
        .holo-card:nth-child(3) { animation-delay: 1s; }
        @keyframes floatingCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,255,204,0.25), inset 0 0 15px rgba(0,255,204,0.3); }
        }
        .holo-card:active { transform: scale(0.95); }

        .live-dot { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; background-color: #00ff66; border-radius: 50%; box-shadow: 0 0 6px #00ff66; }
        .card-sci-tag { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #00ffcc; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 204, 0.4); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .card-body-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; flex-grow: 1; }
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 15px; color: #ffb700; font-weight: bold; margin-bottom: 2px; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 10.5px; font-weight: bold; color: #ffffff; text-align: center; }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 7.5px; color: #00ffcc; font-weight: bold; text-transform: uppercase; }

        #floating-hud-panel {
            position: fixed; top: 27%; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 350px; z-index: 40;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4px; pointer-events: none;
            animation: fadeInHud 0.8s ease forwards;
        }
        @keyframes fadeInHud {
            0% { opacity: 0; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }
        .floating-stat-item {
            width: 48%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: auto; background: rgba(14, 8, 22, 0.75); border: 1.5px solid rgba(0, 255, 204, 0.5);
            padding: 7px 10px; border-radius: 8px; backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;
            transition: border-color 0.3s;
        }
        .floating-stat-item:hover { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4); }
        .floating-stat-label { font-family: 'Share Tech Mono', monospace; font-size: 9.5
