<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-DRIVE // TRẠM ĐIỀU PHỐI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #05050a;
            color: #00e5ff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Video nền trang chủ */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.35;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(5,5,10,0.4) 0%, rgba(5,5,10,0.85) 100%);
            z-index: -1;
        }

        /* Khung Trạm Điều Phối chuẩn gọn gàng như ảnh 3 */
        .command-station {
            width: 90%;
            max-width: 400px;
            background: rgba(8, 14, 28, 0.9);
            border: 1.5px solid #00e5ff;
            border-radius: 12px;
            padding: 24px 18px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .station-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #00e5ff;
            text-shadow: 0 0 12px rgba(0,229,255,0.8);
            margin-bottom: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Các nút Protocol dạng thanh ngang gọn gàng */
        .protocol-card {
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .protocol-card:hover {
            background: rgba(0, 229, 255, 0.12);
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }

        .protocol-name {
            font-size: 13px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .protocol-card.p4 .protocol-name {
            color: #ff2a6d;
        }

        /* Nút công tắc / trạng thái bên phải */
        .status-indicator {
            font-size: 11px;
            font-weight: bold;
            color: #00ff9d;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid #00ff9d;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .protocol-card.p4 .status-indicator {
            color: #ffd700;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        /* Nút đóng trạm ở dưới cùng */
        .close-station-btn {
            width: 100%;
            margin-top: 15px;
            background: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .close-station-btn:hover {
            background: #00e5ff;
            color: #05050a;
            box-shadow: 0 0 12px #00e5ff;
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN TRANG CHỦ -->
    <video autoplay muted loop class="bg-video">
        <source src="video nen trang chu.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ video nền.
    </video>
    <div class="overlay"></div>

    <div class="command-station">
        <div class="station-title">TRẠM ĐIỀU PHỐI</div>

        <!-- PROTOCOL 01 -->
        <a href="test_cau_hinh_nao.html" class="protocol-card">
            <span class="protocol-name">1. KIỂM TRA CẤU HÌNH NÃO</span>
            <span class="status-indicator">TRUY CẬP</span>
        </a>

        <!-- PROTOCOL 02 -->
        <a href="ket_noi_sinh_hoc.html" class="protocol-card">
            <span class="protocol-name">2. NÂNG CẤP TOÀN DIỆN</span>
            <span class="status-indicator">KẾT NỐI</span>
        </a>

        <!-- PROTOCOL 03 -->
        <a href="hieu_suat_gio_g.html" class="protocol-card">
            <span class="protocol-name">3. HIỆU SUẤT GIỜ G</span>
            <span class="status-indicator">LÊN LỊCH</span>
        </a>

        <!-- PROTOCOL 04 -->
        <a href="trang_thai_toi_thuong.html" class="protocol-card p4">
            <span class="protocol-name">4. TRẠNG THÁI TỐI THƯỢNG</span>
            <span class="status-indicator">KIỂM ĐỊNH</span>
        </a>

        <!-- NÚT ĐÓNG / QUAY VỀ -->
        <a href="index.html" class="close-station-btn">ĐÓNG TRẠM ĐIỀU PHỐI</a>
    </div>

</body>
</html>
