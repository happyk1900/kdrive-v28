<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-DRIVE // TRẠM ĐIỀU PHỐI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyan: #00e5ff;
            --mint: #00ff9d;
            --amber: #ffaa00;
            --crimson: #ff2a2a;
            --neon-pink: #ff007f;
            --gold: #ffd700;
            --text-gray: #a0b4c8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; color: #fff; }

        video::-webkit-media-controls { display: none !important; }

        #bg-video { 
            position: fixed; top: 0; left: 50%; width: 110vw; height: 100vh; 
            transform: translateX(-50%); 
            object-fit: cover; object-position: center center; 
            z-index: 0; opacity: 1; pointer-events: none; 
        }

        @keyframes screenBorderGlow {
            0% { box-shadow: inset 0 0 20px rgba(0,229,255,0.2), 0 0 30px rgba(0,229,255,0.3); }
            50% { box-shadow: inset 0 0 40px rgba(0,229,255,0.5), 0 0 60px rgba(0,229,255,0.7); }
            100% { box-shadow: inset 0 0 20px rgba(0,229,255,0.2), 0 0 30px rgba(0,229,255,0.3); }
        }

        .screen-frame {
            position: fixed; inset: 0; border: 1.5px solid rgba(0, 229, 255, 0.5);
            pointer-events: none; z-index: 999; animation: screenBorderGlow 4s infinite ease-in-out;
        }

        #quantum-canvas {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
        }

        .top-nav { 
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 9999; pointer-events: none; 
        }
        .btn-back-cyber, .btn-audio-cyber { 
            width: 40px; height: 40px; background: rgba(5, 7, 10, 0.85); border-radius: 10px; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: auto; 
            transition: all 0.2s ease;
        }
        .btn-back-cyber { border: 1px solid rgba(0, 229, 255, 0.7); color: var(--cyan); font-family: 'Share Tech Mono', monospace; font-size: 21px; font-weight: bold; box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        .btn-back-cyber:active { transform: scale(0.92); background: rgba(0,229,255,0.3); }

        .btn-audio-cyber { border: 1px solid rgba(255, 0, 127, 0.8); animation: pinkPulseGlow 2s infinite; position: relative; box-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .audio-equalizer { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 16px; width: 20px; }
        .eq-bar { width: 3px; background: var(--neon-pink); border-radius: 2px; }
        .eq-bar-1 { height: 8px; animation: eqAnim 0.8s infinite alternate; } 
        .eq-bar-2 { height: 14px; animation: eqAnim 0.5s infinite alternate; } 
        .eq-bar-3 { height: 11px; animation: eqAnim 0.7s infinite alternate; }
        @keyframes eqAnim { 0% { height: 4px; } 100% { height: 16px; } }

        .volume-control-box {
            position: absolute; top: 48px; right: 0; background: rgba(5, 10, 18, 0.95);
            border: 1px solid var(--neon-pink); border-radius: 8px; padding: 10px; width: 140px;
            display: none; flex-direction: column; gap: 6px; box-shadow: 0 0 20px rgba(255,0,127,0.5);
            backdrop-filter: blur(10px); z-index: 10000; pointer-events: auto;
        }
        .volume-control-box.active { display: flex; }
        .volume-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-pink); text-align: center; text-transform: uppercase; }
        .volume-slider { width: 100%; accent-color: var(--neon-pink); cursor: pointer; }

        #content-wrapper { 
            position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; padding-top: 36vh;
            overflow-y: auto;
        }

        .command-station {
            width: 92%; max-width: 420px;
            background: rgba(3, 11, 20, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--cyan); border-radius: 16px;
            padding: 18px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 25px rgba(0, 229, 255, 0.35);
            max-height: 58vh; overflow-y: auto; margin-bottom: 20px;
            animation: stationBreathe 4s infinite alternate ease-in-out;
        }

        @keyframes stationBreathe {
            0% { border-color: rgba(0,229,255,0.6); box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 20px rgba(0, 229, 255, 0.25); }
            100% { border-color: rgba(0,229,255,1); box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 35px rgba(0, 229, 255, 0.5); }
        }

        .station-title {
            font-family: 'Montserrat', sans-serif; color: #fff; font-size: 18px; font-weight: 900;
            margin-bottom: 4px; letter-spacing: 3px; text-transform: uppercase; text-align: center;
            text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
        }

        .protocol-box {
            background: rgba(0, 229, 255, 0.04);
            border: 1.5px solid rgba(0, 229, 255, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,229,255,0.05);
        }
        .protocol-box:hover {
            border-color: var(--cyan);
            background: rgba(0, 229, 255, 0.09);
            box-shadow: 0 0 15px rgba(0,229,255,0.3), inset 0 0 15px rgba(0,229,255,0.15);
        }

        .protocol-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .protocol-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,215,0,0.4);
        }

        /* ĐỔI MÀU HỒNG CHO PHẦN 2: CỘNG SINH CÙNG AI */
        .protocol-box.p2 .protocol-name {
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255,0,127,0.5);
        }

        .protocol-box.p4 .protocol-name {
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255,0,127,0.5);
        }

        .cyber-toggle { 
            position: relative; width: 44px; height: 22px; background: rgba(255,255,255,0.15); border-radius: 12px; cursor: pointer; transition: background 0.3s; border: 1.5px solid rgba(255,255,255,0.4); flex-shrink: 0; 
        }
        .cyber-toggle::after { 
            content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform 0.3s, background 0.3s; box-shadow: 0 0 6px rgba(0,0,0,0.6); 
        }
        .cyber-toggle.active { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
        .cyber-toggle.active::after { transform: translateX(22px); background: #000; }

        .dropdown-panel { 
            max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; opacity: 0; 
        }
        .dropdown-panel.open { max-height: 1000px; opacity: 1; margin-top: 10px; border-top: 1px dashed rgba(0,229,255,0.4); padding-top: 10px; }
        
        .dropdown-desc { 
            font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #e0ecff; line-height: 1.6; text-align: justify; margin-bottom: 10px; 
        }

        .inline-detail-btn {
            font-family: 'Share Tech Mono', monospace; font-size: 11.5px; color: var(--neon-pink); background: rgba(255,0,127,0.15); border: 1px solid rgba(255,0,127,0.5); padding: 2px 8px; border-radius: 4px; cursor: pointer; display: inline-block; margin-left: 6px; text-transform: uppercase;
            transition: 0.2s; box-shadow: 0 0 6px rgba(255,0,127,0.3);
        }
        .inline-detail-btn:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 12px var(--neon-pink); }

        .action-group {
            display: flex; flex-direction: column; gap: 6px;
        }

        .action-item-wrapper {
            display: flex; flex-direction: column; gap: 4px;
            background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 8px; padding: 8px 10px; text-align: center;
            transition: transform 0.15s ease;
        }
        .action-item-wrapper:active { transform: scale(0.98); }

        .action-subtitle {
            font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
        }

        @keyframes borderEnergyRun {
            0% { border-color: var(--amber); box-shadow: 0 0 12px rgba(255,170,0,0.6), inset 0 0 6px rgba(255,170,0,0.4); }
            33% { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,229,255,0.9), inset 0 0 12px rgba(0,229,255,0.6); }
            66% { border-color: var(--mint); box-shadow: 0 0 20px rgba(0,255,157,0.9), inset 0 0 12px rgba(0,255,157,0.6); }
            100% { border-color: var(--amber); box-shadow: 0 0 12px rgba(255,170,0,0.6), inset 0 0 6px rgba(255,170,0,0.4); }
        }

        .action-btn-clean {
            background: rgba(255, 170, 0, 0.15);
            border: 2px solid var(--amber);
            color: #ffffff;
            padding: 12px 14px;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2.5px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            animation: borderEnergyRun 2.5s infinite linear, pulseBtnGlow 1.2s infinite alternate;
        }

        @keyframes pulseBtnGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.3); }
        }

        .action-btn-clean:hover {
            background: var(--amber);
            color: #000;
            box-shadow: 0 0 30px var(--amber);
            transform: translateY(-1px);
        }

        @keyframes pinkPulseGlow {
            0% { border-color: rgba(255, 0, 127, 0.5); box-shadow: 0 0 8px rgba(255, 0, 127, 0.3); }
            50% { border-color: rgba(255, 0, 127, 1); box-shadow: 0 0 20px rgba(255, 0, 127, 0.8); }
            100% { border-color: rgba(255, 0, 127, 0.5); box-shadow: 0 0 8px rgba(255, 0, 127, 0.3); }
        }

        .cyber-modal { position: fixed; inset: 0; background: rgba(2, 6, 12, 0.8); z-index: 30000; display: none; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(6px); }
        .cyber-modal.active { display: flex; }
        .modal-box { width: 100%; max-width: 390px; background: rgba(5, 12, 22, 0.98); backdrop-filter: blur(15px); border: 2px solid var(--neon-pink); border-radius: 12px; padding: 20px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 45px rgba(255,0,127,0.5); }
        .modal-title { font-family: 'Montserrat', sans-serif; color: var(--neon-pink); font-size: 17px; font-weight: 900; margin-bottom: 14px; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; text-shadow: 0 0 12px rgba(255,0,127,0.8); }
        .modal-text { font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; color: #e0ecff; line-height: 1.65; text-align: justify; margin-bottom: 18px; }
        .modal-close-btn { width: 100%; padding: 11px; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; background: rgba(255,0,127,0.2); border: 1.5px solid var(--neon-pink); color: var(--neon-pink); border-radius: 6px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; box-shadow: 0 0 10px rgba(255,0,127,0.3
