<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-DRIVE // TRẠM ĐIỀU PHỐI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyan: #00e5ff;
            --mint: #00ff9d;
            --amber: #ffaa00;
            --crimson: #ff2a2a;
            --neon-pink: #ff007f;
            --gold: #ffd700;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; color: #fff; }

        video::-webkit-media-controls { display: none !important; }

        #bg-video { 
            position: fixed; top: 0; left: 50%; width: 110vw; height: 100vh; 
            transform: translateX(-50%); 
            object-fit: cover; object-position: center center; 
            z-index: 0; opacity: 1; pointer-events: none; 
        }

        .overlay {
            position: fixed; inset: 0; background: radial-gradient(circle, rgba(2,6,12,0.4) 0%, rgba(2,6,12,0.85) 100%);
            z-index: 1; pointer-events: none;
        }

        #content-wrapper { 
            position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: center; 
            animation: fadeIn 1s ease-out forwards; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* KHUNG TRẠM ĐIỀU PHỐI GỌN GÀNG, SẮC LẸM */
        .command-station {
            width: 90%; max-width: 390px;
            background: rgba(5, 15, 25, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 14px;
            padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 15px rgba(0, 229, 255, 0.15);
        }

        .station-title {
            font-family: 'Montserrat', sans-serif; color: #00e5ff; font-size: 18px; font-weight: 900;
            margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; text-align: center;
            text-shadow: 0 0 15px rgba(0,229,255,0.8);
        }

        .protocol-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .protocol-row:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .protocol-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .protocol-row.p4 .protocol-name {
            color: var(--neon-pink);
        }

        .action-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            font-weight: bold;
            color: var(--mint);
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid var(--mint);
            padding: 5px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .protocol-row.p4 .action-btn {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .close-station-btn {
            width: 100%;
            margin-top: 6px;
            background: transparent;
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: var(--cyan);
            padding: 11px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }

        .close-station-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN ĐỒNG BỘ CHUẨN XÁC 100% NHƯ TRANG LỰC CHIẾN -->
    <video id="bg-video" autoplay loop muted playsinline webkit-playsinline>
        <source src="Photo/video nen trang chu.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="content-wrapper">
        <div class="command-station">
            <div class="station-title">TRẠM ĐIỀU PHỐI</div>

            <!-- PROTOCOL 01 -->
            <a href="test_cau_hinh_nao.html" class="protocol-row" onclick="playSound('coin')">
                <span class="protocol-name">1. KIỂM TRA CẤU HÌNH NÃO</span>
                <span class="action-btn">TRUY CẬP</span>
            </a>

            <!-- PROTOCOL 02 -->
            <a href="ket_noi_sinh_hoc.html" class="protocol-row" onclick="playSound('coin')">
                <span class="protocol-name">2. NÂNG CẤP TOÀN DIỆN</span>
                <span class="action-btn">KẾT NỐI</span>
            </a>

            <!-- PROTOCOL 03 -->
            <a href="hieu_suat_gio_g.html" class="protocol-row" onclick="playSound('coin')">
                <span class="protocol-name">3. HIỆU SUẤT GIỜ G</span>
                <span class="action-btn">LÊN LỊCH</span>
            </a>

            <!-- PROTOCOL 04 -->
            <a href="trang_thai_toi_thuong.html" class="protocol-row p4" onclick="playSound('coin')">
                <span class="protocol-name">4. TRẠNG THÁI TỐI THƯỢNG</span>
                <span class="action-btn">KIỂM ĐỊNH</span>
            </a>

            <!-- NÚT ĐÓNG TRẠM -->
            <a href="index.html" class="close-station-btn" onclick="playSound('warp-out')">ĐÓNG TRẠM ĐIỀU PHỐI</a>
        </div>
    </div>

    <script>
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(type === 'coin' ? 1500 : 2000, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            } catch(e) {}
        }

        window.addEventListener('load', () => { 
            const vid = document.getElementById('bg-video'); 
            if (vid) { vid.play().catch(e => {}); } 
        });
    </script>
</body>
</html>
