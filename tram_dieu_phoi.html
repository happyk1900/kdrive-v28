<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-DRIVE // TRẠM ĐIỀU PHỐI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyan: #00e5ff;
            --mint: #00ff9d;
            --amber: #ffaa00;
            --crimson: #ff2a2a;
            --neon-pink: #ff007f;
            --gold: #ffd700;
            --text-gray: #a0b4c8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; color: #fff; }

        video::-webkit-media-controls { display: none !important; }

        #bg-video { 
            position: fixed; top: 0; left: 50%; width: 110vw; height: 100vh; 
            transform: translateX(-50%); 
            object-fit: cover; object-position: center center; 
            z-index: 0; opacity: 1; pointer-events: none; 
        }

        @keyframes screenBorderGlow {
            0% { box-shadow: inset 0 0 20px rgba(0,229,255,0.2), 0 0 30px rgba(0,229,255,0.3); }
            50% { box-shadow: inset 0 0 40px rgba(0,229,255,0.5), 0 0 60px rgba(0,229,255,0.7); }
            100% { box-shadow: inset 0 0 20px rgba(0,229,255,0.2), 0 0 30px rgba(0,229,255,0.3); }
        }

        .screen-frame {
            position: fixed; inset: 0; border: 1.5px solid rgba(0, 229, 255, 0.5);
            pointer-events: none; z-index: 999; animation: screenBorderGlow 4s infinite ease-in-out;
        }

        #quantum-canvas {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
        }

        .top-nav { 
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 9999; pointer-events: none; 
        }
        .btn-back-cyber, .btn-audio-cyber { 
            width: 40px; height: 40px; background: rgba(5, 7, 10, 0.85); border-radius: 10px; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: auto; 
            transition: all 0.2s ease;
        }
        .btn-back-cyber { border: 1px solid rgba(0, 229, 255, 0.7); color: var(--cyan); font-family: 'Share Tech Mono', monospace; font-size: 21px; font-weight: bold; box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        .btn-back-cyber:active { transform: scale(0.92); background: rgba(0,229,255,0.3); }

        .btn-audio-cyber { border: 1px solid rgba(255, 0, 127, 0.8); animation: pinkPulseGlow 2s infinite; position: relative; box-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .audio-equalizer { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 16px; width: 20px; }
        .eq-bar { width: 3px; background: var(--neon-pink); border-radius: 2px; }
        .eq-bar-1 { height: 8px; animation: eqAnim 0.8s infinite alternate; } 
        .eq-bar-2 { height: 14px; animation: eqAnim 0.5s infinite alternate; } 
        .eq-bar-3 { height: 11px; animation: eqAnim 0.7s infinite alternate; }
        @keyframes eqAnim { 0% { height: 4px; } 100% { height: 16px; } }

        .volume-control-box {
            position: absolute; top: 48px; right: 0; background: rgba(5, 10, 18, 0.95);
            border: 1px solid var(--neon-pink); border-radius: 8px; padding: 10px; width: 140px;
            display: none; flex-direction: column; gap: 6px; box-shadow: 0 0 20px rgba(255,0,127,0.5);
            backdrop-filter: blur(10px); z-index: 10000; pointer-events: auto;
        }
        .volume-control-box.active { display: flex; }
        .volume-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-pink); text-align: center; text-transform: uppercase; }
        .volume-slider { width: 100%; accent-color: var(--neon-pink); cursor: pointer; }

        #content-wrapper { 
            position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; padding-top: 36vh;
            overflow-y: auto;
        }

        .command-station {
            width: 92%; max-width: 420px;
            background: rgba(3, 11, 20, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--cyan); border-radius: 16px;
            padding: 18px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 25px rgba(0, 229, 255, 0.35);
            max-height: 58vh; overflow-y: auto; margin-bottom: 20px;
            animation: stationBreathe 4s infinite alternate ease-in-out;
        }

        @keyframes stationBreathe {
            0% { border-color: rgba(0,229,255,0.6); box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 20px rgba(0, 229, 255, 0.25); }
            100% { border-color: rgba(0,229,255,1); box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 35px rgba(0, 229, 255, 0.5); }
        }

        .station-title {
            font-family: 'Montserrat', sans-serif; color: #fff; font-size: 18px; font-weight: 900;
            margin-bottom: 4px; letter-spacing: 3px; text-transform: uppercase; text-align: center;
            text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
        }

        .protocol-box {
            background: rgba(0, 229, 255, 0.04);
            border: 1.5px solid rgba(0, 229, 255, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,229,255,0.05);
        }
        .protocol-box:hover {
            border-color: var(--cyan);
            background: rgba(0, 229, 255, 0.09);
            box-shadow: 0 0 15px rgba(0,229,255,0.3), inset 0 0 15px rgba(0,229,255,0.15);
        }

        .protocol-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .protocol-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,215,0,0.4);
        }

        .protocol-box.p4 .protocol-name {
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255,0,127,0.5);
        }

        }
