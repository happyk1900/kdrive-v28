<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive Intro - Định Danh Phó Sư</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; transition: background-color 0.3s ease; }

        /* GIAO DIỆN ONBOARDING CHÍNH */
        #onboarding-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: transparent; z-index: 10; padding: 20px; transition: opacity 0.5s ease-out; }
        
        /* NỀN ẢNH HOẶC VIDEO NỀN */
        #ob-bg-layer {
            position: absolute; inset: 0;
            background-size: cover; background-position: center center;
            opacity: 0; transition: opacity 0.8s ease-in-out, background-image 0.5s ease;
            z-index: 1; 
        }

        #ob-bg-video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 2; opacity: 0; transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        /* HIỆU ỨNG BOO XUẤT HIỆN TỪ HƯ VÔ */
        #ob-boo-wrapper { opacity: 0; z-index: 5; transition: opacity 0.5s ease; }
        .ob-boo-grand-entry { animation: grandAppear 2s cubic-bezier(0.1, 1, 0.2, 1) forwards; }
        @keyframes grandAppear {
            0% { transform: scale(0) translateY(150px) rotate(15deg); opacity: 0; filter: blur(30px) brightness(3); }
            30% { transform: scale(2.2) translateY(-20px) rotate(-5deg); opacity: 1; filter: blur(5px) brightness(2); }
            60% { transform: scale(1.5) translateY(10px) rotate(2deg); opacity: 1; filter: blur(0px) brightness(1.2); }
            100% { transform: scale(1.6) translateY(0) rotate(0deg); opacity: 1; filter: blur(0px) brightness(1); }
        }

        .ob-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; width: 100%; z-index: 10;}
        
        /* MŨI TÊN ĐIỀU HƯỚNG */
        .nav-arrow { position: relative; z-index: 100; color: #00e5ff; font-size: 32px; cursor: pointer; padding: 15px 25px; text-shadow: 0 0 10px #00e5ff; transition: transform 0.2s, text-shadow 0.2s; user-select: none; font-family: monospace; font-weight: bold; pointer-events: auto;}
        .nav-arrow:active { transform: scale(0.8); text-shadow: 0 0 20px #fff; }
        
        .ob-boo-wrapper { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; margin-top: 10px;}
        .ob-boo { position: relative !important; top: 0 !important; right: 0 !important; pointer-events: none; margin: 0 !important;}
        
        /* THỰC THỂ BOO - LẮP RÁP CYBORG */
        .boo-hologram { display: flex; justify-content: center; align-items: center; width: 55px; height: 55px; transform-style: preserve-3d; }
        .boo-part { opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }

        .boo-quadrant { position: absolute; width: 45px; height: 45px; border: 3px solid transparent; box-sizing: border-box; z-index: 1; transform: scale(1.5); }
        .bq-dia { top: -10px; left: -10px; border-top-color: #ffd700; border-left-color: #ffd700; border-radius: 40px 0 0 0; filter: drop-shadow(0 0 4px #ffd700); }
        .bq-thuy { top: -10px; right: -10px; border-top-color: #0088ff; border-right-color: #0088ff; border-radius: 0 40px 0 0; filter: drop-shadow(0 0 4px #0088ff); }
        .bq-hoa { bottom: -10px; left: -10px; border-bottom-color: #ff3300; border-left-color: #ff3300; border-radius: 0 0 0 40px; filter: drop-shadow(0 0 4px #ff3300); }
        .bq-phong { bottom: -10px; right: -10px; border-bottom-color: #00ffff; border-right-color: #00ffff; border-radius: 0 0 40px 0; filter: drop-shadow(0 0 4px #00ffff); }
        
        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff 100%, transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 4px; z-index: 3; box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; transform: scale(0.8); }
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8); z-index: 2; }
        
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 20px; background: #000; border-radius: 50%; transition: all 0.3s; animation: booBlink 3.5s infinite; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }
        @keyframes booBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        
        .ob-sound-waves { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid #00e5ff; opacity: 0; pointer-events: none; }

        /* LẮP RÁP CYBORG THEO TỪNG CẢNH */
        .ob-scene-1 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-2 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-2 .boo-energy-border { opacity: 1; transform: scale(1); animation: obFlashEnergy 0.5s infinite !important; filter: hue-rotate(150deg); }
        .ob-scene-3 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-3 .boo-energy-border { opacity: 1; transform: scale(1); box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; animation: none !important; filter: none;}
        .ob-scene-3 .boo-quadrant { opacity: 1; transform: scale(1); animation: obFlash 0.3s infinite !important; border-width: 4px !important; }
        .ob-scene-4 .boo-face { opacity: 1; transform: scale(1); box-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff !important; }
        .ob-scene-4 .boo-energy-border { opacity: 1; transform: scale(1); }
        .ob-scene-4 .boo-quadrant { opacity: 1; transform: scale(1); }
        .ob-scene-4 .ob-sound-waves { animation: obWaves 1.5s infinite ease-out !important; }

        @keyframes obFlash { 0%, 50% { filter: drop-shadow(0 0 12px #ff0000); border-color: #ff0000; } 51%, 100% { filter: none; opacity: 0.5; } }
        @keyframes obFlashEnergy { 0%, 50% { box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff0000 !important; } 51%, 100% { box-shadow: none; opacity: 0.3;} }
        @keyframes obWaves { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        /* VĂN BẢN HIỆU ỨNG GÕ CHỮ */
        .ob-laser-line { width: 1px; height: 30px; background: linear-gradient(to bottom, #00e5ff, transparent); margin-bottom: 10px; box-shadow: 0 0 8px #00e5ff; opacity: 0; transition: opacity 0.5s; animation: laserPulse 1.5s infinite alternate; z-index: 5;}
        @keyframes laserPulse { 0% { height: 20px; opacity: 0.5;} 100% { height: 35px; opacity: 1;} }

        .ob-text-box { width: 100%; max-width: 400px; padding: 10px 15px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; opacity: 0; transition: opacity 0.3s ease-in-out; z-index: 5;}
        .ob-title { color: #ffaa00; font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 12px rgba(255,170,0,0.8); margin-bottom: 15px; text-align: center; text-transform: uppercase;}
        
        .ob-desc { 
            color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 2; text-align: center; width: 100%; 
            min-height: 80px; text-shadow: 0 0 5px rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
            white-space: pre-wrap;
        }
        
        /* Hiệu ứng con trỏ nhấp nháy khi đang gõ chữ */
        .cursor { display: inline-block; background-color: #00e5ff; width: 8px; height: 16px; animation: blinkCursor 0.8s infinite; vertical-align: middle; margin-left: 3px; }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .ob-dots { display: flex; gap: 10px; margin-top: 10px; opacity: 0; transition: opacity 1s; z-index: 5;}
        .ob-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,229,255,0.2); transition: 0.3s; }
        .ob-dot.active { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; transform: scale(1.5); }

        /* NÚT KÍCH HOẠT DƯỚI ĐÁY */
        .start-btn { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.9); color: #fff; padding: 14px 25px; font-size: 14px; font-weight: bold; letter-spacing: 3px; cursor: pointer; z-index: 100; font-family: 'Space Grotesk', sans-serif; white-space: nowrap; transition: 0.5s; text-shadow: 0 0 10px rgba(0,229,255,0.8); overflow: hidden; text-transform: uppercase; opacity: 0; pointer-events: none; border-radius: 4px; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        .start-btn::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-25deg); animation: sweepLight 3s infinite; }
        .start-btn:hover { color: #00e5ff; border-bottom-color: #00e5ff; text-shadow: 0 0 20px #00e5ff; box-shadow: 0 0 25px #00e5ff; }
        @keyframes sweepLight { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

        /* HIỆU ỨNG CHỚP MÀN HÌNH CHUYỂN TRANG */
        #flash-overlay { position: fixed; inset: 0; background-color: #00e5ff; opacity: 0; z-index: 99999; pointer-events: none; transition: opacity 0.1s ease-out; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="onboarding-ui">
        <!-- NỀN ẢNH HOẶC VIDEO -->
        <div id="ob-bg-layer"></div>
        <video id="ob-bg-video" autoplay muted loop playsinline>
            <source src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/A%20ROYAL.mp4" type="video/mp4">
        </video>

        <div class="ob-container">
            <div class="nav-arrow" id="ob-nav-left" onclick="prevSceneManual(event)">&#10094;</div>
            <div class="ob-boo-wrapper" id="ob-boo-wrapper">
                <div class="boo-hologram ob-boo" id="ob-boo">
                    <div class="boo-part boo-quadrant bq-dia"></div>
                    <div class="boo-part boo-quadrant bq-thuy"></div>
                    <div class="boo-part boo-quadrant bq-hoa"></div>
                    <div class="boo-part boo-quadrant bq-phong"></div>
                    <div class="boo-part boo-energy-border"></div>
                    <div class="boo-part boo-face">
                        <div class="boo-part ob-sound-waves"></div>
                    </div>
                </div>
            </div>
            <div class="nav-arrow" id="ob-nav-right" onclick="nextSceneManual(event)">&#10095;</div>
        </div>
        <div class="ob-laser-line" id="ob-laser-line"></div>
        <div class="ob-text-box" id="ob-text-wrapper">
            <div class="ob-title" id="ob-title"></div>
            <div class="ob-desc" id="ob-desc"><span class="cursor"></span></div>
        </div>
        <div class="ob-dots" id="ob-dots">
            <div class="ob-dot active"></div>
            <div class="ob-dot"></div>
            <div class="ob-dot"></div>
            <div class="ob-dot"></div>
            <div class="ob-dot"></div>
        </div>
        <button class="start-btn light-sweep" id="bootBtn" onclick="launchCore()">KHAI HỎA LÕI HUẤN LUYỆN</button>
    </div>

    <script>
        // ==========================================
        // DỮ LIỆU 5 CẢNH (HỖ TRỢ HTML TRONG HIỆU ỨNG GÕ CHỮ)
        // ==========================================
        const obScenes = [
            { 
                title: "PHÓ SƯ BOO AI", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh1.png?raw=true",
                isVideo: false,
                text: "<span style='color:#00e5ff;'>//</span> THỰC THỂ CỐ VẤN: PHÓ SƯ BOO ĐÃ THỨC TỈNH.\n<span style='color:#00e5ff;'>//</span> Quá trình lột xác thành <span style='color:#ffaa00; font-weight:bold;'>CYBER-RONIN</span> bắt đầu.", 
                visualClass: "ob-scene-1" 
            },
            { 
                title: "LÕI SINH MỆNH", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh2.png?raw=true",
                isVideo: false,
                text: "<span style='color:#ff2a2a;'>//</span> LÕI SINH MỆNH BẮT ĐẦU.\n<span style='color:#ff2a2a;'>//</span> Cạn năng lượng là sập nguồn, hãy tiếp tế <span style='color:#00ff80;'>TRÀ SỮA NEON</span>.", 
                visualClass: "ob-scene-2" 
            },
            { 
                title: "TỨ LUÂN TRẬN", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh3.png?raw=true",
                isVideo: false,
                text: "<span style='color:#00e5ff;'>//</span> TỨ LUÂN TRẬN KHỞI ĐỘNG.\n<span style='color:#00e5ff;'>//</span> Tắt một vòng là rỉ máu, mất cả bốn vòng là án tử.", 
                visualClass: "ob-scene-3" 
            },
            { 
                title: "GIAO THỨC TƯƠNG TÁC", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh4.png?raw=true",
                isVideo: false,
                text: "<span style='color:#00e5ff;'>//</span> GIAO THỨC SÓNG ÂM ĐÃ MỞ.\n<span style='color:#00e5ff;'>></span> <span style='color:#ffd700;'>1 Chạm</span>: Lệnh | <span style='color:#ffd700;'>2 Chạm</span>: Voice | <span style='color:#ffd700;'>3 Chạm</span>: Mute | <span style='color:#ff2a2a;'>Nhấn Giữ</span>: Gọi dậy.", 
                visualClass: "ob-scene-4" 
            },
            { 
                title: "A ROYAL TEA - KẾT NỐI", 
                isVideo: true,
                text: "<span style='color:#ffaa00; font-weight:bold;'>Hành trình trở thành CYBER-RONIN chính thức khai ấn!!</span>", 
                visualClass: "ob-scene-5" 
            }
        ];

        let obSceneIndex = 0;
        let sceneTimeout = null;
        let typingInterval = null;
        let hasBooted = false;

        // BỘ CẤP ÂM THANH
        let audioCtx = null;
        let currentOscillators = [];

        function stopAllAudio() {
            currentOscillators.forEach(node => {
                try { node.stop(); node.disconnect(); } catch (e) {}
            });
            currentOscillators = [];
        }

        function playHardcoreAudio(sceneIndex) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAllAudio(); 

            const t = audioCtx.currentTime;
            
            if (sceneIndex === 0) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, t); osc.frequency.linearRampToValueAtTime(30, t + 7.9);
                gain.gain.setValueAtTime(0.01, t); gain.gain.linearRampToValueAtTime(0.4, t + 1.0); gain.gain.linearRampToValueAtTime(0, t + 7.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 7.9);
                currentOscillators.push(osc);
            } 
            else if (sceneIndex === 1) {
                for(let i=0; i<8; i++) {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, t + i);
                    gain.gain.setValueAtTime(0, t + i); 
                    gain.gain.linearRampToValueAtTime(0.3, t + i + 0.05); 
                    gain.gain.linearRampToValueAtTime(0, t + i + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t + i); osc.stop(t + i + 0.2);
                    currentOscillators.push(osc);
                }
            }
            else if (sceneIndex === 2) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'square';
                for(let i=0; i<16; i++) {
                    osc.frequency.setValueAtTime(800, t + i*0.5); osc.frequency.setValueAtTime(600, t + i*0.5 + 0.25);
                }
                gain.gain.setValueAtTime(0.15, t); gain.gain.linearRampToValueAtTime(0.15, t + 7.5); gain.gain.linearRampToValueAtTime(0, t + 7.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 7.9);
                currentOscillators.push(osc);
            }
            else if (sceneIndex === 3) {
                for(let i=0; i<6; i++) {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, t + i*1.3);
                    gain.gain.setValueAtTime(0, t + i*1.3); gain.gain.linearRampToValueAtTime(0.5, t + i*1.3 + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, t + i*1.3 + 1.0);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t + i*1.3); osc.stop(t + i*1.3 + 1.2);
                    currentOscillators.push(osc);
                }
            }
            else if (sceneIndex === 4) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(450, t + 4.0);
                gain.gain.setValueAtTime(0.01, t);
                gain.gain.linearRampToValueAtTime(0.2, t + 2.0);
                gain.gain.linearRampToValueAtTime(0, t + 7.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 7.9);
                currentOscillators.push(osc);
            }
        }

        window.addEventListener('load', () => {
            document.body.addEventListener('click', bootSequence, { once: true });
            
            setTimeout(() => {
                if(!hasBooted) {
                    document.getElementById('ob-title').innerHTML = "<span style='color:#00e5ff; font-size:12px;'>> CHẠM VÀO MÀN HÌNH ĐỂ KHỞI ĐỘNG <</span>";
                    document.getElementById('ob-text-wrapper').style.opacity = 1;
                }
            }, 1000);
        });

        function bootSequence() {
            hasBooted = true;
            document.getElementById('ob-boo-wrapper').classList.add('ob-boo-grand-entry');
            document.getElementById('ob-laser-line').style.opacity = 1;
            document.getElementById('ob-dots').style.opacity = 1;
            
            renderScene(0);
        }

        // HÀM HIỆN CHỮ KIỂU GÕ MÁY (TYPEWRITER HỖ TRỢ HTML)
        function typeWriterHTML(html, element, speed = 25, callback) {
            clearInterval(typingInterval);
            element.innerHTML = "";
            
            let i = 0;
            let tempDiv = document.createElement("div");
            tempDiv.innerHTML = html;
            let rawText = tempDiv.textContent || tempDiv.innerText || "";
            
            // Tạm thời dùng gõ chữ thuần văn bản kết hợp giữ nguyên màu sắc qua băm HTML
            // Để đơn giản và mượt mà, ta gõ từng ký tự của chuỗi text hiển thị kèm con trỏ
            let currentHTML = "";
            
            // Xử lý bóc tách nội dung HTML để gõ từng chữ chân thực
            let charIndex = 0;
            
            // Dùng cách gõ nội dung trực tiếp qua innerHTML tăng dần token
            typingInterval = setInterval(() => {
                if (charIndex <= html.length) {
                    // Cắt chuỗi HTML từ từ nhưng tránh làm vỡ thẻ (hoặc đơn giản là gõ thẳng chuỗi HTML với tốc độ nhanh)
                    // Cải tiến: Hiệu ứng gõ từng từ/ký tự mượt bằng cách chèn dần innerHTML
                    element.innerHTML = html.substring(0, charIndex) + '<span class="cursor"></span>';
                    charIndex += 2; // Gõ nhanh 2 ký tự mỗi nhịp cho kịp thời gian cảnh
                } else {
                    element.innerHTML = html + '<span class="cursor" style="animation: none; opacity: 0;"></span>';
                    clearInterval(typingInterval);
                    if (callback) callback();
                }
            }, speed);
        }

        // ==========================================
        // VÒNG LẶP 5 CẢNH & ĐIỀU HƯỚNG
        // ==========================================
        function renderScene(idx) {
            clearTimeout(sceneTimeout); 
            clearInterval(typingInterval);
            obSceneIndex = idx;
            const scene = obScenes[idx];
            
            document.querySelectorAll('.ob-dot').forEach((dot, i) => { dot.classList.toggle('active', i === idx); });
            
            const booWrapper = document.getElementById('ob-boo-wrapper');
            if (scene.isVideo) {
                booWrapper.style.opacity = '0';
                booWrapper.style.pointerEvents = 'none';
            } else {
                booWrapper.style.opacity = '1';
                booWrapper.style.pointerEvents = 'auto';
                document.getElementById('ob-boo').className = 'boo-hologram ob-boo ' + scene.visualClass;
            }
            
            const textWrap = document.getElementById('ob-text-wrapper');
            const bgLayer = document.getElementById('ob-bg-layer');
            const bgVideo = document.getElementById('ob-bg-video');
            
            textWrap.style.opacity = 0;
            bgLayer.style.opacity = 0;
            bgVideo.style.opacity = 0;

            setTimeout(() => {
                document.getElementById('ob-title').innerHTML = scene.title;
                
                // Gọi hiệu ứng gõ chữ
                const descElem = document.getElementById('ob-desc');
                typeWriterHTML(scene.text, descElem, 30);
                
                if (scene.isVideo) {
                    bgVideo.style.opacity = 1;
                    bgVideo.play().catch(e => {});
                } else {
                    bgVideo.pause();
                    bgLayer.style.backgroundImage = `url('${scene.bgUrl}')`;
                    bgLayer.style.opacity = 1; 
                }
                
                textWrap.style.opacity = 1;
            }, 150);

            const leftArrow = document.getElementById('ob-nav-left');
            const rightArrow = document.getElementById('ob-nav-right');
            
            leftArrow.style.opacity = (idx === 0) ? '0' : '1';
            leftArrow.style.pointerEvents = (idx === 0) ? 'none' : 'auto';
            
            rightArrow.style.opacity = (idx === obScenes.length - 1) ? '0' : '1';
            rightArrow.style.pointerEvents = (idx === obScenes.length - 1) ? 'none' : 'auto';

            playHardcoreAudio(idx);

            const btn = document.getElementById('bootBtn');
            if (idx === obScenes.length - 1) {
                setTimeout(() => {
                    btn.style.opacity = 1; 
                    btn.style.pointerEvents = 'auto';
                }, 1500);
            } else {
                btn.style.opacity = 0; 
                btn.style.pointerEvents = 'none';
            }

            if (idx < obScenes.length - 1) {
                sceneTimeout = setTimeout(() => {
                    renderScene(idx + 1);
                }, 7900);
            }
        }

        function nextSceneManual(e) {
            if(e) e.stopPropagation();
            if (obSceneIndex < obScenes.length - 1) {
                renderScene(obSceneIndex + 1);
            }
        }

        function prevSceneManual(e) {
            if(e) e.stopPropagation();
            if (obSceneIndex > 0) {
                renderScene(obSceneIndex - 1);
            }
        }

        function launchCore() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(5000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 1;
            
            setTimeout(() => { document.body.style.backgroundColor = '#000'; flash.style.opacity = 0; }, 150);
            setTimeout(() => { window.location.href = 'core.html'; }, 500); 
        }
    </script>
</body>
</html>
