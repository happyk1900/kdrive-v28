<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive Intro - Định Danh Phó Sư</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; transition: background-color 0.3s ease; }

        #onboarding-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: transparent; z-index: 10; padding: 20px; transition: opacity 0.5s ease-out; }
        
        #onboarding-ui::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 2;
        }

        /* 🌟 CSS CỔNG LOADING 🌟 */
        #loading-gate {
            position: absolute; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease-in-out;
            animation: screenPulseHazard 2s infinite ease-in-out;
            overflow: hidden;
        }
        @keyframes screenPulseHazard {
            0%, 100% { box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.15); }
            50% { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.4); }
        }
        .hazard-corner-icon {
            position: absolute; top: 25px; left: 25px;
            font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.4); padding: 5px 10px; border-radius: 4px;
            background: rgba(40, 30, 0, 0.6); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            display: flex; align-items: center; gap: 6px;
            animation: iconBlink 1s infinite alternate;
        }
        .hazard-corner-icon::before { content: '⚠️'; font-size: 12px; }
        @keyframes iconBlink { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 🌟 HIỆU ỨNG ẢNH NỀN FADE-IN ĐIỆN ẢNH TỪ BÓNG TỐI 🌟 */
        .ob-bg-layer {
            position: absolute; inset: 0;
            background-size: cover; background-position: center center;
            opacity: 0; 
            filter: blur(10px) scale(1.05);
            transform: translateZ(0);
            transition: opacity 1.6s cubic-bezier(0.25, 1, 0.5, 1), filter 1.6s cubic-bezier(0.25, 1, 0.5, 1), transform 1.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1; 
        }
        .ob-bg-layer.active {
            opacity: 1;
            filter: blur(0px) scale(1);
        }

        #ob-bg-0 {
            position: absolute; inset: 0;
            background-size: cover; background-position: center center;
            background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/INTRO%20canh%200.png?raw=true');
            opacity: 0; 
            filter: blur(15px) scale(1.05);
            transition: opacity 3.5s cubic-bezier(0.25, 1, 0.5, 1), filter 3.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }
        #ob-bg-0.reveal-cinematic {
            opacity: 1;
            filter: blur(0px) scale(1);
        }
        #ob-bg-0.fade-out {
            opacity: 0;
            filter: blur(10px) scale(1.05);
        }

        #ob-bg-video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 2; opacity: 0; transition: opacity 1.6s ease-in-out;
            pointer-events: none;
        }

        #particle-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 4; pointer-events: none;
        }

        /* 🌟 GIAO DIỆN CONTAINER VÀ HOLOGRAM HIỆN LÊN CHẬM RÃI MƯỢT MÀ 🌟 */
        .ob-container { 
            display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; width: 100%; z-index: 10;
            background: radial-gradient(circle, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            padding: 12px 0;
            border-radius: 20px;
            opacity: 0; 
            transform: translateY(20px);
            transition: opacity 2.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ob-container.cinematic-show {
            opacity: 1;
            transform: translateY(0);
        }

        #ob-boo-wrapper { opacity: 0; z-index: 5; transition: opacity 0.4s ease-in-out; }
        .ob-boo-grand-entry { animation: grandAppear 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes grandAppear {
            0% { transform: scale(0.85) translateY(30px); opacity: 0; filter: blur(15px); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0px); }
        }
        
        .nav-btn-wrapper { 
            display: flex; flex-direction: column; align-items: center; position: relative; z-index: 100; cursor: pointer; pointer-events: auto; 
            transition: opacity 1.5s ease-in-out, transform 0.2s, text-shadow 0.2s;
        }
        .nav-arrow { color: #00e5ff; font-size: 32px; padding: 5px 15px; text-shadow: 0 0 12px #00e5ff, 2px 2px 4px #000; transition: transform 0.2s, text-shadow 0.2s; user-select: none; font-family: monospace; font-weight: bold; }
        .nav-btn-wrapper:active .nav-arrow { transform: scale(0.8); text-shadow: 0 0 20px #fff; }
        .nav-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #00ffff; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 8px #00ffff, 1px 1px 3px #000; margin-top: -2px; opacity: 0.95; font-weight: bold; }
        
        .ob-boo-wrapper { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; margin-top: 10px;}
        .ob-boo { position: relative !important; top: 0 !important; right: 0 !important; pointer-events: none; margin: 0 !important;}
        
        .boo-hologram { display: flex; justify-content: center; align-items: center; width: 55px; height: 55px; transform-style: preserve-3d; }
        .boo-part { opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }

        .boo-quadrant { position: absolute; width: 45px; height: 45px; border: 3px solid transparent; box-sizing: border-box; z-index: 1; transform: scale(1.5); }
        .bq-dia { top: -10px; left: -10px; border-top-color: #ffd700; border-left-color: #ffd700; border-radius: 40px 0 0 0; filter: drop-shadow(0 0 4px #ffd700); }
        .bq-thuy { top: -10px; right: -10px; border-top-color: #0088ff; border-right-color: #0088ff; border-radius: 0 40px 0 0; filter: drop-shadow(0 0 4px #0088ff); }
        .bq-hoa { bottom: -10px; left: -10px; border-bottom-color: #ff3300; border-left-color: #ff3300; border-radius: 0 0 0 40px; filter: drop-shadow(0 0 4px #ff3300); }
        .bq-phong { bottom: -10px; right: -10px; border-bottom-color: #00ffff; border-right-color: #00ffff; border-radius: 0 0 40px 0; filter: drop-shadow(0 0 40px #00ffff); }
        
        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff 100%, transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 4px; z-index: 3; box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; transform: scale(0.8); }
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8); z-index: 2; }
        
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 20px; background: #000; border-radius: 50%; transition: all 0.3s; animation: booBlink 3.5s infinite; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }
        @keyframes booBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        
        .ob-sound-waves { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid #00e5ff; opacity: 0; pointer-events: none; }

        .ob-scene-1 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-2 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-2 .boo-energy-border { opacity: 1; transform: scale(1); animation: obFlashEnergy 0.5s infinite !important; filter: hue-rotate(150deg); }
        .ob-scene-3 .boo-face { opacity: 1; transform: scale(1); }
        .ob-scene-3 .boo-energy-border { opacity: 1; transform: scale(1); box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; animation: none !important; filter: none;}
        .ob-scene-3 .boo-quadrant { opacity: 1; transform: scale(1); animation: obFlash 0.3s infinite !important; border-width: 4px !important; }
        .ob-scene-4 .boo-face { opacity: 1; transform: scale(1); box-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff !important; }
        .ob-scene-4 .boo-energy-border { opacity: 1; transform: scale(1); }
        .ob-scene-4 .boo-quadrant { opacity: 1; transform: scale(1); }
        .ob-scene-4 .ob-sound-waves { animation: obWaves 1.5s infinite ease-out !important; }

        @keyframes obFlash { 0%, 50% { filter: drop-shadow(0 0 12px #ff0000); border-color: #ff0000; } 51%, 100% { filter: none; opacity: 0.5; } }
        @keyframes obFlashEnergy { 0%, 50% { box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff0000 !important; } 51%, 100% { box-shadow: none; opacity: 0.3;} }
        @keyframes obWaves { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .ob-laser-line { width: 1px; height: 30px; background: linear-gradient(to bottom, #00e5ff, transparent); margin-bottom: 10px; box-shadow: 0 0 8px #00e5ff; opacity: 0; transition: opacity 1s; animation: laserPulse 1.5s infinite alternate; z-index: 5;}
        @keyframes laserPulse { 0% { height: 20px; opacity: 0.5;} 100% { height: 35px; opacity: 1;} }

        /* Hộp Text hiển thị tiêu đề màu vàng nghệ sang trọng */
        .ob-text-box { width: 100%; max-width: 410px; padding: 15px 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; opacity: 0; transition: opacity 1s ease-in-out; z-index: 5;}
        
        .ob-title { 
            color: #ffd700; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; 
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 0 0 25px #000, 2px 2px 6px #000, -2px -2px 6px #000; 
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            margin-bottom: 15px; text-align: center; text-transform: uppercase;
        }
        
        .ob-desc { 
            color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 500; line-height: 1.7; text-align: center; width: 100%; 
            min-height: 90px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8); 
            background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 10px; border: 1px solid rgba(0, 229, 255, 0.4);
            white-space: pre-wrap; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .grid-layout-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            text-align: center;
        }
        .grid-item {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            color: #ffd700;
            letter-spacing: 1px;
        }
        
        .cursor { display: inline-block; background-color: #00e5ff; width: 8px; height: 16px; animation: blinkCursor 0.8s infinite; vertical-align: middle; margin-left: 3px; }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .ob-dots { display: flex; gap: 10px; margin-top: 10px; opacity: 0; transition: opacity 1s; z-index: 5;}
        .ob-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,229,255,0.2); transition: 0.3s; }
        .ob-dot.active { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; transform: scale(1.5); }

        .start-btn { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid rgba(0, 229, 255, 0.6); color: #fff; padding: 14px 25px; font-size: 14px; font-weight: bold; letter-spacing: 3px; cursor: pointer; z-index: 100; font-family: 'Space Grotesk', sans-serif; white-space: nowrap; transition: 0.5s; text-shadow: 0 0 10px rgba(0,229,255,0.8); overflow: hidden; text-transform: uppercase; opacity: 0; pointer-events: none; border-radius: 4px; box-shadow: 0 0 20px rgba(0,229,255,0.4); }
        .start-btn::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-25deg); animation: sweepLight 3s infinite; }
        .start-btn:hover { color: #00e5ff; border-color: #00e5ff; text-shadow: 0 0 20px #00e5ff; box-shadow: 0 0 25px #00e5ff; }
        @keyframes sweepLight { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

        #flash-overlay { position: fixed; inset: 0; background-color: #00e5ff; opacity: 0; z-index: 99999; pointer-events: none; transition: opacity 0.1s ease-out; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    
    <!-- 🌟 CỔNG LOADING 🌟 -->
    <div id="loading-gate">
        <div style="position: absolute; inset: 0; opacity: 0.12; pointer-events: none; background-image: url('data:image/svg+xml,%3Csvg width=\'28\' height=\'49\' viewBox=\'0 0 28 49\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg stroke=\'%23ff0000\' stroke-width=\'1\' fill=\'none\' fill-rule=\'evenodd\'%3E%3Cpath d=\'M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z\'/%3E%3C/g%3E%3C/svg%3E');"></div>
        
        <div class="hazard-corner-icon">SYSTEM WARNING: HAZARD ACTIVE</div>
        
        <div class="load-box" style="width: 85%; max-width: 360px; border: 1px solid rgba(255, 0, 0, 0.6); background: rgba(15, 0, 0, 0.85); padding: 25px 20px; border-radius: 8px; box-shadow: 0 0 25px rgba(255, 0, 0, 0.3), inset 0 0 15px rgba(255, 0, 0, 0.2); text-align: center; position: relative; z-index: 2;">
            <div style="font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; color: #ff3333; letter-spacing: 2px; margin-bottom: 15px; text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);">SYSTEM HAZARD: K-DRIVE CORE</div>

    <audio id="bg-music" src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai-Ripe.mp3" loop preload="auto"></audio>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let hasBooted = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.isRain = Math.random() > 0.4;
                this.size = this.isRain ? Math.random() * 1.5 + 0.8 : Math.random() * 2.5 + 1;
                this.speedX = this.isRain ? -0.8 : (Math.random() - 0.5) * 0.5;
                this.speedY = this.isRain ? Math.random() * 6 + 4 : (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.6 + 0.2;
                
                if (!hasBooted) {
                    this.color = Math.random() > 0.5 ? '#e0f7fa' : '#80deea'; 
                } else {
                    this.color = Math.random() > 0.5 ? '#00e5ff' : '#ff1493'; 
                }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y > canvas.height || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                    this.y = 0;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                if (this.isRain) {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - 2, this.y + 12);
                    ctx.stroke();
                } else {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 🌟 KỊCH BẢN ĐÃ GẮN KẾT KHỐI "Phó sư Boo" CHỐNG RỚT DÒNG VÔ DUYÊN 🌟
        const obScenes = [

                        { text: "Hướng dẫn thực thể rèn luyện và sinh\u00A0tồn trong không gian.", color: "#ffffff", bold: true } 
                    ]
                ],
                visualClass: "ob-scene-1" 
            },
            { 
                title: "LÕI SINH MỆNH", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh2.png?raw=true",
                isVideo: false,
                lines: [
                    [ 
                        { text: "Năng lượng sinh\u00A0tồn", color: "#ff3333", bold: true }, 
                        { text: " cốt lõi của\u00A0Phó\u00A0sư\u00A0Boo.", color: "#ffffff" } 
                    ],
                    [ 
                        { text: "Cạn năng lượng là sập nguồn, ", color: "#ffffff" }, 
                        { text: "tiếp\u00A0tế trà\u00A0sữa", color: "#ffd700", bold: true }, 
                        { text: " để duy trì hoạt động.", color: "#ffffff" } 
                    ]
                ],
                visualClass: "ob-scene-2" 
            },
            { 
                title: "BỘ GIÁP SINH TỒN", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh3.png?raw=true",
                isVideo: false,
                lines: [
                    [ { text: "4 mảnh ghép kỹ năng bảo vệ thực thể.", color: "#ffffff" } ],
                    [ 
                        { text: "Nhiệm vụ duy trì bộ giáp: ", color: "#ff3333", bold: true }, 
                        { text: "Thiếu một mảnh là lỗi, thiếu cả bốn là tiêu hủy.", color: "#ffffff" } 
                    ]
                ],
                visualClass: "ob-scene-3" 
            },
            { 
                title: "GIAO THỨC TƯƠNG TÁC", 
                bgUrl: "https://github.com/happyk1900/-m-thanh-app/blob/main/Boo%20canh4.png?raw=true",
                isVideo: false,
                isGrid: true,
                lines: [
                    { text: "Kích hoạt hệ thống điều khiển Phó\u00A0sư.", color: "#ffffff", isHeader: true },
                    { text: "1 chạm: Nghe lệnh", color: "#ffd700" },
                    { text: "2 chạm: Trò chuyện", color: "#ffd700" },
                    { text: "3 chạm: Tắt tiếng", color: "#ffd700" },
                    { text: "Nhấn giữ: Đánh thức", color: "#ff4d4d" }
                ],
                visualClass: "ob-scene-4" 
            },
            { 
                title: "HIỆU LỆNH XUNG TRẬN", 
                isVideo: true,
                lines: [
                    [ 
                        { text: "K\u2011Drive", color: "#ff3333", bold: true }, 
                        { text: " huấn luyện chiến đấu để giành chiến thắng. Phá vỡ mọi giới hạn, làm chủ bản thân và định đoạt vận mệnh của chính mình.", color: "#ffffff" } 
                    ],
                    [ 
                        { text: "— Cảm tác từ ", color: "#ffffff" }, 
                        { text: "Ngũ\u00A0Luân\u00A0Thư", color: "#ff3333", bold: true }, 
                        { text: " —", color: "#ffffff" } 
                    ],
                    [ { text: "Miyamoto Musashi", color: "#ffd700", bold: true } ]
                ],
                visualClass: "ob-scene-5" 
            }
        ];

        window.addEventListener('load', () => {
            const allImages = [
                "https://github.com/happyk1900/-m-thanh-app/blob/main/INTRO%20canh%200.png?raw=true",
                ...obScenes.map(s => s.bgUrl).filter(Boolean)
            ];
            allImages.forEach(url => {
                const img = new Image();
                img.src = url;
            });
        });

        let obSceneIndex = 0;
        let sceneTimeout = null;
        let typingInterval = null;
        let activeBgLayer = 1;

        let audioCtx = null;
        let currentOscillators = [];

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        function stopAllAudio() {
            currentOscillators.forEach(node => {
                try { node.stop(); node.disconnect(); } catch (e) {}
            });
            currentOscillators = [];
        }

        function playKeyClickSound() {
            if (!audioCtx) return;
            try {
                let t = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200 + Math.random() * 400, t);
                osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.03);
            } catch(e) {}
        }

        function playHardcoreAudio(sceneIndex) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAllAudio(); 

            const t = audioCtx.currentTime;
            
            if (sceneIndex === 0) {
                let osc = audioCtx.createOscillator(); 
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 1.8); 
                gain.gain.setValueAtTime(0.9, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 2.2);
                currentOscillators.push(osc);
            } 
            else if (sceneIndex === 1) {
                for(let i=0; i<4; i++) {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.5, t + (i * 0.35)); 
                    gain.gain.setValueAtTime(0, t + (i * 0.35));
                    gain.gain.linearRampToValueAtTime(0.4, t + (i * 0.35) + 0.03);
                    gain.gain.linearRampToValueAtTime(0, t + (i * 0.35) + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t + (i * 0.35)); osc.stop(t + (i * 0.35) + 0.18);
                    currentOscillators.push(osc);
                }
            }
            else if (sceneIndex === 2) {
                for(let i=0; i<4; i++) {
                    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800 - (i*60), t + (i*0.3));
                    gain.gain.setValueAtTime(0, t + (i*0.3));
                    gain.gain.linearRampToValueAtTime(0.3, t + (i*0.3) + 0.05);
                    gain.gain.linearRampToValueAtTime(0, t + (i*0.3) + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t + (i*0.3)); osc.stop(t + (i*0.3) + 0.2);
                    currentOscillators.push(osc);
                }
            }
            else if (sceneIndex === 3) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1500, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 1.0);
                gain.gain.setValueAtTime(0.5, t); 
                gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 1.2);
                currentOscillators.push(osc);
            }
        }

        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.8;

        window.addEventListener('load', () => {
            let currentProgress = 0;
            const fillElem = document.getElementById('loadBarFill');
            const statusElem = document.getElementById('loadStatusText');
            const gateElem = document.getElementById('loading-gate');

            let timer = setInterval(() => {
                let increment = Math.random() * 1.5 + 0.5; 
                if (currentProgress > 30 && currentProgress < 45) increment = 0.4; 
                if (currentProgress > 65 && currentProgress < 75) increment = 0.5; 

                currentProgress += increment;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(timer);
                    
                    fillElem.style.width = '100%';
                    fillElem.style.backgroundColor = '#00e5ff';
                    statusElem.style.color = '#00e5ff';
                    statusElem.textContent = 'KẾT NỐI THÀNH CÔNG! 100%';

                    setTimeout(() => {
                        gateElem.style.opacity = 0;
                        setTimeout(() => { 
                            gateElem.remove(); 
                            
                            document.getElementById('ob-bg-0').classList.add('reveal-cinematic');
                            
                            document.body.addEventListener('click', bootSequence, { once: true });
                            
                            setTimeout(() => {
                                if(!hasBooted) {
                                    document.getElementById('ob-title').innerHTML = "Đã số hóa thực thể";
                                    const descElem = document.getElementById('ob-desc');
                                    descElem.innerHTML = "<div style='color:#ffffff; font-size:15px; font-weight:600; letter-spacing:1px; text-shadow: 0 0 15px rgba(255,255,255,0.8);'>Chạm để kết nối <span style='color:#ff3333;'>Phó&nbsp;sư</span></div>";
                                    document.getElementById('ob-text-wrapper').style.opacity = 1;
                                }
                            }, 500);

                        }, 1000); 
                    }, 600); 
                    return;
                }

                let pInt = Math.floor(currentProgress);
                fillElem.style.width = currentProgress + '%';

                if (pInt < 35) {
                    fillElem.style.backgroundColor = '#ff0000';
                    statusElem.textContent = `KHỞI TẠO GIAO THỨC... ${pInt}%`;
                } else if (pInt < 75) {
                    fillElem.style.backgroundColor = '#ffd700';
                    statusElem.textContent = `ĐỒNG BỘ SINH HỌC... ${pInt}%`;
                } else {
                    fillElem.style.backgroundColor = '#00e5ff';
                    statusElem.textContent = `LIÊN KẾT THẦN KINH... ${pInt}%`;
                }
            }, 70); 
        });

        function bootSequence() {
            hasBooted = true;
            triggerVibration(50);
            
            bgMusic.play().catch(e => console.log("Audio play blocked:", e));

            particles.forEach(p => { p.color = Math.random() > 0.5 ? '#00e5ff' : '#ff1493'; });

            document.getElementById('ob-container-wrapper').classList.add('cinematic-show');
            document.getElementById('ob-boo-wrapper').classList.add('ob-boo-grand-entry');
            
            document.getElementById('ob-laser-line').style.opacity = 1;
            document.getElementById('ob-dots').style.opacity = 1;
            
            renderScene(0);
        }

        // 🌟 THUẬT TOÁN GÕ TỪNG KÝ TỰ (TYPEWRITER) CHUẨN XÁC GIỮ NGUYÊN MÀU 🌟
        function typeWriterSafe(scene, element, speed = 40, callback) {
            clearInterval(typingInterval);
            element.innerHTML = "";
            
            // Xử lý dạng Grid riêng biệt
            if (scene.isGrid) {
                let headerNode = scene.lines.find(n => n.isHeader);
                let gridNodes = scene.lines.filter(n => !n.isHeader);

                let headerDiv = document.createElement('div');
                headerDiv.style.color = headerNode ? headerNode.color : '#ffffff';
                headerDiv.style.marginBottom = '12px';
                headerDiv.style.fontWeight = 'bold';
                headerDiv.style.letterSpacing = '1px';
                headerDiv.textContent = headerNode ? headerNode.text : '';
                element.appendChild(headerDiv);

                let gridContainer = document.createElement('div');
                gridContainer.className = 'grid-layout-2x2';
                
                gridNodes.forEach(node => {
                    let item = document.createElement('div');
                    item.className = 'grid-item';
                    item.style.color = node.color || '#ffd700';
                    item.textContent = node.text;
                    gridContainer.appendChild(item);
                });
                element.appendChild(gridContainer);
                playKeyClickSound();
                if (callback) callback();
                return;
            }

            let lines = scene.lines;
            let currentLineIdx = 0;
            let currentSegmentIdx = 0;
            let currentCharIdx = 0;
            
            let activeDiv = null;
            let activeSpan = null;

            typingInterval = setInterval(() => {
                if (currentLineIdx < lines.length) {
                    if (!activeDiv) {
                        activeDiv = document.createElement('div');
                        activeDiv.style.textAlign = 'center';
                        activeDiv.style.width = '100%';
                        activeDiv.style.marginTop = '8px';
                        
                        if (scene.visualClass === 'ob-scene-5' && currentLineIdx > 0) {
                            activeDiv.style.fontSize = '12.5px'; 
                        }
                        
                        element.appendChild(activeDiv);
                        
                        let cursor = document.createElement('span');
                        cursor.className = 'cursor';
                        activeDiv.appendChild(cursor);
                    }

                    let lineSegments = lines[currentLineIdx];
                    
                    if (currentSegmentIdx < lineSegments.length) {
                        let segment = lineSegments[currentSegmentIdx];
                        let text = segment.text;

                        if (!activeSpan) {
                            activeSpan = document.createElement('span');
                            activeSpan.style.color = segment.color || '#ffffff';
                            if (segment.bold) {
                                activeSpan.style.fontWeight = 'bold';
                            }
                            let cursor = activeDiv.querySelector('.cursor');
                            activeDiv.insertBefore(activeSpan, cursor);
                        }

                        if (currentCharIdx < text.length) {
                            activeSpan.textContent += text.charAt(currentCharIdx);
                            playKeyClickSound();
                            currentCharIdx++;
                        } else {
                            currentSegmentIdx++;
                            currentCharIdx = 0;
                            activeSpan = null;
                        }
                    } else {
                        let cursor = activeDiv.querySelector('.cursor');
                        if(cursor) cursor.remove();
                        currentLineIdx++;
                        currentSegmentIdx = 0;
                        currentCharIdx = 0;
                        activeDiv = null;
                    }
                } else {
                    clearInterval(typingInterval);
                    if (callback) callback();
                }
            }, speed);
        }

        function renderScene(idx) {
            clearTimeout(sceneTimeout); 
            clearInterval(typingInterval);
            obSceneIndex = idx;
            const scene = obScenes[idx];
            
            triggerVibration(30); 
            document.querySelectorAll('.ob-dot').forEach((dot, i) => { dot.classList.toggle('active', i === idx); });
            
            const booWrapper = document.getElementById('ob-boo-wrapper');
            const containerWrapper = document.getElementById('ob-container-wrapper');

            if (scene.isVideo) {
                booWrapper.style.opacity = '0';
                booWrapper.style.visibility = 'hidden';
                booWrapper.style.display = 'none';
                containerWrapper.style.gap = '0px';
            } else {
                booWrapper.style.display = 'flex';
                booWrapper.style.visibility = 'visible';
                booWrapper.style.opacity = '1';
                containerWrapper.style.gap = '20px';
                document.getElementById('ob-boo').className = 'boo-hologram ob-boo ' + scene.visualClass;
            }
            
            const textWrap = document.getElementById('ob-text-wrapper');
            const bg0 = document.getElementById('ob-bg-0');
            const bg1 = document.getElementById('ob-bg-1');
            const bg2 = document.getElementById('ob-bg-2');
            const bgVideo = document.getElementById('ob-bg-video');
            
            textWrap.style.opacity = 0;

            setTimeout(() => {
                document.getElementById('ob-title').innerHTML = scene.title;
                
                const descElem = document.getElementById('ob-desc');
                typeWriterSafe(scene, descElem, 40);
                
                if (bg0) {
                    bg0.classList.add('fade-out');
                }

                if (scene.isVideo) {
                    bg1.classList.remove('active');
                    bg2.classList.remove('active');
                    bgVideo.style.opacity = 1;
                    bgVideo.play().catch(e => {});
                } else {
                    bgVideo.pause();
                    bgVideo.style.opacity = 0;

                    if (activeBgLayer === 1) {
                        bg2.style.backgroundImage = `url('${scene.bgUrl}')`;
                        bg2.classList.add('active');
                        bg1.classList.remove('active');
                        activeBgLayer = 2;
                    } else {
                        bg1.style.backgroundImage = `url('${scene.bgUrl}')`;
                        bg1.classList.add('active');
                        bg2.classList.remove('active');
                        activeBgLayer = 1;
                    }
                }
                
                textWrap.style.opacity = 1;
            }, 150);

            const leftArrow = document.getElementById('ob-nav-left');
            const rightArrow = document.getElementById('ob-nav-right');
            
            leftArrow.style.opacity = (idx === 0) ? '0' : '1';
            leftArrow.style.pointerEvents = (idx === 0) ? 'none' : 'auto';
            
            rightArrow.style.opacity = (idx === obScenes.length - 1) ? '0' : '1';
            rightArrow.style.pointerEvents = (idx === obScenes.length - 1) ? 'none' : 'auto';

            playHardcoreAudio(idx);

            const btn = document.getElementById('bootBtn');
            if (idx === obScenes.length - 1) {
                setTimeout(() => {
                    btn.style.opacity = 1; 
                    btn.style.pointerEvents = 'auto';
                    triggerVibration([50, 50, 100]); 
                }, 1500);
            } else {
                btn.style.opacity = 0; 
                btn.style.pointerEvents = 'none';
            }

            if (idx < obScenes.length - 1) {
                sceneTimeout = setTimeout(() => {
                    renderScene(idx + 1);
                }, 7900);
            }
        }

        function nextSceneManual(e) {
            if(e) e.stopPropagation();
            if (obSceneIndex < obScenes.length - 1) {
                renderScene(obSceneIndex + 1);
            }
        }

        function prevSceneManual(e) {
            if(e) e.stopPropagation();
            if (obSceneIndex > 0) {
                renderScene(obSceneIndex - 1);
            }
        }

        function launchCore() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(5000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            triggerVibration([100, 50, 200]); 

            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 1;
            
            setTimeout(() => { document.body.style.backgroundColor = '#000'; flash.style.opacity = 0; }, 150);
            
            setTimeout(() => { window.location.href = 'core.html'; }, 500); 
        }
 </script>
