<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive Core V54 - Khống Chế Dạ Hành</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* MÀN ĐEN CHE PHỦ & ONBOARDING UI */
        #black-veil { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease-out; }
        #onboarding-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 10001; padding: 20px; transition: opacity 0.5s ease-out; }
        
        /* HIỆU ỨNG BOO XUẤT HIỆN TỪ HƯ VÔ CỰC KỲ HOÀNH TRÁNG */
        #ob-boo-wrapper { opacity: 0; }
        .ob-boo-grand-entry { animation: grandAppear 2.5s cubic-bezier(0.1, 1, 0.2, 1) forwards; }
        @keyframes grandAppear {
            0% { transform: scale(0) translateY(150px) rotate(15deg); opacity: 0; filter: blur(30px) brightness(3); }
            30% { transform: scale(2.2) translateY(-20px) rotate(-5deg); opacity: 1; filter: blur(5px) brightness(2); }
            60% { transform: scale(1.5) translateY(10px) rotate(2deg); opacity: 1; filter: blur(0px) brightness(1.2); }
            100% { transform: scale(1.6) translateY(0) rotate(0deg); opacity: 1; filter: blur(0px) brightness(1); }
        }

        .ob-container { display: flex; align-items: center; justify-content: center; gap: 40px; margin-bottom: 25px; width: 100%;}
        .nav-arrow { color: #00e5ff; font-size: 24px; cursor: pointer; padding: 10px 15px; text-shadow: 0 0 10px #00e5ff; transition: transform 0.2s, text-shadow 0.2s; user-select: none; font-family: monospace; font-weight: bold;}
        .nav-arrow:active { transform: scale(0.8); text-shadow: 0 0 20px #fff; }
        
        .ob-boo-wrapper { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; margin-top: 10px;}
        .ob-boo { position: relative !important; top: 0 !important; right: 0 !important; pointer-events: none; animation: none !important; margin: 0 !important;}
        
        /* ĐỒNG BỘ MẮT BOO THỨC & CHỚP KHẮP MỌI NƠI */
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 20px; background: #000; border-radius: 50%; transition: all 0.3s; animation: booBlink 3.5s infinite; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }
        @keyframes booBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        
        /* Cảnh 2: Tứ Luân nhấp nháy */
        .ob-scene-2 .boo-quadrant { animation: obFlash 0.75s infinite !important; border-width: 4px !important; }
        .ob-scene-2 .boo-face, .ob-scene-2 .boo-energy-border { opacity: 0.3; }

        /* Cảnh 3: Vòng sinh mạng cảnh báo */
        .ob-scene-3 .boo-energy-border { animation: obFlashEnergy 0.75s infinite !important; filter: hue-rotate(150deg); }
        .ob-scene-3 .boo-quadrant { opacity: 0.2; }

        @keyframes obFlash { 0%, 50% { opacity: 1; filter: drop-shadow(0 0 12px #00e5ff); } 51%, 100% { opacity: 0.1; filter: none; } }
        @keyframes obFlashEnergy { 0%, 50% { opacity: 1; box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff0000 !important; } 51%, 100% { opacity: 0.3; box-shadow: none; } }

        /* Cảnh 4: Giao thức sóng âm */
        .ob-scene-4 .boo-face { box-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff !important; }
        .ob-sound-waves { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid #00e5ff; opacity: 0; }
        .ob-scene-4 .ob-sound-waves { animation: obWaves 1.5s infinite ease-out !important; }
        @keyframes obWaves { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        /* Tia Laser & Bảng Text (KHÔNG HỘP) */
        .ob-laser-line { width: 1px; height: 30px; background: linear-gradient(to bottom, #00e5ff, transparent); margin-bottom: 10px; box-shadow: 0 0 8px #00e5ff; opacity: 0; transition: opacity 1s; animation: laserPulse 1.5s infinite alternate;}
        @keyframes laserPulse { 0% { height: 20px; opacity: 0.5;} 100% { height: 35px; opacity: 1;} }

        .ob-text-box { width: 100%; max-width: 350px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; opacity: 0; transition: opacity 1s;}
        .ob-title { color: #ffaa00; font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 12px rgba(255,170,0,0.8); margin-bottom: 15px; text-align: center; text-transform: uppercase;}
        .ob-desc { color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; font-size: 11px; line-height: 1.8; text-align: center; width: 100%; white-space: pre-wrap; min-height: 80px; text-shadow: 0 0 5px rgba(255,255,255,0.3);}

        .ob-dots { display: flex; gap: 10px; margin-top: 10px; opacity: 0; transition: opacity 1s;}
        .ob-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,229,255,0.2); transition: 0.3s; }
        .ob-dot.active { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; transform: scale(1.5); }

        /* NÚT KÍCH HOẠT DƯỚI ĐÁY */
        .start-btn { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.7); color: rgba(255, 255, 255, 0.9); padding: 12px 20px; font-size: 13px; font-weight: 500; letter-spacing: 3px; cursor: pointer; z-index: 10000; font-family: 'Space Grotesk', sans-serif; white-space: nowrap; transition: 0.5s; text-shadow: 0 0 8px rgba(255,255,255,0.6); overflow: hidden; text-transform: uppercase; opacity: 0; pointer-events: none; }
        .start-btn::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-25deg); animation: sweepLight 3s infinite; }
        .start-btn:hover { color: #fff; border-bottom-color: #ffffff; text-shadow: 0 0 15px #ffffff; }
        @keyframes sweepLight { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

        /* CORE UI CHÍNH */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; opacity: 0; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/INDEX%20SAMURAI.png?raw=true'); background-size: cover; background-position: center center; background-repeat: no-repeat; transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 2s ease-in, filter 2s; transform-origin: center 45%; }
        .inspect-mode #sanctum-bg { transform: scale(2.3); filter: brightness(0.6) contrast(1.2); }
        .cyber-floor { position: fixed; bottom: -20%; left: -50%; width: 200%; height: 60vh; background: repeating-linear-gradient(to top, transparent, transparent 30px, rgba(0, 229, 255, 0.1) 31px, transparent 32px), repeating-linear-gradient(to right, transparent, transparent 30px, rgba(0, 229, 255, 0.1) 31px, transparent 32px); transform: perspective(600px) rotateX(75deg); transform-origin: center bottom; animation: gridFlow 1.5s linear infinite; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 1s ease; mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%); }
        @keyframes gridFlow { 0% { background-position: 0 0; } 100% { background-position: 0 31px; } }
        .inspect-mode .cyber-floor { opacity: 0 !important; }

        #armor-inspect-zone { position: absolute; width: 180px; height: 100px; left: 50%; top: 12%; transform: translateX(-50%); z-index: 50; cursor: pointer; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .inspect-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; animation: pulseBtn 2.5s infinite alternate; text-shadow: 0 0 8px rgba(255,255,255,0.8); pointer-events: none; border: none; }
        @keyframes pulseBtn { 0% { opacity: 0.4; } 100% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1); } }
        .inspect-mode .inspect-btn { opacity: 0 !important; }

        .ui-element { transition: opacity 1s ease, transform 1.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .inspect-mode .ui-element { opacity: 0 !important; pointer-events: none !important; }
        .inspect-mode #core-wrapper { transform: scale(0.2) translateY(300px); }
        .inspect-mode #boo-module-container { transform: translateX(100px); }
        .inspect-mode #top-hud { transform: translateY(-50px); }
        .inspect-mode #terminal-hud { transform: translateX(-50%) translateY(50px); }
        .inspect-mode #live-clock { opacity: 0 !important; }

        #core-wrapper { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; z-index: 10; transform: scale(0.1) translateY(500px) rotateX(-45deg) rotateY(45deg); pointer-events: none; }
        #core-glow-floor { position: absolute; width: 180px; height: 40px; background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.4) 0%, rgba(0, 229, 255, 0) 70%); border-radius: 50%; bottom: calc(50% - 130px); filter: blur(8px); animation: shadowPulse 5s ease-in-out infinite; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 1.5s ease; }
        .holy-core-container { position: relative; width: 140px; height: 140px; perspective: 1000px; animation: coreFloat 5s ease-in-out infinite; z-index: 2; pointer-events: auto; }
        @keyframes coreFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @keyframes shadowPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(0.8); opacity: 0.2; } }
        .holy-cube { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; cursor: grab; will-change: transform; }
        .holy-cube:active { cursor: grabbing; }

        .inner-sphere { position: absolute; width: 66px; height: 66px; left: 50%; top: 50%; transform: translate(-50%, -50%) translateZ(0); border-radius: 50%; pointer-events: none; filter: blur(3px); animation: auraBreathe 16s infinite alternate ease-in-out, pulseBlood 1.5s infinite alternate ease-in-out; }
        @keyframes auraBreathe { 0% { background: radial-gradient(circle at center, #ffffff 15%, #00e5ff 50%, transparent 100%); box-shadow: 0 0 60px #00e5ff; } 33% { background: radial-gradient(circle at center, #ffffff 15%, #b026ff 50%, transparent 100%); box-shadow: 0 0 60px #b026ff; } 66% { background: radial-gradient(circle at center, #ffffff 15%, #ffeb3b 50%, transparent 100%); box-shadow: 0 0 60px #ffeb3b; } 100% { background: radial-gradient(circle at center, #ffffff 15%, #ff2a2a 50%, transparent 100%); box-shadow: 0 0 60px #ff2a2a; } }
        @keyframes pulseBlood { from { transform: translate(-50%, -50%) translateZ(0) scale(0.85); } to { transform: translate(-50%, -50%) translateZ(0) scale(1.15); } }
        
        .cube-face { position: absolute; width: 140px; height: 140px; border: 2px solid rgba(0, 229, 255, 0.8); background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); backface-visibility: hidden; box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.3), 0 0 15px rgba(0, 229, 255, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background 0.3s, box-shadow 0.3s, border-color 0.3s; user-select: none; }
        .cube-face:active { background: rgba(255, 255, 255, 0.15); }
        .sci-label { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 90%; text-align: center; color: #d1d1d1; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); border-radius: 4px; padding: 4px 8px; pointer-events: none; white-space: nowrap; animation: silverBreathe 3s infinite alternate ease-in-out; }
        @keyframes silverBreathe { 0% { opacity: 0.6; text-shadow: 0 0 5px rgba(209, 209, 209, 0.3); } 100% { opacity: 1; text-shadow: 0 0 8px #fff, 0 0 15px rgba(255, 255, 255, 0.7); } }
        .kanji-ghost { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: "Yu Mincho", serif; font-size: 55px; line-height: 1; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9); pointer-events: none; margin: 0; padding: 0; }

        .face-front  { transform: rotateY(0deg) translateZ(70px); } .face-right  { transform: rotateY(90deg) translateZ(70px); } .face-back   { transform: rotateY(180deg) translateZ(70px); } .face-left   { transform: rotateY(-90deg) translateZ(70px); }
        .face-top    { transform: rotateX(90deg) translateZ(70px); border-color: rgba(176,38,255,0.6); box-shadow: inset 0 0 30px rgba(176,38,255,0.3), 0 0 15px rgba(176,38,255,0.2);}
        .face-bottom { transform: rotateX(-90deg) translateZ(70px); }

        .hud-glitch-in { animation: hudGlitchEffect 0.5s cubic-bezier(.25, .8, .25, 1) forwards; }
        @keyframes hudGlitchEffect { 0% { opacity: 0; transform: translate(-5px, 5px) skewX(10deg); filter: invert(1); } 20% { opacity: 0.8; transform: translate(5px, -5px) skewX(-10deg); filter: hue-rotate(90deg); } 40% { opacity: 0; transform: translate(-2px, 2px); filter: blur(2px); } 60% { opacity: 1; transform: translate(2px, -2px); filter: contrast(1.5); } 80% { opacity: 0.5; transform: translate(0, 0); filter: none; } 100% { opacity: 1; transform: translate(0, 0); filter: none; } }

        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-start; opacity: 0; pointer-events: none; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        #live-clock { position: fixed; bottom: calc(50% - 150px); left: 50%; transform: translateX(-50%); display: flex; align-items: baseline; justify-content: center; gap: 4px; font-family: 'Share Tech Mono', monospace; font-weight: bold; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 4px; border: 1px solid rgba(57, 255, 20, 0.2); box-shadow: inset 0 0 10px rgba(57,255,20,0.1); z-index: 15; pointer-events: none; opacity: 0; }
        #clock-hms { color: #39ff14; font-size: 16px; letter-spacing: 4px; text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }
        #clock-ms { color: #a0ff99; font-size: 10px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(160, 255, 153, 0.5); opacity: 0.8; }

        #terminal-hud { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); width: auto; max-width: 320px; padding: 5px 15px; display: flex; align-items: center; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; text-align: center; }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.6); white-space: nowrap; }

        #gps-display { position: fixed; bottom: 20px; right: 20px; z-index: 50; color: rgba(0, 229, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: bold; letter-spacing: 1.5px; opacity: 0; pointer-events: none; }

        /* BOO CORE CONTAINER */
        #boo-module-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; opacity: 0; perspective: 600px; transform: scale(0.5); transition: opacity 1s ease, transform 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .boo-hologram { position: absolute; width: 55px; height: 55px; top: 15%; right: 10%; cursor: pointer; display: flex; justify-content: center; align-items: center; pointer-events: auto; touch-action: none; transition: z-index 0.2s, background 0.5s; animation: holoHover 3s ease-in-out infinite; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transform-style: preserve-3d; }
        .boo-mute-icon { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 22px; opacity: 0; transition: opacity 0.3s; z-index: 10; pointer-events: none; text-shadow: 0 0 10px #ff2a2a; }
        @keyframes holoHover { 0%, 100% { margin-top: 0; } 50% { margin-top: -12px; } }
        .boo-quadrant { position: absolute; width: 45px; height: 45px; border: 3px solid transparent; transition: all 0.4s ease; box-sizing: border-box; z-index: 1; pointer-events: none; }
        .bq-dia { top: -10px; left: -10px; border-top-color: #ffd700; border-left-color: #ffd700; border-radius: 40px 0 0 0; filter: drop-shadow(0 0 4px #ffd700); }
        .bq-thuy { top: -10px; right: -10px; border-top-color: #0088ff; border-right-color: #0088ff; border-radius: 0 40px 0 0; filter: drop-shadow(0 0 4px #0088ff); }
        .bq-hoa { bottom: -10px; left: -10px; border-bottom-color: #ff3300; border-left-color: #ff3300; border-radius: 0 0 0 40px; filter: drop-shadow(0 0 4px #ff3300); }
        .bq-phong { bottom: -10px; right: -10px; border-bottom-color: #00ffff; border-right-color: #00ffff; border-radius: 0 0 40px 0; filter: drop-shadow(0 0 4px #00ffff); }
        
        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff var(--energy, 20%), transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 4px; z-index: 3; box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; transition: background 1s linear; }
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8); z-index: 2; transition: filter 0.5s, background 0.5s, box-shadow 0.5s; }
        
        /* Cảnh báo Mất Cân Bằng (Màu cam) - Giữ nguyên vị trí */
        .boo-face.struggling { background: #ff8c00; box-shadow: inset 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(255,140,0,0.8); } 
        
        /* CẢNH BÁO ĐỎ - SỬA LỖI TỌA ĐỘ VĂNG LỆCH */
        .boo-face.critical-alert { background: #ff0000; box-shadow: inset 0 0 20px #000, 0 0 40px #ff0000; animation: booFacePulse 0.8s infinite alternate !important; } 
        @keyframes booFacePulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

        .boo-zzz { position: absolute; top: -15px; right: -5px; color: #fff; font-family: monospace; font-size: 15px; font-weight: bold; text-shadow: 0 0 8px #ff1493; opacity: 0; pointer-events: none; z-index: 4; }
        #holo-bubble { position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%) translateZ(20px); width: 180px; background: rgba(5, 15, 25, 0.85); backdrop-filter: blur(4px); border-radius: 8px; padding: 10px; color: #d8ffff; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 400; text-align: left; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in-out; z-index: 10; text-shadow: 0 0 8px rgba(0,229,255,0.4); border: 1px solid rgba(0,229,255,0.3); min-height: 40px; box-shadow: 0 0 15px rgba(0,229,255,0.1); line-height: 1.4; word-break: break-word; }
        .boo-spin { animation: spinBoo 1s ease-in-out !important; }
        @keyframes spinBoo { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        
        /* CHẾ ĐỘ NGỦ DẠ HÀNH (MẮT NHẮM, KHÔNG CHỚP) */
        .boo-sleeping { animation: none !important; transition: top 2s ease-in-out, left 2s ease-in-out; left: 80vw !important; top: 30vh !important; pointer-events: auto !important; } 
        .boo-sleeping .boo-face { filter: grayscale(0.8) brightness(0.6); box-shadow: none; background: #ff1493; } 
        .boo-sleeping .boo-energy-border { box-shadow: none; } 
        .boo-sleeping .boo-zzz { animation: zzzFloat 2s infinite; }
        .boo-sleeping .boo-quadrant { opacity: 0.3; }
        .boo-sleeping .boo-face::before, .boo-sleeping .boo-face::after { height: 3px !important; top: 24px !important; animation: none !important; border-radius: 2px !important; transform: scaleY(1) !important; background: #fff !important; }

        /* GIAO DIỆN HẤP HỐI DO ĐÓI (XANH XAO, SẬP NGUỒN, MẮT NHẮM) */

        .neon-boba::after { content: ''; position: absolute; top: -18px; left: -2px; width: 35px; height: 18px; border: 2px solid #00ff80; border-radius: 50% 50% 0 0; border-bottom: none; box-shadow: 0 -5px 15px rgba(0,255,128,0.5); }

    <script>
        // ==========================================
        // KHỐI QUẢN LÝ ONBOARDING
        // ==========================================
        const obScenes = [
            { title: "PHÓ SƯ BOO AI", rawText: "// Nhiệm vụ: Hỗ trợ huấn luyện chiến binh.", visualClass: "ob-scene-1" },
            { title: "TỨ LUÂN TRẬN", rawText: "// Hiển thị trạng thái nhiệm vụ:\n- Sáng rực = Đã hoàn thành.\n- Đứt nét = Chờ thực thi.", visualClass: "ob-scene-2" },
            { title: "VÒNG SINH MỆNH", rawText: "// Cảnh báo: Năng lượng cạn kiệt, Boo không thể hỗ trợ.\n// Nghi thức phục hồi: Uống trà sữa Boba.", visualClass: "ob-scene-3" },
            { title: "GIAO THỨC TƯƠNG TÁC", rawText: "// 1 Chạm: Nhắc việc\n// 2 Chạm: Voice Chat\n// 3 Chạm: Tắt tiếng\n// Nhấn giữ: Đánh thức", visualClass: "ob-scene-4" }
        ];

        let obSceneIndex = 0;
        let obTickCount = 0;
        let obTickInterval = null;
        let obTypewriter = null;
        let isSystemMuted = false; // Biến khóa mõm 3 chạm

        window.addEventListener('load', () => {
            fetchRealUser();
            runHighTechClock();
            
            // Giây 0: Tĩnh lặng tuyệt đối, mọi thứ ẩn.
            
            // Giây 2: Boo xuất hiện hoành tráng (CÓ ÂM THANH)
            setTimeout(() => {
                playSound('deep-boom');
                playSound('warp-in');
                document.getElementById('ob-boo-wrapper').classList.add('ob-boo-grand-entry');
            }, 2000);
            
            // Giây 4.5: Hiện laser, khung chữ, và bắt đầu Cảnh 1
            setTimeout(() => {
                initOnboarding(); 
            }, 4500);
            
            // Hiện nút KÍCH HOẠT sau 5s tính từ lúc Cảnh 1 bật 
            setTimeout(() => {
                const btn = document.getElementById('bootBtn');
                btn.style.opacity = 1;
                btn.style.pointerEvents = 'auto';
            }, 9500);
        });

        function initOnboarding() {
            document.getElementById('ob-laser-line').style.opacity = 1;
            document.getElementById('ob-dots').style.opacity = 1;
            document.querySelector('.ob-text-box').style.opacity = 1;
            
            renderObScene(0);
            startSceneTimer(0);
        }

        function startSceneTimer(idx) {
            clearInterval(obTickInterval);
            obTickCount = 0;
            
            if (idx === 1 || idx === 2) { playSound('tick-alert'); }

            obTickInterval = setInterval(() => {
                obTickCount++;
                if ((idx === 1 || idx === 2) && obTickCount < 10) { playSound('tick-alert'); }
                if (obTickCount >= 10) { clearInterval(obTickInterval); nextObScene(true); }
            }, 750); // 750ms * 10 = 7.5 giây
        }

        function nextObScene(isAuto = false) {
            if(!isAuto) clearInterval(obTickInterval); 
            if (obSceneIndex < obScenes.length - 1) { obSceneIndex++; renderObScene(obSceneIndex); if(isAuto) startSceneTimer(obSceneIndex); } 
            else { clearInterval(obTickInterval); }
        }

        function prevObScene() {
            clearInterval(obTickInterval);
            if (obSceneIndex > 0) { obSceneIndex--; renderObScene(obSceneIndex); }
        }

        function renderObScene(idx) {
            const scene = obScenes[idx];
            document.querySelectorAll('.ob-dot').forEach((dot, i) => { dot.classList.toggle('active', i === idx); });
            document.getElementById('ob-boo').className = 'boo-hologram ob-boo ' + scene.visualClass;
            document.getElementById('ob-title').innerText = scene.title;
            const descEl = document.getElementById('ob-desc'); descEl.textContent = "";

            clearInterval(obTypewriter);
            let charIdx = 0;
            obTypewriter = setInterval(() => {
                if(charIdx < scene.rawText.length) { descEl.textContent += scene.rawText.charAt(charIdx); charIdx++; } 
                else { clearInterval(obTypewriter); }
            }, 25);

            document.getElementById('ob-nav-left').style.visibility = (idx === 0) ? 'hidden' : 'visible';
            document.getElementById('ob-nav-right').style.visibility = (idx === obScenes.length - 1) ? 'hidden' : 'visible';
        }

        // ==========================================
        // HỆ THỐNG ÂM THANH MỚI
        // ==========================================
        let sharedAudioCtx = null;
        function playSound(type) {
            try { 
                if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
                
                const ctx = sharedAudioCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'warp-in') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.8); gain.gain.setValueAtTime(0.01, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.6); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8); osc.start(); osc.stop(ctx.currentTime + 0.8); } 
                else if(type === 'warp-out') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2000, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.6); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); osc.start(); osc.stop(ctx.currentTime + 0.6); }
                else if(type === 'katana') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); } 
                else if(type === 'brake') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); } 
                else if (type === 'slurp') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); }
                else if (type === 'boing') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4); gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); }
                else if(type === 'deep-boom') { osc.type = 'sine'; osc.frequency.setValueAtTime(80, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 3); gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3); osc.start(); osc.stop(ctx.currentTime + 3); } 
                else if(type === 'zap') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(5000, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                else if(type === 'pop') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1); gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                else if(type === 'tick-alert') { osc.type = 'square'; osc.frequency.setValueAtTime(1200, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
            } catch (e) {}
        }

        // ==========================================
        // CÁC HỆ THỐNG CŨ KHÁC
        // ==========================================
        function fetchRealUser() { let storedUser = localStorage.getItem('kdrive_logged_in_user'); let actualUser = storedUser ? storedUser.toUpperCase() : "KAI RIPE"; document.getElementById('current-username').innerText = actualUser; }
        function runHighTechClock() { const now = new Date(); const hours = String(now.getHours()).padStart(2, '0'); const minutes = String(now.getMinutes()).padStart(2, '0'); const seconds = String(now.getSeconds()).padStart(2, '0'); const ms = String(now.getMilliseconds()).padStart(3, '0').substring(0,2); document.getElementById('clock-hms').innerText = `${hours}:${minutes}:${seconds}`; document.getElementById('clock-ms').innerText = `:${ms}`; const year = now.getFullYear(); const month = String(now.getMonth() + 1).padStart(2, '0'); const day = String(now.getDate()).padStart(2, '0'); document.getElementById('date-display').innerText = `${year}.${month}.${day}`; requestAnimationFrame(runHighTechClock); }
        async function fetchCityName(lat, lon) { try { let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`); let data = await response.json(); if(data && data.address) { return data.address.city || data.address.town || data.address.state || "UNKNOWN SECTOR"; } } catch(e) { return null; } return null; }
        function requestRealGeolocation() { const gpsEl = document.getElementById('gps-display'); if ("geolocation" in navigator) { navigator.geolocation.getCurrentPosition( async (position) => { const lat = position.coords.latitude; const lon = position.coords.longitude; let city = await fetchCityName(lat, lon); if(city) { gpsEl.innerText = `GPS: ${city.toUpperCase()} // SECTOR-ACT`; } else { gpsEl.innerText = `GPS: ${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`; } }, (error) => { gpsEl.innerText = "GPS: UNKNOWN SECTOR // DENIED"; }, { timeout: 10000 } ); } else { gpsEl.innerText = "GPS: SYSTEM OFFLINE"; } }

        const dustContainer = document.getElementById('dust-container');
        for(let i = 0; i < 50; i++) { let p = document.createElement('div'); let type = Math.random(); if(type < 0.5) p.className = 'dust-particle dust-small'; else if(type < 0.8) p.className = 'dust-particle dust-large'; else p.className = 'dust-particle dust-large dust-flicker'; p.style.left = (Math.random() * 100) + 'vw'; p.style.animationDuration = (Math.random() * 15 + 10) + 's'; p.style.animationDelay = (Math.random() * 10) + 's'; dustContainer.appendChild(p); }

        const bgMusic = document.getElementById('bg-music'); const speakerIcon = document.getElementById('speaker-btn'); bgMusic.volume = 0.5;
        function toggleAudio() { if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); } else { bgMusic.muted = true; speakerIcon.classList.add('muted'); } }
        function changeVolume(val) { bgMusic.volume = val; if (val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); } else { bgMusic.muted = true; speakerIcon.classList.add('muted'); } }

        const holoBubble = document.getElementById('holo-bubble'); let holoTimeout; let typewriterTimerCore;
        function showHologramStatus(text) { window.speechSynthesis.cancel(); speechQueue = []; holoBubble.style.opacity = 1; holoBubble.innerHTML = ""; clearTimeout(holoTimeout); clearInterval(typewriterTimerCore); let i = 0; typewriterTimerCore = setInterval(() => { if (i < text.length) { holoBubble.innerHTML += text.charAt(i); i++; } else { clearInterval(typewriterTimerCore); holoTimeout = setTimeout(() => { holoBubble.style.opacity = 0; }, 3000); } }, 30); }
        
        let speechQueue = []; let isDialogPlaying = false;
        function playBooDialog(fullText, useVoice = true) { window.speechSynthesis.cancel(); clearTimeout(holoTimeout); clearInterval(typewriterTimerCore); let sentences = fullText.replace(/([.!?])\s+/g, "$1|").split("|"); speechQueue = []; let chunk = ""; for (let s of sentences) { s = s.trim(); if (!s) continue; if (chunk.split(/[.!?]/).length - 1 >= 2 || chunk.length > 80) { speechQueue.push(chunk); chunk = s; } else { chunk += (chunk ? " " : "") + s; } } if (chunk) speechQueue.push(chunk); isDialogPlaying = false; processDialogQueue(useVoice); }
        
        function processDialogQueue(useVoice) { 
            if (speechQueue.length === 0) { isDialogPlaying = false; holoTimeout = setTimeout(() => { holoBubble.style.opacity = 0; }, 3500); return; } 
            isDialogPlaying = true; let text = speechQueue.shift(); holoBubble.style.opacity = 1; holoBubble.innerHTML = ""; clearInterval(typewriterTimerCore); 
            let i = 0; typewriterTimerCore = setInterval(() => { if (i < text.length) { holoBubble.innerHTML += text.charAt(i); i++; } else { clearInterval(typewriterTimerCore); } }, 35); 
            if (useVoice && !isSystemMuted) { 
                try { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'vi-VN'; utterance.rate = 1.15; utterance.onend = () => { setTimeout(() => processDialogQueue(useVoice), 300); }; utterance.onerror = () => { setTimeout(() => processDialogQueue(useVoice), 300); }; window.speechSynthesis.speak(utterance); } else { setTimeout(() => processDialogQueue(useVoice), text.length * 60 + 500); } } catch (e) { setTimeout(() => processDialogQueue(useVoice), text.length * 60 + 500); } 
            } else { setTimeout(() => processDialogQueue(useVoice), text.length * 60 + 1000); } 
        }
        function speakMsg(text) { if(!isSystemMuted) { try { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'vi-VN'; utterance.rate = 1.1; window.speechSynthesis.speak(utterance); } } catch (e) {} } }
