<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive Core V28 - Crystal Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* =========================================
           1. MÀN HÌNH KHAI MỞ
        ========================================= */
        #intro-screen {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://github.com/happyk1900/-m-thanh-app/blob/main/Bushido%202.png?raw=true');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s ease, filter 2s ease; animation: cyberGlitch 6s infinite;
        }

        @keyframes cyberGlitch { 0%, 94%, 100% { filter: brightness(1) contrast(1.1) hue-rotate(0deg); transform: translateX(0); } 95% { filter: brightness(1.5) contrast(1.5) hue-rotate(45deg); transform: translateX(3px); } 96% { filter: brightness(0.8) contrast(1) hue-rotate(-20deg); transform: translateX(-3px); } 97% { filter: brightness(1.2) contrast(1.2); transform: translateX(0); } }

        .kanji-circle { position: relative; width: 250px; height: 250px; cursor: pointer; animation: spinCircle 20s linear infinite; }
        @keyframes spinCircle { 100% { transform: rotate(360deg); } }

        .kanji-node {
            position: absolute; width: 60px; height: 60px; left: 50%; top: 50%; margin-left: -30px; margin-top: -30px; font-family: "Yu Mincho", serif; font-size: 65px; color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(255,255,255,0.7); display: flex; justify-content: center; align-items: center; transition: transform 4s cubic-bezier(0.1, 1, 0.2, 1), opacity 3s ease-out, filter 3s ease;
        }
        
        .kanji-text { display: inline-block; animation: counterSpin 20s linear infinite; }
        @keyframes counterSpin { 100% { transform: rotate(-360deg); } }

        .k1 { transform: rotate(0deg) translate(130px) rotate(0deg); } .k2 { transform: rotate(72deg) translate(130px) rotate(-72deg); }
        .k3 { transform: rotate(144deg) translate(130px) rotate(-144deg); } .k4 { transform: rotate(216deg) translate(130px) rotate(-216deg); }
        .k5 { transform: rotate(288deg) translate(130px) rotate(-288deg); }

        .kanji-circle.explode-mode .k1 { transform: translate(-300px, -400px) rotate(180deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k2 { transform: translate(400px, -200px) rotate(-180deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k3 { transform: translate(300px, 400px) rotate(90deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k4 { transform: translate(-400px, 200px) rotate(-90deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k5 { transform: translate(0px, -500px) rotate(45deg) scale(2.5); opacity: 0; filter: blur(10px); }

        .author-btn { position: absolute; bottom: 8%; right: 8%; color: #ff2a2a; font-family: 'Tangerine', cursive; font-size: 34px; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: opacity 1s ease; text-shadow: 0 0 12px rgba(255, 42, 42, 0.8); animation: pulseText 3s infinite alternate; }
        @keyframes pulseText { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* =========================================
           2. NỘI VIỆN & SÀN LƯỚI
        ========================================= */
        #sanctum-bg {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; opacity: 0; transition: opacity 2.5s ease-in;
            background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/INDEX%20SAMURAI.png?raw=true'); background-size: cover; background-position: center center; background-repeat: no-repeat;
        }
        
        .cyber-floor {
            position: fixed; bottom: -20%; left: -50%; width: 200%; height: 60vh;
            background: repeating-linear-gradient(to top, transparent, transparent 30px, rgba(0, 229, 255, 0.1) 31px, transparent 32px), repeating-linear-gradient(to right, transparent, transparent 30px, rgba(0, 229, 255, 0.1) 31px, transparent 32px);
            transform: perspective(600px) rotateX(75deg); transform-origin: center bottom; animation: gridFlow 1.5s linear infinite; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 2.5s ease-in;
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
        }
        @keyframes gridFlow { 0% { background-position: 0 0; } 100% { background-position: 0 31px; } }

        /* =========================================
           3. LÕI K-DRIVE (CRYSTAL GLASSMORPHISM)
        ========================================= */
        #core-wrapper { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; z-index: 10; transition: opacity 2s, transform 0.5s; transform: scale(0.9); }
        
        #core-glow-floor {
            position: absolute; width: 180px; height: 40px; background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.4) 0%, rgba(0, 229, 255, 0) 70%);
            border-radius: 50%; bottom: calc(50% - 130px); filter: blur(8px); animation: shadowPulse 5s ease-in-out infinite; z-index: 1; pointer-events: none;
        }

        .holy-core-container { position: relative; width: 140px; height: 140px; perspective: 1000px; animation: coreFloat 5s ease-in-out infinite; z-index: 2; }
        
        @keyframes coreFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @keyframes shadowPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(0.8); opacity: 0.2; } }

        .holy-cube { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; cursor: grab; will-change: transform; }
        .holy-cube:active { cursor: grabbing; }

        /* Quả cầu tâm lõi (Tỏa sáng cực mạnh xuyên kính) */
        .inner-sphere {
            position: absolute; width: 66px; height: 66px; left: 50%; top: 50%; transform: translate(-50%, -50%) translateZ(0); border-radius: 50%;
            transition: all 1.5s ease-in-out; pointer-events: none; filter: blur(2px);
        }
        .core-weak { background: radial-gradient(circle at 30% 30%, #fff 0%, #a0f0ff 40%, rgba(0,229,255,0.4) 80%, transparent 100%); box-shadow: 0 0 40px rgba(0,229,255,0.7); }
        .core-mid { background: radial-gradient(circle at 30% 30%, #fff 0%, #ffeb3b 40%, rgba(255,165,0,0.5) 80%, transparent 100%); box-shadow: 0 0 60px rgba(255,204,0,0.8); }
        .core-max { background: radial-gradient(circle at 30% 30%, #fff 0%, #ff2a2a 30%, rgba(139,0,0,0.8) 70%, transparent 100%); box-shadow: 0 0 80px rgba(255,0,0,0.8), 0 0 120px rgba(255,0,0,0.5); animation: pulseBlood 1.5s infinite alternate; }
        
        @keyframes pulseBlood { from { transform: translate(-50%, -50%) translateZ(0) scale(0.95); } to { transform: translate(-50%, -50%) translateZ(0) scale(1.15); filter: brightness(1.2); } }
        
        /* Mặt kính pha lê (Giảm Blur, thêm Vệt sáng) */
        .cube-face {
            position: absolute; width: 140px; height: 140px; border: 1.5px solid rgba(0, 229, 255, 0.6); 
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.01) 40%, rgba(255,255,255,0) 50%, rgba(0,229,255,0.02) 100%); /* Vệt sáng chéo */
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); /* Giảm nhòe cực mạnh để thấy lõi */
            backface-visibility: hidden; 
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2), inset 0 0 30px rgba(0, 229, 255, 0.3); /* Cạnh viền rực sáng */
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background 0.3s, box-shadow 0.3s; user-select: none;
        }
        .cube-face:active { background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 50px rgba(0, 229, 255, 1); }

        /* Container chữ để chống lộn ngược */
        .face-content {
            display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%;
        }

        .sci-label {
            position: absolute; bottom: 8px; width: 100%; text-align: center; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; background: transparent; padding: 4px 0; animation: sciBlink 1.5s infinite; pointer-events: none; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.5);
        }
        @keyframes sciBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .kanji-ghost { font-family: "Yu Mincho", serif; font-size: 70px; line-height: 1; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 1); pointer-events: none; transform: translateY(-5px); }

        .face-front  { transform: rotateY(0deg) translateZ(70px); }
        .face-right  { transform: rotateY(90deg) translateZ(70px); }
        .face-back   { transform: rotateY(180deg) translateZ(70px); }
        .face-left   { transform: rotateY(-90deg) translateZ(70px); }
        .face-top    { transform: rotateX(90deg) translateZ(70px); border-color: rgba(176,38,255,0.7); box-shadow: 0 0 30px rgba(176,38,255,0.3), inset 0 0 30px rgba(176,38,255,0.3);}
        .face-bottom { transform: rotateX(-90deg) translateZ(70px); }

        /* Chống ngược chữ ở mặt sau và mặt đáy */
        .face-back .face-content { transform: rotateY(180deg); }
        .face-bottom .face-content { transform: rotateX(180deg); }
        .face-left .face-content { transform: rotateY(0deg); } /* Giữ nguyên, xoay cả khối tự hợp lý */
        .face-right .face-content { transform: rotateY(0deg); }

        /* =========================================
           4. MODULE: PHÓ SƯ BOO & TRÀ SỮA (THU NHỎ)
        ========================================= */
        #boo-module-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 2s ease-in; }
        
        /* Boo thu nhỏ từ 70px -> 55px */
        .boo-hologram { position: absolute; width: 55px; height: 55px; top: 18%; right: 8%; cursor: grab; display: flex; justify-content: center; align-items: center; animation: floatBoo 4s ease-in-out infinite; pointer-events: auto; touch-action: none; transition: z-index 0.2s; }
        .boo-hologram:active { cursor: grabbing; transform: scale(1.1); }
        
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 0 25px rgba(255,20,147,0.8); z-index: 2; transition: filter 0.5s; }
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 18px; background: #000; border-radius: 50%; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }

        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff var(--energy, 100%), transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 3px; z-index: 3; box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff; transition: background 1s linear; }
        .boo-zzz { position: absolute; top: -12px; right: -5px; color: #fff; font-family: monospace; font-size: 14px; font-weight: bold; text-shadow: 0 0 8px #ff1493; opacity: 0; pointer-events: none; z-index: 4; }
        
        .boo-sleeping { animation: none !important; }
        .boo-sleeping .boo-face { filter: grayscale(0.8) brightness(0.6); box-shadow: none; }
        .boo-sleeping .boo-energy-border { box-shadow: none; }
        .boo-sleeping .boo-zzz { animation: zzzFloat 2s infinite; }
        .boo-glitch .boo-energy-border { filter: hue-rotate(150deg); box-shadow: 0 0 35px #ff0000; animation: glitchHolo 0.2s infinite; }
        .boo-full-mode .boo-energy-border { background: #00e5ff; box-shadow: 0 0 30px #00e5ff; }

        @keyframes floatBoo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes glitchHolo { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
        @keyframes zzzFloat { 0% { transform: translate(0, 0) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(12px, -20px) scale(1.2); opacity: 0; } }
        
        /* Trà sữa thu nhỏ: 45x60 -> 35x48, Nhích lên tránh bottom bar */
        .neon-boba {
            position: absolute; bottom: 55px; left: 35px; width: 35px; height: 48px; border: 1.5px solid #00ff80; border-radius: 4px 4px 16px 16px; box-shadow: 0 0 20px #00ff80, inset 0 0 12px rgba(0, 255, 128, 0.4); background: rgba(0, 255, 128, 0.1); cursor: grab; pointer-events: auto; touch-action: none; display: none; z-index: 15;
        }
        .neon-boba::after { content: ''; position: absolute; top: -17px; left: -1.5px; width: 35px; height: 17px; border: 1.5px solid #00ff80; border-radius: 50% 50% 0 0; border-bottom: none; box-shadow: 0 -4px 12px rgba(0,255,128,0.5); }
        .neon-boba::before { content: ''; position: absolute; width: 3px; height: 35px; background: #ff2a2a; top: -28px; left: 15px; transform: rotate(15deg); box-shadow: 0 0 12px #ff2a2a; z-index: 2; }
        .boba-pearls { position: absolute; bottom: 4px; width: 100%; height: 16px; pointer-events: none; }
        .pearl { position: absolute; width: 8px; height: 8px; border: 1.5px solid #ff1493; border-radius: 50%; box-shadow: 0 0 8px #ff1493, inset 0 0 4px #ff1493; }
        .p1 { left: 4px; bottom: 1px; } .p2 { left: 14px; bottom: 0px; } .p3 { right: 4px; bottom: 2px; } .p4 { left: 9px; bottom: 9px; } .p5 { right: 6px; bottom: 8px; }

        /* =========================================
           5. HUD ÂM THANH & NÚT GIAO THỨC
        ========================================= */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: center; opacity: 0; transition: opacity 2s ease-in; pointer-events: none; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }

        #lore-btn { color: #a0f0ff; font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: bold; letter-spacing: 2px; border: none; background: transparent; cursor: pointer; pointer-events: auto; transition: all 0.3s; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        #lore-btn:active { color: #ffffff; text-shadow: 0 0 20px #ffffff; transform: scale(0.95); }

        /* =========================================
           6. TERMINAL THÔNG BÁO (Đẩy lên cao hơn)
        ========================================= */
        #terminal-hud {
            position: fixed; bottom: 180px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; background: transparent; border: none; padding: 10px; display: flex; align-items: center; justify-content: center; z-index: 50; opacity: 0; transition: opacity 2s ease-in; pointer-events: none; text-align: center;
        }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: 300; letter-spacing: 1.2px; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.6); white-space: pre-wrap; }
        .terminal-cursor { width: 5px; height: 12px; background: #fff; margin-left: 5px; box-shadow: 0 0 8px #fff; animation: cursorBlink 0.8s infinite; display: inline-block; vertical-align: middle; }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* =========================================
           7. BẢNG BÍ KÍP (LORE MODAL)
        ========================================= */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(0, 229, 255, 0.5); box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.1); z-index: 1000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 229, 255, 0.4); padding-bottom: 10px; }
        .lore-title { color: #a0f0ff; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 16px; text-shadow: 0 0 8px rgba(0,229,255,0.5); }
        .lore-close { color: #ff2a2a; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff2a2a; }
        .lore-content { color: #fff; font-size: 13.5px; line-height: 1.6; min-height: 190px; text-shadow: 0 0 5px rgba(255,255,255,0.4); font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0, 229, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #00e5ff; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; }
        .lore-nav:active { background: rgba(0, 229, 255, 0.2); border-radius: 3px; }
        .lore-page-indicator { color: #fff; font-family: monospace; font-weight: bold; }
        .lore-hint { text-align: center; color: #ff1493; font-size: 11px; font-style: italic; animation: pulseHint 2s infinite alternate; margin-top: -5px;}
        @keyframes pulseHint { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        .boo-lore-mode { z-index: 1001 !important; }

        /* =========================================
           8. HIỆU ỨNG TỔNG THỂ (Bụi 3 Lớp & Glitch)
        ========================================= */
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        .dust-flicker { animation: floatDust linear infinite, flicker 2s infinite alternate; }

        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }
        @keyframes flicker { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; box-shadow: 0 0 10px #00e5ff; } }

        .critical-warning { animation: screenRedAlert 4s infinite; }
        @keyframes screenRedAlert { 0%, 90%, 100% { box-shadow: inset 0 0 0 transparent; filter: none; transform: translate(0); } 92% { box-shadow: inset 0 0 80px rgba(255,0,0,0.3); filter: drop-shadow(4px 0 0 red); transform: translate(-3px, 2px); } 94% { box-shadow: inset 0 0 120px rgba(255,0,0,0.4); filter: drop-shadow(-4px 0 0 cyan); transform: translate(3px, -2px); } 96% { box-shadow: inset 0 0 50px rgba(255,0,0,0.1); filter: none; transform: translate(0); } }
        .plug-in-glitch { animation: plugInEffect 0.6s ease-out; }
        @keyframes plugInEffect { 0% { filter: hue-rotate(90deg) contrast(2) brightness(1.5); transform: scale(1.05) skewX(2deg); } 20% { filter: invert(0.2) drop-shadow(8px 0 0 red); transform: scale(1) skewX(-2deg) translate(5px, 5px); } 40% { filter: drop-shadow(-8px 0 0 cyan); transform: translate(-5px, -5px); } 100% { filter: none; transform: translate(0); } }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="kanji-circle" id="kanji-gate" onclick="triggerKhaiMo()">
            <div class="kanji-node k1"><span class="kanji-text">地</span></div>
            <div class="kanji-node k2"><span class="kanji-text">水</span></div>
            <div class="kanji-node k3"><span class="kanji-text">火</span></div>
            <div class="kanji-node k4"><span class="kanji-text">風</span></div>
            <div class="kanji-node k5"><span class="kanji-text">空</span></div>
        </div>
        <div class="author-btn" id="musashi-btn">— Miyamoto Musashi</div>
    </div>

    <div id="dust-container"></div>

    <div id="top-hud">
        <div class="audio-wrapper">
            <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
            </div>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
        </div>
        <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
    </div>
    
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <div id="sanctum-bg"></div>
    <div class="cyber-floor" id="floor-grid"></div>

    <div id="terminal-hud">
        <span class="terminal-text" id="terminal-text"></span>
        <span class="terminal-cursor"></span>
    </div>

    <div id="lore-modal">
        <div class="lore-header">
            <span class="lore-title">GIAO THỨC K-DRIVE</span>
            <span class="lore-close" onclick="closeLore()">X</span>
        </div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls">
            <div class="lore-nav" onclick="prevPage()">[ < ]</div>
            <div class="lore-page-indicator" id="lore-page-num">1 / 4</div>
            <div class="lore-nav" onclick="nextPage()">[ > ]</div>
        </div>
        <div class="lore-hint">👉 Chạm vào Phó sư Boo để nghe đọc to</div>
    </div>

    <div id="boo-module-container">
        <div class="boo-hologram" id="boo-knight">
            <div class="boo-energy-border" id="boo-energy"></div>
            <div class="boo-face"></div>
            <div class="boo-zzz" id="boo-zzz">Zzz</div>
        </div>
        
        <div class="neon-boba" id="boba-reward">
            <div class="boba-pearls">
                <div class="pearl p1"></div><div class="pearl p2"></div><div class="pearl p3"></div><div class="pearl p4"></div><div class="pearl p5"></div>
            </div>
        </div>
    </div>

    <div id="core-wrapper">
        <div id="core-glow-floor"></div>
        <div class="holy-core-container">
            <div class="holy-cube" id="holy-cube">
                <div class="inner-sphere" id="inner-sphere"></div>

                <div class="cube-face face-front" onclick="navToFace('sinh_trac.html')">
                    <div class="face-content">
                        <div class="kanji-ghost">地</div>
                        <div class="sci-label">BẢN THỂ SCI: <span id="sci-val-1">--</span></div>
                    </div>
                </div>
                <div class="cube-face face-right" onclick="navToFace('thuy_luan.html')">
                    <div class="face-content">
                        <div class="kanji-ghost">水</div>
                        <div class="sci-label">TÂM LƯU SCI: <span id="sci-val-2">--</span></div>
                    </div>
                </div>
                <div class="cube-face face-back" onclick="navToFace('#')">
                    <div class="face-content">
                        <div class="kanji-ghost">火</div>
                        <div class="sci-label">BẢN NĂNG SCI: <span id="sci-val-3">--</span></div>
                    </div>
                </div>
                <div class="cube-face face-left" onclick="navToFace('#')">
                    <div class="face-content">
                        <div class="kanji-ghost">風</div>
                        <div class="sci-label">VẠN BIẾN SCI: <span id="sci-val-4">--</span></div>
                    </div>
                </div>
                <div class="cube-face face-top" onclick="navToFace('#')">
                    <div class="face-content">
                        <div class="kanji-ghost" style="font-size: 45px;">契</div>
                        <div class="sci-label" style="color: #ff2a2a; text-shadow: 0 0 8px #ff2a2a;">MUSHI DAYS: 1000</div>
                    </div>
                </div>
                <div class="cube-face face-bottom" onclick="navToFace('#')">
                    <div class="face-content">
                        <div class="kanji-ghost" style="font-size: 45px;">武</div>
                        <div class="sci-label">BUSHIDO: MAX</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // KHỞI TẠO BỤI CYBER NHIỀU LỚP
        // ==========================================
        const dustContainer = document.getElementById('dust-container');
        for(let i = 0; i < 50; i++) {
            let p = document.createElement('div');
            let type = Math.random();
            if(type < 0.5) p.className = 'dust-particle dust-small';
            else if(type < 0.8) p.className = 'dust-particle dust-large';
            else p.className = 'dust-particle dust-large dust-flicker';
            p.style.left = (Math.random() * 100) + 'vw';
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            dustContainer.appendChild(p);
        }

        // ==========================================
        // DỮ LIỆU BÍ KÍP
        // ==========================================
        const lorePagesHTML = [
            "<span style='color:#00e5ff; font-weight:bold; font-size:15px;'>GIAO THỨC HỆ THỐNG</span><br><br><b style='color:#fff'>K-DRIVE KHÔNG CÓ KỊCH BẢN CHO KẺ YẾU.</b> Đây là AI tối tân với thuật toán biến ảo vô hạn: chủ thể càng xuất chúng, thuật toán càng siết chặt độ phức tạp, ép toàn bộ thể chất, trí nhớ chạm ngưỡng quá tải.<br><br><span style='color:#ff2a2a'>LƯU Ý:</span> Duy trì kết nối thiết bị 24/24.",
            "<span style='color:#00e5ff; font-weight:bold; font-size:15px;'>BƯỚC 1 & 2: KỶ LUẬT & NGŨ LUÂN</span><br><br>• <span style='color:#39ff14'>Bước 1: Điểm danh</span> – Truy cập mặt <b style='color:#fff'>Bushido</b> (chữ 武) mỗi ngày để nghe đạo và đồng bộ thiết bị.<br><br>• <span style='color:#39ff14'>Bước 2: Cày Ngũ Luân</span> – Hoàn thành 4 mặt (Địa - Thủy - Hỏa - Phong) để nâng SCI.",
            "<span style='color:#00e5ff; font-weight:bold; font-size:15px;'>BƯỚC 3 & 4: VÔ NGÃ & DI SẢN</span><br><br>• <span style='color:#39ff14'>Bước 3: Vô Ngã</span> – 4 mặt max, lõi hóa <b style='color:#ff2a2a'>Đỏ Máu</b>, kích hoạt đồng hồ 1000 ngày. Lơi lỏng dù chỉ 1 nhịp, đồng hồ <b style='color:#ff2a2a'>reset tàn độc</b> về 1000.<br><br>• <span style='color:#39ff14'>Bước 4: Di Sản</span> – Kỷ luật 1000 ngày, lõi bung mở trao Bí kíp Vô Ngã.",
            "<span style='color:#00e5ff; font-weight:bold; font-size:15px;'>CỐ VẤN & LỜI CHỐT</span><br><br>• <b>Chạm 1 lần:</b> Nghe cố vấn. • <b>Chạm 2 lần:</b> Đánh thức.<br>• <b>Giữ:</b> Ngủ đông. • <b>Cấp cứu:</b> Kéo Trà Sữa nạp sinh lực.<br><br><span style='color:#ff2a2a; font-weight:bold; font-size:14px; font-style:italic;'>KỶ LUẬT THÉP KHÔNG CHỖ CHO SỰ HỢP LÝ HÓA. ĐỈNH CAO VÔ NGÃ KHÔNG CÓ CHỖ CHO SỰ YẾU ĐUỐI!</span>"
        ];
        
        const lorePagesSpeak = [
            "Giao thức hệ thống. K Drive không có kịch bản cho kẻ yếu. Đây là ây ai tối tân với thuật toán biến ảo vô hạn: chủ thể càng xuất chúng, thuật toán càng siết chặt độ phức tạp. Lưu ý: Duy trì kết nối thiết bị 24 trên 24.",
            "Bước 1 và 2. Kỷ luật và Ngũ luân. Bước 1, điểm danh Bushido mỗi ngày để nghe đạo. Bước 2, cày Ngũ luân. Hoàn thành 4 mặt Địa, Thủy, Hỏa, Phong để nâng ét xi ai.",
            "Bước 3 và 4. Vô ngã và di sản. Bước 3, mở khóa vô ngã. Khi 4 mặt đạt max, lõi hóa đỏ máu, kích hoạt đồng hồ 1000 ngày. Lơi lỏng dù chỉ 1 nhịp, đồng hồ sẽ reset tàn độc về 1000. Bước 4, nhận di sản khi hoàn thành 1000 ngày.",
            "Cố vấn và lời chốt. Phó sư Boo: chạm một lần nghe cố vấn. Chạm hai lần đánh thức. Giữ để ngủ đông. Kéo trà sữa để nạp sinh lực. Kỷ luật thép không có chỗ cho sự hợp lý hóa. Đỉnh cao vô ngã không có chỗ cho sự yếu đuối!"
        ];

        let currentLorePage = 0; let isLoreOpen = false;

        function openLore() { isLoreOpen = true; document.getElementById('lore-modal').classList.add('active'); document.getElementById('boo-knight').classList.add('boo-lore-mode'); renderLorePage(); playSound('katana'); }
        function closeLore() { isLoreOpen = false; document.getElementById('lore-modal').classList.remove('active'); document.getElementById('boo-knight').classList.remove('boo-lore-mode'); window.speechSynthesis.cancel(); playSound('brake'); }
        function renderLorePage() { document.getElementById('lore-text').innerHTML = lorePagesHTML[currentLorePage]; document.getElementById('lore-page-num').innerText = `${currentLorePage + 1} / 4`; window.speechSynthesis.cancel(); }
        function nextPage() { if(currentLorePage < 3) { currentLorePage++; renderLorePage(); playSound('brake'); } }
        function prevPage() { if(currentLorePage > 0) { currentLorePage--; renderLorePage(); playSound('brake'); } }

        // ==========================================
        // LOGIC KINH TẾ NĂNG LƯỢNG (GAME ECONOMY)
        // ==========================================
        // Mặc định: Giả lập user đã làm xong vài task.
        let dailyTasks = { bushido: true, dia: true, thuy: false, hoa: false, phong: false };
        let remainingBoba = 2; // Số ly trà sữa kiếm được từ việc xong 2 task (Bushido, Địa).
        let isAllTaskDone = false; // Trạng thái hoàn tất đạo nghiệp

        function checkTaskStatus() {
            if (dailyTasks.bushido && dailyTasks.dia && dailyTasks.thuy && dailyTasks.hoa && dailyTasks.phong) {
                isAllTaskDone = true;
                boo.classList.add('boo-full-mode'); // Boo khóa năng lượng 100%
            } else {
                isAllTaskDone = false;
                boo.classList.remove('boo-full-mode');
            }
        }

        function getNextTaskName() {
            if (!dailyTasks.bushido) return "BUSHIDO";
            if (!dailyTasks.thuy) return "THỦY LUÂN";
            if (!dailyTasks.hoa) return "HỎA LUÂN";
            if (!dailyTasks.phong) return "PHONG LUÂN";
            return "HOÀN TẤT";
        }

        function getTerminalMessage() {
            if (isAllTaskDone) {
                return "> [HỆ THỐNG]: ĐÃ HOÀN TẤT ĐẠO NGHIỆP TRONG NGÀY. NĂNG LƯỢNG BẢO TOÀN.";
            } else if (booEnergy < 30 && remainingBoba === 0) {
                // Đói nhưng hết trà sữa
                let nextTask = getNextTaskName();
                return `> [CẢNH BÁO]: HẾT TRÀ SỮA! HOÀN THÀNH MẶT [${nextTask}] ĐỂ NHẬN TIẾP TẾ.`;
            } else if (booEnergy < 30 && remainingBoba > 0) {
                return `> [CẢNH BÁO]: HỆ THỐNG MENTOR ĐANG ĐÓI. BẠN CÒN ${remainingBoba} LY TRÀ SỮA.`;
            } else {
                let nextTask = getNextTaskName();
                return `> [NHIỆM VỤ]: TIẾN VÀO MẶT [${nextTask}] ĐỂ ĐẨY CHỈ SỐ SCI.`;
            }
        }

        let charIndex = 0; const terminalText = document.getElementById('terminal-text');
        
        function typeWriter() {
            checkTaskStatus();
            let currentMsg = getTerminalMessage();
            if (charIndex === 0) { terminalText.style.transition = "none"; terminalText.style.opacity = 1; }
            if (charIndex < currentMsg.length) {
                terminalText.innerHTML += currentMsg.charAt(charIndex); charIndex++; setTimeout(typeWriter, 40);
            } else {
                setTimeout(() => {
                    terminalText.style.transition = "opacity 1.5s ease-out"; terminalText.style.opacity = 0;
                    setTimeout(() => { terminalText.innerHTML = ''; charIndex = 0; typeWriter(); }, 1500);
                }, 4000);
            }
        }

        // ==========================================
        // DEMO: SCI & MÀU LÕI
        // ==========================================
        let demoStage = 0;
        setInterval(() => {
            let scores;
            if(demoStage === 0) { scores = [40, 45, 30, 40]; } 
            else if(demoStage === 1) { scores = [60, 70, 75, 65]; } 
            else { scores = [85, 90, 95, 99]; } 
             
            document.getElementById('sci-val-1').innerText = scores[0]; document.getElementById('sci-val-2').innerText = scores[1]; document.getElementById('sci-val-3').innerText = scores[2]; document.getElementById('sci-val-4').innerText = scores[3];
            let avg = (scores[0] + scores[1] + scores[2] + scores[3]) / 4; const sphere = document.getElementById('inner-sphere'); sphere.className = 'inner-sphere'; 
            if (avg < 50) sphere.classList.add('core-weak'); else if (avg <= 80) sphere.classList.add('core-mid'); else sphere.classList.add('core-max');
            demoStage = (demoStage + 1) % 3;
        }, 4000); 

        // ==========================================
        // ÂM THANH
        // ==========================================
        const bgMusic = document.getElementById('bg-music'); const speakerIcon = document.getElementById('speaker-btn'); bgMusic.volume = 0.5;
        function toggleAudio() { if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); } else { bgMusic.muted = true; speakerIcon.classList.add('muted'); } }
        function changeVolume(val) { bgMusic.volume = val; if (val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); } else { bgMusic.muted = true; speakerIcon.classList.add('muted'); } }
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type === 'deep-boom') { osc.type = 'sine'; osc.frequency.setValueAtTime(60, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 3); gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3); osc.start(); osc.stop(ctx.currentTime + 3); } 
                else if(type === 'katana') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); } 
                else if(type === 'brake') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); } 
                else if (type === 'slurp') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); }
            } catch (e) {}
        }

        // ==========================================
        // KHAI MỞ
        // ==========================================
        function triggerKhaiMo() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 400]); playSound('deep-boom'); bgMusic.play().catch(e => console.log("Chặn autoplay audio"));
            document.getElementById('kanji-gate').classList.add('explode-mode'); document.getElementById('musashi-btn').style.opacity = '0'; document.getElementById('intro-screen').style.pointerEvents = 'none'; document.getElementById('intro-screen').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('sanctum-bg').style.opacity = 1; document.getElementById('floor-grid').style.opacity = 1; document.body.classList.add('plug-in-glitch'); setTimeout(() => document.body.classList.remove('plug-in-glitch'), 600);
                setTimeout(() => {
                    document.getElementById('core-wrapper').style.opacity = 1; playSound('katana'); document.getElementById('boo-module-container').style.opacity = 1; document.getElementById('top-hud').style.opacity = 1; document.getElementById('terminal-hud').style.opacity = 1;
                    typeWriter(); speakMsg("Hệ thống đã đồng bộ. Chủ thể hãy bắt đầu thực hiện nhiệm vụ.");
                }, 1000);
            }, 800);
            setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 3000);
        }

        function speakMsg(text) { try { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'vi-VN'; utterance.rate = 1.1; window.speechSynthesis.speak(utterance); } } catch (e) {} }

        // ==========================================
        // VẬT LÝ KHỐI LÕI
        // ==========================================
        const cube = document.getElementById('holy-cube'); let cubeRx = 15, cubeRy = 20; let cubeVx = 0.5, cubeVy = 0.8; let isCubeDragging = false, isCubeMoved = false; let startPx, startPy;
        cube.addEventListener('pointerdown', (e) => { if(isLoreOpen) return; isCubeDragging = true; isCubeMoved = false; startPx = e.clientX; startPy = e.clientY; cubeVx = 0; cubeVy = 0; playSound('brake'); if(navigator.vibrate) navigator.vibrate(20); cube.style.cursor = "grabbing"; });
        window.addEventListener('pointermove', (e) => { if (!isCubeDragging) return; let dx = e.clientX - startPx; let dy = e.clientY - startPy; if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isCubeMoved = true; cubeVy = dx * 0.5; cubeVx = -dy * 0.5; startPx = e.clientX; startPy = e.clientY; });
        window.addEventListener('pointerup', () => { isCubeDragging = false; cube.style.cursor = "grab"; });
        function renderPhysics() {
            if (!isCubeDragging && !isLoreOpen) { cubeVx *= 0.95; cubeVy *= 0.95; if(Math.abs(cubeVx) < 0.08) cubeVx = (cubeVx >= 0 ? 0.08 : -0.08); if(Math.abs(cubeVy) < 0.08) cubeVy = (cubeVy >= 0 ? 0.08 : -0.08); }
            if(!isLoreOpen) { cubeRx += cubeVx; cubeRy += cubeVy; } cube.style.transform = `rotateX(${cubeRx}deg) rotateY(${cubeRy}deg)`; requestAnimationFrame(renderPhysics);
        }
        renderPhysics();
        function navToFace(url) { if (!isCubeMoved && !isLoreOpen) { if(navigator.vibrate) navigator.vibrate(50); playSound('katana'); document.getElementById('core-wrapper').style.transform = 'scale(4)'; document.getElementById('core-wrapper').style.opacity = '0'; setTimeout(() => { window.location.href = url; }, 500); } }

        // ==========================================
        // PHÓ SƯ BOO & TRÀ SỮA
        // ==========================================
        const boo = document.getElementById('boo-knight'); const booEnergyBorder = document.getElementById('boo-energy'); const bobaReward = document.getElementById('boba-reward');
        let booEnergy = 100; let isBooSleeping = false; let isBooDragging = false; let booStartX, booStartY, booInitialX, booInitialY; let pressTimer;
        
        setInterval(() => {
            if (!isAllTaskDone && booEnergy > 0) { // Nếu xong hết task thì không tụt năng lượng
                booEnergy -= 2; // Tốc độ tụt năng lượng
                booEnergyBorder.style.setProperty('--energy', `${booEnergy}%`); 
                if (booEnergy < 30) { 
                    boo.classList.add('boo-glitch'); document.body.classList.add('critical-warning');
                    if (remainingBoba > 0) bobaReward.style.display = 'block'; // Hiện trà sữa nếu còn
                } 
                if (booEnergy <= 0) forceSleep(true); 
            }
        }, 3000);

        function forceSleep(isFainted = false) { isBooSleeping = true; boo.classList.add('boo-sleeping'); boo.dataset.fainted = isFainted; if(navigator.vibrate) navigator.vibrate([30, 30, 30]); document.body.classList.remove('critical-warning'); }

        boo.addEventListener('pointerdown', (e) => {
            e.preventDefault(); if (isLoreOpen) { speakMsg(lorePagesSpeak[currentLorePage]); return; }
            isBooDragging = true; booStartX = e.clientX; booStartY = e.clientY; booInitialX = boo.offsetLeft; booInitialY = boo.offsetTop;
            if (booEnergy > 0) pressTimer = setTimeout(() => forceSleep(false), 800);
        });
        window.addEventListener('pointermove', (e) => { if(isBooDragging && !isLoreOpen) { const dx = e.clientX - booStartX; const dy = e.clientY - booStartY; if(Math.abs(dx) > 10 || Math.abs(dy) > 10) clearTimeout(pressTimer); boo.style.left = (booInitialX + dx) + 'px'; boo.style.top = (booInitialY + dy) + 'px'; boo.style.right = 'auto'; } });
        window.addEventListener('pointerup', (e) => {
            if(isBooDragging && !isLoreOpen) {
                isBooDragging = false; clearTimeout(pressTimer);
                if (isBooSleeping && boo.dataset.fainted !== "true" && Math.abs(e.clientX - booStartX) < 10) { isBooSleeping = false; boo.classList.remove('boo-sleeping'); } else if (!isBooSleeping && Math.abs(e.clientX - booStartX) < 10) { speakMsg("Tập trung vào nhiệm vụ đi!"); }
            }
        });
        
        let isBobaDragging = false, bobaStartX, bobaStartY, bobaInitX, bobaInitY;
        bobaReward.addEventListener('pointerdown', (e) => { isBobaDragging = true; bobaStartX = e.clientX; bobaStartY = e.clientY; bobaInitX = bobaReward.offsetLeft; bobaInitY = bobaReward.offsetTop; bobaReward.style.cursor = 'grabbing'; });
        window.addEventListener('pointermove', (e) => { if(isBobaDragging) { bobaReward.style.left = (bobaInitX + (e.clientX - bobaStartX)) + 'px'; bobaReward.style.top = (bobaInitY + (e.clientY - bobaStartY)) + 'px'; } });
        window.addEventListener('pointerup', (e) => {
            if(isBobaDragging) {
                isBobaDragging = false; bobaReward.style.cursor = 'grab';
                const bobaRect = bobaReward.getBoundingClientRect(); const booRect = boo.getBoundingClientRect();
                const overlap = !(bobaRect.right < booRect.left || bobaRect.left > booRect.right || bobaRect.bottom < booRect.top || bobaRect.top > booRect.bottom);
                if (overlap) {
                    playSound('slurp'); booEnergy = 100; booEnergyBorder.style.setProperty('--energy', '100%'); boo.classList.remove('boo-glitch'); document.body.classList.remove('critical-warning'); 
                    isBooSleeping = false; boo.classList.remove('boo-sleeping'); boo.dataset.fainted = "false"; bobaReward.style.display = 'none'; 
                    remainingBoba--; // Trừ đi 1 ly
                    speakMsg(`Đã nạp sinh lực. Chủ thể còn ${remainingBoba} ly dự trữ.`); 
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    
                    // Demo tự động reset vị trí cốc nếu còn ly
                    setTimeout(() => { bobaReward.style.left = '35px'; bobaReward.style.bottom = '55px'; bobaReward.style.top = 'auto'; }, 1000);
                } else { bobaReward.style.left = '35px'; bobaReward.style.bottom = '55px'; bobaReward.style.top = 'auto'; }
            }
        });
    </script>
</body>
</html>
