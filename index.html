<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive Core V28</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* =========================================
           1. PHASE 1: MÀN HÌNH KHAI MỞ
        ========================================= */
        #intro-screen {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://github.com/happyk1900/-m-thanh-app/blob/main/Bushido%202.png?raw=true');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 2s ease, filter 2s ease;
            animation: cyberGlitch 6s infinite;
        }

        @keyframes cyberGlitch {
            0%, 94%, 100% { filter: brightness(1) contrast(1.1) hue-rotate(0deg); transform: translateX(0); }
            95% { filter: brightness(1.5) contrast(1.5) hue-rotate(45deg); transform: translateX(3px); }
            96% { filter: brightness(0.8) contrast(1) hue-rotate(-20deg); transform: translateX(-3px); }
            97% { filter: brightness(1.2) contrast(1.2); transform: translateX(0); }
        }

        .kanji-circle { 
            position: relative; width: 250px; height: 250px; cursor: pointer; 
            animation: spinCircle 20s linear infinite;
        }
        @keyframes spinCircle { 100% { transform: rotate(360deg); } }

        .kanji-node {
            position: absolute; width: 60px; height: 60px;
            left: 50%; top: 50%; margin-left: -30px; margin-top: -30px;
            font-family: "Yu Mincho", serif; font-size: 65px; color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(255,255,255,0.7);
            display: flex; justify-content: center; align-items: center;
            transition: transform 4s cubic-bezier(0.1, 1, 0.2, 1), opacity 3s ease-out, filter 3s ease;
        }
        
        .kanji-text { display: inline-block; animation: counterSpin 20s linear infinite; }
        @keyframes counterSpin { 100% { transform: rotate(-360deg); } }

        .k1 { transform: rotate(0deg) translate(130px) rotate(0deg); }
        .k2 { transform: rotate(72deg) translate(130px) rotate(-72deg); }
        .k3 { transform: rotate(144deg) translate(130px) rotate(-144deg); }
        .k4 { transform: rotate(216deg) translate(130px) rotate(-216deg); }
        .k5 { transform: rotate(288deg) translate(130px) rotate(-288deg); }

        .kanji-circle.explode-mode .k1 { transform: translate(-300px, -400px) rotate(180deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k2 { transform: translate(400px, -200px) rotate(-180deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k3 { transform: translate(300px, 400px) rotate(90deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k4 { transform: translate(-400px, 200px) rotate(-90deg) scale(2.5); opacity: 0; filter: blur(10px); }
        .kanji-circle.explode-mode .k5 { transform: translate(0px, -500px) rotate(45deg) scale(2.5); opacity: 0; filter: blur(10px); }

        .author-btn {
            position: absolute; bottom: 8%; right: 8%; 
            color: #ff2a2a; font-family: 'Tangerine', cursive; 
            font-size: 34px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
            transition: opacity 1s ease; text-shadow: 0 0 12px rgba(255, 42, 42, 0.8);
            animation: pulseText 3s infinite alternate;
        }
        @keyframes pulseText { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* =========================================
           2. PHASE 2: NỘI VIỆN & LÕI K-DRIVE TRONG SUỐT
        ========================================= */
        #sanctum-bg {
            position: fixed; inset: 0; width: 100vw; height: 100dvh;
            background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/INDEX%20SAMURAI.png?raw=true');
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            z-index: 1; opacity: 0; transition: opacity 2.5s ease-in;
        }
        
        .cyber-floor {
            position: fixed; bottom: -20%; left: -50%; width: 200%; height: 60vh;
            background: 
                repeating-linear-gradient(to top, transparent, transparent 30px, rgba(0, 229, 255, 0.15) 31px, transparent 32px),
                repeating-linear-gradient(to right, transparent, transparent 30px, rgba(0, 229, 255, 0.15) 31px, transparent 32px);
            transform: perspective(600px) rotateX(75deg); transform-origin: center bottom;
            animation: gridFlow 1.5s linear infinite; z-index: 2; opacity: 0; pointer-events: none;
            transition: opacity 2.5s ease-in;
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 70%);
        }
        @keyframes gridFlow { 0% { background-position: 0 0; } 100% { background-position: 0 31px; } }

        /* LÕI 3D CÓ THỂ VUỐT */
        #core-wrapper {
            position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
            opacity: 0; z-index: 10; transition: opacity 2s, transform 0.5s; transform: scale(0.9);
        }
        .holy-core-container { position: relative; width: 140px; height: 140px; perspective: 1000px; }
        .holy-cube {
            width: 100%; height: 100%; position: absolute; transform-style: preserve-3d;
            cursor: grab; will-change: transform;
        }
        .holy-cube:active { cursor: grabbing; }

        /* LÕI QUẢ CẦU VÔ NGÃ BÊN TRONG */
        .inner-sphere {
            position: absolute; width: 60px; height: 60px;
            left: 50%; top: 50%; margin-left: -30px; margin-top: -30px;
            border-radius: 50%; transform: translateZ(0);
            transition: all 1.5s ease-in-out; pointer-events: none;
        }
        .core-weak { background-color: #fff; box-shadow: 0 0 30px #fff, inset 0 0 15px #fff; opacity: 0.8; }
        .core-mid { background-color: #ffcc00; box-shadow: 0 0 50px #ffcc00, inset 0 0 25px #ffcc00; }
        .core-max { 
            background-color: #ff0000;
            box-shadow: 0 0 60px #ff0000, 0 0 100px #ff0000, inset 0 0 30px #fff; 
            animation: pulseBlood 1s infinite alternate;
        }
        @keyframes pulseBlood {
            from { transform: translateZ(0) scale(0.9); filter: brightness(1); }
            to { transform: translateZ(0) scale(1.1); filter: brightness(1.5); }
        }
        
        /* MẶT KÍNH TRONG SUỐT HOÀN TOÀN */
        .cube-face {
            position: absolute; width: 140px; height: 140px;
            border: 2px solid rgba(0, 229, 255, 0.8); background: rgba(0, 229, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 0 15px rgba(0, 229, 255, 0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: background 0.3s, box-shadow 0.3s; user-select: none;
        }
        .cube-face:active { background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 50px rgba(0, 229, 255, 1); }

        /* DATA CHỚP NHÁY LIÊN TỤC */
        .sci-label {
            position: absolute; bottom: 8px; width: 100%; text-align: center;
            color: #00e5ff; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            background: rgba(0,0,0,0.4); padding: 4px 0; 
            animation: sciBlink 1.5s infinite; pointer-events: none;
            text-shadow: 0 0 5px #00e5ff;
        }
        @keyframes sciBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* KANJI TO ĐỀU, CĂN GIỮA TUYỆT ĐỐI */
        .kanji-ghost { 
            font-family: "Yu Mincho", serif; font-size: 70px; line-height: 1;
            color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9); pointer-events: none; 
            transform: translateY(-5px);
        }

        .face-front  { transform: rotateY(0deg) translateZ(70px); }
        .face-right  { transform: rotateY(90deg) translateZ(70px); }
        .face-back   { transform: rotateY(180deg) translateZ(70px); }
        .face-left   { transform: rotateY(-90deg) translateZ(70px); }
        .face-top    { transform: rotateX(90deg) translateZ(70px); border-color:#b026ff;
                       box-shadow: 0 0 15px rgba(176,38,255,0.4), inset 0 0 15px rgba(176,38,255,0.2);}
        .face-bottom { transform: rotateX(-90deg) translateZ(70px); }

        /* =========================================
           3. MODULE: HIỆP SĨ BOO (NEON BLOOM)
        ========================================= */
        #boo-module-container {
            position: absolute; inset: 0; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 2s ease-in;
        }
        .boo-hologram {
            position: absolute; width: 70px; height: 70px; top: 15%; right: 10%;
            cursor: grab; display: flex; justify-content: center; align-items: center;
            animation: floatBoo 4s ease-in-out infinite; pointer-events: auto; touch-action: none;
        }
        .boo-hologram:active { cursor: grabbing; transform: scale(1.1); }
        
        .boo-face {
            position: absolute; inset: 3px; 
            background: #ff1493; border-radius: 40% 40% 45% 45%;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8);
            z-index: 2; transition: filter 0.5s;
        }
        .boo-face::before, .boo-face::after {
            content: ''; position: absolute; width: 8px; height: 14px; top: 24px;
            background: #000; border-radius: 50%;
        }
        .boo-face::before { left: 16px; }
        .boo-face::after { right: 16px; }

        .boo-energy-border {
            position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%;
            background: conic-gradient(#00e5ff var(--energy, 100%), transparent 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; padding: 4px; z-index: 3;
            box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; transition: background 1s linear;
        }

        .boo-zzz {
            position: absolute; top: -15px; right: -5px; color: #fff; font-family: monospace; font-size: 18px;
            font-weight: bold; text-shadow: 0 0 8px #ff1493; opacity: 0; pointer-events: none; z-index: 4;
        }
        
        .boo-sleeping { animation: none !important; }
        .boo-sleeping .boo-face { filter: grayscale(0.8) brightness(0.6); box-shadow: none; }
        .boo-sleeping .boo-energy-border { box-shadow: none; }
        .boo-sleeping .boo-zzz { animation: zzzFloat 2s infinite; }
        .boo-glitch .boo-energy-border { filter: hue-rotate(150deg); box-shadow: 0 0 35px #ff0000; animation: glitchHolo 0.2s infinite; }

        @keyframes floatBoo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes glitchHolo { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
        @keyframes zzzFloat { 0% { transform: translate(0, 0) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(15px, -25px) scale(1.2); opacity: 0; } }
        
        .neon-boba {
            position: absolute; bottom: 40px; left: 40px; width: 45px; height: 60px;
            border: 2px solid #00ff80; border-radius: 5px 5px 20px 20px;
            box-shadow: 0 0 25px #00ff80, inset 0 0 15px rgba(0, 255, 128, 0.4);
            background: rgba(0, 255, 128, 0.1); cursor: grab; pointer-events: auto; touch-action: none;
            display: none; z-index: 15;
        }
        .neon-boba::after {
            content: ''; position: absolute; top: -22px; left: -2px; width: 45px; height: 22px;
            border: 2px solid #00ff80; border-radius: 50% 50% 0 0; border-bottom: none;
            box-shadow: 0 -5px 15px rgba(0,255,128,0.5);
        }
        .neon-boba::before {
            content: ''; position: absolute; width: 4px; height: 45px; background: #ff2a2a;
            top: -35px; left: 20px; transform: rotate(15deg); box-shadow: 0 0 15px #ff2a2a; z-index: 2;
        }
        .boba-pearls { position: absolute; bottom: 5px; width: 100%; height: 20px; pointer-events: none; }
        .pearl { 
            position: absolute; width: 10px; height: 10px; border: 2px solid #ff1493; 
            border-radius: 50%; box-shadow: 0 0 10px #ff1493, inset 0 0 5px #ff1493;
        }
        .p1 { left: 5px; bottom: 2px; }
        .p2 { left: 18px; bottom: 0px; }
        .p3 { right: 5px; bottom: 3px; }
        .p4 { left: 12px; bottom: 12px; }
        .p5 { right: 8px; bottom: 10px; }

        /* =========================================
           4. AUDIO HUD & TERMINAL
        ========================================= */
        #audio-hud {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            display: flex; align-items: center; gap: 12px;
            opacity: 0; transition: opacity 2s ease-in; pointer-events: auto;
        }
        .speaker-icon {
            display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px;
        }
        .speaker-icon .bar {
            width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff;
            animation: eqBounce 0.8s infinite alternate ease-in-out; transition: height 0.2s; border-radius: 2px;
        }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; }
        .b2 { height: 16px; animation-delay: 0.3s; }
        .b3 { height: 12px; animation-delay: 0.2s; }
        .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }

        #volume-slider {
            -webkit-appearance: none; appearance: none;
            width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2);
            border-radius: 2px; outline: none; cursor: pointer;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer;
        }

        #terminal-hud {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(0, 15, 25, 0.8); border: 1px solid rgba(0, 229, 255, 0.4);
            border-left: 3px solid #00e5ff; padding: 10px 15px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
            display: flex; align-items: center; z-index: 50;
            opacity: 0; transition: opacity 2s ease-in; pointer-events: none;
        }
        .terminal-text {
            color: #00e5ff; font-family: monospace; font-size: 11px; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.8); white-space: pre-wrap; 
        }
        .terminal-cursor {
            width: 6px; height: 12px; background: #00e5ff; margin-left: 4px;
            animation: cursorBlink 0.8s infinite; display: inline-block;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="kanji-circle" id="kanji-gate" onclick="triggerKhaiMo()">
            <div class="kanji-node k1"><span class="kanji-text">地</span></div>
            <div class="kanji-node k2"><span class="kanji-text">水</span></div>
            <div class="kanji-node k3"><span class="kanji-text">火</span></div>
            <div class="kanji-node k4"><span class="kanji-text">風</span></div>
            <div class="kanji-node k5"><span class="kanji-text">空</span></div>
        </div>
        <div class="author-btn" id="musashi-btn">— Miyamoto Musashi</div>
    </div>

    <div id="audio-hud">
        <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
        </div>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
    </div>
    
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <div id="sanctum-bg"></div>
    <div class="cyber-floor" id="floor-grid"></div>

    <div id="terminal-hud">
        <div class="terminal-text" id="terminal-text"></div>
        <div class="terminal-cursor"></div>
    </div>

    <div id="boo-module-container">
        <div class="boo-hologram" id="boo-knight">
            <div class="boo-energy-border" id="boo-energy"></div>
            <div class="boo-face"></div>
            <div class="boo-zzz" id="boo-zzz">Zzz</div>
        </div>
        
        <div class="neon-boba" id="boba-reward">
            <div class="boba-pearls">
                <div class="pearl p1"></div>
                <div class="pearl p2"></div>
                <div class="pearl p3"></div>
                <div class="pearl p4"></div>
                <div class="pearl p5"></div>
            </div>
        </div>
    </div>

    <div id="core-wrapper">
        <div class="holy-core-container">
            <div class="holy-cube" id="holy-cube">
                <div class="inner-sphere" id="inner-sphere"></div>

                <div class="cube-face face-front" onclick="navToFace('sinh_trac.html')">
                    <div class="kanji-ghost">地</div>
                    <div class="sci-label">BẢN THỂ SCI: <span id="sci-val-1">--</span></div>
                </div>
                <div class="cube-face face-right" onclick="navToFace('thuy_luan.html')">
                    <div class="kanji-ghost">水</div>
                    <div class="sci-label">TÂM LƯU SCI: <span id="sci-val-2">--</span></div>
                </div>
                <div class="cube-face face-back" onclick="navToFace('#')">
                    <div class="kanji-ghost">火</div>
                    <div class="sci-label">BẢN NĂNG SCI: <span id="sci-val-3">--</span></div>
                </div>
                <div class="cube-face face-left" onclick="navToFace('#')">
                    <div class="kanji-ghost">風</div>
                    <div class="sci-label">VẠN BIẾN SCI: <span id="sci-val-4">--</span></div>
                </div>
                <div class="cube-face face-top" style="border-color:#b026ff;" onclick="navToFace('#')">
                    <div class="kanji-ghost" style="font-size: 45px;">契</div>
                    <div class="sci-label" style="color: #ff2a2a; text-shadow: 0 0 5px #ff2a2a;">MUSHI DAYS: 1000</div>
                </div>
                <div class="cube-face face-bottom" onclick="navToFace('#')">
                    <div class="kanji-ghost" style="font-size: 45px;">武</div>
                    <div class="sci-label">BUSHIDO: MAX</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DEMO: TỰ ĐỘNG THAY ĐỔI CHỈ SỐ SCI & MÀU LÕI
        // ==========================================
        let demoStage = 0;
        setInterval(() => {
            let scores;
            if(demoStage === 0) { scores = [40, 45, 30, 40]; } 
            else if(demoStage === 1) { scores = [60, 70, 75, 65]; } 
            else { scores = [85, 90, 95, 99]; } 
             
            document.getElementById('sci-val-1').innerText = scores[0];
            document.getElementById('sci-val-2').innerText = scores[1];
            document.getElementById('sci-val-3').innerText = scores[2];
            document.getElementById('sci-val-4').innerText = scores[3];
            
            let avg = (scores[0] + scores[1] + scores[2] + scores[3]) / 4;
            const sphere = document.getElementById('inner-sphere');
            sphere.className = 'inner-sphere'; 
            
            if (avg < 50) sphere.classList.add('core-weak');
            else if (avg <= 80) sphere.classList.add('core-mid');
            else sphere.classList.add('core-max');
            demoStage = (demoStage + 1) % 3;
        }, 4000); 

        // ==========================================
        // HỆ THỐNG ÂM THANH CYBER & NHẠC NỀN
        // ==========================================
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        bgMusic.volume = 0.5;

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) {
                bgMusic.muted = false; bgMusic.play();
                speakerIcon.classList.remove('muted');
            } else {
                bgMusic.muted = true;
                speakerIcon.classList.add('muted');
            }
        }

        function changeVolume(val) {
            bgMusic.volume = val;
            if (val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); }
            else { bgMusic.muted = true; speakerIcon.classList.add('muted'); }
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if(type === 'deep-boom') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(60, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 3);
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3);
                    osc.start(); osc.stop(ctx.currentTime + 3);
                } else if(type === 'katana') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(1500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if(type === 'brake') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'slurp') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // ==========================================
        // TERMINAL BOO LOGIC (Hiệu ứng gõ phím)
        // ==========================================
        const booLines = [
            "[SYSTEM] K-DRIVE ONLINE...",
            "[CORE] TRẠNG THÁI: CHỜ ĐỒNG BỘ",
            "> LỆNH TỪ BOO: CÀY ẢI SCI ĐỂ NẠP NĂNG LƯỢNG.",
            "> DUY TRÌ VÔ NGÃ: 1000 NGÀY BẮT ĐẦU TỪ HÔM NAY.",
            "> CẢNH BÁO: HỆ THỐNG MENTOR CẦN TRÀ SỮA."
        ];
        let lineIndex = 0;
        let charIndex = 0;
        const terminalText = document.getElementById('terminal-text');
        
        function typeWriter() {
            if (charIndex < booLines[lineIndex].length) {
                terminalText.innerHTML += booLines[lineIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 60);
            } else {
                setTimeout(() => {
                    terminalText.innerHTML = '';
                    charIndex = 0;
                    lineIndex = (lineIndex + 1) % booLines.length;
                    typeWriter();
                }, 4000); // Dừng 4s rồi chuyển dòng lệnh khác
            }
        }

        // ==========================================
        // PHASE 1: KHAI MỞ
        // ==========================================
        function triggerKhaiMo() {
            if(navigator.vibrate) navigator.vibrate([200, 100, 400]);
            playSound('deep-boom');
            bgMusic.play().catch(e => console.log("Trình duyệt chặn autoplay audio")); // Kích hoạt track nhạc
            
            document.getElementById('kanji-gate').classList.add('explode-mode');
            document.getElementById('musashi-btn').style.opacity = '0';
            document.getElementById('intro-screen').style.pointerEvents = 'none';
            document.getElementById('intro-screen').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('sanctum-bg').style.opacity = 1;
                document.getElementById('floor-grid').style.opacity = 1;
                
                setTimeout(() => {
                    document.getElementById('core-wrapper').style.opacity = 1;
                    playSound('katana');
                    document.getElementById('boo-module-container').style.opacity = 1;
                    document.getElementById('audio-hud').style.opacity = 1; // Hiện HUD Audio
                    document.getElementById('terminal-hud').style.opacity = 1; // Hiện HUD Lệnh
                    
                    typeWriter(); // Bắt đầu gõ lệnh Terminal
                    speakMsg("Khịt. Lắng nghe Đạo Musashi là tốt. Nhưng giữ được Vô Ngã 1000 ngày hay không lại là chuyện khác!");
                }, 1000);
            }, 800);
            
            setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 3000);
        }

        function speakMsg(text) {
            try {
                if ('speechSynthesis' in window && !window.speechSynthesis.speaking) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'vi-VN'; utterance.rate = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        }

        // ==========================================
        // VẬT LÝ KHỐI LÕI (IDLE DRIFT - LUÔN TRÔI DẠT)
        // ==========================================
        const cube = document.getElementById('holy-cube');
        let cubeRx = 15, cubeRy = 20;
        let cubeVx = 0.5, cubeVy = 0.8;
        let isCubeDragging = false, isCubeMoved = false;
        let startPx, startPy;
        
        cube.addEventListener('pointerdown', (e) => {
            isCubeDragging = true; isCubeMoved = false; 
            startPx = e.clientX; startPy = e.clientY;
            cubeVx = 0; cubeVy = 0;
            playSound('brake');
            if(navigator.vibrate) navigator.vibrate(20);
            cube.style.cursor = "grabbing";
        });
        window.addEventListener('pointermove', (e) => {
            if (!isCubeDragging) return;
            let dx = e.clientX - startPx; let dy = e.clientY - startPy;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isCubeMoved = true;
            cubeVy = dx * 0.5; cubeVx = -dy * 0.5; 
            startPx = e.clientX; startPy = e.clientY;
        });
        window.addEventListener('pointerup', () => { isCubeDragging = false; cube.style.cursor = "grab"; });
        
        function renderPhysics() {
            if (!isCubeDragging) {
                cubeVx *= 0.95; cubeVy *= 0.95;
                if(Math.abs(cubeVx) < 0.08) cubeVx = (cubeVx >= 0 ? 0.08 : -0.08);
                if(Math.abs(cubeVy) < 0.08) cubeVy = (cubeVy >= 0 ? 0.08 : -0.08);
            }
            cubeRx += cubeVx; cubeRy += cubeVy;
            cube.style.transform = `rotateX(${cubeRx}deg) rotateY(${cubeRy}deg)`;
            requestAnimationFrame(renderPhysics);
        }
        renderPhysics();
        
        function navToFace(url) {
            if (!isCubeMoved) {
                if(navigator.vibrate) navigator.vibrate(50);
                playSound('katana');
                document.getElementById('core-wrapper').style.transform = 'scale(4)';
                document.getElementById('core-wrapper').style.opacity = '0';
                setTimeout(() => { window.location.href = url; }, 500);
            }
        }

        // ==========================================
        // 🌟 MODULE: HIỆP SĨ BOO (ACTION & LOGIC) 🌟
        // ==========================================
        const boo = document.getElementById('boo-knight');
        const booEnergyBorder = document.getElementById('boo-energy');
        const bobaReward = document.getElementById('boba-reward');
        
        let booEnergy = 100; 
        let isBooSleeping = false;
        let isBooDragging = false;
        let booStartX, booStartY, booInitialX, booInitialY;
        let pressTimer;

        setInterval(() => {
            if (booEnergy > 0) {
                booEnergy -= 1;
                booEnergyBorder.style.setProperty('--energy', `${booEnergy}%`);
                if (booEnergy < 20) boo.classList.add('boo-glitch');
                if (booEnergy === 0) forceSleep(true);
            }
        }, 5000);
        setTimeout(() => { bobaReward.style.display = 'block'; }, 8000);

        function forceSleep(isFainted = false) {
            isBooSleeping = true;
            boo.classList.add('boo-sleeping');
            boo.dataset.fainted = isFainted;
            if(navigator.vibrate) navigator.vibrate([30, 30, 30]);
        }

        boo.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isBooDragging = true;
            booStartX = e.clientX; booStartY = e.clientY;
            booInitialX = boo.offsetLeft; booInitialY = boo.offsetTop;
            
            if (booEnergy > 0) {
                pressTimer = setTimeout(() => forceSleep(false), 800);
            }
        });
        window.addEventListener('pointermove', (e) => {
            if(isBooDragging) {
                const dx = e.clientX - booStartX; const dy = e.clientY - booStartY;
                if(Math.abs(dx) > 10 || Math.abs(dy) > 10) clearTimeout(pressTimer);
                boo.style.left = (booInitialX + dx) + 'px';
                boo.style.top = (booInitialY + dy) + 'px';
                boo.style.right = 'auto';
            }
        });
        window.addEventListener('pointerup', (e) => {
            if(isBooDragging) {
                isBooDragging = false;
                clearTimeout(pressTimer);
                
                if (isBooSleeping && boo.dataset.fainted !== "true" && Math.abs(e.clientX - booStartX) < 10) {
                    isBooSleeping = false; 
                    boo.classList.remove('boo-sleeping');
                } else if (!isBooSleeping && Math.abs(e.clientX - booStartX) < 10) {
                    speakMsg("Khịt, kéo thì cứ kéo, đừng có chọc ngoáy ta!");
                }
            }
        });
        
        let isBobaDragging = false, bobaStartX, bobaStartY, bobaInitX, bobaInitY;

        bobaReward.addEventListener('pointerdown', (e) => {
            isBobaDragging = true;
            bobaStartX = e.clientX; bobaStartY = e.clientY;
            bobaInitX = bobaReward.offsetLeft; bobaInitY = bobaReward.offsetTop;
            bobaReward.style.cursor = 'grabbing';
        });
        window.addEventListener('pointermove', (e) => {
            if(isBobaDragging) {
                bobaReward.style.left = (bobaInitX + (e.clientX - bobaStartX)) + 'px';
                bobaReward.style.top = (bobaInitY + (e.clientY - bobaStartY)) + 'px';
            }
        });
        window.addEventListener('pointerup', (e) => {
            if(isBobaDragging) {
                isBobaDragging = false; bobaReward.style.cursor = 'grab';
                
                const bobaRect = bobaReward.getBoundingClientRect();
                const booRect = boo.getBoundingClientRect();
                const overlap = !(bobaRect.right < booRect.left || bobaRect.left > booRect.right || 
                                  bobaRect.bottom < booRect.top || bobaRect.top > booRect.bottom);
                                  
                if (overlap) {
                    playSound('slurp');
                    booEnergy = 100;
                    booEnergyBorder.style.setProperty('--energy', '100%');
                    boo.classList.remove('boo-glitch');
                    
                    isBooSleeping = false;
                    boo.classList.remove('boo-sleeping');
                    boo.dataset.fainted = "false";
                    
                    bobaReward.style.display = 'none';
                    speakMsg("Khịt, ngon đấy! Ta lại tràn đầy sinh lực rồi!");
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                } else {
                    bobaReward.style.left = '40px'; bobaReward.style.bottom = '40px'; bobaReward.style.top = 'auto';
                }
            }
        });
    </script>
</body>
</html>
