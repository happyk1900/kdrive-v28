<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>K-Drive V28 Core</title>

    <link rel="manifest" href="https://happyk1900.github.io/kdrive-v28/manifest.json?v=4">
    <link rel="icon" type="image/png" href="https://happyk1900.github.io/kdrive-v28/K-Icon.png?v=4">
    <link rel="apple-touch-icon" href="https://happyk1900.github.io/kdrive-v28/K-Icon.png?v=4">

    <!-- LÍNH GÁC BẢO MẬT -->
    <script>
        (function checkAuthGuard() {
            const hasAccess = localStorage.getItem('kdrive_logged_in_user') || sessionStorage.getItem('kdrive_session') === 'active';
            if (!hasAccess) { window.location.replace('login.html'); }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kdrive-style.css?v=999">
    
    <style>
        /* 1. KHÓA ẢNH NỀN BAO NÉT */
        #kdrive-bg-container {
            position: fixed !important; 
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/index%20nen.png?raw=true') !important;
            background-size: cover !important; 
            background-position: center center !important; 
            background-repeat: no-repeat !important;
            z-index: 1 !important; 
            pointer-events: none; 
        }

        /* 2. CỔNG SƠN MÔN: BUSHIDO */
        #boot-overlay { position: fixed; inset: 0; background-color: #030508; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease-in-out; touch-action: none; }
        #boot-text { display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #boot-text.ready-to-tap { opacity: 1; pointer-events: auto; cursor: pointer; }
        .kanji-glow { font-family: serif; font-size: 70px; color: #ffffff; text-shadow: 0 0 20px #fff, 0 0 40px #00e5ff, 0 0 80px #00e5ff; margin-bottom: 5px; letter-spacing: 8px; animation: boot-pulse-kanji 1.2s infinite alternate; }
        .bushido-blood { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800; color: #cc0000; letter-spacing: 12px; text-transform: uppercase; position: relative; text-shadow: 2px 2px 0px #330000, 0 0 15px #ff0000; margin-top: 10px; }
        .bushido-blood::after { content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); width: 3px; background-color: #cc0000; border-radius: 0 0 5px 5px; box-shadow: 0 0 8px #ff0000; animation: bloodDrip 2s infinite; }
        @keyframes boot-pulse-kanji { 0% { opacity: 0.8; text-shadow: 0 0 15px #fff, 0 0 30px #00e5ff; transform: scale(0.98); } 100% { opacity: 1; text-shadow: 0 0 30px #fff, 0 0 60px #00e5ff; transform: scale(1.02); } }
        @keyframes bloodDrip { 0% { height: 0px; opacity: 1; transform: translate(-50%, 0); } 60% { height: 25px; opacity: 1; transform: translate(-50%, 0); } 100% { height: 25px; opacity: 0; transform: translate(-50%, 15px); } }

        /* 3. LỚP UI TỐI GIẢN */
        #ui-layer {
            position: absolute; inset: 0; 
            z-index: 10 !important; 
            /* Bỏ flexbox để dùng tọa độ tuyệt đối cho chuẩn xác */
            pointer-events: none; 
        }

        /* 4. LÕI LẬP PHƯƠNG TƯƠNG TÁC - ÉP CỨNG VÀO TÂM MÀN HÌNH */
        #coreSystem {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.3) !important;
            margin: 0 !important;
            bottom: auto !important;
            right: auto !important;
            pointer-events: auto; /* Biến thành nút bấm */
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        #coreSystem:active {
            transform: translate(-50%, -50%) scale(1.1) !important; /* Lõm xuống khi chạm */
            filter: brightness(1.5) drop-shadow(0 0 30px var(--cyan));
        }

        /* Ẩn bong bóng thoại nếu không dùng tới */
        .speech-bubble { display: none !important; }
    </style>
</head>
<body>

    <!-- CỔNG SƠN MÔN (BUSHIDO BOOT SCREEN) -->
    <div id="boot-overlay">
        <div id="boot-text">
            <div class="kanji-glow">武士道</div>
            <div class="bushido-blood">B U S H I D O</div>
        </div>
    </div>

    <!-- ẢNH NỀN SIÊU SẠCH -->
    <div id="kdrive-bg-container"></div>

    <!-- LỚP GIAO DIỆN CHỈ CÒN DUY NHẤT LÕI K-DRIVE -->
    <div id="ui-layer">
        <!-- TÂM: LÕI LẬP PHƯƠNG 3D -->
        <div class="core-system-container" id="coreSystem" onclick="activateCore()">
            <div class="projector-beam"></div>
            <div class="scanning-ring"></div>
            <div class="cube-wrapper" id="cubeWrapper">
                <div class="cube-scene">
                    <div class="cube" id="wireframeCube">
                        <div class="cube-face front"></div><div class="cube-face back"></div>
                        <div class="cube-face right"></div><div class="cube-face left"></div>
                        <div class="cube-face top"></div><div class="cube-face bottom"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT CHÍNH -->
    <script src="core-logic-v2.js?v=99999"></script>

    <script>
        // --- XỬ LÝ KHỞI ĐỘNG HỆ THỐNG ---
        window.addEventListener('load', function() {
            let bootOverlay = document.getElementById('boot-overlay');
            let bootText = document.getElementById('boot-text');

            setTimeout(() => {
                bootText.classList.add('ready-to-tap');
                bootOverlay.addEventListener('click', unlockSystem);
            }, 1500); 
        });

        function unlockSystem() {
            if(typeof playCyberClick === 'function') {
                playCyberClick();
            } else if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            let bootOverlay = document.getElementById('boot-overlay');
            bootOverlay.style.opacity = '0';
            setTimeout(() => { bootOverlay.style.display = 'none'; }, 800); 
        }

        // --- HÀM TƯƠNG TÁC KHI CHẠM VÀO LÕI ---
        function activateCore() {
            if(typeof playCyberClick === 'function') {
                playCyberClick();
            }
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            
            // Tạm thời bật thông báo để test
            alert("LÕI K-DRIVE ĐÃ KÍCH HOẠT! \n\n(Menu tùy chọn sẽ được thiết kế bung ra từ đây)");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
    </script>
</body>
</html>
