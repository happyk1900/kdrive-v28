<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- ĐỒNG BỘ VIEWPORT TRÀN VIỀN TỪ SINH TRẮC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>K-Drive V28 Core</title>

    <link rel="manifest" href="https://happyk1900.github.io/kdrive-v28/manifest.json?v=4">
    <link rel="icon" type="image/png" href="https://happyk1900.github.io/kdrive-v28/K-Icon.png?v=4">
    <link rel="apple-touch-icon" href="https://happyk1900.github.io/kdrive-v28/K-Icon.png?v=4">

    <!-- LÍNH GÁC BẢO MẬT LÕI -->
    <script>
        (function checkAuthGuard() {
            const hasAccess = localStorage.getItem('kdrive_logged_in_user') || sessionStorage.getItem('kdrive_session') === 'active';
            if (!hasAccess) {
                window.location.replace('login.html');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kdrive-style.css?v=999">
    
    <style>
        /* KHÓA CHẾT ẢNH NỀN VÀO KHUNG (CHỐNG LẸM ĐÁY 100%) */
        .locked-bg {
            position: absolute !important; 
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; /* Tối thượng: Ép ảnh khít rịt 4 góc màn hình, dập tắt lẹm đáy */
            z-index: 0;
            pointer-events: none; 
        }

        /* --- CSS CỔNG SƠN MÔN: BUSHIDO --- */
        #boot-overlay {
            position: fixed;
            inset: 0;
            background-color: #030508;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out;
            touch-action: none; 
        }

        #boot-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.5s ease;
        }

        #boot-text.ready-to-tap {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Chữ Kanji sáng lóa */
        .kanji-glow {
            font-family: serif;
            font-size: 70px;
            color: #ffffff;
            text-shadow: 0 0 20px #fff, 0 0 40px #00e5ff, 0 0 80px #00e5ff, 0 0 120px #fff;
            margin-bottom: 5px;
            font-weight: normal;
            letter-spacing: 8px;
            animation: boot-pulse-kanji 1.2s infinite alternate;
        }

        /* Chữ Bushido nhỏ máu */
        .bushido-blood {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #cc0000;
            letter-spacing: 12px;
            text-transform: uppercase;
            position: relative;
            text-shadow: 2px 2px 0px #330000, 0 0 15px #ff0000;
            margin-top: 10px;
        }

        /* Hiệu ứng giọt máu rơi */
        .bushido-blood::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background-color: #cc0000;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 0 8px #ff0000;
            animation: bloodDrip 2s infinite;
        }

        @keyframes boot-pulse-kanji {
            0% { opacity: 0.8; text-shadow: 0 0 15px #fff, 0 0 30px #00e5ff; transform: scale(0.98); }
            100% { opacity: 1; text-shadow: 0 0 30px #fff, 0 0 60px #00e5ff, 0 0 100px #fff; transform: scale(1.02); }
        }

        @keyframes bloodDrip {
            0% { height: 0px; opacity: 1; transform: translate(-50%, 0); }
            60% { height: 25px; opacity: 1; transform: translate(-50%, 0); }
            100% { height: 25px; opacity: 0; transform: translate(-50%, 15px); }
        }
    </style>
</head>
<body>

    <!-- CỔNG SƠN MÔN (BUSHIDO BOOT SCREEN) -->
    <div id="boot-overlay">
        <div id="boot-text">
            <div class="kanji-glow">武士道</div>
            <div class="bushido-blood">B U S H I D O</div>
        </div>
    </div>

    <div id="whiteFlash" class="white-flash-overlay"></div>

    <div class="kdrive-image-wrapper" id="mainWrapper">
        <div class="global-radar"><div class="radar-line"></div></div>

        <!-- ẢNH NỀN GIAO DIỆN CHÍNH -->
        <img src="https://github.com/happyk1900/-m-thanh-app/blob/main/SONMON.png?raw=true" class="kdrive-bg-target locked-bg" id="kdriveBg">
        
        <!-- SÉT HÒM LƠ LỬNG -->
        <div id="lightningRelic" class="lightning-relic" onclick="captureRelic()"></div>
        
        <div class="terminal-stream" id="terminalStream"><div class="terminal-line">> BOO AI: STANDBY...</div></div>
        <div id="bioSyncDisplay" class="bio-sync-hud">[ <span id="heartIcon" class="heart-icon">🤍</span> SYNC: <span id="bpmText">OFFLINE</span> ]</div>
        
        <div class="audio-hud" id="audioHud">
            <div class="shuriken-btn" onclick="cycleMusicTracks()">
                <svg class="shuriken-svg" viewBox="0 0 100 100" width="24" height="24" style="stroke: #ff3333;">
                    <path d="M50 5 L58 42 L95 50 L58 58 L50 95 L42 58 L5 50 L42 42 Z" fill="none" stroke-width="5" />
                    <circle cx="50" cy="50" r="10" fill="none" stroke-width="3" />
                </svg>
            </div>
            <div class="track-display" id="trackText" onclick="toggleMuteSystem()">[ 🔇 SYS: OFF ]</div>
        </div>

        <div class="logout-hud" id="logoutHud" onclick="showLogoutConfirm()">
            <div class="shuriken-btn" style="border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="#00e5ff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </div>
        </div>

        <!-- ĐIỆN THỜ THẦN TÀI LƠ LỬNG -->
        <div class="fab-center pulse" id="cyberAltarBtn" onclick="window.location.href='dien_tho.html'">
            <img src="https://github.com/happyk1900/anh-va-nhac-tram-huan-luyen-chien-binh-/blob/main/ban%20tho%20ong%20dia.png?raw=true" class="avatar-chibi" alt="Thần Tài">
        </div>

        <input type="file" accept="video/*" capture="camcorder" id="hiddenCamera" style="display: none;" onchange="handleVideoUpload(event)">
        <div id="samuraiBubble" class="speech-bubble"><span id="bubbleText"></span></div>

        <!-- KHỐI LẬP PHƯƠNG K-DRIVE CORE (TRUNG TÂM) -->
        <div class="core-system-container" id="coreSystem">
            <div class="projector-beam"></div>
            <div class="scanning-ring"></div>
            <div class="cube-wrapper" id="cubeWrapper">
                    <div class="cube-scene">
                        <div class="cube" id="wireframeCube">
                            <div class="cube-face front"></div><div class="cube-face back"></div>
                            <div class="cube-face right"></div><div class="cube-face left"></div>
                            <div class="cube-face top"></div><div class="cube-face bottom"></div>
                        </div>
                    </div>
            </div>
        </div>

        <!-- CÁC NÚT TƯƠNG TÁC GỐC -->
        <button type="button" class="touch-zone" id="node-samurai" onclick="processSamuraiAction(this)"></button>
        <button type="button" class="touch-zone border-red" id="node-hearts" onclick="openSecretCameraGuard(this)"></button>
        <button type="button" class="touch-zone" id="node-mini-clu" onclick="playCyberClick()"></button>
        <button type="button" class="touch-zone" id="node-chip" onclick="fetchBattleReport()"></button>
        <button type="button" class="touch-zone" id="node-new-9" onclick="playCyberClick()"></button>
        <button type="button" class="touch-zone" id="node-spades" onclick="playCyberClick(); window.location.replace('sinh_trac.html');"></button>
        <button type="button" class="touch-zone" id="node-clubs" onclick="playCyberClick()"></button>
        <button type="button" class="touch-zone border-red" id="node-diamonds" onclick="playCyberClick()"></button>
        <button type="button" class="touch-zone border-red" id="node-mini-dia" onclick="playCyberClick()"></button>

        <!-- NÚT VÀO THỦY LUÂN (CON SÓNG) - FIX TỌA ĐỘ CHUẨN 44.8% LEFT, 19.8% TOP -->
        <button type="button" class="touch-zone" id="node-thuyluan-wave" 
            onclick="if(typeof playCyberClick === 'function') playCyberClick(); window.location.href='thuy_luan.html';" 
            style="position: absolute; left: 44.8%; top: 19.8%; width: 14%; height: 7%; z-index: 100; background: transparent; border: none; cursor: pointer;">
        </button>

    </div>

    <!-- POPUP XÁC NHẬN THOÁT -->
    <div class="gateway-popup" id="logoutConfirmPanel" style="border-color: #ff3333; box-shadow: 0 0 50px rgba(255, 51, 51, 0.4), inset 0 0 20px rgba(255, 51, 51, 0.1);">
        <h2 style="color: #ff3333; text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);">CẢNH BÁO</h2>
        <div style="text-align: center; font-size: 14px; color: #fff; margin-bottom: 20px; font-weight: bold;">BẠN CÓ ĐỒNG Ý THOÁT CHƯƠNG TRÌNH?</div>
        <div style="display: flex; gap: 15px; width: 100%;">
            <button type="button" class="login-btn-submit" style="background: linear-gradient(90deg, #cc0000, #ff3333); color: #fff; box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);" onclick="confirmLogout(true)">CÓ</button>
            <button type="button" class="login-btn-submit" style="background: transparent; border: 1px solid #00ff88; color: #00ff88; box-shadow: none;" onclick="confirmLogout(false)">KHÔNG</button>
        </div>
    </div>
    
    <!-- POPUP TRÌNH PHÁT MẬT THƯ -->
    <div class="video-popup-container" id="videoPopup">
        <button type="button" class="close-popup-btn" onclick="closeVideoModule()">X</button>
        <div class="video-box"><video id="capturedVideoPlayer" playsinline controls></video></div>
    </div>

    <!-- SCRIPT CHÍNH -->
    <script src="core-logic-v2.js?v=99999"></script>

    <!-- HỆ THỐNG CỔNG SƠN MÔN (BUSHIDO BOOT SCREEN) -->
    <script>
        window.addEventListener('load', function() {
            let bootOverlay = document.getElementById('boot-overlay');
            let bootText = document.getElementById('boot-text');

            // BẮT BUỘC ĐỢI 1.5 GIÂY ĐỂ TRÌNH DUYỆT ỔN ĐỊNH HOÀN TOÀN THANH ĐỊA CHỈ
            setTimeout(() => {
                bootText.classList.add('ready-to-tap');
                bootOverlay.addEventListener('click', unlockSystem);
            }, 1500); 
        });

        function unlockSystem() {
            // 1. KHÓA CỨNG CHIỀU CAO BẰNG PIXEL THẬT (CHỐNG CO GIÃN KHI LƯỚT)
            let wrapper = document.getElementById('mainWrapper');
            if(wrapper) {
                // Chốt cứng Pixel, dập tắt vĩnh viễn sự co giãn
                wrapper.style.height = window.innerHeight + 'px';
                wrapper.style.minHeight = window.innerHeight + 'px';
            }

            // 2. PHÁT ÂM THANH KHỞI ĐỘNG
            if(typeof playCyberClick === 'function') {
                playCyberClick();
            } else if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            // 3. MỞ CỔNG: XÓA MÀN HÌNH ĐEN
            let bootOverlay = document.getElementById('boot-overlay');
            bootOverlay.style.opacity = '0';
            
            setTimeout(() => {
                bootOverlay.style.display = 'none';
            }, 800); // Mờ dần trong 0.8s
        }

        // Khóa lại pixel nếu người dùng xoay ngang máy
        window.addEventListener('resize', function() {
            let wrapper = document.getElementById('mainWrapper');
            let bootOverlay = document.getElementById('boot-overlay');
            if(wrapper && bootOverlay && bootOverlay.style.display === 'none') {
                wrapper.style.height = window.innerHeight + 'px';
                wrapper.style.minHeight = window.innerHeight + 'px';
            }
        });

        // Xóa bỏ bộ nhớ đệm cũ
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
        setTimeout(() => { document.body.classList.remove('popups-active'); }, 100);
    </script>
</body>
</html>
