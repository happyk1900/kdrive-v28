<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <title>K-Drive - Sinh Trắc Học</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #050608; --mint: #00ff9d; --cyan: #00e5ff;
            --amber: #ffaa00; --violet: #b026ff; --crimson: #ff2a2a;
            --neon-pink: #ff00ff; --lime: #39ff14;
            --font-display: 'Space Grotesk', sans-serif; 
            --font-terminal: 'Share Tech Mono', monospace;
            --vh: 1vh; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-obsidian); color: white;
            font-family: var(--font-display); overflow: hidden;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh; height: calc(var(--vh, 1vh) * 100); 
            display: flex; justify-content: center; align-items: center;
        }

        /* BACKGROUNDS */
        .tactical-grid-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-obsidian); z-index: 1; perspective: 600px; overflow: hidden; }
        .grid-plane { position: absolute; width: 200vw; height: 200vh; left: -50vw; top: 0%; background-image: linear-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.1) 1px, transparent 1px); background-size: 40px 40px; transform: rotateX(75deg); animation: grid-scroll 10s linear infinite; }
        .vignette { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; background: radial-gradient(circle at center, transparent 30%, #050608 90%); }
        @keyframes grid-scroll { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }
        
        .particle-matrix { position: fixed; top: 50%; left: 50%; z-index: 3; width: 0; height: 0; }
        .particle-wrap { position: absolute; width: 2px; height: 250px; transform-origin: top center; top: 0; left: 0; }
        .particle { position: absolute; bottom: 100%; left: -1px; width: 3px; height: 3px; border-radius: 50%; opacity: 0; }
        @keyframes particle-inward { 0% { transform: translateY(200px); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(20px); opacity: 0; } }
        
        .edge-lighting { position: fixed; inset: 0; z-index: 999; pointer-events: none; transition: box-shadow 1s ease, border 1s ease; box-shadow: inset 0 0 0px transparent; border: 0px solid transparent; }
        body.tier-shiro .edge-lighting { box-shadow: inset 0 0 50px rgba(255, 42, 42, 0.4); border: 2px solid rgba(255, 42, 42, 0.2); }
        body.tier-chairo .edge-lighting { box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.3); border: 2px solid rgba(0, 229, 255, 0.2); }
        body.tier-kuro .edge-lighting { box-shadow: inset 0 0 70px rgba(255, 0, 255, 0.3); border: 2px solid rgba(255, 0, 255, 0.2); animation: edge-breathe 1.5s infinite alternate; }
        @keyframes edge-breathe { 0% { opacity: 0.7; } 100% { opacity: 1; box-shadow: inset 0 0 90px rgba(255, 0, 255, 0.5); border-width: 2px; } }

        /* THANH CHUYỂN ĐỔI CHẾ ĐỘ PHÍA TRÊN (2 TỪ) */
        .mode-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; }
        .mode-btn { font-family: var(--font-terminal); font-size: 11px; background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.3); color: rgba(255,255,255,0.5); padding: 6px 14px; cursor: pointer; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); text-transform: uppercase; transition: all 0.3s; }
        .mode-btn.active { background: rgba(0,229,255,0.15); border-color: var(--cyan); color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }

        /* MODAL POPUP CHUNG */
        .cyber-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(12px); opacity: 0; transition: opacity 0.3s ease; }
        .cyber-modal.active { display: flex; opacity: 1; }
        
        .cyber-led-wrapper { position: relative; padding: 1px; overflow: hidden; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        .cyber-led-wrapper::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, transparent, transparent, rgba(255,255,255,0.3)); animation: spin-led 4s linear infinite; }
        @keyframes spin-led { 100% { transform: rotate(360deg); } }
        
        .modal-box { width: 90vw; max-width: 360px; background: rgba(10, 15, 25, 0.95); padding: 30px 25px; text-align: center; position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        .modal-title { font-family: var(--font-display); color: #fff; font-size: 15px; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }
        
        .ob-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(255,255,255,0.03); padding: 8px 15px; border: 1px solid rgba(255,255,255,0.05); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
        .ob-label { font-family: var(--font-terminal); color: rgba(255,255,255,0.6); font-size: 11px; text-transform: uppercase; }
        .cyber-select { background: transparent; border: none; color: #fff; font-family: var(--font-display); font-size: 16px; text-align: right; width: 100px; outline: none; appearance: none; }
        .cyber-select option { background: var(--bg-obsidian); color: #fff; }

        .modal-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: var(--font-display); font-size: 22px; padding: 10px; text-align: center; margin-bottom: 20px; outline: none; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btn { flex: 1; padding: 12px; font-family: var(--font-display); font-size: 11px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; text-transform: uppercase; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
        .modal-btn.primary { background: var(--cyan); color: #000; font-weight: bold; border: none; }
        .modal-btn:active { opacity: 0.8; }

        /* DASHBOARD LÕI */
        .pwa-container { margin: 0 auto; width: 100%; max-width: 420px; height: 100%; position: relative; background: transparent; display: flex; flex-direction: column; z-index: 10; display: none; opacity: 0; transition: opacity 0.5s ease; }
        
        .core-wrapper { position: relative; flex: 1; width: 100%; display: block; z-index: 10; perspective: 1000px; }
        .arc-reactor { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; height: 340px; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; transition: opacity 1.5s ease; }
        .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; z-index: 5; transition: all 1.5s ease; }
        .orb-group { transform-origin: 170px 170px; transition: all 1s ease; }
        .orb-cw { animation: spin-cw 20s linear infinite; }
        .orb-ccw { animation: spin-ccw 25s linear infinite; }
        .ring { fill: none; stroke-linecap: round; transition: stroke 0.5s ease; }
        .ring-hr { stroke: var(--crimson); stroke-width: 1.5; stroke-dasharray: 4 12; filter: drop-shadow(0 0 3px var(--crimson)); }
        .ring-phys { stroke: var(--mint); stroke-width: 1.5; stroke-dasharray: 10 20; filter: drop-shadow(0 0 3px var(--mint)); }
        .ring-rec { stroke: var(--cyan); stroke-width: 1.5; stroke-dasharray: 15 30; filter: drop-shadow(0 0 3px var(--cyan)); }
        .ring-move { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 5 15; filter: drop-shadow(0 0 3px var(--amber)); }
        .plasma-node { fill: #fff; opacity: 0; transition: opacity 0.5s ease; }

        .sci-nexus { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 15; width: 110px; height: 110px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(176, 38, 255, 0.1) 0%, transparent 70%); box-shadow: inset 0 0 20px rgba(176, 38, 255, 0.05); cursor: pointer; transition: all 1.5s ease; overflow: hidden; }
        .shockwave { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: transparent; border: 4px solid var(--cyan); border-radius: 50%; z-index: 4; opacity: 0; pointer-events: none; }
        .shockwave.active { animation: shockwave-boom 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes shockwave-boom { 0% { width: 10px; height: 10px; opacity: 1; border-width: 15px; } 100% { width: 150vw; height: 150vw; opacity: 0; border-width: 1px; } }

        /* VÂN TAY FLEX-CENTER */
        .fingerprint-wrapper { width: 50px; height: 50px; display: none; justify-content: center; align-items: center; z-index: 20; position: relative; }
        .fingerprint-wrapper svg { width: 100%; height: 100%; stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan)); }
        .fp-scanner-line { position: absolute; width: 120%; height: 3px; background: var(--mint); box-shadow: 0 0 15px 3px var(--mint); left: -10%; border-radius: 50%; display: none; }
        
        .sci-val { font-family: var(--font-display); font-size: 34px; font-weight: 600; color: var(--violet); text-shadow: 0 0 15px rgba(176,38,255,0.5); letter-spacing: 2px; z-index: 2; }
        .sci-lbl { font-family: var(--font-terminal); font-size: 10px; font-weight: 300; color: #fff; letter-spacing: 1px; opacity: 0.6; position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); text-transform: uppercase; }

        body.tier-shiro .ring { stroke-dasharray: 2 30 !important; stroke: var(--crimson) !important; filter: drop-shadow(0 0 3px var(--crimson)); }
        body.tier-shiro .sci-val { color: var(--crimson); text-shadow: 0 0 10px var(--crimson); }
        
        body.tier-chairo .ring { stroke-dasharray: 2000 !important; stroke: var(--cyan) !important; filter: drop-shadow(0 0 3px var(--cyan)); }
        body.tier-chairo .sci-val { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        
        body.tier-kuro .ring { stroke-dasharray: 2000 !important; stroke: var(--neon-pink) !important; filter: drop-shadow(0 0 8px var(--neon-pink)); stroke-width: 2; }
        body.tier-kuro .sci-val { color: #fff; text-shadow: 0 0 20px var(--neon-pink); }

        /* CHẾ ĐỘ STANDBY */
        body.standby-mode .data-panel, body.standby-mode .live-radar-bar { opacity: 0.1; pointer-events: none; filter: grayscale(1); }
        body.standby-mode .ring-svg { opacity: 0.15; }
        body.standby-mode #val-sci { display: none; }
        body.standby-mode .sci-lbl { display: none; }
        body.standby-mode .fingerprint-wrapper { display: flex; animation: pulse-fp 2s infinite alternate; }
        @keyframes pulse-fp { 0% { opacity: 0.3; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1.05); } }

        body.scanning-mode .fingerprint-wrapper { display: flex; }
        body.scanning-mode .fingerprint-wrapper svg { stroke: var(--mint); filter: drop-shadow(0 0 5px var(--mint)); }
        body.scanning-mode .fp-scanner-line { display: block; animation: scan-line 1.2s infinite linear alternate; }
        @keyframes scan-line { 0% { top: -10%; opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { top: 110%; opacity: 0; } }

        body.sync-complete .fingerprint-wrapper { display: none !important; }
        body.sync-complete #val-sci { display: block; animation: sci-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes sci-pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        @keyframes spin-cw { 100% { transform: rotate(360deg); } }
        @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }

        /* 6 CHỈ SỐ CSS */
        .data-panel { position: absolute; z-index: 15; padding: 8px 15px; transition: transform 0.2s, opacity 1.5s ease; background: linear-gradient(90deg, rgba(8, 9, 13, 0.8), transparent); border-left: 2px solid; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; min-width: 80px; cursor: pointer; }
        .data-panel:active { transform: scale(0.95); background: rgba(0, 229, 255, 0.1); }
        .dp-right { border-left: none; border-right: 2px solid; text-align: right; background: linear-gradient(270deg, rgba(8, 9, 13, 0.8), transparent); align-items: flex-end; }
        .dp-val { font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1; }
        .dp-lbl { font-size: 9px; font-weight: 400; color: rgba(255,255,255,0.6); letter-spacing: 1.5px; font-family: var(--font-terminal); text-transform: uppercase; }
        
        .pos-hr { top: 22%; left: 5%; border-color: var(--crimson); } .pos-hr .dp-val { color: var(--crimson); text-shadow: 0 0 5px rgba(255,42,42,0.5); }
        .pos-phys1 { top: 50%; left: 5%; transform: translateY(-50%); border-color: var(--mint); } .pos-phys1 .dp-val { color: var(--mint); text-shadow: 0 0 5px rgba(0,255,157,0.5); }
        .pos-rec1 { top: 78%; left: 5%; transform: translateY(-100%); border-color: var(--cyan); } .pos-rec1 .dp-val { color: var(--cyan); text-shadow: 0 0 5px rgba(0,229,255,0.5); }
        .pos-phys2 { top: 22%; right: 5%; border-color: var(--mint); } .pos-phys2 .dp-val { color: var(--mint); text-shadow: 0 0 5px rgba(0,255,157,0.5); }
        .pos-rec2 { top: 50%; right: 5%; transform: translateY(-50%); border-color: var(--cyan); } .pos-rec2 .dp-val { color: var(--cyan); text-shadow: 0 0 5px rgba(0,229,255,0.5); }
        .pos-move { top: 78%; right: 5%; transform: translateY(-100%); border-color: var(--amber); } .pos-move .dp-val { color: var(--amber); text-shadow: 0 0 5px rgba(255,170,0,0.5); }
        
        /* THANH ALERT */
        .live-radar-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; width: 90%; max-width: 380px; padding: 10px 15px; background: rgba(57, 255, 20, 0.05); border: 1px solid rgba(57, 255, 20, 0.2); border-left: 3px solid var(--lime); font-family: var(--font-terminal); display: flex; align-items: flex-start; flex-direction: column; gap: 6px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: all 0.5s ease;}
        .radar-header { font-size: 13px; font-weight: bold; display: flex; align-items: center; width: 100%; color: var(--lime); animation: pulse-lime 1.2s infinite alternate; text-transform: uppercase; }
        .live-metrics { color: rgba(255,255,255,0.8); display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; font-weight: 300; width: 100%;}
        .metric-item { display: inline-flex; align-items: center; background: rgba(0,0,0,0.5); padding: 4px 8px; border: 1px solid rgba(255,255,255,0.1); }
        @keyframes pulse-lime { 0% { opacity: 0.6; } 100% { opacity: 1; text-shadow: 0 0 8px var(--lime); } }

    </style>
</head>
<body>

    <!-- BACKGROUNDS -->
    <div class="tactical-grid-bg"><div class="grid-plane"></div></div>
    <div class="particle-matrix" id="particle-matrix"></div>
    <div class="vignette"></div>
    <div class="edge-lighting" id="edge-lighting"></div>

    <!-- 2 NÚT CHUYỂN ĐỔI CHẾ ĐỘ PHÍA TRÊN (2 TỪ) -->
    <div class="mode-container">
        <button class="mode-btn active" id="btn-auto" onclick="setMode('auto')">Tự động</button>
        <button class="mode-btn" id="btn-manual" onclick="setMode('manual')">Thủ công</button>
    </div>

    <!-- MODAL POPUP 1: TỔNG QUAN / HỎI Ý ĐỊNH CHỈ SỐ CỐT LÕI -->
    <div class="cyber-modal" id="core-check-modal">
        <div class="cyber-led-wrapper">
            <div class="modal-box">
                <div class="modal-title">CHỈ SỐ CỐT LÕI</div>
                <div id="core-summary-view" style="font-family: var(--font-terminal); font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 20px; line-height: 1.6;">
                    Đang tải thông số...
                </div>
                <div class="modal-btns">
                    <button class="modal-btn" onclick="openOnboardingForm()">Thay đổi</button>
                    <button class="modal-btn primary" onclick="acceptCoreValues()">Đồng ý</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP 2: FORM NHẬP / THAY ĐỔI CHỈ SỐ CỐT LÕI -->
    <div class="cyber-modal" id="onboarding-modal">
        <div class="cyber-led-wrapper">
            <div class="modal-box">
                <div class="modal-title" id="ob-title">THIẾT LẬP LÕI</div>
                <div class="ob-row">
                    <div class="ob-label">NĂM SINH</div>
                    <select id="ob-year" class="cyber-select"></select>
                </div>
                <div class="ob-row">
                    <div class="ob-label">CHIỀU CAO</div>
                    <select id="ob-height" class="cyber-select"></select>
                </div>
                <div class="ob-row">
                    <div class="ob-label">CÂN NẶNG</div>
                    <select id="ob-weight" class="cyber-select"></select>
                </div>
                <div class="modal-btns">
                    <button class="modal-btn" onclick="closeOnboardingForm()">Hủy</button>
                    <button class="modal-btn primary" onclick="submitOnboarding()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP 3: SỬA NHANH TỪNG CHỈ SỐ THỦ CÔNG -->
    <div class="cyber-modal" id="manual-edit-modal">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">SỬA CHỈ SỐ</div>
            <input type="number" id="modal-input-val" class="modal-input" placeholder="0.0" step="0.1">
            <div class="modal-btns">
                <button class="modal-btn" onclick="closeManualModal()">Hủy</button>
                <button class="modal-btn primary" onclick="saveManualValue()">Lưu</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="pwa-container" id="main-pwa">
        <div class="core-wrapper">
            <div class="shockwave" id="shockwave"></div>
            
            <div class="arc-reactor">
                <svg class="ring-svg" viewBox="0 0 340 340">
                    <g class="orb-group orb-ccw orb-move"><circle class="ring ring-move" cx="170" cy="170" r="125" /><circle class="plasma-node" cx="170" cy="45" r="3.5" /></g>
                    <g class="orb-group orb-cw orb-rec"><circle class="ring ring-rec" cx="170" cy="170" r="105" /><circle class="plasma-node" cx="170" cy="65" r="4" /></g>
                    <g class="orb-group orb-ccw orb-phys"><circle class="ring ring-phys" cx="170" cy="170" r="85" /><circle class="plasma-node" cx="170" cy="85" r="4.5" /></g>
                    <g class="orb-group orb-cw orb-hr"><circle class="ring ring-hr" cx="170" cy="170" r="65" /><circle class="plasma-node" cx="170" cy="105" r="5" /></g>
                </svg>

                <div class="sci-nexus" id="trigger-combat" onclick="handleCoreAction()">
                    <div class="fingerprint-wrapper" id="fp-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                          <path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3" />
                          <path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6" />
                          <path d="M12 11v2a14 14 0 0 0 2.5 8" />
                          <path d="M8 15a18 18 0 0 0 1.8 6" />
                          <path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95" />
                        </svg>
                        <div class="fp-scanner-line"></div>
                    </div>
                    <div class="sci-val" id="val-sci">---</div>
                    <div class="sci-lbl">SCI CORE</div>
                </div>
            </div>

            <!-- 6 CHỈ SỐ CỐT LÕI (CHẠM ĐỂ SỬA THỦ CÔNG KHI Ở CHẾ ĐỘ THỦ CÔNG) -->
            <div class="data-panel pos-hr" onclick="promptEdit('hr')"><div class="dp-val blinking" id="val-hr">77</div><div class="dp-lbl">Nhịp tim</div></div>
            <div class="data-panel pos-phys1" onclick="promptEdit('weight')"><div class="dp-val blinking" id="val-weight">61.6</div><div class="dp-lbl">Cân nặng</div></div>
            <div class="data-panel pos-rec1" onclick="promptEdit('sleep')"><div class="dp-val blinking" id="val-sleep">5.8</div><div class="dp-lbl">Giấc ngủ</div></div>
            <div class="data-panel dp-right pos-phys2" onclick="promptEdit('fat')"><div class="dp-val blinking" id="val-fat">15.0</div><div class="dp-lbl">Mỡ cơ thể</div></div>
            <div class="data-panel dp-right pos-rec2" onclick="promptEdit('water')"><div class="dp-val blinking" id="val-water">60.0</div><div class="dp-lbl">Lượng nước</div></div>
            <div class="data-panel dp-right pos-move" onclick="promptEdit('steps')"><div class="dp-val blinking" id="val-steps">331</div><div class="dp-lbl">Bước chân</div></div>
        </div>

        <!-- THANH TRẠNG THÁI -->
        <div class="live-radar-bar" id="live-radar-bar">
            <div class="radar-header" id="live-pulse">🟢 SẴN SÀNG</div>
            <div class="live-metrics" id="live-metrics">CHẠM LÕI ĐỂ ĐỒNG BỘ HOẶC CHỌN THỦ CÔNG ĐỂ NHẬP TAY.</div>
        </div>
    </div>

    <script>
        function fixViewport() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
        window.addEventListener('resize', fixViewport); window.addEventListener('orientationchange', fixViewport); fixViewport();

        let currentMode = 'auto'; // 'auto' hoặc 'manual'
        let currentEditingKey = null;

        window.onload = () => {
            initParticles();
            initSelectOptions();

            if (localStorage.getItem('kdrive_core_initialized') !== 'true') {
                openOnboardingForm();
            } else {
                showCoreCheckModal();
            }
        };

        function initSelectOptions() {
            const y = document.getElementById('ob-year');
            let yHtml = ''; for(let i=1960; i<=2010; i++) yHtml += `<option value="${i}">${i}</option>`; y.innerHTML = yHtml; y.value = 1995;
            
            const h = document.getElementById('ob-height'); 
            let hHtml = ''; for(let i=150; i<=210; i++) hHtml += `<option value="${i}">${i} CM</option>`; h.innerHTML = hHtml; h.value = 175;
            
            const w = document.getElementById('ob-weight'); 
            let wHtml = ''; for(let i=40; i<=120; i++) wHtml += `<option value="${i}">${i} KG</option>`; w.innerHTML = wHtml; w.value = 65;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-auto').classList.toggle('active', mode === 'auto');
            document.getElementById('btn-manual').classList.toggle('active', mode === 'manual');
            playBeep();
        }

        function handleCoreAction() {
            if (currentMode === 'auto') {
                triggerHealthConnectSync();
            } else {
                recalculateAndDisplay();
            }
        }

        /* XỬ LÝ LÕI & POPUP HỎI Ý ĐỊNH */
        function showCoreCheckModal() {
            let y = localStorage.getItem('kdrive_core_year') || '1995';
            let h = localStorage.getItem('kdrive_core_height') || '175';
            let w = localStorage.getItem('kdrive_core_weight') || '65';
            
            document.getElementById('core-summary-view').innerHTML = `
                > Năm sinh: ${y}<br>
                > Chiều cao: ${h} CM<br>
                > Cân nặng mục tiêu: ${w} KG
            `;
            document.getElementById('core-check-modal').classList.add('active');
        }

        function acceptCoreValues() {
            document.getElementById('core-check-modal').classList.remove('active');
            showMainApp();
        }

        function openOnboardingForm() {
            document.getElementById('core-check-modal').classList.remove('active');
            document.getElementById('onboarding-modal').classList.add('active');
        }

        function closeOnboardingForm() {
            document.getElementById('onboarding-modal').classList.remove('active');
            if (localStorage.getItem('kdrive_core_initialized') === 'true') {
                showMainApp();
            }
        }

        function submitOnboarding() {
            let year = document.getElementById('ob-year').value;
            let height = document.getElementById('ob-height').value;
            let weight = document.getElementById('ob-weight').value;

            let age = 2026 - parseInt(year);
            let targetHR = Math.round((220 - age) * 0.75);
            let targetWeight = parseInt(weight);
            let targetFat = 15.0;

            localStorage.setItem('kdrive_core_year', year);
            localStorage.setItem('kdrive_core_height', height);
            localStorage.setItem('kdrive_core_weight', weight);
            localStorage.setItem('kdrive_target_hr', targetHR);
            localStorage.setItem('kdrive_target_weight', targetWeight);
            localStorage.setItem('kdrive_target_fat', targetFat);
            localStorage.setItem('kdrive_core_initialized', 'true');

            playFusionSound();
            closeOnboardingForm();
            showMainApp();
        }

        function showMainApp() {
            document.getElementById('main-pwa').style.display = 'flex';
            setTimeout(() => { document.getElementById('main-pwa').style.opacity = '1'; }, 50);
            loadSavedValues();
        }

        /* SỬA THỦ CÔNG TỪNG CHỈ SỐ */
        function promptEdit(key) {
            if (currentMode !== 'manual') {
                // Nhắc người dùng chuyển sang chế độ thủ công nếu đang ở auto
                setMode('manual');
            }
            currentEditingKey = key;
            const names = { hr: 'Nhịp tim', weight: 'Cân nặng', sleep: 'Giấc ngủ', fat: 'Mỡ cơ thể', water: 'Lượng nước', steps: 'Bước chân' };
            document.getElementById('modal-title').innerText = `Sửa: ${names[key]}`;
            let curVal = document.getElementById(`val-${key}`).innerText;
            document.getElementById('modal-input-val').value = curVal === '---' ? '' : curVal;
            document.getElementById('manual-edit-modal').classList.add('active');
            document.getElementById('modal-input-val').focus();
        }

        function closeManualModal() {
            document.getElementById('manual-edit-modal').classList.remove('active');
            currentEditingKey = null;
        }

        function saveManualValue() {
            let val = document.getElementById('modal-input-val').value;
            if (val !== '' && currentEditingKey) {
                document.getElementById(`val-${currentEditingKey}`).innerText = val;
                localStorage.setItem(`kdrive_manual_${currentEditingKey}`, val);
                recalculateAndDisplay();
            }
            closeManualModal();
        }

        function loadSavedValues() {
            ['hr', 'weight', 'sleep', 'fat', 'water', 'steps'].forEach(key => {
                let saved = localStorage.getItem(`kdrive_manual_${key}`);
                if (saved) {
                    document.getElementById(`val-${key}`).innerText = saved;
                }
            });
            recalculateAndDisplay();
        }

        function recalculateAndDisplay() {
            let liveHR = parseFloat(document.getElementById('val-hr').innerText) || 0;
            let liveWeight = parseFloat(document.getElementById('val-weight').innerText) || 0;
            let liveSleep = parseFloat(document.getElementById('val-sleep').innerText) || 0;
            let liveFat = parseFloat(document.getElementById('val-fat').innerText) || 0;
            let liveWater = parseFloat(document.getElementById('val-water').innerText) || 60.0;
            let liveSteps = parseInt(document.getElementById('val-steps').innerText) || 0;

            document.body.classList.remove('standby-mode', 'sync-complete', 'tier-shiro', 'tier-chairo', 'tier-kuro');
            let sciScore = calculateSCIScore(liveHR, liveSleep, liveSteps, liveWeight, liveFat, liveWater);

            document.body.classList.add('sync-complete');
            playBeep();

            document.getElementById('val-sci').innerText = sciScore;
            
            const radarBar = document.getElementById('live-radar-bar');
            const radarPulse = document.getElementById('live-pulse');
            const radarMetrics = document.getElementById('live-metrics');

            if(sciScore < 50) document.body.classList.add('tier-shiro');
            else if(sciScore < 85) document.body.classList.add('tier-chairo');
            else document.body.classList.add('tier-kuro');

            radarBar.style.background = 'rgba(57, 255, 20, 0.05)';
            radarBar.style.borderColor = 'rgba(57, 255, 20, 0.2)';
            radarBar.style.borderLeftColor = 'var(--lime)';
            radarPulse.style.color = 'var(--lime)';
            radarPulse.innerText = '🟢 ĐÃ CẬP NHẬT';
            radarMetrics.innerHTML = '<span class="metric-item">HỆ THỐNG ĐÃ LƯU THÔNG SỐ</span>';
        }

        function calculateSCIScore(hr, sleep, steps, weight, fat, water) {
            let score = 100;
            if (sleep > 0 && sleep < 7.0) { score -= (7.0 - sleep) * 5; }
            if (steps > 0 && steps < 6000) { score -= ((6000 - steps) / 1000) * 2; }
            let t_fat = parseFloat(localStorage.getItem('kdrive_target_fat')) || 15.0;
            if (fat > t_fat) { score -= (fat - t_fat) * 1.5; }
            if (water > 0 && water < 50.0) { score -= (50.0 - water) * 1; }
            if (score > 100) score = 100;
            if (score < 0) score = 0;
            return score.toFixed(1);
        }

        /* ĐỒNG BỘ TỰ ĐỘNG HEALTH CONNECT */
        async function triggerHealthConnectSync() {
            if(window.isScanning) return; 
            window.isScanning = true;
            
            document.body.classList.remove('standby-mode', 'sync-complete', 'tier-shiro', 'tier-chairo', 'tier-kuro'); 
            document.body.classList.add('scanning-mode');
            
            const radarBar = document.getElementById('live-radar-bar');
            const radarPulse = document.getElementById('live-pulse'); 
            const radarMetrics = document.getElementById('live-metrics');
            
            radarBar.style.background = 'rgba(0, 229, 255, 0.05)';
            radarBar.style.borderColor = 'rgba(0, 229, 255, 0.2)';
            radarBar.style.borderLeftColor = 'var(--cyan)';
            radarPulse.style.color = 'var(--cyan)';
            radarPulse.innerText = '⚡ ĐANG QUÉT...';
            radarMetrics.innerHTML = 'ĐANG KẾT NỐI HEALTH CONNECT...';

            playChargeSound(); 
            if(navigator.vibrate) navigator.vibrate([50, 100, 50]);

            try {
                const Health = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Health ? window.Capacitor.Plugins.Health : null;
                if (!Health) throw new Error("Capacitor Health Plugin chưa sẵn sàng.");

                const withTimeout = (promise, timeoutMs = 8000) => {
                    return Promise.race([
                        promise,
                        new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), timeoutMs))
                    ]);
                };

                await withTimeout(Health.requestAuthorization({ read: ['steps', 'heartRate', 'sleep', 'weight', 'bodyFat'] }));

                const endDate = new Date();
                const startDate = new Date(Date.now() - 48 * 3600000);
                const queryOptions = { startDate: startDate.toISOString(), endDate: endDate.toISOString() };

                let liveSteps = 331;
                try {
                    const res = await withTimeout(Health.querySamples({ ...queryOptions, dataType: 'steps' }));
                    let list = res.samples || res.values || (Array.isArray(res) ? res : []);
                    let sum = 0; list.forEach(i => sum += parseInt(i.value || 0));
                    if(sum > 0) liveSteps = sum;
                } catch(e){}

                let liveHR = 77;
                try {
                    const res = await withTimeout(Health.querySamples({ ...queryOptions, dataType: 'heartRate' }));
                    let list = res.samples || res.values || (Array.isArray(res) ? res : []);
                    if(list.length > 0) liveHR = parseInt(list[list.length - 1].value || 77);
                } catch(e){}

                let liveSleep = 5.8;
                try {
                    const res = await withTimeout(Health.querySamples({ ...queryOptions, dataType: 'sleep' }));
                    let list = res.samples || res.values || (Array.isArray(res) ? res : []);
                    let mins = 0; list.forEach(r => {
                        let d = r.duration ? (r.duration / 60) : ((new Date(r.endTime) - new Date(r.startTime)) / 60000);
                        if(d > 0) mins += d;
                    });
                    if(mins > 0) liveSleep = (mins / 60).toFixed(1);
                } catch(e){}

                let liveWeight = 61.6;
                try {
                    const res = await withTimeout(Health.querySamples({ ...queryOptions, dataType: 'weight' }));
                    let list = res.samples || res.values || (Array.isArray(res) ? res : []);
                    if(list.length > 0) liveWeight = parseFloat(list[list.length - 1].value || 61.6).toFixed(1);
                } catch(e){}

                let liveFat = 15.0;
                try {
                    const res = await withTimeout(Health.querySamples({ ...queryOptions, dataType: 'bodyFat' }));
                    let list = res.samples || res.values || (Array.isArray(res) ? res : []);
                    if(list.length > 0) liveFat = parseFloat(list[list.length - 1].value || 15.0).toFixed(1);
                } catch(e){}

                let liveWater = 60.0;

                document.getElementById('val-hr').innerText = liveHR;
                document.getElementById('val-weight').innerText = liveWeight;
                document.getElementById('val-sleep').innerText = liveSleep;
                document.getElementById('val-fat').innerText = liveFat;
                document.getElementById('val-water').innerText = liveWater;
                document.getElementById('val-steps').innerText = liveSteps;

                localStorage.setItem('kdrive_manual_hr', liveHR);
                localStorage.setItem('kdrive_manual_weight', liveWeight);
                localStorage.setItem('kdrive_manual_sleep', liveSleep);
                localStorage.setItem('kdrive_manual_fat', liveFat);
                localStorage.setItem('kdrive_manual_water', liveWater);
                localStorage.setItem('kdrive_manual_steps', liveSteps);

                stopChargeSound(); 
                document.body.classList.remove('scanning-mode');
                recalculateAndDisplay();

            } catch (error) {
                stopChargeSound(); 
                document.body.classList.remove('scanning-mode');
                radarPulse.style.color = 'var(--crimson)'; 
                radarPulse.innerText = '🔴 LỖI ĐỒNG BỘ';
                radarMetrics.innerHTML = "HÃY CHUYỂN SANG THỦ CÔNG ĐỂ NHẬP TAY.";
            }
            window.isScanning = false;
        }

        /* TIỆN ÍCH HIỆU ỨNG & ÂM THANH */
        function initParticles() { 
            const matrix = document.getElementById('particle-matrix'); if (matrix.children.length > 0) return; 
            const colors = ['#00ff9d', '#00e5ff', '#b026ff']; 
            for(let i = 0; i < 45; i++) { 
                let wrapper = document.createElement('div'); wrapper.className = 'particle-wrap'; wrapper.style.transform = `rotate(${Math.random() * 360}deg)`; 
                let p = document.createElement('div'); p.className = 'particle'; p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; 
                p.style.boxShadow = `0 0 8px ${p.style.backgroundColor}`; p.style.animation = `particle-inward ${2.5 + Math.random() * 3}s infinite ${Math.random() * 5}s linear`; 
                wrapper.appendChild(p); matrix.appendChild(wrapper); 
            } 
        }

        let audioCtx; 
        function initAudio() { try { if(!audioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; if(AudioContext) audioCtx = new AudioContext(); } } catch(e) { } }
        function playBeep() { try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.frequency.value = 800; gain.gain.value = 0.1; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } catch(e){} }
        function playFusionSound() { try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 1.5); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.5); } catch(e){} }
        let chargeOsc, chargeGain;
        function playChargeSound() { try { stopChargeSound(); initAudio(); chargeOsc = audioCtx.createOscillator(); chargeGain = audioCtx.createGain(); chargeOsc.type = 'square'; chargeOsc.frequency.setValueAtTime(100, audioCtx.currentTime); chargeOsc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 3); chargeGain.gain.setValueAtTime(0.05, audioCtx.currentTime); chargeOsc.connect(chargeGain); chargeGain.connect(audioCtx.destination); chargeOsc.start(); } catch(e){} }
        function stopChargeSound() { if(chargeOsc) { chargeOsc.stop(); chargeOsc.disconnect(); chargeOsc = null; } }
    </script>
</body>
</html>
