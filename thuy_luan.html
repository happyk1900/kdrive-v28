<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* NỀN THỦY LUÂN MỚI (SÂU THẲM) */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/THUY%20LUAN.png?raw=true'); background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP-HUD CỐ ĐỊNH (Z-INDEX 9999) - KHÔNG BAO GIỜ MẤT */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 9999; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; opacity: 0; transition: opacity 1s ease 1s; }
        .assembled #top-hud { opacity: 1; }
        
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        .title-hologram { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(-50px); color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; text-shadow: 0 0 8px rgba(255,255,255,0.8); z-index: 50; pointer-events: none; opacity: 0; transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s; }
        .assembled .title-hologram { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* KHỐI ẢI: NỀN ĐEN ĐỤC, VIỀN VÀNG SẮC NÉT */
        #task-container { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; pointer-events: none; }
        .card-wrapper { transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: auto; }
        #wrapper-1 { transform: translateX(-150vw); opacity: 0; }
        #wrapper-3 { transform: translateX(150vw); opacity: 0; }
        #wrapper-2 { transform: translateY(150vh); opacity: 0; }
        .assembled #wrapper-1 { transform: translateX(0); opacity: 1; transition-delay: 0.2s; }
        .assembled #wrapper-3 { transform: translateX(0); opacity: 1; transition-delay: 0.4s; }
        .assembled #wrapper-2 { transform: translateY(0); opacity: 1; transition-delay: 0.6s; }
        
        .holo-card { width: 95px; height: 110px; background: rgba(0, 5, 10, 0.85); border: 1px solid #ffd700; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.2); cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s ease; }
        .holo-card:hover { background: rgba(255, 215, 0, 0.1); box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.4); }
        
        .float-1 { animation: floatA 4s ease-in-out infinite; }
        .float-2 { animation: floatB 5s ease-in-out infinite 0.5s; height: 130px; margin-bottom: 20px; }
        .float-3 { animation: floatC 4.5s ease-in-out infinite 1s; }
        @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
        @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); margin-bottom: 8px; font-weight: bold; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; color: #ffffff; text-align: center; line-height: 1.4; letter-spacing: 1px; }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #a0a0a0; margin-top: 10px; letter-spacing: 1.5px; font-weight: bold; transition: color 0.3s; text-transform: uppercase; }
        .completed-text { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255,215,0,0.6) !important; }

        /* DẢI BĂNG HỆ THỐNG: NỀN ĐEN, VIỀN XANH CYAN */
        #terminal-bar { position: fixed; bottom: 85px; left: 0; width: 100vw; background: rgba(0, 5, 10, 0.85); border-top: 1px solid #00e5ff; border-bottom: 1px solid #00e5ff; padding: 12px 0; text-align: center; z-index: 45; opacity: 0; transform: translateY(50px); transition: all 1s ease 1.5s; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .assembled #terminal-bar { opacity: 1; transform: translateY(0); }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,255,255,0.8); white-space: nowrap; }
        
        /* ACTION PANEL: BỎ NGOẶC [] VÀ ĐỒNG BỘ VÀNG GOLD */
        #action-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px); display: flex; gap: 20px; z-index: 50; opacity: 0; transition: all 1s ease 1.7s; pointer-events: auto; width: 90%; max-width: 350px; justify-content: center; }
        .assembled #action-panel { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .btn-action { color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; background: rgba(0, 5, 10, 0.85); border: 1px solid #ffd700; cursor: pointer; text-transform: uppercase; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        .btn-action:hover { background: rgba(255, 215, 0, 0.15); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .btn-action:active { background: rgba(255, 215, 0, 0.3); }
        .btn-action.glow { animation: pulseYellow 2s infinite alternate; }
        @keyframes pulseYellow { 0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2), inset 0 0 5px rgba(255, 215, 0, 0.1); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); } 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.4); text-shadow: 0 0 15px rgba(255, 215, 0, 1); } }
        .btn-action.disabled { color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); animation: none; pointer-events: none; box-shadow: none; }

        /* BẢNG LORE (GIAO THỨC) */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.05); z-index: 10000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 229, 255, 0.4); padding-bottom: 10px; }
        .lore-title { color: #00e5ff; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 14px; text-shadow: 0 0 8px rgba(0,229,255,0.8); }
        .lore-close { color: #ff2a2a; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff2a2a; }
        .lore-content { color: #ffffff; font-size: 12px; line-height: 1.6; min-height: 190px; font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #00e5ff; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; }

        /* ================= ĐẤU TRƯỜNG NHIỆM VỤ ================= */
        #task-arena { position: fixed; inset: 0; background: rgba(0, 10, 20, 0.9); backdrop-filter: blur(5px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        
        .arena-box { width: 90%; max-width: 380px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .arena-header-bar { display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid rgba(255,215,0,0.4); padding-bottom: 10px; align-items: flex-end; }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #ffd700; letter-spacing: 2px; font-weight: bold; }
        .arena-stats { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #fff; text-align: right; line-height: 1.6; }
        .highlight-score { color: #00ff66; font-weight: bold; font-size: 15px; }

        /* THANH ÁP LỰC 60s (Chỉ hiện ở Game 3) */
        #timer-bar-container { width: 100%; height: 4px; background: rgba(0, 229, 255, 0.15); border-radius: 2px; overflow: hidden; margin-top: 2px; display: none; }
        #timer-progress { width: 100%; height: 100%; background: #00e5ff; transition: width 0.1s linear, background 0.3s ease; }
        #timer-progress.danger { background: #ff3366; animation: flashDanger 0.5s infinite; box-shadow: 0 0 10px #ff3366; }
        @keyframes flashDanger { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .boo-dialog { font-size: 12px; font-family: 'Share Tech Mono', monospace; color: #fff; width: 100%; min-height: 30px; display: flex; align-items: center; justify-content: center; opacity: 0.8; margin-top: 10px; }
        .boo-tag { color: #00e5ff; font-weight: bold; margin-right: 5px; }

        /* BỎ NGOẶC [] Ở NÚT KHAI TRẬN / THOÁT */
        .arena-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 12px 20px; cursor: pointer; transition: all 0.3s; border-radius: 4px; width: 100%; max-width: 200px; margin-top: 5px; text-transform: uppercase; }
        .arena-btn:hover { background: rgba(255, 215, 0, 0.2); box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .btn-red { border-color: #ff3366 !important; color: #ff3366 !important; background: transparent !important; }
        .btn-red:hover { background: rgba(255, 51, 102, 0.1) !important; box-shadow: 0 0 10px rgba(255,51,102,0.4) !important; }

        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; }
        .game-container.active { display: flex; }

        /* GAME 1 & 2 GRID */
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 220px; height: 220px; margin: 10px auto; }
        .grid-cell { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease; }
        .grid-cell.active-glow { background: #00e5ff; box-shadow: 0 0 15px #00e5ff; }
        .grid-cell.user-pick { background: rgba(255, 215, 0, 0.5); border-color: #ffd700; }
        .grid-cell.correct { background: #00ff66; box-shadow: 0 0 15px #00ff66; }
        .grid-cell.wrong { background: #ff3366; box-shadow: 0 0 15px #ff3366; }

        /* GAME 3: TÂM TRẬN & KHÍ CỤ ĐỒNG MÀU XANH CYAN */
        .sequence-display { height: 60px; display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; width: 100%; }
        .input-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; padding: 0 10px; }
        .btn-symbol { padding: 18px 0; display: flex; justify-content: center; align-items: center; background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.4); border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-symbol:active { background: rgba(0,229,255,0.3); border-color: #00e5ff; }
        
        .hidden-box { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.5); font-size: 20px; font-family: monospace; border: 1px dashed rgba(255,255,255,0.3); border-radius: 4px; }
        .empty-slot { width: 30px; height: 2px; background: rgba(255,255,255,0.2); }

        /* CSS Thuần vẽ 4 vũ khí - ĐỒNG BỘ 100% XANH CYAN */
        .weapon { position: relative; display: inline-block; filter: drop-shadow(0 0 3px #00e5ff); }
        
        /* 1. Kiếm */
        .w-sword { width: 4px; height: 24px; background: #00e5ff; border-radius: 2px 2px 0 0; margin-top: -5px; }
        .w-sword::before { content:''; position:absolute; top: 16px; left: -6px; width: 16px; height: 2px; background: #00e5ff; }
        
        /* 2. Khiên */
        .w-shield { width: 18px; height: 22px; border: 2px solid #00e5ff; border-radius: 4px 4px 10px 10px; box-shadow: inset 0 0 3px #00e5ff; }
        
        /* 3. Cung */
        .w-bow { width: 14px; height: 26px; border-left: 3px solid #00e5ff; border-radius: 50%; position: relative; margin-left: 5px; }
        .w-bow::after { content:''; position:absolute; top: 0; bottom: 0; left: 1px; width: 1px; background: #00e5ff; }

        /* 4. Phi Tiêu */
        .w-shuriken { width: 20px; height: 20px; background: #00e5ff; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .combo-text { color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; position: absolute; top: 70px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .combo-text.active { opacity: 1; animation: pop 0.3s ease; }
        .combo-text.broken { color: #ff3366; text-shadow: 0 0 10px #ff3366; }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1.2); } }
    </style>
</head>
<body>

    <!-- ẢNH NỀN MỚI SÂU THẲM -->
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <!-- NHẠC NỀN MỚI (Kai-Ripe Morning) -->
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai-Ripe%20Morning.mp3"></audio>

    <!-- TOP-HUD BẤT TỬ -->
    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <!-- BẢNG GIAO THỨC -->
    <div id="lore-modal">
        <div class="lore-header"><span class="lore-title">GIAO THỨC THỦY LUÂN</span><span class="lore-close" onclick="closeLore()">X</span></div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls"><div class="lore-nav" onclick="prevPage()">[ < ]</div><div class="lore-page-indicator" id="lore-page-num">1 / 3</div><div class="lore-nav" onclick="nextPage()">[ > ]</div></div>
    </div>

    <div class="title-hologram" id="thuy-luan-title">ĐẠO TRƯỜNG THỦY LUÂN</div>

    <!-- 3 KHỐI ẢI CHUẨN VIỀN VÀNG -->
    <div id="task-container">
        <div class="card-wrapper" id="wrapper-1">
            <div class="holo-card float-1" id="card-1" onclick="openGameArena('1', 'I. TĨNH KHÍ')">
                <div class="card-icon">I</div>
                <div class="card-title">TĨNH KHÍ<br>(5 Vòng)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
        
        <div class="card-wrapper" id="wrapper-2">
            <div class="holo-card float-2" id="card-2" onclick="openGameArena('2', 'II. LƯU THỦY')"> 
                <div class="card-icon">II</div>
                <div class="card-title">LƯU THỦY<br>(5 Vòng)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>

        <div class="card-wrapper" id="wrapper-3">
            <div class="holo-card float-3" id="card-3" onclick="openGameArena('3', 'III. TÂM TRẬN')">
                <div class="card-icon">III</div>
                <div class="card-title">TÂM TRẬN<br>(60s)</div>
                <div class="card-status">CHƯA XONG</div>
            </div>
        </div>
    </div>

    <div id="terminal-bar">
        <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: KHỞI ĐỘNG ĐẠO TRƯỜNG...</span>
    </div>

    <div id="action-panel">
        <button class="btn-action" onclick="navToCore()">TRỞ VỀ LÕI</button>
        <button class="btn-action disabled" id="btn-save-score" onclick="saveScore()">LƯU ĐIỂM</button>
    </div>

    <!-- ĐẤU TRƯỜNG -->
    <div id="task-arena">
        <div class="arena-box">
            <div class="arena-header-bar">
                <div class="arena-title" id="arena-title">TÊN ẢI</div>
                <div class="arena-stats">
                    <span id="stat-label">VÒNG:</span> <span id="arena-round">1 / 5</span><br>
                    ĐIỂM: <span class="highlight-score" id="arena-score">0</span>
                </div>
            </div>
            
            <!-- THANH ÁP LỰC 60s -->
            <div id="timer-bar-container"><div id="timer-progress"></div></div>
            
            <div id="combo-display" class="combo-text">COMBO x2</div>
            
            <!-- GAME 1 & 2 -->
            <div id="game-1-container" class="game-container">
                <div class="grid-3x3" id="grid-1"></div>
            </div>
            <div id="game-2-container" class="game-container">
                <div class="grid-3x3" id="grid-2"></div>
            </div>

            <!-- GAME 3: TÂM TRẬN -->
            <div id="game-3-container" class="game-container">
                <div class="sequence-display" id="seq-area"></div>
                <div class="input-area">
                    <button class="btn-symbol" onclick="addToUserSeq(0)"><div class="weapon w-sword"></div></button>
                    <button class="btn-symbol" onclick="addToUserSeq(1)"><div class="weapon w-shield"></div></button>
                    <button class="btn-symbol" onclick="addToUserSeq(2)"><div class="weapon w-bow"></div></button>
                    <button class="btn-symbol" onclick="addToUserSeq(3)"><div class="weapon w-shuriken"></div></button>
                </div>
            </div>

            <div class="boo-dialog">
                <span class="boo-tag">[BOO]:</span> <span id="boo-msg">Chuẩn bị tĩnh tâm bước vào thử thách.</span>
            </div>

            <!-- NÚT ĐÃ BỎ NGOẶC [] -->
            <button class="arena-btn" id="arena-btn" onclick="startArenaRound()">KHAI TRẬN</button>
            <button class="arena-btn btn-red" id="close-arena-btn" onclick="closeTaskArena()">THOÁT</button>
        </div>
    </div>

    <script>
        // ================= HỆ THỐNG ÂM THANH & CƠ BẢN =================
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'error') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if(type === 'coin') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime); 
                    osc.frequency.setValueAtTime(1600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // ================= LORE =================
        const lorePagesHTML = [
            "<b style='font-size:13px;'>TỔNG QUAN: TRÍ TUỆ THỦY LUÂN</b><br><br>Đạo của Nước là uyển chuyển, linh hoạt và không ngừng nghỉ.<br><br>Hoàn thành 3 thử thách cốt lõi để duy trì TRÍ TUỆ: Tĩnh Khí, Lưu Thủy và Tâm Trận.",
            "<b style='font-size:13px;'>I & II: TĨNH KHÍ VÀ LƯU THỦY</b><br><br>• Hoàn thành liên tục 5 vòng. <br>• Đoán đúng: +20 Điểm. Sai: -10 Điểm. <br>• Áp lực yêu cầu sự tĩnh tâm tuyệt đối.",
            "<b style='font-size:13px;'>III. TÂM TRẬN (TỬ THẦN)</b><br><br>• Đưa ra quyết định trong vòng 60 giây. <br>• Khí cụ chỉ hiện 1.5s rồi biến mất.<br>• Ăn chuỗi Combo x2, x3 để nhân điểm. Sai 1 nhịp sẽ Gãy Chuỗi!"
        ];
        let currentLorePage = 0; let isLoreOpen = false;
        function openLore() { isLoreOpen = true; document.getElementById('lore-modal').classList.add('active'); renderLorePage(); playSound('katana'); }
        function closeLore() { isLoreOpen = false; document.getElementById('lore-modal').classList.remove('active'); playSound('brake'); }
        function renderLorePage() { document.getElementById('lore-text').innerHTML = lorePagesHTML[currentLorePage]; document.getElementById('lore-page-num').innerText = `${currentLorePage + 1} / 3`; }
        function nextPage() { if(currentLorePage < 2) { currentLorePage++; renderLorePage(); playSound('brake'); } }
        function prevPage() { if(currentLorePage > 0) { currentLorePage--; renderLorePage(); playSound('brake'); } }

        window.onload = () => {
            const now = new Date();
            document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('sanctum-bg').style.opacity = '1';
            
            if(localStorage.getItem('bg_music_time')) bgMusic.currentTime = parseFloat(localStorage.getItem('bg_music_time'));
            if(localStorage.getItem('bg_music_muted') === 'true') { bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; } 
            else { bgMusic.muted = false; bgMusic.play().catch(e => {}); }

            setTimeout(() => { document.body.classList.add('assembled'); }, 300);
            setTimeout(updateSystemTerminal, 2500);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } 
            else { bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); }
        }
        function changeVolume(val) { bgMusic.volume = val; if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } }

        // ================= BIẾN TOÀN CỤC & UI =================
        let thuyLuanTasks = { '1': false, '2': false, '3': false };
        let currentGame = '1';
        let currentRound = 1;
        let arenaScore = 0;
        let isPlaying = false;
        let canClick = false;

        let t1Pattern = [], t1User = [];
        let t2Path = [], t2User = [];
        let t3Seq = [], t3User = [];
        let t3Combo = 0;
        
        let t3TimerInterval;
        let t3TimeTotal = 60;
        let t3TimeLeft = 60;
        let t3HideTimeout;

        const weaponsHTML = [
            '<div class="weapon w-sword"></div>',
            '<div class="weapon w-shield"></div>',
            '<div class="weapon w-bow"></div>',
            '<div class="weapon w-shuriken"></div>'
        ];

        for(let i=0; i<9; i++) {
            let c1 = document.createElement('div'); c1.className = 'grid-cell'; c1.onclick = () => handleGame1Click(i, c1); document.getElementById('grid-1').appendChild(c1);
            let c2 = document.createElement('div'); c2.className = 'grid-cell'; c2.onclick = () => handleGame2Click(i, c2); document.getElementById('grid-2').appendChild(c2);
        }

        function updateSystemTerminal() {
            let pending = Object.keys(thuyLuanTasks).find(k => !thuyLuanTasks[k]);
            let msgEl = document.getElementById('sys-msg');
            let saveBtn = document.getElementById('btn-save-score');
            if (pending) {
                let name = pending === '1' ? 'TĨNH KHÍ' : pending === '2' ? 'LƯU THỦY' : 'TÂM TRẬN';
                msgEl.innerHTML = `>_ [HỆ THỐNG]: CHỜ HOÀN THÀNH [${name}].`;
                saveBtn.classList.remove('glow'); saveBtn.classList.add('disabled');
            } else {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: ĐẠO TRƯỜNG VIÊN MÃN. HÃY LƯU ĐIỂM.`;
                saveBtn.classList.remove('disabled'); saveBtn.classList.add('glow'); playSound('katana');
            }
        }

        function booMsg(text) { document.getElementById('boo-msg').innerText = text; }

        function openGameArena(id, name) {
            playSound('katana');
            currentGame = id; arenaScore = 0; currentRound = 1; t3Combo = 0;
            document.getElementById('task-container').style.pointerEvents = 'none';
            document.getElementById('arena-title').innerText = name;
            
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`game-${id}-container`).classList.add('active');
            
            document.getElementById('arena-score').innerText = '0';
            
            if(id === '3') {
                document.getElementById('stat-label').style.display = 'none';
                document.getElementById('arena-round').style.display = 'none';
                document.getElementById('timer-bar-container').style.display = 'block';
                document.getElementById('timer-progress').style.width = '100%';
                document.getElementById('timer-progress').classList.remove('danger');
            } else {
                document.getElementById('stat-label').style.display = 'inline';
                document.getElementById('arena-round').style.display = 'inline';
                document.getElementById('timer-bar-container').style.display = 'none';
                document.getElementById('stat-label').innerText = "VÒNG:";
                document.getElementById('arena-round').innerText = "1 / 5";
            }
            
            document.getElementById('arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').innerText = "THOÁT";
            booMsg("Tập trung tinh thần. Sẵn sàng!");
            
            document.querySelectorAll('.grid-cell').forEach(c => { c.className = 'grid-cell'; });
            document.getElementById('seq-area').innerHTML = '';
            document.getElementById('combo-display').classList.remove('active');
            
            document.getElementById('task-arena').classList.add('active');
        }

        function closeTaskArena() {
            playSound('brake');
            clearInterval(t3TimerInterval);
            clearTimeout(t3HideTimeout);
            document.getElementById('task-arena').classList.remove('active');
            document.getElementById('task-container').style.pointerEvents = 'auto';
        }

        function startArenaRound() {
            isPlaying = true; canClick = false;
            document.getElementById('arena-btn').style.display = 'none';
            document.getElementById('close-arena-btn').style.display = 'none';
            playSound('boing');
            
            if(currentGame === '1') runGame1();
            else if(currentGame === '2') runGame2();
            else if(currentGame === '3') runGame3();
        }

        function showCombo(text, isBroken = false) {
            let el = document.getElementById('combo-display');
            el.innerText = text;
            el.className = 'combo-text active' + (isBroken ? ' broken' : '');
            setTimeout(() => el.classList.remove('active'), 800);
        }

        // ================= ẢI 1: TĨNH KHÍ (5 Vòng Liên Tục) =================
        function runGame1() {
            if(currentRound > 5) return finishArena(50);
            document.getElementById('arena-round').innerText = `${currentRound} / 5`;
            t1Pattern = []; t1User = [];
            while(t1Pattern.length < 3) {
                let r = Math.floor(Math.random() * 9);
                if(!t1Pattern.includes(r)) t1Pattern.push(r);
            }
            let cells = document.getElementById('grid-1').children;
            for(let i=0; i<9; i++) cells[i].className = 'grid-cell';
            
            booMsg("Ghi nhớ trận pháp...");
            t1Pattern.forEach(idx => cells[idx].classList.add('active-glow'));
            
            setTimeout(() => {
                t1Pattern.forEach(idx => cells[idx].classList.remove('active-glow'));
                booMsg("Tái lập lại!"); canClick = true;
            }, 1000);
        }
        function handleGame1Click(idx, cellEl) {
            if(!canClick || t1User.includes(idx)) return;
            t1User.push(idx); cellEl.classList.add('user-pick');
            
            if(t1User.length === 3) {
                canClick = false;
                let correct = t1User.filter(v => t1Pattern.includes(v)).length;
                let cells = document.getElementById('grid-1').children;
                if(correct === 3) {
                    t1User.forEach(i => cells[i].classList.replace('user-pick', 'correct'));
                    arenaScore += 20; playSound('coin'); booMsg("Chuẩn xác! (+20)");
                } else {
                    t1User.forEach(i => cells[i].classList.replace('user-pick', 'wrong'));
                    arenaScore -= 10; playSound('error'); booMsg("Lệch lạc! (-10)");
                }
                document.getElementById('arena-score').innerText = arenaScore;
                currentRound++; setTimeout(runGame1, 1000);
            }
        }

        // ================= ẢI 2: LƯU THỦY (5 Vòng Liên Tục) =================
        async function runGame2() {
            if(currentRound > 5) return finishArena(50);
            document.getElementById('arena-round').innerText = `${currentRound} / 5`;
            t2Path = []; t2User = [];
            for(let i=0; i<4; i++) t2Path.push(Math.floor(Math.random() * 9));
            let cells = document.getElementById('grid-2').children;
            for(let i=0; i<9; i++) cells[i].className = 'grid-cell';
            
            booMsg("Quan sát quỹ đạo...");
            for(let id of t2Path) {
                cells[id].classList.add('active-glow');
                await new Promise(r => setTimeout(r, 400));
                cells[id].classList.remove('active-glow');
                await new Promise(r => setTimeout(r, 150));
            }
            booMsg("Đuổi theo dòng nước!"); canClick = true;
        }
        function handleGame2Click(idx, cellEl) {
            if(!canClick) return;
            if(idx === t2Path[t2User.length]) {
                cellEl.classList.add('correct'); t2User.push(idx); playSound('katana');
                setTimeout(() => cellEl.classList.remove('correct'), 300);
                if(t2User.length === t2Path.length) {
                    canClick = false; arenaScore += 20; booMsg("Lưu loát! (+20)");
                    document.getElementById('arena-score').innerText = arenaScore;
                    currentRound++; setTimeout(runGame2, 800);
                }
            } else {
                canClick = false; cellEl.classList.add('wrong');
                arenaScore -= 10; playSound('error'); booMsg("Đứt đoạn! (-10)");
                document.getElementById('arena-score').innerText = arenaScore;
                currentRound++; setTimeout(runGame2, 800);
            }
        }

        // ================= ẢI 3: TÂM TRẬN (Trí nhớ chớp nhoáng 1.5s & Thanh Bar) =================
        function runGame3() {
            t3TimeLeft = t3TimeTotal;
            updateTimerBar();
            
            t3TimerInterval = setInterval(() => {
                t3TimeLeft -= 0.1;
                updateTimerBar();
                if(t3TimeLeft <= 0) {
                    clearInterval(t3TimerInterval);
                    finishArena(100);
                }
            }, 100);
            nextSeqG3();
        }
        
        function updateTimerBar() {
            let pct = (t3TimeLeft / t3TimeTotal) * 100;
            let bar = document.getElementById('timer-progress');
            if(pct < 0) pct = 0;
            bar.style.width = pct + '%';
            if(pct <= 20) bar.classList.add('danger');
            else bar.classList.remove('danger');
        }

        function nextSeqG3() {
            if(t3TimeLeft <= 0) return;
            t3Seq = []; t3User = [];
            for(let i=0; i<4; i++) t3Seq.push(Math.floor(Math.random()*4));
            
            let area = document.getElementById('seq-area');
            area.innerHTML = t3Seq.map(id => weaponsHTML[id]).join('');
            booMsg("Ghi nhớ nhanh...");
            canClick = false; 

            clearTimeout(t3HideTimeout);
            // Sập tắt sau 1.5 giây
            t3HideTimeout = setTimeout(() => {
                area.innerHTML = '<div class="hidden-box">❓</div>'.repeat(4);
                booMsg("Nhập lại khí cụ!");
                canClick = true;
            }, 1500);
        }
        
        function addToUserSeq(id) {
            if(!canClick) return;
            
            if(id === t3Seq[t3User.length]) {
                t3User.push(id); playSound('katana');
                let html = t3User.map(i => weaponsHTML[i]).join('');
                html += '<div class="hidden-box">❓</div>'.repeat(4 - t3User.length);
                document.getElementById('seq-area').innerHTML = html;
                
                if(t3User.length === 4) {
                    canClick = false; t3Combo++;
                    let mult = Math.min(t3Combo, 3);
                    let points = 10 * mult; arenaScore += points;
                    document.getElementById('arena-score').innerText = arenaScore;
                    
                    if(t3Combo > 1) showCombo(`COMBO x${mult}`);
                    playSound('coin'); booMsg(`Tốt! (+${points})`);
                    setTimeout(nextSeqG3, 300);
                }
            } else {
                canClick = false; t3Combo = 0; arenaScore -= 5;
                document.getElementById('arena-score').innerText = arenaScore;
                showCombo("GÃY CHUỖI", true); playSound('error');
                booMsg("Sai! (-5)"); 
                setTimeout(nextSeqG3, 600);
            }
        }

        // ================= KẾT THÚC & LƯU ĐIỂM =================
        function finishArena(targetScore) {
            isPlaying = false; canClick = false;
            document.getElementById('close-arena-btn').style.display = 'block';
            document.getElementById('close-arena-btn').innerText = "THOÁT";
            
            if(arenaScore >= targetScore) {
                booMsg(`VIÊN MÃN! Bạn đạt ${arenaScore} điểm.`);
                let card = document.getElementById(`card-${currentGame}`);
                card.querySelector('.card-status').innerHTML = "ĐÃ XONG";
                card.querySelector('.card-status').classList.add('completed-text');
                card.style.borderColor = "#ffd700";
                thuyLuanTasks[currentGame] = true;
                playSound('warp-out');
            } else {
                booMsg(`CHƯA ĐẠT! Cần tối thiểu ${targetScore} điểm.`);
            }
            updateSystemTerminal();
        }

        function saveScore() {
            if(document.getElementById('btn-save-score').classList.contains('disabled')) return;
            playSound('coin');
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐÃ LƯU KẾT QUẢ VỀ LÕI!`;
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        }
        
        function navToCore() {
            playSound('brake');
            document.body.classList.remove('assembled');
            document.getElementById('sanctum-bg').style.opacity = '0';
            setTimeout(() => { window.location.href = 'index.html'; }, 800); 
        }
    </script>
</body>
</html>
