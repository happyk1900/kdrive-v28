<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        #entry-flash { position: fixed; inset: 0; background: radial-gradient(circle, #00e5ff 0%, #000 80%); z-index: 9999; transition: opacity 0.8s ease-out; pointer-events: none; opacity: 1; }

        /* NỀN THỦY LUÂN: (Thay link ảnh AI mới của anh vào url bên dưới) */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/THUY%20LUAN.png?raw=true'); background-size: cover; background-position: center; }
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        #boo-module-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        .boo-hologram { position: absolute; width: 55px; height: 55px; top: 15%; right: 10%; display: flex; justify-content: center; align-items: center; animation: holoHover 3s ease-in-out infinite; }
        @keyframes holoHover { 0%, 100% { margin-top: 0; } 50% { margin-top: -12px; } }
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8); z-index: 2; }
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 20px; background: #000; border-radius: 50%; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }
        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff var(--energy, 100%), transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; padding: 4px; z-index: 3; box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; }

        /* 3 KHỐI THẺ HOLOGRAM CÓ SỰ KIỆN TƯƠNG TÁC */
        #task-container { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; transition: opacity 0.5s; }
        .holo-card { width: 95px; height: 120px; background: rgba(0, 15, 30, 0.4); backdrop-filter: blur(5px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1), 0 0 15px rgba(0, 229, 255, 0.2); cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: translateY(80px) rotateX(-20deg); pointer-events: auto; }
        .holo-card:hover { background: rgba(0, 229, 255, 0.2); transform: translateY(-10px) scale(1.05) !important; box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.4), 0 0 25px rgba(0, 229, 255, 0.5); }
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #fff; text-shadow: 0 0 10px #00e5ff; margin-bottom: 10px; font-weight: bold; }
        .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: bold; color: #00e5ff; text-align: center; line-height: 1.4; text-shadow: 0 0 8px rgba(0,229,255,0.6); }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #ffeb3b; margin-top: 10px; letter-spacing: 1px; transition: color 0.3s; }
        .completed-text { color: #00ffcc !important; text-shadow: 0 0 10px #00ffcc !important; font-weight: bold; }

        /* TRẠM SCI & NÚT TRỞ VỀ */
        #sci-terminal { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 320px; display: flex; flex-direction: column; gap: 15px; opacity: 0; transition: opacity 0.5s ease; z-index: 50; pointer-events: auto; }
        .terminal-box { background: rgba(0, 15, 30, 0.75); backdrop-filter: blur(6px); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 8px; padding: 12px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); text-align: center; }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.6); }
        
        .action-btn { background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 10px 15px; border-radius: 4px; cursor: pointer; text-shadow: 0 0 8px rgba(0,229,255,0.8); transition: all 0.3s; box-shadow: inset 0 0 10px rgba(0,229,255,0.2); text-align: center; text-transform: uppercase; }
        .action-btn:hover { background: rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }

        /* ĐẤU TRƯỜNG NHIỆM VỤ (TASK ARENA MODAL) */
        #task-arena { position: fixed; inset: 0; background: rgba(0, 10, 20, 0.85); backdrop-filter: blur(10px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        .arena-box { background: rgba(0, 15, 30, 0.7); border: 1px solid #00e5ff; border-radius: 8px; width: 85%; max-width: 360px; padding: 30px 20px; text-align: center; box-shadow: 0 0 30px rgba(0,229,255,0.2), inset 0 0 20px rgba(0,229,255,0.1); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #fff; text-shadow: 0 0 10px #00e5ff; letter-spacing: 2px; border-bottom: 1px solid rgba(0,229,255,0.4); padding-bottom: 10px; width: 100%; }
        .arena-progress-ring { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        .ring-circle { position: absolute; inset: 0; border: 3px dashed rgba(0, 229, 255, 0.4); border-radius: 50%; animation: spinRing 10s linear infinite; }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        .ring-text { font-family: 'Share Tech Mono', monospace; font-size: 28px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
    </style>
</head>
<body>

    <div id="entry-flash"></div>
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <div id="lore-btn">[ ĐẠO TRƯỜNG THỦY LUÂN ]</div>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <div id="boo-module-container">
        <div class="boo-hologram" id="boo-knight">
            <div class="boo-energy-border" id="boo-energy"></div>
            <div class="boo-face"></div>
        </div>
    </div>

    <!-- 3 KHỐI NHIỆM VỤ: ĐÃ GẮN SỰ KIỆN CLICK -->
    <div id="task-container">
        <div class="holo-card" id="card-1" onclick="openTask('card-1', 'I. TĨNH KHÍ', 5)">
            <div class="card-icon">I</div>
            <div class="card-title">TĨNH KHÍ<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA XONG ]</div>
        </div>
        <div class="holo-card" id="card-2" style="height: 150px; margin-bottom: 20px;" onclick="openTask('card-2', 'II. LƯU THỦY', 5)"> 
            <div class="card-icon">II</div>
            <div class="card-title">LƯU THỦY<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA XONG ]</div>
        </div>
        <div class="holo-card" id="card-3" onclick="openTask('card-3', 'III. TÂM TRẬN', 1)">
            <div class="card-icon">III</div>
            <div class="card-title">TÂM TRẬN<br>(60s)</div>
            <div class="card-status" style="color: #00e5ff;">[ ĐIỂM: 27 ]</div>
        </div>
    </div>

    <!-- TRẠM ĐIỀU KHIỂN S.C.I -->
    <div id="sci-terminal">
        <div class="terminal-box">
            <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: CHỜ ĐỒNG BỘ DỮ LIỆU.</span>
        </div>
        <div class="action-btn" onclick="navToCore()">← LƯU ĐIỂM & TRỞ VỀ LÕI</div>
    </div>

    <!-- GIAO DIỆN LÀM NHIỆM VỤ (ẢI) -->
    <div id="task-arena">
        <div class="arena-box">
            <div class="arena-title" id="arena-title">I. TĨNH KHÍ</div>
            <div class="arena-progress-ring">
                <div class="ring-circle"></div>
                <div class="ring-text" id="arena-status">0%</div>
            </div>
            <button class="action-btn" id="arena-btn" onclick="executeTaskStep()">[ ĐỒNG BỘ VÒNG 1 ]</button>
            <button class="action-btn" style="border-color: #ff2a2a; color: #ff2a2a; box-shadow: none;" onclick="closeTaskArena()">[ RÚT LUI ]</button>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        const booEnergyBorder = document.getElementById('boo-energy');
        
        // HỆ THỐNG ÂM THANH
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'brake') { 
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); 
                    osc.start(); osc.stop(ctx.currentTime + 0.1); 
                } else if(type === 'boing') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(1, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                }
            } catch (e) {}
        }

        function runHighTechClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = `${year}.${month}.${day}`;
            requestAnimationFrame(runHighTechClock);
        }

        window.onload = () => {
            runHighTechClock();
            setTimeout(() => { document.getElementById('entry-flash').style.opacity = '0'; }, 100);

            const savedEnergy = localStorage.getItem('boo_energy');
            if(savedEnergy) booEnergyBorder.style.setProperty('--energy', `${savedEnergy}%`);
            
            const savedTime = localStorage.getItem('bg_music_time');
            if(savedTime) bgMusic.currentTime = parseFloat(savedTime);
            
            const savedMuted = localStorage.getItem('bg_music_muted');
            if(savedMuted === 'true') { 
                bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; 
            } else { 
                bgMusic.muted = false; bgMusic.play().catch(e => console.log("")); 
            }

            const cards = [document.getElementById('card-2'), document.getElementById('card-1'), document.getElementById('card-3')];
            cards.forEach((card, index) => {
                setTimeout(() => { card.style.opacity = '1'; card.style.transform = 'translateY(0) rotateX(0)'; }, 500 + (index * 150));
            });
            setTimeout(() => { document.getElementById('sci-terminal').style.opacity = '1'; }, 1000);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { 
                bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); 
            } else { 
                bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); 
            }
        }
        function changeVolume(val) { 
            bgMusic.volume = val; 
            if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); }
        }

        // ==========================================
        // CƠ CHẾ ĐẤU TRƯỜNG NHIỆM VỤ (TASK ARENA)
        // ==========================================
        let currentTaskObj = null;
        let stepCount = 0;
        let maxSteps = 0;

        function openTask(taskId, taskName, totalSteps) {
            playSound('katana');
            if(navigator.vibrate) navigator.vibrate(50);
            
            currentTaskObj = document.getElementById(taskId);
            stepCount = 0;
            maxSteps = totalSteps;

            // Làm mờ và khóa các khối ở ngoài
            document.getElementById('task-container').style.opacity = '0';
            document.getElementById('sci-terminal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('task-container').style.pointerEvents = 'none';
                document.getElementById('sci-terminal').style.pointerEvents = 'none';
            }, 400);

            // Bật Đấu Trường
            document.getElementById('arena-title').innerText = taskName;
            document.getElementById('arena-status').innerText = "0%";
            document.getElementById('arena-btn').innerText = "[ BẮT ĐẦU VÒNG 1 ]";
            document.getElementById('arena-btn').style.display = 'block';
            
            document.getElementById('task-arena').classList.add('active');
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐANG XỬ LÝ GIAO THỨC [${taskName}].`;
        }

        function executeTaskStep() {
            if (stepCount < maxSteps) {
                stepCount++;
                playSound('boing');
                if(navigator.vibrate) navigator.vibrate([30, 50, 30]);

                let percent = Math.floor((stepCount / maxSteps) * 100);
                document.getElementById('arena-status').innerText = `${percent}%`;
                
                if (stepCount < maxSteps) {
                    document.getElementById('arena-btn').innerText = `[ TIẾP TỤC VÒNG ${stepCount + 1} ]`;
                } else {
                    // Nếu hoàn thành max vòng
                    document.getElementById('arena-btn').style.display = 'none';
                    document.getElementById('arena-status').innerText = "MAX";
                    playSound('katana');
                    
                    if(currentTaskObj) {
                        currentTaskObj.querySelector('.card-status').innerHTML = "<span class='completed-text'>[ HOÀN THÀNH ]</span>";
                        currentTaskObj.style.borderColor = "#00ffcc";
                        currentTaskObj.style.boxShadow = "inset 0 0 20px rgba(0, 255, 204, 0.2), 0 0 15px rgba(0, 255, 204, 0.4)";
                    }
                    
                    document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: XÁC NHẬN [ HOÀN TẤT ].`;
                    setTimeout(closeTaskArena, 1200); // Tự đóng sau 1.2 giây
                }
            }
        }

        function closeTaskArena() {
            playSound('brake');
            document.getElementById('task-arena').classList.remove('active');
            
            // Nhả các khối ngoài ra lại
            document.getElementById('task-container').style.opacity = '1';
            document.getElementById('task-container').style.pointerEvents = 'auto';
            document.getElementById('sci-terminal').style.opacity = '1';
            document.getElementById('sci-terminal').style.pointerEvents = 'auto';
        }

        function navToCore() {
            playSound('brake');
            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            localStorage.setItem('bg_music_time', bgMusic.currentTime);
            document.getElementById('entry-flash').style.opacity = '1';
            setTimeout(() => { window.location.href = 'index.html'; }, 600); // Đảm bảo đúng file index của core
        }

        const dustContainer = document.getElementById('dust-container');
        for(let i = 0; i < 40; i++) {
            let p = document.createElement('div'); let type = Math.random();
            if(type < 0.6) p.className = 'dust-particle dust-small'; else p.className = 'dust-particle dust-large';
            p.style.left = (Math.random() * 100) + 'vw'; p.style.animationDuration = (Math.random() * 10 + 10) + 's'; p.style.animationDelay = (Math.random() * 5) + 's';
            dustContainer.appendChild(p);
        }
    </script>
</body>
</html>
