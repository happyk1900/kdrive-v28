<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        #entry-flash { position: fixed; inset: 0; background: radial-gradient(circle, #00e5ff 0%, #000 80%); z-index: 9999; transition: opacity 1.5s ease-out; pointer-events: none; opacity: 1; }

        /* NỀN THỦY LUÂN */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/THUY%20LUAN.png?raw=true'); background-size: cover; background-position: center; }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP-HUD */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        /* TIÊU ĐỀ: ĐẠO TRƯỜNG THỦY LUÂN */
        .title-hologram { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; animation: pulseBtn 2.5s infinite alternate; text-shadow: 0 0 8px rgba(255,255,255,0.8); z-index: 50; pointer-events: none; opacity: 0; transition: opacity 1s ease 0.5s; }

        /* BẢNG LORE */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.05); z-index: 1000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 229, 255, 0.4); padding-bottom: 10px; }
        .lore-title { color: #00e5ff; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 14px; text-shadow: 0 0 8px rgba(0,229,255,0.8); }
        .lore-close { color: #ff2a2a; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff2a2a; }
        .lore-content { color: #ffffff; font-size: 12px; line-height: 1.6; min-height: 190px; text-shadow: 0 0 5px rgba(255,255,255,0.3); font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #00e5ff; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; }
        .lore-page-indicator { color: #ffffff; font-family: monospace; font-weight: bold; opacity: 0.8; }

        /* 3 KHỐI THẺ ẢI: NỀN ĐEN MỜ, VIỀN VÀNG, CHỮ TRẮNG */
        #task-container { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; transition: opacity 0.5s; pointer-events: none; }
        .holo-card { width: 95px; height: 110px; background: rgba(0, 5, 12, 0.85); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); border: 1px solid #ffd700; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.1); cursor: pointer; opacity: 0; pointer-events: auto; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); transition: all 0.3s ease; }
        .holo-card:hover { background: rgba(255, 215, 0, 0.1); box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.3), 0 0 20px rgba(255, 215, 0, 0.4); border-color: #ffe600; }
        
        .float-1 { animation: floatA 4s ease-in-out infinite; }
        .float-2 { animation: floatB 5s ease-in-out infinite 0.5s; height: 130px; margin-bottom: 20px; }
        .float-3 { animation: floatC 4.5s ease-in-out infinite 1s; }

        @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
        @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); margin-bottom: 8px; font-weight: bold; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; color: #ffffff; text-align: center; line-height: 1.4; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255,255,255,0.6); }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #a0a0a0; margin-top: 10px; letter-spacing: 1.5px; transition: color 0.3s; }
        .completed-text { color: #ffd700 !important; text-shadow: 0 0 10px #ffd700 !important; font-weight: bold; }

        /* DẢI BĂNG ĐEN HỆ THỐNG VẮT NGANG MÀN HÌNH */
        #terminal-bar { position: fixed; bottom: 85px; left: 0; width: 100vw; background: rgba(0, 5, 10, 0.85); border-top: 1px solid rgba(0, 229, 255, 0.4); border-bottom: 1px solid rgba(0, 229, 255, 0.4); padding: 12px 0; text-align: center; z-index: 45; opacity: 0; transition: opacity 1s ease 1s; backdrop-filter: blur(4px); box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.6); white-space: nowrap; }
        
        /* ACTION PANEL: CHỨA 2 NÚT RIÊNG BIỆT */
        #action-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 50; opacity: 0; transition: opacity 1s ease 1s; pointer-events: auto; width: 90%; max-width: 350px; justify-content: center; }
        
        .btn-cyan { color: #00e5ff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 15px; background: rgba(0, 10, 20, 0.8); border: 1px solid #00e5ff; cursor: pointer; text-transform: uppercase; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        .btn-cyan:active { background: rgba(0, 229, 255, 0.2); }
        
        .btn-yellow { color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; background: rgba(0, 5, 10, 0.8); border: 1px solid #ffd700; cursor: pointer; text-transform: uppercase; animation: pulseYellow 2s infinite alternate; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        @keyframes pulseYellow { 0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2), inset 0 0 5px rgba(255, 215, 0, 0.1); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); } 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.4); text-shadow: 0 0 15px rgba(255, 215, 0, 1); } }
        .btn-yellow:active { background: rgba(255, 215, 0, 0.2); }

        /* TRẠNG THÁI KHÓA CỦA NÚT LƯU ĐIỂM */
        .btn-yellow.disabled { color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); animation: none; pointer-events: none; text-shadow: none; box-shadow: none; }

        @keyframes pulseBtn { 0% { opacity: 0.4; } 100% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1); } }

        /* ĐẤU TRƯỜNG NHIỆM VỤ (TASK ARENA) */
        #task-arena { position: fixed; inset: 0; background: rgba(0, 10, 20, 0.85); backdrop-filter: blur(8px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        .arena-box { background: rgba(0, 15, 30, 0.7); border: 1px solid #ffd700; width: 85%; max-width: 360px; padding: 30px 20px; text-align: center; box-shadow: 0 0 30px rgba(255,215,0,0.1), inset 0 0 20px rgba(255,215,0,0.05); display: flex; flex-direction: column; align-items: center; gap: 20px; clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #fff; text-shadow: 0 0 10px #ffd700; letter-spacing: 2px; border-bottom: 1px solid rgba(255,215,0,0.4); padding-bottom: 10px; width: 100%; }
        .arena-progress-ring { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        .ring-circle { position: absolute; inset: 0; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 50%; animation: spinRing 10s linear infinite; box-shadow: inset 0 0 15px rgba(255,215,0,0.1); }
        .ring-circle::before { content: ''; position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 10px #ffd700; }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        .ring-text { font-family: 'Share Tech Mono', monospace; font-size: 28px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        
        .arena-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 10px 15px; cursor: pointer; text-shadow: 0 0 8px rgba(255,215,0,0.8); transition: all 0.3s; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .arena-btn:active { background: rgba(255, 215, 0, 0.3); }
    </style>
</head>
<body>

    <div id="entry-flash"></div>
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <div id="lore-modal">
        <div class="lore-header"><span class="lore-title">GIAO THỨC THỦY LUÂN</span><span class="lore-close" onclick="closeLore()">X</span></div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls"><div class="lore-nav" onclick="prevPage()">[ < ]</div><div class="lore-page-indicator" id="lore-page-num">1 / 3</div><div class="lore-nav" onclick="nextPage()">[ > ]</div></div>
    </div>

    <div class="title-hologram" id="thuy-luan-title">ĐẠO TRƯỜNG THỦY LUÂN</div>

    <div id="task-container">
        <div class="holo-card float-1" id="card-1" onclick="openTask('card-1', 'I. TĨNH KHÍ', 5)">
            <div class="card-icon">I</div>
            <div class="card-title">TĨNH KHÍ<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA ]</div>
        </div>
        <div class="holo-card float-2" id="card-2" onclick="openTask('card-2', 'II. LƯU THỦY', 5)"> 
            <div class="card-icon">II</div>
            <div class="card-title">LƯU THỦY<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA ]</div>
        </div>
        <div class="holo-card float-3" id="card-3" onclick="openTask('card-3', 'III. TÂM TRẬN', 1)">
            <div class="card-icon">III</div>
            <div class="card-title">TÂM TRẬN<br>(60s)</div>
            <div class="card-status" style="color: #a0a0a0;">[ Điểm: -- ]</div>
        </div>
    </div>

    <!-- DẢI BĂNG HỆ THỐNG VẮT NGANG -->
    <div id="terminal-bar">
        <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: ĐANG QUÉT NHIỆM VỤ...</span>
    </div>

    <!-- 2 NÚT ACTION RIÊNG BIỆT -->
    <div id="action-panel">
        <button class="btn-cyan" onclick="navToCore()">[ TRỞ VỀ LÕI ]</button>
        <button class="btn-yellow disabled" id="btn-save-score" onclick="saveScore()">[ LƯU ĐIỂM ]</button>
    </div>

    <!-- GIAO DIỆN LÀM NHIỆM VỤ (ĐÃ ĐỔI TÔNG VÀNG ĐỒNG BỘ) -->
    <div id="task-arena">
        <div class="arena-box">
            <div class="arena-title" id="arena-title">I. TĨNH KHÍ</div>
            <div class="arena-progress-ring">
                <div class="ring-circle"></div>
                <div class="ring-text" id="arena-status">0%</div>
            </div>
            <button class="arena-btn" id="arena-btn" onclick="executeTaskStep()">[ ĐỒNG BỘ VÒNG 1 ]</button>
            <button class="arena-btn" style="border-color: #ff2a2a; color: #ff2a2a; background: transparent; box-shadow: none;" onclick="closeTaskArena()">[ RÚT LUI ]</button>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        
        // MẢNG THEO DÕI TIẾN ĐỘ 3 ẢI
        let thuyLuanTasks = [
            { id: 'card-1', name: 'TĨNH KHÍ', done: false },
            { id: 'card-2', name: 'LƯU THỦY', done: false },
            { id: 'card-3', name: 'TÂM TRẬN', done: false }
        ];

        function updateSystemTerminal() {
            let pendingTasks = thuyLuanTasks.filter(t => !t.done);
            let msgEl = document.getElementById('sys-msg');
            let saveBtn = document.getElementById('btn-save-score');
            
            if (pendingTasks.length > 0) {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: CHỜ HOÀN THÀNH [${pendingTasks[0].name}].`;
                saveBtn.classList.add('disabled'); // Khóa nút Lưu điểm
            } else {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: THỦY LUÂN VIÊN MÃN. HÃY BẤM LƯU ĐIỂM.`;
                saveBtn.classList.remove('disabled'); // Mở khóa và nhấp nháy nút Lưu điểm
                playSound('warp-out');
            }
        }

        // HỆ THỐNG ÂM THANH
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'brake') { 
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); 
                    osc.start(); osc.stop(ctx.currentTime + 0.1); 
                } else if(type === 'boing') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(1, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'warp-out') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2000, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.6); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); 
                    osc.start(); osc.stop(ctx.currentTime + 0.6);
                }
            } catch (e) {}
        }

        // LORE GIAO THỨC THỦY LUÂN
        const lorePagesHTML = [
            "<b style='font-size:13px;'>TỔNG QUAN: TRÍ TUỆ THỦY LUÂN</b><br><br>Đạo của Nước là sự uyển chuyển, linh hoạt và không ngừng nghỉ.<br><br>Tại Đạo Trường Thủy Luân, bạn phải hoàn thành 3 thử thách cốt lõi để duy trì sự cân bằng của TRÍ TUỆ: Tĩnh Khí, Lưu Thủy và Tâm Trận.",
            "<b style='font-size:13px;'>I & II: TĨNH KHÍ VÀ LƯU THỦY</b><br><br>• <b>I. Tĩnh Khí (5 Vòng):</b> Tập trung thiền định, loại bỏ tạp niệm. Hoàn thành 5 vòng thở sâu để ổn định tinh thần.<br><br>• <b>II. Lưu Thủy (5 Vòng):</b> Linh hoạt tiếp nhận thông tin. Đọc 5 trang sách hoặc giải quyết 5 nhiệm vụ nhỏ để kích thích não bộ.",
            "<b style='font-size:13px;'>III. TÂM TRẬN</b><br><br>• <b>Kiểm tra áp lực (60s):</b> Đưa ra quyết định nhanh, dứt khoát trong vòng 60 giây. Mọi sự chần chừ đều sẽ làm vẩn đục dòng nước.<br><br><span style='color:#00ffcc'>Hoàn thành 3 ải để đồng bộ hoàn toàn điểm số S.C.I về Lõi Trung Tâm.</span>"
        ];
        let currentLorePage = 0; let isLoreOpen = false;

        function openLore() { isLoreOpen = true; document.getElementById('lore-modal').classList.add('active'); renderLorePage(); playSound('katana'); }
        function closeLore() { isLoreOpen = false; document.getElementById('lore-modal').classList.remove('active'); playSound('brake'); }
        function renderLorePage() { document.getElementById('lore-text').innerHTML = lorePagesHTML[currentLorePage]; document.getElementById('lore-page-num').innerText = `${currentLorePage + 1} / 3`; }
        function nextPage() { if(currentLorePage < 2) { currentLorePage++; renderLorePage(); playSound('brake'); } }
        function prevPage() { if(currentLorePage > 0) { currentLorePage--; renderLorePage(); playSound('brake'); } }

        function runHighTechClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = `${year}.${month}.${day}`;
            requestAnimationFrame(runHighTechClock);
        }

        window.onload = () => {
            runHighTechClock();
            
            setTimeout(() => { document.getElementById('entry-flash').style.opacity = '0'; }, 200);
            
            const savedTime = localStorage.getItem('bg_music_time');
            if(savedTime) bgMusic.currentTime = parseFloat(savedTime);
            
            const savedMuted = localStorage.getItem('bg_music_muted');
            if(savedMuted === 'true') { 
                bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; 
            } else { 
                bgMusic.muted = false; bgMusic.play().catch(e => console.log("")); 
            }

            setTimeout(() => { 
                document.getElementById('thuy-luan-title').style.opacity = '1'; 
                updateSystemTerminal();
            }, 800);

            const cards = [document.getElementById('card-2'), document.getElementById('card-1'), document.getElementById('card-3')];
            cards.forEach((card, index) => {
                setTimeout(() => { card.style.opacity = '1'; }, 1200 + (index * 200));
            });
            setTimeout(() => { 
                document.getElementById('terminal-bar').style.opacity = '1'; 
                document.getElementById('action-panel').style.opacity = '1';
            }, 1800);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { 
                bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); 
            } else { 
                bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); 
            }
        }
        function changeVolume(val) { 
            bgMusic.volume = val; 
            if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); }
        }

        let currentTaskObj = null;
        let currentTaskDataId = null;
        let stepCount = 0;
        let maxSteps = 0;

        function openTask(taskId, taskName, totalSteps) {
            playSound('katana');
            if(navigator.vibrate) navigator.vibrate(50);
            
            currentTaskObj = document.getElementById(taskId);
            currentTaskDataId = taskId;
            stepCount = 0;
            maxSteps = totalSteps;

            document.getElementById('task-container').style.opacity = '0';
            document.getElementById('terminal-bar').style.opacity = '0';
            document.getElementById('action-panel').style.opacity = '0';
            document.getElementById('thuy-luan-title').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('task-container').style.pointerEvents = 'none';
                document.getElementById('action-panel').style.pointerEvents = 'none';
            }, 400);

            document.getElementById('arena-title').innerText = taskName;
            document.getElementById('arena-status').innerText = "0%";
            document.getElementById('arena-btn').innerText = "[ BẮT ĐẦU VÒNG 1 ]";
            document.getElementById('arena-btn').style.display = 'block';
            
            document.getElementById('task-arena').classList.add('active');
            
            let cleanName = taskName.replace(/I+\.\s/g, ''); 
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐANG XỬ LÝ GIAO THỨC [${cleanName}].`;
        }

        function executeTaskStep() {
            if (stepCount < maxSteps) {
                stepCount++;
                playSound('boing');
                if(navigator.vibrate) navigator.vibrate([30, 50, 30]);

                let percent = Math.floor((stepCount / maxSteps) * 100);
                document.getElementById('arena-status').innerText = `${percent}%`;
                
                if (stepCount < maxSteps) {
                    document.getElementById('arena-btn').innerText = `[ TIẾP TỤC VÒNG ${stepCount + 1} ]`;
                } else {
                    document.getElementById('arena-btn').style.display = 'none';
                    document.getElementById('arena-status').innerText = "MAX";
                    playSound('katana');
                    
                    if(currentTaskObj) {
                        currentTaskObj.querySelector('.card-status').innerHTML = "<span class='completed-text'>[ ĐÃ XONG ]</span>";
                        currentTaskObj.style.borderColor = "#ffd700";
                        currentTaskObj.style.boxShadow = "inset 0 0 20px rgba(255, 215, 0, 0.2), 0 0 15px rgba(255, 215, 0, 0.4)";
                        
                        let taskData = thuyLuanTasks.find(t => t.id === currentTaskDataId);
                        if(taskData) taskData.done = true;
                    }
                    
                    setTimeout(closeTaskArena, 1200); 
                }
            }
        }

        function closeTaskArena() {
            playSound('brake');
            document.getElementById('task-arena').classList.remove('active');
            
            document.getElementById('task-container').style.opacity = '1';
            document.getElementById('task-container').style.pointerEvents = 'auto';
            
            document.getElementById('terminal-bar').style.opacity = '1';
            document.getElementById('action-panel').style.opacity = '1';
            document.getElementById('action-panel').style.pointerEvents = 'auto';
            
            document.getElementById('thuy-luan-title').style.opacity = '1';
            
            setTimeout(updateSystemTerminal, 500);
        }

        function saveScore() {
            playSound('warp-in');
            if(navigator.vibrate) navigator.vibrate([100, 100, 200]);
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐÃ ĐỒNG BỘ ĐIỂM SỐ TRÍ TUỆ VỀ LÕI!`;
            
            setTimeout(() => { navToCore(); }, 1500);
        }

        function navToCore() {
            playSound('warp-out');
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            localStorage.setItem('bg_music_time', bgMusic.currentTime);
            
            document.getElementById('task-container').style.opacity = '0';
            document.getElementById('terminal-bar').style.opacity = '0';
            document.getElementById('action-panel').style.opacity = '0';
            document.getElementById('top-hud').style.opacity = '0';
            document.getElementById('thuy-luan-title').style.opacity = '0';

            const flash = document.getElementById('entry-flash');
            flash.style.background = 'radial-gradient(circle, #000 0%, #000 100%)';
            flash.style.opacity = '1';
            
            setTimeout(() => { window.location.href = 'index.html'; }, 1000); 
        }

    </script>
</body>
</html>
