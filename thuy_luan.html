<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010a15">
    <title>K-Drive - Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #01060b;
            --cyan: #00e5ff;
            --mint: #38ef7d;    
            --neon-pink: #ff00ff; 
            --amber: #ffaa00;   
            --crimson: #ff2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        #sanctum-bg { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            background: linear-gradient(rgba(1, 6, 11, 0.4), rgba(1, 6, 11, 0.7)), 
                        url('https://github.com/happyk1900/Kai-Ripe/blob/main/nen%20thuy%20luan%20.png?raw=true') no-repeat center center; 
            background-size: cover; 
        }
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0.3; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: var(--mint); box-shadow: 0 0 4px var(--mint); }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.5; } 80% { opacity: 0.2; } 100% { transform: translateY(-20vh); opacity: 0; } }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 380px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 0.4s ease; }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: var(--mint); box-shadow: 0 0 20px var(--mint), 0 0 40px #11998e; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 0.3s forwards ease-out; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 0.5s forwards cubic-bezier(0.7, 0, 1, 1); }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 14px; transition: opacity 0.3s ease; }
        #start-prompt-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none !important; display: none; }

        .briefing-panel { background: rgba(8, 15, 28, 0.95); border: 2px solid var(--mint); border-radius: 8px; padding: 16px 18px; width: 100%; max-width: 330px; text-align: left; box-shadow: 0 0 20px rgba(56, 239, 125, 0.15); }
        .briefing-title { color: var(--mint) !important; font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); padding-bottom: 8px; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(56, 239, 125, 0.4); }
        .briefing-target { color: #d0d8e8; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; line-height: 1.6; font-weight: 500; }
        .briefing-target b { color: var(--mint); font-weight: bold; }

        .action-group { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: rgba(255, 255, 255, 0.08); border: 2px solid #ffffff; padding: 14px; border-radius: 8px; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 17px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); text-align: center; transition: 0.2s; }
        .start-action-box:active { background: #fff; color: #000; transform: scale(0.98); }

        /* THANH TRẠNG THÁI TRÊN */
        .game-top-bar {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; transition: opacity 0.3s;
        }
        .game-top-bar.hidden { opacity: 0; pointer-events: none !important; }

        .health-container { display: flex; gap: 4px; align-items: center; }
        .health-bar { width: 14px; height: 6px; background: rgba(255,255,255,0.1); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.green.active { background: var(--mint); box-shadow: 0 0 6px var(--mint); }
        .health-bar.pink.active { background: var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink); }

        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; color: #fff; display: flex; align-items: center; position: relative; }
        .data-score span { color: var(--mint); text-shadow: 0 0 8px var(--mint); font-size: 18px; margin-left: 5px; }

        #hp-notification-area { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); width: 200px; text-align: center; }

        /* THANH ĐIỀU HƯỚNG DƯỚI - BỐ CỤC 3 NÚT CÂN ĐỐI */
        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-bottom)); left: 0; width: 100vw;
            border-top: 1px solid rgba(0, 229, 255, 0.3); padding: 15px 20px 0 20px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 10000; pointer-events: auto;
            background: linear-gradient(0deg, rgba(2,8,15,0.95) 0%, transparent 100%); transition: opacity 0.3s;
        }
        .game-bottom-bar.hidden { opacity: 0; pointer-events: none !important; }

        .btn-action {
            width: 44px; height: 44px; background: rgba(5, 7, 10, 0.8); 
            border: 1px solid var(--cyan); border-radius: 10px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active { transform: scale(0.9); }
        
        .btn-back { justify-self: start; color: var(--cyan); font-family: 'Share Tech Mono', monospace; font-size: 24px; font-weight: bold; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); padding-bottom: 2px; padding-right: 2px; }
        .btn-back:active { background: rgba(0, 229, 255, 0.25); box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }

        .btn-skip { justify-self: center; border-color: rgba(56, 239, 125, 0.6); color: var(--mint); font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: bold; box-shadow: 0 0 10px rgba(56, 239, 125, 0.2); }
        .btn-skip:active { background: rgba(56, 239, 125, 0.25); box-shadow: 0 0 20px rgba(56, 239, 125, 0.6); }

        .btn-pause { justify-self: end; border-color: rgba(255, 170, 0, 0.5); box-shadow: 0 0 10px rgba(255, 170, 0, 0.15); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 16px; background: var(--amber); margin: 0 3px; border-radius: 2px; box-shadow: 0 0 5px var(--amber); }
        .btn-pause:active { background: rgba(255, 170, 0, 0.2); box-shadow: 0 0 20px rgba(255, 170, 0, 0.5); }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s; backdrop-filter: blur(5px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 300px; background: rgba(5, 12, 25, 0.95); border: 1px solid rgba(56,239,125,0.5); border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .pause-title { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: var(--mint); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; }
        .pause-btn { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 0, 127, 0.2); border: 1px solid #ff007f; color: #ff007f; margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 200000; display: none; align-items: center; justify-content: center; }
        #freeze-overlay.active { display: flex; }
        .freeze-text { font-family: 'Share Tech Mono', monospace; font-size: 40px; font-weight: 900; color: var(--mint); letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 20px var(--mint); }

        /* BẢNG KẾT QUẢ TỪNG BÀI */
        #result-overlay { position: absolute; inset: 0; background: rgba(2, 8, 15, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 150; gap: 8px; border-radius: 12px; padding: 12px; }
        #result-overlay.active { display: flex; }
        .stage-badge-header { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: var(--mint); letter-spacing: 3px; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 10px rgba(56,239,125,0.4); }
        
        .prestige-panel { width: 92%; max-width: 310px; background: rgba(5, 12, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
        .prestige-total-box { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; padding-top: 2px; width: 100%; }
        .prestige-total-label { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: 1px; flex: 1; text-align: left; }
        .prestige-total-num { font-size: 26px; color: var(--mint); font-weight: 900; line-height: 1; text-align: right; min-width: 80px; }

        .bio-metrics-box { width: 92%; max-width: 310px; background: rgba(5, 12, 25, 0.95); border: 1px solid rgba(56, 239, 125, 0.3); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 8px; margin-bottom: 4px; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: var(--mint); font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; text-align: right; }

        .rank-icon-img { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; filter: drop-shadow(0 0 3px rgba(56,239,125,0.4)); }

        .result-btn-row { display: flex; gap: 10px; width: 88%; max-width: 280px; margin-top: 10px; }
        .result-action-btn { flex: 1; padding: 12px; font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; }
        #btn-replay { background: transparent; border: 1px solid #ff3366; color: #ff3366; }
        #btn-replay:active { background: #ff3366; color: #fff; }
        #btn-next { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        #btn-next:active { background: #fff; color: #000; }

        /* BẢNG TỔNG KẾT CUỐI CÙNG */
        #final-summary-overlay { position: absolute; inset: 0; background: #01060b; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 10px; padding: 12px; }
        #final-summary-overlay.active { display: flex; }
        .final-header { font-family: 'Share Tech Mono', monospace; font-size: 22px; color: var(--mint); font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 10px var(--mint); }
        
        .stat-box { width: 92%; max-width: 310px; background: rgba(5, 12, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 14px; border-radius: 8px; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 100px; color: var(--mint); }

        .final-btn-exit { width: 92%; max-width: 310px; padding: 12px; background: rgba(56, 239, 125, 0.2); border: 1.5px solid var(--mint); border-radius: 8px; color: var(--mint); font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: 0.2s; text-align: center; margin-top: 5px; }
        .final-btn-exit:hover { background: var(--mint); color: #000; }

        .master-feedback { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--mint); font-style: italic; text-align: center; margin-top: 6px; line-height: 1.4; font-weight: 600; text-shadow: 0 0 10px rgba(56,239,125,0.4); max-width: 310px; }

        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .game-container.active { display: flex; }
        .dynamic-grid { display: grid; gap: 6px; margin: 0 auto; transition: all 0.3s ease; justify-content: center; align-content: center; border-radius: 12px; padding: 8px; border: 2px solid transparent; touch-action: none; }
        
        .grid-ready-glow { animation: readyPulse 0.4s ease-out forwards; }
        @keyframes readyPulse {
            0% { border-color: rgba(56, 239, 125, 0.1); box-shadow: 0 0 0px transparent; }
            30% { border-color: rgba(56, 239, 125, 1); box-shadow: 0 0 30px rgba(56,239,125,0.7), inset 0 0 20px rgba(56,239,125,0.4); }
            100% { border-color: rgba(56, 239, 125, 0.3); box-shadow: 0 0 10px rgba(56,239,125,0.2); }
        }

        .grid-cell { aspect-ratio: 1; background: rgba(56, 239, 125, 0.08); border: 1.5px solid rgba(56, 239, 125, 0.35); border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.1s ease; backdrop-filter: blur(6px); }
        .grid-cell.active-glow { background: rgba(56, 239, 125, 0.85); box-shadow: 0 0 20px var(--mint); border-color: #fff; }
        .grid-cell.correct { background: rgba(0, 255, 102, 0.85); box-shadow: 0 0 15px #00ff66; border-color: #fff; color: #fff;}
        .grid-cell.wrong { background: rgba(255, 51, 102, 0.85); box-shadow: 0 0 15px #ff3366; border-color: #fff; color: #fff;}
        .grid-cell.reveal-hint { background: rgba(255, 215, 0, 0.6) !important; box-shadow: 0 0 15px #ffd700 !important; border-color: #fff !important; }

        .sequence-display { min-height: 90px; max-height: 140px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-bottom: 25px; width: 95%; max-width: 350px; background: rgba(2, 8, 15, 0.9); border-radius: 12px; border: 1.5px solid rgba(56,239,125,0.4); padding: 10px 15px; overflow-y: auto; scroll-behavior: smooth; }
        .sequence-display::-webkit-scrollbar { width: 4px; }
        .sequence-display::-webkit-scrollbar-thumb { background: var(--mint); border-radius: 2px; }

        .input-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 85%; max-width: 250px;}
        
        .btn-symbol { padding: 0; height: 58px; display: flex; justify-content: center; align-items: center; background: rgba(56,239,125,0.08); border: 1.5px solid rgba(56,239,125,0.4); border-radius: 10px; cursor: pointer; transition: 0.15s; }
        .btn-symbol:active { background: rgba(56,239,125,0.3); transform: scale(0.96); }
        
        .hidden-box { min-width: 26px; height: 36px; display: inline-flex; justify-content: center; align-items: center; border: 1.5px dashed rgba(56,239,125,0.5); border-radius: 6px; background: rgba(56,239,125,0.05); color: rgba(56,239,125,0.4); font-size: 14px;}
        .quantum-char { display: inline-flex; justify-content: center; align-items: center; width: 26px; height: 36px; flex-shrink: 0; }

        .shape-svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 6px currentColor); }
        .shape-svg-small { width: 20px; height: 20px; display: block; filter: drop-shadow(0 0 3px currentColor); }

        .status-notification { font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 900; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; animation: topAlertAnim 1.2s ease-out forwards; }
        
        .matrix-expand-alert { position: fixed; top: 85px; left: 50%; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 18px; font-weight: 900; color: var(--mint); text-align: center; text-shadow: 0 0 10px var(--mint); z-index: 999999; pointer-events: none; white-space: nowrap; background: rgba(2, 8, 15, 0.95); padding: 6px 16px; border-radius: 6px; border: 1px solid rgba(56,239,125,0.5); animation: topAlertAnim 1.2s ease-out forwards; }
        @keyframes topAlertAnim { 0% { opacity: 0; transform: translate(-50%, -10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -15px); } }

    </style>
</head>
<body>

    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <!-- TẦNG TRÊN: HIỂN THỊ MÁU VÀ ĐIỂM -->
            <div id="game-top-bar" class="game-top-bar hidden">
                <!-- 5 Máu Xanh Gốc bên trái -->
                <div class="health-container">
                    <div class="health-bar green active" id="hp-g-1"></div>
                    <div class="health-bar green active" id="hp-g-2"></div>
                    <div class="health-bar green active" id="hp-g-3"></div>
                    <div class="health-bar green active" id="hp-g-4"></div>
                    <div class="health-bar green active" id="hp-g-5"></div>
                </div>

                <!-- Điểm DATA ở giữa -->
                <div class="data-score">DATA: <span id="boo-points">0</span>
                    <div id="hp-notification-area"></div>
                </div>

                <!-- 5 Máu Hồng Thưởng bên phải (Ban đầu tắt) -->
                <div class="health-container">
                    <div class="health-bar pink" id="hp-p-1"></div>
                    <div class="health-bar pink" id="hp-p-2"></div>
                    <div class="health-bar pink" id="hp-p-3"></div>
                    <div class="health-bar pink" id="hp-p-4"></div>
                    <div class="health-bar pink" id="hp-p-5"></div>
                </div>
            </div>

            <!-- TẦNG DƯỚI: ĐIỀU HƯỚNG CẮT NGANG -->
            <div id="game-bottom-bar" class="game-bottom-bar hidden">
                <button class="btn-action btn-back" onclick="confirmExitToLobby()">⟨</button>
                <button class="btn-action btn-skip" id="btn-skip-stage" onclick="skipToNextStage()" title="Chuyển bài nhanh">⏭</button>
                <button class="btn-action btn-pause" onclick="pauseGame()"></button>
            </div>

            <!-- MODAL START GAME -->
            <div id="start-prompt-overlay" class="hidden">
                <div id="briefing-panel" class="briefing-panel">
                    <div class="briefing-title" id="briefing-title"></div>
                    <div class="briefing-target" id="briefing-target"></div>
                </div>
                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>

            <!-- KHU VỰC GAME (TẦNG GIỮA) -->
            <div id="game-1-container" class="game-container">
                <div id="grid-1" class="dynamic-grid"></div>
            </div>
            
            <div id="game-2-container" class="game-container">
                <div class="sequence-display" id="seq-area"></div>
                <div class="input-area" id="input-area-2"></div>
            </div>

            <!-- BẢNG KẾT QUẢ TỪNG BÀI -->
            <div id="result-overlay">
                <div class="stage-badge-header" id="stage-badge-title">KẾT QUẢ BÀI 1</div>
                <div class="prestige-panel">
                    <div class="prestige-total-box" style="border-top:none; margin-top:0; padding-top:0;">
                        <span class="prestige-total-label" style="font-size:14px;">TỔNG ĐIỂM BÀI NÀY:</span>
                        <span class="prestige-total-num" id="final-score-display">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <div class="metric-card-row">
                        <span class="metric-label">Thời gian trích xuất</span>
                        <span class="metric-val" id="bio-ms-val">Chưa đủ Data</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Trí nhớ không gian</span>
                        <span class="metric-val" id="bio-rank-badge-mem">KÉM</span>
                    </div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="retryCurrentStage()">TẬP LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="proceedNextStage()">BÀI 2</button>
                </div>
            </div>

            <!-- BẢNG TỔNG KẾT CUỐI CÙNG -->
            <div id="final-summary-overlay">
                <div class="final-header">TỔNG KẾT THỦY LUÂN</div>
                <div class="stat-box">
                    <div class="stat-line"><span>BÀI 1:</span> <span class="stat-val" id="sum-score-1" style="color:#38ef7d;">0</span></div>
                    <div class="stat-line"><span>BÀI 2:</span> <span class="stat-val" id="sum-score-2" style="color:#38ef7d;">0</span></div>
                    <div class="stat-line" style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.3);">
                        <span style="font-weight: 900; color: #fff;">TỔNG ĐIỂM DATA:</span> <span class="stat-val" id="sum-score-total" style="font-weight:900; color:#38ef7d; font-size:16px;">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box" style="padding: 10px 14px; gap: 6px;">
                    <div class="metric-card-row">
                        <span class="metric-label">Thời gian trích xuất</span>
                        <span class="metric-val" id="final-ms">Chưa đủ Data</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Đánh giá trí nhớ</span>
                        <span class="metric-val" id="sum-rank-mem">KÉM</span>
                    </div>
                    <div class="master-feedback" id="master-feedback-text">Chờ đánh giá...</div>
                </div>

                <button class="final-btn-exit" onclick="closeArena()">VỀ SẢNH CHÍNH</button>
            </div>
            
        </div>
    </div>

    <script>
        const ALL_SHAPES = {
            'lightning': '<svg class="shape-svg" style="color: #ffd700;" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            'circle': '<svg class="shape-svg" style="color: #00e5ff;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>',
            'triangle': '<svg class="shape-svg" style="color: #38ef7d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 20 2 20 12 2"/></svg>',
            'square': '<svg class="shape-svg" style="color: #ff3399;" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
            'star': '<svg class="shape-svg" style="color: #ff9900;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 8 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 8 12 2"/></svg>',
            'diamond': '<svg class="shape-svg" style="color: #bf00ff;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>'
        };

        const ALL_SHAPES_SMALL = {
            'lightning': '<svg class="shape-svg-small" style="color: #ffd700;" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            'circle': '<svg class="shape-svg-small" style="color: #00e5ff;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>',
            'triangle': '<svg class="shape-svg-small" style="color: #38ef7d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 20 2 20 12 2"/></svg>',
            'square': '<svg class="shape-svg-small" style="color: #ff3399;" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
            'star': '<svg class="shape-svg-small" style="color: #ff9900;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 8 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 8 12 2"/></svg>',
            'diamond': '<svg class="shape-svg-small" style="color: #bf00ff;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>'
        };

        const BASE_SYMBOLS = ['lightning', 'circle', 'triangle', 'square'];
        const ADVANCED_SYMBOLS = ['lightning', 'circle', 'triangle', 'square', 'star', 'diamond'];

        const RANK_ICONS = {
            'Kém': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%201%20(1).png?raw=true',
            'Trung Bình': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%202%20(1).png?raw=true',
            'Giỏi': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%203%20(1).png?raw=true',
            'Xuất Sắc': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%204%20(1).png?raw=true',
            'Thần Đồng': 'https://github.com/happyk1900/-m-thanh-app/blob/main/Cap%205%20(1).png?raw=true'
        };

        function getRankByStructure(completedLevel, score) {
            if (score < 200 || completedLevel <= 1) return { name: "Kém", feedback: "Chiến binh hoàn thành mức cơ bản (3x3). Trí nhớ ngắn hạn cần được kích hoạt thêm qua các bài tập phản xạ không gian." };
            if (completedLevel === 2) return { name: "Trung Bình", feedback: "Chiến binh làm chủ tốt ma trận 5x5. Khả năng mã hóa thông tin thị giác đạt mức ổn định, ghi nhớ trật tự khá tốt." };
            if (completedLevel === 3) return { name: "Giỏi", feedback: "Tuyệt vời! Chiến binh chinh phục thành công ma trận 7x7. Tốc độ trích xuất dữ liệu không gian nhạy bén, phản xạ linh hoạt." };
            if (completedLevel === 4) return { name: "Xuất Sắc", feedback: "Cảnh giới thượng thừa! Vỏ não thị giác xử lý thông tin phức tạp (9x9) với độ chính xác cao, lưu trữ ký ức sắc sảo." };
            if (completedLevel >= 5) return { name: "Thần Đồng", feedback: "Đỉnh cao tuyệt đối! Đạt trạng thái dòng chảy (Flow State) hoàn hảo, trí nhớ không gian và phản xạ lượng tử đạt ngưỡng tối ưu." };
            return { name: "Kém", feedback: "Cần rèn luyện thêm để vượt qua các mốc cấu trúc cơ bản." };
        }

        function getRankHTML(rankName) {
            let iconUrl = RANK_ICONS[rankName] || RANK_ICONS['Kém'];
            return `<img src="${iconUrl}" class="rank-icon-img" alt="Rank"> <span style="vertical-align: middle;">${rankName.toUpperCase()}</span>`;
        }

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) { fxCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (fxCtx && fxCtx.state === 'suspended') { fxCtx.resume(); }
            } catch(e) {}
        }
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => { window.addEventListener(evt, initAudio, { passive: true }); });

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); } 
                else if(type === 'error') { osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime); gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); } 
                else if(type === 'coin') { osc.type = 'sine'; osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); osc.start(); osc.stop(ctx.currentTime + 0.2); } 
                else if(type === 'ready') { osc.type = 'sine'; osc.frequency.setValueAtTime(1800, ctx.currentTime); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15); osc.start(); osc.stop(ctx.currentTime + 0.15); }
                else if(type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); }
            } catch (e) {}
        }

        let cGame = '1'; 
        let aScore = 0;           
        let pendingScore = 0;     
        let stabilityHP = 5;      
        let isPlaying = false; 
        let isPausedForStart = true;
        
        let sessionScoreG1 = 0, sessionScoreG2 = 0;
        let hitsCountG1 = 0, hitsCountG2 = 0; 

        let currentLevel = 1; 
        let highestCompletedLevel = 1; 
        let winsInCurrentLevel = 0; 
        let canClick = false;
        let patternSeq = [];
        let userSeq = [];
        let gameLogicTimer;

        let cueHideTimestamp = 0;
        let extractionTimes = [];
        let nextHpMilestone = 1000;

        window.onload = () => { openArena('1'); };

        function getGridConfigByLevel(level) {
            if (level >= 5) return { size: 12, total: 144, css: 'repeat(12, 1fr)', dim: '350px' }; 
            if (level === 4) return { size: 9, total: 81, css: 'repeat(9, 1fr)', dim: '330px' };   
            if (level === 3) return { size: 7, total: 49, css: 'repeat(7, 1fr)', dim: '320px' };   
            if (level === 2) return { size: 5, total: 25, css: 'repeat(5, 1fr)', dim: '280px' };   
            return { size: 3, total: 9,  css: 'repeat(3, 1fr)', dim: '240px' };                    
        }

        function getG2SymbolCount(level) {
            if (level >= 5) return 18; 
            if (level === 4) return 9;  
            if (level === 3) return 7;  
            if (level === 2) return 5;  
            return 4;                   
        }

        function getAvailableSymbolsForLevel(level) {
            return (level >= 4) ? ADVANCED_SYMBOLS : BASE_SYMBOLS;
        }

        function buildDynamicGrid() {
            let container = document.getElementById('grid-1');
            let config = getGridConfigByLevel(currentLevel);
            container.innerHTML = ''; container.style.gridTemplateColumns = config.css; container.style.gridTemplateRows = config.css; 
            container.style.width = config.dim; container.style.height = config.dim;
            for(let i = 0; i < config.total; i++) {
                let cell = document.createElement('div'); cell.className = 'grid-cell';
                cell.onclick = () => handleGame1Click(i, cell);
                container.appendChild(cell);
            }
        }

        function buildG2Keyboard() {
            let area = document.getElementById('input-area-2'); area.innerHTML = '';
            let activeSymbols = getAvailableSymbolsForLevel(currentLevel);
            activeSymbols.forEach(key => {
                let btn = document.createElement('button'); btn.className = 'btn-symbol'; 
                btn.innerHTML = ALL_SHAPES[key];
                btn.onclick = () => addToUserSeq(key); 
                area.appendChild(btn);
            });
        }

        function openArena(id) {
            cGame = id; aScore = 0; pendingScore = 0; stabilityHP = 5; isPlaying = false; isPausedForStart = true;
            currentLevel = 1; highestCompletedLevel = 1; winsInCurrentLevel = 0;
            extractionTimes = []; nextHpMilestone = 1000;

            let playArea = document.getElementById('play-area');
            playArea.classList.remove('fullscreen-mode');
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

            updateHpDisplay(); document.getElementById('boo-points').innerText = "0";
            document.getElementById('result-overlay').classList.remove('active');
            document.getElementById('pause-menu-overlay').classList.remove('active');
            document.getElementById('final-summary-overlay').classList.remove('active');
            
            let bTitle = "", bTarget = "";
            if (id === '1') {
                bTitle = "BÀI 1"; bTarget = "GHI NHỚ VỊ TRÍ<br><br>Hệ thống sẽ làm sáng một cụm các điểm ảnh trong chớp mắt.<br><br><span style='color:#38ef7d; font-weight:bold;'>MỤC TIÊU:</span> Nhớ và bấm lại chính xác các vị trí đó. Bấm sai sẽ hiển thị gợi ý vị trí đúng.";
            } else if (id === '2') {
                bTitle = "BÀI 2"; bTarget = "GIẢI MÃ LƯỢNG TỬ<br><br>Hệ thống xuất ra một chuỗi ký hiệu hình học ngẫu nhiên.<br><br><span style='color:#38ef7d; font-weight:bold;'>MỤC TIÊU:</span> Nhớ và gõ lại đúng thứ tự chuỗi ký hiệu.";
            }

            document.getElementById('briefing-title').innerText = bTitle; document.getElementById('briefing-target').innerHTML = bTarget;
            document.getElementById('game-top-bar').classList.add('hidden');
            document.getElementById('game-bottom-bar').classList.add('hidden');
            document.getElementById('start-prompt-overlay').classList.remove('hidden');
            if (id === '2') buildG2Keyboard();
        }

        function updateHpDisplay() {
            let hp = Math.min(10, Math.max(0, stabilityHP));
            let greenCount = Math.min(5, hp);
            let pinkCount = Math.max(0, hp - 5);

            for(let i=1; i<=5; i++) {
                document.getElementById('hp-g-'+i).classList.toggle('active', i <= greenCount);
                document.getElementById('hp-p-'+i).classList.toggle('active', i <= pinkCount);
            }
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            document.getElementById('start-prompt-overlay').classList.add('hidden'); 
            playSound('katana', 0.6); let laser = document.createElement('div'); laser.className = 'laser-beam-horizontal'; document.body.appendChild(laser);
            setTimeout(() => { let playArea = document.getElementById('play-area'); playArea.classList.add('fullscreen-mode'); laser.classList.add('expand'); }, 300);
            setTimeout(() => { 
                laser.remove(); isPausedForStart = false; 
                document.getElementById('game-top-bar').classList.remove('hidden'); 
                document.getElementById('game-bottom-bar').classList.remove('hidden'); 
                document.getElementById(`game-${cGame}-container`).classList.add('active'); startArena(); 
            }, 800);
        }

        function startArena() { 
            isPlaying = true;
            if(cGame === '1') { hitsCountG1 = 0; runGame1(); } 
            else if(cGame === '2') { hitsCountG2 = 0; runGame2(); } 
        }

        function pauseGame() { if(!isPlaying || isPausedForStart) return; playSound('error'); isPausedForStart = true; clearTimeout(gameLogicTimer); document.getElementById('pause-menu-overlay').classList.add('active'); }
        function resumeGame() { playSound('coin'); document.getElementById('pause-menu-overlay').classList.remove('active'); isPausedForStart = false; if(cGame === '1') runGame1(); else runGame2(); }
        function confirmExitToLobby() { playSound('error'); window.location.href = 'LucChien.html'; }
        function closeArena() { window.location.href = 'LucChien.html'; }

        function skipToNextStage() {
            playSound('coin');
            isPlaying = false; isPausedForStart = true; clearTimeout(gameLogicTimer);
            aScore += pendingScore; pendingScore = 0; 

            if (cGame === '1') {
                sessionScoreG1 = Math.round(aScore); 
                localStorage.setItem('thuy_luan_bai1_score', sessionScoreG1);
                openArena('2');
            } else {
                sessionScoreG2 = Math.round(aScore); 
                localStorage.setItem('thuy_luan_bai2_score', sessionScoreG2);
                showFinalSummary();
            }
        }

        function revealCorrectAnswersForGame1() {
            let cells = document.getElementById('grid-1').children;
            patternSeq.forEach(idx => {
                if(cells[idx]) { cells[idx].classList.add('reveal-hint'); }
            });
            setTimeout(() => {
                patternSeq.forEach(idx => {
                    if(cells[idx]) { cells[idx].classList.remove('reveal-hint'); }
                });
            }, 900);
        }

        function revealCorrectAnswersForGame2() {
            let area = document.getElementById('seq-area');
            area.innerHTML = patternSeq.map(key => `<div class="quantum-char" style="opacity:0.7;">${ALL_SHAPES_SMALL[key]}</div>`).join('');
        }

        function failSequence() { 
            if(!isPlaying || isPausedForStart) return; canClick = false; 
            stabilityHP -= 1; 
            updateHpDisplay(); 
            
            pendingScore = 0;
            document.getElementById('boo-points').innerText = Math.round(aScore);

            winsInCurrentLevel = 0; 
            currentLevel = Math.max(1, currentLevel - 1); 
            if(cGame === '2') buildG2Keyboard(); 
            
            if (cGame === '1') { revealCorrectAnswersForGame1(); } 
            else { revealCorrectAnswersForGame2(); }

            let flash = document.createElement('div'); flash.className = 'flashbang-red'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 400);
            
            if(stabilityHP <= 0) { 
                setTimeout(finishGame, 1000); 
            } else { 
                clearTimeout(gameLogicTimer); 
                let delay = 1000;
                setTimeout(() => { if (cGame === '1') runGame1(); else runGame2(); }, delay); 
            }
        }

        function showHpRewardAlert() {
            let alertBox = document.createElement('div');
            alertBox.className = 'status-notification';
            alertBox.innerHTML = `+1 NĂNG LƯỢNG HỒNG`;
            document.getElementById('hp-notification-area').appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 1200);
        }

        function processCorrectTap(currentSeqLength) { 
            if (cGame === '1') hitsCountG1++; else if (cGame === '2') hitsCountG2++;

            playSound('coin', 1); 
            
            let basePointPerItem = 15;
            if (currentLevel === 2) basePointPerItem = 20;
            else if (currentLevel === 3) basePointPerItem = 25;
            else if (currentLevel >= 4) basePointPerItem = 30;

            pendingScore += basePointPerItem; 
            document.getElementById('boo-points').innerText = Math.round(aScore + pendingScore);

            let totalSimulatedScore = aScore + pendingScore;
            if (totalSimulatedScore >= nextHpMilestone) {
                nextHpMilestone += 1000;
                stabilityHP = Math.min(10, stabilityHP + 1); 
                updateHpDisplay();
                showHpRewardAlert();
            }
        }

        function checkLevelUp() { 
            winsInCurrentLevel++;
            let requiredWins = (currentLevel < highestCompletedLevel) ? 1 : 2; 

            if (winsInCurrentLevel >= requiredWins) { 
                winsInCurrentLevel = 0; 
                
                if (currentLevel > highestCompletedLevel) { 
                    highestCompletedLevel = currentLevel; 
                }
                aScore += pendingScore + (currentLevel * 40); 
                pendingScore = 0;
                document.getElementById('boo-points').innerText = Math.round(aScore);

                currentLevel++;
                if(cGame === '2') buildG2Keyboard(); 

                let alertBox = document.createElement('div');
                alertBox.className = 'matrix-expand-alert';
                if(cGame === '1') {
                    let cfg = getGridConfigByLevel(currentLevel);
                    alertBox.innerHTML = `MA TRẬN ${cfg.size}X${cfg.size}`;
                } else {
                    let count = getG2SymbolCount(currentLevel);
                    alertBox.innerHTML = `ĐỘ KHÓ: ${count} HÌNH`;
                }
                document.body.appendChild(alertBox);
                playSound('ready');
                setTimeout(() => alertBox.remove(), 1200);

                setTimeout(() => { if(cGame === '1') runGame1(); else runGame2(); }, 1200);
            } else {
                setTimeout(() => { if(cGame === '1') runGame1(); else runGame2(); }, 600);
            }
        }

        function triggerReadyCue(gridElement) {
            gridElement.classList.remove('grid-ready-glow');
            void gridElement.offsetWidth; 
            gridElement.classList.add('grid-ready-glow');
            playSound('ready');
        }

        function runGame1() {
            if(!isPlaying || isPausedForStart) return; buildDynamicGrid(); patternSeq = []; userSeq = []; canClick = false; 
            let config = getGridConfigByLevel(currentLevel); 
            let count = Math.min(3 + currentLevel * 2, Math.floor(config.total * 0.6)); 
            
            while(patternSeq.length < count) { let r = Math.floor(Math.random() * config.total); if(!patternSeq.includes(r)) patternSeq.push(r); }
            let cells = document.getElementById('grid-1').children; patternSeq.forEach(idx => { if(cells[idx]) cells[idx].classList.add('active-glow'); });
            
            gameLogicTimer = setTimeout(() => {
                if(!isPlaying || isPausedForStart) return; 
                patternSeq.forEach(idx => { if(cells[idx]) cells[idx].classList.remove('active-glow'); }); 
                triggerReadyCue(document.getElementById('grid-1'));
                cueHideTimestamp = Date.now(); 
                canClick = true; 
            }, Math.max(500, 1500 - (currentLevel * 100)));
        }

        function handleGame1Click(idx, cellEl) {
            if(!canClick || !isPlaying || isPausedForStart || userSeq.includes(idx)) return; 
            
            if (userSeq.length === 0) {
                let msTime = Date.now() - cueHideTimestamp;
                extractionTimes.push(msTime);
            }

            userSeq.push(idx); 
            if (patternSeq.includes(idx)) { 
                cellEl.classList.add('correct'); 
                processCorrectTap(userSeq.length); 
                if(userSeq.length === patternSeq.length) { canClick = false; checkLevelUp(); } 
            } else { cellEl.classList.add('wrong'); playSound('wrong'); failSequence(); }
        }

        function runGame2() {
            if(!isPlaying || isPausedForStart) return; patternSeq = []; userSeq = []; canClick = false; 
            let count = getG2SymbolCount(currentLevel);
            let availableSymbols = getAvailableSymbolsForLevel(currentLevel);
            
            for(let i=0; i<count; i++) { patternSeq.push(availableSymbols[Math.floor(Math.random() * availableSymbols.length)]); }
            
            let area = document.getElementById('seq-area'); 
            area.innerHTML = patternSeq.map(key => `<div class="quantum-char">${ALL_SHAPES_SMALL[key]}</div>`).join('');
            area.scrollTop = 0;
            
            gameLogicTimer = setTimeout(() => {
                if(!isPlaying || isPausedForStart) return; 
                area.innerHTML = `<div class="hidden-box">?</div>`.repeat(patternSeq.length); 
                triggerReadyCue(area); cueHideTimestamp = Date.now(); canClick = true; 
            }, Math.max(800, 2200 - (currentLevel * 100)));
        }
        
        function addToUserSeq(key) {
            if(!canClick || !isPlaying || isPausedForStart) return;

            if (userSeq.length === 0) { let msTime = Date.now() - cueHideTimestamp; extractionTimes.push(msTime); }

            if(key === patternSeq[userSeq.length]) {
                userSeq.push(key); 
                let html = userSeq.map(k => `<div class="quantum-char">${ALL_SHAPES_SMALL[k]}</div>`).join(''); 
                html += `<div class="hidden-box">?</div>`.repeat(patternSeq.length - userSeq.length); 
                let area = document.getElementById('seq-area');
                area.innerHTML = html; area.scrollTop = area.scrollHeight;
                
                processCorrectTap(patternSeq.length); 
                if(userSeq.length === patternSeq.length) { canClick = false; checkLevelUp(); }
            } else { playSound('wrong'); failSequence(); }
        }

        function finishGame() {
            isPlaying = false; isPausedForStart = true; clearTimeout(gameLogicTimer);
            aScore += pendingScore; pendingScore = 0; 

            let currentHits = (cGame === '1') ? hitsCountG1 : hitsCountG2;
            let avgExtractionMs = extractionTimes.length > 0 ? Math.round(extractionTimes.reduce((a,b)=>a+b, 0) / extractionTimes.length) : 0;

            if (aScore < 200 || currentHits < 3) {
                aScore = 0; highestCompletedLevel = 1; avgExtractionMs = 2500;
            }

            if(cGame === '1') { sessionScoreG1 = Math.round(aScore); localStorage.setItem('thuy_luan_bai1_score', sessionScoreG1); }
            if(cGame === '2') { sessionScoreG2 = Math.round(aScore); localStorage.setItem('thuy_luan_bai2_score', sessionScoreG2); }
            localStorage.setItem('thuy_luan_score', sessionScoreG1 + sessionScoreG2);

            document.getElementById('game-top-bar').classList.add('hidden');
            document.getElementById('game-bottom-bar').classList.add('hidden');
            let playArea = document.getElementById('play-area'); playArea.classList.remove('fullscreen-mode');
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

            playSound('error'); document.getElementById('freeze-overlay').classList.add('active');

            setTimeout(() => {
                document.getElementById('freeze-overlay').classList.remove('active');
                
                let romanName = (cGame === '1') ? 'KẾT QUẢ BÀI 1' : 'KẾT QUẢ BÀI 2';
                document.getElementById('stage-badge-title').innerText = romanName;
                document.getElementById('final-score-display').innerText = Math.floor(aScore);
                document.getElementById('bio-ms-val').innerText = (aScore > 0 && avgExtractionMs > 0 && avgExtractionMs < 2500) ? avgExtractionMs + " ms" : "Chưa đủ Data";
                
                let memRankObj = getRankByStructure(highestCompletedLevel, Math.floor(aScore));
                document.getElementById('bio-rank-badge-mem').innerHTML = getRankHTML(memRankObj.name);

                let btnNext = document.getElementById('btn-next');
                if (cGame === '1') { 
                    btnNext.innerText = "BÀI 2"; btnNext.onclick = proceedNextStage; btnNext.style.display = "block";
                } else { 
                    btnNext.innerText = "TỔNG KẾT"; btnNext.onclick = showFinalSummary; 
                }

                document.getElementById('result-overlay').classList.add('active');
                playSound('coin');
            }, 1200);
        }

        function retryCurrentStage() { playSound('katana'); document.getElementById('result-overlay').classList.remove('active'); openArena(cGame); }
        function proceedNextStage() { playSound('coin'); document.getElementById('result-overlay').classList.remove('active'); openArena('2'); }

        function showFinalSummary() {
            playSound('coin'); document.getElementById('result-overlay').classList.remove('active');
            let totalSessionScore = sessionScoreG1 + sessionScoreG2;
            let avgExtractionMs = extractionTimes.length > 0 ? Math.round(extractionTimes.reduce((a,b)=>a+b, 0) / extractionTimes.length) : 0;

            document.getElementById('sum-score-1').innerText = sessionScoreG1;
            document.getElementById('sum-score-2').innerText = sessionScoreG2;
            document.getElementById('sum-score-total').innerText = totalSessionScore;
            document.getElementById('final-ms').innerText = (avgExtractionMs > 0 && avgExtractionMs < 2500 && totalSessionScore > 0) ? avgExtractionMs + ' ms' : 'Không đạt';
            
            let highestScore = Math.max(sessionScoreG1, sessionScoreG2);
            let finalRankObj = getRankByStructure(highestCompletedLevel, highestScore);

            document.getElementById('sum-rank-mem').innerHTML = getRankHTML(finalRankObj.name);

            if (totalSessionScore < 200) {
                document.getElementById('master-feedback-text').innerText = "Chưa đạt ngưỡng tối thiểu (200 Data). Cần rèn luyện thêm!";
            } else {
                document.getElementById('master-feedback-text').innerText = finalRankObj.feedback;
            }

            document.getElementById('final-summary-overlay').classList.add('active');
        }
    </script>
</body>
</html>
