<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* MÀN CHỚP ĐÓN LÕNG TỪ CORE SANG (Cực kỳ quan trọng để không bị giật đen) */
        #entry-flash { position: fixed; inset: 0; background: radial-gradient(circle, #00e5ff 0%, #000 80%); z-index: 9999; transition: opacity 0.8s ease-out; pointer-events: none; opacity: 1; }

        /* NỀN THỦY LUÂN: Tạm dùng lệnh CSS biến phòng Samurai thành màu nước xanh ngọc sâu thẳm. 
           (Anh có thể thay link ảnh AI xịn của anh vào url(...) sau nhé) */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/INDEX%20SAMURAI.png?raw=true'); background-size: cover; background-position: center; filter: hue-rotate(180deg) saturate(1.2) brightness(0.7); }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP HUD: ĐỒNG BỘ Y HỆT CORE ĐỂ MẮT NGƯỜI KHÔNG NHẬN RA LÀ ĐỔI TRANG */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        /* BOO: HIỂN THỊ TĨNH ĐỂ ĐỒNG BỘ VISUAL, KHÔNG CHO TƯƠNG TÁC ĐỂ TẬP TRUNG NHIỆM VỤ */
        #boo-module-container { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        .boo-hologram { position: absolute; width: 55px; height: 55px; top: 15%; right: 10%; display: flex; justify-content: center; align-items: center; animation: holoHover 3s ease-in-out infinite; }
        @keyframes holoHover { 0%, 100% { margin-top: 0; } 50% { margin-top: -12px; } }
        .boo-face { position: absolute; inset: 2px; background: #ff1493; border-radius: 40% 40% 45% 45%; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 35px rgba(255,20,147,0.8); z-index: 2; }
        .boo-face::before, .boo-face::after { content: ''; position: absolute; width: 6px; height: 11px; top: 20px; background: #000; border-radius: 50%; }
        .boo-face::before { left: 13px; } .boo-face::after { right: 13px; }
        .boo-energy-border { position: absolute; inset: -2px; border-radius: 40% 40% 45% 45%; background: conic-gradient(#00e5ff var(--energy, 100%), transparent 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; padding: 4px; z-index: 3; box-shadow: 0 0 25px #00e5ff, inset 0 0 15px #00e5ff; }

        /* 3 KHỐI THẺ HOLOGRAM THỦY LUÂN */
        #task-container { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; }
        .holo-card { width: 95px; height: 120px; background: rgba(0, 15, 30, 0.4); backdrop-filter: blur(5px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1), 0 0 15px rgba(0, 229, 255, 0.2); cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: translateY(80px) rotateX(-20deg); pointer-events: auto; }
        .holo-card:hover { background: rgba(0, 229, 255, 0.2); transform: translateY(-10px) scale(1.05) !important; box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.4), 0 0 25px rgba(0, 229, 255, 0.5); }
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #fff; text-shadow: 0 0 10px #00e5ff; margin-bottom: 10px; font-weight: bold; }
        .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: bold; color: #00e5ff; text-align: center; line-height: 1.4; text-shadow: 0 0 8px rgba(0,229,255,0.6); }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #ffeb3b; margin-top: 10px; letter-spacing: 1px; }

        /* TRẠM SCI & NÚT TRỞ VỀ ĐỒNG BỘ */
        #sci-terminal { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 320px; display: flex; flex-direction: column; gap: 15px; opacity: 0; transition: opacity 1s ease; z-index: 50; pointer-events: auto; }
        .terminal-box { background: rgba(0, 15, 30, 0.75); backdrop-filter: blur(6px); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 8px; padding: 12px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); text-align: center; }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 15px rgba(0,229,255,0.6); }
        
        .action-btn { background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 10px; border-radius: 4px; cursor: pointer; text-shadow: 0 0 8px rgba(0,229,255,0.8); transition: all 0.3s; box-shadow: inset 0 0 10px rgba(0,229,255,0.2); text-align: center; }
        .action-btn:hover { background: rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
    </style>
</head>
<body>

    <!-- MÀN FLASH CHUYỂN CẢNH ĐÓN ĐẦU VÀO TỪ CORE -->
    <div id="entry-flash"></div>

    <!-- KHÔNG GIAN NỀN -->
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <!-- TRÌNH DUYỆT SẼ PLAY TIẾP NHẠC TỪ LOCALSTORAGE -->
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <!-- TOP HUD ĐỒNG BỘ Y HỆT CORE -->
    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <div id="lore-btn">[ ĐẠO TRƯỜNG THỦY LUÂN ]</div>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <!-- BOO ĐỒNG BỘ TỌA ĐỘ VÀ NĂNG LƯỢNG -->
    <div id="boo-module-container">
        <div class="boo-hologram" id="boo-knight">
            <div class="boo-energy-border" id="boo-energy"></div>
            <div class="boo-face"></div>
        </div>
    </div>

    <!-- 3 KHỐI NHIỆM VỤ CHÍNH TRỒI LÊN TỪ NƯỚC -->
    <div id="task-container">
        <div class="holo-card" id="card-1">
            <div class="card-icon">I</div>
            <div class="card-title">TĨNH KHÍ<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA XONG ]</div>
        </div>
        <div class="holo-card" id="card-2" style="height: 150px; margin-bottom: 20px;"> 
            <div class="card-icon">II</div>
            <div class="card-title">LƯU THỦY<br>(5 Vòng)</div>
            <div class="card-status">[ CHƯA XONG ]</div>
        </div>
        <div class="holo-card" id="card-3">
            <div class="card-icon">III</div>
            <div class="card-title">TÂM TRẬN<br>(60s)</div>
            <div class="card-status" style="color: #00e5ff;">[ ĐIỂM: 27 ]</div>
        </div>
    </div>

    <!-- TRẠM ĐIỀU KHIỂN S.C.I -->
    <div id="sci-terminal">
        <div class="terminal-box">
            <span class="terminal-text">>_ [HỆ THỐNG]: CHỜ ĐỒNG BỘ DỮ LIỆU.</span>
        </div>
        <div class="action-btn" onclick="navToCore()">← LƯU ĐIỂM & TRỞ VỀ LÕI</div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        const booEnergyBorder = document.getElementById('boo-energy');
        
        // Cập nhật ngày
        function runHighTechClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = `${year}.${month}.${day}`;
            requestAnimationFrame(runHighTechClock);
        }

        window.onload = () => {
            runHighTechClock();
            
            // 1. DẬP TẮT FLASH ĐỂ CHUYỂN CẢNH MƯỢT MÀ
            setTimeout(() => { document.getElementById('entry-flash').style.opacity = '0'; }, 100);

            // 2. PHỤC HỒI TRẠNG THÁI TỪ CORE QUA LOCALSTORAGE
            const savedEnergy = localStorage.getItem('boo_energy');
            if(savedEnergy) booEnergyBorder.style.setProperty('--energy', `${savedEnergy}%`);
            
            const savedTime = localStorage.getItem('bg_music_time');
            if(savedTime) bgMusic.currentTime = parseFloat(savedTime);
            
            const savedMuted = localStorage.getItem('bg_music_muted');
            if(savedMuted === 'true') { 
                bgMusic.muted = true; 
                speakerIcon.classList.add('muted'); 
                document.getElementById('volume-slider').value = 0; 
            } else { 
                bgMusic.muted = false; 
                bgMusic.play().catch(e => { console.log("Trình duyệt chặn autoplay"); }); 
            }

            // 3. HIỆU ỨNG TRỒI LÊN CỦA 3 KHỐI NHIỆM VỤ (CASCADE)
            const cards = [document.getElementById('card-2'), document.getElementById('card-1'), document.getElementById('card-3')];
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0) rotateX(0)';
                }, 500 + (index * 150));
            });
            
            // 4. HIỆN BẢNG TERMINAL
            setTimeout(() => { document.getElementById('sci-terminal').style.opacity = '1'; }, 1000);
        };

        // ĐIỀU KHIỂN ÂM THANH
        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { 
                bgMusic.muted = false; bgMusic.play(); 
                speakerIcon.classList.remove('muted'); 
                localStorage.setItem('bg_music_muted', 'false'); 
            } else { 
                bgMusic.muted = true; 
                speakerIcon.classList.add('muted'); 
                localStorage.setItem('bg_music_muted', 'true'); 
            }
        }
        function changeVolume(val) { 
            bgMusic.volume = val; 
            if(val > 0) { 
                bgMusic.muted = false; 
                speakerIcon.classList.remove('muted'); 
                localStorage.setItem('bg_music_muted', 'false'); 
            }
        }

        // HÀM CHUYỂN NGƯỢC VỀ TRẠM LÕI (CORE)
        function navToCore() {
            // Phát âm thanh warp-out
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2000, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.6); 
                gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); 
                osc.start(); osc.stop(ctx.currentTime + 0.6); 
            } catch (e) {}

            if(navigator.vibrate) navigator.vibrate([50, 50, 50]);

            // Cập nhật lại thời gian nhạc hiện tại trước khi đi
            localStorage.setItem('bg_music_time', bgMusic.currentTime);
            
            // Bật flash xanh chói lóa rồi chuyển file
            const flash = document.getElementById('entry-flash');
            flash.style.opacity = '1';
            
            setTimeout(() => { window.location.href = 'core.html'; }, 600);
        }

        // TẠO HẠT BỤI BAY TRONG KHÔNG GIAN
        const dustContainer = document.getElementById('dust-container');
        for(let i = 0; i < 40; i++) {
            let p = document.createElement('div'); let type = Math.random();
            if(type < 0.6) p.className = 'dust-particle dust-small'; else p.className = 'dust-particle dust-large';
            p.style.left = (Math.random() * 100) + 'vw'; p.style.animationDuration = (Math.random() * 10 + 10) + 's'; p.style.animationDelay = (Math.random() * 5) + 's';
            dustContainer.appendChild(p);
        }
    </script>
</body>
</html>
