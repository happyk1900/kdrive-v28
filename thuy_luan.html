<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive - Đạo Trường Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Space Grotesk', sans-serif; }

        /* NỀN THỦY LUÂN TRONG VẮT TỪ ĐẦU */
        #sanctum-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; background-image: url('https://github.com/happyk1900/-m-thanh-app/blob/main/THUY%20LUAN.png?raw=true'); background-size: cover; background-position: center; opacity: 0; transition: opacity 1s ease-in-out; }
        
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dust-particle { position: absolute; border-radius: 50%; opacity: 0; animation: floatDust linear infinite; }
        .dust-small { width: 1.5px; height: 1.5px; background: #fff; box-shadow: 0 0 2px #fff; }
        .dust-large { width: 3px; height: 3px; background: #00e5ff; box-shadow: 0 0 6px #00e5ff; }
        @keyframes floatDust { 0% { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.3; } 100% { transform: translateY(-20vh); opacity: 0; } }

        /* TOP-HUD */
        #top-hud { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 100; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; opacity: 0; transition: opacity 1s ease 1.5s; }
        .audio-wrapper { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
        .speaker-icon { display: flex; align-items: flex-end; gap: 3px; height: 20px; cursor: pointer; padding: 5px; }
        .speaker-icon .bar { width: 4px; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; animation: eqBounce 0.8s infinite alternate ease-in-out; border-radius: 2px; }
        .speaker-icon.muted .bar { animation: none !important; height: 4px !important; background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; }
        .b1 { height: 10px; animation-delay: 0.1s; } .b2 { height: 16px; animation-delay: 0.3s; } .b3 { height: 12px; animation-delay: 0.2s; } .b4 { height: 20px; animation-delay: 0.4s; }
        @keyframes eqBounce { 0% { transform: scaleY(0.4); } 100% { transform: scaleY(1); } }
        #volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: rgba(0, 229, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; cursor: pointer; }
        
        .hud-left-group { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        #user-display { color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; opacity: 0.8; }
        .hud-right-group { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
        #lore-btn { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 3px; border: none; background: transparent; cursor: pointer; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        #date-display { color: rgba(255, 255, 255, 0.4); font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1.5px; }

        /* TIÊU ĐỀ */
        .title-hologram { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(-50px); color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 5px 12px; background: transparent; animation: pulseBtn 2.5s infinite alternate; text-shadow: 0 0 8px rgba(255,255,255,0.8); z-index: 50; pointer-events: none; opacity: 0; transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s; }
        .assembled .title-hologram { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* BẢNG LORE */
        #lore-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(5, 15, 25, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.05); z-index: 1000; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); display: none; opacity: 0; flex-direction: column; gap: 15px; transition: opacity 0.3s, transform 0.3s; pointer-events: auto; }
        #lore-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lore-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 229, 255, 0.4); padding-bottom: 10px; }
        .lore-title { color: #00e5ff; font-weight: bold; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; font-size: 14px; text-shadow: 0 0 8px rgba(0,229,255,0.8); }
        .lore-close { color: #ff2a2a; cursor: pointer; font-weight: bold; font-size: 18px; padding: 0 5px; text-shadow: 0 0 8px #ff2a2a; }
        .lore-content { color: #ffffff; font-size: 12px; line-height: 1.6; min-height: 190px; text-shadow: 0 0 5px rgba(255,255,255,0.3); font-family: 'Share Tech Mono', monospace; }
        .lore-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; }
        .lore-nav { color: #00e5ff; cursor: pointer; padding: 5px 15px; font-weight: bold; font-family: monospace; font-size: 16px; }
        .lore-page-indicator { color: #ffffff; font-family: monospace; font-weight: bold; opacity: 0.8; }

        /* 3 KHỐI THẺ ẢI: HOLOGRAPHIC ASSEMBLING & SƯƠNG MỜ */
        #task-container { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 15px; z-index: 10; align-items: center; justify-content: center; width: 100%; max-width: 360px; pointer-events: none; }
        
        .card-wrapper { transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: auto; }
        #wrapper-1 { transform: translateX(-150vw); opacity: 0; }
        #wrapper-3 { transform: translateX(150vw); opacity: 0; }
        #wrapper-2 { transform: translateY(150vh); opacity: 0; }

        .assembled #wrapper-1 { transform: translateX(0); opacity: 1; transition-delay: 0.2s; }
        .assembled #wrapper-3 { transform: translateX(0); opacity: 1; transition-delay: 0.4s; }
        .assembled #wrapper-2 { transform: translateY(0); opacity: 1; transition-delay: 0.6s; }
        
        .holo-card { width: 95px; height: 110px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: 1px solid #ffd700; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.15); cursor: pointer; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); transition: all 0.3s ease; }
        .holo-card:hover { background: rgba(255, 215, 0, 0.15); box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.5); border-color: #ffe600; }
        
        /* Hiệu ứng dập dềnh liên tục ĐỘC LẬP với hiệu ứng bay vào */
        .float-1 { animation: floatA 4s ease-in-out infinite; }
        .float-2 { animation: floatB 5s ease-in-out infinite 0.5s; height: 130px; margin-bottom: 20px; }
        .float-3 { animation: floatC 4.5s ease-in-out infinite 1s; }

        @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
        @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        .card-icon { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); margin-bottom: 8px; font-weight: bold; }
        .card-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; color: #ffffff; text-align: center; line-height: 1.4; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255,255,255,0.6); }
        .card-status { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: #ffffff; margin-top: 10px; letter-spacing: 1.5px; opacity: 0.7; transition: color 0.3s; }
        .completed-text { color: #ffd700 !important; text-shadow: 0 0 10px #ffd700 !important; font-weight: bold; opacity: 1; }

        /* DẢI BĂNG ĐEN HỆ THỐNG VẮT NGANG MÀN HÌNH - VIỀN TRẮNG */
        #terminal-bar { position: fixed; bottom: 85px; left: 0; width: 100vw; background: rgba(0, 5, 10, 0.85); border-top: 1px solid #ffffff; border-bottom: 1px solid #ffffff; padding: 12px 0; text-align: center; z-index: 45; opacity: 0; transform: translateY(50px); transition: all 1s ease 1.5s; backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }
        .assembled #terminal-bar { opacity: 1; transform: translateY(0); }
        .terminal-text { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(255,255,255,0.8); white-space: nowrap; }
        
        /* ACTION PANEL: CHỨA 2 NÚT RIÊNG BIỆT */
        #action-panel { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px); display: flex; gap: 20px; z-index: 50; opacity: 0; transition: all 1s ease 1.7s; pointer-events: auto; width: 90%; max-width: 350px; justify-content: center; }
        .assembled #action-panel { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .btn-cyan { color: #00e5ff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 15px; background: rgba(0, 10, 20, 0.8); border: 1px solid #00e5ff; cursor: pointer; text-transform: uppercase; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        .btn-cyan:active { background: rgba(0, 229, 255, 0.2); }
        
        .btn-yellow { color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; background: rgba(0, 5, 10, 0.8); border: 1px solid #ffd700; cursor: pointer; text-transform: uppercase; animation: pulseYellow 2s infinite alternate; outline: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: all 0.3s; }
        @keyframes pulseYellow { 0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2), inset 0 0 5px rgba(255, 215, 0, 0.1); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); } 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.4); text-shadow: 0 0 15px rgba(255, 215, 0, 1); } }
        .btn-yellow:active { background: rgba(255, 215, 0, 0.2); }
        .btn-yellow.disabled { color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); animation: none; pointer-events: none; text-shadow: none; box-shadow: none; }

        @keyframes pulseBtn { 0% { opacity: 0.4; } 100% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,1); } }

        /* ================= ĐẤU TRƯỜNG NHIỆM VỤ ĐA HÌNH ================= */
        #task-arena { position: fixed; inset: 0; background: rgba(0, 10, 20, 0.85); backdrop-filter: blur(8px); z-index: 120; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #task-arena.active { opacity: 1; pointer-events: auto; }
        
        .arena-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid #ffd700; width: 90%; max-width: 400px; padding: 25px 20px; text-align: center; box-shadow: 0 0 30px rgba(255,215,0,0.1), inset 0 0 20px rgba(255,215,0,0.05); display: flex; flex-direction: column; align-items: center; gap: 15px; border-radius: 12px; }
        
        .arena-header-bar { display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid rgba(255,215,0,0.4); padding-bottom: 10px; align-items: center; }
        .arena-title { font-family: 'Share Tech Mono', monospace; font-size: 16px; color: #fff; text-shadow: 0 0 8px #ffd700; letter-spacing: 2px; font-weight: bold; }
        .arena-stats { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #ffd700; text-align: right; line-height: 1.5; }
        
        .boo-dialog { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px; padding: 10px; font-size: 12px; font-family: 'Space Grotesk', sans-serif; color: #fff; width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 5px; }
        .boo-tag { color: #ffd700; font-weight: bold; margin-right: 5px; font-family: 'Share Tech Mono', monospace; }

        .arena-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; color: #ffd700; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; letter-spacing: 2px; padding: 10px 20px; cursor: pointer; text-shadow: 0 0 8px rgba(255,215,0,0.8); transition: all 0.3s; border-radius: 4px; width: 100%; max-width: 200px; margin-top: 5px; }
        .arena-btn:active { background: rgba(255, 215, 0, 0.3); }

        /* CONTAINERS CHỨA 3 GAME */
        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; }
        .game-container.active { display: flex; }

        /* Tĩnh Khí & Lưu Thủy Grid (3x3) */
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 220px; height: 220px; margin: 10px auto; }
        .grid-cell { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 24px; transition: all 0.2s ease; box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.05); }
        .grid-cell.active-glow { background: #ffd700; border-color: #fff; box-shadow: 0 0 15px #ffd700; color: #000; }
        .grid-cell.correct { background: #00ff66; border-color: #fff; box-shadow: 0 0 15px #00ff66; color: #000; }
        .grid-cell.wrong { background: #ff3366; border-color: #fff; box-shadow: 0 0 15px #ff3366; color: #fff; }

        /* Tâm Trận (Symbols) */
        .sequence-display { height: 60px; display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 28px; margin: 15px 0; border: 1px dashed rgba(255,215,0,0.5); width: 100%; border-radius: 8px; background: rgba(0,0,0,0.3); }
        .input-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        .btn-symbol { padding: 15px; font-size: 22px; background: rgba(255,255,255,0.05); border: 1px solid #ffd700; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-symbol:active { background: #ffd700; }
    </style>
</head>
<body>

    <!-- KHÔNG CÒN FLASH XANH - NỀN HIỆN RA TỪ TỪ -->
    <div id="sanctum-bg"></div>
    <div id="dust-container"></div>
    
    <audio id="bg-music" loop src="https://github.com/happyk1900/new-abum-17-track/raw/refs/heads/main/Kai%20Ripe%20Signal.mp3"></audio>

    <div id="top-hud">
        <div class="hud-left-group">
            <div class="audio-wrapper">
                <div class="speaker-icon" id="speaker-btn" onclick="toggleAudio()">
                    <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
            </div>
            <div id="user-display">USER: <span id="current-username">KAI RIPE</span></div>
        </div>
        <div class="hud-right-group">
            <button id="lore-btn" onclick="openLore()">GIAO THỨC</button>
            <div id="date-display">--.--.--</div>
        </div>
    </div>

    <div id="lore-modal">
        <div class="lore-header"><span class="lore-title">GIAO THỨC THỦY LUÂN</span><span class="lore-close" onclick="closeLore()">X</span></div>
        <div class="lore-content" id="lore-text"></div>
        <div class="lore-controls"><div class="lore-nav" onclick="prevPage()">[ < ]</div><div class="lore-page-indicator" id="lore-page-num">1 / 3</div><div class="lore-nav" onclick="nextPage()">[ > ]</div></div>
    </div>

    <div class="title-hologram" id="thuy-luan-title">ĐẠO TRƯỜNG THỦY LUÂN</div>

    <div id="task-container">
        <!-- Wrapper xử lý bay vào, Inner xử lý dập dềnh -->
        <div class="card-wrapper" id="wrapper-1">
            <div class="holo-card float-1" id="card-1" onclick="openGameArena('1', 'I. TĨNH KHÍ')">
                <div class="card-icon">I</div>
                <div class="card-title">TĨNH KHÍ<br>(5 Vòng)</div>
                <div class="card-status">[ CHƯA ]</div>
            </div>
        </div>
        
        <div class="card-wrapper" id="wrapper-2">
            <div class="holo-card float-2" id="card-2" onclick="openGameArena('2', 'II. LƯU THỦY')"> 
                <div class="card-icon">II</div>
                <div class="card-title">LƯU THỦY<br>(5 Vòng)</div>
                <div class="card-status">[ CHƯA ]</div>
            </div>
        </div>

        <div class="card-wrapper" id="wrapper-3">
            <div class="holo-card float-3" id="card-3" onclick="openGameArena('3', 'III. TÂM TRẬN')">
                <div class="card-icon">III</div>
                <div class="card-title">TÂM TRẬN<br>(5 Vòng)</div>
                <div class="card-status">[ CHƯA ]</div>
            </div>
        </div>
    </div>

    <div id="terminal-bar">
        <span class="terminal-text" id="sys-msg">>_ [HỆ THỐNG]: KHỞI ĐỘNG ĐẠO TRƯỜNG...</span>
    </div>

    <div id="action-panel">
        <button class="btn-cyan" onclick="navToCore()">[ TRỞ VỀ LÕI ]</button>
        <button class="btn-yellow disabled" id="btn-save-score" onclick="saveScore()">[ LƯU ĐIỂM ]</button>
    </div>

    <!-- ĐẤU TRƯỜNG ĐA HÌNH (GỘP CẢ 3 GAME) -->
    <div id="task-arena">
        <div class="arena-box">
            <div class="arena-header-bar">
                <div class="arena-title" id="arena-title">TÊN ẢI</div>
                <div class="arena-stats">
                    TÂM LỰC: <span id="arena-lives">⚡⚡⚡</span><br>
                    VÒNG: <span id="arena-round">1 / 5</span>
                </div>
            </div>
            
            <!-- GAME 1: TĨNH KHÍ -->
            <div id="game-1-container" class="game-container">
                <div class="grid-3x3" id="grid-1"></div>
            </div>

            <!-- GAME 2: LƯU THỦY -->
            <div id="game-2-container" class="game-container">
                <div class="grid-3x3" id="grid-2"></div>
            </div>

            <!-- GAME 3: TÂM TRẬN -->
            <div id="game-3-container" class="game-container">
                <div class="sequence-display" id="seq-area">---</div>
                <div class="input-area">
                    <button class="btn-symbol" onclick="addToUserSeq('⚔️')">⚔️</button>
                    <button class="btn-symbol" onclick="addToUserSeq('🛡️')">🛡️</button>
                    <button class="btn-symbol" onclick="addToUserSeq('🏹')">🏹</button>
                    <button class="btn-symbol" onclick="addToUserSeq('🌀')">🌀</button>
                </div>
            </div>

            <div class="boo-dialog">
                <span class="boo-tag">[BOO]:</span> <span id="boo-msg">Chuẩn bị tĩnh tâm bước vào thử thách.</span>
            </div>

            <button class="arena-btn" id="arena-btn" onclick="startArenaRound()">[ KHAI TRẬN ]</button>
            <button class="arena-btn" style="border-color: #ff2a2a; color: #ff2a2a; background: transparent;" onclick="closeTaskArena()">[ RÚT LUI ]</button>
        </div>
    </div>

    <script>
        // ================= HỆ THỐNG ÂM THANH & CƠ BẢN =================
        const bgMusic = document.getElementById('bg-music');
        const speakerIcon = document.getElementById('speaker-btn');
        
        function playSound(type) {
            try { 
                const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1500, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'brake') { 
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1); 
                    osc.start(); osc.stop(ctx.currentTime + 0.1); 
                } else if(type === 'boing') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4); 
                    gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } else if(type === 'error') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // ================= HIỆU ỨNG KHỞI ĐỘNG (ASSEMBLING) =================
        window.onload = () => {
            const now = new Date();
            document.getElementById('date-display').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
            
            document.getElementById('sanctum-bg').style.opacity = '1';
            
            if(localStorage.getItem('bg_music_time')) bgMusic.currentTime = parseFloat(localStorage.getItem('bg_music_time'));
            if(localStorage.getItem('bg_music_muted') === 'true') { bgMusic.muted = true; speakerIcon.classList.add('muted'); document.getElementById('volume-slider').value = 0; } 
            else { bgMusic.muted = false; bgMusic.play().catch(e => {}); }

            // Lắp ráp không gian
            setTimeout(() => { document.body.classList.add('assembled'); }, 300);
            setTimeout(updateSystemTerminal, 2500);
        };

        function toggleAudio() {
            if (bgMusic.muted || bgMusic.paused) { bgMusic.muted = false; bgMusic.play(); speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } 
            else { bgMusic.muted = true; speakerIcon.classList.add('muted'); localStorage.setItem('bg_music_muted', 'true'); }
        }
        function changeVolume(val) { bgMusic.volume = val; if(val > 0) { bgMusic.muted = false; speakerIcon.classList.remove('muted'); localStorage.setItem('bg_music_muted', 'false'); } }

        // ================= HỆ THỐNG THEO DÕI =================
        let thuyLuanTasks = { '1': false, '2': false, '3': false };

        function updateSystemTerminal() {
            let pending = Object.keys(thuyLuanTasks).find(k => !thuyLuanTasks[k]);
            let msgEl = document.getElementById('sys-msg');
            let saveBtn = document.getElementById('btn-save-score');
            
            if (pending) {
                let name = pending === '1' ? 'TĨNH KHÍ' : pending === '2' ? 'LƯU THỦY' : 'TÂM TRẬN';
                msgEl.innerHTML = `>_ [HỆ THỐNG]: CHỜ HOÀN THÀNH [${name}].`;
                saveBtn.classList.add('disabled');
            } else {
                msgEl.innerHTML = `>_ [HỆ THỐNG]: ĐẠO TRƯỜNG VIÊN MÃN. HÃY LƯU ĐIỂM.`;
                saveBtn.classList.remove('disabled');
            }
        }

        // ================= LOGIC ĐẤU TRƯỜNG & 3 ẢI =================
        let currentGame = '1';
        let currentRound = 1;
        let currentLives = 3;
        const MAX_ROUNDS = 5;
        let isPlaying = false;
        let canClick = false;

        // Dữ liệu riêng từng ải
        let t1Pattern = [], t1User = [];
        let t2Path = [], t2User = [];
        let t3Seq = [], t3User = [];
        const t3Symbols = ['⚔️', '🛡️', '🏹', '🌀'];

        // Khởi tạo Lưới 3x3 cho Ải 1 và 2
        for(let i=0; i<9; i++) {
            let c1 = document.createElement('div'); c1.className = 'grid-cell'; c1.onclick = () => handleGame1Click(i, c1); document.getElementById('grid-1').appendChild(c1);
            let c2 = document.createElement('div'); c2.className = 'grid-cell'; c2.onclick = () => handleGame2Click(i, c2); document.getElementById('grid-2').appendChild(c2);
        }

        function booMsg(text) { document.getElementById('boo-msg').innerText = text; }
        
        function updateArenaUI() {
            document.getElementById('arena-round').innerText = `${currentRound} / ${MAX_ROUNDS}`;
            document.getElementById('arena-lives').innerText = '⚡'.repeat(currentLives) + '❌'.repeat(3 - currentLives);
        }

        function openGameArena(id, name) {
            playSound('katana');
            if(navigator.vibrate) navigator.vibrate(50);
            
            currentGame = id;
            currentRound = 1;
            currentLives = 3;
            isPlaying = false;
            canClick = false;

            document.getElementById('task-container').style.opacity = '0';
            document.getElementById('task-container').style.pointerEvents = 'none';
            document.getElementById('action-panel').style.opacity = '0';
            document.getElementById('action-panel').style.pointerEvents = 'none';
            
            document.getElementById('arena-title').innerText = name;
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`game-${id}-container`).classList.add('active');
            
            updateArenaUI();
            booMsg("Tập trung tinh thần. Chuẩn bị khai trận!");
            document.getElementById('arena-btn').innerText = "[ BẮT ĐẦU VÒNG 1 ]";
            document.getElementById('arena-btn').style.display = 'block';
            
            // Xóa rác cũ
            document.querySelectorAll('.grid-cell').forEach(c => { c.className = 'grid-cell'; c.innerText = ''; });
            document.getElementById('seq-area').innerText = '---';

            document.getElementById('task-arena').classList.add('active');
        }

        function closeTaskArena() {
            playSound('brake');
            document.getElementById('task-arena').classList.remove('active');
            document.getElementById('task-container').style.opacity = '1';
            document.getElementById('task-container').style.pointerEvents = 'auto';
            document.getElementById('action-panel').style.opacity = '1';
            document.getElementById('action-panel').style.pointerEvents = 'auto';
        }

        function startArenaRound() {
            if(isPlaying) return;
            isPlaying = true;
            canClick = false;
            document.getElementById('arena-btn').style.display = 'none';
            playSound('boing');

            // Reset UI lưới
            document.querySelectorAll('.grid-cell').forEach(c => { c.className = 'grid-cell'; c.innerText = ''; });
            
            if(currentGame === '1') runGame1();
            else if(currentGame === '2') runGame2();
            else if(currentGame === '3') runGame3();
        }

        function loseLife() {
            currentLives--;
            playSound('error');
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            updateArenaUI();
            isPlaying = false;
            canClick = false;

            if(currentLives <= 0) {
                booMsg("Tâm trí hỗn loạn! Trận pháp sụp đổ. Hãy rút lui!");
                setTimeout(closeTaskArena, 2000);
            } else {
                booMsg("Lệch lạc! Thử lại vòng này.");
                document.getElementById('arena-btn').innerText = `[ THỬ LẠI VÒNG ${currentRound} ]`;
                document.getElementById('arena-btn').style.display = 'block';
            }
        }

        function winRound() {
            playSound('katana');
            currentRound++;
            isPlaying = false;
            canClick = false;

            if(currentRound > MAX_ROUNDS) {
                booMsg("Tuyệt kỹ! Cảnh giới viên mãn.");
                let card = document.getElementById(`card-${currentGame}`);
                card.querySelector('.card-status').innerHTML = "<span class='completed-text'>[ ĐÃ XONG ]</span>";
                card.style.borderColor = "#ffd700";
                thuyLuanTasks[currentGame] = true;
                
                setTimeout(() => { closeTaskArena(); updateSystemTerminal(); }, 1500);
            } else {
                updateArenaUI();
                booMsg("Chuẩn xác. Tiếp tục dòng chảy...");
                document.getElementById('arena-btn').innerText = `[ TIẾP TỤC VÒNG ${currentRound} ]`;
                document.getElementById('arena-btn').style.display = 'block';
            }
        }

        // --- GAME 1: TĨNH KHÍ (Nhớ 3 vị trí độc lập) ---
        function runGame1() {
            t1Pattern = []; t1User = [];
            while(t1Pattern.length < 3) {
                let r = Math.floor(Math.random() * 9);
                if(!t1Pattern.includes(r)) t1Pattern.push(r);
            }
            booMsg("Ghi nhớ trận pháp Bát Quái...");
            let cells = document.getElementById('grid-1').children;
            t1Pattern.forEach(idx => { cells[idx].classList.add('active-glow'); cells[idx].innerText = '⚡'; });
            
            setTimeout(() => {
                t1Pattern.forEach(idx => { cells[idx].classList.remove('active-glow'); cells[idx].innerText = ''; });
                booMsg("Tái lập lại 3 vị trí vừa sáng!");
                canClick = true;
            }, 1500); // Rút ngắn time cho khó hơn
        }
        function handleGame1Click(idx, cellEl) {
            if(!canClick || t1User.includes(idx)) return;
            t1User.push(idx);
            cellEl.classList.add('active-glow'); cellEl.innerText = '💧';
            
            if(t1User.length === 3) {
                canClick = false;
                let correct = t1User.filter(v => t1Pattern.includes(v)).length;
                if(correct === 3) {
                    t1User.forEach(i => document.getElementById('grid-1').children[i].classList.replace('active-glow', 'correct'));
                    winRound();
                } else {
                    t1User.forEach(i => document.getElementById('grid-1').children[i].classList.replace('active-glow', 'wrong'));
                    loseLife();
                }
            }
        }

        // --- GAME 2: LƯU THỦY (Nhớ 4 vị trí theo quỹ đạo) ---
        async function runGame2() {
            t2Path = []; t2User = [];
            for(let i=0; i<4; i++) t2Path.push(Math.floor(Math.random() * 9));
            booMsg("Quan sát quỹ đạo dòng chảy...");
            let cells = document.getElementById('grid-2').children;
            
            for(let id of t2Path) {
                cells[id].classList.add('active-glow');
                await new Promise(r => setTimeout(r, 600));
                cells[id].classList.remove('active-glow');
                await new Promise(r => setTimeout(r, 200));
            }
            booMsg("Đuổi theo dòng nước!");
            canClick = true;
        }
        function handleGame2Click(idx, cellEl) {
            if(!canClick) return;
            if(idx === t2Path[t2User.length]) {
                cellEl.classList.add('correct');
                t2User.push(idx);
                setTimeout(() => cellEl.classList.remove('correct'), 300);
                if(t2User.length === t2Path.length) { canClick = false; winRound(); }
            } else {
                cellEl.classList.add('wrong');
                loseLife();
            }
        }

        // --- GAME 3: TÂM TRẬN (Nhớ chuỗi khí cụ) ---
        function runGame3() {
            t3Seq = []; t3User = [];
            for(let i=0; i<4; i++) t3Seq.push(t3Symbols[Math.floor(Math.random()*4)]);
            let area = document.getElementById('seq-area');
            area.innerText = t3Seq.join(' ');
            booMsg("Ghi nhớ chuỗi khí cụ...");
            
            setTimeout(() => {
                area.innerText = '❓ ❓ ❓ ❓';
                booMsg("Rút vũ khí đúng thứ tự!");
                canClick = true;
            }, 2000);
        }
        function addToUserSeq(sym) {
            if(!canClick) return;
            if(sym === t3Seq[t3User.length]) {
                t3User.push(sym);
                let display = t3User.join(' ') + ' ❓'.repeat(4 - t3User.length);
                document.getElementById('seq-area').innerText = display;
                if(t3User.length === 4) { canClick = false; winRound(); }
            } else {
                document.getElementById('seq-area').innerText = '❌ SAI LỆCH ❌';
                loseLife();
            }
        }

        // ================= ĐIỀU HƯỚNG =================
        function saveScore() {
            if(document.getElementById('btn-save-score').classList.contains('disabled')) return;
            playSound('boing');
            if(navigator.vibrate) navigator.vibrate([100, 100, 200]);
            document.getElementById('sys-msg').innerHTML = `>_ [HỆ THỐNG]: ĐÃ ĐỒNG BỘ ĐIỂM SỐ VỀ LÕI!`;
            setTimeout(navToCore, 1500);
        }

        function navToCore() {
            playSound('brake');
            document.body.classList.remove('assembled'); // Rã khối
            document.getElementById('sanctum-bg').style.opacity = '0'; // Tắt nền
            setTimeout(() => { window.location.href = 'index.html'; }, 1000); 
        }
    </script>
</body>
</html>
