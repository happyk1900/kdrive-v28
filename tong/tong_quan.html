<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030406">
    <title>K-Drive - Trạm Điều Phối Trí Lực</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Space+Grotesk:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #030406;
            --cyan: #00e5ff;
            --mint: #00ff9d;
            --gold: #ffd700;
            --font-title: 'Chakra Petch', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-terminal: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-obsidian); color: #ffffff;
            font-family: var(--font-display); overflow: hidden;
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #bg-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1;
            object-fit: cover; opacity: 0; transition: opacity 2s ease;
        }
        #bg-video.loaded { opacity: 1; }

        .tactical-grid-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; overflow: hidden; }
        .grid-plane { position: absolute; width: 200vw; height: 200vh; left: -50vw; top: 0%; background-image: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; transform: rotateX(75deg); animation: grid-scroll 10s linear infinite; }
        .vignette { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; background: radial-gradient(circle at center, transparent 30%, #030406 95%); }
        @keyframes grid-scroll { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

        .top-nav { position: fixed; top: max(35px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; z-index: 9999; }
        .btn-back-cyber { width: 36px; height: 36px; background: rgba(5, 7, 10, 0.9); border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 8px; color: var(--cyan); font-family: var(--font-terminal); font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-back-cyber:active { transform: scale(0.9); }

        /* HỘP LỜI CHÀO GỌN GÀNG, NÉT DÀY SẮC NÉT, KHÔNG LỚP MỜ ĐEN PHỒNG CỀNH */
        .cyber-modal-custom { position: fixed; inset: 0; z-index: 300000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; background: transparent; }
        .cyber-led-wrapper { position: relative; padding: 1.5px; overflow: hidden; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); width: 90vw; max-width: 360px; box-shadow: 0 0 35px rgba(0,229,255,0.4); z-index: 10; }
        
        .modal-box { width: 100%; background: rgba(5, 9, 16, 0.96); padding: 22px 18px; text-align: left; position: relative; z-index: 1; display: flex; flex-direction: column; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); border: 1px solid rgba(0,229,255,0.6); }
        
        /* TIÊU ĐỀ NÉT DÀY, MẠNH MẼ, PHÁT SÁNG */
        .modal-title { font-family: var(--font-title); color: var(--cyan); font-size: 21px; font-weight: 800; margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; text-align: center; text-shadow: 0 0 12px rgba(0,229,255,0.7); }
        
        .desc-text { font-family: var(--font-display); font-size: 13.5px; color: #ffffff; line-height: 1.6; text-align: left; background: rgba(0,229,255,0.03); border: 1px solid rgba(0,229,255,0.2); border-radius: 6px; padding: 12px; margin-bottom: 16px; }

        /* NÚT BẮT ĐẦU MÀU XANH LÁ HẤP DẪN */
        .modal-btn { width: 100%; padding: 14px; font-family: var(--font-title); font-size: 15px; font-weight: 800; background: var(--mint); color: #000000; border: none; cursor: pointer; text-transform: uppercase; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); text-align: center; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,255,157,0.6); letter-spacing: 1px; }
        .modal-btn:active { transform: scale(0.96); filter: brightness(1.2); }

        #test-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; z-index: 200; display: none; background: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline webkit-playsinline>
        <source src="../Photo/video nen trang chu.mp4" type="video/mp4">
    </video>

    <div class="tactical-grid-bg"><div class="grid-plane"></div></div>
    <div class="vignette"></div>

    <div class="top-nav">
        <button class="btn-back-cyber" onclick="returnToMain()">⟨</button>
    </div>

    <!-- HỘP LỜI CHÀO GỌN GÀNG, NÉT DÀY -->
    <div class="cyber-modal-custom" id="step-welcome">
        <div class="cyber-led-wrapper">
            <div class="modal-box">
                <div class="modal-title">CHUỖI TEST TRÍ LỰC</div>
                <div class="desc-text">
                    Chào mừng chiến binh đến với bài đánh giá thần kinh toàn diện qua các hệ thống trắc nghiệm liên hoàn.<br><br>
                    • Đánh giá tốc độ trích xuất không gian<br>
                    • Đo lường năng lực phản xạ & phán đoán<br><br>
                    Hệ thống sẽ ghi nhận và tổng kết toàn bộ điểm số ngay sau khi hoàn thành!
                </div>
                <button class="modal-btn" onclick="startFlow()">BẮT ĐẦU</button>
            </div>
        </div>
    </div>

    <iframe id="test-frame" src=""></iframe>

    <script>
        const testPipeline = [
            'Testthuy_luan.html' // Bài Trí Nhớ (Thủy Luân)
        ];
        
        let currentTestIndex = 0;

        window.onload = () => {
            let vid = document.getElementById('bg-video');
            setTimeout(() => vid.classList.add('loaded'), 200);
        };

        function startFlow() {
            currentTestIndex = 0;
            localStorage.setItem('kdrive_in_flow', 'true');
            document.getElementById('step-welcome').classList.add('hidden');
            loadNextTestInFrame();
        }

        function loadNextTestInFrame() {
            if (currentTestIndex >= testPipeline.length) {
                returnToMain();
                return;
            }

            let targetUrl = testPipeline[currentTestIndex];
            let frame = document.getElementById('test-frame');
            frame.style.display = 'block';
            frame.src = targetUrl;
        }

        // Lắng nghe tín hiệu hoàn thành từ file test con để quay về sảnh mượt mà
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'test_completed') {
                returnToMain();
            }
        });

        function returnToMain() {
            localStorage.removeItem('kdrive_in_flow');
            window.location.href = '../LucChien_2.html';
        }
    </script>
</body>
</html>
