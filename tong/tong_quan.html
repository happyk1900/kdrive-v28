<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030406">
    <title>K-Drive - Test Nhanh Trí Lực Toàn Diện</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Space+Grotesk:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #030406;
            --cyan: #00e5ff;
            --mint: #00ff9d;
            --gold: #ffd700;
            --font-title: 'Chakra Petch', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-terminal: 'Share Tech Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: var(--font-display); color: #fff; }

        /* VIDEO NỀN GỐC TỪ THƯ MỤC PHOTO */
        #sanctum-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1;
            object-fit: cover; opacity: 0; transition: opacity 2.5s ease;
        }
        #sanctum-video.loaded { opacity: 1; }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px var(--cyan); opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        .top-nav { position: fixed; top: max(35px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; z-index: 9999; }
        .btn-back-cyber { width: 36px; height: 36px; background: rgba(5, 7, 10, 0.9); border: 1px solid rgba(0, 229, 255, 0.6); border-radius: 8px; color: var(--cyan); font-family: var(--font-terminal); font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-back-cyber:active { transform: scale(0.9); }

        /* HỘP LỜI CHÀO GỌN GÀNG, NÉT DÀY */
        .cyber-modal-custom { position: fixed; inset: 0; z-index: 300000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; background: transparent; }
        .cyber-led-wrapper { position: relative; padding: 1.5px; overflow: hidden; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); width: 90vw; max-width: 360px; box-shadow: 0 0 35px rgba(0,229,255,0.4); z-index: 10; }
        
        .modal-box { width: 100%; background: rgba(5, 9, 16, 0.96); padding: 22px 18px; text-align: left; position: relative; z-index: 1; display: flex; flex-direction: column; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); border: 1px solid rgba(0,229,255,0.6); }
        .modal-title { font-family: var(--font-title); color: var(--cyan); font-size: 21px; font-weight: 800; margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; text-align: center; text-shadow: 0 0 12px rgba(0,229,255,0.7); }
        .desc-text { font-family: var(--font-display); font-size: 13.5px; color: #ffffff; line-height: 1.6; text-align: left; background: rgba(0,229,255,0.03); border: 1px solid rgba(0,229,255,0.2); border-radius: 6px; padding: 12px; margin-bottom: 16px; }

        /* NÚT BẮT ĐẦU MÀU XANH LÁ HẤP DẪN */
        .modal-btn { width: 100%; padding: 14px; font-family: var(--font-title); font-size: 15px; font-weight: 800; background: var(--mint); color: #000000; border: none; cursor: pointer; text-transform: uppercase; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); text-align: center; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,255,157,0.6); letter-spacing: 1px; }
        .modal-btn:active { transform: scale(0.96); filter: brightness(1.2); }

        #task-arena { position: fixed; inset: 0; display: none; z-index: 120; }
        #task-arena.active { display: block; }

        /* KHUNG CHỨA NỘI DUNG GAME NHÚNG HOẶC ĐIỀU PHỐI TRỰC TIẾP */
        #game-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; background: transparent; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- VIDEO NỀN GỐC THAY ĐỔI THEO TỪNG BÀI TEST -->
    <video id="sanctum-video" autoplay loop muted playsinline webkit-playsinline>
        <source src="../Photo/video nen thuy luan.mp4" type="video/mp4">
    </video>

    <div id="dust-container"></div>

    <div class="top-nav">
        <button class="btn-back-cyber" onclick="returnToMain()">⟨</button>
    </div>

    <!-- HỘP LỜI CHÀO CHUỖI TEST TỔNG QUAN -->
    <div class="cyber-modal-custom" id="step-welcome">
        <div class="cyber-led-wrapper">
            <div class="modal-box">
                <div class="modal-title">CHUỖI TEST TRÍ LỰC</div>
                <div class="desc-text">
                    Chào mừng chiến binh đến với bài đánh giá thần kinh toàn diện qua 3 hệ thống trắc nghiệm liên hoàn:<br><br>
                    • <b>Thủy Luân</b> (Trí nhớ không gian)<br>
                    • <b>Hỏa Luân</b> (Phản xạ & tốc độ phát lực)<br>
                    • <b>Phong Luân</b> (Phán đoán & bám dính quỹ đạo)<br><br>
                    Hệ thống sẽ ghi nhận và tổng kết toàn bộ điểm số ở cuối chuỗi!
                </div>
                <button class="modal-btn" onclick="startFullPipeline()">BẮT ĐẦU</button>
            </div>
        </div>
    </div>

    <!-- KHUNG ĐIỀU PHỐI CHUỖI TEST -->
    <div id="task-arena">
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Danh sách 3 file test liên hoàn
        const pipelineFiles = [
            'Testthuy_luan.html',
            'TestHoaLuan.html',
            'TestPhongLuan.html'
        ];
        
        let pipelineIndex = 0;

        window.onload = () => {
            let vid = document.getElementById('sanctum-video');
            setTimeout(() => vid.classList.add('loaded'), 200);
            initSparkleParticles();
        };

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                container.appendChild(p);
            }
        }

        function startFullPipeline() {
            pipelineIndex = 0;
            localStorage.setItem('kdrive_in_flow', 'true');
            document.getElementById('step-welcome').classList.add('hidden');
            document.getElementById('task-arena').classList.add('active');
            loadPipelineStep();
        }

        function loadPipelineStep() {
            if (pipelineIndex >= pipelineFiles.length) {
                // Đã hoàn tất cả 3 bài -> Quay về sảnh chính
                returnToMain();
                return;
            }

            let currentFile = pipelineFiles[pipelineIndex];
            
            // Đổi video nền tương ứng theo bài test
            let vid = document.getElementById('sanctum-video');
            if (pipelineIndex === 0) vid.src = '../Photo/video nen thuy luan.mp4';
            else if (pipelineIndex === 1) vid.src = '../Photo/video nen hoa luan.mp4';
            else if (pipelineIndex === 2) vid.src = '../Photo/video nen phong luan.mp4';
            vid.play().catch(e => {});

            document.getElementById('game-frame').src = currentFile;
        }

        // Lắng nghe tín hiệu hoàn thành từ các bài test con để tự động sang bài tiếp theo
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'test_completed') {
                pipelineIndex++;
                loadPipelineStep();
            }
        });

        function returnToMain() {
            localStorage.removeItem('kdrive_in_flow');
            window.location.href = '../LucChien_2.html';
        }
    </script>
</body>
</html>
