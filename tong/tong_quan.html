<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050b14">
    <title>K-Drive - Trí Nhớ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #050b14;
            --cyan: #00e5ff;
            --mint: #ff3366;    
            --neon-pink: #f48fb1; 
            --amber: #ffb74d;   
            --crimson: #ff3366;
            --gold: #ffd700;
            --text-light: #ffffff;
            --panel-bg: rgba(6, 15, 30, 0.88); 
            --panel-border: rgba(244, 143, 177, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        #sanctum-video { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            object-fit: cover; opacity: 0; transition: opacity 2.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #sanctum-video.loaded { opacity: 1; }
        #sanctum-video.playing-mode { opacity: 0; pointer-events: none; transition: opacity 2.0s cubic-bezier(0.25, 1, 0.5, 1); }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px #f48fb1; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 380px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background: var(--bg-obsidian) !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #f48fb1; box-shadow: 0 0 25px #f48fb1, 0 0 50px #ffffff; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        @keyframes cinematicPopupSuperSlow {
            0% { opacity: 0; transform: translateY(90px) scale(0.90); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
            50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 25px currentColor, inset 0 0 10px currentColor; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
        }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 16px; opacity: 0; visibility: hidden; transition: opacity 0.5s ease; }
        #start-prompt-overlay.active { opacity: 1; visibility: visible; }
        #start-prompt-overlay > * { animation: cinematicPopupSuperSlow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .briefing-panel { background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px 26px; width: 100%; max-width: 340px; text-align: left; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .briefing-title { color: #00e5ff !important; font-family: 'Chakra Petch', sans-serif; font-size: 24px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(0, 229, 255, 0.4); padding-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,229,255,0.6); }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.6; font-weight: 600; text-align: center; }

        .action-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        
        .start-action-box { width: 100%; background: var(--panel-bg); border: 1.5px solid #00ff9d; padding: 15px; border-radius: 12px; color: #00ff9d; font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; animation: pulse-btn 1.5s infinite; }
        .start-action-box:active { transform: scale(0.96); background: #00ff9d; color: #050b14; }

        .game-top-bar {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease;
        }
        .game-top-bar.visible { opacity: 1; }

        .health-container { display: flex; gap: 4px; align-items: center; }
        .health-bar { width: 14px; height: 6px; background: rgba(255,255,255,0.2); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.green.active { background: #f48fb1; box-shadow: 0 0 10px #f48fb1; }
        .health-bar.pink.active { background: #f48fb1; box-shadow: 0 0 10px #f48fb1; }

        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; color: #fff; display: flex; align-items: center; position: relative; }
        .data-score span { color: #f48fb1; text-shadow: 0 0 12px #f48fb1; font-size: 20px; margin-left: 6px; }
        #hp-notification-area { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); width: 220px; text-align: center; }

        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw; border-top: 1px solid rgba(244, 143, 177, 0.5); padding: 15px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; background: linear-gradient(0deg, rgba(5,11,20,0.95) 0%, transparent 100%); opacity: 0; transition: opacity 1.5s ease;
        }
        .game-bottom-bar.visible { opacity: 1; }

        .btn-action { width: 46px; height: 46px; background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(244, 143, 177, 0.75); border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:active { transform: scale(0.9); }
        .btn-back { color: #f48fb1; font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: bold; box-shadow: 0 0 12px rgba(244,143,177,0.4); padding-bottom: 2px; padding-right: 2px; }
        .btn-mute { border-color: rgba(255, 183, 77, 0.6); color: #ffb74d; font-size: 20px; box-shadow: 0 0 12px rgba(255, 183, 77, 0.3); }
        .btn-pause { border-color: rgba(255, 183, 77, 0.6); box-shadow: 0 0 12px rgba(255, 183, 77, 0.3); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 18px; background: #ffb74d; margin: 0 3px; border-radius: 2px; box-shadow: 0 0 8px #ffb74d; }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; backdrop-filter: blur(10px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 320px; background: rgba(5, 12, 25, 0.95); border: 1.5px solid rgba(244,143,177,0.6); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: cinematicPopupSuperSlow 1.0s forwards; }
        .pause-title { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: #f48fb1; margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(244,143,177,0.6); }
        .pause-btn { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 51, 102, 0.2); border: 1px solid #ff3366; color: #ff3366; margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: transparent; z-index: 200000; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #freeze-overlay.active { display: flex; }
        @keyframes textFallSlow { 0% { opacity: 0; transform: translateY(-70px) scale(1.1); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .freeze-text { font-family: 'Chakra Petch', sans-serif; font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 20px #f48fb1, 0 0 40px #ff3366, 2px 2px 0px rgba(0,0,0,0.9); animation: textFallSlow 1.4s forwards; }

        #final-summary-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 10px; padding: 10px; opacity: 0; transition: opacity 1.2s ease; }
        #final-summary-overlay.active { display: flex; opacity: 1; }
        #final-summary-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s forwards; opacity: 0; }

        .final-header { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: #ffffff; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(244,143,177,0.8); margin-bottom: 4px; }
        
        .stat-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); padding: 12px 20px; border-radius: 14px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .stat-line { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 80px; color: #f48fb1; text-shadow: 0 0 8px rgba(244,143,177,0.5); font-size: 20px;}

        /* KHUNG THÔNG SỐ TINH GỌN VÀ Ô NHẬN XÉT CHI TIẾT */
        .bio-metrics-box { width: 92%; max-width: 340px; background: rgba(5, 14, 28, 0.95); backdrop-filter: blur(22px); border: 2px solid rgba(0, 229, 255, 0.6); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,229,255,0.1); }
        
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(244, 143, 177, 0.3); padding-bottom: 8px; margin-bottom: 0; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13.5px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: #f48fb1; font-family: 'Share Tech Mono', monospace; font-size: 14.5px; font-weight: bold; text-align: right; text-shadow: 0 0 8px rgba(244,143,177,0.5); }

        .debug-feedback { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #ffffff; text-align: left; background: rgba(0, 0, 0, 0.6); border: 1.5px solid rgba(0, 229, 255, 0.4); padding: 10px 12px; border-radius: 8px; line-height: 1.5; text-shadow: 0 0 6px rgba(255,255,255,0.4); }

        .result-btn-row { display: flex; gap: 10px; width: 92%; max-width: 340px; margin-top: 5px; }
        .result-action-btn { flex: 1; padding: 13px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; backdrop-filter: blur(8px); letter-spacing: 1px; }
        
        #btn-replay { background: var(--panel-bg); border: 1.5px solid #ff3366; color: #ff3366; animation: pulse-btn 1.5s infinite; }
        #btn-replay:active { background: #ff3366; color: #fff; transform: scale(0.95); animation: none; }
        
        #btn-next { background: var(--panel-bg); border: 1.5px solid #00e5ff; color: #00e5ff; animation: pulse-btn 1.5s infinite; animation-delay: 0.2s; }
        #btn-next:active { background: #00e5ff; color: #050b14; transform: scale(0.95); animation: none; }

        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .game-container.active { display: flex; }
        
        .grid-ready-glow { animation: readyPulse 0.4s ease-out forwards; }
        @keyframes readyPulse {
            0% { border-color: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0px transparent; }
            30% { border-color: rgba(255, 255, 255, 1); box-shadow: 0 0 30px rgba(244,143,177,0.8), inset 0 0 20px rgba(244,143,177,0.5); }
            100% { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        }

        .sequence-display { min-height: 90px; max-height: 140px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-bottom: 25px; width: 95%; max-width: 350px; background: rgba(15, 23, 42, 0.85); border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, 0.4); padding: 10px 15px; overflow-y: auto; scroll-behavior: smooth; }
        .sequence-display::-webkit-scrollbar { width: 4px; }
        .sequence-display::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 2px; }

        .input-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 85%; max-width: 250px;}
        
        .btn-symbol { padding: 0; height: 58px; display: flex; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.8); border: 1.5px solid rgba(255, 255, 255, 0.4); border-radius: 10px; cursor: pointer; transition: 0.15s; }
        .btn-symbol:active { background: rgba(244, 143, 177, 0.4); transform: scale(0.96); }
        
        .hidden-box { min-width: 26px; height: 36px; display: inline-flex; justify-content: center; align-items: center; border: 1.5px dashed rgba(255, 255, 255, 0.5); border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: #f48fb1; font-size: 15px;}
        .quantum-char { display: inline-flex; justify-content: center; align-items: center; width: 26px; height: 36px; flex-shrink: 0; }

        .shape-svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 4px rgba(0,0,0,0.15)); }
        .shape-svg-small { width: 20px; height: 20px; display: block; filter: drop-shadow(0 0 2px rgba(0,0,0,0.15)); }

        .status-notification { font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: 900; color: #f48fb1; text-shadow: 0 0 10px rgba(244,143,177,0.6); animation: topAlertAnim 1.2s ease-out forwards; }
        
        .matrix-expand-alert { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: 900; color: #ffffff; text-align: center; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 20px #f48fb1; z-index: 999999; pointer-events: none; white-space: nowrap; background: transparent; border: none; box-shadow: none; animation: topAlertAnim 1.2s ease-out forwards; }
        @keyframes topAlertAnim { 0% { opacity: 0; transform: translate(-50%, -10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -15px); } }

    </style>
</head>
<body>

    <video id="sanctum-video" autoplay loop playsinline>
        <source src="../Photo/video nen thuy luan.mp4" type="video/mp4">
    </video>

    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <div id="game-top-bar" class="game-top-bar">
                <div class="health-container">
                    <div class="health-bar green active" id="hp-g-1"></div>
                    <div class="health-bar green active" id="hp-g-2"></div>
                    <div class="health-bar green active" id="hp-g-3"></div>
                    <div class="health-bar green active" id="hp-g-4"></div>
                    <div class="health-bar green active" id="hp-g-5"></div>
                </div>

                <div class="data-score">DATA: <span id="boo-points">0</span>
                    <div id="hp-notification-area"></div>
                </div>

                <div class="health-container">
                    <div class="health-bar pink" id="hp-p-1"></div>
                    <div class="health-bar pink" id="hp-p-2"></div>
                    <div class="health-bar pink" id="hp-p-3"></div>
                    <div class="health-bar pink" id="hp-p-4"></div>
                    <div class="health-bar pink" id="hp-p-5"></div>
                </div>
            </div>

            <div id="game-bottom-bar" class="game-bottom-bar">
                <button class="btn-action btn-back" onclick="confirmExitToLobby()">⟨</button>
                <button class="btn-action btn-mute" id="btn-mute" onclick="toggleVideoMute()" title="Bật/Tắt tiếng video">🔊</button>
                <button class="btn-action btn-pause" onclick="pauseGame()"></button>
            </div>

            <div id="start-prompt-overlay">
                <div id="briefing-panel" class="briefing-panel">
                    <div class="briefing-title" id="briefing-title">KIỂM TRA TRÍ NHỚ</div>
                    <div class="briefing-target" id="briefing-target">
                        Ghi nhớ lại chuỗi hình ảnh và nhập lại nhanh.
                    </div>
                </div>
                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>
            
            <div id="game-container" class="game-container">
                <div class="sequence-display" id="seq-area"></div>
                <div class="input-area" id="input-area-2"></div>
            </div>

            <div id="final-summary-overlay">
                <div class="final-header">KẾT QUẢ TRÍ NHỚ</div>
                
                <div class="stat-box">
                    <div class="stat-line" style="justify-content: center;">
                        <span style="font-weight: 900; color: #fff; font-size: 13px;">TỔNG ĐIỂM DATA:</span> 
                        <span class="stat-val" id="sum-score-total" style="font-weight:900; color:#f48fb1; font-size:20px; margin-left:8px;">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <div class="metric-card-row">
                        <span class="metric-label">Tốc độ</span>
                        <span class="metric-val" id="sum-rank-ssd">SSD 512GB</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Bộ nhớ (RAM)</span>
                        <span class="metric-val" id="sum-rank-ram">RAM 4GB</span>
                    </div>
                    
                    <div class="debug-feedback" id="debug-stats-box">
                        Chuỗi dài nhất: Đang tính toán...<br>
                        Thời gian hoàn thành: 0 ms
                    </div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="openArena()">TẬP LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="goToHoaLuan()">CHUYỂN BÀI</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const ALL_SHAPES = {
            'lightning': '<svg class="shape-svg" style="color: #ffb74d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            'circle': '<svg class="shape-svg" style="color: #f48fb1;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>',
            'triangle': '<svg class="shape-svg" style="color: #00ff9d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 20 2 20 12 2"/></svg>',
            'square': '<svg class="shape-svg" style="color: #ff3366;" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
            'star': '<svg class="shape-svg" style="color: #ffaa00;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 8 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 8 12 2"/></svg>',
            'diamond': '<svg class="shape-svg" style="color: #b026ff;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>'
        };

        const ALL_SHAPES_SMALL = {
            'lightning': '<svg class="shape-svg-small" style="color: #ffb74d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            'circle': '<svg class="shape-svg-small" style="color: #f48fb1;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>',
            'triangle': '<svg class="shape-svg-small" style="color: #00ff9d;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 20 2 20 12 2"/></svg>',
            'square': '<svg class="shape-svg-small" style="color: #ff3366;" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
            'star': '<svg class="shape-svg-small" style="color: #ffaa00;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 8 22 9 17 14 18 21 12 18 6 21 7 14 2 9 9 8 12 2"/></svg>',
            'diamond': '<svg class="shape-svg-small" style="color: #b026ff;" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 12 12 22 2 12 12 2"/></svg>'
        };

        const BASE_SYMBOLS = ['lightning', 'circle', 'triangle', 'square'];
        const ADVANCED_SYMBOLS = ['lightning', 'circle', 'triangle', 'square', 'star', 'diamond'];

        // ĐÁNH GIÁ RAM KHÓA CHẾT TRÊN SỐ LƯỢNG HÌNH ĐẠT ĐƯỢC
        function getRAMBySequence(maxSeq) {
            if (maxSeq >= 12) return "RAM 32GB";
            if (maxSeq >= 10) return "RAM 16GB";
            if (maxSeq >= 8)  return "RAM 8GB";
            if (maxSeq >= 6)  return "RAM 4GB";
            if (maxSeq >= 5)  return "RAM 2GB";
            if (maxSeq >= 4)  return "RAM 1GB";
            return "RAM 512MB";
        }

        // ĐÁNH GIÁ SSD VỚI TIÊU CHUẨN KÉP KHẮT KHE: ĐỒNG THỜI ĐẠT SỐ HÌNH TỐI THIỂU VÀ TỐC ĐỘ MS
        function getSSDByMaxSequenceTime(maxLen, totalMs) {
            if (maxLen >= 9 && totalMs < 2000) return "SSD 2TB";
            if (maxLen >= 7 && totalMs < 3000) return "SSD 1TB";
            if (maxLen >= 6 && totalMs < 4000) return "SSD 512GB";
            if (maxLen >= 5) return "SSD 256GB";
            return "SSD 120GB";
        }

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) { fxCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (fxCtx && fxCtx.state === 'suspended') { fxCtx.resume(); }
                let vid = document.getElementById('sanctum-video');
                if (vid && !vid.dataset.userMuted) { vid.muted = false; vid.play().catch(e => {}); }
            } catch(e) {}
        }
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => { window.addEventListener(evt, initAudio, { passive: true }); });

        function toggleVideoMute() {
            let vid = document.getElementById('sanctum-video');
            let muteBtn = document.getElementById('btn-mute');
            if(!vid) return;
            vid.muted = !vid.muted;
            vid.dataset.userMuted = vid.muted ? 'true' : 'false';
            muteBtn.innerHTML = vid.muted ? '🔇' : '🔊';
            playSound('coin');
        }

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); } 
                else if(type === 'error') { osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime); gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); } 
                else if(type === 'coin') { osc.type = 'sine'; osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); osc.start(); osc.stop(ctx.currentTime + 0.2); } 
                else if(type === 'ready') { osc.type = 'sine'; osc.frequency.setValueAtTime(1800, ctx.currentTime); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15); osc.start(); osc.stop(ctx.currentTime + 0.15); }
                else if(type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); }
            } catch (e) {}
        }

        let aScore = 0;           
        let pendingScore = 0;     
        let stabilityHP = 5;      
        let isPlaying = false; 
        let isPausedForStart = true;
        
        let hitsCount = 0; 
        let currentLevel = 1; 
        let highestSequenceReached = 0; 
        let winsInCurrentLevel = 0; 
        let canClick = false;
        let patternSeq = [];
        let userSeq = [];
        let gameLogicTimer;

        let cueHideTimestamp = 0;
        let bestSequenceLen = 0;   
        let bestSequenceTime = 0;  
        let nextHpMilestone = 1000;

        window.onload = () => { 
            openArena(); 
            initSparkleParticles();
        };

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<35; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function getSymbolCount(level) {
            return 3 + level;                   
        }

        function getAvailableSymbolsForLevel(level) {
            return (level >= 3) ? ADVANCED_SYMBOLS : BASE_SYMBOLS;
        }

        function buildKeyboard() {
            let area = document.getElementById('input-area-2'); area.innerHTML = '';
            let activeSymbols = getAvailableSymbolsForLevel(currentLevel);
            activeSymbols.forEach(key => {
                let btn = document.createElement('button'); btn.className = 'btn-symbol'; 
                btn.innerHTML = ALL_SHAPES[key];
                btn.onclick = () => addToUserSeq(key); 
                area.appendChild(btn);
            });
        }

        function openArena() {
            aScore = 0; pendingScore = 0; stabilityHP = 5; isPlaying = false; isPausedForStart = true;
            currentLevel = 1; highestSequenceReached = 0; winsInCurrentLevel = 0; hitsCount = 0;
            bestSequenceLen = 0; bestSequenceTime = 0; nextHpMilestone = 1000;

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('playing-mode');
            setTimeout(() => vid.classList.add('loaded'), 150);

            let playArea = document.getElementById('play-area');
            playArea.classList.remove('fullscreen-mode');
            document.getElementById('game-container').classList.remove('active');

            updateHpDisplay(); document.getElementById('boo-points').innerText = "0";
            document.getElementById('final-summary-overlay').classList.remove('active');
            document.getElementById('pause-menu-overlay').classList.remove('active');
            
            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.remove('active');
            setTimeout(() => {
                promptOverlay.classList.remove('hidden');
                setTimeout(() => promptOverlay.classList.add('active'), 200);
            }, 500);

            buildKeyboard();
        }

        function updateHpDisplay() {
            let hp = Math.min(10, Math.max(0, stabilityHP));
            let greenCount = Math.min(5, hp);
            let pinkCount = Math.max(0, hp - 5);

            for(let i=1; i<=5; i++) {
                document.getElementById('hp-g-'+i).classList.toggle('active', i <= greenCount);
                document.getElementById('hp-p-'+i).classList.toggle('active', i <= pinkCount);
            }
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.remove('active');
            setTimeout(() => promptOverlay.classList.add('hidden'), 1200);
            
            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('loaded');
            vid.classList.add('playing-mode');

            playSound('katana', 0.6); let laser = document.createElement('div'); laser.className = 'laser-beam-horizontal'; document.body.appendChild(laser);
            setTimeout(() => { let playArea = document.getElementById('play-area'); playArea.classList.add('fullscreen-mode'); laser.classList.add('expand'); }, 600);
            setTimeout(() => { 
                if(laser && laser.parentElement) laser.remove(); 
                isPausedForStart = false; 
                document.getElementById('game-top-bar').classList.add('visible'); 
                document.getElementById('game-bottom-bar').classList.add('visible'); 
                document.getElementById('game-container').classList.add('active'); 
                startArena(); 
            }, 1500);
        }

        function startArena() { 
            isPlaying = true;
            hitsCount = 0; 
            runGame(); 
        }

        function pauseGame() { if(!isPlaying || isPausedForStart) return; playSound('error'); isPausedForStart = true; clearTimeout(gameLogicTimer); document.getElementById('pause-menu-overlay').classList.add('active'); }
        function resumeGame() { playSound('coin'); document.getElementById('pause-menu-overlay').classList.remove('active'); isPausedForStart = false; runGame(); }
        function confirmExitToLobby() { playSound('error'); window.location.href = '../LucChien_2.html'; }

        function revealCorrectAnswersForGame() {
            let area = document.getElementById('seq-area');
            area.innerHTML = patternSeq.map(key => `<div class="quantum-char" style="opacity:0.7;">${ALL_SHAPES_SMALL[key]}</div>`).join('');
        }

        function failSequence() { 
            if(!isPlaying || isPausedForStart) return; canClick = false; 
            stabilityHP -= 1; 
            updateHpDisplay(); 
            
            pendingScore = 0;
            document.getElementById('boo-points').innerText = Math.round(aScore);

            winsInCurrentLevel = 0; 
            currentLevel = Math.max(1, currentLevel - 1); 
            buildKeyboard(); 
            revealCorrectAnswersForGame();

            let flash = document.createElement('div'); flash.className = 'flashbang-red'; document.body.appendChild(flash); setTimeout(() => flash.remove(), 400);
            
            if(stabilityHP <= 0) { 
                setTimeout(finishGame, 1000); 
            } else { 
                clearTimeout(gameLogicTimer); 
                let delay = 1000;
                setTimeout(() => { runGame(); }, delay); 
            }
        }

        function showHpRewardAlert() {
            let alertBox = document.createElement('div');
            alertBox.className = 'status-notification';
            alertBox.innerHTML = `+1 NĂNG LƯỢNG HỒNG`;
            document.getElementById('hp-notification-area').appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 1200);
        }

        function processCorrectTap() { 
            hitsCount++;
            playSound('coin', 1); 
            
            let basePointPerItem = 15 + currentLevel * 5;

            pendingScore += basePointPerItem; 
            document.getElementById('boo-points').innerText = Math.round(aScore + pendingScore);

            let totalSimulatedScore = aScore + pendingScore;
            if (totalSimulatedScore >= nextHpMilestone) {
                nextHpMilestone += 1000;
                stabilityHP = Math.min(10, stabilityHP + 1); 
                updateHpDisplay();
                showHpRewardAlert();
            }
        }

        function checkLevelUp() { 
            winsInCurrentLevel++;
            let requiredWins = 1; 

            if (winsInCurrentLevel >= requiredWins) { 
                winsInCurrentLevel = 0; 
                aScore += pendingScore + (currentLevel * 40); 
                pendingScore = 0;
                document.getElementById('boo-points').innerText = Math.round(aScore);

                currentLevel++;
                buildKeyboard(); 

                let alertBox = document.createElement('div');
                alertBox.className = 'matrix-expand-alert';
                let count = getSymbolCount(currentLevel);
                alertBox.innerHTML = `ĐỘ KHÓ: ${count} HÌNH`;
                
                document.body.appendChild(alertBox);
                playSound('ready');
                setTimeout(() => alertBox.remove(), 1200);

                setTimeout(() => { runGame(); }, 1200);
            } else {
                setTimeout(() => { runGame(); }, 600);
            }
        }

        function triggerReadyCue(gridElement) {
            gridElement.classList.remove('grid-ready-glow');
            void gridElement.offsetWidth; 
            gridElement.classList.add('grid-ready-glow');
            playSound('ready');
        }

        function runGame() {
            if(!isPlaying || isPausedForStart) return; patternSeq = []; userSeq = []; canClick = false; 
            
            let count = getSymbolCount(currentLevel);
            highestSequenceReached = Math.max(highestSequenceReached, count);

            let availableSymbols = getAvailableSymbolsForLevel(currentLevel);
            
            for(let i=0; i<count; i++) { patternSeq.push(availableSymbols[Math.floor(Math.random() * availableSymbols.length)]); }
            
            let area = document.getElementById('seq-area'); 
            area.innerHTML = patternSeq.map(key => `<div class="quantum-char">${ALL_SHAPES_SMALL[key]}</div>`).join('');
            area.scrollTop = 0;
            
            gameLogicTimer = setTimeout(() => {
                if(!isPlaying || isPausedForStart) return; 
                area.innerHTML = `<div class="hidden-box">?</div>`.repeat(patternSeq.length); 
                triggerReadyCue(area); cueHideTimestamp = Date.now(); canClick = true; 
            }, Math.max(800, 2200 - (currentLevel * 100)));
        }
        
        function addToUserSeq(key) {
            if(!canClick || !isPlaying || isPausedForStart) return;

            if (userSeq.length === 0) {
                window.currentAttemptStart = Date.now();
            }

            if(key === patternSeq[userSeq.length]) {
                userSeq.push(key); 
                let html = userSeq.map(k => `<div class="quantum-char">${ALL_SHAPES_SMALL[k]}</div>`).join(''); 
                html += `<div class="hidden-box">?</div>`.repeat(patternSeq.length - userSeq.length); 
                let area = document.getElementById('seq-area');
                area.innerHTML = html; area.scrollTop = area.scrollHeight;
                
                processCorrectTap(patternSeq.length); 
                if(userSeq.length === patternSeq.length) { 
                    canClick = false; 
                    
                    let attemptTime = Date.now() - window.currentAttemptStart;
                    if (patternSeq.length >= bestSequenceLen) {
                        bestSequenceLen = patternSeq.length;
                        bestSequenceTime = attemptTime;
                    }

                    checkLevelUp(); 
                }
            } else { playSound('wrong'); failSequence(); }
        }

        function finishGame() {
            isPlaying = false; isPausedForStart = true; clearTimeout(gameLogicTimer);
            aScore += pendingScore; pendingScore = 0; 

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('playing-mode');
            setTimeout(() => vid.classList.add('loaded'), 400);

            if (aScore < 200 || hitsCount < 3) {
                aScore = 0; bestSequenceLen = 0; bestSequenceTime = 0;
            }

            localStorage.setItem('thuy_luan_score', Math.round(aScore));

            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            let playArea = document.getElementById('play-area'); playArea.classList.remove('fullscreen-mode');
            document.getElementById('game-container').classList.remove('active');

            playSound('error'); document.getElementById('freeze-overlay').classList.add('active');

            setTimeout(() => {
                document.getElementById('freeze-overlay').classList.remove('active');
                
                document.getElementById('sum-score-total').innerText = Math.floor(aScore);
                
                // XẾP HẠNG RAM DỰA TRÊN SỐ LƯỢNG HÌNH DÀI NHẤT
                let ramText = (bestSequenceLen === 0) ? "RAM 512MB" : getRAMBySequence(bestSequenceLen);
                document.getElementById('sum-rank-ram').innerText = ramText;

                // XẾP HẠNG SSD DỰA TRÊN TIÊU CHUẨN KÉP (SỐ HÌNH + THỜI GIAN)
                let ssdText = (bestSequenceLen === 0) ? "SSD 120GB" : getSSDByMaxSequenceTime(bestSequenceLen, bestSequenceTime);
                document.getElementById('sum-rank-ssd').innerText = ssdText;

                let debugBox = document.getElementById('debug-stats-box');
                debugBox.innerHTML = `Chuỗi dài nhất: <b>${bestSequenceLen} hình</b><br>Thời gian hoàn thành: <b>${bestSequenceTime} ms</b>`;

                document.getElementById('final-summary-overlay').classList.add('active');
                playSound('coin');
            }, 1800);
        }

        function goToHoaLuan() {
            playSound('coin');
            window.location.href = 'TestHoaLuan.html';
        }
    </script>
</body>
</html>
