<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0202">
    <title>K-Drive - Giải Mã Phản Xạ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #0d0202;
            --cyan: #00e5ff;
            --mint: #38ef7d;    
            --neon-orange: #ff6600; 
            --amber: #ffb700;   
            --crimson: #ff3333;
            --text-light: #ffffff;
            --panel-bg: rgba(15, 5, 2, 0.88); 
            --panel-border: rgba(255, 102, 0, 0.7); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        #sanctum-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1;
            object-fit: cover; opacity: 0.6; pointer-events: none;
            transition: opacity 2.0s ease;
        }
        #sanctum-video.hidden-mode { opacity: 0 !important; }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px #ffb700; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 360px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background: var(--bg-obsidian) !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #ffb700; box-shadow: 0 0 25px var(--crimson), 0 0 50px #ff6600; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        @keyframes cinematicPopupSuperSlow {
            0% { opacity: 0; transform: translateY(90px) scale(0.90); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
            50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 25px currentColor, inset 0 0 10px currentColor; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
        }

        @keyframes textBlinkGlow {
            0% { opacity: 0.6; transform: scale(0.95); text-shadow: 0 0 4px rgba(255,183,0,0.4); }
            50% { opacity: 1; transform: scale(1.08); text-shadow: 0 0 15px rgba(255,183,0,0.9), 0 0 25px #ff6600; }
            100% { opacity: 0.6; transform: scale(0.95); text-shadow: 0 0 4px rgba(255,183,0,0.4); }
        }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 16px; opacity: 1; transition: opacity 0.5s ease; }
        #start-prompt-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #start-prompt-overlay > * { animation: cinematicPopupSuperSlow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .briefing-panel { background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px 24px; width: 100%; max-width: 340px; text-align: left; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .briefing-title { color: var(--amber) !important; font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 183, 0, 0.4); padding-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,183,0,0.6); white-space: nowrap; }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.6; font-weight: 600; text-align: center; animation: textBlinkGlow 2.0s infinite ease-in-out; }

        .action-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: var(--panel-bg); border: 1.5px solid var(--amber); padding: 15px; border-radius: 12px; color: var(--amber); font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; animation: pulse-btn 1.5s infinite; }
        .start-action-box:active { transform: scale(0.96); background: var(--amber); color: #0d0202; }

        .game-top-bar {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease;
        }
        .game-top-bar.visible { opacity: 1; }

        .health-container { display: flex; gap: 4px; align-items: center; }
        .health-bar { width: 16px; height: 6px; background: rgba(255,255,255,0.15); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.active { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

        .data-score-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; color: #fff; display: flex; align-items: center; }
        .data-score span { color: var(--neon-orange); text-shadow: 0 0 12px var(--neon-orange); font-size: 20px; margin-left: 6px; }

        .thread-status-sub { font-family: 'Share Tech Mono', monospace; font-size: 10.5px; color: #ffb700; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,183,0,0.6); opacity: 0.9; }

        .tier-pop-notification {
            position: absolute; top: 180%; left: 50%; transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace; font-size: 24px; font-weight: 900;
            color: #ffb700; text-shadow: 0 0 15px rgba(255,183,0,0.9);
            z-index: 999999; pointer-events: none; white-space: nowrap;
            animation: tierPopAnim 1s ease-out forwards;
        }
        @keyframes tierPopAnim {
            0% { opacity: 0; transform: translate(-50%, -10px) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
            70% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -15px) scale(1); }
        }

        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw;
            border-top: 1px solid rgba(255, 102, 0, 0.5); padding: 15px 20px 0 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto;
            background: linear-gradient(0deg, rgba(20,4,4,0.95) 0%, transparent 100%); opacity: 0; transition: opacity 1.5s ease;
        }
        .game-bottom-bar.visible { opacity: 1; }

        .btn-action {
            width: 46px; height: 46px; background: rgba(20, 4, 4, 0.85); 
            border: 1.5px solid rgba(255, 102, 0, 0.75); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active { transform: scale(0.9); }
        
        .btn-back { color: var(--amber); font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: bold; box-shadow: 0 0 12px rgba(255,183,0,0.4); padding-bottom: 2px; padding-right: 2px; }
        .btn-skip { border-color: rgba(255, 183, 0, 0.75); color: var(--amber); font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: bold; box-shadow: 0 0 12px rgba(255,183,0,0.4); }
        .btn-mute { border-color: rgba(255, 102, 0, 0.6); color: #ff6600; font-size: 20px; box-shadow: 0 0 12px rgba(255, 102, 0, 0.3); }
        .btn-pause { border-color: rgba(255, 51, 51, 0.6); box-shadow: 0 0 12px rgba(255, 51, 51, 0.3); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 18px; background: var(--crimson); margin: 0 3px; border-radius: 2px; box-shadow: 0 0 8px var(--crimson); }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; backdrop-filter: blur(10px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 320px; background: rgba(25, 5, 5, 0.95); border: 1.5px solid rgba(255,102,0,0.6); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: cinematicPopupSuperSlow 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pause-title { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: var(--neon-orange); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,102,0,0.6); }
        .pause-btn { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 51, 51, 0.2); border: 1px solid var(--crimson); color: var(--crimson); margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: transparent; z-index: 200000; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #freeze-overlay.active { display: flex; }
        @keyframes textFallSlow {
            0% { opacity: 0; transform: translateY(-70px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .freeze-text { font-family: 'Chakra Petch', sans-serif; font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 20px #ff6600, 0 0 40px #ffb700, 2px 2px 0px rgba(0,0,0,0.9); background: transparent; padding: 0; border: none; box-shadow: none; animation: textFallSlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* BẢNG TỔNG KẾT CUỐI CÙNG CHUẨN FORM THỦY LUÂN */
        #final-summary-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 4px; padding: 6px; opacity: 0; transition: opacity 1.2s ease; overflow-y: auto; }
        #final-summary-overlay.active { display: flex; opacity: 1; }
        #final-summary-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }

        .final-header { font-family: 'Chakra Petch', sans-serif; font-size: 18px; color: #ffffff; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,183,0,0.8); margin-bottom: 2px; }
        
        .stat-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); padding: 6px 14px; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .stat-line { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 80px; color: var(--amber); text-shadow: 0 0 8px rgba(255,183,0,0.5); font-size: 15px;}

        .bio-metrics-box { width: 92%; max-width: 340px; background: rgba(20, 6, 2, 0.95); backdrop-filter: blur(22px); border: 2px solid rgba(255, 165, 0, 0.6); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,102,0,0.1); }
        
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255, 102, 0, 0.3); padding-bottom: 5px; margin-bottom: 0; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11.5px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: var(--amber); font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 900; text-align: right; text-shadow: 0 0 10px rgba(255,183,0,0.8); }
        
        .debug-feedback { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #ffffff; text-align: left; background: rgba(255, 102, 0, 0.08); border: 1.5px solid rgba(255, 102, 0, 0.4); padding: 6px 8px; border-radius: 6px; line-height: 1.3; text-shadow: 0 0 6px rgba(255,255,255,0.4); }

        .result-btn-row { display: flex; gap: 8px; width: 92%; max-width: 340px; margin-top: 2px; }
        .result-action-btn { flex: 1; padding: 9px; font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; backdrop-filter: blur(8px); letter-spacing: 1px; }
        
        #btn-replay { background: var(--panel-bg); border: 1.5px solid #ff3366; color: #ff3366; }
        #btn-replay:active { background: #ff3366; color: #fff; transform: scale(0.95); }
        
        #btn-next { background: var(--panel-bg); border: 1.5px solid #00e5ff; color: #00e5ff; }
        #btn-next:active { background: #00e5ff; color: #0d0202; transform: scale(0.95); }

        .orb { position: absolute; border-radius: 50%; cursor: crosshair; display: flex; justify-content: center; align-items: center; }
        .orb-fire { width: 56px; height: 56px; background: radial-gradient(circle, #ffdf70 10%, #ffb700 40%, #ff3333 80%); box-shadow: 0 0 18px #ff3333; z-index: 10; }
        .orb-ice { width: 56px; height: 56px; background: radial-gradient(circle, #ffffff, #00e5ff); box-shadow: 0 0 20px #00e5ff; z-index: 5; }
        .orb-purple { width: 56px; height: 56px; background: radial-gradient(circle, #ff66cc, #8a2be2); box-shadow: 0 0 20px #8a2be2; z-index: 5; }
        .orb-green { width: 56px; height: 56px; background: radial-gradient(circle, #bfff00, #00ff00); box-shadow: 0 0 20px #00ff00; z-index: 5; }
        .orb-blue { width: 56px; height: 56px; background: radial-gradient(circle, #33ccff, #0066cc); box-shadow: 0 0 20px #0066cc; z-index: 5; }

        .blackout-bg { position: fixed; inset: 0; width: 100vw; height: 100dvh; background-color: rgba(10, 2, 2, 0.98); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .blackout-bg.active { opacity: 1; pointer-events: auto; }

        .burst-container { position: fixed; width: 100vw; height: 100dvh; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 99999; pointer-events: none; }
        
        .burst-btn-diagonal {
            position: absolute; width: 110px; height: 110px; border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #ffdf70 35%, #ff3333 75%, #cc0000 100%);
            box-shadow: 0 0 30px #ff3333, 0 0 50px #ffb700;
            z-index: 100002; cursor: pointer; pointer-events: auto; outline: none;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #diag-btn-1 { left: 25%; top: 32%; transform: translate(-50%, -50%); }
        #diag-btn-2 { right: 25%; bottom: 32%; transform: translate(50%, 50%); }

        .circular-text-svg {
            position: absolute; width: 140px; height: 140px; top: 50%; left: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            animation: spinCircleText 8s linear infinite;
        }
        @keyframes spinCircleText {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .circular-text-svg text {
            font-family: 'Chakra Petch', sans-serif; font-size: 13.5px; font-weight: 900;
            fill: #ffb700; letter-spacing: 3px; filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
        }

        .burst-tap-shockwave { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ffb700; box-shadow: 0 0 25px #ff3333; pointer-events: none; transform: translate(-50%, -50%) scale(1); animation: tapShock 0.25s ease-out forwards; z-index: 100004; }
        @keyframes tapShock { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }

        .beam { position: absolute; bottom: 50%; left: 50%; transform: translateX(-50%); z-index: 100001; transform-origin: bottom center; pointer-events: none; }
        .beam-t1 { width: 6px; background: rgba(255,51,51,0.7); animation: beamGrow1 2.2s forwards linear; }
        .beam-t2 { width: 22px; background: #ff3333; box-shadow: 0 0 15px #ff3333; animation: beamGrow2 1.8s forwards linear, flickerAnim 0.1s infinite; }
        .beam-t3 { width: 55px; background: linear-gradient(90deg, #ffb700, #ff3333, #ffb700); box-shadow: 0 0 35px #ff3333; animation: beamGrow3 1.4s forwards cubic-bezier(0.4, 0, 1, 1); }
        .beam-t4 { width: 130px; background: linear-gradient(90deg, #ff3333, #ffb700, #ff3333); box-shadow: 0 0 60px #ff3333; animation: beamGrow4 1.1s forwards cubic-bezier(0.1, 0, 1, 1); }
        .beam-t5 { width: 200px; background: linear-gradient(0deg, #fff, #ffb700, #ff3333, #880000); box-shadow: 0 0 80px #ff3333, 0 0 160px #ff3333; animation: beamGrow5 1s forwards cubic-bezier(0.1, 0, 1, 1); }
        @keyframes beamGrow1 { 0% { height: 0; } 100% { height: 50vh; } } @keyframes beamGrow2 { 0% { height: 0; } 100% { height: 50vh; } } @keyframes beamGrow3 { 0% { height: 0; } 100% { height: 50vh; } } @keyframes beamGrow4 { 0% { height: 0; } 100% { height: 50vh; } } @keyframes beamGrow5 { 0% { height: 0; } 100% { height: 50vh; } } @keyframes flickerAnim { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.85; } }
        
        .explosion { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 100002; }
        .exp-t1 { width: 40px; height: 40px; background: rgba(255,51,51,0.6); animation: pop 0.3s forwards; }
        .exp-t2 { width: 100px; height: 100px; background: radial-gradient(circle, #ff3333, transparent); animation: pop 0.4s forwards; }
        .exp-t3 { width: 220px; height: 220px; background: radial-gradient(circle, #ffb700, #ff3333, transparent); animation: pop 0.5s forwards; }
        .exp-t4 { width: 420px; height: 420px; background: radial-gradient(circle, #ff3333, #ffb700, transparent); animation: pop 0.6s forwards; }
        .exp-t5 { width: 650px; height: 650px; background: radial-gradient(circle, #fff, #ffb700, #ff3333, transparent); animation: pop 0.7s forwards; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

        .floating-ms { position: absolute; font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 900; pointer-events: none; z-index: 100000; transform: translate(-50%, -50%); animation: floatUpMs 0.8s ease-out forwards; }
        .ms-fast { color: #00ffcc; text-shadow: 0 0 12px #00ffcc; }
        .ms-slow { color: #ff3333; text-shadow: 0 0 12px #ff3333; }
        @keyframes floatUpMs { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 20% { transform: translate(-50%, -60%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -100%) scale(1); } }

        .floating-cps { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-family: 'Share Tech Mono', monospace; font-size: 34px; font-weight: 900; color: #ffb700; text-shadow: 0 0 20px #ff3333; pointer-events: none; z-index: 100005; white-space: nowrap; width: 100%; text-align: center; animation: popCps 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popCps { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1.3); } }

        .status-notification { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 900; color: #ffb700; text-align: center; text-shadow: 0 0 10px #ffb700; z-index: 999999; pointer-events: none; white-space: nowrap; animation: topAlertAnim 1.2s ease-out forwards; }
        @keyframes topAlertAnim { 0% { opacity: 0; transform: translate(-50%, -10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -15px); } }
    </style>
</head>
<body>

    <div id="dust-container"></div>

    <video id="sanctum-video" autoplay loop playsinline muted>
        <source src="https://github.com/happyk1900/Kai-Ripe/raw/refs/heads/main/video%20nen%20hoa%20luan.mp4" type="video/mp4">
    </video>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <div id="game-top-bar" class="game-top-bar">
                <div class="health-container">
                    <div class="health-bar active" id="hp-1"></div>
                    <div class="health-bar active" id="hp-2"></div>
                    <div class="health-bar active" id="hp-3"></div>
                    <div class="health-bar active" id="hp-4"></div>
                    <div class="health-bar active" id="hp-5"></div>
                </div>

                <div class="data-score-wrap">
                    <div class="data-score">DATA: <span id="boo-points">0</span></div>
                    <div class="thread-status-sub">Đang đo tốc độ luồng</div>
                    <div id="hp-notification-area"></div>
                </div>

                <div style="width: 95px;"></div>
            </div>

            <div id="game-bottom-bar" class="game-bottom-bar">
                <button class="btn-action btn-back" onclick="confirmExitToLobby()">⟨</button>
                <button class="btn-action btn-skip" id="btn-skip-stage" onclick="skipToNextStage()" title="Chuyển bài">⏭</button>
                <button class="btn-action btn-mute" id="btn-mute" onclick="toggleVideoMute()" title="Bật/Tắt tiếng video">🔊</button>
                <button class="btn-action btn-pause" onclick="pauseGame()"></button>
            </div>

            <div id="start-prompt-overlay">
                <div class="briefing-panel">
                    <div class="briefing-title" id="briefing-title">GIẢI MÃ PHẢN XẠ</div>
                    <div class="briefing-target" id="briefing-target">
                        Chạm nhanh nhất vào những hạt màu vàng xuất hiện trên màn hình.
                    </div>
                </div>

                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>

            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <div id="final-summary-overlay">
                <div class="final-header">KẾT QUẢ PHẢN XẠ</div>
                
                <div class="stat-box">
                    <div class="stat-line" style="justify-content: center;">
                        <span style="font-weight: 900; color: #fff5f0; font-size: 11.5px;">TỔNG ĐIỂM DATA:</span> 
                        <span class="stat-val" id="sum-score-total" style="font-weight:900; color:#ffb700; font-size:15px; margin-left: 5px;">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <div class="metric-card-row">
                        <span class="metric-label">Vi xử lý</span>
                        <span class="metric-val" id="sum-rank-cpu">Core i3</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Đa luồng</span>
                        <span class="metric-val" id="sum-rank-thread">Bật Nhanh</span>
                    </div>
                    
                    <div class="debug-feedback" id="debug-stats-box">
                        Tốc độ phản xạ: <b>0 ms</b><br>
                        Tốc độ đa luồng: <b>0 lần / giây</b>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center; margin: 2px 0; width: 92%; max-width: 340px;">
                    <div onclick="event.stopPropagation(); window.location.href='GIAI MA/giai_ma_hoa_luan.html'" style="display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 500; position: relative;">
                        <div class="super-click-btn" style="width: 55px; height: 55px;">
                            <img src="../Photo/A HOA.png" alt="The Book of Fire" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                        </div>
                        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 900; color: #ffb700; margin-top: 2px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,183,0,0.9); animation: textBlinkGlow 1.8s infinite ease-in-out;">GIẢI MÃ</span>
                    </div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="openArena()">ĐO LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="goToPhongLuan()">TIẾP TỤC</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const TIER_POINTS = { 1: 15, 2: 15, 3: 30, 4: 60, 5: 120 };

        function getCpuEvaluation(avgMs, totalScore) {
            if (totalScore < 1000 || avgMs > 600 || avgMs === 0) {
                return { 
                    name: "Pentium", 
                    feedback: "Bộ phản xạ của bạn đang dưới mức bình thường, không đủ 1000 dữ liệu! Yêu cầu đo lại ngay lập tức!<br><br><span style='color: #ffd700; font-weight: 700;'>Nếu bạn không vượt qua được, cũng đừng quá lo lắng, chúng ta có phương pháp tập luyện giúp phục hồi phản xạ của bạn. Hãy cứ ấn tiếp tục để kiểm tra tiếp.</span>" 
                };
            }
            let successText = "Tuyệt vời! Bạn đã hoàn thành xuất sắc bài kiểm tra phản xạ. Tốc độ xử lý tín hiệu đang vận hành rất ổn định. Hãy cứ ấn tiếp tục để khám phá phần kiểm tra tiếp theo.";
            if (avgMs <= 300) {
                return { name: "Lượng Tử AI", feedback: "Đang chạy Chip Lượng Tử AI. Tốc độ xử lý song song vượt mọi giới hạn vật lý!<br><br><span style='color: #ffd700; font-weight: 700;'>" + successText + "</span>" };
            } else if (avgMs <= 400) {
                return { name: "Core i9", feedback: "Đang chạy Chip Core i9. Xung nhịp khủng, phản xạ cực gắt, không có độ trễ.<br><br><span style='color: #ffd700; font-weight: 700;'>" + successText + "</span>" };
            } else if (avgMs <= 500) {
                return { name: "Core i7", feedback: "Đang chạy Chip Core i7. Tốc độ xử lý luồng dữ liệu mượt mà, nhanh nhạy.<br><br><span style='color: #ffd700; font-weight: 700;'>" + successText + "</span>" };
            } else {
                return { name: "Core i3", feedback: "Đang chạy Chip Core i3. Tốc độ xử lý thông tin cơ bản, thỉnh thoảng bị trễ.<br><br><span style='color: #ffd700; font-weight: 700;'>" + successText + "</span>" };
            }
        }

        function getThreadRanking(cps) {
            if (cps >= 15) return "Lượng Tử";
            if (cps >= 12) return "Siêu Tốc";
            if (cps >= 8)  return "Bật Nhanh";
            return "Đơn Tốc";
        }

        let aScore = 0; let burstScore = 0; let successfulHitsCount = 0; 
        let hitsCountG2 = 0; 
        let isPlaying = false; let isPausedForStart = true; let spawnTimer, burstTimer, stabilityHP = 5; 
        let bestCpsG2 = 0; 
        let reactionTimes = []; 
        let nextBurstMilestone = 500; 
        let burstCount = 0; 
        let lastAnnouncedTier = 1;

        const speedTiersMapping = {
            1: { lifespan: 1300, delay: 650, maxOrbs: 3 }, 
            2: { lifespan: 1000, delay: 500, maxOrbs: 3 }, 
            3: { lifespan: 750,  delay: 380, maxOrbs: 4 }, 
            4: { lifespan: 550,  delay: 280, maxOrbs: 4 }, 
            5: { lifespan: 350,  delay: 180, maxOrbs: 4 }  
        };

        function getCurrentSpeedTier() {
            if (aScore >= 4000) return 5;
            if (aScore >= 3000) return 4;
            if (aScore >= 2000) return 3;
            if (aScore >= 1000) return 2;
            return 1;
        }

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; fxCtx = new AudioContext(); }
                if (fxCtx && fxCtx.state === 'suspended') { fxCtx.resume(); }
                let vid = document.getElementById('sanctum-video');
                if (vid && !vid.dataset.userMuted) { vid.muted = true; vid.play().catch(e => {}); }
            } catch(e) {}
        }
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => { window.addEventListener(evt, initAudio, { passive: true }); });

        function toggleVideoMute() {
            let vid = document.getElementById('sanctum-video');
            let muteBtn = document.getElementById('btn-mute');
            if(!vid) return;
            vid.muted = !vid.muted;
            vid.dataset.userMuted = vid.muted ? 'true' : 'false';
            muteBtn.innerHTML = vid.muted ? '🔇' : '🔊';
            playSound('coin');
        }

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); } 
                else if(type === 'error') { osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime); gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); } 
                else if(type === 'coin') { osc.type = 'sine'; osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); osc.start(); osc.stop(ctx.currentTime + 0.2); } 
                else if(type === 'boom') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, ctx.currentTime); gain.gain.setValueAtTime(0.6, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
            } catch (e) {}
        }
        function triggerVibration(pattern) { try { if (navigator.vibrate) { navigator.vibrate(pattern); } } catch(e) {} }

        window.onload = () => { 
            initSparkleParticles();
            openArena(); 
        };

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<35; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function updateHpDisplay() {
            let hp = Math.min(5, Math.max(0, stabilityHP));
            for(let i=1; i<=5; i++) {
                let bar = document.getElementById('hp-'+i);
                if(bar) bar.classList.toggle('active', i <= hp);
            }
        }

        function openArena() {
            aScore = 0; burstScore = 0; successfulHitsCount = 0; isPlaying = false; stabilityHP = 5; 
            isPausedForStart = true; reactionTimes = [];
            nextBurstMilestone = 500; burstCount = 0; lastAnnouncedTier = 1;

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('hidden-mode');

            let playArea = document.getElementById('play-area');
            playArea.classList.remove('fullscreen-mode');
            playArea.querySelectorAll('.orb, .child-projectile, .core-reactor, .blackout-bg, .beam, .explosion, .floating-ms, .floating-cps, .burst-btn-diagonal').forEach(o => o.remove());

            updateHpDisplay(); document.getElementById('boo-points').innerText = "0";
            document.getElementById('final-summary-overlay').classList.remove('active');
            document.getElementById('pause-menu-overlay').classList.remove('active');
            
            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.remove('hidden');
            promptOverlay.style.opacity = '1';
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            let promptOverlay = document.getElementById('start-prompt-overlay');
            promptOverlay.classList.add('hidden');
            
            let vid = document.getElementById('sanctum-video');
            vid.classList.add('hidden-mode');

            playSound('katana', 0.6); let laser = document.createElement('div'); laser.className = 'laser-beam-horizontal'; document.body.appendChild(laser);
            setTimeout(() => { let playArea = document.getElementById('play-area'); playArea.classList.add('fullscreen-mode'); laser.classList.add('expand'); playSound('boom', 0.8); triggerVibration([200, 100, 300]); }, 600);
            setTimeout(() => { 
                if(laser && laser.parentElement) laser.remove(); 
                isPausedForStart = false; 
                document.getElementById('game-top-bar').classList.add('visible'); 
                document.getElementById('game-bottom-bar').classList.add('visible'); 
                startArena(); 
            }, 1500);
        }

        function pauseGame() { if(!isPlaying || isPausedForStart) return; playSound('error'); isPausedForStart = true; clearTimeout(spawnTimer); if(burstTimer) clearTimeout(burstTimer); document.getElementById('pause-menu-overlay').classList.add('active'); }
        function resumeGame() { playSound('coin'); document.getElementById('pause-menu-overlay').classList.remove('active'); isPausedForStart = false; spawnG2(); }
        
        function confirmExitToLobby() { playSound('error'); window.location.href = '../LucChien_2.html'; }
        
        function skipToNextStage() {
            playSound('coin');
            isPlaying = false; isPausedForStart = true; clearTimeout(spawnTimer); if(burstTimer) clearTimeout(burstTimer);
            let playArea = document.getElementById('play-area');
            playArea.querySelectorAll('.orb, .child-projectile, .core-reactor, .blackout-bg, .beam, .explosion, .floating-ms, .floating-cps, .burst-btn-diagonal').forEach(o => o.remove());

            finishGame();
        }

        function startArena() { 
            isPlaying = true; playSound('boom'); reactionTimes = []; 
            hitsCountG2 = 0; runG2(); 
        }

        function showTierPopAlert(tierNum) {
            let alertBox = document.createElement('div');
            alertBox.className = 'tier-pop-notification';
            alertBox.innerHTML = `X${tierNum}`;
            document.getElementById('hp-notification-area').appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 1200);
        }

        function addScoreAndCheckMultiplier() {
            if(isPausedForStart) return;
            let currentTier = getCurrentSpeedTier();
            let pointsToAdd = TIER_POINTS[currentTier];

            aScore += pointsToAdd; 
            successfulHitsCount++; 
            hitsCountG2++;

            document.getElementById('boo-points').innerText = Math.round(aScore); playSound('coin', 1);

            if (currentTier > lastAnnouncedTier) {
                lastAnnouncedTier = currentTier;
                showTierPopAlert(currentTier);
                playSound('ready', 1.5);
            }

            if (aScore >= nextBurstMilestone && !document.querySelector('.burst-container')) {
                nextBurstMilestone += 1000;
                burstCount++;
                forceBurstMode();
            }
        }

        function loseFullLife() { 
            if(isPausedForStart) return; 
            stabilityHP -= 1; 
            updateHpDisplay(); 
            playSound('boom'); 
            triggerVibration([150, 50, 150]); 
            if(stabilityHP <= 0) { 
                finishGame(); 
            } else {
                clearTimeout(spawnTimer);
                if(isPlaying && !isPausedForStart) {
                    spawnG2();
                }
            }
        }

        function getSafeSpawns(playArea) { let maxX = playArea.clientWidth - 60; let maxY = playArea.clientHeight - 60; let minY = 85; return { px: 10 + Math.random() * Math.max(0, maxX - 10), py: minY + Math.random() * Math.max(0, maxY - minY - 70) }; }

        function runG2() { spawnG2(); }
        function spawnG2() {
            if(!isPlaying || isPausedForStart) return; 
            let playArea = document.getElementById('play-area');
            let tier = getCurrentSpeedTier();
            let cfg = speedTiersMapping[tier];
            let currentOrbs = playArea.querySelectorAll('.orb').length;

            if (currentOrbs < cfg.maxOrbs) {
                let { px, py } = getSafeSpawns(playArea);
                let rand = Math.random(); 
                let orbType = (rand < 0.5) ? 'fire' : (rand < 0.65 ? 'ice' : (rand < 0.8 ? 'purple' : 'green'));
                let isTarget = (orbType === 'fire'); 
                let spawnTimestamp = Date.now();
                
                let el = document.createElement('div'); 
                el.className = 'orb orb-' + orbType; 
                el.style.left = px + 'px'; 
                el.style.top = py + 'px';
                let handled = false; 
                
                el.onmousedown = el.ontouchstart = (e) => { 
                    e.preventDefault(); e.stopPropagation(); if(!isPlaying || isPausedForStart || handled) return; handled = true; 
                    if(isTarget) { 
                        let exactReaction = Date.now() - spawnTimestamp; reactionTimes.push(exactReaction); 
                        let msClass = exactReaction < 300 ? 'ms-fast' : 'ms-slow';
                        let fel = document.createElement('div'); fel.className = `floating-ms ${msClass}`; fel.innerHTML = `${exactReaction}ms`; fel.style.left = px+28+'px'; fel.style.top = py+28+'px'; playArea.appendChild(fel); setTimeout(() => fel.remove(), 800); 
                        addScoreAndCheckMultiplier(); 
                    } else { 
                        loseFullLife(); 
                    } 
                    el.remove(); 
                    spawnG2();
                };
                playArea.appendChild(el); 

                let lifespan = isTarget ? cfg.lifespan : cfg.lifespan + 400;

                setTimeout(() => { if(el.parentElement && !handled) { el.remove(); if(isTarget && isPlaying && !isPausedForStart) loseFullLife(); } }, lifespan);
            }

            clearTimeout(spawnTimer);
            if(isPlaying && !isPausedForStart) {
                spawnTimer = setTimeout(spawnG2, cfg.delay);
            }
        }

        function forceBurstMode() {
            if(!isPlaying || isPausedForStart) return; isPausedForStart = true; clearTimeout(spawnTimer); 
            let playArea = document.getElementById('play-area'); playArea.querySelectorAll('.orb').forEach(o => o.remove()); 
            playSound('error', 1.5); triggerVibration([100, 50, 100]);
            setTimeout(() => { triggerGreatBurst(); }, 800);
        }

        function triggerGreatBurst() {
            let playArea = document.getElementById('play-area'); 
            let blackout = document.createElement('div'); blackout.className = 'blackout-bg active'; playArea.appendChild(blackout);
            let burstContainer = document.createElement('div'); burstContainer.className = 'burst-container'; let burstClicks = 0; let duration = 7000; 

            let b1 = document.createElement('div'); b1.className = 'burst-btn-diagonal'; b1.id = 'diag-btn-1';
            let svg1 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg1.setAttribute("class", "circular-text-svg");
            svg1.setAttribute("viewBox", "0 0 140 140");
            svg1.innerHTML = `<path id="circlePath1" d="M 70,70 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" fill="none"/>
                              <text><textPath href="#circlePath1" startOffset="0%">BẤM ĐIÊN CUỒNG • BẤM ĐIÊN CUỒNG • </textPath></text>`;
            b1.appendChild(svg1);

            let b2 = document.createElement('div'); b2.className = 'burst-btn-diagonal'; b2.id = 'diag-btn-2';
            let svg2 = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg2.setAttribute("class", "circular-text-svg");
            svg2.setAttribute("viewBox", "0 0 140 140");
            svg2.innerHTML = `<path id="circlePath2" d="M 70,70 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" fill="none"/>
                              <text><textPath href="#circlePath2" startOffset="0%">BẤM ĐIÊN CUỒNG • BẤM ĐIÊN CUỒNG • </textPath></text>`;
            b2.appendChild(svg2);

            burstContainer.appendChild(b1); burstContainer.appendChild(b2);
            let handleDual = (e) => { e.stopPropagation(); burstClicks++; playSound('boom', 1.5); triggerVibration(40); }; 
            b1.onpointerdown = b2.onpointerdown = handleDual;

            playArea.appendChild(burstContainer);

            burstTimer = setTimeout(() => {
                burstContainer.remove(); 
                fireBeam(burstClicks, blackout);
            }, duration);
        }

        function fireBeam(clicks, blackoutBg) {
            let playArea = document.getElementById('play-area');
            let normalizedCps = Math.round((clicks / 7) * 10) / 10;
            let tier = clicks > 50 ? 5 : clicks > 35 ? 4 : clicks > 20 ? 3 : clicks > 10 ? 2 : 1;
            let beamTime = 2000;

            if (normalizedCps > bestCpsG2) bestCpsG2 = normalizedCps;

            let beam = document.createElement('div'); beam.className = `beam beam-t${tier}`; playArea.appendChild(beam);
            let cpsEl = document.createElement('div'); cpsEl.className = 'floating-cps'; cpsEl.innerHTML = `${normalizedCps} LẦN / GIÂY`; playArea.appendChild(cpsEl); setTimeout(() => cpsEl.remove(), 1500);

            playSound('katana', 0.5);

            setTimeout(() => {
                beam.remove();
                let explosion = document.createElement('div'); explosion.className = `explosion exp-t${tier}`; playArea.appendChild(explosion);

                let currentBurstScore = clicks * 3;
                burstScore += currentBurstScore;
                playSound('boom', 0.5);

                setTimeout(() => {
                    blackoutBg.classList.remove('active'); setTimeout(() => blackoutBg.remove(), 300);
                    setTimeout(() => { 
                        isPausedForStart = false; 
                        if (isPlaying) { 
                            spawnG2(); 
                        } 
                    }, 1500);
                }, 1000);
            }, beamTime);
        }

        function finishGame() {
            isPlaying = false; isPausedForStart = true; clearTimeout(spawnTimer); if(burstTimer) clearTimeout(burstTimer);

            let vid = document.getElementById('sanctum-video');
            vid.classList.remove('hidden-mode');
            
            if (aScore < 1000) {
                aScore = 0;
                bestCpsG2 = 0;
            }

            let avgReactionMs = reactionTimes.length > 0 ? Math.round(reactionTimes.reduce((a,b)=>a+b, 0) / reactionTimes.length) : 0;

            localStorage.setItem('hoa_luan_score', Math.round(aScore));

            document.getElementById('game-top-bar').classList.remove('visible');
            document.getElementById('game-bottom-bar').classList.remove('visible');
            let playArea = document.getElementById('play-area'); playArea.classList.remove('fullscreen-mode');
            playArea.querySelectorAll('.orb, .child-projectile, .core-reactor, .blackout-bg, .beam, .explosion, .floating-ms, .floating-cps, .float-score, .burst-btn-diagonal').forEach(o => o.remove());

            playSound('error'); document.getElementById('freeze-overlay').classList.add('active');

            setTimeout(() => {
                document.getElementById('freeze-overlay').classList.remove('active');
                
                document.getElementById('sum-score-total').innerText = Math.round(aScore);
                
                let cpuEvalObj = getCpuEvaluation(avgReactionMs, aScore);
                let threadRank = (aScore > 0 && bestCpsG2 > 0) ? getThreadRanking(bestCpsG2) : "Đơn Tốc";

                document.getElementById('sum-rank-cpu').innerText = cpuEvalObj.name;
                document.getElementById('sum-rank-thread').innerText = threadRank;

                let debugBox = document.getElementById('debug-stats-box');
                debugBox.innerHTML = `Tốc độ phản xạ: <b>${avgReactionMs} ms</b><br>Tốc độ đa luồng: <b>${bestCpsG2} lần / giây</b><br><br><span style="color: #ffd700; font-weight: 700;">${cpuEvalObj.feedback}</span>`;

                document.getElementById('final-summary-overlay').classList.add('active');
                playSound('coin');
            }, 1800);
        }

        function goToPhongLuan() {
            playSound('coin');
            window.location.href = 'TestPhongLuan.html';
        }
    </script>
</body>
</html>
