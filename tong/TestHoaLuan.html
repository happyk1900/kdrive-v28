<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0202">
    <title>K-Drive - Giải Mã Phản Xạ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #0d0202;
            --cyan: #00e5ff;
            --mint: #38ef7d;    
            --neon-orange: #ff6600; 
            --amber: #ffb700;   
            --crimson: #ff3333;
            --text-light: #ffffff;
            --panel-bg: rgba(15, 5, 2, 0.88); 
            --panel-border: rgba(255, 102, 0, 0.7); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        #sanctum-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1;
            object-fit: cover; opacity: 0.6; pointer-events: none;
            transition: opacity 2.0s ease;
        }
        #sanctum-video.hidden-mode { opacity: 0 !important; }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px #ffb700; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 360px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background: var(--bg-obsidian) !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #ffb700; box-shadow: 0 0 25px var(--crimson), 0 0 50px #ff6600; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        @keyframes cinematicPopupSuperSlow {
            0% { opacity: 0; transform: translateY(90px) scale(0.90); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
            50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 25px currentColor, inset 0 0 10px currentColor; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
        }

        @keyframes textBlinkGlow {
            0% { opacity: 0.6; transform: scale(0.95); text-shadow: 0 0 4px rgba(255,183,0,0.4); }
            50% { opacity: 1; transform: scale(1.08); text-shadow: 0 0 15px rgba(255,183,0,0.9), 0 0 25px #ff6600; }
            100% { opacity: 0.6; transform: scale(0.95); text-shadow: 0 0 4px rgba(255,183,0,0.4); }
        }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 16px; opacity: 1; transition: opacity 0.5s ease; }
        #start-prompt-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #start-prompt-overlay > * { animation: cinematicPopupSuperSlow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .briefing-panel { background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px 24px; width: 100%; max-width: 340px; text-align: left; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .briefing-title { color: var(--amber) !important; font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 183, 0, 0.4); padding-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,183,0,0.6); white-space: nowrap; }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.6; font-weight: 600; text-align: center; animation: textBlinkGlow 2.0s infinite ease-in-out; }

        .action-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: var(--panel-bg); border: 1.5px solid var(--amber); padding: 15px; border-radius: 12px; color: var(--amber); font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; animation: pulse-btn 1.5s infinite; }
        .start-action-box:active { transform: scale(0.96); background: var(--amber); color: #0d0202; }

        .game-top-bar {
            position: fixed; top: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease;
        }
        .game-top-bar.visible { opacity: 1; }

        .health-container { display: flex; gap: 3px; align-items: center; }
        .health-bar { width: 11px; height: 6px; background: rgba(255,255,255,0.15); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.active { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

        .data-score-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; color: #fff; display: flex; align-items: center; }
        .data-score span { color: var(--neon-orange); text-shadow: 0 0 12px var(--neon-orange); font-size: 18px; margin-left: 4px; }

        /* CHỈ HIỂN THỊ KHI ĐẾN ĐOẠN BẠO PHÁP */
        .thread-status-sub { font-family: 'Share Tech Mono', monospace; font-size: 9.5px; color: #ffb700; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,183,0,0.6); opacity: 0; transition: opacity 0.3s ease; }
        .thread-status-sub.visible { opacity: 0.9; }

        .tier-pop-notification {
            position: absolute; top: 180%; left: 50%; transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 900;
            color: #ffb700; text-shadow: 0 0 15px rgba(255,183,0,0.9);
            z-index: 999999; pointer-events: none; white-space: nowrap;
            animation: tierPopAnim 1s ease-out forwards;
        }
        @keyframes tierPopAnim {
            0% { opacity: 0; transform: translate(-50%, -10px) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
            70% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -15px) scale(1); }
        }

        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw;
            border-top: 1px solid rgba(255, 102, 0, 0.5); padding: 15px 20px 0 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto;
            background: linear-gradient(0deg, rgba(20,4,4,0.95) 0%, transparent 100%); opacity: 0; transition: opacity 1.5s ease;
        }
        .game-bottom-bar.visible { opacity: 1; }

        .btn-action {
            width: 46px; height: 46px; background: rgba(20, 4, 4, 0.85); 
            border: 1.5px solid rgba(255, 102, 0, 0.75); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active { transform: scale(0.9); }
        
        .btn-back { color: var(--amber); font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: bold; box-shadow: 0 0 12px rgba(255,183,0,0.4); padding-bottom: 2px; padding-right: 2px; }
        .btn-skip { border-color: rgba(255, 183, 0, 0.75); color: var(--amber); font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: bold; box-shadow: 0 0 12px rgba(255,183,0,0.4); }
        .btn-mute { border-color: rgba(255, 102, 0, 0.6); color: #ff6600; font-size: 20px; box-shadow: 0 0 12px rgba(255, 102, 0, 0.3); }
        .btn-pause { border-color: rgba(255, 51, 51, 0.6); box-shadow: 0 0 12px rgba(255, 51, 51, 0.3); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 18px; background: var(--crimson); margin: 0 3px; border-radius: 2px; box-shadow: 0 0 8px var(--crimson); }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; backdrop-filter: blur(10px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 320px; background: rgba(25, 5, 5, 0.95); border: 1.5px solid rgba(255,102,0,0.6); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: cinematicPopupSuperSlow 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pause-title { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: var(--neon-orange); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,102,0,0.6); }
        .pause-btn { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 51, 51, 0.2); border: 1px solid var(--crimson); color: var(--crimson); margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: transparent; z-index: 200000; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #freeze-overlay.active { display: flex; }
        @keyframes textFallSlow {
            0% { opacity: 0; transform: translateY(-70px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .freeze-text { font-family: 'Chakra Petch', sans-serif; font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 20px #ff6600, 0 0 40px #ffb700, 2px 2px 0px rgba(0,0,0,0.9); background: transparent; padding: 0; border: none; box-shadow: none; animation: textFallSlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* BẢNG TỔNG KẾT CUỐI CÙNG */
        #final-summary-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 4px; padding: 6px; opacity: 0; transition: opacity 1.2s ease; overflow-y: auto; }
        #final-summary-overlay.active { display: flex; opacity: 1; }
        #final-summary-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }

        .final-header { font-family: 'Chakra Petch', sans-serif; font-size: 18px; color: #ffffff; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,183,0,0.8); margin-bottom: 2px; }
        
        .stat-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); padding: 6px 14px; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .stat-line { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 80px; color: var(--amber); text-shadow: 0 0 8px rgba(255,183,0,0.5); font-size: 15px;}

        .bio-metrics-box { width: 92%; max-width: 340px; background: rgba(20, 6, 2, 0.95); backdrop-filter: blur(22px); border: 2px solid rgba(255, 165, 0, 0.6); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,102,0,0.1); }
        
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255, 102, 0, 0.3); padding-bottom: 5px; margin-bottom: 0; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11.5px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: var(--amber); font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 900; text-align: right; text-shadow: 0 0 10px rgba(255,183,0,0.8); }
        
        .debug-feedback { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #ffffff; text-align: left; background: rgba(255, 102, 0, 0.08); border: 1.5px solid rgba(255, 102, 0, 0.4); padding: 6px 8px; border-radius: 6px; line-height: 1.3; text-shadow: 0 0 6px rgba(255,255,255,0.4); }

        .result-btn-row { display: flex; gap: 8px; width: 92%; max-width: 340px; margin-top: 2px; }
        .result-action-btn { flex: 1; padding: 9px; font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; backdrop-filter: blur(8px); letter-spacing: 1px; }
        
        #btn-replay { background: var(--panel-bg); border: 1.5px solid #ff3366; color: #ff3366; }
        #btn-replay:active { background: #ff3366; color: #fff; transform: scale(0.95); }
        
        #btn-next { background: var(--panel-bg); border: 1.5px solid #00e5ff; color: #00e5ff; }
        #btn-next:active { background: #00e5ff; color: #0d0202; transform: scale(0.95); }

        .orb { position: absolute; border-radius: 50%; cursor: crosshair; display: flex; justify-content: center; align-items: center; }
        .orb-fire { width: 56px; height: 56px; background: radial-gradient(circle, #ffdf70 10%, #ffb700 40%, #ff3333 80%); box-shadow: 0 0 18px #ff3333; z-index: 10; }
        .orb-ice { width: 56px; height: 56px; background: radial-gradient(circle, #ffffff, #00e5ff); box-shadow: 0 0 20px #00e5ff; z-index: 5; }
        .orb-purple { width: 56px; height: 56px; background: radial-gradient(circle, #ff66cc, #8a2be2); box-shadow: 0 0 20px #8a2be2; z-index: 5; }
        .orb-green { width: 56px; height: 56px; background: radial-gradient(circle, #bfff00, #00ff00); box-shadow: 0 0 20px #00ff00; z-index: 5; }
