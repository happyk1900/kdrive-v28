<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010a15">
    <title>K-Drive - Phán Đoán</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-obsidian: #010a15;
            --cyan: #ff3366;
            --mint: #38ef7d;    
            --neon-red: #ff3366; 
            --amber: #ffd700;   
            --crimson: #ff3366;
            --text-light: #ffffff;
            --accent-red: #ff3366; 
            --panel-bg: rgba(15, 5, 8, 0.88); 
            --panel-border: rgba(255, 51, 102, 0.7); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-obsidian); font-family: 'Space Grotesk', sans-serif; }

        #sanctum-video { 
            position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 1; 
            object-fit: cover; opacity: 0;
            transition: opacity 3.0s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #sanctum-video.loaded { opacity: 1; }
        #sanctum-video.playing-mode { opacity: 0; pointer-events: none; transition: opacity 2.0s cubic-bezier(0.25, 1, 0.5, 1); }

        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #ffffff, 0 0 15px #ff3366; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        #task-arena { position: fixed; inset: 0; background: transparent; z-index: 120; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .play-area { width: 100%; max-width: 380px; height: 100vh; height: 100dvh; background: transparent; position: relative; overflow: hidden; margin: 0 auto; transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .play-area.fullscreen-mode { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; margin: 0 !important; z-index: 9990 !important; background: var(--bg-obsidian) !important; }

        .laser-beam-horizontal { position: fixed; top: 50%; left: 0; width: 100vw; height: 2px; background: #ff3366; box-shadow: 0 0 25px #ff3366, 0 0 50px #ffffff; z-index: 99999; transform: scaleX(0); transform-origin: center; animation: laserShoot 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards; pointer-events: none; }
        @keyframes laserShoot { 100% { transform: scaleX(1); height: 4px; } }
        .laser-beam-horizontal.expand { animation: laserExpand 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes laserExpand { 100% { height: 100vh; top: 0; opacity: 0; } }

        @keyframes cinematicPopupSuperSlow {
            0% { opacity: 0; transform: translateY(90px) scale(0.90); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
            50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 25px currentColor, inset 0 0 10px currentColor; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 10px currentColor, inset 0 0 5px currentColor; }
        }

        #start-prompt-overlay { position: absolute; inset: 0; background: transparent; z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 15px 40px 15px; gap: 16px; opacity: 0; visibility: hidden; transition: opacity 1.5s ease; }
        #start-prompt-overlay.active { opacity: 1; visibility: visible; }
        #start-prompt-overlay > * { animation: cinematicPopupSuperSlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; opacity: 0; }

        .briefing-panel { background: var(--panel-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px 24px; width: 100%; max-width: 340px; text-align: left; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .briefing-title { color: var(--accent-red) !important; font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(255, 51, 102, 0.4); padding-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,51,102,0.6); white-space: nowrap; }
        .briefing-target { color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.6; font-weight: 600; text-align: center; }

        .action-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .start-action-box { width: 100%; background: var(--panel-bg); border: 1.5px solid var(--accent-red); padding: 15px; border-radius: 12px; color: var(--accent-red); font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; animation: pulse-btn 1.5s infinite; }
        .start-action-box:active { transform: scale(0.96); background: var(--accent-red); color: #010a15; }

        .game-top-bar {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: 0; width: 100vw; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease;
        }
        .game-top-bar.visible { opacity: 1; }

        .health-container { display: flex; gap: 4px; align-items: center; }
        .health-bar { width: 14px; height: 6px; background: rgba(255,255,255,0.15); transform: skewX(-20deg); transition: all 0.3s ease; }
        .health-bar.cyan.active { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
        .health-bar.pink.active { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        .data-score { font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: bold; color: #fff; display: flex; align-items: center; position: relative; }
        .data-score span { color: var(--accent-red); text-shadow: 0 0 12px var(--accent-red); font-size: 20px; margin-left: 6px; }

        #hp-notification-area { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); width: 220px; text-align: center; }

        .game-bottom-bar {
            position: fixed; bottom: max(15px, env(safe-area-inset-top)); left: 0; width: 100vw;
            border-top: 1px solid rgba(255, 51, 102, 0.5); padding: 15px 20px 0 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10000; pointer-events: auto;
            background: linear-gradient(0deg, rgba(1,10,21,0.95) 0%, transparent 100%); opacity: 0; transition: opacity 1.5s ease;
        }
        .game-bottom-bar.visible { opacity: 1; }

        .btn-action {
            width: 46px; height: 46px; background: rgba(5, 12, 22, 0.85); 
            border: 1.5px solid rgba(255, 51, 102, 0.75); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active { transform: scale(0.9); }
        
        .btn-back { color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: bold; box-shadow: 0 0 12px rgba(255,51,102,0.4); padding-bottom: 2px; padding-right: 2px; }
        .btn-mute { border-color: rgba(255, 51, 102, 0.6); color: #ff3366; font-size: 20px; box-shadow: 0 0 12px rgba(255, 51, 102, 0.3); }
        .btn-pause { border-color: rgba(255, 170, 0, 0.6); box-shadow: 0 0 12px rgba(255, 170, 0, 0.3); }
        .btn-pause::before, .btn-pause::after { content: ''; width: 4px; height: 18px; background: var(--accent-red); margin: 0 3px; border-radius: 2px; box-shadow: 0 0 8px var(--accent-red); }

        #pause-menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; backdrop-filter: blur(10px); }
        #pause-menu-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-box { width: 85%; max-width: 320px; background: rgba(5, 12, 22, 0.95); border: 1.5px solid rgba(255,51,102,0.6); border-radius: 16px; padding: 25px 20px; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.8); animation: cinematicPopupSuperSlow 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pause-title { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: var(--accent-red); margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,51,102,0.6); }
        .pause-btn { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .pause-btn.resume { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color: #fff; }
        .pause-btn.exit { background: rgba(255, 51, 51, 0.2); border: 1px solid var(--crimson); color: var(--crimson); margin-bottom: 0; }

        #freeze-overlay { position: fixed; inset: 0; background: transparent; z-index: 200000; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #freeze-overlay.active { display: flex; }
        @keyframes textFallSlow {
            0% { opacity: 0; transform: translateY(-70px) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .freeze-text { font-family: 'Chakra Petch', sans-serif; font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 20px #ff3366, 0 0 40px rgba(255,51,102,0.8), 2px 2px 0px rgba(0,0,0,0.9); background: transparent; padding: 0; border: none; box-shadow: none; animation: textFallSlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* BẢNG TỔNG KẾT ĐÚNG TRẬT TỰ KHOA HỌC */
        #final-summary-overlay { position: absolute; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 10px; padding: 10px; opacity: 0; transition: opacity 1.2s ease; }
        #final-summary-overlay.active { display: flex; opacity: 1; }
        #final-summary-overlay.active > * { animation: cinematicPopupSuperSlow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }

        .final-header { font-family: 'Chakra Petch', sans-serif; font-size: 24px; color: #ffffff; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,51,102,0.8); margin-bottom: 4px; }
        
        .stat-box { width: 92%; max-width: 340px; background: var(--panel-bg); backdrop-filter: blur(22px); border: 1.5px solid var(--panel-border); padding: 12px 20px; border-radius: 14px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .stat-line { display: flex; justify-content: space-between; align-items: center; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #ffffff; width: 100%; font-weight: bold; }
        .stat-line span:first-child { text-align: left; flex: 1; color: #ffffff; }
        .stat-line span:last-child { text-align: right; min-width: 80px; color: var(--accent-red); text-shadow: 0 0 8px rgba(255,51,102,0.5); font-size: 20px;}

        .bio-metrics-box { width: 92%; max-width: 340px; background: rgba(20, 4, 10, 0.95); backdrop-filter: blur(22px); border: 2px solid rgba(255, 51, 102, 0.6); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,51,102,0.1); }
        .metric-card-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255, 51, 102, 0.3); padding-bottom: 8px; margin-bottom: 2px; width: 100%; }
        .metric-card-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .metric-label { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; flex: 1; text-align: left;}
        .metric-val { color: var(--accent-red); font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; text-align: right; text-shadow: 0 0 8px rgba(255,51,102,0.5); }
        
        .rank-text { font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; text-align: right; }

        .result-btn-row { display: flex; gap: 10px; width: 92%; max-width: 340px; margin-top: 2px; }
        .result-action-btn { flex: 1; padding: 13px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; text-align: center; transition: 0.2s; backdrop-filter: blur(8px); letter-spacing: 1px; }
        
        #btn-replay { background: var(--panel-bg); border: 1.5px solid #ff3366; color: #ff3366; animation: pulse-btn 1.5s infinite; }
        #btn-replay:active { background: #ff3366; color: #fff; transform: scale(0.95); animation: none; }
        
        #btn-next { background: var(--panel-bg); border: 1.5px solid #00e5ff; color: #00e5ff; animation: pulse-btn 1.5s infinite; animation-delay: 0.2s; }
        #btn-next:active { background: #00e5ff; color: #010a15; transform: scale(0.95); animation: none; }

        #game-play-zone { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; overflow: hidden; z-index: 10; display: none;}
        #game-play-zone.active { display: block;}
        
        .wind-target { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease, opacity 0.15s ease; } 
        .t-track-mode { background: #ffffff; border: 2px solid #ff3366; box-shadow: 0 0 20px #ffffff, 0 0 40px rgba(255, 51, 102, 0.8); }
        .t-track-mode.hovered { border-color: #ffffff; box-shadow: 0 0 30px #ffffff, 0 0 60px #ff3366; background: #ffffff; transform: translate(-50%, -50%) scale(1.15); }
        
        #custom-cursor { position: absolute; width: 20px; height: 20px; border: 2px solid #ff3366; border-radius: 50%; pointer-events: none; z-index: 100; display: none; box-shadow: 0 0 12px #ff3366; transform: translate(-50%, -50%); }

        #warning-bar-container { position: absolute; bottom: max(80px, calc(env(safe-area-inset-bottom) + 80px)); left: 50%; transform: translateX(-50%); width: 200px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden; display: none; z-index: 130;}
        #warning-progress { width: 0%; height: 100%; background: var(--crimson); transition: width 0.1s linear; }

        .flashbang-red { position: fixed; inset: 0; background: rgba(255, 51, 102, 0.4); z-index: 999999; pointer-events: none; animation: flashRed 0.4s forwards; }
        @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <video id="sanctum-video" autoplay loop playsinline>
        <source src="https://github.com/happyk1900/Kai-Ripe/raw/refs/heads/main/video%20nen%20phong%20luan.mp4" type="video/mp4">
    </video>

    <div id="dust-container"></div>

    <div id="task-arena">
        <div class="play-area" id="play-area">

            <div id="game-top-bar" class="game-top-bar">
                <div class="health-container">
                    <div class="health-bar cyan active" id="hp-g-1"></div>
                    <div class="health-bar cyan active" id="hp-g-2"></div>
                    <div class="health-bar cyan active" id="hp-g-3"></div>
                    <div class="health-bar cyan active" id="hp-g-4"></div>
                    <div class="health-bar cyan active" id="hp-g-5"></div>
                </div>

                <div class="data-score">DATA: <span id="boo-points">0</span>
                    <div id="hp-notification-area"></div>
                </div>

                <div class="health-container">
                    <div class="health-bar pink" id="hp-p-1"></div>
                    <div class="health-bar pink" id="hp-p-2"></div>
                    <div class="health-bar pink" id="hp-p-3"></div>
                    <div class="health-bar pink" id="hp-p-4"></div>
                    <div class="health-bar pink" id="hp-p-5"></div>
                </div>
            </div>

            <div id="game-bottom-bar" class="game-bottom-bar">
                <button class="btn-action btn-back" onclick="confirmExitToLobby()">⟨</button>
                <button class="btn-action btn-mute" id="btn-mute" onclick="toggleVideoMute()" title="Bật/Tắt tiếng video">🔊</button>
                <button class="btn-action btn-pause" onclick="pauseGame()"></button>
            </div>

            <div id="start-prompt-overlay" class="active">
                <div id="briefing-panel" class="briefing-panel">
                    <div class="briefing-title">KIỂM TRA PHÁN ĐOÁN</div>
                    <div class="briefing-target">
                        Bám dính liên tục theo đường bay của hạt 🟡
                    </div>
                </div>
                <div class="action-group">
                    <div class="start-action-box" onclick="triggerStartGame()">BẮT ĐẦU</div>
                </div>
            </div>

            <div id="pause-menu-overlay">
                <div class="pause-box">
                    <div class="pause-title">TẠM DỪNG</div>
                    <button class="pause-btn resume" onclick="resumeGame()">TIẾP TỤC</button>
                    <button class="pause-btn exit" onclick="confirmExitToLobby()">VỀ SẢNH CHỜ</button>
                </div>
            </div>

            <div id="freeze-overlay"><div class="freeze-text">KẾT THÚC</div></div>

            <div id="game-play-zone">
                <div id="custom-cursor"></div>
                <div id="game-target" class="wind-target t-track-mode"></div>
                <div id="warning-bar-container"><div id="warning-progress"></div></div>
            </div>

            <!-- BẢNG TỔNG KẾT ĐÚNG TRẬT TỰ KHOA HỌC: SỐ LIỆU ĐO Ở TRÊN -> CẤU HÌNH PHẦN CỨNG Ở DƯỚI -->
            <div id="final-summary-overlay">
                <div class="final-header">KẾT QUẢ PHÁN ĐOÁN</div>
                
                <div class="stat-box">
                    <div class="stat-line" style="justify-content: center;">
                        <span style="font-weight: 900; color: #fff5f0; font-size: 13px;">TỔNG ĐIỂM DATA:</span> 
                        <span class="stat-val" id="sum-score-total" style="font-weight:900; color:var(--accent-red); font-size:20px; margin-left: 8px;">0</span>
                    </div>
                </div>

                <div class="bio-metrics-box">
                    <!-- TẦNG TRÊN: CHỈ SỐ KHOA HỌC ĐO LƯỜNG THỰC TẾ -->
                    <div class="metric-card-row">
                        <span class="metric-label">Chuỗi bám dính Max</span>
                        <span class="metric-val" id="final-focus">0.0s</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Tần số quét quỹ đạo</span>
                        <span class="metric-val" id="final-fps">60 FPS</span>
                    </div>
                    
                    <!-- TẦNG DƯỚI: CẤU HÌNH PHẦN CỨNG TƯƠNG QUAN -->
                    <div class="metric-card-row">
                        <span class="metric-label">Card đồ họa (GPU)</span>
                        <span class="rank-text" id="sum-gpu-rank">GPU</span>
                    </div>
                    <div class="metric-card-row">
                        <span class="metric-label">Bo mạch chủ (Mainboard)</span>
                        <span class="rank-text" id="sum-main-rank">MAIN</span>
                    </div>
                </div>

                <div class="result-btn-row">
                    <button class="result-action-btn" id="btn-replay" onclick="initLobbyState()">TẬP LẠI</button>
                    <button class="result-action-btn" id="btn-next" onclick="goToNextModule()">CHUYỂN BÀI</button>
                </div>
            </div>
            
        </div>
    </div>

    <video id="sanctum-video" autoplay loop playsinline>
        <source src="https://github.com/happyk1900/Kai-Ripe/raw/refs/heads/main/video%20nen%20phong%20luan.mp4" type="video/mp4">
    </video>

    <script>
        // HỆ THỐNG ĐÁNH GIÁ PHẦN CỨNG GPU & MAINBOARD KÈM HỆ THỐNG ĐỘNG VẬT TIẾN HÓA
        function getHardwareEvaluation(maxSec, totalScore) {
            if (totalScore < 1000 || maxSec < 2.0) {
                return {
                    fps: "30 FPS",
                    gpu: "🐌 GTX 650", gpuColor: "#ff3333",
                    main: "🐌 Mainboard H61 Cổ", mainColor: "#ff3333"
                };
            }
            if (maxSec >= 15.0) {
                return {
                    fps: "240 FPS",
                    gpu: "🦖 RTX 5090 Blackwell", gpuColor: "#ffd700",
                    main: "🦖 ROG Maximus Z890", mainColor: "#ffd700"
                };
            } else if (maxSec >= 10.0) {
                return {
                    fps: "165 FPS",
                    gpu: "🦅 RTX 4090", gpuColor: "#00ff9d",
                    main: "🦅 Mainboard Z790 Extreme", mainColor: "#00ff9d"
                };
            } else if (maxSec >= 6.0) {
                return {
                    fps: "120 FPS",
                    gpu: "🐬 RTX 3060", gpuColor: "#00e5ff",
                    main: "🐬 Mainboard B760", mainColor: "#00e5ff"
                };
            } else {
                return {
                    fps: "60 FPS",
                    gpu: "🐢 GTX 1650", gpuColor: "#ffffff",
                    main: "🐢 Mainboard H61 Phổ Thông", mainColor: "#ffffff"
                };
            }
        }

        let aScore = 0; 
        let stabilityHP = 5; 
        let isPlaying = false; 
        let isPausedForStart = true;
        
        let currentFocusFrames = 0;
        let maxFocusFrames = 0;
        let finalMaxFocusSec = 0;
        
        let loopRaf;
        let gTimeouts = [];

        let playArea = document.getElementById('play-area');
        let maxX = 380;
        let maxY = window.innerHeight;
        
        let tx = 0, ty = 0;
        let tAngle = 0;
        let tEl = document.getElementById('game-target');
        let mx = 0, my = 0;

        let gFrameCount = 0;
        let gNextTurnFrame = 0;
        let gDashFrames = 0;
        let gDashMultiplier = 1;
        let gMissFrames = 0;
        let nextHpMilestone = 1000;

        let fxCtx = null;
        function initAudio() { 
            try {
                if (!fxCtx) { fxCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (fxCtx && fxCtx.state === 'suspended') { fxCtx.resume(); }
                let vid = document.getElementById('sanctum-video');
                if (vid && !vid.dataset.userMuted) { vid.muted = false; vid.play().catch(e => {}); }
            } catch(e) {}
        }
        ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(evt => { window.addEventListener(evt, initAudio, { passive: true }); });

        function toggleVideoMute() {
            let vid = document.getElementById('sanctum-video');
            let muteBtn = document.getElementById('btn-mute');
            if(!vid) return;
            vid.muted = !vid.muted;
            vid.dataset.userMuted = vid.muted ? 'true' : 'false';
            muteBtn.innerHTML = vid.muted ? '🔇' : '🔊';
            playSound('coin');
        }

        function playSound(type, pitchMultiplier = 1) {
            try { 
                if (fxCtx && fxCtx.state === 'suspended') fxCtx.resume();
                if (!fxCtx) return;
                const ctx = fxCtx; const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'katana') { 
                    osc.type = 'sawtooth'; 
                    osc.frequency.setValueAtTime(1200 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); 
                    osc.start(); osc.stop(ctx.currentTime + 0.3); 
                } 
                else if(type === 'error') { 
                    osc.type = 'square'; 
                    osc.frequency.setValueAtTime(100, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.4, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                    osc.start(); osc.stop(ctx.currentTime + 0.4); 
                } 
                else if(type === 'coin') { 
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(1500 * pitchMultiplier, ctx.currentTime); 
                    osc.frequency.setValueAtTime(2000 * pitchMultiplier, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); 
                    osc.start(); osc.stop(ctx.currentTime + 0.2); 
                } 
            } catch (e) {}
        }

        window.onload = () => { 
            initLobbyState(); 
            initSparkleParticles();
        };

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<35; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function updateHpDisplay() {
            let hp = Math.min(5, Math.max(0, stabilityHP));
            for(let i=1; i<=5; i++) {
                let barG = document.getElementById('hp-g-'+i);
                let barP = document.getElementById('hp-p-'+i);
                if(barG) barG.classList.toggle('active', i <= hp);
                if(barP) barP.classList.toggle('active', false);
            }
        }

        function showHpRewardAlert() {
            let alertBox = document.createElement('div');
            alertBox.className = 'status-notification';
            alertBox.innerHTML = `+1 NĂNG LƯỢNG`;
            let notifArea = document.getElementById('hp-notification-area');
            if(notifArea) notifArea.appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 1200);
        }

        function initLobbyState() {
            aScore = 0; stabilityHP = 5; isPlaying = false; isPausedForStart = true;
            nextHpMilestone = 1000;
            currentFocusFrames = 0; maxFocusFrames = 0;
            
            cancelAnimationFrame(loopRaf);
            gTimeouts.forEach(t => clearTimeout(t));
            gTimeouts = [];

            let vid = document.getElementById('sanctum-video');
            if(vid) {
                vid.classList.remove('playing-mode');
                vid.classList.add('loaded');
            }

            let playAreaWrap = document.getElementById('play-area');
            if(playAreaWrap) playAreaWrap.classList.remove('fullscreen-mode');

            updateHpDisplay(); 
            let scoreEl = document.getElementById('boo-points');
            if(scoreEl) scoreEl.innerText = "0";

            let pauseOverlay = document.getElementById('pause-menu-overlay');
            if(pauseOverlay) pauseOverlay.classList.remove('active');

            let summaryOverlay = document.getElementById('final-summary-overlay');
            if(summaryOverlay) summaryOverlay.classList.remove('active');

            let playZone = document.getElementById('game-play-zone');
            if(playZone) playZone.classList.remove('active');
            
            let topBar = document.getElementById('game-top-bar');
            let botBar = document.getElementById('game-bottom-bar');
            if(topBar) topBar.classList.remove('visible');
            if(botBar) botBar.classList.remove('visible');
            
            let promptOverlay = document.getElementById('start-prompt-overlay');
            if(promptOverlay) promptOverlay.classList.add('active');
        }

        function triggerStartGame() {
            initAudio(); playSound('coin');
            let promptOverlay = document.getElementById('start-prompt-overlay');
            if(promptOverlay) promptOverlay.classList.remove('active');
            
            let vid = document.getElementById('sanctum-video');
            if(vid) {
                vid.classList.remove('loaded');
                vid.classList.add('playing-mode');
            }

            playSound('katana', 0.6); 
            let laser = document.createElement('div'); 
            laser.className = 'laser-beam-horizontal'; 
            document.body.appendChild(laser);

            setTimeout(() => { 
                let playAreaWrap = document.getElementById('play-area'); 
                if(playAreaWrap) playAreaWrap.classList.add('fullscreen-mode'); 
                laser.classList.add('expand'); 
            }, 600);

            setTimeout(() => { 
                laser.remove(); 
                isPausedForStart = false; 
                let topBar = document.getElementById('game-top-bar');
                let botBar = document.getElementById('game-bottom-bar');
                let playZone = document.getElementById('game-play-zone');
                if(topBar) topBar.classList.add('visible'); 
                if(botBar) botBar.classList.add('visible'); 
                if(playZone) playZone.classList.add('active'); 
                startArena(); 
            }, 1500);
        }

        function pauseGame() { 
            if(!isPlaying || isPausedForStart) return; 
            playSound('error'); 
            isPausedForStart = true; 
            gTimeouts.forEach(t => clearTimeout(t)); 
            cancelAnimationFrame(loopRaf); 
            let pauseOverlay = document.getElementById('pause-menu-overlay');
            if(pauseOverlay) pauseOverlay.classList.add('active'); 
        }

        function resumeGame() { 
            playSound('coin'); 
            let pauseOverlay = document.getElementById('pause-menu-overlay');
            if(pauseOverlay) pauseOverlay.classList.remove('active'); 
            isPausedForStart = false; 
            loopRaf = requestAnimationFrame(gameLoop); 
        }

        function confirmExitToLobby() { playSound('error'); window.location.href = '../LucChien_2.html'; }
        function goToNextModule() { playSound('coin'); window.location.href = '../LucChien_2.html'; }

        function updateMousePos(e) {
            if(!isPlaying || isPausedForStart) return;
            let playAreaWrap = document.getElementById('play-area');
            if(!playAreaWrap) return;
            let rect = playAreaWrap.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                mx = e.touches[0].clientX - rect.left; my = e.touches[0].clientY - rect.top;
            } else {
                mx = e.clientX - rect.left; my = e.clientY - rect.top;
            }
            let cursor = document.getElementById('custom-cursor');
            if(cursor) {
                cursor.style.left = mx + 'px';
                cursor.style.top = my + 'px';
            }
        }
        
        let playZoneEl = document.getElementById('game-play-zone');
        if(playZoneEl) {
            playZoneEl.addEventListener('mousemove', updateMousePos);
            playZoneEl.addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});
        }

        function addScore(points) {
            aScore += points;
            let scoreEl = document.getElementById('boo-points');
            if(scoreEl) scoreEl.innerText = Math.floor(aScore);

            if (aScore >= nextHpMilestone) {
                nextHpMilestone += 1000;
                stabilityHP = Math.min(5, stabilityHP + 1);
                updateHpDisplay();
                showHpRewardAlert();
            }
        }

        function loseLife() {
            stabilityHP -= 1; 
            updateHpDisplay();
            playSound('error');
            
            let flash = document.createElement('div'); 
            flash.className = 'flashbang-red'; 
            document.body.appendChild(flash); 
            setTimeout(() => flash.remove(), 400);

            if(stabilityHP <= 0) finishGame();
        }

        function startArena() {
            aScore = 0; stabilityHP = 5;
            cancelAnimationFrame(loopRaf);
            gTimeouts.forEach(t => clearTimeout(t));

            isPlaying = true; 
            playSound('katana');
            
            let scoreEl = document.getElementById('boo-points');
            if(scoreEl) scoreEl.innerText = '0';
            updateHpDisplay();

            let playAreaWrap = document.getElementById('play-area');
            if(playAreaWrap) {
                maxX = playAreaWrap.clientWidth;
                maxY = playAreaWrap.clientHeight;
            }
            tx = maxX / 2; ty = maxY / 2; tAngle = Math.random() * Math.PI * 2;
            if(tEl) tEl.style.display = 'flex';

            if(tEl) tEl.className = 'wind-target t-track-mode';
            let cursor = document.getElementById('custom-cursor');
            let warnContainer = document.getElementById('warning-bar-container');
            if(cursor) cursor.style.display = 'block';
            if(warnContainer) warnContainer.style.display = 'block';

            gMissFrames = 0; gFrameCount = 0; gDashFrames = 0; gDashMultiplier = 1;
            gNextTurnFrame = Math.floor(Math.random() * 60) + 30; 
            tAngle = Math.random() * Math.PI * 2;
            
            loopRaf = requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if(!isPlaying || isPausedForStart) return;

            gFrameCount++;
            let currentTargetSpeed = aScore < 2000 ? 1.6 : (2.2 + ((aScore - 2000) * 0.0025));
            if (currentTargetSpeed > 16.0) currentTargetSpeed = 16.0; 

            let turnFreqOffset = aScore < 2000 ? 0 : (aScore < 3000 ? 5 : (aScore < 4000 ? 10 : 15));

            if (gDashFrames > 0) { gDashFrames--; } 
            else {
                gDashMultiplier = 1;
                if (aScore >= 2000 && Math.random() < 0.012) { 
                    gDashMultiplier = 1.5; 
                    gDashFrames = Math.floor(Math.random() * 10) + 5; 
                }
            }

            if (gFrameCount >= gNextTurnFrame) {
                let turnAngle = (Math.PI / 4) + Math.random() * (Math.PI * 0.58); 
                if (Math.random() < 0.5) turnAngle = -turnAngle;
                tAngle += turnAngle;
                gFrameCount = 0;
                gNextTurnFrame = Math.max(15, Math.floor(Math.random() * 40) + 20 - turnFreqOffset);
            }

            let finalSpeed = currentTargetSpeed * gDashMultiplier;
            tx += Math.cos(tAngle) * finalSpeed;
            ty += Math.sin(tAngle) * finalSpeed;

            let minX = 35, maxXBound = maxX - 35;
            let minY = 95, maxYBound = maxY - 100; 

            let hitWall = false;
            if (tx < minX) { tx = minX; hitWall = true; tAngle = Math.PI - tAngle; }
            else if (tx > maxXBound) { tx = maxXBound; hitWall = true; tAngle = Math.PI - tAngle; }
            if (ty < minY) { ty = minY; hitWall = true; tAngle = -tAngle; }
            else if (ty > maxYBound) { ty = maxYBound; hitWall = true; tAngle = -tAngle; }

            if (hitWall) { tAngle += (Math.random() - 0.5) * 0.5; }

            if(tEl) {
                tEl.style.left = tx + 'px';
                tEl.style.top = ty + 'px';
                tEl.style.transform = `translate(-50%, -50%)`;
            }

            let pointsToAdd = aScore >= 7000 ? 4.5 : (aScore >= 6000 ? 3.5 : (aScore >= 4000 ? 2.5 : (aScore >= 3000 ? 1.8 : 1.2)));
            let dist = Math.hypot(mx - tx, my - ty);
            let hitRadius = 65;
            const G1_MAX_MISS_FRAMES = 120; 
            
            let warnProg = document.getElementById('warning-progress');
            if(dist < hitRadius) {
                addScore(pointsToAdd);
                if(tEl) tEl.classList.add('hovered');
                gMissFrames = 0;
                if(warnProg) warnProg.style.width = '0%';
                
                currentFocusFrames++;
                if (currentFocusFrames > maxFocusFrames) maxFocusFrames = currentFocusFrames;
            } else {
                if(tEl) tEl.classList.remove('hovered');
                currentFocusFrames = 0; 
                
                gMissFrames++;
                let pct = (gMissFrames / G1_MAX_MISS_FRAMES) * 100; 
                if(warnProg) warnProg.style.width = Math.min(100, pct) + '%';

                if(gMissFrames > G1_MAX_MISS_FRAMES) { 
                    loseLife();
                    gMissFrames = 0; 
                }
            }

            loopRaf = requestAnimationFrame(gameLoop);
        }

        function finishGame() {
            isPlaying = false; isPausedForStart = true;
            cancelAnimationFrame(loopRaf);

            let vid = document.getElementById('sanctum-video');
            if(vid) {
                vid.classList.remove('playing-mode');
                setTimeout(() => vid.classList.add('loaded'), 400);
            }

            let validScore = (aScore >= 1000) ? Math.floor(aScore) : 0;
            finalMaxFocusSec = Math.round((maxFocusFrames / 60) * 10) / 10;
            localStorage.setItem('phong_luan_score', validScore);

            let topBar = document.getElementById('game-top-bar');
            let botBar = document.getElementById('game-bottom-bar');
            let playAreaWrap = document.getElementById('play-area');
            let playZone = document.getElementById('game-play-zone');
            
            if(topBar) topBar.classList.remove('visible');
            if(botBar) botBar.classList.remove('visible');
            if(playAreaWrap) playAreaWrap.classList.remove('fullscreen-mode');
            if(playZone) playZone.classList.remove('active');
            
            if(tEl) tEl.style.display = 'none';
            let cursor = document.getElementById('custom-cursor');
            let warnContainer = document.getElementById('warning-bar-container');
            if(cursor) cursor.style.display = 'none';
            if(warnContainer) warnContainer.style.display = 'none';

            playSound('error'); 
            let freezeOverlay = document.getElementById('freeze-overlay');
            if(freezeOverlay) freezeOverlay.classList.add('active');

            setTimeout(() => {
                if(freezeOverlay) freezeOverlay.classList.remove('active');
                
                let sumTotal = document.getElementById('sum-score-total');
                let finalFocus = document.getElementById('final-focus');
                let finalFps = document.getElementById('final-fps');
                
                if(sumTotal) sumTotal.innerText = validScore;
                if(finalFocus) finalFocus.innerText = (validScore > 0) ? finalMaxFocusSec + "s" : "Chưa đủ Data (<1000)";

                let hwEval = getHardwareEvaluation(finalMaxFocusSec, validScore);
                
                if(finalFps) finalFps.innerText = hwEval.fps;

                let gpuBadge = document.getElementById('sum-gpu-rank');
                if(gpuBadge) gpuBadge.innerHTML = `<span style="color: ${hwEval.gpuColor}; text-shadow: 0 0 10px ${hwEval.gpuColor};">${hwEval.gpu}</span>`;

                let mainBadge = document.getElementById('sum-main-rank');
                if(mainBadge) mainBadge.innerHTML = `<span style="color: ${hwEval.mainColor}; text-shadow: 0 0 10px ${hwEval.mainColor};">${hwEval.main}</span>`;

                let summaryOverlay = document.getElementById('final-summary-overlay');
                if(summaryOverlay) summaryOverlay.classList.add('active');
                playSound('coin');
            }, 1800);
        }
    </script>
