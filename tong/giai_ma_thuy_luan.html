<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050b14">
    <title>K-Drive - Giải Mã Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050b14; font-family: 'Space Grotesk', sans-serif; }

        /* VIDEO NỀN SÁNG 100% */
        #bg-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; opacity: 1.0;
        }

        .decoder-container {
            position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 30px 20px;
        }

        .decoder-card {
            width: 100%; max-width: 360px; min-height: 245px;
            background: rgba(5, 11, 20, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 20px 18px 12px 18px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 229, 255, 0.15);
            margin-bottom: 12px;
            position: relative;
        }

        .slide-title {
            font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 900; color: #00e5ff;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; white-space: nowrap;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
        }

        .slide-content {
            font-size: 13px; color: #ffffff; line-height: 1.5; font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            min-height: 110px; display: block; text-align: left; width: 100%;
            word-break: break-word;
        }

        .highlight-cyan { color: #00e5ff; font-weight: 700; }
        .highlight-pink { color: #ff3366; font-weight: 700; }
        .highlight-gold { color: #ffd700; font-weight: 700; }
        .highlight-mint { color: #00ff9d; font-weight: 700; }

        .slide-nav-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 6px;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255,255,255,0.3); color: #fff;
            padding: 5px 14px; border-radius: 8px; font-family: 'Chakra Petch', sans-serif; font-size: 11px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:active { background: rgba(0, 229, 255, 0.4); border-color: #00e5ff; }
        .slide-indicator { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #f48fb1; font-weight: bold; }

        .action-buttons-box {
            display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 360px; z-index: 20;
        }

        .btn-action-custom {
            width: 100%; padding: 12px; border-radius: 12px; font-family: 'Chakra Petch', sans-serif;
            font-size: 13.5px; font-weight: 900; text-transform: uppercase; cursor: pointer; text-align: center;
            letter-spacing: 1px; backdrop-filter: blur(10px); transition: 0.2s;
        }
        .btn-action-custom.primary {
            background: rgba(0, 229, 255, 0.25); border: 2px solid #00e5ff; color: #00e5ff;
            box-shadow: 0 0 15px rgba(0,229,255,0.4);
        }
        .btn-action-custom.primary:active { background: #00e5ff; color: #050b14; transform: scale(0.97); }

        .btn-action-custom.secondary {
            background: rgba(255, 51, 102, 0.2); border: 2px solid #ff3366; color: #ff3366;
            box-shadow: 0 0 15px rgba(255,51,102,0.3);
        }
        .btn-action-custom.secondary:active { background: #ff3366; color: #fff; transform: scale(0.97); }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="../../Photo/Video giai ma thuy luan.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop preload="auto">
        <source src="../../Photo/Pixel Dream Circuit.mp3" type="audio/mpeg">
    </audio>

    <div class="decoder-container">
        <div id="slide-box" class="decoder-card">
            <div id="slide-title" class="slide-title"></div>
            <div id="slide-content" class="slide-content"></div>
            <div class="slide-nav-row">
                <button class="nav-btn" onclick="prevSlide(event)">⟨ QUAY LẠI</button>
                <span id="slide-counter" class="slide-indicator">1 / 4</span>
                <button class="nav-btn" onclick="nextSlide(event)">TIẾP ⟩</button>
            </div>
        </div>

        <div class="action-buttons-box">
            <button class="btn-action-custom primary" onclick="goToNextTest(event)">ĐẾN ĐO PHẢN XẠ</button>
            <button class="btn-action-custom secondary" onclick="replayDecoder(event)">ĐO LẠI TRÍ NHỚ</button>
        </div>
    </div>

    <script>
        const slides = [
            {
                title: "GIẢI MÃ KHOA HỌC THẦN KINH",
                content: "Bài test này đánh giá trực tiếp <span class='highlight-gold'>Trí nhớ làm việc (Working Memory)</span> và <span class='highlight-gold'>Vòng lặp thị giác - không gian</span> do <span class='highlight-pink'>vỏ não trước trán (Prefrontal Cortex)</span> quản lý, chịu trách nhiệm lưu trữ tạm thời và thao tác thông tin trong thời gian thực."
            },
            {
                title: "GIẢI MÃ NGÔN NGỮ MÁY TÍNH",
                content: "Ánh xạ sinh học giúp <span class='highlight-cyan'>xếp hạng chính xác năng lực trí nhớ</span> và bóc tách từng vùng xử lý. Qua đó thấy rõ dung lượng RAM và tốc độ SSD, chỉ ra <span class='highlight-pink'>chính xác điểm nghẽn (bottleneck)</span> đang kìm hãm tư duy."
            },
            {
                title: "GIẢI MÃ TRIẾT LÝ VÕ HỌC",
                content: "\"<span class='highlight-gold'>Tâm như nước biến hóa vô hình, tĩnh lặng soi chiếu vạn vật.</span>\" — Miyamoto Musashi.<br>Tâm thức tĩnh lặng tuyệt đối giúp ghi nhận, xử lý và phản xạ thông tin linh hoạt như dòng nước."
            },
            {
                title: "K-DRIVE VÀ TỐI ƯU HIỆU SUẤT",
                content: "Thói quen lướt <span class='highlight-pink'>video ngắn liên tục (TikTok, Reels)</span> làm phân mảnh bộ nhớ đệm. Mô-đun này chẩn đoán điểm nghẽn; để tập luyện nâng cấp toàn diện, hãy truy cập <span class='highlight-mint'>NÂNG CẤP TOÀN DIỆN</span>."
            }
        ];

        let currentIndex = 0;
        let isAudioInitialized = false;

        function renderSlide() {
            document.getElementById('slide-title').innerText = slides[currentIndex].title;
            document.getElementById('slide-content').innerHTML = slides[currentIndex].content;
            document.getElementById('slide-counter').innerText = (currentIndex + 1) + " / " + slides.length;
        }

        function startSmoothAudio() {
            if (isAudioInitialized) return;
            isAudioInitialized = true;

            let music = document.getElementById('bg-music');
            if (music) {
                music.volume = 0.0;
                music.play().then(() => {
                    let vol = 0.0;
                    let fadeInterval = setInterval(() => {
                        vol += 0.05;
                        if (vol >= 0.35) {
                            vol = 0.35;
                            clearInterval(fadeInterval);
                        }
                        music.volume = vol;
                    }, 150);
                }).catch(e => {});
            }
        }

        function nextSlide(event) {
            event.stopPropagation();
            startSmoothAudio();
            currentIndex = (currentIndex + 1) % slides.length;
            renderSlide();
        }

        function prevSlide(event) {
            event.stopPropagation();
            startSmoothAudio();
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            renderSlide();
        }

        function goToNextTest(event) {
            event.stopPropagation();
            startSmoothAudio();
            window.location.href = '../TestHoaLuan.html';
        }

        function replayDecoder(event) {
            event.stopPropagation();
            startSmoothAudio();
            window.location.href = '../tong_quan.html';
        }

        window.onload = () => {
            renderSlide();
            ['touchstart', 'mousedown', 'keydown'].forEach(evt => {
                window.addEventListener(evt, startSmoothAudio, { once: true, passive: true });
            });
        };
    </script>
</body>
</html>
