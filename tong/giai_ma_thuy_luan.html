<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050b14">
    <title>K-Drive - Giải Mã Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050b14; font-family: 'Space Grotesk', sans-serif; }

        /* HẠT LƯỢNG TỬ BAY LƠ LỬNG XUYÊN SUỐT */
        #dust-container { position: fixed; inset: 0; pointer-events: none; z-index: 500; overflow: hidden; }
        .quantum-sparkle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #00e5ff, 0 0 15px #0088ff; opacity: 0; animation: sparkleFloat linear infinite; }
        @keyframes sparkleFloat { 
            0% { transform: translateY(105vh) scale(0.3); opacity: 0; } 
            20% { opacity: 0.8; } 
            50% { transform: translateY(50vh) translateX(15px) scale(1); opacity: 0.6; filter: brightness(1.5); } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-10vh) translateX(-15px) scale(0.2); opacity: 0; } 
        }

        /* MÀN HÌNH MỞ ĐẦU TRIẾT LÝ (KHÔNG KHUNG VIỀN THỪA, ICON KHÔNG VIỀN) */
        #gateway-screen {
            position: fixed; inset: 0; background: radial-gradient(circle at center, #0a192f 0%, #050b14 100%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center; transition: opacity 0.8s ease;
        }
        #gateway-screen.fade-out { opacity: 0; pointer-events: none; }

        .gateway-content-box {
            width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .water-icon-pure {
            width: 85px; height: 85px; border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.6); margin-bottom: 5px; cursor: pointer;
            animation: waterPulse 2s infinite ease-in-out; transition: transform 0.2s;
        }
        .water-icon-pure:active { transform: scale(0.92); }
        @keyframes waterPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(0,229,255,0.5); }
            50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(0,229,255,0.9); }
        }
        .water-icon-pure img { width: 100%; height: 100%; object-fit: cover; }

        .gateway-quote {
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: #ffd700;
            line-height: 1.6; text-shadow: 0 0 12px rgba(255, 215, 0, 0.5); padding: 0 10px;
        }
        .gateway-author {
            font-family: 'Chakra Petch', sans-serif; font-size: 13px; color: #00e5ff; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase; margin-top: -10px;
        }
        .gateway-hint {
            font-family: 'Chakra Petch', sans-serif; font-size: 11px; color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px; animation: textBlink 2s infinite ease-in-out; margin-top: 10px;
        }
        @keyframes textBlink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* VIDEO NỀN SÁNG 100% (HIỆN SAU KHI BẤM ICON) */
        #bg-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; opacity: 1.0;
            display: none;
        }
        #bg-video.active { display: block; }

        .decoder-container {
            position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 30px 20px;
        }
        .decoder-container.active { display: flex; }

        .decoder-card {
            width: 100%; max-width: 360px; min-height: 245px;
            background: rgba(5, 11, 20, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(0, 229, 255, 0.4); border-radius: 20px; padding: 20px 18px 12px 18px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 229, 255, 0.15);
            margin-bottom: 12px; position: relative;
        }

        .slide-title {
            font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 900; color: #00e5ff;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; white-space: nowrap;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
        }

        .slide-content {
            font-size: 13px; color: #ffffff; line-height: 1.5; font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); min-height: 110px; display: block; text-align: left; width: 100%;
            word-break: break-word;
        }

        .highlight-cyan { color: #00e5ff; font-weight: 700; }
        .highlight-pink { color: #ff3366; font-weight: 700; }
        .highlight-gold { color: #ffd700; font-weight: 700; }
        .highlight-mint { color: #00ff9d; font-weight: 700; }

        .slide-nav-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 6px;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255,255,255,0.3); color: #fff;
            padding: 5px 14px; border-radius: 8px; font-family: 'Chakra Petch', sans-serif; font-size: 11px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:active { background: rgba(0, 229, 255, 0.4); border-color: #00e5ff; }
        .slide-indicator { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #f48fb1; font-weight: bold; }

        /* NÚT ĐÃ HIỂU Ở CUỐI SLIDE 3 */
        .action-buttons-box {
            display: none; flex-direction: column; gap: 8px; width: 100%; max-width: 360px; z-index: 20;
        }
        .action-buttons-box.active { display: flex; }

        .btn-action-custom {
            width: 100%; padding: 13px; border-radius: 12px; font-family: 'Chakra Petch', sans-serif;
            font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; text-align: center;
            letter-spacing: 1.5px; backdrop-filter: blur(10px); transition: 0.2s;
            background: rgba(0, 229, 255, 0.25); border: 2px solid #00e5ff; color: #00e5ff;
            box-shadow: 0 0 20px rgba(0,229,255,0.4);
        }
        .btn-action-custom:active { background: #00e5ff; color: #050b14; transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- HẠT LƯỢNG TỬ BAY XUYÊN SUỐT TỪ ĐẦU ĐẾN CUỐI -->
    <div id="dust-container"></div>

    <!-- MÀN HÌNH MỞ ĐẦU TRIẾT LÝ (CHỈ CÓ ICON VÀ CÂU THƠ, BẤM VÀO ICON ĐỂ VÀO VIDEO) -->
    <div id="gateway-screen">
        <div class="gateway-content-box">
            <div class="water-icon-pure" onclick="enterMainDecoder()">
                <img src="../../Photo/A THUY.png" alt="Thủy Luân">
            </div>
            <div class="gateway-quote">"Tâm như nước biến hóa vô hình, tĩnh lặng soi chiếu vạn vật."</div>
            <div class="gateway-author">— Miyamoto Musashi</div>
            <div class="gateway-hint">[ CHẠM VÀO ICON THỦY LUÂN ĐỂ KHỞI ĐỘNG ]</div>
        </div>
    </div>

    <!-- VIDEO NỀN SÁNG 100% -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="../../Photo/Video giai ma thuy luan.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop preload="auto">
        <source src="../../Photo/Pixel Dream Circuit.mp3" type="audio/mpeg">
    </audio>

    <div id="main-decoder" class="decoder-container">
        <div id="slide-box" class="decoder-card">
            <div id="slide-title" class="slide-title"></div>
            <div id="slide-content" class="slide-content"></div>
            <div class="slide-nav-row">
                <button class="nav-btn" onclick="prevSlide(event)">⟨ QUAY LẠI</button>
                <span id="slide-counter" class="slide-indicator">1 / 3</span>
                <button class="nav-btn" onclick="nextSlide(event)">TIẾP ⟩</button>
            </div>
        </div>

        <!-- NÚT ĐÃ HIỂU XUẤT HIỆN Ở CUỐI SLIDE 3 -->
        <div id="action-box" class="action-buttons-box">
            <button class="btn-action-custom" onclick="finishDecoder(event)">ĐÃ HIỂU</button>
        </div>
    </div>

    <script>
        // 3 SLIDE VỚI NỘI DUNG SÂU SẮC, TẬN SÁT
        const slides = [
            {
                title: "GIẢI MÃ KHOA HỌC THẦN KINH",
                content: "Mọi quyết định sắc bén đều bắt nguồn từ vùng vỏ não trước trán. Bài test này trực tiếp soi chiếu <span class='highlight-gold'>Trí nhớ làm việc (Working Memory)</span> và <span class='highlight-gold'>Vòng lặp thị giác - không gian</span> — nơi lưu trữ, nhào nặn và định hình mọi thông tin trong từng khoảnh khắc thực tại trước khi hành động."
            },
            {
                title: "GIẢI MÃ NGÔN NGỮ MÁY TÍNH",
                content: "Quy đổi hệ sinh học sang ngôn ngữ máy tính không chỉ để đo đếm, mà để <span class='highlight-cyan'>bóc trần thực trạng tư duy</span>. Nhìn vào dung lượng RAM (bộ nhớ đệm) và tốc độ SSD, bạn sẽ thấy chính xác <span class='highlight-pink'>điểm nghẽn (bottleneck)</span> đang âm thầm bóp nghẹt tiềm năng của mình."
            },
            {
                title: "K-DRIVE VÀ TỐI ƯU HIỆU SUẤT",
                content: "Những phút lướt <span class='highlight-pink'>video ngắn liên tục (TikTok, Reels)</span> đang làm phân mảnh bộ nhớ đệm, bào mòn khả năng tập trung sâu. Việc chẩn đoán điểm nghẽn chỉ là bước đầu; để tái thiết lập hiệu suất đỉnh cao, hãy sẵn sàng bước vào <span class='highlight-mint'>NÂNG CẤP TOÀN DIỆN</span>."
            }
        ];

        let currentIndex = 0;
        let isAudioInitialized = false;

        function initSparkleParticles() {
            let container = document.getElementById('dust-container');
            if(!container) return;
            for(let i=0; i<40; i++) {
                let p = document.createElement('div');
                p.className = 'quantum-sparkle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 3 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function renderSlide() {
            document.getElementById('slide-title').innerText = slides[currentIndex].title;
            document.getElementById('slide-content').innerHTML = slides[currentIndex].content;
            document.getElementById('slide-counter').innerText = (currentIndex + 1) + " / " + slides.length;

            let actionBox = document.getElementById('action-box');
            let slideNav = document.querySelector('.slide-nav-row');

            // Nếu là slide cuối cùng (slide 3), hiển thị nút ĐÃ HIỂU
            if (currentIndex === slides.length - 1) {
                actionBox.classList.add('active');
                slideNav.style.display = 'none';
            } else {
                actionBox.classList.remove('active');
                slideNav.style.display = 'flex';
            }
        }

        function enterMainDecoder() {
            // Kích hoạt âm thanh mượt mà từ cú chạm vào icon
            let music = document.getElementById('bg-music');
            if (music && !isAudioInitialized) {
                isAudioInitialized = true;
                music.volume = 0.0;
                music.play().then(() => {
                    let vol = 0.0;
                    let fadeInterval = setInterval(() => {
                        vol += 0.05;
                        if (vol >= 0.35) {
                            vol = 0.35;
                            clearInterval(fadeInterval);
                        }
                        music.volume = vol;
                    }, 150);
                }).catch(e => {});
            }

            let gateway = document.getElementById('gateway-screen');
            gateway.classList.add('fade-out');

            setTimeout(() => {
                gateway.style.display = 'none';
                document.getElementById('bg-video').classList.add('active');
                document.getElementById('main-decoder').classList.add('active');
                renderSlide();
            }, 800);
        }

        function nextSlide(event) {
            event.stopPropagation();
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                renderSlide();
            }
        }

        function prevSlide(event) {
            event.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide();
            }
        }

        function finishDecoder(event) {
            event.stopPropagation();
            // Bấm "ĐÃ HIỂU" ở cuối slide 3 sẽ chuyển về trang tổng quan hoặc bài test tiếp theo
            window.location.href = '../tong_quan.html';
        }

        window.onload = () => {
            initSparkleParticles();
        };
    </script>
</body>
</html>
