<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050b14">
    <title>K-Drive - Giải Mã Thủy Luân</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050b14; font-family: 'Space Grotesk', sans-serif; }

        /* VIDEO NỀN PHÍA SAU */
        #bg-video {
            position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; opacity: 0.65;
        }

        .decoder-container {
            position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 45px 20px; cursor: pointer;
        }

        /* HỘP POPUP NẰM Ở NỬA DƯỚI MÀN HÌNH (CẠNH TRÊN NẰM CHUẨN 50-50) */
        .decoder-card {
            width: 100%; max-width: 360px; min-height: 240px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0; transform: translateY(15px);
            margin-bottom: 25px;
        }
        .decoder-card.active { opacity: 1; transform: translateY(0); }

        .slide-title {
            font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 900; color: #00e5ff;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; white-space: nowrap;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }

        .slide-content {
            font-size: 14px; color: #ffffff; line-height: 1.6; font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .highlight-cyan { color: #00e5ff; font-weight: 700; }
        .highlight-pink { color: #ff3366; font-weight: 700; }
        .highlight-gold { color: #ffd700; font-weight: 700; }
        .highlight-mint { color: #00ff9d; font-weight: 700; }

        /* KHU VỰC NÚT BẤM Ở SLIDE CUỐI */
        .action-buttons-box {
            display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; margin-bottom: 25px; z-index: 20;
        }
        .action-buttons-box.active { display: flex; animation: cinematicPopup 0.5s ease forwards; }

        @keyframes cinematicPopup {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .btn-action-custom {
            width: 100%; padding: 13px; border-radius: 12px; font-family: 'Chakra Petch', sans-serif;
            font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; text-align: center;
            letter-spacing: 1px; backdrop-filter: blur(10px); transition: 0.2s;
        }
        .btn-action-custom.primary {
            background: rgba(0, 229, 255, 0.25); border: 2px solid #00e5ff; color: #00e5ff;
            box-shadow: 0 0 15px rgba(0,229,255,0.4);
        }
        .btn-action-custom.primary:active { background: #00e5ff; color: #050b14; transform: scale(0.97); }

        .btn-action-custom.secondary {
            background: rgba(255, 51, 102, 0.2); border: 2px solid #ff3366; color: #ff3366;
            box-shadow: 0 0 15px rgba(255,51,102,0.3);
        }
        .btn-action-custom.secondary:active { background: #ff3366; color: #fff; transform: scale(0.97); }

        .tap-instruction {
            font-family: 'Chakra Petch', sans-serif; font-size: 11.5px; color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px; text-shadow: 0 0 8px rgba(0, 0, 0, 0.9); animation: textBlink 2s infinite ease-in-out;
        }
        @keyframes textBlink {
            0%, 100% { opacity: 0.4; } 50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="../../Photo/Video giai ma thuy luan.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop preload="auto">
        <source src="../../Photo/Pixel Dream Circuit.mp3" type="audio/mpeg">
    </audio>

    <div class="decoder-container" onclick="handleScreenClick(event)">
        <!-- HỘP POPUP HIỂN THỊ NỘI DUNG -->
        <div id="slide-box" class="decoder-card"></div>

        <!-- CÁC NÚT HÀNH ĐỘNG Ở SLIDE CUỐI -->
        <div id="action-box" class="action-buttons-box">
            <button class="btn-action-custom primary" onclick="goToNextTest(event)">ĐẾN BÀI TEST PHẢN XẠ</button>
            <button class="btn-action-custom secondary" onclick="replayDecoder(event)">ĐO LẠI (XEM LẠI)</button>
        </div>

        <div id="tap-hint" class="tap-instruction">[ CHẠM MÀN HÌNH ĐỂ ĐỌC TIẾP ]</div>
    </div>

    <script>
        const slides = [
            {
                title: "GIẢI MÃ KHOA HỌC THẦN KINH",
                content: "Đánh giá trực tiếp <span class='highlight-gold'>Trí nhớ làm việc</span> và <span class='highlight-gold'>Vòng lặp thị giác - không gian</span> do <span class='highlight-pink'>vỏ não trước trán</span> quản lý để lưu trữ và thao tác thông tin ngắn hạn."
            },
            {
                title: "GIẢI MÃ NGÔN NGỮ MÁY TÍNH",
                content: "Ánh xạ sinh học: <span class='highlight-cyan'>RAM</span> là bộ nhớ đệm vỏ não trước trán, <span class='highlight-cyan'>SSD</span> là tốc độ hải mã truy xuất kho dài hạn. Mục đích để chỉ rõ <span class='highlight-pink'>điểm nghẽn sinh học</span> và biết cách nâng cấp."
            },
            {
                title: "GIẢI MÃ TRIẾT LÝ VÕ HỌC",
                content: "\"<span class='highlight-gold'>Tâm như nước biến hóa vô hình, tĩnh lặng soi chiếu vạn vật.</span>\" — Miyamoto Musashi.<br><br>Tâm thức phải tĩnh lặng, không xao động để ghi nhận và phản xạ thông tin linh hoạt, sắc bén như dòng nước chảy."
            },
            {
                title: "K-DRIVE VÀ TỐI ƯU HIỆU SUẤT",
                content: "Thói quen lướt <span class='highlight-pink'>video ngắn</span> làm phân mảnh bộ nhớ đệm. Mô-đun này chẩn đoán điểm nghẽn bộ nhớ; để tập luyện nâng cấp toàn diện, hãy truy cập mô-đun <span class='highlight-mint'>NÂNG CẤP TOÀN DIỆN</span>."
            }
        ];

        let currentIndex = 0;
        let isAudioInitialized = false;

        function renderSlide() {
            let box = document.getElementById('slide-box');
            let actionBox = document.getElementById('action-box');
            let tapHint = document.getElementById('tap-hint');

            box.classList.remove('active');

            setTimeout(() => {
                let s = slides[currentIndex];
                box.innerHTML = `
                    <div class="slide-title">${s.title}</div>
                    <div class="slide-content">${s.content}</div>
                `;
                box.classList.add('active');

                // Nếu là slide cuối cùng (slide 4), ẩn chữ chạm để đọc tiếp và hiện 2 nút hành động
                if (currentIndex === slides.length - 1) {
                    tapHint.style.display = 'none';
                    actionBox.classList.add('active');
                } else {
                    tapHint.style.display = 'block';
                    actionBox.classList.remove('active');
                }
            }, 200);
        }

        function startSmoothAudio() {
            if (isAudioInitialized) return;
            isAudioInitialized = true;

            let music = document.getElementById('bg-music');
            if (music) {
                music.volume = 0.0;
                music.play().then(() => {
                    let vol = 0.0;
                    let fadeInterval = setInterval(() => {
                        vol += 0.05;
                        if (vol >= 0.35) {
                            vol = 0.35;
                            clearInterval(fadeInterval);
                        }
                        music.volume = vol;
                    }, 150);
                }).catch(e => {});
            }
        }

        function handleScreenClick(event) {
            startSmoothAudio();
            // Nếu đang ở slide cuối thì không chuyển slide bằng cách chạm màn hình nữa để người dùng bấm nút
            if (currentIndex >= slides.length - 1) return;

            currentIndex++;
            renderSlide();
        }

        function goToNextTest(event) {
            event.stopPropagation();
            // Chuyển sang bài test phản xạ tiếp theo (ví dụ: TestHoaLuan.html nằm ở thư mục ngoài)
            window.location.href = '../TestHoaLuan.html';
        }

        function replayDecoder(event) {
            event.stopPropagation();
            currentIndex = 0;
            renderSlide();
        }

        window.onload = () => {
            renderSlide();
            ['touchstart', 'mousedown', 'keydown'].forEach(evt => {
                window.addEventListener(evt, startSmoothAudio, { once: true, passive: true });
            });
        };
    </script>
</body>
</html>
