<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>K-Drive: Hệ Thống Lực Chiến</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: transparent; font-family: 'Space Grotesk', sans-serif; color: #fff; }

        /* --- VIDEO NỀN BACKGROUND - RÕ NÉT 100%, KHÔNG LÀM MỜ --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            opacity: 1; /* Sáng rõ 100% */
            pointer-events: none;
        }

        /* --- KHUNG CHỨA TỔNG THỂ --- */
        #content-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px; 
            z-index: 10;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- TIÊU ĐỀ TRANG (TREO CAO Ở TRÊN) --- */
        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ff2a2a;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 42, 42, 0.8), 0 0 5px #fff;
            margin-bottom: 25px;
            z-index: 10;
        }

        /* --- BẢNG THÔNG SỐ (KIỂM ĐIỂM NGŨ LUÂN) - HẠ THẤP XUỐNG --- */
        .stats-card {
            width: 90%;
            max-width: 380px;
            /* Đẩy hộp xuống dưới để lộ phần đầu & ngực Samurai */
            margin-top: 25vh; 
            background: rgba(10, 14, 20, 0.4); /* Rất mờ để thấy video xuyên thấu */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 42, 42, 0.4);
            border-radius: 12px;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 42, 42, 0.15);
        }

        /* TẦNG 1: SCI TỐI CAO */
        .sci-header {
            text-align: center;
            margin-bottom: 8px;
        }
        .sci-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            color: #a0a0a0;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .sci-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 38px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 5px #00e5ff;
        }

        /* TẦNG 2: TỨ LUÂN (THANH NĂNG LƯỢNG) */
        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }
        
        /* Xử lý Icon cắt viền trong suốt bị thừa */
        .icon-wrap {
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        .icon-wrap img {
            width: 220%; /* Phóng to để lấp đầy viền trong suốt thừa */
            height: 220%;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }

        .stat-score {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        /* Cấu trúc thanh vạch đứt đoạn (Segmented Bar) */
        .stat-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            /* Tạo hiệu ứng vạch đứt đoạn */
            mask-image: repeating-linear-gradient(to right, black 0, black 15px, transparent 15px, transparent 18px);
            -webkit-mask-image: repeating-linear-gradient(to right, black 0, black 15px, transparent 15px, transparent 18px);
        }
        .stat-bar-fill {
            height: 100%;
            transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Cấu hình màu Tứ Luân */
        .fill-dia { background: linear-gradient(90deg, #d4af37, #ffe066); box-shadow: 0 0 8px #ffe066; }
        .fill-thuy { background: linear-gradient(90deg, #0055ff, #00aaff); box-shadow: 0 0 8px #00aaff; }
        .fill-hoa { background: linear-gradient(90deg, #cc0000, #ff4d4d); box-shadow: 0 0 8px #ff4d4d; }
        .fill-phong { background: linear-gradient(90deg, #cccccc, #ffffff); box-shadow: 0 0 10px #ffffff; }

        /* TẦNG 3: CẢNH GIỚI VÔ NGÃ (HỘP ẢNH TÙY CHỈNH) */
        .mushi-box-wrapper {
            position: relative;
            width: 100%;
            height: 40px; /* Chiều cao cố định của hộp Vô Ngã */
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }
        /* Phóng to ảnh Mushi để bù lại khoảng padding thừa */
        .mushi-box-wrapper img.mushi-bg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6); /* Căn chỉnh tỷ lệ crop tại đây */
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: -1;
            pointer-events: none;
        }

        .vo-nga-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ff2a2a;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.8);
        }
        .vo-nga-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            animation: pulseVoNga 2s infinite alternate;
        }
        @keyframes pulseVoNga {
            from { opacity: 0.8; filter: brightness(1); }
            to { opacity: 1; filter: brightness(1.3); }
        }

        /* --- NÚT TRỞ VỀ LÕI (ĐẨY LÊN CHỪA CHỖ CHO BOO PLAYER) --- */
        .btn-back {
            position: absolute;
            bottom: 120px; /* Chừa không gian rộng 120px ở đáy */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00e5ff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            padding: 12px 35px;
            border-radius: 6px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            z-index: 15;
            white-space: nowrap; /* Chữ nằm ngang 1 dòng */
        }

        .btn-back:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN RÕ NÉT - TỐC ĐỘ GỐC -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://github.com/happyk1900/-m-thanh-app/raw/refs/heads/main/VIDEO%20LUC%20CHIEN.mp4" type="video/mp4">
    </video>

    <!-- KHUNG NỘI DUNG CHÍNH -->
    <div id="content-wrapper">
        <div class="page-title">LỰC CHIẾN</div>
        
        <!-- BẢNG KIỂM ĐIỂM CHỈ SỐ -->
        <div class="stats-card">
            
            <!-- Tầng 1: Tối cao -->
            <div class="sci-header">
                <div class="sci-label">CHỈ SỐ ĐẠO TRƯỜNG TOÀN DIỆN</div>
                <div class="sci-value">SCI: 85.00</div>
            </div>

            <!-- Tầng 2: Tứ Luân -->
            <div class="stat-group">
                <div class="stat-info">
                    <div class="stat-name">
                        <div class="icon-wrap"><img src="https://github.com/happyk1900/-m-thanh-app/blob/main/A%20DIA.png?raw=true" alt="Dia"></div>
                        <span>SỨC MẠNH (ĐỊA)</span>
                    </div>
                    <div class="stat-score">80/100</div>
                </div>
                <div class="stat-bar-container"><div class="stat-bar-fill fill-dia" style="width: 80%;"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-info">
                    <div class="stat-name">
                        <div class="icon-wrap"><img src="https://github.com/happyk1900/-m-thanh-app/blob/main/A%20THUY.png?raw=true" alt="Thuy"></div>
                        <span>TRÍ NHỚ (THỦY)</span>
                    </div>
                    <div class="stat-score">85/100</div>
                </div>
                <div class="stat-bar-container"><div class="stat-bar-fill fill-thuy" style="width: 85%;"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-info">
                    <div class="stat-name">
                        <div class="icon-wrap"><img src="https://github.com/happyk1900/-m-thanh-app/blob/main/A%20HOA.png?raw=true" alt="Hoa"></div>
                        <span>PHẢN XẠ (HỎA)</span>
                    </div>
                    <div class="stat-score">95/100</div>
                </div>
                <div class="stat-bar-container"><div class="stat-bar-fill fill-hoa" style="width: 95%;"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-info">
                    <div class="stat-name">
                        <div class="icon-wrap"><img src="https://github.com/happyk1900/-m-thanh-app/blob/main/A%20PHONG.png?raw=true" alt="Phong"></div>
                        <span>PHÁN ĐOÁN (PHONG)</span>
                    </div>
                    <div class="stat-score">90/100</div>
                </div>
                <div class="stat-bar-container"><div class="stat-bar-fill fill-phong" style="width: 90%;"></div></div>
            </div>

            <!-- Tầng 3: Cảnh giới Vô Ngã (Dùng Background Box Ảnh) -->
            <div class="mushi-box-wrapper">
                <img class="mushi-bg" src="https://github.com/happyk1900/-m-thanh-app/blob/main/A%20MUSHI.png?raw=true" alt="Mushi Box">
                <span class="vo-nga-label">CẢNH GIỚI VÔ NGÃ</span>
                <span class="vo-nga-value">1000 NGÀY</span>
            </div>

        </div>
    </div>

    <!-- NÚT TRỞ VỀ LÕI (Chừa 120px dưới đáy) -->
    <button class="btn-back" onclick="window.location.href='core new_5.html'">[ TRỞ VỀ LÕI ]</button>

</body>
</html>
